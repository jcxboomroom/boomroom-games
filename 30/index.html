<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0b1e" />
  <title>爆爆五子棋：極限連珠</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand"><span>✳</span> BOOM<span style="color:#fff;">ROOM</span> 五子棋</div>
      <div class="player-counter" id="playerCounter">👥 1/10 人</div>
    </header>

    <section class="status-bar">
      <div class="turn-indicator">
        <div class="stone-badge black" id="turnStone"></div>
        <span id="turnText">黑子（黑棋先行）落子中</span>
      </div>
      <div class="match-score" id="matchScore">黑 0 : 0 白</div>
      <div class="move-count" id="moveCount">第 0 步</div>
    </section>

    <section class="ai-difficulty-bar" id="aiDifficultyBar">
      <span style="font-size:11px;color:var(--text-muted);font-weight:800;">AI 難度:</span>
      <button class="diff-btn" id="diffEasy" type="button" data-diff="easy">🌱 簡單</button>
      <button class="diff-btn active" id="diffNormal" type="button" data-diff="normal">⚔️ 中等</button>
      <button class="diff-btn" id="diffMaster" type="button" data-diff="master">👑 大師</button>
    </section>

    <section class="board-container">
      <canvas id="boardCanvas"></canvas>
    </section>

    <section class="action-toolbar">
      <button class="tool-btn" id="btnHint" type="button">💡 提示</button>
      <button class="tool-btn" id="btnUndo" type="button">↩️ 悔棋</button>
      <button class="tool-btn danger" id="btnResign" type="button">🏳️ 認輸</button>
      <button class="tool-btn" id="btnRestart" type="button">🔄 重來</button>
    </section>

    <footer class="footer-notice">
      <div class="notice-box" id="autoStartNotice">⏱️ 房間人數 1/1，準備自動開始...</div>
      <div class="roster-list" id="rosterList"></div>
    </footer>

    <!-- 結算對話框 -->
    <div class="overlay hidden" id="resultOverlay">
      <div class="result-card">
        <div class="result-title" id="resultTitle">🏆 獲勝！</div>
        <div class="result-subtitle" id="resultSubtitle">完成五子連珠絕殺！</div>
        <div class="result-reward" id="resultReward">+100 銀幣</div>
        <div class="auto-close-hint">3 秒後自動返回房間...</div>
      </div>
    </div>

    <!-- 請求對話框 (悔棋 / 重開請求) -->
    <div class="overlay hidden" id="confirmOverlay">
      <div class="result-card">
        <div class="result-title" id="confirmTitle">💬 收到對手請求</div>
        <div class="result-subtitle" id="confirmMsg">對手申請悔棋，是否同意？</div>
        <div style="display:flex;gap:12px;margin-top:16px;">
          <button class="tool-btn danger" id="btnConfirmRefuse" style="flex:1;padding:12px;font-size:14px;" type="button">✖ 拒絕</button>
          <button class="tool-btn" id="btnConfirmAccept" style="flex:1;padding:12px;font-size:14px;background:#4ee08a;color:#000;" type="button">✔ 同意</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
