<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>霓虹骰子戰</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --neon-cyan: #66fcf1;
            --neon-cyan-dim: #45a29e;
            --neon-pink: #ff00ff;
            --neon-yellow: #fce300;
            --text-main: #c5c6c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Orbitron', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100dvh; /* Mobile WebView fix */
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Header & History */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: linear-gradient(180deg, #111, transparent);
            border-bottom: 1px solid var(--neon-cyan-dim);
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.2);
            z-index: 10;
        }

        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background-color: var(--neon-pink); border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan); display: flex;
            justify-content: center; align-items: center; font-weight: bold; color: #fff; font-size: 20px;
        }
        .username { font-size: 14px; font-weight: bold; color: var(--neon-cyan); text-shadow: 0 0 5px var(--neon-cyan); }
        .host-badge {
            font-size: 10px; background: var(--neon-pink); color: #fff;
            padding: 2px 6px; border-radius: 4px; margin-top: 2px; display: inline-block;
        }

        .history-board { display: flex; gap: 5px; align-items: center; }
        .history-dot {
            width: 20px; height: 20px; border-radius: 50%; display: flex;
            justify-content: center; align-items: center; font-size: 12px; font-weight: bold; color: #000;
            box-shadow: 0 0 5px rgba(255,255,255,0.5);
        }
        .dot-S { background: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan); }
        .dot-B { background: #ff3333; box-shadow: 0 0 8px #ff3333; color: white; }
        .dot-T { background: var(--neon-yellow); box-shadow: 0 0 10px var(--neon-yellow); }

        /* Game Area */
        .game-area {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
            touch-action: none; /* Prevent swipe gestures in game area */
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        canvas { 
            width: 100%; max-width: 400px; height: 200px; 
            filter: drop-shadow(0 0 10px rgba(102, 252, 241, 0.5)); z-index: 2; 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        
        #particleCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; filter: none; transform: none;
        }

        .status-text {
            position: absolute; top: 15%;
            font-size: 22px; font-weight: 900; color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow); height: 28px; letter-spacing: 1px; z-index: 2;
        }

        /* Timer Bar */
        .timer-container {
            position: absolute; bottom: 25%;
            width: 80%; height: 6px; background: #222; border-radius: 3px; overflow: hidden;
            box-shadow: inset 0 0 5px #000; opacity: 0; transition: opacity 0.3s; z-index: 2;
        }
        .timer-fill {
            height: 100%; width: 100%; background: var(--neon-yellow);
            box-shadow: 0 0 10px var(--neon-yellow);
        }
        .timer-fill.danger { background: #ff3333; box-shadow: 0 0 10px #ff3333; }

        /* Emote System */
        .emote-bar {
            position: absolute; left: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 10px; z-index: 10;
        }
        .emote-btn {
            background: rgba(0,0,0,0.6); border: 1px solid var(--neon-cyan-dim); border-radius: 50%;
            width: 40px; height: 40px; font-size: 20px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: transform 0.1s;
        }
        .emote-btn:active { transform: scale(0.8); }
        .floating-emote {
            position: absolute; font-size: 30px; pointer-events: none; z-index: 50;
            animation: floatUp 2s ease-out forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { transform: translateY(-20px) scale(1.2); opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        /* Betting Area */
        .betting-area {
            padding: 15px; background: var(--panel-bg); border-top: 2px solid var(--neon-pink);
            box-shadow: 0 -5px 15px rgba(255, 0, 255, 0.2); display: flex; flex-direction: column; gap: 15px; z-index: 10;
        }
        .bet-options { display: flex; justify-content: space-between; gap: 10px; }
        .bet-btn {
            flex: 1; background: transparent; border: 2px solid var(--neon-cyan-dim); color: var(--neon-cyan);
            padding: 15px 5px; border-radius: 8px; font-family: inherit; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .bet-btn span { font-size: 12px; color: var(--text-main); font-family: 'Orbitron', sans-serif; }
        .bet-btn.active {
            border-color: var(--neon-cyan); background: rgba(102, 252, 241, 0.1);
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.5), inset 0 0 10px rgba(102, 252, 241, 0.3); text-shadow: 0 0 5px var(--neon-cyan);
        }
        .bet-btn.triple { border-color: var(--neon-pink); color: var(--neon-pink); }
        .bet-btn.triple.active {
            background: rgba(255, 0, 255, 0.1); box-shadow: 0 0 15px rgba(255, 0, 255, 0.5), inset 0 0 10px rgba(255, 0, 255, 0.3); text-shadow: 0 0 5px var(--neon-pink);
        }

        .amount-selector { display: flex; justify-content: center; gap: 10px; }
        .amt-btn {
            background: #111; border: 1px solid #444; color: #888; padding: 8px 15px; border-radius: 20px;
            font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: bold; cursor: pointer;
        }
        .amt-btn.active { border-color: var(--neon-yellow); color: var(--neon-yellow); box-shadow: 0 0 10px rgba(252, 227, 0, 0.4); }

        .action-btn {
            width: 100%; padding: 15px; background: linear-gradient(90deg, #ff00ff, #66fcf1); border: none; border-radius: 8px;
            color: #000; font-family: inherit; font-weight: 900; font-size: 18px; cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5); transition: transform 0.1s; letter-spacing: 1px;
        }
        .action-btn:active { transform: scale(0.98); }
        .action-btn:disabled { background: #333; color: #888; box-shadow: none; cursor: not-allowed; }

        /* Social Feed */
        .social-feed {
            position: absolute; top: 10px; right: 10px; width: 160px; max-height: 120px; overflow-y: auto;
            pointer-events: none; display: flex; flex-direction: column; gap: 5px; font-size: 11px; font-weight: bold; z-index: 10;
        }
        .feed-item {
            background: rgba(0, 0, 0, 0.7); border-left: 2px solid var(--neon-cyan); padding: 5px 8px;
            border-radius: 0 4px 4px 0; animation: slideIn 0.3s ease-out; text-shadow: 0 0 2px #000;
        }
        .feed-item.win { border-color: var(--neon-yellow); color: var(--neon-yellow); }
        .feed-item.lose { border-color: #ff3333; color: #ff3333; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Overlays */
        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(11, 12, 16, 0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px);
        }
        .claim-btn {
            background: transparent; border: 2px solid var(--neon-yellow); color: var(--neon-yellow);
            padding: 15px 30px; font-size: 20px; font-weight: bold; font-family: inherit; border-radius: 8px;
            box-shadow: 0 0 20px rgba(252, 227, 0, 0.5); cursor: pointer; animation: pulse 1.5s infinite; letter-spacing: 2px;
        }
        @keyframes pulse { 0% { box-shadow: 0 0 10px rgba(252, 227, 0, 0.5); } 50% { box-shadow: 0 0 30px rgba(252, 227, 0, 1); } 100% { box-shadow: 0 0 10px rgba(252, 227, 0, 0.5); } }
        .hidden { display: none !important; }

    </style>
</head>
<body>

    <header>
        <div class="user-info">
            <div class="avatar" id="user-avatar">?</div>
            <div>
                <div class="username" id="user-name">玩家</div>
                <div class="host-badge hidden" id="host-badge">房主</div>
            </div>
        </div>
        <div class="history-board" id="history-board"></div>
    </header>

    <div class="game-area" id="game-area">
        <canvas id="diceCanvas"></canvas>
        <canvas id="particleCanvas"></canvas>
        <div class="status-text" id="status-text">等待開局</div>
        
        <div class="timer-container" id="timer-container">
            <div class="timer-fill" id="timer-fill"></div>
        </div>

        <div class="social-feed" id="social-feed"></div>

        <div class="emote-bar">
            <button class="emote-btn" onclick="sendEmote('💸')">💸</button>
            <button class="emote-btn" onclick="sendEmote('😎')">😎</button>
            <button class="emote-btn" onclick="sendEmote('🤬')">🤬</button>
        </div>
    </div>

    <div class="betting-area">
        <div class="bet-options">
            <button class="bet-btn" data-type="small">押 小 (4-10)<span>賠率 1 : 2</span></button>
            <button class="bet-btn triple" data-type="triple">任意豹子<span>賠率 1 : 24</span></button>
            <button class="bet-btn" data-type="big">押 大 (11-17)<span>賠率 1 : 2</span></button>
        </div>

        <div class="amount-selector">
            <button class="amt-btn active" data-amt="100">100</button>
            <button class="amt-btn" data-amt="500">500</button>
            <button class="amt-btn" data-amt="1000">1000</button>
            <button class="amt-btn" data-amt="5000">5000</button>
        </div>

        <button class="action-btn" id="action-btn">請選擇下注項目</button>
    </div>

    <div id="host-overlay" class="overlay">
        <h2 style="color:var(--neon-cyan); margin-bottom: 20px; text-shadow: 0 0 10px var(--neon-cyan); font-family:'Orbitron', sans-serif; font-size: 28px;">NEON DICE BATTLE</h2>
        <button class="claim-btn" id="claim-host-btn">開始遊戲 (成為房主)</button>
        <p style="margin-top: 15px; font-size: 13px; color: #aaa;">第一位點擊開始的玩家將掌控遊戲節奏</p>
    </div>

    <script>
        // ==========================================
        // 1. CONFIG & BOOMROOM SDK INITIALIZATION
        // ==========================================
        const GAME_INFO = {
            category: "派對競技",
            name: "霓虹骰子戰",
            description: "極速賽博龐克骰寶，押中豹子贏得24倍獎金！",
            entryCost: 0, // Dynamic based on bet
            maxPlayers: 20,
            controlModes: ["Touch"]
        };

        if (!window.BoomRoomSDK) {
            window.BoomRoomSDK = {
                getUser: () => ({ id: 'u' + Math.floor(Math.random() * 10000), username: '賭神' + Math.floor(Math.random() * 100), avatar: '' }),
                requestPurchase: (itemId, cost) => { setTimeout(() => { if (window.onPurchaseSuccess) window.onPurchaseSuccess(itemId); }, 300); },
                gameOver: (winAmount) => { console.log(`[SDK] 結算金額: ${winAmount}`); },
                sendGameEvent: (eventName, payloadObj) => {
                    window.postMessage(JSON.stringify({ action: "gameEventReceived", userId: window.BoomRoomSDK.getUser().id, eventName, payload: payloadObj }), "*");
                }
            };
        }

        const user = window.BoomRoomSDK.getUser();
        document.getElementById('user-name').innerText = user.username;
        document.getElementById('user-avatar').innerText = user.username.charAt(0).toUpperCase();

        // ==========================================
        // 2. GAME STATE & ANTI-EXPLOIT VARIABLES
        // ==========================================
        let isHost = false;
        let gameState = 'WAITING'; // WAITING, BETTING, ROLLING, RESULT
        let currentRoundId = null;
        
        // Anti-Exploit Locks
        let isPurchasing = false;
        let gameOverCalled = false;

        let currentBetAmount = 100;
        let selectedBetType = null;
        let myCurrentBet = null; 
        
        let diceValues = [1, 2, 3];
        let history = []; 
        const betTypeNames = { 'small': '小', 'triple': '豹子', 'big': '大' };

        // ==========================================
        // 3. AUDIO SYSTEM (Web Audio API)
        // ==========================================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        let audioUnlocked = false;

        function unlockAudio() {
            if (!audioUnlocked) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                audioUnlocked = true;
            }
        }
        document.body.addEventListener('pointerdown', unlockAudio, { once: true });

        function playTone(freq, type, duration, vol) {
            if (audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        const sfx = {
            select: () => playTone(800, 'sine', 0.1, 0.3),
            bet: () => playTone(1200, 'square', 0.15, 0.4),
            rollTick: () => playTone(200 + Math.random()*100, 'sawtooth', 0.05, 0.1),
            tick: () => playTone(1000, 'sine', 0.05, 0.3),
            boom: () => playTone(100, 'sawtooth', 0.5, 0.8),
            win: () => {
                playTone(400, 'square', 0.1, 0.5);
                setTimeout(() => playTone(600, 'square', 0.1, 0.5), 100);
                setTimeout(() => playTone(800, 'square', 0.3, 0.5), 200);
                setTimeout(() => playTone(1200, 'square', 0.5, 0.5), 300);
            },
            lose: () => {
                playTone(200, 'sawtooth', 0.3, 0.5);
                setTimeout(() => playTone(150, 'sawtooth', 0.4, 0.5), 200);
            }
        };

        // ==========================================
        // 4. CANVAS RENDERER & OBJECT POOL
        // ==========================================
        const canvas = document.getElementById('diceCanvas');
        const ctx = canvas.getContext('2d');
        const pCanvas = document.getElementById('particleCanvas');
        const pCtx = pCanvas.getContext('2d');

        // Handle High DPI displays (Clamp to 2 for performance)
        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = 400 * dpr;
            canvas.height = 200 * dpr;
            ctx.scale(dpr, dpr);
            
            pCanvas.width = pCanvas.clientWidth * dpr;
            pCanvas.height = pCanvas.clientHeight * dpr;
            pCtx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Object Pool for Particles
        const MAX_PARTICLES = 100;
        const particles = [];
        for(let i=0; i<MAX_PARTICLES; i++) {
            particles.push({ active: false, x:0, y:0, vx:0, vy:0, life:0, maxLife:1, color:'' });
        }

        function spawnWinParticles() {
            const colors = ['#66fcf1', '#ff00ff', '#fce300'];
            let spawned = 0;
            for(let i=0; i<MAX_PARTICLES; i++) {
                if(!particles[i].active) {
                    let p = particles[i];
                    p.active = true;
                    p.x = pCanvas.clientWidth / 2;
                    p.y = pCanvas.clientHeight / 2;
                    let angle = Math.random() * Math.PI * 2;
                    let speed = Math.random() * 300 + 100;
                    p.vx = Math.cos(angle) * speed;
                    p.vy = Math.sin(angle) * speed;
                    p.life = Math.random() * 0.5 + 0.5;
                    p.maxLife = p.life;
                    p.color = colors[Math.floor(Math.random() * colors.length)];
                    spawned++;
                    if(spawned > 50) break; // Spawn 50 per win
                }
            }
        }

        function drawDice(x, y, size, value, color) {
            ctx.beginPath(); ctx.roundRect(x, y, size, size, 10);
            ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.shadowColor = color; ctx.shadowBlur = 15; ctx.stroke();
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fill(); ctx.shadowBlur = 0;
            
            const center = size / 2, offset = size * 0.25;
            ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 10;
            const drawDot = (dx, dy) => { ctx.beginPath(); ctx.arc(x+dx, y+dy, 6, 0, Math.PI*2); ctx.fill(); };
            
            if (value % 2 !== 0) drawDot(center, center);
            if (value > 1) { drawDot(offset, offset); drawDot(size - offset, size - offset); }
            if (value > 3) { drawDot(offset, size - offset); drawDot(size - offset, offset); }
            if (value === 6) { drawDot(offset, center); drawDot(size - offset, center); }
            ctx.shadowBlur = 0;
        }

        // ==========================================
        // 5. MAIN GAME LOOP (requestAnimationFrame)
        // ==========================================
        let lastTime = 0;
        let rollTimer = 0;
        let betTimer = 0;
        const BET_DURATION = 10; // 10 seconds

        function gameLoop(timestamp) {
            let dt = (timestamp - lastTime) / 1000;
            if (dt > 0.033) dt = 0.033; // Clamp dt to 30fps equivalent
            lastTime = timestamp;

            // Update Logic
            if (gameState === 'ROLLING') {
                rollTimer += dt;
                if (rollTimer > 0.05) { // Change dice every 50ms
                    diceValues = [Math.floor(Math.random()*6)+1, Math.floor(Math.random()*6)+1, Math.floor(Math.random()*6)+1];
                    sfx.rollTick();
                    rollTimer = 0;
                }
            } else if (gameState === 'BETTING') {
                betTimer -= dt;
                if (betTimer < 0) betTimer = 0;
                
                // Update Timer UI
                const timerFill = document.getElementById('timer-fill');
                const pct = (betTimer / BET_DURATION) * 100;
                timerFill.style.width = `${pct}%`;
                
                if (betTimer <= 3 && !timerFill.classList.contains('danger')) {
                    timerFill.classList.add('danger');
                }
                
                // Tick sound every second
                if (Math.floor(betTimer) < Math.floor(betTimer + dt) && betTimer > 0 && betTimer <= 3) {
                    sfx.tick();
                }

                // Host auto-rolls when time is up
                if (betTimer <= 0 && isHost) {
                    executeRoll();
                }
            }

            // Render Dice
            ctx.clearRect(0, 0, 400, 200);
            const diceSize = 80, gap = 30;
            const startX = (400 - (diceSize * 3 + gap * 2)) / 2;
            const startY = (200 - diceSize) / 2;
            const colors = ['#66fcf1', '#ff00ff', '#fce300'];
            for (let i = 0; i < 3; i++) drawDice(startX + i * (diceSize + gap), startY, diceSize, diceValues[i], colors[i]);

            // Render Particles
            pCtx.clearRect(0, 0, pCanvas.clientWidth, pCanvas.clientHeight);
            for(let i=0; i<MAX_PARTICLES; i++) {
                let p = particles[i];
                if(p.active) {
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.life -= dt;
                    if(p.life <= 0) { p.active = false; continue; }
                    
                    pCtx.globalAlpha = p.life / p.maxLife;
                    pCtx.fillStyle = p.color;
                    pCtx.beginPath();
                    pCtx.arc(p.x, p.y, 4, 0, Math.PI*2);
                    pCtx.fill();
                }
            }
            pCtx.globalAlpha = 1;

            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);

        // ==========================================
        // 6. UI INTERACTIONS
        // ==========================================
        const betBtns = document.querySelectorAll('.bet-btn');
        const amtBtns = document.querySelectorAll('.amt-btn');
        const actionBtn = document.getElementById('action-btn');
        const statusText = document.getElementById('status-text');
        const socialFeed = document.getElementById('social-feed');
        const timerContainer = document.getElementById('timer-container');
        const gameArea = document.getElementById('game-area');

        betBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (gameState !== 'BETTING' || isPurchasing || myCurrentBet) return;
                sfx.select(); betBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active'); selectedBetType = btn.dataset.type; updateActionBtn();
            });
        });

        amtBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (gameState !== 'BETTING' || isPurchasing || myCurrentBet) return;
                sfx.select(); amtBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active'); currentBetAmount = parseInt(btn.dataset.amt); updateActionBtn();
            });
        });

        function updateActionBtn() {
            if (gameState === 'BETTING') {
                if (isPurchasing) { actionBtn.innerText = "處理中..."; actionBtn.disabled = true; }
                else if (myCurrentBet) { actionBtn.innerText = "下注成功，等待開獎..."; actionBtn.disabled = true; }
                else if (selectedBetType) { actionBtn.innerText = `確認下注 ${currentBetAmount} 於 [${betTypeNames[selectedBetType]}]`; actionBtn.disabled = false; }
                else { actionBtn.innerText = "請選擇下注項目"; actionBtn.disabled = true; }
            } else if (gameState === 'WAITING' && isHost) { actionBtn.innerText = "開始新局"; actionBtn.disabled = false; }
            else if (gameState === 'WAITING' && !isHost) { actionBtn.innerText = "等待房主開始..."; actionBtn.disabled = true; }
            else { actionBtn.disabled = true; }
        }

        function addFeedItem(text, type = 'normal') {
            const div = document.createElement('div'); div.className = `feed-item ${type}`; div.innerText = text;
            socialFeed.appendChild(div); socialFeed.scrollTop = socialFeed.scrollHeight;
            setTimeout(() => { if(div.parentNode) div.parentNode.removeChild(div); }, 4000);
        }

        function updateHistory(resultType) {
            let char = resultType === 'small' ? '小' : (resultType === 'big' ? '大' : '豹');
            let cls = resultType === 'small' ? 'dot-S' : (resultType === 'big' ? 'dot-B' : 'dot-T');
            history.push({char, cls});
            if(history.length > 6) history.shift();
            
            const historyBoard = document.getElementById('history-board');
            historyBoard.innerHTML = '';
            history.forEach(h => {
                const dot = document.createElement('div');
                dot.className = `history-dot ${h.cls}`;
                dot.innerText = h.char;
                historyBoard.appendChild(dot);
            });
        }

        window.sendEmote = function(emoji) {
            if(!currentRoundId) return;
            window.BoomRoomSDK.sendGameEvent("PLAYER_EMOTE", { roundId: currentRoundId, emoji: emoji });
        }

        function spawnFloatingEmote(emoji, xPos) {
            const el = document.createElement('div');
            el.className = 'floating-emote';
            el.innerText = emoji;
            el.style.left = `${xPos}%`;
            el.style.bottom = '20%';
            gameArea.appendChild(el);
            setTimeout(() => { if(el.parentNode) el.parentNode.removeChild(el); }, 2000);
        }

        // ==========================================
        // 7. CORE GAME LOGIC & SDK INTEGRATION
        // ==========================================
        window.onPurchaseSuccess = function(itemId) {
            isPurchasing = false;
            if (itemId.startsWith("bet_")) {
                sfx.bet(); myCurrentBet = { type: selectedBetType, amount: currentBetAmount };
                updateActionBtn(); statusText.innerText = "下注成功！";
                window.BoomRoomSDK.sendGameEvent("PLAYER_BET", { roundId: currentRoundId, username: user.username, type: selectedBetType, amount: currentBetAmount });
            }
        };

        window.onPurchaseFailed = function(itemId) {
            isPurchasing = false;
            statusText.innerText = "下注失敗 / 餘額不足"; statusText.style.color = "#ff3333";
            setTimeout(() => { if(gameState === 'BETTING') { statusText.innerText = "請下注！"; statusText.style.color = "var(--neon-yellow)"; } }, 2000);
            updateActionBtn();
        };

        actionBtn.addEventListener('click', () => {
            if (gameState === 'BETTING' && selectedBetType && !myCurrentBet && !isPurchasing) {
                isPurchasing = true;
                updateActionBtn();
                window.BoomRoomSDK.requestPurchase(`bet_${currentBetAmount}_${selectedBetType}`, currentBetAmount);
            } else if (gameState === 'WAITING' && isHost) {
                currentRoundId = Date.now().toString(); // Generate unique round ID
                window.BoomRoomSDK.sendGameEvent("ROUND_START", { roundId: currentRoundId });
            }
        });

        document.getElementById('claim-host-btn').addEventListener('click', () => {
            document.getElementById('host-overlay').classList.add('hidden');
            isHost = true; document.getElementById('host-badge').classList.remove('hidden');
            window.BoomRoomSDK.sendGameEvent("HOST_CLAIMED", { username: user.username });
            setGameState('WAITING');
        });

        function executeRoll() {
            if(gameState !== 'BETTING') return;
            window.BoomRoomSDK.sendGameEvent("ROLL_START", { roundId: currentRoundId });
            setTimeout(() => {
                const d1 = Math.floor(Math.random() * 6) + 1;
                const d2 = Math.floor(Math.random() * 6) + 1;
                const d3 = Math.floor(Math.random() * 6) + 1;
                window.BoomRoomSDK.sendGameEvent("ROLL_RESULT", { roundId: currentRoundId, dice: [d1, d2, d3] });
            }, 2000);
        }

        function setGameState(state) {
            gameState = state;
            if (state === 'WAITING') {
                myCurrentBet = null; selectedBetType = null; isPurchasing = false; gameOverCalled = false;
                betBtns.forEach(b => b.classList.remove('active'));
                timerContainer.style.opacity = 0;
                document.getElementById('timer-fill').classList.remove('danger');
                statusText.innerText = isHost ? "準備就緒，請開局" : "等待房主開局..."; statusText.style.color = "var(--neon-cyan)";
            } else if (state === 'BETTING') {
                betTimer = BET_DURATION;
                timerContainer.style.opacity = 1;
                statusText.innerText = "請下注！"; statusText.style.color = "var(--neon-yellow)";
            } else if (state === 'ROLLING') {
                timerContainer.style.opacity = 0;
                statusText.innerText = "停止下注！"; statusText.style.color = "var(--neon-pink)";
                actionBtn.innerText = "擲骰中..."; actionBtn.disabled = true;
            }
            updateActionBtn();
        }

        function triggerGameOver(amount) {
            if (gameOverCalled) return;
            gameOverCalled = true;
            let safeAmount = Number.isFinite(amount) ? Math.max(0, amount) : 0;
            window.BoomRoomSDK.gameOver(safeAmount);
        }

        function calculateResult(dice) {
            const total = dice[0] + dice[1] + dice[2];
            const isTriple = (dice[0] === dice[1] && dice[1] === dice[2]);
            let winningType = isTriple ? 'triple' : (total <= 10 ? 'small' : 'big');

            sfx.boom();
            gameArea.classList.add('shake');
            setTimeout(() => gameArea.classList.remove('shake'), 400);

            updateHistory(winningType);
            statusText.innerText = `總和: ${total} ${isTriple ? '(豹子！)' : ''}`;

            if (myCurrentBet) {
                if (myCurrentBet.type === winningType) {
                    let winAmount = myCurrentBet.amount * (winningType === 'triple' ? 24 : 2);
                    sfx.win(); 
                    spawnWinParticles();
                    statusText.innerText += ` - 贏得 ${winAmount}！`; statusText.style.color = "var(--neon-cyan)";
                    triggerGameOver(winAmount); 
                    addFeedItem(`你贏了 ${winAmount}！`, 'win');
                    sendEmote('💸'); 
                } else {
                    sfx.lose(); 
                    statusText.innerText += ` - 沒中！`; statusText.style.color = "#ff3333";
                    triggerGameOver(0); 
                    addFeedItem(`你輸了 ${myCurrentBet.amount}`, 'lose');
                }
            } else {
                triggerGameOver(0);
            }

            setTimeout(() => setGameState('WAITING'), 5000);
        }

        // ==========================================
        // 8. MULTIPLAYER EVENT LISTENER
        // ==========================================
        window.addEventListener("message", (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.action === "gameEventReceived") {
                    const { userId, eventName, payload } = data;
                    
                    // Validate Round ID for gameplay events
                    if (payload.roundId && currentRoundId && payload.roundId !== currentRoundId) {
                        return; // Ignore stale events
                    }

                    switch(eventName) {
                        case "HOST_CLAIMED":
                            if (userId !== user.id) {
                                document.getElementById('host-overlay').classList.add('hidden');
                                addFeedItem(`${payload.username} 成為了房主`); setGameState('WAITING');
                            }
                            break;
                        case "ROUND_START":
                            currentRoundId = payload.roundId;
                            setGameState('BETTING'); addFeedItem('開放下注！');
                            break;
                        case "PLAYER_BET":
                            if (userId !== user.id) addFeedItem(`${payload.username} 押注了 [${betTypeNames[payload.type]}]`);
                            break;
                        case "ROLL_START":
                            setGameState('ROLLING');
                            break;
                        case "ROLL_RESULT":
                            diceValues = payload.dice; 
                            setGameState('RESULT'); 
                            calculateResult(payload.dice);
                            break;
                        case "PLAYER_EMOTE":
                            spawnFloatingEmote(payload.emoji, 20 + Math.random() * 60);
                            break;
                    }
                }
            } catch(e) {}
        });

    </script>
</body>
</html>
