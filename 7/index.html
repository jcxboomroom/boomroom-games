<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="theme-color" content="#050510">
    <title>霓虹木頭人</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');

        :root{
          --bg:#050510;
          --cyan:#5ce9ff;
          --green:#5dff9a;
          --yellow:#ffe66d;
          --red:#ff4d6d;
          --white:#f8fbff;
          --muted:#a3abc2;
          --safe-top:env(safe-area-inset-top,0px);
          --safe-bottom:env(safe-area-inset-bottom,0px);
        }
        *{box-sizing:border-box}
        html,body{
          width:100%;height:100%;margin:0;overflow:hidden;
          background:var(--bg);color:var(--white);
          font-family:"Orbitron","Noto Sans TC",sans-serif;
          touch-action:none;
          overscroll-behavior:none;
        }
        body{position:relative}
        #game{
          position:fixed;inset:0;
          padding-top:var(--safe-top);
          padding-bottom:var(--safe-bottom);
          display:flex;
          align-items:stretch;
          justify-content:center;
          overflow:hidden;
        }
        #gameCanvas{
          width:100%;height:100%;
          display:block;
          background:#060716;
          touch-action:none;
        }
        .hud{
          position:fixed;
          left:0;right:0;top:var(--safe-top);
          height:68px;
          padding:10px 12px 0;
          display:flex;
          justify-content:space-between;
          align-items:flex-start;
          pointer-events:none;
          z-index:10;
        }
        .hud-card{
          min-width:92px;
          padding:8px 10px;
          border-radius:16px;
          background:rgba(8,10,25,.55);
          border:1px solid rgba(255,255,255,.12);
          box-shadow:0 10px 35px rgba(0,0,0,.25);
          backdrop-filter:blur(10px);
        }
        .hud-card.center{
          min-width:150px;
          text-align:center;
        }
        .hud-label{font-size:9px;letter-spacing:.08em;color:var(--muted)}
        .hud-value{font-size:15px;font-weight:900;margin-top:2px}
        #stateValue{color:var(--green)}
        #timerValue{font-size:24px;line-height:1}
        #poolValue{color:var(--yellow)}
        #hint{
          position:fixed;
          left:50%;bottom:calc(18px + var(--safe-bottom));
          transform:translateX(-50%);
          z-index:12;
          padding:10px 18px;
          border-radius:999px;
          background:rgba(5,7,18,.68);
          border:1px solid rgba(255,255,255,.12);
          box-shadow:0 8px 35px rgba(0,0,0,.35);
          font-family:"Noto Sans TC",sans-serif;
          font-size:12px;
          color:#fff;
          pointer-events:none;
          transition:opacity .35s,transform .35s;
          white-space:nowrap;
        }
        #hint.hide{opacity:0;transform:translate(-50%,18px)}
        #countdown{
          position:fixed;inset:0;
          display:grid;place-items:center;
          z-index:20;pointer-events:none;
          opacity:0;
        }
        #countdown.show{opacity:1}
        #countdownText{
          font-size:min(24vw,180px);
          font-weight:900;
          color:#fff;
          text-shadow:0 0 24px currentColor,0 0 70px currentColor;
          transform:scale(.72);
          animation:countPop .7s ease-out forwards;
        }
        @keyframes countPop{0%{transform:scale(.72);opacity:.2}35%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:0}}
        #toast{
          position:fixed;
          left:50%;
          top:86px;
          transform:translateX(-50%) translateY(-10px);
          z-index:30;
          padding:8px 14px;
          border-radius:999px;
          background:rgba(5,7,18,.9);
          border:1px solid rgba(92,233,255,.5);
          box-shadow:0 8px 35px rgba(0,0,0,.35);
          opacity:0;
          pointer-events:none;
          transition:opacity .2s,transform .2s;
          font:12px "Noto Sans TC",sans-serif;
          white-space:nowrap;
        }
        #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
        #result{
          position:fixed;inset:0;display:none;place-items:center;
          padding:24px;z-index:40;
          background:rgba(2,3,12,.58);
          backdrop-filter:blur(12px);
        }
        #result.show{display:grid}
        .result-card{
          width:min(94vw,520px);
          border-radius:28px;
          padding:22px;
          background:linear-gradient(180deg,rgba(19,22,46,.98),rgba(7,9,24,.98));
          border:1px solid rgba(255,255,255,.14);
          box-shadow:0 30px 90px rgba(0,0,0,.55);
        }
        .result-title{
          text-align:center;
          font-size:24px;
          font-weight:900;
          letter-spacing:.08em;
        }
        #resultWinner{
          text-align:center;
          font-size:16px;
          margin:10px 0 16px;
          color:var(--yellow);
          font-family:"Noto Sans TC",sans-serif;
        }
        #resultAmount{
          text-align:center;
          font-size:32px;
          font-weight:900;
          color:var(--green);
          margin-bottom:16px;
        }
        #ranking{
          display:flex;flex-direction:column;gap:6px;
          max-height:260px;overflow:auto;
        }
        .rank-row{
          display:grid;
          grid-template-columns:36px 1fr auto;
          align-items:center;
          gap:8px;
          padding:10px 12px;
          border-radius:14px;
          background:rgba(255,255,255,.045);
          border:1px solid rgba(255,255,255,.07);
          font:13px "Noto Sans TC",sans-serif;
        }
        .rank-row.me{border-color:rgba(92,233,255,.55);box-shadow:inset 0 0 22px rgba(92,233,255,.06)}
        .rank-pos{font-weight:900;text-align:center}
        .rank-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .rank-reward{color:var(--yellow);font-weight:800}
        #resultHint{
          margin-top:12px;text-align:center;
          font:11px "Noto Sans TC",sans-serif;color:var(--muted);
        }
    </style>
</head>
<body>
<div id="game">
    <canvas id="gameCanvas"></canvas>
</div>

<div class="hud">
    <div class="hud-card">
        <div class="hud-label">PLAYERS</div>
        <div class="hud-value" id="playersValue">1 / 10</div>
    </div>
    <div class="hud-card center">
        <div class="hud-label" id="phaseLabel">準備中</div>
        <div class="hud-value" id="timerValue">--</div>
    </div>
    <div class="hud-card">
        <div class="hud-label">POT</div>
        <div class="hud-value" id="poolValue">0 🪙</div>
    </div>
</div>

<div id="hint">綠燈長按畫面奔跑　・　紅燈立刻鬆手</div>
<div id="countdown"><div id="countdownText">3</div></div>
<div id="toast"></div>

<div id="result">
    <div class="result-card">
        <div class="result-title">MATCH RESULT</div>
        <div id="resultWinner">等待結算</div>
        <div id="resultAmount">+0 🪙</div>
        <div id="ranking"></div>
        <div id="resultHint">正在返回 BoomRoom 房間…</div>
    </div>
</div>

<script>
    (()=>{
    'use strict';

    /* =========================================================
       BoomRoom integration
       - SDK 存在：只相信平台 isHost；Host 才能推進世界狀態
       - SDK 不存在：啟用本地 Mock，建立 4 個 BOT 方便直接測試
       ========================================================= */
    let SDK = window.BoomRoomSDK || null;
    let DEMO = false;
    let sdkBridgeReady = !!SDK;
    let sdkInitReceived = false;
    let demoFallbackTimer = 0;
    let bridgeRoomId = '';
    let sdkEventsBound = false;
    let lastRosterSignature = '';
    let lastRosterSyncAt = 0;
    let lastSyncRequestAt = 0;

    function getSDK(){
      if(window.BoomRoomSDK) SDK=window.BoomRoomSDK;
      return SDK;
    }

    function safeUser(){
      try{
        if(getSDK() && typeof getSDK().getUser === 'function'){
          const u = getSDK().getUser();
          if(u) return u;
        }
      }catch(_){}
      return {id:'demo-user-'+Math.random().toString(36).slice(2,8),username:'你'};
    }

    const rawUser = safeUser();
    const ME = {
      id:String(rawUser?.id || ('demo-'+Math.random().toString(36).slice(2))),
      username:String(rawUser?.username || '玩家').slice(0,12),
      joinedAt:Date.now()
    };

    const cfg = {
      entryFee:100,
      feeRate:.10,
      maxPlayers:10,
      roundMs:52000,
      countdownMs:3000,
      stateSendMs:70,
      playerSendMs:55,
      hostTimeoutMs:15000,
      startDelayMs:3200,
      runSpeed:17.5,
      finishAt:.93,
      rosterPollMs:450,
      rosterTimeoutMs:9000,
      syncRequestMs:1400
    };

    const canvas=document.getElementById('gameCanvas');
    const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});

    const ui={
      players:document.getElementById('playersValue'),
      phase:document.getElementById('phaseLabel'),
      timer:document.getElementById('timerValue'),
      pool:document.getElementById('poolValue'),
      hint:document.getElementById('hint'),
      countdown:document.getElementById('countdown'),
      countdownText:document.getElementById('countdownText'),
      toast:document.getElementById('toast'),
      result:document.getElementById('result'),
      resultWinner:document.getElementById('resultWinner'),
      resultAmount:document.getElementById('resultAmount'),
      ranking:document.getElementById('ranking')
    };

    let W=0,H=0,DPR=1;
    function resize(){
      DPR=Math.min(window.devicePixelRatio||1,2);
      W=Math.max(320,window.innerWidth);
      H=Math.max(520,window.innerHeight);
      canvas.width=Math.floor(W*DPR);
      canvas.height=Math.floor(H*DPR);
      canvas.style.width=W+'px';
      canvas.style.height=H+'px';
      ctx.setTransform(DPR,0,0,DPR,0,0);
    }
    window.addEventListener('resize',resize,{passive:true});
    resize();

    /* =========================================================
       Audio / vibration
       ========================================================= */
    let audioCtx=null,masterGain=null,muted=false;
    function initAudio(){
      if(muted)return;
      try{
        if(!audioCtx){
          audioCtx=new (window.AudioContext||window.webkitAudioContext)();
          masterGain=audioCtx.createGain();
          masterGain.gain.value=.055;
          masterGain.connect(audioCtx.destination);
        }
        if(audioCtx.state==='suspended') audioCtx.resume().catch(()=>{});
      }catch(_){}
    }
    function tone(f,type,d=.12,v=.3,delay=0){
      if(!audioCtx||!masterGain||muted)return;
      const t=audioCtx.currentTime+delay;
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type=type;o.frequency.setValueAtTime(f,t);
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(Math.max(.001,v),t+.01);
      g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(masterGain);o.start(t);o.stop(t+d+.03);
    }
    const sfx={
      green(){tone(580,'triangle',.09,.22);tone(860,'triangle',.18,.24,.07)},
      yellow(){tone(360,'sawtooth',.10,.24);tone(300,'sawtooth',.12,.20,.12)},
      red(){tone(150,'sawtooth',.32,.34);tone(90,'square',.38,.25,.05)},
      hit(){tone(180,'square',.08,.20);tone(120,'square',.10,.18,.05)},
      win(){tone(460,'square',.10,.2);tone(680,'square',.16,.24,.10);tone(920,'square',.24,.28,.22)},
      lose(){tone(280,'sawtooth',.18,.22);tone(180,'sawtooth',.30,.18,.14)},
      tick(){tone(850,'square',.045,.10)}
    };
    function vibrate(p){try{if(navigator.vibrate) navigator.vibrate(p)}catch(_){}}

    /* =========================================================
       Network / player model
       ========================================================= */
    const players=new Map();
    let hostId=null;
    let sdkHostKnown=false;
    let localPaid=false;
    let purchasePending=false;
    let gameOverCalled=false;
    let stateBroadcastAt=0;
    let lastStateMatch='';
    let stateSeq=0;
    let lastAppliedStateSeq=-1;

    const state={
      matchId:'M_'+Math.random().toString(36).slice(2,10),
      phase:'LOBBY',
      phaseEndsAt:0,
      light:'GREEN',
      lightEndsAt:0,
      result:[],
      startedAt:0
    };

    let localHolding=false;
    let lastInputSent=0;
    let lastFrame=performance.now();
    let tutorialUntil=Date.now()+6500;
    const particles=[];
    const popups=[];

    function sdkIsHostValue(){
      const sdk=getSDK();
      if(!sdk)return false;
      try{
        const v=typeof sdk.isHost==='function'?sdk.isHost():sdk.isHost;
        if(typeof v==='boolean'){
          sdkHostKnown=true;
          if(v)hostId=ME.id;
          return v;
        }
      }catch(_){}
      return false;
    }
    function isHost(){
      if(DEMO)return hostId===ME.id;
      const sdk=getSDK();
      if(sdkHostKnown)return sdkIsHostValue();
      return false;
    }
    function broadcast(name,payload={}){
      if(DEMO)return;
      const sdk=getSDK();
      const data={...payload,roomId:roomId()};
      try{
        if(sdk && typeof sdk.sendGameEvent==='function'){
          // BoomRoom SDK 已經依目前房間路由事件；不要把 wrapper 當成 event payload。
          sdk.sendGameEvent(name,payload||{});
          return;
        }
      }catch(_){}
      try{
        if(window.parent && window.parent!==window){
          window.parent.postMessage({action:'sendGameEvent',eventName:name,payload:data},'*');
        }
      }catch(_){}
    }
    function roomId(){
      try{
        const sdk=getSDK();
        const id=sdk?.roomId ?? bridgeRoomId;
        return String(id||'');
      }catch(_){return ''}
    }
    function onlineCount(){
      return [...players.values()].filter(p=>p.online!==false).length;
    }
    function allActivePlayers(){
      return [...players.values()].filter(p=>p.online!==false);
    }
    function paidPlayers(){
      return [...players.values()].filter(p=>p.hasPaid && p.online!==false);
    }
    function humanPlayers(){
      return [...players.values()].filter(p=>!p.isBot);
    }
    function addPlayer(raw,seen=true){
      if(!raw)return null;
      const nested=raw.user||raw.player||raw.member||null;
      const idValue=raw.id ?? raw.userId ?? raw.playerId ?? raw.uid ?? nested?.id ?? nested?.userId ?? nested?.playerId;
      if(idValue==null)return null;
      const id=String(idValue);
      let p=players.get(id);
      if(!p){
        p={
          id,
          username:String(raw.username||raw.name||raw.displayName||nested?.username||nested?.name||'玩家').slice(0,12),
          joinedAt:Number(raw.joinedAt)||Date.now(),
          hasPaid:!!raw.hasPaid,
          x:Number.isFinite(Number(raw.x))?Number(raw.x):.06,
          targetX:Number.isFinite(Number(raw.targetX))?Number(raw.targetX):.06,
          status:raw.status||'ALIVE',
          online:true,
          lastSeen:Date.now(),
          holding:!!raw.holding,
          lane:Number.isFinite(Number(raw.lane))?Number(raw.lane):players.size%10,
          color:Number.isFinite(Number(raw.color))?Number(raw.color):(players.size%10),
          runPhase:Math.random()*Math.PI*2,
          bump:0,
          bumpCooldown:0,
          isBot:!!raw.isBot,
          inputSeq:Number(raw.inputSeq)||0
        };
        players.set(id,p);
      }else{
        if(raw.username!=null||raw.name!=null||raw.displayName!=null||nested?.username!=null||nested?.name!=null)p.username=String(raw.username||raw.name||raw.displayName||nested?.username||nested?.name||p.username).slice(0,12);
        if(raw.joinedAt!=null){
          const joined=Number(raw.joinedAt);
          if(Number.isFinite(joined) && joined>0)p.joinedAt=joined;
        }
        if(raw.hasPaid!=null)p.hasPaid=!!raw.hasPaid;
        if(raw.x!=null)p.targetX=Math.max(.02,Math.min(cfg.finishAt,Number(raw.x)||p.targetX));
        if(raw.status!=null)p.status=raw.status;
        if(raw.holding!=null)p.holding=!!raw.holding;
        if(raw.online!=null)p.online=!!raw.online;
        if(raw.lane!=null)p.lane=Number(raw.lane)||0;
        if(raw.color!=null)p.color=Number(raw.color)||0;
        if(raw.isBot!=null)p.isBot=!!raw.isBot;
        if(seen){p.lastSeen=Date.now();p.online=true}
      }
      return p;
    }
    function ensureMe(){
      addPlayer({
        id:ME.id,username:ME.username,joinedAt:ME.joinedAt,
        hasPaid:localPaid,x:.06,status:'ALIVE',lane:0,color:0
      });
    }
    function extractRoomPlayerArray(value){
      if(Array.isArray(value))return value;
      if(!value || typeof value!=='object')return [];
      if(Array.isArray(value.players))return value.players;
      if(Array.isArray(value.roomPlayers))return value.roomPlayers;
      if(Array.isArray(value.members))return value.members;
      const vals=Object.values(value);
      return vals.every(v=>v && typeof v==='object') ? vals : [];
    }
    function normalizeRoomPlayers(list){
      const arr=extractRoomPlayerArray(list).slice(0,cfg.maxPlayers);
      if(!arr.length)return 0;
      let added=0;
      const seenIds=new Set();
      arr.forEach((rp,i)=>{
        if(!rp)return;
        const q=rp.user||rp.player||rp.member||rp;
        if(!q || typeof q!=='object')return;
        const id=q.id ?? q.userId ?? q.playerId ?? q.uid ?? q.memberId;
        if(id==null)return;
        const sid=String(id);
        seenIds.add(sid);
        const existing=players.get(sid);
        const joinedRaw=Number(q.joinedAt ?? q.createdAt ?? q.enteredAt);
        const raw={
          id:sid,
          username:String(q.username||q.name||q.displayName||('玩家'+(i+1))),
          online:q.online!==false
        };
        if(Number.isFinite(joinedRaw) && joinedRaw>0)raw.joinedAt=joinedRaw;
        const before=players.has(sid);
        const player=addPlayer(raw,true);
        if(player){
          if(q.hasPaid===true)player.hasPaid=true;
          player.lastRosterSeen=Date.now();
          player.online=true;
          // roster 不應在每次輪詢時覆蓋 Host 計算的位置
          if(!before && player.x==null)player.x=.06;
          added++;
        }
      });
      assignLanes();
      return added;
    }
    function syncSDKRoomPlayers(force=false){
      const sdk=getSDK();
      if(!sdk || DEMO)return;
      const now=Date.now();
      if(!force && now-lastRosterSyncAt<cfg.rosterPollMs)return;
      lastRosterSyncAt=now;

      let list=null;
      try{
        if(Array.isArray(sdk.roomPlayers)) list=sdk.roomPlayers;
        else if(typeof sdk.getRoomPlayers==='function') list=sdk.getRoomPlayers();
        else if(sdk.room && Array.isArray(sdk.room.players)) list=sdk.room.players;
      }catch(_){list=null}

      const arr=extractRoomPlayerArray(list);
      if(arr.length){
        const ids=arr.map((rp,i)=>{
          const q=rp?.user||rp?.player||rp?.member||rp||{};
          return String(q.id ?? q.userId ?? q.playerId ?? q.uid ?? q.memberId ?? ('idx-'+i));
        }).sort();
        const sig=ids.join('|');
        if(force || sig!==lastRosterSignature){
          lastRosterSignature=sig;
          normalizeRoomPlayers(arr);
          renderHUD();
          // 讓 Host 立即把最新 roster 變成權威快照；非 Host 同步時也回報自己。
          if(isHost())broadcastState(true);
        }
      }

      // 非 Host 定期主動要求權威快照，避免只靠首次事件。
      if(!isHost() && now-lastSyncRequestAt>=cfg.syncRequestMs){
        lastSyncRequestAt=now;
        broadcast('BR_SYNC_REQUEST',{reason:'periodic',clientId:ME.id});
      }
    }
    function assignLanes(){
      const arr=[...players.values()].sort((a,b)=>(a.joinedAt-b.joinedAt)||a.id.localeCompare(b.id));
      arr.forEach((p,i)=>{
        p.lane=i%cfg.maxPlayers;
        p.color=i%12;
      });
    }
    function snapshot(){
      return {
        stateSeq,
        matchId:state.matchId,
        phase:state.phase,
        phaseEndsAt:state.phaseEndsAt,
        light:state.light,
        lightEndsAt:state.lightEndsAt,
        hostId,
        startedAt:state.startedAt,
        players:[...players.values()].slice(0,cfg.maxPlayers).map(p=>({
          id:p.id,username:p.username,joinedAt:p.joinedAt,hasPaid:p.hasPaid,
          x:p.x,status:p.status,online:p.online,holding:p.holding,
          lane:p.lane,color:p.color,isBot:p.isBot
        })),
        result:state.result
      };
    }
    function broadcastState(force=false){
      if(!isHost())return;
      const now=Date.now();
      if(!force && now-stateBroadcastAt<cfg.stateSendMs)return;
      stateBroadcastAt=now;
      stateSeq++;
      broadcast('BR_GAME_STATE',snapshot());
    }
    function applyState(s){
      if(!s||typeof s!=='object')return;

      const incomingMatch=s.matchId!=null?String(s.matchId):'';
      const incomingSeq=Number(s.stateSeq)||0;

      // 防止網路封包亂序：舊狀態不可覆蓋較新的玩家名單。
      if(incomingMatch && incomingMatch===state.matchId && incomingSeq>0 && incomingSeq<=lastAppliedStateSeq){
        return;
      }

      if(s.hostId!=null)hostId=String(s.hostId);
      if(incomingMatch && incomingMatch!==state.matchId){
        state.matchId=incomingMatch;
        lastAppliedStateSeq=-1;
        localHolding=false;
        gameOverCalled=false;
        ui.result.classList.remove('show');
      }
      if(incomingSeq>0)lastAppliedStateSeq=incomingSeq;
      if(s.phase)state.phase=s.phase;
      state.phaseEndsAt=Number(s.phaseEndsAt)||0;
      state.startedAt=Number(s.startedAt)||0;
      const old=state.light;
      state.light=s.light||state.light;
      state.lightEndsAt=Number(s.lightEndsAt)||0;
      state.result=Array.isArray(s.result)?s.result:[];
      if(Array.isArray(s.players)){
        // Host 快照是唯一權威名單：只合併資料，不因一次短暫缺漏就把玩家踢出。
        s.players.forEach(raw=>{
          const q=addPlayer(raw,false);
          if(q){
            q.online=raw.online!==false;
            q.lastSeen=Date.now();
            q.lastRosterSeen=Date.now();
          }
        });
        assignLanes();
      }
      const me=players.get(ME.id);
      if(me){
        localPaid=!!me.hasPaid;
        if(me.status==='DEAD')localHolding=false;
      }
      if(old!==state.light && state.phase==='PLAYING'){
        if(state.light==='GREEN'){sfx.green();spawnGlow(W*.5,H*.25,'#5dff9a',18)}
        if(state.light==='YELLOW'){sfx.yellow();spawnGlow(W*.5,H*.25,'#ffe66d',12)}
        if(state.light==='RED'){sfx.red();spawnGlow(W*.5,H*.25,'#ff4d6d',24);vibrate(45)}
      }
      maybeShowResult();
    }

    /* =========================================================
       Payment
       ========================================================= */
    function requestEntry(){
      if(localPaid||purchasePending||state.phase!=='LOBBY')return;
      initAudio();purchasePending=true;renderHUD();
      if(DEMO){
        setTimeout(()=>window.onPurchaseSuccess?.('neon_redlight'),250);
        return;
      }
      try{
        const sdk=getSDK();
        if(sdk && typeof sdk.requestPurchase==='function')sdk.requestPurchase('neon_redlight',cfg.entryFee);
        else window.onPurchaseSuccess?.('neon_redlight');
      }catch(_){
        purchasePending=false;renderHUD();showToast('入場請求失敗');
      }
    }
    window.onPurchaseSuccess=function(itemId){
      if(itemId!=='neon_redlight')return;
      purchasePending=false;localPaid=true;
      ensureMe();
      const me=players.get(ME.id);
      if(me){me.hasPaid=true;me.online=true;me.lastSeen=Date.now()}
      assignLanes();
      sfx.green();showToast('已進入同一場競賽');broadcast('BR_PLAYER_JOIN',{player:{
        id:ME.id,username:ME.username,joinedAt:ME.joinedAt,hasPaid:true,
        x:.06,status:'ALIVE',lane:me?.lane||0,color:me?.color||0
      }});
      if(isHost())broadcastState(true);
      renderHUD();
    };
    window.onPurchaseFailed=function(itemId){
      if(itemId==='neon_redlight'){purchasePending=false;showToast('入場取消');renderHUD()}
    };

    /* =========================================================
       Input: everyone sends HOLD/RELEASE, only Host simulates
       ========================================================= */
    function sendInput(holding){
      const now=Date.now();
      if(now-lastInputSent<cfg.playerSendMs && holding===localHolding)return;
      lastInputSent=now;
      localHolding=holding;
      const p=players.get(ME.id);
      if(p)p.holding=holding;
      broadcast('BR_INPUT',{
        matchId:state.matchId,
        playerId:ME.id,
        holding,
        seq:(p?p.inputSeq+1:1)
      });
      if(DEMO && isHost()){} // local host already owns the input
    }
    function pointerDown(e){
      if(e) e.preventDefault();
      initAudio();
      if(state.phase==='PLAYING' && localPaid){
        const me=players.get(ME.id);
        if(me && me.status==='ALIVE')sendInput(true);
      }
    }
    function pointerUp(e){
      if(e) e.preventDefault();
      if(localHolding)sendInput(false);
    }
    canvas.addEventListener('pointerdown',pointerDown,{passive:false});
    window.addEventListener('pointerup',pointerUp,{passive:false});
    window.addEventListener('pointercancel',pointerUp,{passive:false});
    window.addEventListener('blur',()=>{if(localHolding)sendInput(false)},{passive:true});
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&localHolding)sendInput(false)});

    /* =========================================================
       Host-authoritative game
       ========================================================= */
    let autoStartAt=0;
    let hostLightBroadcastAt=0;

    let lastEntrantCount=-1;
    function hostStartIfReady(now){
      if(!isHost()||state.phase!=='LOBBY')return;
      const entrants=paidPlayers();
      if(entrants.length<1){autoStartAt=0;lastEntrantCount=0;return}
      if(entrants.length!==lastEntrantCount){
        lastEntrantCount=entrants.length;
        autoStartAt=now+cfg.startDelayMs;
        assignLanes();
        entrants.forEach(p=>{p.x=.06;p.targetX=.06;p.status='ALIVE';p.holding=false});
        broadcastState(true);
      }
      if(now>=autoStartAt){
        assignLanes();
        entrants.forEach(p=>{
          p.x=.06;p.targetX=.06;p.status='ALIVE';p.holding=false;p.bump=0;p.bumpCooldown=0;
        });
        state.matchId='M_'+Math.random().toString(36).slice(2,10);
        state.phase='COUNTDOWN';
        state.phaseEndsAt=now+cfg.countdownMs;
        state.light='GREEN';
        state.lightEndsAt=0;
        state.startedAt=0;
        state.result=[];
        gameOverCalled=false;
        lastEntrantCount=-1;
        broadcastState(true);
        showCountdown('3');
      }
    }
    function hostTick(now,dt){
      if(!isHost())return;

      if(state.phase==='LOBBY'){
        hostStartIfReady(now);
        return;
      }

      if(state.phase==='COUNTDOWN'){
        const remain=Math.max(0,state.phaseEndsAt-now);
        const sec=Math.ceil(remain/1000);
        if(sec<=3 && sec>0 && sec!==hostTick.lastCount){
          hostTick.lastCount=sec;sfx.tick();showCountdown(String(sec));
        }
        if(remain<=0){
          state.phase='PLAYING';
          state.phaseEndsAt=now+cfg.roundMs;
          state.startedAt=now;
          state.light='GREEN';
          state.lightEndsAt=now+2200+Math.random()*1400;
          hostTick.lastCount=0;
          showCountdown('GO!');
          spawnBurst(W*.5,H*.58,'#5dff9a',28);
          broadcastState(true);
          sfx.green();
        }
        return;
      }

      if(state.phase!=='PLAYING')return;

      if(now>=state.lightEndsAt){
        if(state.light==='GREEN'){
          state.light='YELLOW';
          state.lightEndsAt=now+800+Math.random()*1100;
        }else if(state.light==='YELLOW'){
          state.light='RED';
          state.lightEndsAt=now+1200+Math.random()*1700;
          // RED arrives -> anyone still holding is eliminated immediately
          [...players.values()].forEach(p=>{
            if(p.hasPaid&&p.status==='ALIVE'&&p.holding){
              p.status='DEAD';p.holding=false;p.bump=1;
              broadcast('BR_PLAYER_DEAD',{matchId:state.matchId,playerId:p.id,reason:'MOVE_ON_RED'});
              hitFX(p,'#ff4d6d');
            }
          });
        }else{
          state.light='GREEN';
          state.lightEndsAt=now+2100+Math.random()*2200;
        }
        broadcastState(true);
      }

      const racers=paidPlayers().filter(p=>p.status==='ALIVE');
      racers.forEach(p=>{
        if(p.holding){
          const speed=cfg.runSpeed*dt;
          p.x=Math.min(cfg.finishAt,p.x+speed/100);
          p.targetX=p.x;
          p.runPhase+=dt*18;
        }else{
          p.runPhase+=dt*3;
        }
        p.bump=Math.max(0,p.bump-dt*5);
        p.bumpCooldown=Math.max(0,p.bumpCooldown-dt);
      });

      // Shared-world interaction: nearby runners physically bump one another.
      for(let i=0;i<racers.length;i++){
        for(let j=i+1;j<racers.length;j++){
          const a=racers[i],b=racers[j];
          if(Math.abs(a.lane-b.lane)>1)continue;
          if(Math.abs(a.x-b.x)<.028 && a.bumpCooldown<=0 && b.bumpCooldown<=0){
            const front=a.x>=b.x?a:b;
            const back=front===a?b:a;
            back.x=Math.max(.045,back.x-.010);
            back.targetX=back.x;
            front.x=Math.min(cfg.finishAt,front.x+.004);
            a.bump=1;b.bump=1;
            a.bumpCooldown=b.bumpCooldown=.18;
            broadcast('BR_BUMP',{matchId:state.matchId,a:a.id,b:b.id});
          }
        }
      }

      const finished=racers.filter(p=>p.x>=cfg.finishAt);
      if(finished.length){
        finished.forEach(p=>{p.x=cfg.finishAt;p.status='FINISHED';p.holding=false});
        resolveRound(finished[0]);
        return;
      }

      const alive=paidPlayers().filter(p=>p.status==='ALIVE'||p.status==='FINISHED');
      if(!alive.length){resolveRound(null);return}
      if(now>=state.phaseEndsAt){
        alive.sort((a,b)=>b.x-a.x);
        resolveRound(alive[0]||null);
        return;
      }

      if(now-stateBroadcastAt>cfg.stateSendMs)broadcastState(false);
    }
    function resolveRound(primaryWinner){
      if(state.phase!=='PLAYING')return;
      const entrants=paidPlayers();
      const pool=Math.floor(entrants.length*cfg.entryFee*(1-cfg.feeRate));
      let winners=[];
      if(primaryWinner) winners=[primaryWinner];
      else{
        const live=entrants.filter(p=>p.status!=='DEAD');
        winners=live.length?live:entrants;
      }
      const reward=Math.floor(pool/Math.max(1,winners.length));
      const rank=entrants.slice().sort((a,b)=>b.x-a.x);
      state.result=rank.map(p=>({
        id:p.id,username:p.username,x:p.x,status:p.status,
        isWinner:winners.some(w=>w.id===p.id),
        winAmount:winners.some(w=>w.id===p.id)?reward:0
      }));
      state.phase='RESULT';
      state.phaseEndsAt=Date.now()+3200;
      state.light='GREEN';
      state.lightEndsAt=0;
      broadcastState(true);
      spawnBurst(W*.76,H*.34,'#ffe66d',55);
    }
    hostTick.lastCount=0;

    /* =========================================================
       Incoming game events
       ========================================================= */
    function handleGameEvent(name,payload,senderId=null){
      if(!name)return;
      let p=payload||{};
      if(typeof p==='string'){try{p=JSON.parse(p)}catch(_){p={}}}
      if(p.payload && typeof p.payload==='object' && !p.playerId && !p.player && !p.hostId && !p.players)p=p.payload;
      const currentRoom=roomId();
      if(!DEMO && p.roomId && currentRoom && String(p.roomId)!==currentRoom)return;

      if(name==='BR_PLAYER_ANNOUNCE' || name==='BR_PLAYER_JOIN'){
        const raw=p.player||p.user||p.member||p;
        if(raw && (raw.id!=null||raw.userId!=null||raw.playerId!=null||senderId!=null)){
          if(raw.id==null && senderId!=null)raw.id=senderId;
          const q=addPlayer({...raw,online:true},true);
          if(q){
            q.lastSeen=Date.now();
            q.online=true;
          }
          assignLanes();
          if(q)showToast('房間玩家：'+onlineCount()+' 人');
          if(isHost())broadcastState(true);
        }
        return;
      }

      if(name==='BR_PLAYER_LIST_REQUEST'){
        // 只回報自己，不重建本地玩家 Map。Host 再以最新 roster 快照同步全房。
        if(ME.id)broadcast('BR_PLAYER_ANNOUNCE',{player:{id:ME.id,username:ME.username,joinedAt:ME.joinedAt,hasPaid:localPaid,online:true,x:.06,status:'ALIVE',lane:players.get(ME.id)?.lane||0,color:players.get(ME.id)?.color||0}});
        if(isHost())broadcastState(true);
        return;
      }

      if(name==='BR_INPUT'){
        if(!isHost())return;
        if(String(p.matchId||'')!==state.matchId)return;
        const pid=String(p.playerId ?? senderId ?? '');
        const pl=players.get(pid);
        if(!pl||!pl.hasPaid||pl.status!=='ALIVE')return;
        pl.holding=!!p.holding;
        pl.lastSeen=Date.now();pl.online=true;pl.inputSeq=Number(p.seq)||pl.inputSeq;
        return;
      }

      if(name==='BR_PLAYER_DEAD'){
        const pl=players.get(String(p.playerId));
        if(pl && pl.status!=='DEAD'){pl.status='DEAD';pl.holding=false;hitFX(pl,'#ff4d6d');}
        return;
      }
      if(name==='BR_BUMP'){
        const a=players.get(String(p.a)),b=players.get(String(p.b));
        if(a)a.bump=1;if(b)b.bump=1;sfx.hit();vibrate(22);spawnBurst(W*.5,H*.6,'#fff',8);return;
      }
      if(name==='BR_GAME_STATE'){applyState(p);return;}
      if(name==='BR_SYNC_REQUEST'){
        // 回覆自己的存在，並由 Host 回傳權威世界狀態。
        broadcast('BR_PLAYER_ANNOUNCE',{player:{id:ME.id,username:ME.username,joinedAt:ME.joinedAt,hasPaid:localPaid,online:true,x:.06,status:'ALIVE',lane:players.get(ME.id)?.lane||0,color:players.get(ME.id)?.color||0}});
        if(isHost())broadcastState(true);
        return;
      }
      if(name==='BR_HOST_ANNOUNCE'){
        if(p.hostId!=null && !sdkHostKnown)hostId=String(p.hostId);
        return;
      }
    }
    function onMessageData(data){
      if(!data)return;
      if(typeof data==='string'){try{data=JSON.parse(data)}catch(_){return}}
      const action=String(data.action||data.type||'');
      const body=data.data&&typeof data.data==='object' ? data.data : data;
      if(action==='initSDK'||action==='sdkReady'||action==='boomroom:sdkReady'){applySDKData(body);return}
      if(action==='purchaseSuccess'){window.onPurchaseSuccess?.(String(data.itemId||body.itemId||''));return}
      if(action==='purchaseFailed'){window.onPurchaseFailed?.(String(data.itemId||body.itemId||''));return}
      if(action==='gameEventReceived'||action==='gameEvent'||action==='BR_GAME_EVENT'){
        handleGameEvent(String(data.eventName||data.name||data.event||''),data.payload||data.data||{},data.userId!=null?String(data.userId):null);
      }
    }
    window.addEventListener('message',e=>{
      try{onMessageData(typeof e.data==='string'?e.data:e.data)}catch(_){}
    });
    bindSDKEvents();

    function bindSDKEvents(){
      if(sdkEventsBound)return;
      const sdk=getSDK();
      if(!sdk)return;
      sdkEventsBound=true;
      try{
        sdk.addEventListener?.('gameEventReceived',e=>{
          try{handleGameEvent(e.eventName||e.name||e.event,e.payload||e.data||{},e.userId!=null?String(e.userId):null)}catch(_){}
        });
      }catch(_){}
      try{
        sdk.on?.('gameEventReceived',(name,payload,meta)=>handleGameEvent(name,payload,meta?.userId||meta?.senderId||null));
      }catch(_){}
    }

    function applySDKData(data){
      if(!data || typeof data!=='object')return;
      sdkInitReceived=true;
      DEMO=false;
      sdkBridgeReady=true;
      SDK=getSDK()||SDK;
      if(data.roomId!=null)bridgeRoomId=String(data.roomId||'');
      bindSDKEvents();
      if(data.user && (data.user.id!=null||data.user.userId!=null)){
        ME.id=String(data.user.id ?? data.user.userId);
        ME.username=String(data.user.username||data.user.name||'玩家').slice(0,12);
      }
      if(typeof data.isHost==='boolean'){
        sdkHostKnown=true;
        if(data.isHost)hostId=ME.id;
        else if(hostId===ME.id)hostId=null;
      }
      if(Array.isArray(data.roomPlayers))normalizeRoomPlayers(data.roomPlayers);
      ensureMe();assignLanes();
      syncSDKRoomPlayers(true);
      if(isHost())broadcast('BR_HOST_ANNOUNCE',{hostId:ME.id});
      broadcast('BR_PLAYER_ANNOUNCE',{player:{id:ME.id,username:ME.username,joinedAt:ME.joinedAt,hasPaid:localPaid,online:true,x:.06,status:'ALIVE',lane:players.get(ME.id)?.lane||0,color:players.get(ME.id)?.color||0}});
      broadcast('BR_PLAYER_LIST_REQUEST',{});
      broadcast('BR_SYNC_REQUEST',{});
      renderHUD();
      if(!localPaid && state.phase==='LOBBY')setTimeout(requestEntry,300);
    }
    window.initBoomRoomSDK=applySDKData;
    window.onBoomRoomSDKReady=()=>{
      try{
        SDK=getSDK();
        if(SDK){
          applySDKData({
            user:typeof SDK.getUser==='function'?SDK.getUser():SDK.user||null,
            isHost:typeof SDK.isHost==='function'?SDK.isHost():SDK.isHost,
            roomId:SDK.roomId,
            roomPlayers:Array.isArray(SDK.roomPlayers)?SDK.roomPlayers:[]
          });
        }
      }catch(_){ensureMe()}
    };
    if(getSDK())window.onBoomRoomSDKReady();

    // Flutter / WebView 可能先發 initSDK，再稍後掛上 BoomRoomSDK。
    window.requestBoomRoomSDKInit?.();

    /* =========================================================
       Demo mock: direct browser = real local player + AI rivals
       ========================================================= */
    function setupDemo(){
      if(!DEMO)return;
      hostId=ME.id;sdkHostKnown=true;
      ensureMe();
      const bots=[
        ['阿爆','B1'],['小辣椒','B2'],['閃電','B3'],['熊大','B4']
      ];
      bots.forEach((b,i)=>addPlayer({
        id:'bot-'+b[1],
        username:b[0],
        joinedAt:ME.joinedAt+i+1,
        hasPaid:true,online:true,
        x:.06,status:'ALIVE',lane:i+1,color:i+1,
        isBot:true
      }));
      assignLanes();
      window.onPurchaseSuccess?.('neon_redlight');

      // AI input is generated locally but still passes through the same Host simulation.
      setInterval(()=>{
        if(state.phase!=='PLAYING')return;
        [...players.values()].filter(p=>p.isBot&&p.status==='ALIVE').forEach(bot=>{
          const r=Math.random();
          // Bots take safer short bursts and sometimes panic on yellow.
          if(state.light==='GREEN')bot.holding=r>.18;
          else if(state.light==='YELLOW')bot.holding=r>.62;
          else bot.holding=false;
        });
      },240);
    }
    clearTimeout(demoFallbackTimer);
    demoFallbackTimer=setTimeout(()=>{
      if(!sdkInitReceived && !getSDK() && window.parent===window){
        DEMO=true;
        setupDemo();
      }
    },1200);

    /* =========================================================
       Result
       ========================================================= */
    function maybeShowResult(){
      if(state.phase!=='RESULT' && state.phase!=='CLOSED')return;
      if(!state.result.length)return;
      const my=state.result.find(r=>String(r.id)===ME.id);
      if(!my)return;

      if(!gameOverCalled){
        gameOverCalled=true;
        const reward=Math.max(0,Number(my.winAmount)||0);
        try{const sdk=getSDK();if(sdk && typeof sdk.gameOver==='function')sdk.gameOver(reward)}catch(_){}
        ui.resultWinner.textContent=state.result.filter(r=>r.isWinner).map(r=>r.username).join('、')+' 獲勝';
        ui.resultAmount.textContent='+'+reward.toLocaleString()+' 🪙';
        ui.resultAmount.style.color=reward>0?'var(--green)':'var(--red)';
        ui.ranking.innerHTML='';
        state.result.forEach((r,i)=>{
          const row=document.createElement('div');
          row.className='rank-row'+(String(r.id)===ME.id?' me':'');
          row.innerHTML='<div class="rank-pos">#'+(i+1)+'</div>'+
            '<div class="rank-name">'+escapeHTML(r.username)+(r.status==='DEAD'?'　💀':'')+'</div>'+
            '<div class="rank-reward">+'+(r.winAmount||0).toLocaleString()+' 🪙</div>';
          ui.ranking.appendChild(row);
        });
        ui.result.classList.add('show');
        if(reward>0){sfx.win();vibrate([40,60,40,60,100])}else sfx.lose();
        setTimeout(()=>{
          try{
            if(window.parent&&window.parent!==window)window.parent.postMessage({action:'leaveGame'},'*');
            else window.location.href='../room.html';
          }catch(_){}
        },3200);
      }
    }
    function escapeHTML(s){
      return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    /* =========================================================
       Canvas visuals
       ========================================================= */
    const PALETTE=[
      '#5ce9ff','#ff6b9d','#ffd65c','#7dff84','#9e7bff',
      '#ff964f','#55d8ff','#ff5d5d','#d6ff58','#ba72ff',
      '#66ffcc','#ff73dc'
    ];
    function playerColor(p){return PALETTE[p.color%PALETTE.length]}
    function laneY(p){
      const top=H*.46, bottom=H*.82;
      const arr=[...players.values()].sort((a,b)=>a.lane-b.lane);
      const max=Math.max(1,Math.min(cfg.maxPlayers,arr.length)-1);
      return top+(Math.min(p.lane,max)/max)*(bottom-top);
    }
    function screenX(p){
      const left=W*.095,right=W*.93;
      return left+(right-left)*Math.max(.02,Math.min(cfg.finishAt,p.x))/cfg.finishAt;
    }
    function drawBackground(t){
      const g=ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#07091b');g.addColorStop(.46,'#101946');g.addColorStop(1,'#050814');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

      // Neon moon / sky glow
      const rg=ctx.createRadialGradient(W*.78,H*.19,10,W*.78,H*.19,W*.58);
      rg.addColorStop(0,'rgba(92,233,255,.18)');rg.addColorStop(1,'rgba(92,233,255,0)');
      ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);

      // Stars
      ctx.save();
      for(let i=0;i<70;i++){
        const x=(i*83)%W;
        const y=35+((i*47)%(H*.32));
        const a=.18+.16*Math.sin(t*.001+i);
        ctx.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')';
        ctx.fillRect(x,y,1.5,1.5);
      }
      ctx.restore();

      // City skyline
      const base=H*.42;
      for(let i=0;i<18;i++){
        const bw=36+(i%4)*15;
        const bh=35+((i*29)%90);
        const x=(i*(W/16))-20;
        ctx.fillStyle=i%2?'#0a1030':'#0c1438';
        ctx.fillRect(x,base-bh,bw,bh);
        for(let wy=0;wy<4;wy++){
          const yy=base-bh+10+wy*15;
          if(yy>base-6)break;
          ctx.fillStyle=(i+wy)%3===0?'rgba(255,230,109,.25)':'rgba(92,233,255,.16)';
          ctx.fillRect(x+7,yy,4,5);
          ctx.fillRect(x+bw-11,yy,4,5);
        }
      }

      // Floor
      const floorY=H*.43;
      const fg=ctx.createLinearGradient(0,floorY,0,H);
      fg.addColorStop(0,'rgba(15,28,72,.7)');
      fg.addColorStop(1,'rgba(3,5,18,1)');
      ctx.fillStyle=fg;ctx.fillRect(0,floorY,W,H-floorY);

      ctx.strokeStyle='rgba(92,233,255,.08)';ctx.lineWidth=1;
      for(let i=0;i<12;i++){
        const yy=floorY+(i*i)*3.6;
        ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke();
      }
      for(let i=0;i<17;i++){
        const x=(i/17)*W;
        ctx.beginPath();ctx.moveTo(W*.5+(x-W*.5)*.13,floorY);ctx.lineTo(x,H);ctx.stroke();
      }

      // Start / finish glow
      ctx.fillStyle='rgba(92,233,255,.18)';
      ctx.fillRect(W*.08,H*.44,W*.018,H*.43);
      const finishX=W*.93;
      ctx.save();
      ctx.shadowBlur=25;ctx.shadowColor='#ffe66d';
      ctx.fillStyle='rgba(255,230,109,.8)';
      ctx.fillRect(finishX-3,H*.40,6,H*.47);
      ctx.restore();
      for(let i=0;i<10;i++){
        ctx.fillStyle=i%2?'#fff':'#191c35';
        ctx.fillRect(finishX-20,H*.40+i*28,20,14);
        ctx.fillRect(finishX,H*.40+i*28,20,14);
      }
    }
    function drawLight(){
      const x=W*.50,y=H*.13;
      const glow=state.light==='GREEN'?'#5dff9a':state.light==='YELLOW'?'#ffe66d':'#ff4d6d';
      ctx.save();
      ctx.shadowBlur=34;ctx.shadowColor=glow;
      ctx.fillStyle='rgba(10,12,28,.88)';
      ctx.beginPath();ctx.roundRect(x-54,y-28,108,125,26);ctx.fill();
      ctx.shadowBlur=0;
      const lights=[
        ['#ff4d6d',y-2,state.light==='RED'],
        ['#ffe66d',y+33,state.light==='YELLOW'],
        ['#5dff9a',y+68,state.light==='GREEN']
      ];
      lights.forEach(([c,yy,on])=>{
        ctx.beginPath();ctx.arc(x,yy,13,0,Math.PI*2);
        ctx.fillStyle=on?c:'rgba(255,255,255,.06)';ctx.fill();
        if(on){
          ctx.shadowBlur=25;ctx.shadowColor=c;
          ctx.strokeStyle=c;ctx.lineWidth=2;ctx.stroke();
          ctx.shadowBlur=0;
        }
      });
      ctx.fillStyle='#d7def7';ctx.font='800 10px Orbitron';ctx.textAlign='center';
      ctx.fillText(state.light==='GREEN'?'RUN':state.light==='YELLOW'?'BRAKE':'STOP',x,y+112);
      ctx.restore();
    }
    function drawDoll(t){
      const x=W*.80,y=H*.30;
      ctx.save();
      ctx.translate(x,y);
      const scale=Math.max(.72,Math.min(1.1,H/760));
      ctx.scale(scale,scale);

      ctx.shadowBlur=22;ctx.shadowColor='#ff4d6d';
      ctx.fillStyle='#161a36';
      ctx.beginPath();ctx.roundRect(-52,-50,104,126,32);ctx.fill();
      ctx.shadowBlur=0;

      // head
      ctx.fillStyle='#ffe4d7';
      ctx.beginPath();ctx.arc(0,-22,26,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#20263c';
      ctx.beginPath();ctx.arc(0,-24,29,Math.PI,Math.PI*2);ctx.fill();

      // eyes
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(-9,-22,4,0,Math.PI*2);ctx.arc(9,-22,4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#121527';
      ctx.beginPath();ctx.arc(-9,-22,1.5,0,Math.PI*2);ctx.arc(9,-22,1.5,0,Math.PI*2);ctx.fill();

      // dress
      ctx.fillStyle='#e64661';
      ctx.beginPath();ctx.moveTo(-28,4);ctx.lineTo(28,4);ctx.lineTo(48,67);ctx.lineTo(-48,67);ctx.closePath();ctx.fill();
      ctx.fillStyle='#ffe66d';
      ctx.fillRect(-31,27,62,5);

      // arms
      ctx.strokeStyle='#ffe4d7';ctx.lineWidth=14;ctx.lineCap='round';
      const arm=Math.sin(t*.002)*.12;
      ctx.beginPath();ctx.moveTo(-26,16);ctx.lineTo(-44,-8-arm*20);ctx.moveTo(26,16);ctx.lineTo(44,-8-arm*20);ctx.stroke();
      ctx.restore();
    }
    function drawRoadLanes(){
      const count=Math.min(cfg.maxPlayers,Math.max(1,players.size));
      const ys=[];
      for(let i=0;i<count;i++)ys.push(H*.46+(count===1?0:(H*.82-H*.46)*(i/(count-1))));
      ys.forEach((yy,i)=>{
        ctx.strokeStyle='rgba(255,255,255,.055)';
        ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(W*.07,yy+18);ctx.lineTo(W*.95,yy+18);ctx.stroke();
        if(i<count-1){
          ctx.fillStyle='rgba(92,233,255,.04)';
          ctx.fillRect(W*.08,yy+19,W*.85,1);
        }
      });
    }
    function drawPlayer(p,t){
      const x=screenX(p), y=laneY(p);
      const c=playerColor(p);
      const moving=(p.holding&&p.status==='ALIVE');
      const stride=moving?Math.sin(p.runPhase)*8:0;
      const bob=moving?Math.abs(Math.sin(p.runPhase))*2:0;
      const dead=p.status==='DEAD';
      const finished=p.status==='FINISHED';
      const scale=Math.max(.72,Math.min(1.0,W/650));
      ctx.save();
      ctx.translate(x,y-bob+(p.bump>0?Math.sin(performance.now()/35)*3:0));
      ctx.scale(scale,scale);

      if(p.id===ME.id && p.status==='ALIVE'){
        ctx.beginPath();ctx.ellipse(0,29,18,6,0,0,Math.PI*2);
        ctx.fillStyle='rgba(92,233,255,.18)';ctx.fill();
      }

      if(dead){
        ctx.translate(0,14);
        ctx.rotate(-1.05);
      }

      // shadow
      ctx.beginPath();ctx.ellipse(0,26,17,5,0,0,Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,.35)';ctx.fill();

      // legs
      ctx.strokeStyle='#d8e1ff';ctx.lineWidth=6;ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(-5,12);ctx.lineTo(-8+stride,28);
      ctx.moveTo(5,12);ctx.lineTo(8-stride,28);
      ctx.stroke();

      // body
      ctx.fillStyle=c;
      ctx.shadowBlur=p.id===ME.id?18:8;ctx.shadowColor=c;
      ctx.beginPath();ctx.roundRect(-11,-2,22,21,7);ctx.fill();
      ctx.shadowBlur=0;

      // arms
      ctx.strokeStyle='#dfe6ff';ctx.lineWidth=5;
      ctx.beginPath();
      ctx.moveTo(-10,3);ctx.lineTo(-20+(moving?stride*.35:0),12);
      ctx.moveTo(10,3);ctx.lineTo(20-(moving?stride*.35:0),12);
      ctx.stroke();

      // head + visor
      ctx.fillStyle='#f6d7c9';
      ctx.beginPath();ctx.arc(0,-11,12,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#17213a';
      ctx.beginPath();ctx.roundRect(-11,-14,22,6,3);ctx.fill();
      ctx.fillStyle=c;ctx.fillRect(-7,-12,14,2);

      if(finished){
        ctx.fillStyle='#ffe66d';
        ctx.font='900 15px sans-serif';ctx.textAlign='center';ctx.fillText('★',0,-31);
      }else if(dead){
        ctx.fillStyle='#ff4d6d';
        ctx.font='900 15px sans-serif';ctx.textAlign='center';ctx.fillText('✕',0,-31);
      }

      // name tag
      ctx.fillStyle='rgba(2,4,12,.76)';
      const name=p.username.length>8?p.username.slice(0,8)+'…':p.username;
      const nw=Math.max(42,ctx.measureText(name).width+16);
      ctx.beginPath();ctx.roundRect(-nw/2,-47,nw,18,9);ctx.fill();
      ctx.fillStyle=p.id===ME.id?'#fff':c;
      ctx.font='700 9px "Noto Sans TC",sans-serif';ctx.textAlign='center';
      ctx.fillText(name,0,-34);
      ctx.restore();
    }
    function drawLaser(){
      if(state.light!=='RED')return;
      const y1=H*.41,y2=H*.88;
      const grad=ctx.createLinearGradient(0,y1,0,y2);
      grad.addColorStop(0,'rgba(255,77,109,0)');
      grad.addColorStop(.5,'rgba(255,77,109,.10)');
      grad.addColorStop(1,'rgba(255,77,109,0)');
      ctx.fillStyle=grad;ctx.fillRect(0,y1,W,y2-y1);
    }
    function drawParticles(dt){
      for(let i=particles.length-1;i>=0;i--){
        const p=particles[i];
        p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt;
        if(p.life<=0){particles.splice(i,1);continue}
        ctx.save();
        ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
        ctx.fillStyle=p.c;
        ctx.translate(p.x,p.y);
        ctx.rotate(p.r);
        ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);
        ctx.restore();
      }
    }
    function spawnBurst(x,y,c,n){
      for(let i=0;i<n;i++){
        const a=Math.random()*Math.PI*2,sp=40+Math.random()*220;
        particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:90,life:.5+Math.random()*.6,maxLife:1.1,c,s:2+Math.random()*4,r:Math.random()*6});
      }
    }
    function spawnGlow(x,y,c,n){
      for(let i=0;i<n;i++){
        const a=Math.random()*Math.PI*2,r=10+Math.random()*85;
        particles.push({x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,vx:0,vy:-8-Math.random()*16,g:0,life:.45+Math.random()*.35,maxLife:.8,c,s:2+Math.random()*3,r:0});
      }
    }
    function hitFX(p,c){
      const x=screenX(p),y=laneY(p)-12;
      spawnBurst(x,y,c,18);sfx.hit();vibrate(35);
    }
    function drawPopups(){
      for(let i=popups.length-1;i>=0;i--){
        const p=popups[i];p.y-=.55;p.life-=.016;
        if(p.life<=0){popups.splice(i,1);continue}
        ctx.save();ctx.globalAlpha=p.life/1;ctx.fillStyle=p.c;ctx.font='900 14px Orbitron';
        ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);ctx.restore();
      }
    }

    /* =========================================================
       HUD
       ========================================================= */
    function renderHUD(){
      const detected=onlineCount();
      const count=paidPlayers().length;
      ui.players.textContent=Math.min(10,Math.max(1,detected))+' / 10';
      const pool=Math.floor(count*cfg.entryFee);
      ui.pool.textContent=pool.toLocaleString()+' 🪙';

      if(state.phase==='LOBBY'){
        ui.phase.textContent='等待玩家';
        ui.timer.textContent=localPaid?'READY':'JOIN';
        ui.phase.style.color='var(--cyan)';
      }else if(state.phase==='COUNTDOWN'){
        ui.phase.textContent='AUTO START';
        ui.timer.textContent=Math.max(0,Math.ceil((state.phaseEndsAt-Date.now())/1000));
        ui.phase.style.color='var(--yellow)';
      }else if(state.phase==='PLAYING'){
        ui.phase.textContent=state.light==='GREEN'?'RUN':state.light==='YELLOW'?'BRAKE':'STOP';
        ui.timer.textContent=Math.max(0,Math.ceil((state.phaseEndsAt-Date.now())/1000))+'s';
        ui.phase.style.color=state.light==='GREEN'?'var(--green)':state.light==='YELLOW'?'var(--yellow)':'var(--red)';
      }else{
        ui.phase.textContent='RESULT';
        ui.timer.textContent='DONE';
        ui.phase.style.color='var(--yellow)';
      }

      if(state.phase==='PLAYING')ui.hint.textContent='綠燈長按畫面奔跑　・　紅燈立刻鬆手　・　撞到其他玩家會被推開';
      else if(state.phase==='LOBBY')ui.hint.textContent=localPaid?('已入場・房間偵測 '+Math.min(10,detected)+' 人，正在自動整合'): '點一下畫面加入本局';
      else if(state.phase==='COUNTDOWN')ui.hint.textContent='自動開始，不需要 Ready / Start';
      if(Date.now()>tutorialUntil && state.phase==='PLAYING')ui.hint.classList.add('hide');
    }
    function showCountdown(txt){
      ui.countdown.classList.remove('show');
      void ui.countdown.offsetWidth;
      ui.countdownText.textContent=txt;
      ui.countdownText.style.color=txt==='GO!'?'var(--green)':'#fff';
      ui.countdown.classList.add('show');
      setTimeout(()=>ui.countdown.classList.remove('show'),720);
    }
    function showToast(msg){
      ui.toast.textContent=msg;ui.toast.classList.add('show');
      clearTimeout(showToast.t);
      showToast.t=setTimeout(()=>ui.toast.classList.remove('show'),1600);
    }

    /* =========================================================
       Main render loop
       ========================================================= */
    let fpsTime=0;
    function draw(now){
      const dt=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;

      if(isHost()){
        // Bot logic must be evaluated on Host only.
        [...players.values()].filter(p=>p.isBot&&p.status==='ALIVE').forEach(bot=>{
          // leave bot holding state as set by demo interval
        });
        hostTick(now,dt);
      }

      drawBackground(now);
      drawRoadLanes();
      drawDoll(now);
      drawLight();
      drawLaser();

      // Smooth remote players toward Host snapshots.
      [...players.values()]
        .filter(p=>p.hasPaid)
        .sort((a,b)=>a.lane-b.lane)
        .forEach(p=>{
          if(!isHost()){
            const k=1-Math.pow(.0008,dt);
            p.x+=(p.targetX-p.x)*k;
          }
          drawPlayer(p,now);
        });

      drawParticles(dt);
      drawPopups();
      renderHUD();
      maybeShowResult();

      // Demo host state propagation happens through the same function used by real Host.
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    /* =========================================================
       Initialization / heartbeat
       ========================================================= */
    function hello(){
      ensureMe();assignLanes();
      broadcast('BR_PLAYER_ANNOUNCE',{player:{
        id:ME.id,username:ME.username,joinedAt:ME.joinedAt,
        hasPaid:localPaid,x:.06,status:'ALIVE',online:true,
        lane:players.get(ME.id)?.lane||0,color:players.get(ME.id)?.color||0
      }});
      if(isHost()){
        hostId=ME.id;
        broadcast('BR_HOST_ANNOUNCE',{hostId:ME.id});
        broadcastState(true);
      }
    }
    setInterval(()=>{
      const me=players.get(ME.id);
      if(me){me.online=true;me.lastSeen=Date.now()}
      hello();
    },2200);

    setInterval(()=>{
      const now=Date.now();
      [...players.values()].forEach(p=>{
        // lobby 不做短暫離線剔除，避免 SDK 封包延遲造成 1/2/1/2 閃爍。
        const timeout=state.phase==='LOBBY'?cfg.hostTimeoutMs*2:cfg.hostTimeoutMs;
        if(p.id!==ME.id && now-p.lastSeen>timeout)p.online=false;
      });

      // 正式 BoomRoom 不自行推舉市長；只有平台 isHost 才能成為 Host。
      if(DEMO)hostId=ME.id;
    },1000);

    setInterval(()=>{
      const sdk=getSDK();
      if(sdk){
        bindSDKEvents();
        if(!sdkBridgeReady){try{window.onBoomRoomSDKReady?.()}catch(_){} }
        syncSDKRoomPlayers(false);
      }
    },250);

    if(DEMO)showToast('預覽模式：已載入 4 名 BOT，共用同一場遊戲');

    })();
</script>
