<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#03050a">
  <title>爆爆搶金 V4</title>

  <style>
    :root{
      --bg:#03050a;
      --panel:#080d18;
      --gold:#ffd45c;
      --gold2:#ff9a2e;
      --cyan:#55f6ff;
      --red:#ff405d;
      --red2:#ff1744;
      --green:#65ffad;
      --text:#f7f9ff;
      --muted:#8994ab;
      --t:env(safe-area-inset-top,0px);
      --b:env(safe-area-inset-bottom,0px);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
    }

    html,
    body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:
        Inter,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        system-ui,
        sans-serif;
    }

    body{
      touch-action:none;
      overscroll-behavior:none;
    }

    button{
      font:inherit;
      border:0;
      outline:0;
      -webkit-appearance:none;
    }

    #gameCanvas{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      z-index:1;
      display:block;
      touch-action:none;
      cursor:crosshair;
    }

    #veil{
      position:fixed;
      inset:0;
      z-index:2;
      pointer-events:none;
      background:
        radial-gradient(
          circle at 50% 42%,
          rgba(255,208,92,.055),
          transparent 31%
        ),
        linear-gradient(
          180deg,
          rgba(0,0,0,.015),
          rgba(0,0,0,.18)
        );
    }

    #hud{
      position:fixed;
      inset:0;
      z-index:10;
      display:none;
      pointer-events:none;
      padding:
        calc(9px + var(--t))
        10px
        calc(9px + var(--b));
    }

    .hud-inner{
      width:min(820px,100%);
      height:100%;
      margin:auto;
      position:relative;
    }

    .top{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      gap:8px;
      align-items:start;
    }

    .box{
      padding:8px 11px;
      border:1px solid rgba(255,255,255,.1);
      border-radius:15px;
      background:rgba(7,10,18,.72);
      backdrop-filter:blur(4px);
      box-shadow:0 8px 30px rgba(0,0,0,.28);
      min-width:0;
    }

    .you .value{
      color:var(--gold);
    }

    .topscore .value{
      color:var(--cyan);
    }

    .box small{
      display:block;
      color:#758099;
      font-size:7px;
      letter-spacing:.12em;
    }

    .value{
      font-size:22px;
      line-height:1.05;
      font-weight:1000;
      margin-top:2px;
    }

    .center{
      text-align:center;
      padding:2px 7px;
    }

    .round{
      font-size:8px;
      color:#7f8ba4;
      letter-spacing:.14em;
    }

    .timer{
      font-size:29px;
      line-height:1;
      font-weight:1000;
      text-shadow:0 0 18px rgba(255,255,255,.12);
    }

    .timer.danger{
      color:var(--red);
      text-shadow:0 0 20px rgba(255,79,105,.4);
    }

    .bottom{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:7px;
    }

    .chips{
      display:flex;
      gap:6px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .chip{
      padding:7px 10px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:999px;
      background:rgba(7,10,17,.78);
      font-size:8px;
      color:#b8c0d1;
    }

    .chip strong{
      color:#fff;
    }

    .combo{
      border-color:rgba(255,212,92,.28);
      color:#f6d87c;
    }

    .tip{
      font-size:9px;
      color:#a1abc0;
      text-align:center;
      padding:4px 11px 5px;
      background:rgba(7,10,17,.72);
      border:1px solid rgba(255,255,255,.07);
      border-radius:999px;
      backdrop-filter:blur(3px);
    }

    #lobby,
    #result{
      position:fixed;
      inset:0;
      z-index:1000;
      display:grid;
      place-items:center;
      padding:16px;
      background:
        radial-gradient(
          circle at 50% 18%,
          rgba(255,201,77,.12),
          transparent 28%
        ),
        rgba(2,4,9,.96);
      pointer-events:auto;
    }

    .card{
      width:min(94vw,560px);
      padding:20px;
      border:1px solid rgba(255,255,255,.11);
      border-radius:24px;
      background:
        linear-gradient(
          180deg,
          rgba(17,22,37,.985),
          rgba(5,8,14,.995)
        );
      box-shadow:0 30px 100px rgba(0,0,0,.65);
    }

    .brand{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
    }

    .brand b{
      font-size:9px;
      letter-spacing:.14em;
    }

    .dev{
      padding:5px 8px;
      border:1px solid rgba(255,212,92,.22);
      border-radius:999px;
      background:rgba(255,212,92,.08);
      color:var(--gold);
      font-size:8px;
    }

    h1{
      text-align:center;
      font-size:clamp(44px,12vw,70px);
      line-height:.9;
      margin:18px 0 8px;
      font-weight:1000;
      background:
        linear-gradient(
          180deg,
          #fff,
          #ffe98c 42%,
          #ff9634
        );
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .desc{
      text-align:center;
      color:#a5afc2;
      font-size:10px;
      line-height:1.6;
      margin:0 auto;
      max-width:470px;
    }

    .preview{
      position:relative;
      height:180px;
      margin:15px 0 10px;
      border:1px solid rgba(255,255,255,.07);
      border-radius:20px;
      overflow:hidden;
      background:
        radial-gradient(
          circle at 50% 60%,
          rgba(255,190,40,.12),
          transparent 32%
        ),
        linear-gradient(
          180deg,
          #0b1220,
          #05080f
        );
      box-shadow:
        inset 0 0 60px rgba(85,246,255,.04);
    }

    .pitem{
      position:absolute;
      font-size:28px;
      animation:drop 2.8s linear infinite;
    }

    .p1{left:12%;top:-40px}
    .p2{left:32%;top:-65px;animation-delay:.7s}
    .p3{left:58%;top:-75px;animation-delay:1.15s}
    .p4{left:78%;top:-48px;animation-delay:.45s}

    @keyframes drop{
      0%{
        transform:translateY(0) rotate(0);
        opacity:0;
      }
      12%{
        opacity:1;
      }
      100%{
        transform:translateY(250px) rotate(260deg);
        opacity:.1;
      }
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:6px;
    }

    .stat{
      text-align:center;
      padding:10px 5px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.07);
      background:rgba(255,255,255,.03);
    }

    .stat b{
      display:block;
      font-size:12px;
    }

    .stat span{
      display:block;
      margin-top:3px;
      font-size:7px;
      color:#6d7890;
    }

    .entries{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:7px;
      margin-top:10px;
    }

    .entry{
      height:48px;
      border-radius:14px;
      background:rgba(255,255,255,.035);
      border:1px solid rgba(255,255,255,.08);
      color:#acb5c8;
      font-size:10px;
      font-weight:1000;
      cursor:pointer;
      pointer-events:auto;
    }

    .entry.active{
      border-color:rgba(255,212,92,.62);
      background:rgba(255,212,92,.09);
      color:#fff;
    }

    .entry small{
      display:block;
      margin-top:2px;
      color:#6d7890;
      font-size:7px;
    }

    .entry.active small{
      color:#bca359;
    }

    .start{
      display:block;
      width:100%;
      height:58px;
      margin-top:12px;
      border-radius:29px;
      background:
        linear-gradient(
          90deg,
          #ffd35a,
          #ff9634
        );
      color:#1c0f00;
      font-weight:1000;
      font-size:19px;
      cursor:pointer;
      pointer-events:auto;
      position:relative;
      z-index:1100;
      box-shadow:
        0 15px 42px rgba(255,154,50,.22),
        inset 0 1px rgba(255,255,255,.6);
      touch-action:manipulation;
    }

    .start:active{
      transform:scale(.985);
    }

    .start:disabled{
      opacity:.45;
    }

    .hint{
      text-align:center;
      color:#67738b;
      font-size:8px;
      line-height:1.5;
      margin-top:8px;
    }

    #result{
      display:none;
    }

    .result-title{
      text-align:center;
      font-size:42px;
      font-weight:1000;
      margin-top:2px;
    }

    .reward{
      text-align:center;
      font-size:28px;
      font-weight:1000;
      color:var(--green);
      margin-top:3px;
    }

    .reason{
      text-align:center;
      color:#9aa5ba;
      font-size:10px;
      line-height:1.5;
      margin:7px 0 14px;
    }

    .rank-list{
      display:flex;
      flex-direction:column;
      gap:6px;
      max-height:38vh;
      overflow:auto;
    }

    .rank-row{
      display:grid;
      grid-template-columns:32px 1fr auto;
      gap:7px;
      align-items:center;
      padding:9px 10px;
      border-radius:13px;
      border:1px solid rgba(255,255,255,.07);
      background:rgba(255,255,255,.035);
      font-size:10px;
    }

    .rank-row.me{
      border-color:rgba(255,212,92,.24);
      background:rgba(255,212,92,.055);
    }

    .wait{
      margin-top:12px;
      width:100%;
      height:54px;
      border-radius:16px;
      background:rgba(255,255,255,.07);
      color:#9099ad;
      font-weight:1000;
    }

    #toast{
      position:fixed;
      z-index:1200;
      left:50%;
      top:46%;
      transform:
        translate(-50%,-50%)
        scale(.72);
      opacity:0;
      pointer-events:none;
      font-size:clamp(34px,10vw,66px);
      font-weight:1000;
      text-shadow:0 0 28px currentColor;
      transition:
        opacity .09s ease,
        transform .12s cubic-bezier(.2,1.4,.4,1);
      white-space:nowrap;
    }

    #toast.show{
      opacity:1!important;
      transform:
        translate(-50%,-50%)
        scale(1)!important;
    }

    @media(max-width:390px){
      .card{
        padding:17px;
      }

      .preview{
        height:160px;
      }

      .stats b{
        font-size:11px;
      }

      .timer{
        font-size:25px;
      }

      .value{
        font-size:19px;
      }
    }
  </style>
</head>

<body>

<canvas id="gameCanvas"></canvas>
<div id="veil"></div>

<div id="hud">
  <div class="hud-inner">

    <div class="top">

      <div class="box you">
        <small>YOU</small>
        <div class="value" id="myScore">0</div>
      </div>

      <div class="center">
        <div class="round" id="roundLabel">ROUND 01</div>
        <div class="timer" id="timer">45</div>
      </div>

      <div class="box topscore">
        <small>TOP</small>
        <div class="value" id="topScore">0</div>
      </div>

    </div>

    <div class="bottom">

      <div class="chips">

        <div class="chip combo">
          COMBO × <strong id="combo">0</strong>
        </div>

        <div class="chip">
          最高 COMBO <strong id="bestCombo">0</strong>
        </div>

        <div class="chip">
          玩家 <strong id="players">1</strong>
        </div>

      </div>

      <div class="tip" id="tip">
        看到金幣就點｜💣 炸彈不要碰
      </div>

    </div>

  </div>
</div>

<section id="lobby">

  <div class="card">

    <div class="brand">
      <b>BOOMROOM · PARTY ARCADE</b>
      <div class="dev" id="devBadge">開發測試模式</div>
    </div>

    <h1>爆爆搶金</h1>

    <p class="desc">
      45 秒內搶越多越好。金幣、黃金、寶石都能搶。
      連續命中提升 COMBO；炸彈會扣分。
      支援多指同時搶金。
    </p>

    <div class="preview">

      <div class="pitem p1">🪙</div>
      <div class="pitem p2">💎</div>
      <div class="pitem p3">⭐</div>
      <div class="pitem p4">🪙</div>

      <div style="
        position:absolute;
        left:50%;
        top:50%;
        transform:translate(-50%,-50%);
        font-size:54px;
        filter:drop-shadow(0 0 22px rgba(255,212,92,.45));
      ">🪙</div>

    </div>

    <div class="stats">

      <div class="stat">
        <b>45 秒</b>
        <span>限時</span>
      </div>

      <div class="stat">
        <b>＋Combo</b>
        <span>連續命中</span>
      </div>

      <div class="stat">
        <b>多指</b>
        <span>同步搶金</span>
      </div>

      <div class="stat">
        <b>多人</b>
        <span>房間競分</span>
      </div>

    </div>

    <div class="entries">

      <button
              type="button"
              class="entry active"
              data-entry="100">
        100 銀幣
        <small>標準</small>
      </button>

      <button
              type="button"
              class="entry"
              data-entry="500">
        500 銀幣
        <small>高分</small>
      </button>

      <button
              type="button"
              class="entry"
              data-entry="1000">
        1000 銀幣
        <small>極限</small>
      </button>

    </div>

    <div
            id="autoStartNotice"
            class="start"
            style="display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;">
      ⏱️ 房間人數 1/1，準備自動開始...
    </div>

    <div class="hint">
      每位玩家支付所選入場費，第一名獲得本局所有玩家入場費總額。
    </div>

  </div>

</section>

<section id="result">

  <div class="card">

    <div style="
      text-align:center;
      color:#6e7890;
      font-size:8px;
      letter-spacing:.15em
    ">
      ROUND RESULT
    </div>

    <div id="resultTitle" class="result-title">
      本局完成
    </div>

    <div id="resultReward" class="reward">
      +0 銀幣
    </div>

    <div id="resultReason" class="reason">
      —
    </div>

    <div id="rankList" class="rank-list"></div>

    <button
            id="waitBtn"
            class="wait"
            type="button">
      等待房主重新開局
    </button>

  </div>

</section>

<div id="toast"></div>

<script>
  (() => {

  'use strict';

  /* =========================================================
     GAME CONFIG
  ========================================================= */

  const GAME_INFO = {
    id:'boom_boom_gold',
    category:'派對競技',
    name:'爆爆搶金',
    description:'高速多指搶金遊戲',
    version:'4.0.0',
    entryCost:100,
    maxPlayers:20,
    controlModes:['touch','pointer','keyboard'],
    duration:'45 秒',
    multiplayer:true,
    rewardEnabled:true
  };

  const CFG = {

    ROUND_MS:45000,

    COUNTDOWN_MS:1800,

    ENTRY:[
      100,
      500,
      1000
    ],

    REWARD_CAP:2000,

    /*
     * 同畫面允許的最大活躍物件數
     * 這是安全上限，不再拿來暴力刪除正在掉落的物件。
     */
    MAX_ITEMS:96,

    /*
     * 一顆物件存活時間
     */
    ITEM_LIFE:4600,

    /*
     * 最後一批物件的最大延遲，保留給收尾階段計算。
     */
    MAX_SPAWN_DELAY_MS:500,

    /*
     * 時間到後的收尾保護時間。
     */
    DRAIN_GRACE_MS:6000,

    /*
     * 基礎生成間隔
     */
    SPAWN_MS:480,

    /*
     * 不再使用全域 ACTION_CD
     * 每個 pointer 都可以獨立觸發
     */
    TOUCH_DEDUPE_MS:40,

    HOST_TIMEOUT:7000,

    HEARTBEAT:1800,

    STATE_MS:700,

    // HUD numbers do not need 60fps DOM writes; 10fps feels instant while
    // avoiding layout/style churn on mobile WebView.
    UI_MS:100,

    RESULT_DISPLAY_MS:3000,

    MAX_PARTICLES:80,

    MAX_RIPPLES:24,

    MAX_FLOATERS:20,

    /*
     * 觸控判定區
     */
    HIT_RADIUS:62,

    /*
     * 最遠吸附距離
     */
    SNAP_RADIUS:88

  };

  /* =========================================================
     STATES
  ========================================================= */

  const STATES = {

    MENU:'MENU',

    PURCHASING:'PURCHASING',

    COUNTDOWN:'COUNTDOWN',

    PLAYING:'PLAYING',

    DRAINING:'DRAINING',

    RESULT:'RESULT',

    WAIT_HOST:'WAIT_HOST'

  };

  /* =========================================================
     ITEM VALUES
  ========================================================= */

  const TYPES = [
    'coin',
    'gold',
    'gem',
    'bomb'
  ];

  const VALUE = {

    coin:8,

    gold:45,

    gem:90,

    bomb:-250

  };

  const COLORS = {

    coin:'#fff1aa',

    gold:'#ffd45c',

    gem:'#55f6ff',

    bomb:'#ff405d'

  };

  /* =========================================================
     DOM
  ========================================================= */

  const $ = id =>
    document.getElementById(id);

  const canvas =
    $('gameCanvas');

  const ctx =
    canvas.getContext('2d',{
      alpha:false,
      desynchronized:true
    });

  const el = {

    lobby:$('lobby'),

    result:$('result'),

    hud:$('hud'),

    start:$('autoStartNotice'),

    wait:$('waitBtn'),

    myScore:$('myScore'),

    topScore:$('topScore'),

    combo:$('combo'),

    bestCombo:$('bestCombo'),

    players:$('players'),

    timer:$('timer'),

    round:$('roundLabel'),

    tip:$('tip'),

    toast:$('toast'),

    resultTitle:$('resultTitle'),

    reward:$('resultReward'),

    reason:$('resultReason'),

    rankList:$('rankList'),

    devBadge:$('devBadge')

  };

  /* =========================================================
     SDK
  ========================================================= */

  let DEV = true;

  let sdkIsHost = false;

  let gameRoomId = '';
  let gameSessionId = '';
  let pendingEntryRound = 0;
  const pendingEntryFees = new Map();
  let roundEntryFees = [];

  let rawUser = {

    id:'dev-'+
      Math.random()
        .toString(36)
        .slice(2),

    username:'開發玩家',

    avatar:''

  };

  let ME = {

    id:rawUser.id,

    username:rawUser.username,

    avatar:rawUser.avatar,

    joinedAt:Date.now()

  };

  const players =
    new Map();

  const items =
    new Map();

  const seenActions =
    new Map();

  addPlayer(ME);

  /* =========================================================
     SDK INIT
  ========================================================= */

  function setupSDK(data){

    DEV = false;

    if(data && data.user){

      rawUser = data.user;

      ME.id =
        String(rawUser.id);

      ME.username =
        String(
          rawUser.username ||
          '玩家'
        ).slice(0,22);

      ME.avatar =
        String(
          rawUser.avatar ||
          ''
        );

    }

    sdkIsHost =
      !!(data && data.isHost);

    gameRoomId =
      data && data.roomId
        ? String(data.roomId)
        : '';
    gameSessionId = String(data?.gameSessionId || gameRoomId || 'room_session');

    if(sdkIsHost){

      hostId =
        ME.id;

    }

    players.clear();

    addPlayer(ME);

    if(data && Array.isArray(data.roomPlayers) && data.roomPlayers.length > 0){
      totalRoomPlayersCount = data.roomPlayers.length;
      data.roomPlayers.forEach(rp => {
        if(rp && rp.id != null) {
          addPlayer({
            id: String(rp.id),
            username: String(rp.username || '玩家').slice(0, 22),
            avatar: String(rp.avatar || ''),
            joinedAt: Date.now()
          });
        }
      });
    }

    readyPlayersSet.add(String(ME.id));
    updateAutoStartNotice();
    el.devBadge.style.display =
      'none';

    syncUI();

    hello();

  }

  /* =========================================================
     FLUTTER / WEB MESSAGE
  ========================================================= */

  window.addEventListener(
    'message',
    e => {

      let d;

      try{

        d =
          typeof e.data === 'string'
            ? JSON.parse(e.data)
            : e.data;

      }catch(err){

        return;

      }

      if(!d)return;

      if(d.action === 'initSDK'){

        setupSDK(d);

      }else
      if(d.action === 'gameEventReceived'){

        handleEvent(
          String(
            d.eventName ||
            ''
          ),
          d.payload || {},
          d.userId != null
            ? String(d.userId)
            : null
        );

      }

      /*
       * Flutter purchase callback
       */
      if(d.action === 'purchaseSuccess'){

        window.onPurchaseSuccess(
          String(d.itemId || '')
        );

      }

      if(d.action === 'purchaseFailed'){

        window.onPurchaseFailed(
          String(d.itemId || '')
        );

  function initAudio(){

    if(
      muted ||
      audio

    try{

      audio =
        new(
          window.AudioContext ||
          window.webkitAudioContext
        )();

      master =
        audio.createGain();

      master.gain.value =
        .055;

      master.connect(
        audio.destination
      );

    }catch(e){

      return;

    }

    if(
      audio.state ===
      'suspended'
    ){

      audio.resume()
        .catch(()=>{});

    }

  }

  function beep(
    freq,
    dur=.06,
    type='triangle',
    vol=.25,
    delay=0
  ){

    if(
      muted ||
      !audio ||
      !master
    )return;

    const t =
      audio.currentTime +
      delay;

    const o =
      audio.createOscillator();

    const g =
      audio.createGain();

    o.type =
      type;

    o.frequency
      .setValueAtTime(
        freq,
        t
      );

    g.gain
      .setValueAtTime(
        .0001,
        t
      );

    g.gain
      .exponentialRampToValueAtTime(
        Math.max(
          .001,
          vol
        ),
        t+.006
      );

    g.gain
      .exponentialRampToValueAtTime(
        .0001,
        t+dur
      );

    o.connect(g);

    g.connect(master);

    o.start(t);

    o.stop(
      t+dur+.02
    );

  }

  let W =
    innerWidth;

  let H =
    innerHeight;

  let DPR =
    1;

  let bg =
    null;

  let bgctx =
    null;

  function resize(){

    W =
      innerWidth;

    H =
      innerHeight;

    // Performance guard: high-DPI phones can otherwise push millions of pixels
    // through the Canvas every frame. 1.25 keeps the image sharp while reducing
    // GPU fill cost substantially in WebView.
    DPR =
      Math.min(
        devicePixelRatio || 1,
        1.25
      );

    canvas.width =
      Math.max(
        1,
        Math.floor(
          W*DPR
        )
      );

    canvas.height =
      Math.max(
        1,
        Math.floor(
          H*DPR
        )
      );

    canvas.style.width =
      W+'px';

    canvas.style.height =
      H+'px';

    ctx.setTransform(
      DPR,
      0,
      0,
      DPR,
      0,
      0
    );

    rebuildBg();

  }

  function rebuildBg(){

    bg =
      document.createElement(
        'canvas'
      );

    bg.width =
      Math.max(
        1,
        Math.floor(W)
      );

    bg.height =
      Math.max(
        1,
        Math.floor(H)
      );

    bgctx =
      bg.getContext(
        '2d'
      );

    bgctx.fillStyle =
      '#03050a';

    bgctx.fillRect(
      0,
      0,
      W,
      H
    );

    /*
     * 中央金色氣氛
     */
    const g =
      bgctx.createRadialGradient(
        W*.5,
        H*.46,
        20,
        W*.5,
        H*.46,
        Math.max(W,H)*.75
      );

    g.addColorStop(
      0,
      'rgba(80,50,10,.16)'
    );

    g.addColorStop(
      .45,
      'rgba(8,25,38,.09)'
    );

    g.addColorStop(
      1,
      'rgba(0,0,0,0)'
    );

    bgctx.fillStyle =
      g;

    bgctx.fillRect(
      0,
      0,
      W,
      H
    );

    /*
     * 非常淡的網格
     */
    bgctx.globalAlpha =
      .045;

    bgctx.strokeStyle =
      '#55f6ff';

    bgctx.lineWidth =
      1;

    const sx =
      Math.max(
        55,
        Math.floor(
          W/10
        )
      );

    for(
      let x=0;
      x<W;
      x+=sx
    ){

      bgctx.beginPath();

      bgctx.moveTo(
        x,
        0
      );

      bgctx.lineTo(
        x,
        H
      );

      bgctx.stroke();

    }

    for(
      let y=0;
      y<H;
      y+=sx
    ){

      bgctx.beginPath();

      bgctx.moveTo(
        0,
        y
      );

      bgctx.lineTo(
        W,
        y
      );

      bgctx.stroke();

    }

    bgctx.globalAlpha =
      1;

  }

  /* =========================================================
     RANDOM
  ========================================================= */

  function rng32(seed){

    let a =
      seed >>> 0;

    return () => {

      a |= 0;

      let t =
        a +=
        0x6D2B79F5;

      t =
        Math.imul(
          t ^ t >>> 15,
          t | 1
        );

      t ^=
        t +
        Math.imul(
          t ^ t >>> 7,
          t | 61
        );

      return (
        (
          t ^
          t >>> 14
        ) >>> 0
      ) /
      4294967296;

    };

  }

  /* =========================================================
     ITEM POSITION
  ========================================================= */

  function itemPos(
    it,
    now
  ){

    if (now < it.spawnAt) {
      return { x: (it.x / 100) * W, y: -200, offscreen: true };
    }

    const p =
      clamp(
        (
          now -
          it.spawnAt
        ) /
        CFG.ITEM_LIFE,
        0,
        1
      );

    /*
     * 比原版更自然的掉落
     */
    const e =
      p*p*
      (3-2*p);

    const sway =
      Math.sin(
        it.wobble +
        p*Math.PI*1.7
      )*
      (2.5 + p*3.5);

    const curve =
      it.curve *
      Math.sin(
        p*Math.PI
      );

    return {

      x:
        clamp(
          it.x +
          it.drift*p +
          curve +
          sway,
          4,
          96
        )/100*W,

      y:
        (
          it.startY +
          138*e
        ) /
        100*H,

      offscreen: false

    };

  }

  /* =========================================================
     SPAWN
  ========================================================= */

  function spawnBatch(now){

    if(
      !isHost() ||
      (phase !== STATES.PLAYING &&
       phase !== STATES.DRAINING)
    )return;

    if(
      now -
      lastSpawn <
      CFG.SPAWN_MS
    )return;

    lastSpawn =
      now;

    const elapsed =
      clamp(
        (
          now -
          startAt
        ) /
        CFG.ROUND_MS,
        0,
        1
      );

    /*
     * 越到後面越密
     */
    const count =
      Math.min(
        7,
        3 +
        Math.floor(
          elapsed*5
        )
      );

    /*
     * 炸彈提高
     */
    const bombChance =
      .18 +
      elapsed*.16;

    const gemChance =
      .105;

    const goldChance =
      .075;

    const seq =
      Math.floor(
        (
          now -
          startAt
        ) /
        CFG.SPAWN_MS
      );

    const r =
      rng32(
        (
          roundSeed +
          seq*
          2654435761
        ) >>> 0
      );

    const arr = [];

    for(
      let i=0;
      i<count;
      i++
    ){

      const rv =
        r();

      let type =
        'coin';

      if(
        rv <
        bombChance
      ){

        type =
          'bomb';

      }else
      if(
        rv <
        bombChance +
        gemChance
      ){

        type =
          'gem';

      }else
      if(
        rv <
        bombChance +
        gemChance +
        goldChance
      ){

        type =
          'gold';

      }

      /*
       * 不再使用固定分道。
       * 每顆金幣都有自己的 X、起始高度、橫向漂移與落點偏移，
       * 讓畫面看起來像隨機掉落，而不是整齊排隊。
       */
      let x =
        7 +
        r()*86;

      let tooClose =
        true;

      for(let attempt=0; attempt<8 && tooClose; attempt++){

        tooClose =
          false;

        x =
          7 +
          r()*86;

        for(const old of arr){

          if(
            Math.abs(old.x-x) <
            9
          ){

            tooClose =
              true;

            break;

          }

        }

      }

      x =
        clamp(
          x,
          6,
          94
        );

      const delay = Math.round(i * (18 + r() * 58));

      arr.push({

        id:
          roundId +
          '-' +
          seq +
          '-' +
          i,

        type,

        x,

        delay,

        /*
         * Host 權威時間戳。
         * 所有手機都用同一個 spawnAt 計算掉落進度。
         */
        spawnAt:
          now + delay,

        size:
          type === 'bomb'
            ? .98 +
              r()*.15
            : .9 +
              r()*.18,

        rot:
          r()*
          Math.PI*2,

        startY:
          -16 +
          r()*18,

        drift:
          (r()-.5)*
          18,

        curve:
          (r()-.5)*
          10,

        wobble:
          r()*
          Math.PI*2

      });

    }

    send(
      'BBG_DROP_BATCH',
      {
        roundId,
        hostNow:now,
        items:arr
      }
    );

    acceptBatch(
      arr
    );

  }

  /* =========================================================
     ACCEPT ITEMS
  ========================================================= */

  function acceptBatch(arr){

    if(
      !Array.isArray(arr) ||
      phase === STATES.RESULT
    )return;

    pruneExpiredItems(gameNow());

    /*
     * 重要：不再使用「收到封包的本機時間」建立物件生命週期。
     * Host 直接傳 spawnAt，所有裝置以同一條遊戲時間軸繪製。
     */
    for(
      const raw of arr
    ){

      if(
        !raw ||
        !raw.id ||
        items.has(
          String(raw.id)
        )
      )continue;

      const type =
        TYPES.includes(
          raw.type
        )
        ? raw.type
        : 'coin';

      const fallbackNow =
        gameNow();

      const itemDelay =
        Math.max(
          0,
          finite(
            raw.delay,
            0
          )
        );

      const spawnAtRaw =
        finite(
          raw.spawnAt,
          fallbackNow + itemDelay
        );

      const safe = {

        id:
          String(raw.id),

        type,

        x:
          clamp(
            raw.x,
            5,
            95
          ),

        spawnAt:
          spawnAtRaw,

        expiresAt:
          spawnAtRaw +
          CFG.ITEM_LIFE,

        size:
          clamp(
            raw.size,
            .8,
            1.3
          ),

        rot:
          finite(
            raw.rot,
            0
          ),

        startY:
          clamp(
            raw.startY,
            -25,
            8
          ),

        drift:
          clamp(
            raw.drift,
            -22,
            22
          ),

        curve:
          clamp(
            raw.curve,
            -14,
            14
          ),

        wobble:
          finite(
            raw.wobble,
            0
          ),

        claimed:false,

        hitScale:1,

        /*
         * 入場效果只需要依遊戲時間估算，
         * 不再把網路收到封包的時間當成物件誕生時間。
         */
        born:
          spawnAtRaw

      };

      items.set(
        safe.id,
        safe
      );

    }

  }

  /* =========================================================
     ITEM CLEANUP
  ========================================================= */

  function pruneExpiredItems(now){

    for(
      const [
        id,
        it
      ] of items
    ){

      if(
        it.claimed ||
        now >= it.expiresAt
      ){

        items.delete(id);

      }

    }

  }

  function hasLiveItems(now){

    for(
      const it of items.values()
    ){

      if(
        !it.claimed &&
        now < it.expiresAt
      )return true;

    }

    return false;

  }

  /* =========================================================
     CACHED ITEM SPRITES
     =========================================================
     The old renderer rebuilt multiple radial gradients, paths, fonts and
     save/restore stacks for every item on every frame. The sprite cache moves
     that work to startup, then gameplay mostly becomes drawImage() calls.
  */

  const ITEM_SPRITE_SIZE = 192;

  function createSprite(drawFn){
    const c = document.createElement('canvas');
    c.width = ITEM_SPRITE_SIZE;
    c.height = ITEM_SPRITE_SIZE;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = true;
    g.translate(ITEM_SPRITE_SIZE/2, ITEM_SPRITE_SIZE/2);
    drawFn(g, 52);
    return c;
  }

  const SPRITES = {
    coin: createSprite((g,r)=>{
      const glow = g.createRadialGradient(0,0,r*.2,0,0,r*1.65);
      glow.addColorStop(0,'rgba(255,215,80,.25)');
      glow.addColorStop(1,'rgba(255,180,40,0)');
      g.fillStyle = glow;
      g.beginPath();
      g.arc(0,0,r*1.65,0,Math.PI*2);
