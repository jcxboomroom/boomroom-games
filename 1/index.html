  const SPRITE_BASE_R = 52;

  function drawCachedSprite(sprite, x, y, r, rot, scale){
    const size =
      ITEM_SPRITE_SIZE *
      (r*scale) /
      SPRITE_BASE_R;

    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rot);
    ctx.drawImage(
      sprite,
      -size/2,
      -size/2,
      size,
      size
    );
    ctx.restore();
  }

  /* =========================================================
     DRAW ITEM
  ========================================================= */

  function drawItem(
    it,
    now
  ){

    if(it.claimed)return;

    const p = itemPos(it, now);

    if(
      p.offscreen ||
      p.y < -100 ||
      p.y > H+120
    )return;

    const age = clamp(
      (now-it.born)/180,
      0,
      1
    );

    const enter =
      .72 +
      .28*(1-Math.pow(1-age,3));

    const scale = it.hitScale * enter;

    const r =
      (
        it.type === 'gem'
          ? 34
          : it.type === 'bomb'
            ? 37
            : it.type === 'gold'
              ? 33
              : 31
      ) * it.size;

    const rot =
      it.rot +
      (now-it.spawnAt)*.00125;

    if(it.type === 'bomb'){
      // Cached bomb body + one cheap dynamic ring.
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(-rot);

      const spriteSize =
        ITEM_SPRITE_SIZE *
        (r*scale) /
        SPRITE_BASE_R;

      ctx.drawImage(
        SPRITES.bomb,
        -spriteSize/2,
        -spriteSize/2,
        spriteSize,
        spriteSize
      );

      const pulse =
        .5 + .5*Math.sin(now*.008);

      ctx.strokeStyle =
        'rgba(255,55,80,' +
        (.35+pulse*.4) +
        ')';

      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(
        0,
        0,
        r*(1.15+pulse*.12)*scale,
        0,
        Math.PI*2
      );
      ctx.stroke();

      ctx.restore();
      return;
    }

    if(it.type === 'gem'){
      drawCachedSprite(
        SPRITES.gem,
        p.x,
        p.y,
        r,
        rot*1.25,
        scale
      );
      return;
    }

    drawCachedSprite(
      it.type === 'gold'
        ? SPRITES.gold
        : SPRITES.coin,
      p.x,
      p.y,
      r,
      rot,
      scale
    );

  }

  /* =========================================================
     PARTICLES
  ========================================================= */

  const particles = [];

  for(
    let i=0;
    i<CFG.MAX_PARTICLES;
    i++
  ){

    particles.push({

      active:false,

      x:0,

      y:0,

      vx:0,

      vy:0,

      life:0,

      maxLife:.5,

      size:0,

      color:'#fff',

      gravity:0

    });

  }

  function burst(
    x,
    y,
    color,
    count=9
  ){

    let n=0;

    for(
      const p of
      particles
    ){

      if(p.active)continue;

      const a =
        Math.random()*
        Math.PI*2;

      const s =
        70+
        Math.random()*
        190;

      p.active =
        true;

      p.x =
        x;

      p.y =
        y;

      p.vx =
        Math.cos(a)*s;

      p.vy =
        Math.sin(a)*s;

      p.life =
        .3+
        Math.random()*.35;

      p.maxLife =
        p.life;

      p.size =
        1.5+
        Math.random()*3.2;

      p.color =
        color;

      p.gravity =
        120;

      n++;

      if(
        n >=
        Math.min(
          count,
          14
        )
      )break;

    }

  }

  /* =========================================================
     RIPPLE
  ========================================================= */

  const ripples = [];

  for(
    let i=0;
    i<CFG.MAX_RIPPLES;
    i++
  ){

    ripples.push({

      active:false,

      x:0,

      y:0,

      radius:0,

      maxRadius:0,

      life:0,

      color:'#fff',

      width:2

    });

  }

  function ripple(
    x,
    y,
    color
  ){

    let r =
      ripples.find(
        x =>
          !x.active
      );

    if(!r){

      r =
        ripples[0];

    }

    r.active =
      true;

    r.x =
      x;

    r.y =
      y;

    r.radius =
      10;

    r.maxRadius =
      68;

    r.life =
      .38;

    r.color =
      color;

    r.width =
      3;

  }

  /* =========================================================
     FLOATING TEXT
  ========================================================= */

  const floaters = [];

  for(
    let i=0;
    i<CFG.MAX_FLOATERS;
    i++
  ){

    floaters.push({

      active:false,

      x:0,

      y:0,

      text:'',

      color:'#fff',

      life:0,

      maxLife:.7,

      vy:-70

    });

  }

  function floatingText(
    x,
    y,
    text,
    color
  ){

    let f =
      floaters.find(
        x =>
          !x.active
      );

    if(!f){

      f =
        floaters[0];

    }

    f.active =
      true;

    f.x =
      x;

    f.y =
      y;

    f.text =
      text;

    f.color =
      color;

    f.life =
      .65;

    f.maxLife =
      .65;

    f.vy =
      -72;

  }

  /* =========================================================
     FX UPDATE
  ========================================================= */

  function updateFX(dt){

    for(
      const p of
      particles
    ){

      if(!p.active)continue;

      p.x +=
        p.vx*dt;

      p.y +=
        p.vy*dt;

      p.vy +=
        p.gravity*dt;

      p.vx *=
        .97;

      p.vy *=
        .97;

      p.life -=
        dt;

      if(
        p.life <= 0
      ){

        p.active =
          false;

      }

    }

    for(
      const r of
      ripples
    ){

      if(!r.active)continue;

      r.radius +=
        (
          r.maxRadius -
          r.radius
        )*.24;

      r.life -=
        dt;

      if(
        r.life <= 0
      ){

        r.active =
          false;

      }

    }

    for(
      const f of
      floaters
    ){

      if(!f.active)continue;

      f.y +=
        f.vy*dt;

      f.vy *=
        .97;

      f.life -=
        dt;

      if(
        f.life <= 0
      ){

        f.active =
          false;

      }

    }

  }

  function drawFX(){

    /*
     * Ripple
     */
    for(
      const r of
      ripples
    ){

      if(!r.active)continue;

      ctx.globalAlpha =
        clamp(
          r.life/.38,
          0,
          1
        );

      ctx.strokeStyle =
        r.color;

      ctx.lineWidth =
        r.width;

      ctx.beginPath();

      ctx.arc(
        r.x,
        r.y,
        r.radius,
        0,
        Math.PI*2
      );

      ctx.stroke();

    }

    /*
     * Particles
     */
    for(
      const p of
      particles
    ){

      if(!p.active)continue;

      ctx.globalAlpha =
        clamp(
          p.life/
          p.maxLife,
          0,
          1
        );

      ctx.fillStyle =
        p.color;

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        p.size,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

    /*
     * Floating text
     */
    for(
      const f of
      floaters
    ){

      if(!f.active)continue;

      ctx.globalAlpha =
        clamp(
          f.life/
          f.maxLife,
          0,
          1
        );

      ctx.fillStyle =
        f.color;

      ctx.font =
        '1000 24px system-ui';

      ctx.textAlign =
        'center';

      ctx.textBaseline =
        'middle';

      ctx.shadowColor =
        f.color;

      ctx.shadowBlur =
        14;

      ctx.fillText(
        f.text,
        f.x,
        f.y
      );

      ctx.shadowBlur =
        0;

    }

    ctx.globalAlpha =
      1;

  }

  /* =========================================================
     TOAST
  ========================================================= */

  function showToast(
    text,
    color
  ){

    el.toast.textContent =
      text;

    el.toast.style.color =
      color ||
      '#ffd45c';

    el.toast.classList.remove(
      'show'
    );

    void el.toast.offsetWidth;

    el.toast.classList.add(
      'show'
    );

    clearTimeout(
      showToast.t
    );

    showToast.t =
      setTimeout(
        () =>
          el.toast
            .classList
            .remove('show'),
        420
      );

  }

  /* =========================================================
     ITEM HIT TEST
  ========================================================= */

  function findItemAt(
    x,
    y,
    pointerId
  ){

    const now = gameNow();
    let best = null;
    let bestD2 = Infinity;
    let snapBest = null;
    let snapD2 = Infinity;

    // One scan instead of two; compare squared distance to avoid Math.hypot.
    for(const it of items.values()){

      if(it.claimed || now > it.expiresAt)continue;

      const p = itemPos(it, now);

      if(
        p.offscreen ||
        p.y < -80 ||
        p.y > H+120
      )continue;

      const dx = x-p.x;
      const dy = y-p.y;
      const d2 = dx*dx + dy*dy;

      const radius =
        (
          it.type === 'bomb'
            ? 45
            : 41
        ) * it.size;

      const primary =
        Math.max(
          CFG.HIT_RADIUS,
          radius
        );

      const primary2 = primary*primary;

      if(d2 <= primary2){
        if(d2 < bestD2){
          bestD2 = d2;
          best = it;
        }
        continue;
      }

      const snap2 = CFG.SNAP_RADIUS*CFG.SNAP_RADIUS;

      if(d2 <= snap2 && d2 < snapD2){
        snapD2 = d2;
        snapBest = it;
      }
    }

    return best || snapBest;
  }

  /* =========================================================
     CLAIM EFFECT
  ========================================================= */

  function claimEffect(
    it,
    delta,
    x,
    y
  ){

    /*
     * 如果沒有傳入座標
     * 就使用物件原座標
     */
    if(
      !Number.isFinite(x) ||
      !Number.isFinite(y)
    ){

      const p =
        itemPos(
          it,
          gameNow()
        );

      x =
        p.x;

      y =
        p.y;

    }

    /*
     * 立即視覺消失
     */
    it.claimed =
      true;

    /*
     * 立即 FX
     */
    ripple(
      x,
      y,
      COLORS[it.type] ||
      '#fff'
    );

    burst(
      x,
      y,
      COLORS[it.type] ||
      '#fff',
      it.type === 'bomb'
        ? 16
        : 10
    );

    floatingText(
      x,
      y-18,
      delta >= 0
        ? '+'+Math.round(delta)
        : String(
            Math.round(delta)
          ),
      delta >= 0
        ? COLORS[it.type]
        : '#ff405d'
    );

    /*
     * 觸控按下回饋
     */
    if(delta >= 0){

      sfx(
        it.type
      );

    }else{

      sfx(
        'bomb'
      );

      /*
       * 炸彈畫面震動
       */
      if(
        navigator.vibrate
      ){

        try{

          navigator.vibrate(
            [20,25,35]
          );

        }catch(e){}

      }

    }

  }

  /* =========================================================
     SCORE
  ========================================================= */

  function scoreItem(
    player,
    it
  ){

    player.actions++;

    /*
     * 炸彈
     */
    if(
      it.type ===
      'bomb'
    ){

      player.combo =
        0;

      player.score =
        Math.max(
          0,
          player.score +
          VALUE.bomb
        );

      return VALUE.bomb;

    }

    /*
     * Combo
     */
    const mult =
      1 +
      Math.min(
        player.combo,
        20
      )*.10;

    const gained =
      Math.floor(
        VALUE[it.type]*
        mult
      );

    player.score =
      Math.min(
        Number.MAX_SAFE_INTEGER,
        player.score +
        Math.max(
          0,
          gained
        )
      );

    player.combo =
      Math.min(
        30,
        player.combo+1
      );

    player.bestCombo =
      Math.max(
        player.bestCombo,
        player.combo
      );

    return gained;

  }

  /* =========================================================
     HOST CLAIM
  ========================================================= */

  function hostClaim(
    playerId,
    itemId,
    actionId,
    hitX,
    hitY
  ){

    if(
      !isHost() ||
      phase !==
      STATES.PLAYING
    )return;

    if(
      !actionId ||
      seenActions.has(
        actionId
      )
    )return;

    const p =
      players.get(
        String(playerId)
      );

    const it =
      items.get(
        String(itemId)
      );

    if(
      !p ||
      !it ||
      it.claimed
    )return;

    const now =
      gameNow();

    if(
      now <
      it.spawnAt-120 ||
      now >
      it.expiresAt
    )return;

    /*
     * 先鎖定
     */
    seenActions.set(
      actionId,
      now
    );

    it.claimed =
      true;

    const delta =
      scoreItem(
        p,
        it
      );

    /*
     * Host 立即本地刪除
     */
    items.delete(
      it.id
    );

    send(
      'BBG_CLAIMED',
      {
        roundId,

        playerId:
          p.id,

        itemId:
          it.id,

        type:
          it.type,

        delta,

        score:
          p.score,

        combo:
          p.combo,

        bestCombo:
          p.bestCombo,

        actions:
          p.actions

      }
    );

    if(
      p.id ===
      ME.id
    ){

      claimEffect(
        it,
        delta,
        hitX,
        hitY
      );

    }

  }

  /* =========================================================
     PLAYER CLAIM
  ========================================================= */

  function playerClaim(
    it,
    pointerId,
    x,
    y
  ){

    if(
      phase !== STATES.PLAYING &&
      phase !== STATES.DRAINING
    )return;

    if(
      !it ||
      it.claimed
    )return;

    const now =
      gameNow();

    /*
     * 每根手指自己的去重
     */
    const key =
      pointerId +
      ':' +
      it.id;

    const previous =
      pointerClaims.get(
        key
      );

    if(
      previous &&
      now -
      previous <
      CFG.TOUCH_DEDUPE_MS
    ){

      return;

    }

    pointerClaims.set(
      key,
      now
    );

    /*
     * 立刻鎖定本地物件
     *
     * 這是「按下就有感覺」的核心
     */
    it.claimed =
      true;

    /*
     * 如果 Host
     */
    const actionId =
      nextAction();

    if(
      isHost()
    ){

      /*
       * 先解鎖，交給 hostClaim
       */
      it.claimed =
        false;

      hostClaim(
        ME.id,
        it.id,
        actionId,
        x,
        y
      );

    }else{

      /*
       * 非 Host
       *
       * 先本地顯示 feedback
       */
      const visualCopy =
        {
          ...it,
          claimed:false
        };

      const optimisticPlayer =
        players.get(
          ME.id
        );

      if(
        optimisticPlayer
      ){

        /*
         * 只計算預覽，不直接改本地分數。
         * 最終分數一律由 Host 的 BBG_CLAIMED 回傳，
         * 避免 Web 版同步時出現加分後又被扣回 0。
         */
        const mult =
          1 +
          Math.min(
            optimisticPlayer.combo,
            20
          )*.10;

        const delta =
          visualCopy.type === 'bomb'
            ? VALUE.bomb
            : Math.floor(
                VALUE[visualCopy.type]*mult
              );

        claimEffect(
          visualCopy,
          delta,
          x,
          y
        );

      }

      items.delete(
        it.id
      );

      send(
        'BBG_CLAIM',
        {
          roundId,

          playerId:
            ME.id,

          itemId:
            it.id,

          actionId,

          hitX:x,

          hitY:y

        }
      );

    }

  }

  /* =========================================================
     POINTER COORDINATE
  ========================================================= */

  function canvasPoint(
    e
  ){

    const r =
      canvas.getBoundingClientRect();

    return {

      x:
        (
          e.clientX -
          r.left
        )*
        (
          W/
          r.width
        ),

      y:
        (
          e.clientY -
          r.top
        )*
        (
          H/
          r.height
        )

    };

  }

  /* =========================================================
     MULTI TOUCH INPUT
  ========================================================= */

  function handlePointerDown(
    e
  ){

    e.preventDefault();

    e.stopPropagation();

    initAudio();

    /*
     * 捕獲 pointer
     */
    try{

      canvas.setPointerCapture(
        e.pointerId
      );

    }catch(err){}

    if(
      phase !==
      STATES.PLAYING
    )return;

    const p =
      canvasPoint(e);

    const it =
      findItemAt(
        p.x,
        p.y,
        e.pointerId
      );

    if(!it)return;

    /*
     * 這裡每根手指各自執行
     *
     * 因此：
     * 手指 A → 金幣 A
     * 手指 B → 金幣 B
     * 手指 C → 金幣 C
     *
     * 可以同時成立
     */
    playerClaim(
      it,
      e.pointerId,
      p.x,
      p.y
    );

  }

  function handlePointerUp(
    e
  ){

    try{

      canvas.releasePointerCapture(
        e.pointerId
      );

    }catch(err){}

  }

  canvas.addEventListener(
    'pointerdown',
    handlePointerDown,
    {
      passive:false
    }
  );

  canvas.addEventListener(
    'pointerup',
    handlePointerUp,
    {
      passive:true
    }
  );

  canvas.addEventListener(
    'pointercancel',
    handlePointerUp,
    {
      passive:true
    }
  );

  canvas.addEventListener(
    'pointerleave',
    handlePointerUp,
    {
      passive:true
    }
  );

  canvas.addEventListener(
    'contextmenu',
    e =>
      e.preventDefault()
  );

  /*
   * 防止舊手機瀏覽器把 Canvas
   * 當成圖片 / 手勢
   */
  canvas.style.touchAction =
    'none';

  /* =========================================================
     NETWORK EVENTS
  ========================================================= */

  function broadcastState(
    force=false
  ){

    if(!isHost())return;

    const wallNow =
      Date.now();

    if(
      !force &&
      wallNow -
      lastStateSent <
      CFG.STATE_MS
    )return;

    lastStateSent =
      wallNow;

    const now =
      gameNow();

    send(
      'BBG_STATE',
      {

        roundId,

        hostId,

        phase,

        entryCost:
          selectedEntry,

        entryFees:
          roundEntryFees,

        seed:
          roundSeed,

        hostNow:
          now,

        startAt,

        phaseEndsAt,

        drainEndsAt,

        winnerId,

        reason,

        players:
          sortedPlayers()
            .map(
              p => ({

                id:p.id,

                username:
                  p.username,

                avatar:
                  p.avatar,

                joinedAt:
                  p.joinedAt,

                score:
                  clamp(
                    p.score,
                    0,
                    Number.MAX_SAFE_INTEGER
                  ),

                combo:
                  clamp(
                    p.combo,
                    0,
                    30
                  ),

                bestCombo:
                  clamp(
                    p.bestCombo,
                    0,
                    30
                  ),

                actions:
                  clamp(
                    p.actions,
                    0,
                    9999
                  ),

                online:
                  !!p.online,

                lastSeen:
                  p.lastSeen

              })
            )

      }
    );

  }

  function addRemotePlayerState(
    p
  ){

    const q =
      addPlayer(p);

    if(!q)return;

    const incomingActions =
      clamp(
        p.actions,
        0,
        9999
      );

    /*
     * 防止舊的 BBG_STATE 把剛搶到的分數覆蓋回 0。
     * actions 是本局單調遞增的版本號；
     * 只有較新的狀態才可以覆蓋分數。
     */
    if(
      phase === STATES.PLAYING &&
      incomingActions < q.actions
    ){

      q.online =
        !!p.online;

      q.lastSeen =
        Date.now();

      return;

    }

    q.score =
      clamp(
        p.score,
        0,
        Number.MAX_SAFE_INTEGER
      );

    q.combo =
      clamp(
        p.combo,
        0,
        30
      );

    q.bestCombo =
      clamp(
        p.bestCombo,
        0,
        30
      );

    q.actions =
      incomingActions;

    q.online =
      !!p.online;

    q.lastSeen =
      Date.now();

  }

  /* =========================================================
     HANDLE NETWORK EVENT
  ========================================================= */

  function handleEvent(
    name,
    payload,
    sender
  ){

    if(
      name ===
      'BBG_HELLO' ||
      name ===
      'BBG_HEARTBEAT'
    ){

      if(
        payload.player
      ){

        addPlayer(
          payload.player
        );
        readyPlayersSet.add(String(payload.player.id));
        updateAutoStartNotice();

      }

      if(
        payload.requestState &&
        isHost()
      ){

        broadcastState(
          true
        );

      }

      return;

    }

    if(name === 'BBG_ENTRY_PAID'){
      const payerId = String(payload?.userId ?? sender ?? '');
      const entryRound = Number(payload?.roundId);
      const entryFee = Number(payload?.entryFee);
      if(!payerId || (sender != null && String(sender) !== payerId) ||
         entryRound !== roundId + 1 || !CFG.ENTRY.includes(entryFee) || !players.has(payerId)) return;
      pendingEntryFees.set(payerId, entryFee);
      if(!isHost()) return;

      const expectedPlayers = onlinePlayers().map(p => String(p.id));
      const paidCount = expectedPlayers.filter(id => pendingEntryFees.has(id)).length;
      if(expectedPlayers.length && paidCount === expectedPlayers.length){
        roundEntryFees = expectedPlayers.map(userId => ({userId, entryFee:pendingEntryFees.get(userId)}));
        selectedEntry = pendingEntryFees.get(String(ME.id)) || selectedEntry;
        pendingEntryFees.clear();
        startRoundAfterEntry();
      }else{
        el.start.textContent = `等待入場 ${paidCount}/${expectedPlayers.length}`;
        showToast(`已繳入場費，等待其他玩家 ${paidCount}/${expectedPlayers.length}`, '#ffd45c');
      }
      return;
    }

    if(
      name ===
      'BBG_HOST'
    ){

      if(
        payload.hostId
      ){

        hostId =
          String(
            payload.hostId
          );

      }

      return;

    }

    if(
      name ===
      'BBG_STATE'
    ){

      syncGameClock(payload.hostNow);

      if(
        !Number.isFinite(
          Number(
            payload.roundId
          )
        ) ||
        Number(
          payload.roundId
        ) <
        roundId
      )return;

      if(
        Number(
          payload.roundId
        ) >
        roundId
      ){

        roundId =
          Number(
            payload.roundId
          );

        resetRoundData();

        currentPaid =
          false;

        currentSettled =
          false;

        gameOverCalled =
          false;

      }

      hostId =
        payload.hostId
          ? String(
              payload.hostId
            )
          : hostId;

      phase =
        Object.values(
          STATES
        ).includes(
          payload.phase
        )
        ? payload.phase
        : phase;

      selectedEntry =
        CFG.ENTRY.includes(
          Number(
            payload.entryCost
          )
        )
        ? Number(
            payload.entryCost
          )
        : selectedEntry;

      if(Array.isArray(payload.entryFees)) roundEntryFees = payload.entryFees;

      roundSeed =
        finite(
          payload.seed,
          0
        );

      startAt =
        finite(
          payload.startAt,
          0
        );

      phaseEndsAt =
        finite(
          payload.phaseEndsAt,
          0
        );

      drainEndsAt =
        finite(
          payload.drainEndsAt,
          phase === STATES.DRAINING
            ? phaseEndsAt + CFG.DRAIN_GRACE_MS
            : 0
        );

      winnerId =
        payload.winnerId
          ? String(
              payload.winnerId
            )
          : null;

      reason =
        String(
          payload.reason ||
          ''
        );

      if(
        Array.isArray(
          payload.players
        )
      ){

        payload.players.forEach(
          addRemotePlayerState
        );

      }

      if(
        phase ===
        STATES.RESULT
      ){

        finishResult();

      }

      return;

    }

    if(
      name ===
      'BBG_ROUND_START'
    ){

      syncGameClock(payload.hostNow);

      if(
        !Number.isFinite(
          Number(
            payload.roundId
          )
        ) ||
        Number(
          payload.roundId
        ) <
        roundId
      )return;

      roundId =
        Number(
          payload.roundId
        );

      selectedEntry =
        CFG.ENTRY.includes(
          Number(
            payload.entryCost
          )
        )
        ? Number(
            payload.entryCost
          )
        : 100;

      if(Array.isArray(payload.entryFees)) roundEntryFees = payload.entryFees;
      currentPaid = roundEntryFees.some(row => String(row.userId) === String(ME.id));

      roundSeed =
        finite(
          payload.seed,
          0
        );

      startAt =
        finite(
          payload.startAt,
          gameNow() +
          CFG.COUNTDOWN_MS
        );

      phaseEndsAt =
        startAt;

      drainEndsAt =
        0;

      winnerId =
        null;

      reason =
        '';

      resetRoundData();

      phase =
        STATES.COUNTDOWN;

      countdownShown =
        -1;

      showToast(
        '準備',
        '#ffd45c'
      );

      sfx(
        'start'
      );

      return;

    }

    if(
      name ===
      'BBG_PLAY'
    ){

      syncGameClock(payload.hostNow);

      if(
        !validRound(
          payload.roundId
        )
      )return;

      phase =
        STATES.PLAYING;

      startAt =
        finite(
          payload.startAt,
          gameNow()
        );

      phaseEndsAt =
        finite(
          payload.phaseEndsAt,
          startAt +
          CFG.ROUND_MS
        );

      drainEndsAt =
        finite(
          payload.drainEndsAt,
          phaseEndsAt +
          Math.max(
            CFG.DRAIN_GRACE_MS,
            CFG.ITEM_LIFE +
            CFG.MAX_SPAWN_DELAY_MS
          )
        );

      showToast(
        '搶！',
        '#ffd45c'
      );

      sfx(
        'start'
      );

      return;

    }

    if(
      name ===
      'BBG_DROP_BATCH'
    ){

      if(
        !validRound(
          payload.roundId
        )
      )return;

      acceptBatch(
        payload.items
      );

      return;

    }

    if(
      name ===
      'BBG_CLAIM'
    ){

      if(
        !isHost() ||
        !validRound(
          payload.roundId
        )
      )return;

      const id =
        String(
          payload.playerId ||
          sender ||
          ''
        );

      /*
       * 防止偽造其他玩家 ID
       */
      if(
        sender &&
        id !==
        sender
      )return;

      hostClaim(
        id,
        String(
          payload.itemId ||
          ''
        ),
        String(
          payload.actionId ||
          ''
        ),
        finite(
          payload.hitX,
          0
        ),
        finite(
          payload.hitY,
          0
        )
      );

      return;

    }

    if(
      name ===
      'BBG_CLAIMED'
    ){

      if(
        !validRound(
          payload.roundId
        )
      )return;

      const p =
        players.get(
          String(
            payload.playerId ||
            ''
          )
        );

      const it =
        items.get(
          String(
            payload.itemId ||
            ''
          )
        );

      if(it){

        /*
         * 如果 Host 已經處理
         * 就不要再次播放兩次 FX
         */
        const isMe =
          String(
            payload.playerId ||
            ''
          ) ===
          ME.id;

        if(!it.claimed){

          it.claimed =
            true;

          if(isMe){

            const point =
              itemPos(
                it,
                Date.now()
              );

            claimEffect(
              it,
              finite(
                payload.delta,
                0
              ),
              point.x,
              point.y
            );

          }

        }

        items.delete(
          it.id
        );

      }

      if(p){

        const incomingActions =
          clamp(
            payload.actions,
            0,
            9999
          );

        if(
          incomingActions >=
          p.actions
        ){

          p.score =
            clamp(
              payload.score,
              0,
              Number.MAX_SAFE_INTEGER
            );

          p.combo =
          clamp(
            payload.combo,
            0,
            30
          );

          p.bestCombo =
            clamp(
              payload.bestCombo,
              0,
              30
            );

          p.actions =
            incomingActions;

        }

      }

      return;

    }

    if(
      name ===
      'BBG_ROUND_DRAIN'
    ){

      syncGameClock(payload.hostNow);

      if(!validRound(payload.roundId))return;

      if(phase === STATES.RESULT)return;

      phase =
        STATES.DRAINING;

      phaseEndsAt =
        finite(
          payload.phaseEndsAt,
          phaseEndsAt
        );

      drainEndsAt =
        finite(
          payload.drainEndsAt,
          phaseEndsAt + CFG.DRAIN_GRACE_MS
        );

      reason =
        '時間到：剩餘物件收尾中';

      return;

    }

    if(
      name ===
      'BBG_ROUND_END'
    ){

      syncGameClock(payload.hostNow);

      if(
        !validRound(
          payload.roundId
        )
      )return;

      winnerId =
        payload.winnerId
          ? String(
              payload.winnerId
            )
          : null;

      reason =
        String(
          payload.reason ||
          '時間到：依最終分數排名'
        );

      phase =
        STATES.RESULT;

      if(
        Array.isArray(
          payload.result
        )
      ){

        stateResult =
          payload.result;

      }

      finishResult();

      return;

    }

  }

  /* =========================================================
     PURCHASE
  ========================================================= */

  function requestEntry(){
    if(purchasing || (phase === STATES.WAIT_HOST && currentPaid)) return;
    selectedEntry = myEntryChoice;
    if(DEV){
      currentPaid = true;
      startRoundAfterEntry();
      return;
    }
    if(!gameRoomId){
      gameRoomId = roomId || 'room_session';
    }
    if(!gameSessionId){
      gameSessionId = gameRoomId;
    }

    pendingEntryRound = Math.max(1, Number(roundId) + 1);
    pendingPurchase = `boomgold_entry_${pendingEntryRound}`;
    purchasing = true;
    phase = STATES.PURCHASING;
    syncUI();
    const request = {action:'requestPurchase', itemId:pendingPurchase, cost:selectedEntry};
    if(window.BoomRoomSDK && typeof window.BoomRoomSDK.requestPurchase === 'function'){
      window.BoomRoomSDK.requestPurchase(request.itemId, request.cost);
    }else if(window.parent !== window){
      window.parent.postMessage(JSON.stringify(request), '*');
    }else{
      purchasing = false;
      phase = STATES.MENU;
      syncUI();
      showToast('無法連線到銀幣結算服務', '#ff7b92');
    }
  }

  window.onPurchaseSuccess =
  function(itemId){

    if(
      !purchasing ||
      itemId !==
      pendingPurchase
    )return;

    purchasing =
      false;

    pendingPurchase =
      '';

    currentPaid =
      true;
    const paidRound = pendingEntryRound;
    pendingEntryRound = 0;
    phase = STATES.WAIT_HOST;
    if(el.start) el.start.textContent = '入場完成，等待玩家付款…';
    syncUI();
    send('BBG_ENTRY_PAID', {
      roundId:paidRound,
      userId:ME.id,
      entryFee:selectedEntry
    });
    if(isHost()){
      const expectedPlayers = onlinePlayers().map(p => String(p.id));
      const paidCount = expectedPlayers.filter(id => pendingEntryFees.has(id)).length;
      showToast(`入場已付款，等待其他玩家 ${paidCount}/${expectedPlayers.length}`, '#ffd45c');
    }

  };

  window.onPurchaseFailed =
  function(itemId){

    if(
      itemId !==
      pendingPurchase
    )return;

    purchasing =
      false;

    pendingPurchase =
      '';

    if(el.start) el.start.textContent = '開始搶金';

    phase =
      STATES.MENU;

    syncUI();

    showToast(
      'Entry 未完成',
      '#ff7b92'
    );

  };

  /* =========================================================
     START ROUND
  ========================================================= */

  function startRoundAfterEntry(){

    try { initAudio(); } catch(_) {}

    electHost();

    roundId =
      Math.max(
        0,
        roundId
      )+1;

    roundSeed =
      (
        Date.now() ^
        Math.floor(
          Math.random()*
          0x7fffffff
        )
      ) >>> 0;

    winnerId =
      null;

    reason =
      '';

    resetRoundData();

    currentPaid =
      true;

    currentSettled =
      false;

    gameOverCalled =
      false;

    resultStartedAt =
      0;

    if(resultGameOverTimer){
      clearTimeout(
        resultGameOverTimer
      );
      resultGameOverTimer = null;
    }

    phase =
      STATES.COUNTDOWN;

    startAt =
      gameNow() +
      CFG.COUNTDOWN_MS;

    phaseEndsAt =
      startAt;

    drainEndsAt =
      0;

    lastSpawn =
      0;

    send(
      'BBG_ROUND_START',
      {
        roundId,

        entryCost:
          selectedEntry,

        entryFees:
          roundEntryFees,

        seed:
          roundSeed,

        hostNow:
          gameNow(),

        startAt,

        maxDuration:
          CFG.ROUND_MS
      }
    );

    broadcastState(
      true
    );

    countdownShown =
      -1;

    syncUI();

    // The renderer is already running continuously; no second loop is needed.

  }

  function startPlaying(){

    if(
      !isHost() ||
      phase !==
      STATES.COUNTDOWN
    )return;

    phase =
      STATES.PLAYING;

    startAt =
      gameNow();

    phaseEndsAt =
      startAt +
      CFG.ROUND_MS;

    drainEndsAt =
      phaseEndsAt +
      Math.max(
        CFG.DRAIN_GRACE_MS,
        CFG.ITEM_LIFE +
        CFG.MAX_SPAWN_DELAY_MS
      );

    lastSpawn =
      0;

    send(
      'BBG_PLAY',
      {
        roundId,
        hostNow:gameNow(),
        startAt,
        phaseEndsAt,
        drainEndsAt
      }
    );

    broadcastState(
      true
    );

    showToast(
      '搶！',
      '#ffd45c'
    );

    sfx(
      'start'
    );

  }

  /* =========================================================
     SETTLE
  ========================================================= */

  function settleReward(){

    if(
      currentSettled
    )return 0;

    currentSettled =
      true;

    const rows =
      stateResult.length
        ? stateResult
        : [
            ...players.values()
          ]
          .sort(
            (a,b) =>
              b.score -
              a.score
          );

    const idx =
      rows.findIndex(
        r =>
          String(r.id) ===
          ME.id
      );

    const me = players.get(ME.id);
    const myScore = me ? (me.score || 0) : 0;
    const poolTotal = roundEntryFees.reduce((sum, entry) => sum + Math.max(0, Number(entry.entryFee) || 0), 0);
    const safe = idx === 0 ? Math.floor(poolTotal) : 0;

    if (!gameOverCalled) {
      gameOverCalled = true;

      const reqData = {
        action: 'game_over',
        winAmount: 0,
        score: myScore,
        poolSettlement: rows.length > 0 && isHost() ? {
          roomId:gameRoomId,
          sessionId:gameSessionId,
          roundId,
          winnerId:rows[0]?.id || ME.id
        } : null
      };

      /*
       * 結算畫面至少完整展示 3 秒。
       * 不要在 finishResult() 當下就通知 Flutter 關閉 WebView，
       * 否則玩家只會看到一閃而過的結算。
       */
      resultStartedAt = Date.now();

      resultGameOverTimer = setTimeout(() => {
        resultGameOverTimer = null;

        if (window.BoomRoomSDK && typeof window.BoomRoomSDK.gameOver === 'function') {
          try {
            window.BoomRoomSDK.gameOver(0, myScore, reqData.poolSettlement);
          } catch (_) {}
        } else if (window.parent !== window) {
          try {
            window.parent.postMessage(JSON.stringify(reqData), '*');
          } catch (_) {}
        }
      }, 3000);
    }

    return safe;

  }

  /* =========================================================
     HOST END
  ========================================================= */

  function finishHost(){

    if(
      !isHost() ||
      phase !==
      STATES.PLAYING
    )return;

    const now =
      gameNow();

    /*
     * 先進入收尾，而不是直接切 RESULT。
     * 這樣倒數最後幾秒出生的物件還能完整落下 / 被搶。
     */
    phase =
      STATES.DRAINING;

    reason =
      '時間到：剩餘物件收尾中';

    drainEndsAt =
      Math.max(
        now + CFG.DRAIN_GRACE_MS,
        phaseEndsAt +
        CFG.ITEM_LIFE +
        CFG.MAX_SPAWN_DELAY_MS
      );

    send(
      'BBG_ROUND_DRAIN',
      {
        roundId,
        hostNow:now,
        phase,
        phaseEndsAt,
        drainEndsAt
      }
    );

    broadcastState(
      true
    );

    showToast(
      '收尾！',
      '#ffd45c'
    );

    sfx(
      'end'
    );

  }

  function finalizeHostRound(){

    if(
      !isHost() ||
      phase !==
      STATES.DRAINING
    )return;

    const rows =
      sortedPlayers()
        .filter(
          p =>
            p.online ||
            p.score > 0
        )
        .sort(
          (a,b) =>
            b.score -
            a.score ||
            b.bestCombo -
            a.bestCombo ||
            a.joinedAt -
            b.joinedAt
        );

    winnerId =
      rows[0]?.id ||
      ME.id;

    stateResult =
      rows.map(
        p => ({

          id:p.id,

          username:
            p.username,

          score:
            Math.min(
              Number.MAX_SAFE_INTEGER,
              p.score
            ),

          combo:
            p.bestCombo

        })
      );

    reason =
      '時間到：依最終分數排名';

    phase =
      STATES.RESULT;

    const now =
      gameNow();

    send(
      'BBG_ROUND_END',
      {
        roundId,
        hostNow:now,
        winnerId,
        reason,
        result:stateResult
      }
    );

    broadcastState(
      true
    );

    finishResult();

    sfx(
      winnerId ===
      ME.id
        ? 'win'
        : 'end'
    );

  }
  /* =========================================================
     RESULT
  ========================================================= */

  function finishResult(){

    if(
      phase !==
      STATES.RESULT
    )return;

    items.clear();

    const rows =
      stateResult.length
        ? stateResult
        : [
            ...players.values()
          ]
          .sort(
            (a,b) =>
              b.score -
              a.score
          )
          .map(
            p => ({

              id:p.id,

              username:
                p.username,

              score:p.score,

              combo:
                p.bestCombo

            })
          );

    stateResult =
      rows;

    const meIndex =
      rows.findIndex(
        r =>
          String(r.id) ===
          ME.id
      );

    const won =
      meIndex === 0;

    const reward =
      settleReward();

    el.resultTitle.textContent =
      won
        ? '第一名！'
        : '本局完成';

    el.resultTitle.style.color =
      won
        ? '#ffd45c'
        : '#f8fbff';

    el.reward.textContent =
      (won ? '+' + reward : '+0') +
      ' 銀幣';

    el.reward.style.color =
      won
        ? '#65ffad'
        : '#9aa4bb';

    el.reason.textContent =
      reason ||
      '本局結束';

    el.rankList.innerHTML =
      '';

    rows
      .slice(
        0,
        10
      )
      .forEach(
        (r,i) => {

          const row =
            document.createElement(
              'div'
            );

          row.className =
            'rank-row' +
            (
              String(r.id) ===
              ME.id
                ? ' me'
                : ''
            );

          const safe =
            String(
              r.username ||
              '玩家'
            ).replace(
              /[&<>"']/g,
              c =>
                ({
                  '&':'&amp;',
                  '<':'&lt;',
                  '>':'&gt;',
                  '"':'&quot;',
                  "'":'&#39;'
                }[c])
            );

          row.innerHTML =
            '<span>#' +
            (i+1) +
            '</span>' +

            '<span>' +
            safe +
            ' · Combo ' +
            Math.round(
              r.combo || 0
            ) +
            '</span>' +

            '<b>' +
            Math.round(
              r.score || 0
            ) +
            '</b>';

          el.rankList
            .appendChild(
              row
            );

        }
      );

    el.hud.style.display =
      'none';

    el.result.style.display =
      'grid';

    el.wait.disabled =
      true;

    el.wait.textContent =
      '結算中 3 秒…';

    setTimeout(
      () => {

        if(phase !== STATES.RESULT)return;

        el.wait.disabled =
          false;

        el.wait.textContent =
          '等待房主重新開局';

      },
      CFG.RESULT_DISPLAY_MS
    );

  }

  /* =========================================================
     UI
  ========================================================= */

  let lastUiSyncTs = -Infinity;
  let lastUiRound = -1;
  let lastUiPhase = '';

  function syncUI(){

    el.round.textContent =
      'ROUND ' +
      String(
        Math.max(
          1,
          roundId
        )
      ).padStart(
        2,
        '0'
      );

    const uiNow =
      gameNow();

    const remain =
      phase ===
      STATES.COUNTDOWN

        ? Math.max(
            0,
            Math.ceil(
              (
                phaseEndsAt -
                uiNow
              ) /
              1000
            )
          )

        : phase ===
          STATES.PLAYING

          ? Math.max(
              0,
              Math.ceil(
                (
                  phaseEndsAt -
                  uiNow
                ) /
                1000
              )
            )

          : phase ===
            STATES.DRAINING

            ? 0

            : 45;

    el.timer.textContent =
      String(remain);

    el.timer.classList.toggle(
      'danger',
      phase ===
      STATES.PLAYING &&
      remain <= 5
    );

    const me =
      players.get(
        ME.id
      ) ||
      addPlayer(
        ME
      );

    const observed =
      sortedPlayers()
        .filter(
          p =>
            p.online ||
            p.score > 0
        );

    const top =
      observed
        .sort(
          (a,b) =>
            b.score -
            a.score
        )[0];

    el.myScore.textContent =
      Math.round(
        clamp(
          me.score,
          0,
          Number.MAX_SAFE_INTEGER
        )
      );

    el.topScore.textContent =
      Math.round(
        clamp(
          top?.score ||
          0,
          0,
          Number.MAX_SAFE_INTEGER
        )
      );

    el.combo.textContent =
      Math.round(
        me.combo
      );

    el.bestCombo.textContent =
      Math.round(
        me.bestCombo
      );

    el.players.textContent =
      String(
        Math.max(
          1,
          observed.length
        )
      );

    if(
      phase ===
      STATES.PLAYING
    ){

      el.tip.textContent =
        '多指一起搶也可以｜🪙 金幣直接點｜💣 紅色炸彈不要碰';

    }else
    if(
      phase ===
      STATES.DRAINING
    ){

      el.tip.textContent =
        '時間到｜剩餘掉落物仍可搶，正在收尾';

    }else{

      el.tip.textContent =
        '本局結束後等待房主重新開局';

    }

    el.lobby.style.display =
      (
        phase ===
        STATES.MENU ||
        phase ===
        STATES.WAIT_HOST
      )
        ? 'flex'
        : 'none';

    el.hud.style.display =
      (
        phase ===
        STATES.MENU ||
        phase ===
        STATES.RESULT
      )
        ? 'none'
        : 'block';

  }

  /*
   * Keep DOM work out of the 60fps render path.
   * State transitions still call syncUI() directly; the loop only refreshes
   * dynamic HUD values about 10 times per second.
   */
  function syncUIFrame(ts){
    if(
      phase !== lastUiPhase ||
      roundId !== lastUiRound ||
      ts-lastUiSyncTs >= CFG.UI_MS
    ){
      syncUI();
      lastUiSyncTs = ts;
      lastUiPhase = phase;
      lastUiRound = roundId;
    }
  }

  /* =========================================================
     START BUTTON
  ========================================================= */

  function handleStart(
    e
  ){

    if(e){

      e.preventDefault();

      e.stopPropagation();

    }

    if(
      phase ===
      STATES.PURCHASING ||
      phase ===
      STATES.COUNTDOWN ||
      phase ===
      STATES.PLAYING ||
      phase ===
      STATES.DRAINING ||
      phase ===
      STATES.RESULT ||
      (phase === STATES.WAIT_HOST && currentPaid)
    )return;

    initAudio();

    if(
      phase ===
      STATES.MENU ||
      phase ===
      STATES.WAIT_HOST
    ){

      if(
        phase ===
        STATES.MENU
      ){

        el.lobby.style.display =
          'none';

        el.hud.style.display =
          'block';

      }

      requestEntry();

    }

  }

  if(el.start){
    el.start.addEventListener(
      'pointerup',
      handleStart,
      {
        passive:false
      }
    );

    el.start.addEventListener(
      'click',
      handleStart,
      {
        passive:false
      }
    );
  }

  window.startBoomGold =
    handleStart;

  /* =========================================================
     ENTRY
  ========================================================= */

  for(
    const b of
    document.querySelectorAll(
      '.entry'
    )
  ){

    const pick =
      e => {

        if(e){

          e.preventDefault();

          e.stopPropagation();

        }

        if(
          phase !==
          STATES.MENU
        )return;

        const v =
          CFG.ENTRY.includes(
            Number(
              b.dataset.entry
            )
          )
          ? Number(
              b.dataset.entry
            )
          : 100;

        selectedEntry =
          v;

        myEntryChoice =
          v;

        document
          .querySelectorAll(
            '.entry'
          )
          .forEach(
            x =>
              x.classList.toggle(
                'active',
                x === b
              )
          );

        initAudio();

      };

    b.addEventListener(
      'pointerup',
      pick,
      {
        passive:false
      }
    );

    b.addEventListener(
      'click',
      pick,
      {
        passive:false
      }
    );

  }

  /* =========================================================
     WAIT
  ========================================================= */

  el.wait.addEventListener(
    'click',
    e => {

      e.preventDefault();

      showToast(
        '等待房主重新開局',
        '#ffd45c'
      );

    }
  );

  /* =========================================================
     HEARTBEAT
  ========================================================= */

  let totalRoomPlayersCount = 1;
  let readyPlayersSet = new Set();

  function updateAutoStartNotice() {
    const notice = document.getElementById("autoStartNotice");
    if (!notice) return;
    const currentCount = readyPlayersSet.size;
    notice.textContent = currentCount >= totalRoomPlayersCount
      ? "✅ 玩家已到齊，請選擇入場金額並開始"
      : "⏱️ 房間玩家載入中 " + currentCount + "/" + totalRoomPlayersCount;
  }

  function hello(){

    send(
      'BBG_HELLO',
      {
        player:ME
      }
    );

    send(
      'BBG_HEARTBEAT',
      {
        player:ME,

        requestState:true

      }
    );

  }

  setInterval(
    () => {

      const p =
        players.get(
          ME.id
        );

      if(p){

        p.online =
          true;

        p.lastSeen =
          Date.now();

      }

      send(
        'BBG_HEARTBEAT',
        {
          player:ME
        }
      );

      const now =
        Date.now();

      for(
        const q of
        players.values()
      ){

        if(
          now -
          q.lastSeen >
          CFG.HOST_TIMEOUT
        ){

          q.online =
            false;

        }

      }

      const previous =
        hostId;

      electHost();

      if(
        previous !==
        hostId
      ){

        send(
          'BBG_HOST',
          {
            hostId
          }
        );

        if(
          isHost() &&
          phase !==
          STATES.RESULT
        ){

          broadcastState(
            true
          );

        }

      }

    },
    CFG.HEARTBEAT
  );

  /* =========================================================
     MAIN LOOP
  ========================================================= */

  let lastTs =
    0;

  function loop(ts){

    const dt =
      lastTs
        ? Math.min(
            (
              ts -
              lastTs
            ) /
            1000,
            .033
          )
        : 0;

    lastTs =
      ts;

    const now =
      gameNow();

    const activeRender =
      phase === STATES.COUNTDOWN ||
      phase === STATES.PLAYING ||
      phase === STATES.DRAINING;

    if(activeRender){

      /*
       * Background
       */
      ctx.drawImage(
        bg,
        0,
        0,
        W,
        H
      );

      /*
       * 中央氛圍
       */
      const pulse =
        .5 +
        .5*
        Math.sin(
          ts*.0014
        );

      ctx.globalAlpha =
        .015 +
        .012*pulse;

      ctx.fillStyle =
        '#ffd45c';

      ctx.beginPath();

      ctx.arc(
        W*.5,
        H*.48,
        Math.min(
          W,
          H
        )*.18,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.globalAlpha =
        1;

      /*
       * Playing 時增加淡淡危險氛圍
       */
      if(
        phase ===
        STATES.PLAYING
      ){
      const elapsed =
        clamp(
          (
            now -
            startAt
          ) /
          CFG.ROUND_MS,
          0,
          1
        );

      /*
       * 後半段紅色危險氛圍
       */
      if(
        elapsed >
        .62
      ){

        ctx.globalAlpha =
          (
            elapsed-
            .62
          )*.06;

        ctx.fillStyle =
          '#ff203d';

        ctx.fillRect(
          0,
          0,
          W,
          H
        );

        ctx.globalAlpha =
          1;

      }

      }

    }

    if(activeRender){
      updateFX(dt);
    }

    /*
     * Countdown
     */
    if(
      phase ===
      STATES.COUNTDOWN &&
      isHost() &&
      now >=
      phaseEndsAt
    ){

      startPlaying();

    }

    if(
      phase ===
      STATES.COUNTDOWN
    ){

      const sec =
        Math.ceil(
          Math.max(
            0,
            phaseEndsAt -
            now
          ) /
          1000
        );

      if(
        sec !==
        countdownShown
      ){

        countdownShown =
          sec;

        if(
          sec > 0
        ){

          showToast(
            String(sec),
            '#ffd45c'
          );

          sfx(
            'tick'
          );

        }

      }

    }

    /*
     * Playing
     */
    if(
      phase ===
      STATES.PLAYING
    ){

      if(
        isHost()
      ){

        /*
         * 先判斷時間，再生成下一批。
         * 避免 45.000 秒那一幀又多產生一批物件。
         */
        if(
          now >=
          phaseEndsAt
        ){

          finishHost();

        }else{

          spawnBatch(
            now
          );

          broadcastState(
            false
          );

        }

      }

    }

    /*
     * Draining：時間到後仍繼續繪製 / 清理 / 接受搶取，
     * 不再生成新物件。
     */
    if(
      phase === STATES.PLAYING ||
      phase === STATES.DRAINING
    ){

      for(
        const it of
        items.values()
      ){

        drawItem(
          it,
          now
        );

      }

      pruneExpiredItems(now);

      if(
        phase === STATES.DRAINING &&
        isHost()
      ){

        if(
          !hasLiveItems(now) ||
          now >= drainEndsAt
        ){

          /*
           * 只有真正進入 RESULT 前才清空殘留物件。
           */
          pruneExpiredItems(now);

          finalizeHostRound();

        }else{

          broadcastState(false);

        }

      }

    }

    /*
     * FX
     */
    if(activeRender){
      drawFX();
    }

    syncUIFrame(ts);

    requestAnimationFrame(
      loop
    );

  }

  requestAnimationFrame(
    loop
  );

  /* =========================================================
     INITIAL
  ========================================================= */

  el.lobby.style.display =
    'grid';

  })();
</script>
