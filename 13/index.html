<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<style>
:root{
    --bg:#02040b;
    --cyan:#23e8ff;
    --cyan2:#007dff;
    --pink:#ff38d1;

    --gold:#ffd84a;
    --green:#18ffad;
    --red:#ff344c;
    --orange:#ff7b2d;
    --white:#f7f9ff;
    --muted:#8b94ae;
    --panel:rgba(5,8,22,.9);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040b;
    color:#fff;
    font-family:
        Arial,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    user-select:none;
    touch-action:none;
}

body{
    position:fixed;
    inset:0;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

#gameCanvas{
    position:fixed;
    inset:0;
    z-index:1;
    width:100%;
    height:100%;
    display:block;
}

/* =========================================================
   LOBBY
========================================================= */

#lobby{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:
        max(14px,env(safe-area-inset-top))
        14px
        max(14px,env(safe-area-inset-bottom));
    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(23,39,93,.42),
            rgba(2,4,11,.96) 68%
        );
    transition:.25s;
}

body.playing #lobby{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.lobby-header{
    width:100%;
    max-width:620px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
}

.logo{
    font-size:18px;
    font-weight:1000;
    letter-spacing:.4px;
}

.logo small{
    display:block;
    margin-top:4px;
    color:var(--muted);
    font-size:9px;
    font-weight:600;
    letter-spacing:0;
}

.online{
    padding:8px 10px;
    border-radius:12px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1);
    color:#aeb7d1;
    font-size:10px;
}

/* 火箭選擇 */

#rocketChoices{
    width:100%;
    max-width:620px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.rocket-option{
    position:relative;
    min-height:215px;
    padding:16px;
    border:1px solid rgba(255,255,255,.11);
    border-radius:22px;
    background:
        linear-gradient(
            160deg,
            rgba(13,22,52,.96),
            rgba(6,9,24,.94)
        );
    overflow:hidden;
    transition:
        transform .15s,
        border-color .15s,
        box-shadow .15s;
}

.rocket-option::after{
    content:"";
    position:absolute;
    inset:auto -30px -60px;
    height:130px;
    border-radius:50%;
    opacity:.12;
    filter:blur(18px);
}

.rocket-option.a::after{
    background:var(--cyan);
}

.rocket-option.b::after{
    background:var(--pink);
}

.rocket-option.selected-a{
    border-color:rgba(35,232,255,.75);
    box-shadow:
        0 0 30px rgba(35,232,255,.16),
        inset 0 0 25px rgba(35,232,255,.05);
    transform:translateY(-2px);
}

.rocket-option.selected-b{
    border-color:rgba(255,56,209,.75);
    box-shadow:
        0 0 30px rgba(255,56,209,.16),
        inset 0 0 25px rgba(255,56,209,.05);
    transform:translateY(-2px);
}

.option-badge{
    position:absolute;
    top:12px;
    right:12px;
    padding:4px 7px;
    border-radius:999px;
    font-size:8px;
    font-weight:1000;
    background:rgba(255,255,255,.07);
    color:#929ab4;
}

.selected-a .option-badge{
    color:var(--cyan);
    background:rgba(35,232,255,.12);
}

.selected-b .option-badge{
    color:var(--pink);
    background:rgba(255,56,209,.12);
}

.option-title{
    font-size:17px;
    font-weight:1000;
}

.option-sub{
    margin-top:4px;
    color:var(--muted);
    font-size:9px;
}

.option-stats{
    margin-top:12px;
    display:grid;
    gap:6px;
}

.option-stat{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:7px 8px;
    border-radius:9px;
    background:rgba(255,255,255,.035);
    font-size:9px;
    color:#929bb5;
}

.option-stat strong{
    color:#e4e8f5;
}

/* 小火箭 */

.option-rocket{
    position:absolute;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    width:55px;
    height:100px;
}

.option-rocket-body{
    position:absolute;
    left:50%;
    top:12px;
    transform:translateX(-50%);
    width:31px;
    height:60px;
    border-radius:55% 55% 38% 38%;
    background:#eef8ff;
    box-shadow:0 0 22px currentColor;
}

.option-rocket-window{
    position:absolute;
    left:50%;
    top:28px;
    transform:translateX(-50%);
    width:10px;
    height:10px;
    border-radius:50%;
    background:#31c8ff;
    border:2px solid #fff;
}

.option-fin-left,
.option-fin-right{
    position:absolute;
    top:50px;
    width:24px;
    height:20px;
    background:#abb4c6;
}

.option-fin-left{
    left:-1px;
    clip-path:polygon(100% 0,100% 100%,0 100%);
}

.option-fin-right{
    right:-1px;
    clip-path:polygon(0 0,100% 100%,0 100%);
}

.option-flame{
    position:absolute;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:18px;
    height:30px;
    background:
        linear-gradient(
            to bottom,
            #fff,
            #ffd63f 25%,
            #ff742c 60%,
            transparent
        );
    clip-path:polygon(50% 100%,0 0,100% 0);
    animation:flame .16s infinite alternate;
}

.a .option-rocket{
    color:var(--cyan);
}

.b .option-rocket{
    color:var(--pink);
}

@keyframes flame{
    from{height:26px}
    to{height:37px}
}

/* 下注 */

#betArea{
    width:100%;
    max-width:620px;
    margin-top:12px;
}

.section-title{
    color:#7e87a3;
    font-size:9px;
    margin-bottom:6px;
}

#betButtons{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
}

.bet-button{
    height:38px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:10px;
    background:rgba(255,255,255,.035);
    color:#b4bdd4;
    font-size:10px;
    font-weight:1000;
}

.bet-button.active{
    background:
        linear-gradient(
            135deg,
            #672fe0,
            #a126df
        );
    color:#fff;
    border-color:rgba(178,113,255,.72);
    box-shadow:0 0 20px rgba(139,44,255,.18);
}

/* 加入 */

#joinButton{
    width:100%;
    max-width:620px;

    background:
        linear-gradient(

}

#joinButton:disabled{
    opacity:.45;

#lobbyTip{

#playRocketBadge.a{

#playRocketBadge.b{

}

#tiltBadge{

    font-size:9px;
}

#playCenter{
    position:absolute;
    left:50%;

}

#multiplier{
    font-family:
        Impact,
        "Arial Black",
        sans-serif;
    font-size:clamp(66px,20vw,125px);
    line-height:.9;

    color:#fff;
    text-shadow:
        0 0 15px rgba(255,255,255,.25),
        0 0 50px rgba(92,104,255,.22);
    transition:
        color .12s,
        transform .08s,
        text-shadow .12s;
}

#multiplier.a{
    color:var(--cyan);
    text-shadow:
        0 0 18px rgba(35,232,255,.58),
        0 0 62px rgba(0,125,255,.42);
}

#multiplier.b{
    color:var(--pink);
    text-shadow:
        0 0 18px rgba(255,56,209,.58),
        0 0 62px rgba(124,36,255,.42);
}

#multiplier.warning{
    color:var(--gold);
    text-shadow:
        0 0 22px rgba(255,216,74,.58),

}

#multiplier.danger{

#multiplier.crash{

}

#status{
    margin-top:9px;

}

#tiltHint{
    margin-top:5px;

/* 遊戲中下方 */

#playBottom{
    position:absolute;

    bottom:max(10px,env(safe-area-inset-bottom));

#playerProgress{
    width:100%;

}

#aliveText{
    padding:6px 10px;

}

#ejectButton{
    pointer-events:auto;

#ejectButton:disabled{
    animation:none;
    opacity:.45;
}

@keyframes ejectPulse{
    from{

    }
}

#meteorWarning{
    position:absolute;

}

#meteorWarning.show{

}

#resultOverlay{

    transition:.2s;
}

#resultOverlay.show{

}

.result-main{

}

.result-sub{

}

#leaderboard{

}

.rank{
    display:grid;
    grid-template-columns:25px 1fr auto;
    gap:7px;
    align-items:center;
    padding:7px 9px;

    background:rgba(255,255,255,.035);
    text-align:left;
    font-size:10px;
}

.rank-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-weight:900;
}

.rank-value{

}

#nextRound{

        );

}

/* Toast */

}

#toast.show{
    opacity:1;
}

(() => {
"use strict";

/* =========================================================
   SDK
========================================================= */

const SDK =
    window.BoomRoomSDK || null;

let user = {
    id:
        "demo_" +
        Math.random()
            .toString(36)
            .slice(2,9),
    username:"玩家",
    avatar:""
};

if (
    SDK &&
    typeof SDK.getUser === "function"
) {
    try{
        const data =
            SDK.getUser();

        if(
            data &&
            data.id
        ){
            user = {
                id:String(data.id),
                username:
                    String(
                        data.username ||
                        "玩家"

let audio =
    null;

function initAudio(){

    if(!audio){

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(
            AudioContext
        ){
            try{
                audio =
                    new AudioContext();
            }catch(e){}
        }
    }

    if(
        audio &&
        audio.state ===
        "suspended"
    ){
        audio.resume()
            .catch(
                () => {}
            );
    }
}

function tone(
    frequency,
    duration,
    type,
    volume,
    slide=0
){

    if(!audio){
        return;
    }

    try{

        const osc =
            audio.createOscillator();

        const gain =
            audio.createGain();

        osc.type =
            type;

        osc.frequency.setValueAtTime(
            frequency,
            audio.currentTime
        );

        if(slide){

            osc.frequency.linearRampToValueAtTime(
                frequency + slide,
                audio.currentTime +
                duration
            );

        }

        gain.gain.setValueAtTime(
            volume,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audio.currentTime +
            duration
        );

        osc.connect(gain);
        gain.connect(
            audio.destination
        );

        osc.start();

        osc.stop(
            audio.currentTime +
            duration
        );

    }catch(e){}
}

                sender,
                payload
            );

        case "HOST_ANNOUNCE":
            handleHost(

            );

        case "WORLD_STATE":

                payload
            );
            break;

            );

    );

}

function generateCrashPoint(
    rocketId
){

    const rocket =
        ROCKETS[
            rocketId
        ];

    const r =
        Math.random();

    const min =
        rocketId === "A"
            ? 1.08
            : 1.04;

    let point;

    if(
        rocketId === "A"
    ){

        point =
            min +
            Math.pow(
                r,
                1.55
            ) *
            (
                rocket.maxCrash -
                min
            );

    }else{

        point =
            min +
            Math.pow(
                r,
                2.0
            ) *
            (
                rocket.maxCrash -
                min
            );

    }

    return Number(
        clamp(
            point,
            min,
            rocket.maxCrash
        ).toFixed(2)
    );
}

/* =========================================================
   遊戲時間
========================================================= */

function effectiveNow(){

    return (
        Date.now()
    );

}

function baseMultiplier(
    rocketId,
    now=effectiveNow()
){

    if(
        !roundStartAt
    ){
        return 1;
    }

    const elapsed =
        Math.max(
            0,
            now -
            roundStartAt
        ) / 1000;

    return Math.pow(
        ROCKETS[
            rocketId
        ].growth,
        elapsed
    );

}

function getMyMultiplier(){

    const me =
        players.get(
            user.id
        );

    if(!me){
        return 1;
    }

    return Math.min(
        MAX_PAYOUT_MULTIPLIER,
        baseMultiplier(
            me.rocket
        ) +
        clamp(
            me.bonus,
            0,
            1.5
        )
    );

}


/* =========================================================
   Host World
========================================================= */

let worldItems = [];
let itemCounter = 0;
let lastWorldTick = 0;
let lastMeteorSpawn = 0;
let lastEnergySpawn = 0;

function hostWorldTick(){

    if(
        !isHost() ||
        state !== "FLYING"
    ){
        return;
    }

    const now =
        Date.now();

    if(
        !lastWorldTick
    ){
        lastWorldTick =
            now;
    }

    const dt =
        Math.min(
            .08,
            (
                now -
                lastWorldTick
            ) / 1000
        );

    lastWorldTick =
        now;

    const multA =
        baseMultiplier(
            "A",
            now
        );

    const multB =
        baseMultiplier(
            "B",
            now
        );

    if(
        !crashedA &&
        multA >=
        crashPointA
    ){
        crashRocket(
            "A"
        );
    }

    if(
        !crashedB &&
        multB >=
        crashPointB
    ){
        crashRocket(
            "B"
        );
    }

    if(
        now -
        lastMeteorSpawn >
        800
    ){
        spawnMeteor();
        lastMeteorSpawn =
            now;
    }

    if(
        now -
        lastEnergySpawn >
        1050
    ){
        spawnEnergy();
        lastEnergySpawn =
            now;
    }

    worldItems.forEach(
        item => {

            item.y +=
                item.speed *
                dt;

            item.life -=
                dt;

        }
    );

    processCollisions();

    worldItems =
        worldItems.filter(
            item =>
                item.life > 0 &&
                item.y <
                1.15
        );

    broadcastWorld();

    if(
        crashedA &&
        crashedB
    ){
        finishRound();
    }

}

/* =========================================================
   Collision
========================================================= */

function processCollisions(){

    players.forEach(
        p => {

            if(
                p.status !==
                "flying"
            ){
                return;
            }

            worldItems.forEach(
                item => {

                    if(
                        item.rocket !==
                        p.rocket
                    ){
                        return;
                    }

                    if(
                        item.y <
                        .72 ||
                        item.y >
                        .91
                    ){
                        return;
                    }

                    const dx =
                        Math.abs(
                            p.x -
                            item.x
                        );

                    const hitRange =
                        item.type ===
                        "meteor"
                            ? .21
                            : .14;

                    if(
                        dx >
                        hitRange
                    ){
                        return;
                    }

                    item.life =
                        0;

                    if(
                        item.type ===
                        "energy"
                    ){

                        p.bonus =
                            clamp(
                                p.bonus +
                                .08,
                                0,
                                1.5
                            );

                        if(
                            p.id ===
                            user.id
                        ){
                            soundCollect();
                            showToast(
                                "⚡ 能量 +0.08x"
                            );
                        }

                    }else{

                        p.bonus =
                            clamp(
                                p.bonus -
                                .11,
                                0,
                                1.5
                            );

                        if(
                            p.id ===
                            user.id
                        ){
                            soundMeteorHit();
                            showToast(
                                "☄️ 撞到隕石！"
                            );
                        }

                    }

                }
            );

        }
    );

}

/* =========================================================
   Crash
========================================================= */

function crashRocket(
    rocketId
){

    if(
        rocketId === "A"
    ){
        crashedA =
            true;
    }else{
        crashedB =
            true;
    }

    players.forEach(
        p => {

            if(
                p.rocket !==
                rocketId
            ){
                return;
            }

            if(
                p.status !==
                "flying"
            ){
                return;
            }

            p.status =
                "crashed";

            p.reward =
                0;

            p.cashoutAt =
                0;

            if(
                p.id ===
                user.id
            ){
                if(
                    !roundRewardSent &&
                    sdkEnabled
                ){

                    roundRewardSent =
                        true;

                    try{
                        SDK.gameOver(
                            0
                        );
                    }catch(e){}

                }
            }

        }
    );

    sendEvent(
        "ROCKET_CRASHED",
        {
            gameId:GAME_ID,
            roundId:currentRoundId,
            rocket:rocketId,
            crashPoint:
                rocketId === "A"
                    ? crashPointA
                    : crashPointB
        }
    );

    soundCrash();

    if(
        selectedRocket ===
        rocketId
    ){
        screenShake(
            16
        );
    }

}

function cashout(){

    const me =
        players.get(
            user.id
        );

    if(
        !me ||
        me.status !==
        "flying"
    ){
        return;
    }

    if(
        (
            me.rocket === "A" &&
            crashedA
        ) ||
        (
            me.rocket === "B" &&
            crashedB
        )
    ){
        return;
    }

    if(
        isHost()
    ){

        processCashout(
            user.id
        );

    }else{

        sendEvent(
            "PLAYER_CASHOUT",
            {
                gameId:GAME_ID,
                roundId:currentRoundId,
                playerId:user.id
            }
        );

    }

}


function handlePlayerCashout(
    sender,
    payload
){

    if(
        !isHost()
    ){
        return;
    }

    if(
        String(
            payload.roundId
        ) !==
        String(
            currentRoundId
        )
    ){
        return;
    }

    processCashout(
        String(
            payload.playerId ||
            sender
        )
    );

}


function processCashout(
    playerId
){

    if(
        state !==
        "FLYING"
    ){
        return;
    }

    const p =
        players.get(
            playerId
        );

    if(
        !p ||
        p.status !==
        "flying"
    ){
        return;
    }

    const crashed =
        p.rocket === "A"
            ? crashedA
            : crashedB;

    if(
        crashed
    ){
        return;
    }

    const current =
        Math.min(
            MAX_PAYOUT_MULTIPLIER,
            baseMultiplier(
                p.rocket
            ) +
            clamp(
                p.bonus,
                0,
                1.5
            )
        );

    const multiplier =
        Math.max(
            1.01,
            current
        );

    const reward =
        Math.floor(
            p.bet *
            multiplier
        );

    p.status =
        "cashed";

    p.cashoutAt =
        multiplier;

    p.reward =
        reward;

    sendEvent(
        "CASHOUT_CONFIRMED",
        {
            gameId:GAME_ID,
            roundId:currentRoundId,
            playerId:p.id,
            username:p.username,
            rocket:p.rocket,
            bet:p.bet,
            multiplier,
            reward
        }
    );

    if(
        p.id ===
        user.id
    ){
        applyCashout(
            multiplier,
            reward
        );
    }

}


function handleCashoutConfirmed(
    sender,
    payload
){

    const id =
        String(
            payload.playerId ||
            sender
        );

    const p =
        players.get(
            id
        );

    if(!p){
        return;
    }

    p.status =
        "cashed";

    p.cashoutAt =
        Number(
            payload.multiplier ||
            1
        );

    p.reward =
        Number(
            payload.reward ||
            0
        );

    if(
        id ===
        user.id
    ){
        applyCashout(
            p.cashoutAt,
            p.reward
        );
    }

}


function applyCashout(
    multiplier,
    reward
){

    roundRewardSent =
        true;

    ejectButton.disabled =
        true;

    ejectButton.textContent =
        "✅ 已成功逃脫";

    aliveText.textContent =
        `✅ ${multiplier.toFixed(2)}x`;

    multiplierEl.className =
        "win";

    multiplierEl.textContent =
        `${multiplier.toFixed(2)}x`;

    statusEl.textContent =
        "成功逃脫！";

    soundCashout();

    if(
        sdkEnabled
    ){
        try{
            SDK.gameOver(
                Math.max(
                    0,
                    Math.floor(
                        reward
                    )
                )
            );
        }catch(e){}
    }

    showToast(
        `+${reward.toLocaleString()} 銀幣`,
        1800
    );

}


/* =========================================================
   Round Finish
========================================================= */

function finishRound(){

    if(
        !isHost() ||
        state === "RESULT"
    ){
        return;
    }

    state =
        "RESULT";

    const results =
        Array.from(
            players.values()
        )
        .filter(
            p =>
                p.ready
        )
        .map(
            p => ({
                id:p.id,
                username:p.username,
                avatar:p.avatar,
                bet:p.bet,
                rocket:p.rocket,
                status:p.status,
                reward:
                    Math.max(
                        0,
                        Math.floor(
                            p.reward
                        )
                    ),
                cashoutAt:
                    p.cashoutAt
            })
        );

    results.sort(
        (a,b) => {

            const netA =
                a.reward -
                a.bet;

            const netB =
                b.reward -
                b.bet;

            if(
                netA !==
                netB
            ){
                return netB - netA;
            }

            return (
                b.cashoutAt -
                a.cashoutAt
            );

        }
    );

    sendEvent(
        "ROUND_RESULT",
        {
            gameId:GAME_ID,
            roundId:currentRoundId,
            crashPointA,
            crashPointB,
            results
        }
    );

    applyRoundResult(
        results
    );

}


function handleRoundResult(
    sender,
    payload
){

    if(
        hostId &&
        String(sender) !==
        String(hostId)
    ){
        return;
    }

    if(
        String(
            payload.roundId
        ) !==
        String(
            currentRoundId
        )
    ){
        return;
    }

    crashPointA =
        Number(
            payload.crashPointA
        );

    crashPointB =
        Number(
            payload.crashPointB
        );

    applyRoundResult(
        Array.isArray(
            payload.results
        )
            ? payload.results
            : []
    );

}


function applyRoundResult(
    results
){

    state =
        "RESULT";

    const me =
        results.find(
            r =>
                String(r.id) ===
                user.id
        );

    const reward =
        me
            ? Number(
                me.reward || 0
            )
            : 0;

    if(
        me &&
        reward <= 0 &&
        !roundRewardSent
    ){

        roundRewardSent =
            true;

        if(
            sdkEnabled
        ){
            try{
                SDK.gameOver(
                    0
                );
            }catch(e){}
        }

    }

    resultTitle.textContent =
        reward > 0
            ? "🚀 成功逃脫"
            : "💥 本局爆炸";

    resultMain.textContent =
        reward > 0
            ? `+${reward.toLocaleString()} 🪙`
            : "0 🪙";

    resultSub.textContent =
        me
            ? `${rocketName(me.rocket)} · ${
                Number(
                    me.cashoutAt || 0
                ).toFixed(2)
            }x`
            : "—";

    leaderboard.innerHTML =
        "";

    results
    .slice(0,5)
    .forEach(
        (r,index) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "rank";

            const net =
                Number(
                    r.reward || 0
                ) -
                Number(
                    r.bet || 0
                );

            const medal =
                index === 0
                    ? "🥇"
                    : index === 1
                        ? "🥈"
                        : index === 2
                            ? "🥉"
                            : String(
                                index + 1
                            );

            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "rank-name";

            name.textContent =
                String(
                    r.username ||
                    "玩家"
                );

            row.innerHTML =
                `<div>${medal}</div>`;

            row.appendChild(
                name
            );

            const value =
                document.createElement(
                    "div"
                );

            value.className =
                "rank-value";

            value.textContent =
                `${net >= 0 ? "+" : ""}${net.toLocaleString()}`;

            row.appendChild(
                value
            );

            leaderboard.appendChild(
                row
            );

        }
    );

    resultOverlay.classList.add(
        "show"
    );

    if(
        reward > 0
    ){
        soundCashout();
    }

    setTimeout(
        () => {

            if(
                state ===
                "RESULT"

/* =========================================================
   Tilt Control
========================================================= */

let tiltEnabled =
    false;

let tiltCenter =
    0;

let filteredTilt =
    0;

function handleOrientation(
    event
){

    if(
        !tiltEnabled ||
        typeof event.gamma !==
        "number"
    ){
        return;
    }

    let gamma =
        event.gamma;

    let delta =
        gamma -
        tiltCenter;

    delta =
        clamp(
            delta / 24,
            -1,
            1
        );

    filteredTilt =
        filteredTilt * .8 +
        delta * .2;

    localX =
        clamp(
            filteredTilt,
            -1,
            1
        );

    sendInput();

}


async function startTilt(){

    if(
        tiltEnabled
    ){
        return;
    }

    try{

        if(
            typeof DeviceOrientationEvent !==
            "undefined" &&
            typeof DeviceOrientationEvent.requestPermission ===
            "function"
        ){

            const permission =
                await DeviceOrientationEvent
                    .requestPermission();

            if(
                permission !==
                "granted"
            ){
                useTouchFallback();
                return;
            }

        }

        tiltCenter =
            0;

        filteredTilt =
            0;

        window.addEventListener(
            "deviceorientation",
            handleOrientation,
            true
        );

        tiltEnabled =
            true;

        tiltBadge.textContent =
            "📱 體感 ON";

        tiltHint.textContent =
            "左右傾斜手機控制火箭";

    }catch(e){

        useTouchFallback();

    }

}


function stopTilt(){

    if(
        tiltEnabled
    ){

        window.removeEventListener(
            "deviceorientation",
            handleOrientation,
            true
        );

    }

    tiltEnabled =
        false;

}


function useTouchFallback(){

    tiltBadge.textContent =
        "👆 觸控備用模式";

    tiltHint.textContent =
        "左右滑動螢幕控制火箭";

}

========================================================= */

let dragging =
    false;

canvas.addEventListener(
    "pointerdown",
    event => {

        if(
            !body.classList.contains(
                "playing"
            )
        ){
            return;
        }

        dragging =
            true;

        setTouchX(
            event.clientX
        );

    }
);

canvas.addEventListener(
    "pointermove",
    event => {

        if(
            !dragging
        ){
            return;
        }

        setTouchX(
            event.clientX
        );

    }
);

window.addEventListener(
    "pointerup",
    () => {
        dragging =
            false;
    }
);


function setTouchX(
    clientX
){

    localX =
        clamp(
            (
                clientX -
                width / 2
            ) /
            (
                width / 2
            ),
            -1,
            1
        );

    filteredTilt =
        localX;

    sendInput();

}

function updatePlayHUD(){

    if(
        !body.classList.contains(
            "playing"
        )
    ){
        return;
    }

    if(
        state ===
        "COUNTDOWN"
    ){

        const remain =
            Math.max(
                0,
                roundStartAt -
                Date.now()
            );

        const sec =
            Math.ceil(
                remain / 1000
            );

        multiplierEl.className =
            selectedRocket === "A"
                ? "a"
                : "b";

        multiplierEl.textContent =
            sec > 0
                ? String(sec)
                : "GO!";

        statusEl.textContent =
            "雙火箭即將升空";

        aliveText.textContent =
            "⏳ 準備";

        return;
    }

    if(
        state !==
        "FLYING"
    ){
        return;
    }

    const me =
        players.get(
            user.id
        );

    if(!me){
        return;
    }

    const multiplier =
        getMyMultiplier();

    multiplierEl.textContent =
        `${multiplier.toFixed(2)}x`;

    if(
        me.status ===
        "cashed"
    ){

        multiplierEl.className =
            "win";

        statusEl.textContent =
            "✅ 你已成功逃脫";

        aliveText.textContent =
            "✅ 已逃脫";

        return;
    }

    if(
        me.status ===
        "crashed"
    ){

        multiplierEl.className =
            "crash";

        statusEl.textContent =
            "💥 火箭爆炸";

        aliveText.textContent =
            "💥 出局";

        ejectButton.disabled =
            true;

        return;
    }

    if(
        (
            selectedRocket === "A" &&
            crashedA
        ) ||
        (
            selectedRocket === "B" &&
            crashedB
        )
    ){

        multiplierEl.className =
            "crash";

        statusEl.textContent =
            "💥 你的航道已爆炸";

        return;
    }

    if(
        multiplier >= 5
    ){

        multiplierEl.className =
            "danger";

        statusEl.textContent =
            "🔥 高風險區";

    }else if(
        multiplier >= 2
    ){

        multiplierEl.className =
            "warning";

        statusEl.textContent =
            "⚠️ 開始加速";

    }else{

        multiplierEl.className =
            selectedRocket === "A"
                ? "a"
                : "b";

        statusEl.textContent =
            "🚀 飛行中";

    }

    const alive =
        Array.from(
            players.values()
        )
        .filter(
            p =>
                p.ready &&
                p.status ===
                "flying"
        )
        .length;

    aliveText.textContent =
        `🚀 ${alive} 人還在飛`;

}

/* =========================================================
   遊戲畫面
   只有「選中的火箭」會畫出來
========================================================= */

function drawBackground(
    time
){

    ctx.fillStyle =
        "#02040b";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    const glow =
        ctx.createRadialGradient(
            width / 2,
            height * .5,
            20,
            width / 2,
            height * .5,
            height * .8
        );

    const color =
        selectedRocket ===
        "A"
            ? "35,232,255"
            : "255,56,209";

    glow.addColorStop(
        0,
        `rgba(${color},.14)`
    );

    glow.addColorStop(
        .55,
        `rgba(${color},.035)`
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        glow;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    const speed =
        state === "FLYING"
            ? Math.min(
                getMyMultiplier(),
                9
            )
            : 1;

    stars.forEach(
        star => {

            star.y +=
                star.speed *
                speed;

            if(
                star.y >
                height
            ){
                star.y =
                    -2;

                star.x =
                    Math.random() *
                    width;
            }

            ctx.globalAlpha =
                star.alpha;

            ctx.fillStyle =
                "#ffffff";

            ctx.beginPath();

            ctx.arc(
                star.x,
                star.y,
                star.size,
                0,
                Math.PI * 2
            );

            ctx.fill();

        }
    );

    ctx.globalAlpha =
        1;

}


/* =========================================================
   只畫選中的飛行航道
========================================================= */

function getLane(){

    /*
       遊玩模式不再分成左右兩台。
       選中的火箭會放在畫面中央，
       整個螢幕就是它的遊戲場。
    */

    return {
        center:
            width / 2,
        top:
            height * .13,
        bottom:
            height * .92,
        width:
            Math.min(
                width * .82,
                440
            )
    };

}


/* =========================================================
   航道背景
========================================================= */

function drawLane(
    time
){

    const lane =
        getLane();

    const rgb =
        selectedRocket === "A"
            ? "35,232,255"
            : "255,56,209";

    const left =
        lane.center -
        lane.width / 2;

    const gradient =
        ctx.createLinearGradient(
            lane.center,
            lane.top,
            lane.center,
            lane.bottom
        );

    gradient.addColorStop(
        0,
        `rgba(${rgb},0)`
    );

    gradient.addColorStop(
        .45,
        `rgba(${rgb},.035)`
    );

    gradient.addColorStop(
        1,
        `rgba(${rgb},.12)`
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        left,
        lane.top,
        lane.width,
        lane.bottom -
        lane.top
    );


    ctx.strokeStyle =
        `rgba(${rgb},.15)`;

    ctx.lineWidth =
        1;

    ctx.beginPath();

    ctx.moveTo(
        left,
        lane.top
    );

    ctx.lineTo(
        left,
        lane.bottom
    );

    ctx.moveTo(
        left +
        lane.width,
        lane.top
    );

    ctx.lineTo(
        left +
        lane.width,
        lane.bottom
    );

    ctx.stroke();


    const scroll =
        (
            time *
            .07
        ) %
        55;

    ctx.strokeStyle =
        `rgba(${rgb},.06)`;

    for(
        let y =
            lane.top +
            scroll;
        y <
        lane.bottom;
        y +=55
    ){

        ctx.beginPath();

        ctx.moveTo(
            left + 14,
            y
        );

        ctx.lineTo(
            left +
            lane.width -
            14,
            y
        );

        ctx.stroke();

    }

}


/* =========================================================
   大型隕石
========================================================= */

function drawMeteor(
    item,
    now
){

    if(
        item.rocket !==
        selectedRocket
    ){
        return;
    }

    const lane =
        getLane();

    const x =
        lane.center +
        item.x *
        (
            lane.width *
            .42
        );

    const y =
        lane.top +
        item.y *
        (
            lane.bottom -
            lane.top
        );

    const size =
        item.size || 22;

    ctx.save();

    /*
       火焰尾巴
    */

    const trail =
        ctx.createLinearGradient(
            x,
            y - size * 2.8,
            x,
            y
        );

    trail.addColorStop(
        0,
        "rgba(255,52,30,0)"
    );

    trail.addColorStop(
        .45,
        "rgba(255,82,35,.35)"
    );

    trail.addColorStop(
        1,
        "rgba(255,191,68,.9)"
    );

    ctx.fillStyle =
        trail;

    ctx.beginPath();

    ctx.moveTo(
        x - size * .34,
        y - size * .15
    );

    ctx.lineTo(
        x,
        y - size * 3
    );

    ctx.lineTo(
        x + size * .34,
        y - size * .15
    );

    ctx.closePath();

    ctx.fill();


    /*
       危險圈
    */

    ctx.shadowBlur =
        22;

    ctx.shadowColor =
        "#ff352f";

    ctx.strokeStyle =
        "rgba(255,72,60,.55)";

    ctx.lineWidth =
        2;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        size * 1.65,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    /*
       主體
    */

    const rock =
        ctx.createRadialGradient(
            x - size * .3,
            y - size * .3,
            2,
            x,
            y,
            size
        );

    rock.addColorStop(
        0,
        "#ffbf6b"
    );

    rock.addColorStop(
        .28,
        "#ff7040"
    );

    rock.addColorStop(
        .72,
        "#b52d27"
    );

    rock.addColorStop(
        1,
        "#4a1218"
    );

    ctx.fillStyle =
        rock;

    ctx.beginPath();

    const points =
        9;

    for(
        let i=0;
        i<points;
        i++
    ){

        const angle =
            (
                Math.PI * 2 /
                points
            ) *
            i +
            now *
            .0008;

        const radius =
            size *
            (
                .7 +
                Math.sin(
                    i * 4.73
                ) *
                .16 +
                Math.random() *
                .08
            );

        const px =
            x +
            Math.cos(angle) *
            radius;

        const py =
            y +
            Math.sin(angle) *
            radius;

        if(i === 0){
            ctx.moveTo(
                px,
                py
            );
        }else{
            ctx.lineTo(
                px,
                py
            );
        }

    }

    ctx.closePath();
    ctx.fill();


    /*
       隕石坑
    */

    ctx.shadowBlur =
        0;

    ctx.fillStyle =
        "rgba(76,12,19,.7)";

    [
        [-.28,-.18,.13],
        [.27,-.06,.1],
        [.04,.29,.12]
    ]
    .forEach(
        pit => {

            ctx.beginPath();

            ctx.arc(
                x +
                size *
                pit[0],
                y +
                size *
                pit[1],
                size *
                pit[2],
                0,
                Math.PI * 2
            );

            ctx.fill();

        }
    );


    /*
       「危險」符號
    */

    ctx.fillStyle =
        "#fff4dc";

    ctx.font =
        `900 ${Math.max(
            9,
            size * .42
        )}px Arial`;

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        "!",
        x,
        y
    );

    ctx.restore();

}

/* =========================================================

function drawPlayerRocket(

    */

    const flame =
        ctx.createLinearGradient(

        );

    );

    );

        "#ff7b2d"
    );

    flame.addColorStop(
        1,
        "rgba(255,40,20,0)"
    );

    ctx.fillStyle =
        flame;

    ctx.beginPath();

    ctx.moveTo(
        x - 11,
        y + 14
    );

    ctx.lineTo(
        x + 11,
        y + 14
    );

    ctx.lineTo(
        x,
        y + 90 +
        Math.random() *
        18
    );

    ctx.closePath();

    ctx.fill();


    /*
       光暈
    */

    ctx.shadowBlur =
        26;

    ctx.shadowColor =
        glow;


    /*
       火箭
    */

    ctx.fillStyle =
        "#eef7ff";

    ctx.beginPath();

    ctx.moveTo(
        x,
        y - 44
    );

    ctx.quadraticCurveTo(
        x + 23,
        y - 8,
        x + 21,
        y + 24
    );

    ctx.lineTo(
        x - 21,
        y + 24
    );

    ctx.quadraticCurveTo(
        x - 23,
        y - 8,
        x,
        y - 44
    );

    ctx.closePath();

    ctx.fill();


    /*
       火箭彩色邊
    */

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        3;

    ctx.stroke();


    /*
       窗口
    */

    ctx.shadowBlur =
        0;

    ctx.fillStyle =
        color;

    ctx.beginPath();

    ctx.arc(
        x,
        y - 10,
        8,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth =
        2;

    ctx.stroke();


    /*
       機翼
    */

    ctx.fillStyle =
        "#aab5c7";

    ctx.beginPath();

    ctx.moveTo(
        x - 18,
        y + 8
    );

    ctx.lineTo(
        x - 42,
        y + 34
    );

    ctx.lineTo(
        x - 16,
        y + 26
    );

    ctx.closePath();

    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(
        x + 18,
        y + 8
    );

    ctx.lineTo(
        x + 42,
        y + 34
    );

    ctx.lineTo(
        x + 16,
        y + 26
    );

    ctx.closePath();

    ctx.fill();


    /*
       玩家位置標記
    */

    ctx.shadowBlur =
        0;

    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "900 10px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "YOU",
        x,
        y + 48
    );

    ctx.restore();

}


/* =========================================================
   雙火箭選擇後：
   其他人的火箭不畫、另一航道不畫。
========================================================= */

function renderWorld(
    time
){

    drawBackground(
        time
    );

    if(
        body.classList.contains(
            "playing"
        )
    ){

        drawLane(
            time
        );

        /*
           只顯示選中的火箭航道
        */

        worldItems.forEach(
            item => {

                if(
                    item.type ===
                    "meteor"
                ){
                    drawMeteor(
                        item,
                        time
                    );
                }else{
                    drawEnergy(
                        item
                    );
                }

            }
        );

        drawPlayerRocket(
            time
        );

    }

}


/* =========================================================
   畫面震動
========================================================= */

let shakeX =
    0;

let shakeY =
    0;

function screenShake(
    strength=10
){

    shakeX =
        (
            Math.random() -
            .5
        ) *
        strength;

    shakeY =
        (
            Math.random() -
            .5
        ) *
        strength;

}


/* =========================================================
   Frame
========================================================= */

function frame(
    time
){

    renderWorld(
        time
    );

    updatePlayHUD();

    updateMeteorWarning();

    if(
        state ===
        "FLYING"
    ){

        if(
            time -
            lastWarning >
            420
        ){
            lastWarning =
                time;

            soundTick();
        }

    }

    if(
        Math.abs(shakeX) >
        .1 ||
        Math.abs(shakeY) >
        .1
    ){

        canvas.style.transform =
            `translate(${shakeX}px,${shakeY}px)`;

        shakeX *=
            .84;

        shakeY *=
            .84;

    }else{

        canvas.style.transform =
            "";

        shakeX =
            0;

        shakeY =
            0;

    }

    requestAnimationFrame(
        frame
    );

}

function clamp(
    value,
    min,
    max
){
    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );
}

    return (
        "round_" +
        Date.now().toString(36) +
        "_" +
