<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover
    "
>

<meta name="theme-color" content="#02040b">

<title>BoomRoom｜Neon Dual Rocket</title>

<style>

/* =========================================================
   基礎
========================================================= */

:root{
    --bg:#02040b;

    --cyan:#23e8ff;
    --cyan2:#008cff;

    --pink:#ff38d1;
    --pink2:#7c24ff;

    --gold:#ffd84a;
    --green:#18ffad;

    --red:#ff344c;
    --orange:#ff7b2d;

    --white:#f7f9ff;
    --muted:#8b94ae;

    --panel:rgba(5,8,22,.92);
}

*{
    box-sizing:border-box;

    -webkit-tap-highlight-color:transparent;
}

html,
body{

    width:100%;
    height:100%;

    margin:0;

    overflow:hidden;

    background:#02040b;

    color:white;

    font-family:
        Arial,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

    user-select:none;

    touch-action:none;
}

body{
    position:fixed;
    inset:0;
}

button{
    font:inherit;
    -webkit-appearance:none;
    appearance:none;
}

button{
    cursor:pointer;
}

/* =========================================================
   CANVAS
========================================================= */

#gameCanvas{

    position:fixed;

    inset:0;

    z-index:1;

    width:100%;
    height:100%;

    display:block;

    touch-action:none;
}


/* =========================================================
   LOBBY
========================================================= */

#lobby{

    position:fixed;

    inset:0;

    z-index:20;

    display:flex;

    flex-direction:column;

    align-items:center;

    padding:
        max(12px,env(safe-area-inset-top))
        14px
        calc(84px + env(safe-area-inset-bottom));

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(27,43,102,.48),
            rgba(2,4,11,.97) 72%
        );

    overflow:hidden;
}

body.playing #lobby{

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}


/* =========================================================
   LOBBY HEADER
========================================================= */

.lobby-header{

    width:100%;

    max-width:620px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    flex-shrink:0;

    margin-bottom:12px;
}

.logo{

    font-size:17px;

    font-weight:1000;

    letter-spacing:.3px;
}

.logo small{

    display:block;

    margin-top:3px;

    color:var(--muted);

    font-size:9px;

    font-weight:600;
}

.online{

    padding:7px 10px;

    border-radius:12px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.1);

    color:#aeb7d1;

    font-size:10px;
}


/* =========================================================
   火箭選擇
========================================================= */

#rocketChoices{

    width:100%;

    max-width:620px;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:9px;

    flex-shrink:0;
}

.rocket-option{

    position:relative;

    min-height:190px;

    padding:13px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:20px;

    background:
        linear-gradient(
            160deg,
            rgba(13,22,52,.97),
            rgba(6,9,24,.95)
        );

    color:white;

    overflow:hidden;

    transition:
        .15s;
}

.rocket-option.a{

    --rocket-color:
        var(--cyan);
}

.rocket-option.b{

    --rocket-color:
        var(--pink);
}

.rocket-option.selected{

    border-color:
        var(--rocket-color);

    box-shadow:
        0 0 32px
        color-mix(
            in srgb,
            var(--rocket-color) 16%,
            transparent
        );

    transform:
        translateY(-2px);
}

.rocket-option:active{

    transform:
        scale(.99);
}

.option-badge{

    position:absolute;

    top:9px;
    right:9px;

    padding:
        4px
        7px;

    border-radius:999px;

    background:
        rgba(255,255,255,.06);

    color:#8089a4;

    font-size:8px;

    font-weight:1000;
}

.rocket-option.selected
.option-badge{

    background:
        color-mix(
            in srgb,
            var(--rocket-color) 13%,
            transparent
        );

    color:
        var(--rocket-color);
}

.option-title{

    position:relative;

    z-index:2;

    font-size:16px;

    font-weight:1000;
}

.option-sub{

    position:relative;

    z-index:2;

    margin-top:3px;

    color:var(--muted);

    font-size:9px;
}

.option-stats{

    position:relative;

    z-index:2;

    margin-top:9px;

    display:grid;

    gap:5px;
}

.option-stat{

    display:flex;

    justify-content:space-between;

    gap:6px;

    padding:
        6px 7px;

    border-radius:8px;

    background:
        rgba(255,255,255,.035);

    color:#9099b2;

    font-size:8px;
}

.option-stat strong{

    color:#e4e8f5;
}


/* =========================================================
   火箭縮圖
========================================================= */

.option-rocket{

    position:absolute;

    left:50%;

    bottom:4px;

    transform:
        translateX(-50%)
        scale(.73);

    transform-origin:
        bottom center;

    width:70px;

    height:100px;

    color:
        var(--rocket-color);
}

.option-rocket-body{

    position:absolute;

    left:50%;

    top:10px;

    transform:
        translateX(-50%);

    width:34px;

    height:63px;

    border-radius:
        55%
        55%
        37%
        37%;

    background:
        linear-gradient(
            90deg,
            #8d98ab,
            #fff,
            #dbe4ee
        );

    box-shadow:
        0 0 28px
        var(--rocket-color);
}

.option-rocket-window{

    position:absolute;

    left:50%;

    top:27px;

    transform:
        translateX(-50%);

    width:11px;

    height:11px;

    border-radius:50%;

    background:
        var(--rocket-color);

    border:
        2px solid white;
}

.option-fin-left,
.option-fin-right{

    position:absolute;

    top:48px;

    width:25px;

    height:20px;

    background:#aab4c6;
}

.option-fin-left{

    left:0;

    clip-path:
        polygon(
            100% 0,
            100% 100%,
            0 100%
        );
}

.option-fin-right{

    right:0;

    clip-path:
        polygon(
            0 0,
            100% 100%,
            0 100%
        );
}

.option-flame{

    position:absolute;

    left:50%;

    bottom:0;

    transform:
        translateX(-50%);

    width:20px;

    height:32px;

    background:
        linear-gradient(
            to bottom,
            white 0%,
            #ffd84a 25%,
            #ff732c 62%,
            transparent 100%
        );

    clip-path:
        polygon(
            50% 100%,
            0 0,
            100% 0
        );

    animation:
        flame .13s
        infinite alternate;
}

@keyframes flame{

    from{
        height:24px;
    }

    to{
        height:40px;
    }
}


/* =========================================================
   BET
========================================================= */

#betArea{

    width:100%;

    max-width:620px;

    margin-top:9px;

    flex-shrink:0;
}

.section-title{

    margin-bottom:5px;

    color:#7e87a3;

    font-size:8px;
}

#betButtons{

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:5px;
}

.bet-button{

    height:35px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:9px;

    background:
        rgba(255,255,255,.035);

    color:#b4bdd4;

    font-size:10px;

    font-weight:1000;
}

.bet-button.active{

    color:white;

    background:
        linear-gradient(
            135deg,
            #672fe0,
            #a126df
        );

    border-color:
        rgba(178,113,255,.7);
}


/* =========================================================
   加入按鈕
========================================================= */

#joinButton{

    position:absolute;

    left:14px;

    right:14px;

    bottom:
        max(10px,env(safe-area-inset-bottom));

    width:
        calc(100% - 28px);

    max-width:620px;

    height:59px;

    border:0;

    border-radius:30px;

    color:white;

    font-size:18px;

    font-weight:1000;

    background:
        linear-gradient(
            90deg,
            #6529eb,
            #a124d5
        );

    box-shadow:
        0 13px 30px
        rgba(0,0,0,.5),
        inset 0 1px
        rgba(255,255,255,.2);
}

#joinButton:disabled{

    opacity:.45;
}


/* =========================================================
   小提示
========================================================= */

#lobbyTip{

    width:100%;

    max-width:620px;

    text-align:center;

    margin-top:6px;

    color:#5e6780;

    font-size:8px;
}


/* =========================================================
   PLAY UI
========================================================= */

#playUI{

    position:fixed;

    inset:0;

    z-index:15;

    opacity:0;

    visibility:hidden;

    pointer-events:none;

    transition:.18s;
}

body.playing #playUI{

    opacity:1;

    visibility:visible;

}


/* =========================================================
   上方只有必要資訊
========================================================= */

#playTop{

    position:absolute;

    top:
        max(8px,env(safe-area-inset-top));

    left:9px;

    right:9px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    z-index:20;
}

#playRocketBadge{

    padding:
        7px 10px;

    border-radius:11px;

    background:
        rgba(2,6,15,.55);

    border:
        1px solid
        rgba(255,255,255,.09);

    backdrop-filter:
        blur(8px);

    font-size:10px;

    font-weight:1000;
}

#playRocketBadge.a{

    color:var(--cyan);

    border-color:
        rgba(35,232,255,.3);
}

#playRocketBadge.b{

    color:var(--pink);

    border-color:
        rgba(255,56,209,.3);
}

#playRightTools{

    display:flex;

    align-items:center;

    gap:5px;
}

#roundPlayers{

    padding:
        7px 9px;

    border-radius:11px;

    background:
        rgba(2,6,15,.55);

    border:
        1px solid
        rgba(255,255,255,.09);

    backdrop-filter:
        blur(8px);

    color:#c6cee2;

    font-size:9px;

    font-weight:900;
}

#tiltButton{

    pointer-events:auto;

    padding:
        7px 9px;

    border-radius:11px;

    border:
        1px solid
        rgba(255,255,255,.09);

    background:
        rgba(2,6,15,.65);

    color:#aab3cc;

    font-size:9px;

    font-weight:1000;
}

#tiltButton.enabled{

    color:var(--green);

    border-color:
        rgba(24,255,173,.4);
}


/* =========================================================
   倍率
========================================================= */

#playCenter{

    position:absolute;

    left:50%;

    top:20%;

    transform:
        translateX(-50%);

    width:100%;

    text-align:center;

    z-index:12;
}

#multiplier{

    font-family:
        Impact,
        "Arial Black",
        sans-serif;

    font-size:
        clamp(
            70px,
            21vw,
            135px
        );

    line-height:.9;

    letter-spacing:1px;

    transition:
        .1s;
}

#multiplier.a{

    color:var(--cyan);

    text-shadow:
        0 0 20px
        rgba(35,232,255,.55),
        0 0 70px
        rgba(0,140,255,.4);
}

#multiplier.b{

    color:var(--pink);

    text-shadow:
        0 0 20px
        rgba(255,56,209,.55),
        0 0 70px
        rgba(125,36,255,.4);
}

#multiplier.warning{

    color:var(--gold);

    text-shadow:
        0 0 24px
        rgba(255,216,74,.6),
        0 0 65px
        rgba(255,120,40,.4);
}

#multiplier.danger{

    color:var(--red);

    text-shadow:
        0 0 26px
        rgba(255,52,76,.7),
        0 0 85px
        rgba(255,0,20,.45);
}

#multiplier.win{

    color:var(--green);

    transform:
        scale(1.12);

    text-shadow:
        0 0 26px
        rgba(24,255,173,.7),
        0 0 85px
        rgba(0,255,160,.4);
}

#multiplier.crash{

    color:var(--red);

    transform:
        scale(1.22);

    text-shadow:
        0 0 30px
        #ff223e,
        0 0 100px
        rgba(255,0,30,.75);
}

#status{

    margin-top:10px;

    color:#b2b9cf;

    font-size:10px;

    font-weight:700;
}

#controlHint{

    margin-top:4px;

    color:#66708a;

    font-size:8px;
}


/* =========================================================
   隕石警告
========================================================= */

#meteorWarning{

    position:absolute;

    left:50%;

    top:40%;

    transform:
        translate(-50%,-50%);

    padding:
        8px 14px;

    border-radius:999px;

    background:
        rgba(105,8,15,.78);

    border:
        2px solid
        rgba(255,62,76,.7);

    color:#fff1f2;

    font-size:10px;

    font-weight:1000;

    letter-spacing:.6px;

    opacity:0;

    z-index:25;

    pointer-events:none;

    box-shadow:
        0 0 25px
        rgba(255,40,40,.35);

    transition:.1s;
}

#meteorWarning.show{

    opacity:1;

    animation:
        warningFlash
        .35s
        infinite alternate;
}

@keyframes warningFlash{

    from{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    to{
        transform:
            translate(-50%,-50%)
            scale(1.06);
    }
}


/* =========================================================
   手動左右控制
========================================================= */

#manualControls{

    position:absolute;

    left:12px;

    right:12px;

    bottom:
        calc(
            86px +
            env(safe-area-inset-bottom)
        );

    display:flex;

    justify-content:space-between;

    align-items:center;

    pointer-events:none;

    z-index:21;

    transition:.18s;
}

#manualControls.hidden{

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}

.moveButton{

    pointer-events:auto;

    width:68px;

    height:68px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.18);

    background:
        rgba(4,8,19,.72);

    backdrop-filter:
        blur(8px);

    color:white;

    font-size:30px;

    font-weight:1000;

    box-shadow:
        0 8px 28px
        rgba(0,0,0,.38);

    display:flex;

    align-items:center;

    justify-content:center;
}

.moveButton:active{

    transform:
        scale(.9);

    background:
        rgba(255,255,255,.15);
}

#moveLeft{

    border-color:
        rgba(35,232,255,.42);

    color:
        var(--cyan);
}

#moveRight{

    border-color:
        rgba(255,56,209,.42);

    color:
        var(--pink);
}


/* =========================================================
   底部
========================================================= */

#playBottom{

    position:absolute;

    left:10px;

    right:10px;

    bottom:
        max(8px,env(safe-area-inset-bottom));

    z-index:22;
}

#aliveText{

    width:max-content;

    margin:
        0 auto 7px;

    padding:
        5px 9px;

    border-radius:999px;

    background:
        rgba(2,6,15,.55);

    border:
        1px solid
        rgba(255,255,255,.07);

    color:#8d96ad;

    font-size:8px;
}

#ejectButton{

    pointer-events:auto;

    width:100%;

    height:62px;

    border:0;

    border-radius:31px;

    color:white;

    font-size:21px;

    font-weight:1000;

    background:
        linear-gradient(
            90deg,
            #ff393c,
            #ff9e26
        );

    box-shadow:
        0 14px 34px
        rgba(0,0,0,.5),
        0 0 30px
        rgba(255,100,30,.22);

    animation:
        ejectPulse
        .5s
        infinite
        alternate;
}

#ejectButton:disabled{

    animation:none;

    opacity:.4;
}

@keyframes ejectPulse{

    from{
        transform:
            scale(1);
    }

    to{
        transform:
            scale(1.015);
    }
}


/* =========================================================
   結果
========================================================= */

#resultOverlay{

    position:fixed;

    inset:0;

    z-index:50;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:18px;

    background:
        rgba(0,0,0,.5);

    backdrop-filter:
        blur(8px);

    opacity:0;

    visibility:hidden;

    pointer-events:none;

    transition:.18s;
}

#resultOverlay.show{

    opacity:1;

    visibility:visible;

    pointer-events:auto;
}

.resultCard{

    width:min(420px,100%);

    padding:20px;

    border-radius:22px;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        linear-gradient(
            160deg,
            rgba(10,14,34,.98),
            rgba(4,6,17,.98)
        );

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.7);

    text-align:center;
}

.resultTitle{

    color:#858eaa;

    font-size:10px;
}

.resultMain{

    margin-top:7px;

    font-size:34px;

    font-weight:1000;
}

.resultSub{

    margin-top:5px;

    color:#858ea9;

    font-size:10px;
}

#leaderboard{

    margin-top:14px;

    display:grid;

    gap:5px;
}

.rank{

    display:grid;

    grid-template-columns:
        25px
        1fr
        auto;

    gap:7px;

    align-items:center;

    padding:
        7px 9px;

    border-radius:10px;

    background:
        rgba(255,255,255,.035);

    text-align:left;

    font-size:10px;
}

.rank-name{

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    font-weight:900;
}

.rank-value{

    color:var(--green);

    font-weight:1000;
}

#nextRound{

    width:100%;

    height:44px;

    margin-top:12px;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #6429e3,
            #8c27c8
        );

    color:white;

    font-weight:1000;
}


/* =========================================================
   TOAST
========================================================= */

#toast{

    position:fixed;

    left:50%;

    top:52%;

    transform:
        translate(-50%,-50%);

    z-index:60;

    padding:
        9px 14px;

    border-radius:999px;

    background:
        rgba(3,6,14,.9);

    border:
        1px solid
        rgba(255,255,255,.12);

    color:#e1e6f6;

    font-size:10px;

    opacity:0;

    pointer-events:none;

    white-space:nowrap;

    transition:.15s;
}

#toast.show{

    opacity:1;
}


/* =========================================================
   短手機
========================================================= */

@media(
    max-height:700px
){

    .rocket-option{

        min-height:165px;
    }

    .option-stats{

        display:none;
    }

    .option-rocket{

        transform:
            translateX(-50%)
            scale(.62);
    }

    #playCenter{

        top:18%;
    }

    #ejectButton{

        height:56px;
    }

    .moveButton{

        width:60px;
        height:60px;
    }
}

</style>
</head>


<body>


<canvas id="gameCanvas"></canvas>


<!-- =======================================================
     大廳
======================================================= -->

<section id="lobby">

    <div class="lobby-header">

        <div class="logo">

            🚀 NEON DUAL ROCKET

            <small>
                BoomRoom · 雙火箭派對
            </small>

        </div>

        <div class="online">

            👥 房間
            <span id="onlineCount">
                1
            </span>

        </div>

    </div>


    <!-- 火箭選擇 -->

    <div id="rocketChoices">


        <button
            id="rocketA"
            class="rocket-option a selected"
        >

            <div class="option-badge">
                已選擇
            </div>

            <div class="option-title">
                🔵 穩定號
            </div>

            <div class="option-sub">
                節奏平穩、比較容易掌握
            </div>

            <div class="option-stats">

                <div class="option-stat">
                    <span>加速</span>
                    <strong>★★★☆☆</strong>
                </div>

                <div class="option-stat">
                    <span>風險</span>
                    <strong>★★☆☆☆</strong>
                </div>

                <div class="option-stat">
                    <span>特色</span>
                    <strong>穩定成長</strong>
                </div>

            </div>


            <div class="option-rocket">

                <div class="option-rocket-body">

                    <div class="option-rocket-window"></div>

                </div>

                <div class="option-fin-left"></div>

                <div class="option-fin-right"></div>

                <div class="option-flame"></div>

            </div>

        </button>


        <button
            id="rocketB"
            class="rocket-option b"
        >

            <div class="option-badge">
                高風險
            </div>

            <div class="option-title">
                🩷 狂暴號
            </div>

            <div class="option-sub">
                加速更快、倍率波動更大
            </div>

            <div class="option-stats">

                <div class="option-stat">
                    <span>加速</span>
                    <strong>★★★★★</strong>
                </div>

                <div class="option-stat">
                    <span>風險</span>

/* =========================================================

let audio =
    null;


function initAudio(){

    if(
        !audio
    ){

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(
            AudioContext
        ){

            try{

                audio =
                    new AudioContext();

            }catch(e){}

        }

    }


    if(
        audio &&
        audio.state ===
        "suspended"
    ){

        audio.resume()
        .catch(
            () => {}
        );

    }

}


function tone(
    frequency,
    duration,
    type,
    volume,
    slide=0
){

    if(
        !audio
    ){
        return;
    }


    try{

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();


        oscillator.type =
            type;


        oscillator.frequency.setValueAtTime(
            frequency,
            audio.currentTime
        );


        if(
            slide
        ){

            oscillator.frequency.linearRampToValueAtTime(
                frequency +
                slide,
                audio.currentTime +
                duration
            );

        }


        gain.gain.setValueAtTime(
            volume,
            audio.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            audio.currentTime +
            duration
        );


        oscillator.connect(
            gain
        );

        gain.connect(
            audio.destination
        );


        oscillator.start();


        oscillator.stop(
            audio.currentTime +
            duration
        );

    }catch(e){}

}

function purchaseSuccess(
    itemId
){

    const match =
        /^neon_dual_bet_(\d+)$/
        .exec(
            String(itemId)

    if(
        !match
    ){
        return;
    }


    selectedBet =
        Number(
            match[1]
        );


    const me =
        players.get(
            user.id

    me.bet =
        selectedBet;

    me.rocket =
        selectedRocket;

    me.ready =
        true;

    me.status =

    me.roundId =
        null;

    me.lastSeen =
        Date.now();

    localReady =
        true;

    enterGameplay();


    sendEvent(

            bet:

    if(
        isHost()

        maybeStartRound();

    }

}

function handleHello(
    sender,
    payload
){

    const incoming =
        payload.user ||
        {};


    const id =
        String(
            incoming.id ||
            sender
        );


    candidates.set(
        id,
        {
            id,
            joinedAt:
                Number(
                    payload.joinedAt ||
                    Date.now()
                )
        }
    );


    if(
        !players.has(id)
    ){

        players.set(
            id,
            {
                id,

                username:
                    String(
                        incoming.username ||
                        "玩家"
                    ),

                avatar:
                    String(
                        incoming.avatar ||
                        ""
                    ),

                joinedAt:
                    Number(
                        payload.joinedAt ||
                        Date.now()

                bet:0,

                rocket:"A",

                ready:false,

                status:"waiting",

                x:0,

                bonus:0,

                reward:0,

                cashoutAt:0,

                roundId:null,

                lastSeen:
                    Date.now()
            }
        );

    }


    players.get(
        id
    ).lastSeen =
        Date.now();


    electHost();


    if(
        isHost()
    ){

        sendLobbyState();

    }


    updateRoomCount();

}


/* =========================================================
   PLAYER READY
========================================================= */

function handlePlayerReady(
    sender,
    payload
){

    const id =
        String(
            sender
        );


    if(
        !players.has(id)
    ){

        players.set(
            id,
            {
                id,

                username:
                    String(
                        payload.username ||
                        "玩家"
                    ),

                avatar:
                    String(
                        payload.avatar ||
                        ""
                    ),

                joinedAt:
                    Number(
                        payload.joinedAt ||
                        Date.now()
                    ),

                bet:0,

                rocket:"A",

                ready:false,

                status:"waiting",

                x:0,

                bonus:0,

                reward:0,

                cashoutAt:0,

                roundId:null,

                lastSeen:
                    Date.now()
            }
        );

    }


    const p =
        players.get(
            id
        );


    p.username =
        String(
            payload.username ||
            p.username
        );


    p.avatar =
        String(
            payload.avatar ||
            p.avatar
        );


    p.bet =
        Number(
            payload.bet ||
            0
        );


    p.rocket =
        payload.rocket === "B"
            ? "B"
            : "A";


    p.ready =
        true;


    p.status =
        "ready";


    p.lastSeen =
        Date.now();


    updateRoomCount();


    if(
        isHost()
    ){

        sendLobbyState();

        maybeStartRound();

/* =========================================================
   START ROUND
========================================================= */

function getReadyPlayers(){

    return Array.from(
        players.values()
    )
    .filter(
        p =>
            p.ready &&
            p.bet > 0
    );

}


function generateCrashPoint(
    rocketId
){

    const rocket =
        ROCKETS[
            rocketId
        ];


    const r =
        Math.random();


    const min =
        rocketId === "A"
            ? 1.08
            : 1.04;


    const power =
        rocketId === "A"
            ? 1.55
            : 2.0;


    const point =
        min +
        Math.pow(
            r,
            power
        ) *
        (
            rocket.maxCrash -
            min
        );


    return Number(
        Math.max(
            min,
            Math.min(
                rocket.maxCrash,
                point
            )
        )
        .toFixed(2)
    );

}


function maybeStartRound(){

    if(
        !isHost() ||
        state !== "LOBBY"
    ){
        return;
    }


    const ready =
        getReadyPlayers();


    if(
        ready.length === 0
    ){
        return;
    }


    if(
        Date.now() -
        lastRoundStart <
        1800
    ){
        return;
    }


    lastRoundStart =
        Date.now();


    const roundId =
        "round_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
        .toString(36)
        .slice(2,7);


    const startAt =
        Date.now() +
        START_DELAY;


    currentRoundId =
        roundId;


    roundStartAt =
        startAt;


    crashPointA =
        generateCrashPoint(
            "A"
        );


    crashPointB =
        generateCrashPoint(
            "B"
        );


    crashedA =
        false;

    crashedB =
        false;


    const snapshot = {

        gameId:
            GAME_ID,

        roundId:
            roundId,

        hostId:
            user.id,

        startAt:
            startAt,

        crashPointA:
            crashPointA,

        crashPointB:
            crashPointB,

        players:
            ready.map(
                p => ({

                    id:
                        p.id,

                    username:
                        p.username,

                    avatar:
                        p.avatar,

                    bet:
                        p.bet,

                    rocket:
                        p.rocket,

                    x:0

                })
            )

    };


    state =
        "COUNTDOWN";


    sendEvent(

        snapshot
    );


    applyRoundStart(

    );

/* =========================================================
   MULTIPLIER
========================================================= */

function getBaseMultiplier(
    rocketId,
    now=Date.now()
){

    if(
        !roundStartAt
    ){
        return 1;
    }


    const elapsed =
        Math.max(
            0,
            now -
            roundStartAt
        ) /
        1000;


    return Math.pow(
        ROCKETS[
            rocketId
        ].growth,
        elapsed
    );

}


function getMyMultiplier(){

    const me =
        players.get(
            user.id
        );


    if(
        !me
    ){
        return 1;
    }


    return Math.min(
        MAX_PAYOUT,

        getBaseMultiplier(
            me.rocket
        ) +

        Math.max(
            0,
            Math.min(
                1.5,
                me.bonus
            )
        )
    );

}

/* =========================================================
   HOST WORLD
========================================================= */

function hostWorldTick(){

    if(
        !isHost() ||
        state !== "FLYING"
    ){
        return;
    }


    const now =
        Date.now();


    if(
        !lastWorldTick
    ){

        lastWorldTick =
            now;

    }


    const dt =
        Math.min(
            .09,
            Math.max(
                .001,
                (
                    now -
                    lastWorldTick
                ) /
                1000
            )
        );


    lastWorldTick =
        now;


    const multA =
        getBaseMultiplier(
            "A",
            now
        );


    const multB =
        getBaseMultiplier(
            "B",
            now
        );


    if(
        !crashedA &&
        multA >=
        crashPointA
    ){

        crashRocket(
            "A"
        );

    }


    if(
        !crashedB &&
        multB >=
        crashPointB
    ){

        crashRocket(
            "B"
        );

    }


    /*
       隕石生成頻率
    */

    if(
        now -
        lastMeteorSpawn >
        720
    ){

        spawnMeteor();

        lastMeteorSpawn =
            now;

    }


    /*
       能量球
    */

    if(
        now -
        lastEnergySpawn >
        980
    ){

        spawnEnergy();

        lastEnergySpawn =
            now;

    }


    worldItems.forEach(
        item => {

            item.y +=
                item.speed *
                dt;

            item.life -=
                dt;

        }
    );


    processCollisions();


    worldItems =
        worldItems.filter(
            item =>
                item.life > 0 &&
                item.y <
                1.2
        );


    broadcastWorld();


    if(
        crashedA &&
        crashedB
    ){

        finishRound();

    }

}

/* =========================================================
   COLLISION
========================================================= */

function processCollisions(){

    players.forEach(
        player => {

            if(
                player.status !==
                "flying"
            ){
                return;
            }


            worldItems.forEach(
                item => {

                    if(
                        item.rocket !==
                        player.rocket
                    ){
                        return;
                    }


                    if(
                        item.y <
                        .72 ||
                        item.y >
                        .92
                    ){
                        return;
                    }


                    const distance =
                        Math.abs(
                            player.x -
                            item.x
                        );


                    const hitRange =
                        item.type ===
                        "meteor"
                            ? .22
                            : .14;


                    if(
                        distance >
                        hitRange
                    ){
                        return;
                    }


                    item.life =
                        0;


                    if(
                        item.type ===
                        "energy"
                    ){

                        player.bonus =
                            Math.min(
                                1.5,
                                player.bonus +
                                .08
                            );


                        if(
                            player.id ===
                            user.id
                        ){

                            soundCollect();

                            showToast(
                                "⚡ 能量 +0.08x"
                            );

                        }

                    }else{

                        player.bonus =
                            Math.max(
                                0,
                                player.bonus -
                                .11
                            );


                        if(
                            player.id ===
                            user.id
                        ){

                            soundMeteorHit();

                            screenShake(
                                9
                            );

                            showToast(
                                "☄️ 隕石撞擊！"
                            );

                        }

                    }

                }
            );

        }
    );

}

/* =========================================================
   Crash
========================================================= */

function crashRocket(
    rocketId
){

    if(
        rocketId ===
        "A"
    ){

        crashedA =
            true;

    }else{

        crashedB =
            true;

    }


    players.forEach(
        p => {

            if(
                p.rocket !==
                rocketId
            ){
                return;
            }


            if(
                p.status !==
                "flying"
            ){
                return;
            }


            p.status =
                "crashed";

            p.reward =
                0;

            p.cashoutAt =
                0;


            if(
                p.id ===
                user.id
            ){

                settleLoss();

            }

        }
    );


    sendEvent(
        "ROCKET_CRASHED",
        {

            gameId:
                GAME_ID,

            roundId:
                currentRoundId,

            rocket:
                rocketId,

            crashPoint:
                rocketId === "A"
                    ? crashPointA
                    : crashPointB

        }
    );


    soundCrash();


    if(
        selectedRocket ===
        rocketId
    ){

        screenShake(
            18
        );

        meteorWarning.classList.remove(
            "show"
        );

    }

}


function handleRocketCrashed(
    sender,
    payload
){

    if(
        hostId &&
        String(sender) !==
        String(hostId)
    ){
        return;
    }


    const rocket =
        payload.rocket ===
        "B"
            ? "B"
            : "A";


    if(
        rocket ===
        "A"
    ){

        crashedA =
            true;

        crashPointA =
            Number(
                payload.crashPoint
            );

    }else{

        crashedB =
            true;

        crashPointB =
            Number(
                payload.crashPoint
            );

    }


    if(
        rocket ===
        selectedRocket
    ){

        soundCrash();

        screenShake(
            18
        );

    }

}

    const me =
        players.get(
            user.id
        );


    if(
        !me ||
        me.status !==
        "flying"

    const selectedCrashed =

            playerId
        );


    if(
        !player ||
        player.status !==
        "flying"
    ){
        return;
    }


    const crashed =
        player.rocket === "A"
            ? crashedA
            : crashedB;


    if(
        crashed
    ){
        return;
    }


    const multiplier =
        Math.min(
            MAX_PAYOUT,

            Math.max(
                1.01,

                getBaseMultiplier(
                    player.rocket
                ) +

                Math.max(
                    0,
                    Math.min(
                        1.5,
                        player.bonus
                    )
                )
            )
        );


    const reward =
        Math.floor(
            player.bet *
            multiplier
        );


    player.status =
        "cashed";


    player.cashoutAt =
        multiplier;


    player.reward =
        reward;


    sendEvent(
        "CASHOUT_CONFIRMED",
        {

            gameId:
                GAME_ID,

            roundId:
                currentRoundId,

            playerId:
                player.id,

            username:
                player.username,

            rocket:
                player.rocket,

            bet:
                player.bet,

            multiplier:
                multiplier,

            reward:
                reward

        }
    );


    if(
        player.id ===
        user.id
    ){

        applyCashout(
            multiplier,
            reward
        );

    }

}

function finishRound(){

    if(
        !isHost() ||
        state ===
        "RESULT"
    ){
        return;
    }


    state =
        "RESULT";


    const results =
        Array.from(
            players.values()
        )
        .filter(
            p =>
                p.roundId ===
                currentRoundId &&
                p.bet > 0
        )
        .map(
            p => ({

                id:
                    p.id,

                username:
                    p.username,

                avatar:
                    p.avatar,

                bet:
                    p.bet,

                rocket:
                    p.rocket,

                status:
                    p.status,

                reward:
                    Math.max(
                        0,
                        Math.floor(
                            p.reward
                        )
                    ),

                cashoutAt:
                    p.cashoutAt

            })
        );


    results.sort(
        (a,b) => {

            const netA =
                a.reward -
                a.bet;

            const netB =
                b.reward -
                b.bet;


            if(
                netA !==
                netB
            ){

                return (
                    netB -
                    netA
                );

            }


            return (
                b.cashoutAt -
                a.cashoutAt
            );

        }
    );


    sendEvent(
        "ROUND_RESULT",
        {

            gameId:
                GAME_ID,

            roundId:
                currentRoundId,

            crashPointA,
            crashPointB,

            results

        }
    );


    applyResult(
        results
    );

}


function handleRoundResult(
    sender,
    payload
){

    if(
        hostId &&
        String(sender) !==
        String(hostId)
    ){
        return;
    }


    if(
        String(
            payload.roundId
        ) !==
        String(
            currentRoundId
        )
    ){
        return;
    }


    applyResult(
        Array.isArray(
            payload.results
        )
            ? payload.results
            : []
    );

}


function applyResult(
    results
){

    state =
        "RESULT";


    const me =
        results.find(
            r =>
                String(r.id) ===
                user.id
        );


    const reward =
        me
            ? Number(
                me.reward ||
                0
            )
            : 0;


    if(
        reward <= 0 &&
        !roundRewardSent
    ){

        roundRewardSent =
            true;


        if(
            SDK_READY
        ){

            try{

                SDK.gameOver(
                    0
                );

            }catch(e){}

        }

    }


    resultTitle.textContent =
        reward > 0
            ? "🚀 成功逃脫"
            : "💥 本局爆炸";


    resultMain.textContent =
        reward > 0
            ? `+${reward.toLocaleString()} 🪙`
            : "0 🪙";


    resultSub.textContent =
        me
            ? `${rocketName(me.rocket)} · ${
                Number(
                    me.cashoutAt ||
                    0
                ).toFixed(2)
              }x`
            : "—";


    leaderboard.innerHTML =
        "";


    results
    .slice(
        0,
        5
    )
    .forEach(
        (player,index) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "rank";


            const net =
                Number(
                    player.reward ||
                    0
                ) -
                Number(
                    player.bet ||
                    0
                );


            const medal =
                index === 0
                    ? "🥇"
                    : index === 1
                        ? "🥈"
                        : index === 2
                            ? "🥉"
                            : String(
                                index + 1
                              );


            row.innerHTML =
                `<div>${medal}</div>`;


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "rank-name";


            name.textContent =
                player.username ||
                "玩家";


            row.appendChild(
                name
            );


            const value =
                document.createElement(
                    "div"
                );


            value.className =
                "rank-value";


            value.textContent =
                `${
                    net >= 0
                        ? "+"
                        : ""
                }${net.toLocaleString()}`;


            row.appendChild(
                value
            );


            leaderboard.appendChild(
                row
            );

        }
    );


    resultOverlay.classList.add(
        "show"
    );


    if(
        reward > 0
    ){

        soundCashout();

    }


    setTimeout(
        () => {

            if(
                state ===
                "RESULT"
            ){

                resetRound();

            }

        },
        RESULT_DELAY
    );

}

/* =========================================================
   DEVICE ORIENTATION
========================================================= */

let tiltEnabled =
    false;

let tiltCalibrating =
    false;

let tiltZero =
    0;

let filteredTilt =
    0;


function handleOrientation(
    event
){

    if(
        !tiltEnabled ||
        tiltCalibrating
    ){
        return;
    }


    if(
        typeof event.gamma !==
        "number"
    ){
        return;
    }


    /*
       Portrait 模式：
       gamma = 左右傾斜角度
    */

    let gamma =
        event.gamma;


    /*
       如果 WebView / 系統方向資訊出現反向，
       仍然保持直覺：
       左傾 = 左
       右傾 = 右
    */

    let delta =
        gamma -
        tiltZero;


    /*
       小角度死區
    */

    if(
        Math.abs(delta) <
        2.2
    ){

        delta =
            0;

    }


    delta =
        clamp(
            delta /
            20,
            -1,
            1
        );


    filteredTilt =
        filteredTilt * .78 +
        delta * .22;


    localX =
        clamp(
            filteredTilt,
            -1,
            1
        );


    sendInput();

}


/* =========================================================
   體感啟用
========================================================= */

tiltButton.addEventListener(
    "click",
    async () => {

        initAudio();

        await enableTilt();

    }
);


async function enableTilt(){

    try{

        /*
           iOS 必須從真正的 click
           直接呼叫 requestPermission。
        */

        if(
            typeof DeviceOrientationEvent !==
            "undefined" &&

            typeof DeviceOrientationEvent.requestPermission ===
            "function"
        ){

            const permission =
                await DeviceOrientationEvent
                    .requestPermission();


            if(
                permission !==
                "granted"
            ){

                showToast(
                    "體感權限未開啟，使用左右按鍵"
                );

                manualControls.classList.remove(
                    "hidden"
                );

                return;

            }

        }


        tiltCalibrating =
            true;


        tiltButton.textContent =
            "📱 校準中…";


        const samples =
            [];


        const collector =
            event => {

                if(
                    typeof event.gamma ===
                    "number"
                ){

                    samples.push(
                        event.gamma
                    );

                }

            };


        window.addEventListener(
            "deviceorientation",
            collector,
            true
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    600
                )
        );


        window.removeEventListener(
            "deviceorientation",
            collector,
            true
        );


        if(
            samples.length
        ){

            tiltZero =
                samples.reduce(
                    (
                        total,
                        value
                    ) =>
                        total +
                        value,
                    0
                ) /
                samples.length;

        }else{

            tiltZero =
                0;

        }


        window.addEventListener(
            "deviceorientation",
            handleOrientation,
            true
        );


        tiltEnabled =
            true;


        tiltCalibrating =
            false;


        filteredTilt =
            0;


        localX =
            0;


        tiltButton.classList.add(
            "enabled"
        );


        tiltButton.textContent =
            "✅ 體感 ON";


        /*
           成功開啟後隱藏左右按鍵，
           讓遊戲區更乾淨。
        */

        manualControls.classList.add(
            "hidden"
        );


        controlHint.textContent =
            "📱 左右傾斜控制火箭";


        showToast(
            "體感控制已啟用",
            1200
        );


    }catch(error){

        tiltCalibrating =
            false;


        tiltEnabled =
            false;


        manualControls.classList.remove(
            "hidden"
        );


        tiltButton.textContent =
            "📱 開啟體感";


        showToast(
            "無法使用體感，改用左右按鍵"
        );

    }

}

/* =========================================================
   左右控制
========================================================= */

let manualDirection =
    0;

let manualTimer =
    null;


function startManualMove(
    direction
){

    initAudio();


    if(
        state !==
        "FLYING"
    ){
        return;
    }


    manualDirection =
        direction;


    /*
       立即移動一次
    */

    localX =
        clamp(
            localX +
            direction *
            .11,
            -1,
            1
        );


    sendInput();


    clearInterval(
        manualTimer
    );


    manualTimer =
        setInterval(
            () => {

                if(
                    state !==
                    "FLYING"
                ){

                    stopManualMove();

                    return;

                }


                localX =
                    clamp(
                        localX +
                        manualDirection *
                        .055,
                        -1,
                        1
                    );


                sendInput();

            },
            45
        );

}


function stopManualMove(){

    manualDirection =
        0;


    clearInterval(
        manualTimer
    );


    manualTimer =
        null;

}

   pointer events：

/* =========================================================
   TOUCH FALLBACK
   直接滑 Canvas 也可以控制
========================================================= */

let dragging =
    false;


canvas.addEventListener(
    "pointerdown",
    event => {

        if(
            !body.classList.contains(
                "playing"
            )
        ){
            return;
        }


        if(
            tiltEnabled
        ){
            return;
        }


        dragging =

        updateTouchX(

        );

    }
);

    "pointermove",
    event => {

            !dragging ||
            tiltEnabled

        updateTouchX(

        );

    }
);

    "pointerup",
    () => {

        dragging =
            false;

    }
);


function updateTouchX(
    clientX
){

    localX =
        clamp(
            (
                clientX -
                width / 2
            ) /
            (
                width / 2
            ),
            -1,
            1
        );


    sendInput();

}

   WORLD DRAW

let stars =
    [];


function createStars(){

    stars =
        [];


    const count =
        Math.min(
            160,
            Math.max(
                90,
                Math.floor(
                    width *
                    height /
                    9500
                )
            )
        );


    for(
        let i=0;
        i<count;
        i++
    ){

        stars.push({

            x:
                Math.random() *
                width,

            y:
                Math.random() *
                height,

            size:
                Math.random() *
                1.7 +
                .3,

            alpha:
                Math.random() *
                .7 +
                .2,

            speed:
                Math.random() *
                .7 +
                .2

        });

    }

}


function drawBackground(){

    ctx.fillStyle =
        "#02040b";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    const rgb =
        selectedRocket === "A"
            ? "35,232,255"
            : "255,56,209";


    const glow =
        ctx.createRadialGradient(
            width / 2,
            height * .48,
            30,
            width / 2,
            height * .48,
            height * .8
        );


    glow.addColorStop(
        0,
        `rgba(${rgb},.14)`
    );


    glow.addColorStop(
        .55,
        `rgba(${rgb},.035)`
    );


    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        glow;


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    const speed =
        state ===
        "FLYING"
            ? Math.min(
                getMyMultiplier(),
                9
            )
            : .8;


    stars.forEach(
        star => {

            star.y +=
                star.speed *
                speed;


            if(
                star.y >
                height
            ){

                star.y =
                    -2;

                star.x =
                    Math.random() *
                    width;

            }


            ctx.globalAlpha =
                star.alpha;


            ctx.fillStyle =
                "#fff";


            ctx.beginPath();


            ctx.arc(
                star.x,
                star.y,
                star.size,
                0,
                Math.PI * 2
            );


            ctx.fill();

        }
    );


    ctx.globalAlpha =
        1;

}


/* =========================================================
   單火箭航道
========================================================= */

function getLane(){

    return {

        center:
            width / 2,

        width:
            Math.min(
                width * .88,
                470
            ),

        top:
            height * .12,

        bottom:
            height * .94

    };

}


function drawLane(
    time
){

    const lane =
        getLane();


    const left =
        lane.center -
        lane.width / 2;


    const right =
        lane.center +
        lane.width / 2;


    const rgb =
        selectedRocket === "A"
            ? "35,232,255"
            : "255,56,209";


    /*
       透明航道
    */

    const laneGradient =
        ctx.createLinearGradient(
            lane.center,
            lane.top,
            lane.center,
            lane.bottom
        );


    laneGradient.addColorStop(
        0,
        `rgba(${rgb},0)`
    );


    laneGradient.addColorStop(
        .5,
        `rgba(${rgb},.035)`
    );


    laneGradient.addColorStop(
        1,
        `rgba(${rgb},.13)`
    );


    ctx.fillStyle =
        laneGradient;


    ctx.fillRect(
        left,
        lane.top,
        lane.width,
        lane.bottom -
        lane.top
    );


    /*
       邊界
    */

    ctx.strokeStyle =
        `rgba(${rgb},.2)`;


    ctx.lineWidth =
        1.4;


    ctx.beginPath();


    ctx.moveTo(
        left,
        lane.top
    );


    ctx.lineTo(
        left,
        lane.bottom
    );


    ctx.moveTo(
        right,
        lane.top
    );


    ctx.lineTo(
        right,
        lane.bottom
    );


    ctx.stroke();


    /*
       流線
    */

    const scroll =
        (
            performance.now() *
            .06
        ) %
        55;


    ctx.strokeStyle =
        `rgba(${rgb},.06)`;


    for(
        let y =
            lane.top +
            scroll;

        y <
        lane.bottom;

        y +=55
    ){

        ctx.beginPath();


        ctx.moveTo(
            left + 13,
            y
        );


        ctx.lineTo(
            right - 13,
            y
        );


        ctx.stroke();

    }

}


/* =========================================================
   大型隕石
========================================================= */

function drawMeteor(
    meteor,
    time
){

    if(
        meteor.rocket !==
        selectedRocket
    ){
        return;
    }


    const lane =
        getLane();


    const x =
        lane.center +
        meteor.x *
        (
            lane.width *
            .43
        );


    const y =
        lane.top +
        meteor.y *
        (
            lane.bottom -
            lane.top
        );


    const size =
        meteor.size ||
        32;


    ctx.save();


    /*
       超明顯尾焰
    */

    const tail =
        ctx.createLinearGradient(
            x,
            y -
                size *
                3.8,

            x,
            y
        );


    tail.addColorStop(
        0,
        "rgba(255,25,15,0)"
    );


    tail.addColorStop(
        .38,
        "rgba(255,62,20,.25)"
    );


    tail.addColorStop(
        .72,
        "rgba(255,132,35,.75)"
    );


    tail.addColorStop(
        1,
        "rgba(255,235,110,.98)"
    );


    ctx.fillStyle =
        tail;


    ctx.beginPath();


    ctx.moveTo(
        x -
        size *
        .42,

        y
    );


    ctx.lineTo(
        x,

        y -
        size *
        3.8
    );


    ctx.lineTo(
        x +
        size *
        .42,

        y
    );


    ctx.closePath();


    ctx.fill();


    /*
       危險圈
    */

    ctx.shadowBlur =
        28;


    ctx.shadowColor =
        "#ff2d32";


    ctx.strokeStyle =
        "rgba(255,56,68,.8)";


    ctx.lineWidth =
        3;


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        size *
        1.7,
        0,
        Math.PI * 2
    );


    ctx.stroke();


    /*
       外圈閃爍
    */

    const ring =
        size *
        (
            2.0 +
            Math.sin(
                time *
                .01
            ) *
            .12
        );


    ctx.strokeStyle =
        "rgba(255,106,50,.33)";


    ctx.lineWidth =
        2;


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        ring,
        0,
        Math.PI * 2
    );


    ctx.stroke();


    /*
       隕石本體
    */

    const rock =
        ctx.createRadialGradient(
            x -
                size *
                .3,

            y -
                size *
                .3,

            2,

            x,
            y,

            size
        );


    rock.addColorStop(
        0,
        "#ffd08a"
    );


    rock.addColorStop(
        .25,
        "#ff8a45"
    );


    rock.addColorStop(
        .62,
        "#d6382b"
    );


    rock.addColorStop(
        1,
        "#58151a"
    );


    ctx.fillStyle =
        rock;


    ctx.beginPath();


    const points =
        9;


    for(
        let i=0;
        i<points;
        i++
    ){

        const angle =
            (
                Math.PI * 2 /
                points
            ) *
            i +
            time *
            .001;


        const radius =
            size *
            (
                .75 +
                Math.sin(
                    i *
                    4.73
                ) *
                .13
            );


        const px =
            x +
            Math.cos(
                angle
            ) *
            radius;


        const py =
            y +
            Math.sin(
                angle
            ) *
            radius;


        if(
            i === 0
        ){

            ctx.moveTo(
                px,
                py
            );

        }else{

            ctx.lineTo(
                px,
                py
            );

        }

    }


    ctx.closePath();


    ctx.fill();


    /*
       隕石坑
    */

    ctx.shadowBlur =
        0;


    ctx.fillStyle =
        "rgba(67,10,14,.72)";


    [
        [-.28,-.18,.14],
        [.28,-.08,.11],
        [.02,.28,.12]
    ]
    .forEach(
        pit => {

            ctx.beginPath();


            ctx.arc(
                x +
                size *
                pit[0],

                y +
                size *
                pit[1],

                size *
                pit[2],

                0,
                Math.PI * 2
            );


            ctx.fill();

        }
    );


    /*
       大型危險 !
    */

    ctx.fillStyle =
        "#ffffff";


    ctx.font =
        `900 ${Math.max(
            14,
            size * .52
        )}px Arial`;


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(
        "!",
        x,
        y
    );


    ctx.restore();

}


/* =========================================================
   能量
========================================================= */

function drawEnergy(
    item
){

    if(
        item.rocket !==
        selectedRocket
    ){
        return;
    }


    const lane =
        getLane();


    const x =
        lane.center +
        item.x *
        (
            lane.width *
            .43
        );


    const y =
        lane.top +
        item.y *
        (
            lane.bottom -
            lane.top
        );


    const pulse =
        10 +
        Math.sin(
            performance.now() *
            .008
        ) *
        2;


    ctx.save();


    ctx.shadowBlur =
        22;


    ctx.shadowColor =
        "#ffd84a";


    ctx.strokeStyle =
        "#ffd84a";


    ctx.lineWidth =
        2;


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        pulse,
        0,
        Math.PI * 2
    );


    ctx.stroke();


    ctx.fillStyle =
        "rgba(255,216,74,.18)";


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        pulse *
        1.6,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.fillStyle =
        "#fff6b8";


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        3,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.restore();

}


/* =========================================================
   玩家火箭
========================================================= */

function drawPlayerRocket(){

    const me =
        players.get(
            user.id
        );


    if(
        !me ||
        me.status !==
        "flying"
    ){
        return;
    }


    const lane =
        getLane();


    const x =
        lane.center +
        me.x *
        (
            lane.width *
            .43
        );


    const y =
        height *
        .80;


    const color =
        selectedRocket === "A"
            ? "#23e8ff"
            : "#ff38d1";


    const glow =
        selectedRocket === "A"
            ? "#008cff"
            : "#7c24ff";


    ctx.save();


    /*
       超長火焰
    */

    const flame =
        ctx.createLinearGradient(
            x,
            y + 15,
            x,
            y + 105
        );


    flame.addColorStop(
        0,
        "#ffffff"
    );


    flame.addColorStop(
        .18,
        "#ffd84a"
    );


    flame.addColorStop(
        .5,
        "#ff742c"
    );


    flame.addColorStop(
        1,
        "rgba(255,30,20,0)"
    );


    ctx.fillStyle =
        flame;


    ctx.beginPath();


    ctx.moveTo(
        x - 12,
        y + 14
    );


    ctx.lineTo(
        x + 12,
        y + 14
    );


    ctx.lineTo(
        x,
        y +
        88 +
        Math.random() *
        22
    );


    ctx.closePath();


    ctx.fill();


    /*
       光暈
    */

    ctx.shadowBlur =
        30;


    ctx.shadowColor =
        glow;


    /*
       火箭
    */

    ctx.fillStyle =
        "#f1f8ff";


    ctx.beginPath();


    ctx.moveTo(
        x,
        y - 48
    );


    ctx.quadraticCurveTo(
        x + 25,
        y - 8,
        x + 22,
        y + 24
    );


    ctx.lineTo(
        x - 22,
        y + 24
    );


    ctx.quadraticCurveTo(
        x - 25,
        y - 8,
        x,
        y - 48
    );


    ctx.closePath();


    ctx.fill();


    /*
       外框
    */

    ctx.strokeStyle =
        color;


    ctx.lineWidth =
        3;


    ctx.stroke();


    /*
       窗口
    */

    ctx.shadowBlur =
        0;


    ctx.fillStyle =
        color;


    ctx.beginPath();


    ctx.arc(
        x,
        y - 11,
        9,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.strokeStyle =
        "#ffffff";


    ctx.lineWidth =
        2;


    ctx.stroke();


    /*
       機翼
    */

    ctx.fillStyle =
        "#aab5c7";


    ctx.beginPath();


    ctx.moveTo(
        x - 19,
        y + 8
    );


    ctx.lineTo(
        x - 44,
        y + 36
    );


    ctx.lineTo(
        x - 16,
        y + 27
    );


    ctx.closePath();


    ctx.fill();


    ctx.beginPath();


    ctx.moveTo(
        x + 19,
        y + 8
    );


    ctx.lineTo(
        x + 44,
        y + 36
    );


    ctx.lineTo(
        x + 16,
        y + 27
    );


    ctx.closePath();


    ctx.fill();


    /*
       YOU
    */

    ctx.fillStyle =
        "#ffffff";


    ctx.font =
        "900 10px Arial";


    ctx.textAlign =
        "center";


    ctx.fillText(
        "YOU",
        x,
        y + 51
    );


    ctx.restore();

}


/* =========================================================
   DRAW
========================================================= */

let shakeX =
    0;

let shakeY =
    0;


function screenShake(
    amount
){

    shakeX =
        (
            Math.random() -
            .5
        ) *
        amount;


    shakeY =
        (
            Math.random() -
            .5
        ) *
        amount;

}


function drawGame(
    time
){

    drawBackground();


    if(
        !body.classList.contains(
            "playing"
        )
    ){

        return;

    }


    drawLane(
        time
    );


    /*
       只繪製玩家選中的航道物件
    */

    worldItems.forEach(
        item => {

            if(
                item.type ===
                "meteor"
            ){

                drawMeteor(
                    item,
                    time
                );

            }else{

                drawEnergy(
                    item
                );

            }

        }
    );


    drawPlayerRocket();


    /*
       平滑震動
    */

    if(
        Math.abs(shakeX) >
        .1 ||
        Math.abs(shakeY) >
        .1
    ){

        canvas.style.transform =
            `translate(${shakeX}px,${shakeY}px)`;

        shakeX *=
            .84;

        shakeY *=
            .84;

    }else{

        canvas.style.transform =
            "";

        shakeX =
            0;

        shakeY =
            0;

    }

}


/* =========================================================
   HUD
========================================================= */

let lastTickTone =
    0;

let lastMeteorWarning =
    0;


function updateHUD(){

    updateRoomCount();


    if(
        !body.classList.contains(
            "playing"
        )
    ){
        return;
    }


    if(
        state ===
        "COUNTDOWN"
    ){

        const remaining =
            Math.max(
                0,
                roundStartAt -
                Date.now()
            );


        const seconds =
            Math.ceil(
                remaining /
                1000
            );


        multiplierEl.className =
            selectedRocket;


        multiplierEl.textContent =
            seconds > 0
                ? String(seconds)
                : "GO!";


        statusEl.textContent =
            "雙火箭即將升空";


        return;

    }


    if(
        state !==
        "FLYING"
    ){
        return;
    }


    const me =
        players.get(
            user.id
        );


    if(
        !me
    ){
        return;
    }


    const multiplier =
        getMyMultiplier();


    multiplierEl.textContent =
        `${multiplier.toFixed(2)}x`;


    if(
        me.status ===
        "cashed"
    ){

        multiplierEl.className =
            "win";

        statusEl.textContent =
            "✅ 你已成功逃脫";

        aliveText.textContent =
            "✅ 已逃脫";

        return;

    }


    if(
        me.status ===
        "crashed"
    ){

        multiplierEl.className =
            "crash";

        statusEl.textContent =
            "💥 火箭爆炸";

        aliveText.textContent =
            "💥 出局";

        return;

    }


    if(
        multiplier >=
        5
    ){

        multiplierEl.className =
            "danger";

        statusEl.textContent =
            "🔥 高風險區";

    }else if(
        multiplier >=
        2
    ){

        multiplierEl.className =
            "warning";

        statusEl.textContent =
            "⚠️ 倍率快速上升";

    }else{

        multiplierEl.className =
            selectedRocket;

        statusEl.textContent =
            "🚀 飛行中";

    }


    const activePlayers =
        getRoundPlayerCount();


    aliveText.textContent =
        `🚀 本局 ${activePlayers} 人`;


    /*
       倍率音效
    */

    if(
        Date.now() -
        lastTickTone >
        430
    ){

        lastTickTone =
            Date.now();

        soundTick();

    }

}


/* =========================================================
   隕石警告
========================================================= */

function updateMeteorWarning(){

    if(
        state !==
        "FLYING"
    ){

        meteorWarning.classList.remove(
            "show"
        );

        return;

    }


    const dangerous =
        worldItems.some(
            item =>

                item.type ===
                "meteor" &&

                item.rocket ===
                selectedRocket &&

                item.y >
                .34 &&

                item.y <
                .82
        );


    if(
        dangerous
    ){

        meteorWarning.classList.add(
            "show"
        );


        if(
            Date.now() -
            lastMeteorWarning >
            1100
        ){

            lastMeteorWarning =
                Date.now();

            soundWarning();

        }

    }else{

        meteorWarning.classList.remove(
            "show"
        );

    }

}


/* =========================================================
   LOOP
========================================================= */

function loop(
    time
){

    drawGame(
        time
    );

    updateHUD();

    updateMeteorWarning();

    requestAnimationFrame(
        loop
    );

}


/* =========================================================
   EVENT ROUTER
========================================================= */

function handleEvent(
    sender,
    eventName,
    payload
){

    switch(
        eventName
    ){

        case "PLAYER_HELLO":

            handleHello(
                sender,
                payload
            );

            break;


        case "PLAYER_READY":

            handlePlayerReady(
                sender,
                payload
            );

            break;


        case "LOBBY_STATE":

            handleLobbyState(
                sender,
                payload
            );

            break;


        case "ROUND_START":

            handleRoundStart(
                sender,
                payload
            );

            break;


        case "PLAYER_INPUT":

            handlePlayerInput(
                sender,
                payload
            );

            break;


        case "WORLD_STATE":

            handleWorldState(
                sender,
                payload
            );

            break;


        case "PLAYER_CASHOUT":

            handlePlayerCashout(
                sender,
                payload
            );

            break;


        case "CASHOUT_CONFIRMED":

            handleCashoutConfirmed(
                sender,
                payload
            );

            break;


        case "ROCKET_CRASHED":

            handleRocketCrashed(
                sender,
                payload
            );

            break;


        case "ROUND_RESULT":

            handleRoundResult(
                sender,
                payload
            );

            break;

    }

}

/* =========================================================

========================================================= */

function rocketName(
    rocket
){

    return rocket === "B"
        ? "🩷 狂暴號"
        : "🔵 穩定號";

}


function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


/* =========================================================
   補上 HOST_ANNOUNCE 處理
========================================================= */

const eventListenerPatch =
    function(
        sender,
        eventName,
        payload
    ){

        if(
            eventName ===
            "HOST_ANNOUNCE"
        ){

            if(
                payload &&
                payload.hostId
            ){

                hostId =
                    String(
                        payload.hostId
                    );

                lastHostSeen =
                    Date.now();

            }

            return;

        }

    };


/*
   直接重新掛一個 message listener
   只處理 HOST_ANNOUNCE，
   其餘由上面的 router 處理。
*/

window.addEventListener(
    "message",
    event => {

        let data = null;

        try{

            data =
                typeof event.data ===
                "string"
                    ? JSON.parse(
                        event.data
                    )
                    : event.data;

        }catch(e){

            return;

        }


        if(
            !data ||
            data.action !==
            "gameEventReceived"
        ){
            return;
        }


        if(
            data.eventName !==
            "HOST_ANNOUNCE"
        ){
            return;
        }


        const sender =
            String(
                data.userId ||
                ""
            );


        if(
            sender ===
            user.id
        ){
            return;
        }


        eventListenerPatch(
            sender,
            data.eventName,
            data.payload || {}
        );

    }
);
