<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover
    "
>

<meta name="theme-color" content="#02040a">

<title>霓虹逃脫：雙軌火箭</title>

<style>

/* =========================================================
   ROOT
========================================================= */

:root{
    --bg:#02040a;

    --cyan:#22e5ff;
    --cyan-deep:#087cff;

    --pink:#ff38d1;
    --violet:#7f32ff;

    --gold:#ffd85a;
    --green:#28ffb2;

    --danger:#ff4057;
    --orange:#ff8b35;

    --white:#f7faff;
    --muted:#7d879f;

    --glass:
        rgba(5,9,22,.72);

    --glass-strong:
        rgba(4,8,19,.86);
}


/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;

    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;

    margin:0;

    overflow:hidden;

    background:
        #02040a;

    color:#fff;

    font-family:
        Arial,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

    user-select:none;

    touch-action:none;
}

body{
    position:fixed;

    inset:0;
}

button{
    font:inherit;

    border:0;

    outline:none;

    cursor:pointer;

    -webkit-appearance:none;

    appearance:none;
}


/* =========================================================
   CANVAS
========================================================= */

#gameCanvas{
    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    z-index:1;

    display:block;

    touch-action:none;
}


/* =========================================================
   LOBBY
========================================================= */

#lobby{
    position:fixed;

    inset:0;

    z-index:50;

    display:flex;

    flex-direction:column;

    align-items:center;

    padding:
        max(10px,env(safe-area-inset-top))
        12px
        calc(
            84px +
            env(safe-area-inset-bottom)
        );

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 12%,
            rgba(41,60,145,.36),
            rgba(3,6,16,.95) 66%
        );

    transition:
        opacity .18s,
        visibility .18s;
}

body.playing #lobby{
    opacity:0;

    visibility:hidden;

    pointer-events:none;
}


/* =========================================================
   LOBBY HEADER
========================================================= */

.lobby-header{
    width:100%;

    max-width:650px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:9px;
}

.logo{
    font-size:17px;

    font-weight:1000;

    letter-spacing:.2px;
}

.logo small{
    display:block;

    margin-top:3px;

    color:
        #68738d;

    font-size:8px;

    font-weight:700;
}

.roomCount{
    padding:
        7px
        10px;

    border-radius:12px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.09);

    color:
        #aeb7cc;

    font-size:9px;

    font-weight:800;

    backdrop-filter:
        blur(10px);
}


/* =========================================================
   ROCKET SELECT
========================================================= */

#rocketChoices{
    width:100%;

    max-width:650px;

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:8px;

    flex-shrink:0;
}

.rocket-card{
    --accent:#fff;
    --accent2:#fff;

    position:relative;

    min-height:194px;

    overflow:hidden;

    padding:13px;

    border-radius:21px;

    border:
        1px solid
        rgba(255,255,255,.09);

    background:
        linear-gradient(
            155deg,
            rgba(15,22,49,.97),
            rgba(5,8,21,.96)
        );

    color:#fff;

    text-align:left;

    transition:
        transform .14s,
        border-color .14s,
        box-shadow .14s;
}

.rocket-card.a{
    --accent:
        var(--cyan);

    --accent2:
        var(--cyan-deep);
}

.rocket-card.b{
    --accent:
        var(--pink);

    --accent2:
        var(--violet);
}

.rocket-card.selected{
    border-color:
        color-mix(
            in srgb,
            var(--accent)
            72%,
            transparent
        );

    box-shadow:
        0 0 35px
        color-mix(
            in srgb,
            var(--accent)
            12%,
            transparent
        ),
        inset 0 0 32px
        color-mix(
            in srgb,
            var(--accent)
            5%,
            transparent
        );

    transform:
        translateY(-2px);
}

.rocket-card:active{
    transform:
        scale(.99);
}

.rocket-badge{
    position:absolute;

    top:9px;
    right:9px;

    padding:
        4px
        8px;

    border-radius:999px;

    background:
        rgba(255,255,255,.05);

    color:
        #77819a;

    font-size:8px;

    font-weight:1000;
}

.rocket-card.selected
.rocket-badge{
    color:
        var(--accent);

    background:
        color-mix(
            in srgb,
            var(--accent)
            12%,
            transparent
        );
}

.rocket-title{
    position:relative;

    z-index:4;

    font-size:16px;

    font-weight:1000;
}

.rocket-sub{
    position:relative;

    z-index:4;

    margin-top:3px;

    color:
        #7f8aa5;

    font-size:8px;

    font-weight:700;
}

.rocket-stats{
    position:relative;

    z-index:4;

    margin-top:10px;

    width:
        65%;

    display:grid;

    gap:5px;
}

.rocket-stat{
    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:
        6px
        7px;

    border-radius:8px;

    background:
        rgba(255,255,255,.035);

    color:
        #808aa3;

    font-size:8px;
}

.rocket-stat strong{
    color:
        #e9edf7;
}

.rocket-card.a::after{
    content:"";

    position:absolute;

    width:170px;
    height:170px;

    right:-40px;
    bottom:-65px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(34,229,255,.18),
            transparent 67%
        );

    filter:
        blur(5px);
}

.rocket-card.b::after{
    content:"";

    position:absolute;

    width:185px;
    height:185px;

    right:-50px;
    bottom:-70px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,56,209,.18),
            transparent 67%
        );

    filter:
        blur(5px);
}


/* =========================================================
   MINI ROCKET
========================================================= */

.mini-rocket{
    position:absolute;

    right:19px;

    bottom:-3px;

    width:78px;

    height:120px;

    transform:
        rotate(-8deg);

    transform-origin:
        center bottom;
}

.mini-body{
    position:absolute;

    left:50%;

    top:5px;

    transform:
        translateX(-50%);

    width:38px;

    height:72px;

    border-radius:
        55%
        55%
        28%
        28%;

    background:
        linear-gradient(
            95deg,
            #8592a7,
            #ffffff 45%,
            #d7dfeb
        );

    box-shadow:
        0 0 25px
        var(--accent);
}

.mini-window{
    position:absolute;

    left:50%;

    top:25px;

    transform:
        translateX(-50%);

    width:12px;

    height:12px;

    border-radius:50%;

    border:
        2px solid
        white;

    background:
        var(--accent);
}

.mini-fin-left,
.mini-fin-right{
    position:absolute;

    top:46px;

    width:29px;

    height:28px;

    background:
        #909bad;
}

.mini-fin-left{
    left:0;

    clip-path:
        polygon(
            100% 0,
            100% 100%,
            0 100%
        );
}

.mini-fin-right{
    right:0;

    clip-path:
        polygon(
            0 0,
            100% 100%,
            0 100%
        );
}

.mini-flame{
    position:absolute;

    left:50%;

    bottom:-2px;

    transform:
        translateX(-50%);

    width:24px;

    height:42px;

    background:
        linear-gradient(
            to bottom,
            #fff,
            #ffd84e 25%,
            #ff702c 62%,
            transparent
        );

    clip-path:
        polygon(
            50% 100%,
            0 0,
            100% 0
        );

    animation:
        flameMove
        .11s
        infinite
        alternate;
}

.rocket-card.b .mini-rocket{
    transform:
        rotate(8deg)
        scale(1.05);
}

.rocket-card.b .mini-body{
    background:
        linear-gradient(
            90deg,
            #272d42,
            #f5e9ff 46%,
            #cfc0df
        );
}

.rocket-card.b .mini-fin-left,
.rocket-card.b .mini-fin-right{
    background:
        #464b64;
}

.rocket-card.b .mini-flame{
    width:28px;

    height:48px;

    filter:
        drop-shadow(
            0 0 9px
            rgba(255,55,209,.65)
        );
}

@keyframes flameMove{
    from{
        height:30px;
    }

    to{
        height:45px;
    }
}


/* =========================================================
   CONTROL
========================================================= */

#controlArea{
    width:100%;

    max-width:650px;

    flex-shrink:0;

    margin-top:8px;
}

.control-title{
    margin-bottom:5px;

    color:
        #727d98;

    font-size:8px;

    font-weight:800;
}

#controlChoices{
    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:6px;
}

.control-button{
    height:40px;

    border-radius:11px;

    border:
        1px solid
        rgba(255,255,255,.09);

    background:
        rgba(255,255,255,.035);

    color:
        #aeb8ce;

    font-size:10px;

    font-weight:1000;
}

.control-button.selected{
    color:#fff;

    border-color:
        rgba(35,229,255,.6);

    background:
        linear-gradient(
            135deg,
            rgba(35,229,255,.15),
            rgba(0,130,255,.045)
        );

    box-shadow:
        0 0 18px
        rgba(35,229,255,.1);
}

#controlStatus{
    min-height:11px;

    margin-top:4px;

    text-align:center;

    color:
        #606b83;

    font-size:8px;
}


/* =========================================================
   BET
========================================================= */

#betArea{
    width:100%;

    max-width:650px;

    flex-shrink:0;

    margin-top:8px;
}

.bet-title{
    margin-bottom:5px;

    color:
        #727d98;

    font-size:8px;

    font-weight:800;
}

#betButtons{
    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:5px;
}

.bet-button{
    height:34px;

    border-radius:9px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.035);

    color:
        #aeb8ce;

    font-size:9px;

    font-weight:1000;
}

.bet-button.active{
    color:#fff;

    border-color:
        rgba(171,90,255,.75);

    background:
        linear-gradient(
            135deg,
            #642be2,
            #9b25d5
        );
}


/* =========================================================
   LOBBY BOTTOM
========================================================= */

#lobbyTip{
    width:100%;

    max-width:650px;

    margin-top:6px;

    color:
        #59647c;

    text-align:center;

    font-size:8px;
}

#joinButton{
    position:absolute;

    left:12px;
    right:12px;

    bottom:
        max(9px,env(safe-area-inset-bottom));

    width:
        calc(100% - 24px);

    max-width:650px;

    height:60px;

    border-radius:31px;

    color:#fff;

    font-size:18px;

    font-weight:1000;

    background:
        linear-gradient(
            90deg,
            #6428ed,
            #a227d5
        );

    box-shadow:
        0 14px 36px
        rgba(0,0,0,.5),
        inset 0 1px
        rgba(255,255,255,.22);
}

#joinButton:disabled{
    opacity:.45;
}


/* =========================================================
   TOP GAME HUD
========================================================= */

#playUI{
    position:fixed;

    inset:0;

    z-index:20;

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}

body.playing #playUI{
    opacity:1;

    visibility:visible;
}


/* =========================================================
   TOP SAFE AREA
========================================================= */

#topHud{
    position:absolute;

    top:
        max(7px,env(safe-area-inset-top));

    left:8px;

    right:8px;

    z-index:30;

    height:112px;

    pointer-events:none;
}

#topHud::after{
    content:"";

    position:absolute;

    left:-8px;
    right:-8px;

    top:-8px;

    height:142px;

    z-index:-1;

    background:
        linear-gradient(
            to bottom,
            rgba(1,4,12,.82),
            rgba(1,4,12,.48) 46%,
            transparent
        );

    backdrop-filter:
        blur(6px);

    mask-image:
        linear-gradient(
            to bottom,
            black 0%,
            black 55%,
            transparent 100%
        );
}


/* =========================================================
   TOP LEFT
========================================================= */

#topLeft{
    position:absolute;

    left:0;

    top:0;

    display:flex;

    flex-direction:column;

    align-items:flex-start;

    gap:5px;
}

#healthPanel{
    display:flex;

    align-items:center;

    gap:7px;

    padding:
        7px
        9px;

    border-radius:12px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        var(--glass);

    backdrop-filter:
        blur(12px);

    box-shadow:
        0 10px 25px
        rgba(0,0,0,.22);
}

.health-label{
    color:
        #7a859e;

    font-size:7px;

    font-weight:1000;

    letter-spacing:.6px;
}

#healthBar{
    display:flex;

    gap:4px;
}

.heart{
    width:18px;

    height:14px;

    background:
        linear-gradient(
            135deg,
            #ff6079,
            #d8193d
        );

    clip-path:
        polygon(
            50% 100%,
            8% 54%,
            8% 27%,
            21% 7%,
            39% 6%,
            50% 20%,
            61% 6%,
            79% 7%,
            92% 27%,
            92% 54%
        );

    filter:
        drop-shadow(
            0 0 7px
            rgba(255,45,75,.4)
        );

    transition:.16s;
}

.heart.empty{
    background:
        rgba(255,255,255,.09);

    filter:none;

    opacity:.55;
}

.heart.damage{
    animation:
        heartDamage
        .3s
        1;
}

@keyframes heartDamage{
    0%{
        transform:scale(1);
    }

    40%{
        transform:scale(1.34);
    }

    100%{
        transform:scale(1);
    }
}

#rocketBadge{
    padding:
        5px
        8px;

    border-radius:9px;

    background:
        var(--glass);

    border:
        1px solid
        rgba(255,255,255,.08);

    font-size:7px;

    font-weight:1000;

    backdrop-filter:
        blur(10px);
}

#rocketBadge.a{
    color:
        var(--cyan);

    border-color:
        rgba(34,229,255,.28);
}

#rocketBadge.b{
    color:
        var(--pink);

    border-color:
        rgba(255,56,209,.28);
}


/* =========================================================
   CENTER TOP
========================================================= */

#scoreZone{
    position:absolute;

    left:50%;

    top:-1px;

    transform:
        translateX(-50%);

    width:
        min(260px,58vw);

    text-align:center;
}

#multiplier{
    font-family:
        Impact,
        "Arial Black",
        sans-serif;

    font-size:
        clamp(44px,13vw,75px);

    line-height:.88;

    letter-spacing:.8px;

    transition:
        color .08s,
        transform .08s,
        text-shadow .08s;
}

#multiplier.a{
    color:
        var(--cyan);

    text-shadow:
        0 0 18px
        rgba(34,229,255,.54),
        0 0 52px
        rgba(0,124,255,.28);
}

#multiplier.b{
    color:
        var(--pink);

    text-shadow:
        0 0 18px
        rgba(255,56,209,.5),
        0 0 52px
        rgba(127,50,255,.28);
}

#multiplier.warning{
    color:
        var(--gold);

    text-shadow:
        0 0 20px
        rgba(255,216,90,.5);
}

#multiplier.danger{
    color:
        var(--danger);

    text-shadow:
        0 0 24px
        rgba(255,64,87,.62);
}

#multiplier.win{
    color:
        var(--green);

    transform:
        scale(1.08);

    text-shadow:
        0 0 26px
        rgba(40,255,178,.66);
}

#multiplier.crash{
    color:
        #ff394f;

    transform:
        scale(1.1);

    text-shadow:
        0 0 30px
        rgba(255,30,50,.8);
}

#flightStatus{
    margin-top:5px;

    color:
        #b3bdd1;

    font-size:8px;

    font-weight:900;
}

#scoreText{
    margin-top:4px;

    color:
        #7c879f;

    font-size:7px;

    font-weight:900;
}

#scoreText strong{
    color:
        #e4e9f6;

    font-size:9px;
}


/* =========================================================
   TOP RIGHT
========================================================= */

#topRight{
    position:absolute;

    right:0;

    top:0;

    display:flex;

    flex-direction:column;

    align-items:flex-end;

    gap:4px;

    max-width:
        48vw;
}

#roomPill{
    padding:
        7px
        9px;

    border-radius:11px;

    background:
        var(--glass);

    border:
        1px solid
        rgba(255,255,255,.08);

    color:
        #bdc5d8;

    font-size:8px;

    font-weight:900;

    backdrop-filter:
        blur(11px);
}

#opponentStrip{
    display:flex;

    justify-content:flex-end;

    gap:4px;

    max-width:
        48vw;

    overflow:hidden;
}

.opponent{
    min-width:66px;

    max-width:88px;

    padding:
        5px
        6px;

    border-radius:9px;

    background:
        rgba(3,7,17,.68);

    border:
        1px solid
        rgba(255,255,255,.07);

    backdrop-filter:
        blur(9px);

    font-size:6px;
}

.opponent.cashed{
    border-color:
        rgba(40,255,178,.35);
}

.opponent.crashed{
    border-color:
        rgba(255,64,87,.28);

    opacity:.68;
}

.opp-name{
    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    color:
        #cbd2e4;

    font-weight:1000;
}

.opp-info{
    display:flex;

    justify-content:space-between;

    gap:5px;

    margin-top:2px;

    color:
        #707c95;
}

.opp-score{
    color:
        #e4e9f5;

    font-weight:1000;
}

.opp-health{
    color:
        #ff657e;
}


/* =========================================================
   HIT FLASH
========================================================= */

#hitFlash{
    position:absolute;

    inset:0;

    z-index:35;

    pointer-events:none;

    opacity:0;

    background:
        rgba(255,30,56,.17);
}

#hitFlash.active{
    animation:
        hitFlash
        .3s
        1;
}

@keyframes hitFlash{
    0%{
        opacity:0;
    }

    17%{
        opacity:1;
    }

    100%{
        opacity:0;
    }
}


/* =========================================================
   MANUAL CONTROL
========================================================= */

#manualControls{
    position:absolute;

    left:10px;

    right:10px;

    bottom:
        calc(
            90px +
            env(safe-area-inset-bottom)
        );

    z-index:29;

    display:flex;

    justify-content:space-between;

    align-items:center;

    pointer-events:none;

    opacity:1;

    transition:
        opacity .12s;
}

#manualControls.hidden{
    opacity:0;

    pointer-events:none;
}

.moveButton{
    pointer-events:auto;

    width:68px;

    height:68px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.14);

    background:
        rgba(4,8,18,.72);

    backdrop-filter:
        blur(11px);

    color:#fff;

    font-size:29px;

    font-weight:1000;

    display:flex;

    justify-content:center;

    align-items:center;

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.42);

    transition:
        transform .08s,
        background .08s;
}

.moveButton:active{
    transform:
        scale(.88);
}

#moveLeft{
    color:
        var(--cyan);

    border-color:
        rgba(34,229,255,.45);
}

#moveRight{
    color:
        var(--pink);

    border-color:
        rgba(255,56,209,.45);
}


/* =========================================================
   BOTTOM
========================================================= */

#playBottom{
    position:absolute;

    left:10px;

    right:10px;

    bottom:
        max(8px,env(safe-area-inset-bottom));

    z-index:29;

    pointer-events:none;
}

#aliveText{
    width:max-content;

    margin:
        0 auto
        6px;

    padding:
        5px
        10px;

    border-radius:999px;

    background:
        rgba(2,6,15,.68);

    border:
        1px solid
        rgba(255,255,255,.07);

    color:
        #929cb3;

    font-size:7px;

    font-weight:900;

    backdrop-filter:
        blur(10px);
}

#ejectButton{
    width:100%;

    height:60px;

    border-radius:31px;

}


const SDK_READY =

/* =========================================================
   DOM
========================================================= */

    );

const ctx =

            alpha:false

    );

    );

    );

const resultOverlay =

        "resultOverlay"
    );

const resultTitle =
    document.getElementById(
        "resultTitle"
    );

const resultMain =
    document.getElementById(
        "resultMain"
    );

    document.getElementById(
        "resultSub"
    );

    document.getElementById(
        "leaderboard"
    );

const nextRound =
    document.getElementById(
        "nextRound"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =========================================================
   DISPLAY
========================================================= */

let width = 0;
let height = 0;
let dpr = 1;

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.floor(
            width * dpr
        );

    canvas.height =
        Math.floor(
            height * dpr
        );

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    createStars();

}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   ROCKET PROFILE
========================================================= */

const ROCKETS = {

    A:{

        id:
            "A",

        name:
            "穩定號",

        color:
            "#22e5ff",

        glow:
            "#087cff",

        /*
           移動更快，
           但最好控制。
        */

        maxSpeed:
            1.28,

        response:
            10.5,

        brake:
            11.5,

        /*
           小碰撞區
        */

        hitRadius:
            .158,

        /*
           倍率成長
        */

        growth:
            1.047,

        maxCrash:
            18

    },


    B:{

        id:
            "B",

        name:
            "狂暴號",

        color:
            "#ff38d1",

        glow:
            "#7f32ff",

        /*
           更快。
        */

        maxSpeed:
            1.62,

        response:
            13.5,

        /*
           慣性更強，
           收手後比較不容易立刻停。
        */

        brake:
            6.0,

        /*
           碰撞區稍大。
        */

        hitRadius:
            .185,

        /*
           倍率快很多。
        */

        growth:
            1.065,

        maxCrash:
            26

    }

};


const MAX_HEALTH =
    3;

const MAX_PAYOUT =
    20;

const START_DELAY =
    1600;

const HIT_INVULN =
    0.85;

const ROUND_MAX_MS =
    42000;


/* =========================================================
   STATE
========================================================= */

let selectedRocket =
    "A";

let selectedBet =
    50;

let controlMode =
    "tilt";

let state =
    "LOBBY";

let localReady =
    false;

let roundRewardSent =
    false;

let currentRoundId =
    null;

let roundStartAt =
    0;

let crashPointA =
    0;

let crashPointB =
    0;

let crashedA =
    false;

let crashedB =
    false;

let hostId =
    null;

let lastHostSeen =
    Date.now();

let lastRoundStart =
    0;


/* =========================================================
   PLAYER
========================================================= */

const joinTime =
    Date.now();


const players =
    new Map();


players.set(
    user.id,
    createPlayer(
        user.id,
        user.username,
        user.avatar,
        joinTime
    )
);


const hostCandidates =
    new Map();


hostCandidates.set(
    user.id,
    {
        id:
            user.id,

        joinedAt:
            joinTime
    }
);


function createPlayer(
    id,
    username,
    avatar,
    joinedAt
){

    return {

        id:
            String(id),

        username:
            String(
                username ||
                "玩家"
            ),

        avatar:
            String(
                avatar ||
                ""
            ),

        joinedAt:
            Number(
                joinedAt ||
                Date.now()
            ),

        bet:
            0,

        rocket:
            "A",

        ready:
            false,

        status:
            "waiting",

        x:
            0,

        velocity:
            0,

        health:
            MAX_HEALTH,

        bonus:
            0,

        invulnerableUntil:
            0,

        reward:
            0,

        cashoutAt:
            0,

        cashoutTime:
            0,

        roundId:
            null,

        lastInputSeq:
            0,

        lastSeen:
            Date.now()

    };

}


/* =========================================================
   HOST
========================================================= */

function isHost(){

    return (
        hostId ===
        user.id
    );

}


function electHost(){

    const list =
        Array.from(
            hostCandidates.values()
        )
        .sort(
            (a,b) => {

                if(
                    a.joinedAt !==
                    b.joinedAt
                ){

                    return (
                        a.joinedAt -
                        b.joinedAt
                    );

                }

                return (
                    a.id.localeCompare(
                        b.id
                    )
                );

            }
        );

    if(
        list.length
    ){

        hostId =
            list[0].id;

    }

}


/* =========================================================
   EVENT SEND
========================================================= */

function sendEvent(
    eventName,
    payload={}
){

    if(
        !SDK_READY
    ){

        return;

    }

    try{

        SDK.sendGameEvent(
            eventName,
            payload
        );

    }catch(e){}

}


/* =========================================================
   EVENT RECEIVE
========================================================= */

window.addEventListener(
    "message",
    event => {

        let data;

        try{

            data =
                typeof event.data ===
                "string"

                    ? JSON.parse(
                        event.data
                    )

                    : event.data;

        }catch(e){

            return;

        }

        if(
            !data ||
            data.action !==
            "gameEventReceived"
        ){

            return;

        }

        const senderId =
            String(
                data.userId ||
                ""
            );

        if(
            !senderId ||
            senderId ===
            user.id
        ){

            return;

        }

        handleEvent(
            senderId,
            data.eventName,
            data.payload || {}
        );

    }
);


/* =========================================================
   EVENT ROUTER
========================================================= */

function handleEvent(
    senderId,
    eventName,
    payload
){

    switch(
        eventName
    ){

        case "PLAYER_HELLO":
            onPlayerHello(
                senderId,
                payload
            );
            break;

        case "HOST_ANNOUNCE":
            onHostAnnounce(
                senderId,
                payload
            );
            break;

        case "PLAYER_READY":
            onPlayerReady(
                senderId,
                payload
            );
            break;

        case "LOBBY_STATE":
            onLobbyState(
                senderId,
                payload
            );
            break;

        case "ROUND_START":
            onRoundStart(
                senderId,
                payload
            );
            break;

        case "PLAYER_INPUT":
            onPlayerInput(
                senderId,
                payload
            );
            break;

        case "WORLD_STATE":
            onWorldState(
                senderId,
                payload
            );
            break;

        case "PLAYER_DAMAGED":
            onPlayerDamaged(
                senderId,
                payload
            );
            break;

        case "PLAYER_CRASHED":
            onPlayerCrashed(
                senderId,
                payload
            );
            break;

        case "PLAYER_CASHOUT":
            onPlayerCashout(
                senderId,
                payload
            );
            break;

        case "CASHOUT_CONFIRMED":
            onCashoutConfirmed(
                senderId,
                payload
            );
            break;

        case "ROCKET_CRASHED":
            onRocketCrashed(
                senderId,
                payload
            );
            break;

        case "ROUND_RESULT":
            onRoundResult(
                senderId,
                payload
            );
            break;

    }

}


/* =========================================================
   HELLO
========================================================= */

function broadcastHello(){

    sendEvent(
        "PLAYER_HELLO",
        {

            gameId:
                GAME_META.id,

            user:{
                id:
                    user.id,

                username:
                    user.username,

                avatar:
                    user.avatar
            },

            joinedAt:
                joinTime

        }
    );

}


function onPlayerHello(
    senderId,
    payload
){

    const incoming =
        payload.user || {};

    const id =
        String(
            incoming.id ||
            senderId
        );

    if(
        id ===
        user.id
    ){

        return;

    }

    const joinedAt =
        Number(
            payload.joinedAt ||
            Date.now()
        );

    hostCandidates.set(
        id,
        {
            id:id,
            joinedAt:joinedAt
        }
    );

    let player =
        players.get(
            id
        );

    if(
        !player
    ){

        player =
            createPlayer(
                id,
                incoming.username ||
                    "玩家",
                incoming.avatar ||
                    "",
                joinedAt
            );

        players.set(
            id,
            player
        );

    }
    else{

        player.username =
            String(
                incoming.username ||
                player.username
            );

        player.avatar =
            String(
                incoming.avatar ||
                player.avatar
            );

/* =========================================================
   ROUND START
========================================================= */

function generateCrashPoint(
    rocket
){

    const profile =
        ROCKETS[
            rocket
        ];

    const random =
        Math.random();

    const minimum =
        rocket === "A"
            ? 1.20
            : 1.14;

    const curve =
        rocket === "A"
            ? 1.72
            : 2.25;

    return Number(
        clamp(
            minimum +
            Math.pow(
                random,
                curve
            ) *
            (
                profile.maxCrash -
                minimum
            ),
            minimum,
            profile.maxCrash
        )
        .toFixed(2)
    );

}


function maybeStartRound(){

    if(
        !isHost() ||
        state !==
        "LOBBY"
    ){

        return;

    }

    const ready =
        Array.from(
            players.values()
        )
        .filter(
            player =>
                player.ready &&
                player.bet > 0
        );

    if(
        !ready.length
    ){

        return;

    }

    if(
        Date.now() -
        lastRoundStart <
        1800
    ){

        return;

    }

    lastRoundStart =
        Date.now();

    const roundId =
        "round_" +
        Date.now()
        .toString(36) +
        "_" +
        Math.random()
        .toString(36)
        .slice(2,7);

    const startAt =
        Date.now() +
        START_DELAY;

    currentRoundId =
        roundId;

    roundStartAt =
        startAt;

    crashPointA =
        generateCrashPoint(
            "A"
        );

    crashPointB =
        generateCrashPoint(
            "B"
        );

    crashedA =
        false;

    crashedB =
        false;

    const packet = {

        gameId:
            GAME_META.id,

        roundId:
            roundId,

        hostId:
            user.id,

        startAt:
            startAt,

        crashPointA:
            crashPointA,

        crashPointB:
            crashPointB,

        players:
            ready.map(
                player => ({

                    id:
                        player.id,

                    username:
                        player.username,

                    avatar:
                        player.avatar,

                    bet:
                        player.bet,

                    rocket:
                        player.rocket

                })
            )

    };

    sendEvent(
        "ROUND_START",
        packet
    );

    applyRoundStart(
        packet
    );

}

/* =========================================================
   MULTIPLIER
========================================================= */

function getBaseMultiplier(
    rocket,
    now = Date.now()
){

    if(
        !roundStartAt
    ){

        return 1;

    }

    const elapsed =
        Math.max(
            0,
            now -
            roundStartAt
        ) /
        1000;

    return Math.pow(
        ROCKETS[
            rocket
        ].growth,
        elapsed
    );

}


function getPlayerMultiplier(
    player
){

    if(
        !player
    ){

        return 1;

    }

    if(
        player.status ===
        "cashed"
    ){

        return player.cashoutAt;

    }

    if(
        player.status ===
        "crashed"
    ){

        return 0;

    }

    return Math.min(
        MAX_PAYOUT,

        getBaseMultiplier(
            player.rocket
        ) +

        Math.max(
            0,
            Math.min(
                1.5,
                player.bonus
            )
        )
    );

}


/* =========================================================
   SCORE
========================================================= */

function getPlayerScore(
    player
){

    if(
        !player ||
        player.bet <= 0
    ){

        return 0;

    }

    if(
        player.status ===
        "cashed"
    ){

        return Math.floor(
            player.reward
        );

    }

    if(
        player.status ===
        "crashed"
    ){

        return 0;

    }

    return Math.floor(
        player.bet *
        getPlayerMultiplier(
            player
        )
    );

}

            "win";

        multiplierEl.textContent =

let worldItems =

function getDifficulty(){

    const me =
        players.get(
            user.id
        );

    const multiplier =
        me
            ? getPlayerMultiplier(
                me
            )
            : 1;

        ) /
        7,

    );

/* =========================================================
   WORLD TICK
========================================================= */

function hostWorldTick(){

    if(
        !isHost() ||
        state !==
        "FLYING"
    ){

        return;

    }

    const now =
        Date.now();

    const dt =
        Math.min(
            .075,
            Math.max(
                .001,
                (
                    now -
                    lastWorldTick
                ) /
                1000
            )
        );

    lastWorldTick =
        now;

    const difficulty =
        getDifficulty();

    /*
       隕石越來越密。
    */

    const meteorInterval =
        570 -
        difficulty *
        250;

    if(
        now >=
        nextMeteorAt
    ){

        spawnMeteor();

        nextMeteorAt =
            now +
            meteorInterval;

    }

    /*
       能量頻率稍微降低。
    */

    const energyInterval =
        1150 -
        difficulty *
        250;

    if(
        now >=
        nextEnergyAt
    ){

        spawnEnergy();

        nextEnergyAt =
            now +
            energyInterval;

    }

    /*
       世界移動。
    */

    worldItems.forEach(
        item => {

            item.y +=
                item.speed *
                dt;

            item.life -=
                dt;

            item.rotation +=
                item.spin *
                dt;

        }
    );

    processHostCollisions();

    worldItems =
        worldItems.filter(
            item =>
                item.life > 0 &&
                item.y <
                1.1
        );

    /*
       火箭爆炸點。
    */

    if(
        !crashedA
    ){

        const value =
            getBaseMultiplier(
                "A",
                now
            );

        if(
            value >=
            crashPointA
        ){

            crashRocket(
                "A"
            );

        }

    }

    if(
        !crashedB
    ){

        const value =
            getBaseMultiplier(
                "B",
                now
            );

        if(
            value >=
            crashPointB
        ){

            crashRocket(
                "B"
            );

        }

    }

    /*
       所有人都離場：
       直接結束。
    */

    const remaining =
        getRoundPlayers()
        .filter(
            p =>
                p.status ===
                "flying"
        );

    if(
        remaining.length ===
        0
    ){

        finishRound();

        return;

    }

    /*
       超時：
       存活中的玩家直接以當前倍率自動逃脫，
       防止一局永遠不結束。
    */

    if(
        now -
        roundStartAt >=
        ROUND_MAX_MS
    ){

        remaining.forEach(
            player => {

                processCashout(
                    player.id
                );

            }
        );

    }

    broadcastWorld();

}

/* =========================================================
   COLLISION
========================================================= */

function processHostCollisions(){

    const now =
        Date.now();

    players.forEach(
        player => {

            if(
                player.status !==
                "flying"
            ){

                return;

            }

            if(
                now <
                player.invulnerableUntil
            ){

                return;

            }

            worldItems.forEach(
                item => {

                    if(
                        item.rocket !==
                        player.rocket
                    ){

                        return;

                    }

                    /*
                       玩家火箭位於畫面下方。
                    */

                    if(
                        item.y <
                        .69 ||
                        item.y >
                        .91
                    ){

                        return;

                    }

                    const distance =
                        Math.abs(
                            player.x -
                            item.x
                        );

                    const profile =
                        ROCKETS[
                            player.rocket
                        ];

                    const hitRange =
                        item.type ===
                        "meteor"

                            ? profile.hitRadius +
                              .07

                            : .12;

                    if(
                        distance >
                        hitRange
                    ){

                        return;

                    }

                    item.life =
                        0;

                    if(
                        item.type ===
                        "meteor"
                    ){

                        player.health =
                            Math.max(
                                0,
                                player.health -
                                1
                            );

                        player.invulnerableUntil =
                            now +
                            HIT_INVULN *
                            1000;

                        player.bonus =
                            Math.max(
                                0,
                                player.bonus -
                                .10
                            );

                        sendEvent(
                            "PLAYER_DAMAGED",
                            {

                                gameId:
                                    GAME_META.id,

                                roundId:
                                    currentRoundId,

                                playerId:
                                    player.id,

                                health:
                                    player.health

                            }
                        );

                        if(
                            player.id ===
                            user.id
                        ){

                            damageVisual();

                            showToast(
                                player.health > 0
                                    ? `☄️ 撞擊！剩餘 ${player.health} 格護甲`
                                    : "💥 護甲歸零！"
                            );

                        }

                        if(
                            player.health <=
                            0
                        ){

                            player.status =
                                "crashed";

                            player.reward =
                                0;

                            player.cashoutAt =
                                0;

                            sendEvent(
                                "PLAYER_CRASHED",
                                {

                                    gameId:
                                        GAME_META.id,

                                    roundId:
                                        currentRoundId,

                                    playerId:
                                        player.id,

                                    reason:
                                        "HULL_DESTROYED"

                                }
                            );

                            if(
                                player.id ===
                                user.id
                            ){

                                settleLoss(
                                    "HULL_DESTROYED"
                                );

                            }

                        }

                    }
                    else{

                        /*
                           能量：
                           狂暴號獲取稍高的倍率補正。
                        */

                        const bonus =
                            player.rocket ===
                            "B"

                                ? .11

                                : .08;

                        player.bonus =
                            Math.min(
                                1.5,
                                player.bonus +
                                bonus
                            );

                        if(
                            player.id ===
                            user.id
                        ){

                            soundEnergy();

                            showToast(
                                `⚡ 能量 +${bonus.toFixed(2)}x`,
                                600
                            );

                        }

                    }

                }
            );

        }
    );

}


/* =========================================================
   PLAYER INPUT
========================================================= */

let inputDirection =
    0;

let inputSeq =
    0;

let lastInputSent =
    0;


function updateLocalMovement(
    dt
){

    if(
        state !==
        "FLYING"
    ){

        return;

    }

    const me =
        players.get(
            user.id
        );

    if(
        !me ||
        me.status !==
        "flying"
    ){

        return;

    }

    const profile =
        ROCKETS[
            selectedRocket
        ];

    const direction =
        clamp(
            inputDirection,
            -1,
            1
        );

    /*
       非線性輸入：

       小角度比較細。
       大角度迅速移動。
    */

    const shaped =
        Math.sign(
            direction
        ) *
        Math.pow(
            Math.abs(
                direction
            ),
            .88
        );

    const targetVelocity =
        shaped *
        profile.maxSpeed;

    /*
       根據方向決定追蹤速度。
       狂暴號速度高，但放手時
       回正比較慢。
    */

    const response =
        Math.abs(
            targetVelocity
        ) <
        .01

            ? profile.brake

            : profile.response;

    me.velocity +=
        (
            targetVelocity -
            me.velocity
        ) *
        Math.min(
            1,
            response *
            dt
        );

    /*
       很重要：
       x 不再使用 0.72 的慢速度。
       現在 1 秒可以直接穿越非常明顯的距離。
    */

    me.x +=
        me.velocity *
        dt;

    me.x =
        clamp(
            me.x,
            -.90,
            .90
        );

    sendPlayerInput(
        me.x
    );

}

   SEND INPUT
========================================================= */

function sendPlayerInput(
    x
){

    const now =
        Date.now();

    if(
        now -
        lastInputSent <
        45
    ){

        return;

    }

    lastInputSent =
        now;

    const me =
        players.get(

    if(

                inputSeq,

/* =========================================================
   TILT
========================================================= */

let tiltReady =
    false;

let tiltEnabled =
    false;

let tiltZero =
    0;


async function requestTilt(){

    try{

        if(
            typeof DeviceOrientationEvent !==
            "undefined" &&

            typeof DeviceOrientationEvent
                .requestPermission ===
            "function"
        ){

            const permission =
                await DeviceOrientationEvent
                .requestPermission();

            if(
                permission !==
                "granted"
            ){

                return false;

            }

        }

        const samples =
            [];

        const listener =
            event => {

                if(
                    typeof event.gamma ===
                    "number"
                ){

                    samples.push(
                        event.gamma
                    );

                }

            };

        window.addEventListener(
            "deviceorientation",
            listener,
            true
        );

        controlStatus.textContent =
            "📱 正在校準目前手持角度…";

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    500
                )
        );

        window.removeEventListener(
            "deviceorientation",
            listener,
            true
        );

        if(
            !samples.length
        ){

            return false;

        }

        tiltZero =
            samples.reduce(
                (
                    sum,
                    value
                ) =>
                    sum +
                    value,
                0
            ) /
            samples.length;

        window.addEventListener(
            "deviceorientation",
            handleTilt,
            true
        );

        tiltReady =
            true;

        tiltEnabled =
            true;

        inputDirection =
            0;

        controlStatus.textContent =
            "✅ 體感已校準";

        return true;

    }catch(e){

        tiltReady =
            false;

        tiltEnabled =
            false;

        return false;

    }

}


function handleTilt(
    event
){

    if(
        !tiltEnabled ||
        typeof event.gamma !==
        "number"
    ){

        return;

    }

    let delta =
        event.gamma -
        tiltZero;

    /*
       小死區。
    */

    if(
        Math.abs(delta) <
        2
    ){

        delta =
            0;

    }

    /*
       35 度就接近最大，
       比舊版更快。
    */

    let value =
        delta /
        35;

    value =
        clamp(
            value,
            -1,
            1
        );

    /*
       讓前 20% 比較好細調。
    */

    inputDirection =
        Math.sign(
            value
        ) *
        Math.pow(
            Math.abs(value),
            .82
        );

}


function stopTilt(){

    window.removeEventListener(
        "deviceorientation",
        handleTilt,
        true
    );

    tiltEnabled =
        false;

    inputDirection =
        0;

}

function onWorldState(
    senderId,
    payload
){

    if(
        hostId &&
        String(senderId) !==
        String(hostId)
    ){

        return;

    }

    if(
        String(
            payload.roundId
        ) !==
        String(

        )
    ){

    }

        Number(
            payload.crashPointA
        );

    crashPointB =
        Number(
            payload.crashPointB
        );

    crashedA =
        !!payload.crashedA;

    crashedB =
        !!payload.crashedB;

    if(
        Array.isArray(
            payload.items
        )
    ){

        worldItems =
            payload.items.map(
                item => ({

                    id:
                        item.id,

                    type:
                        item.type,

                        item.rocket,

                        Number(

                        ),

                        Number(

                            25
                        ),

                        Number(
                            item.rotation ||
                            0
                        ),

                    speed:
                        0,

                    spin:
                        0,

                    life:
                        2

                })
            );

    }

    if(
        Array.isArray(
            payload.players
        )
    ){

        payload.players.forEach(
            incoming => {

                const id =
                    String(
                        incoming.id
                    );

                let player =
                    players.get(
                        id
                    );

                if(
                    !player
                ){

                    player =
                        createPlayer(
                            id,
                            incoming.username ||
                                "玩家",
                            incoming.avatar ||
                                "",
                            Date.now()
                        );

                }

                player.username =
                    String(
                        incoming.username ||
                        player.username
                    );

                player.avatar =
                    String(
                        incoming.avatar ||
                        player.avatar
                    );

                player.bet =
                    Number(
                        incoming.bet ||
                        0
                    );

                player.rocket =
                    incoming.rocket ===
                    "B"
                        ? "B"
                        : "A";

                player.status =
                    incoming.status ||
                    "flying";

                player.x =
                    clamp(
                        Number(
                            incoming.x ||
                            0
                        ),
                        -.9,
                        .9
                    );

                player.bonus =
                    clamp(
                        Number(
                            incoming.bonus ||
                            0
                        ),
                        0,
                        1.5
                    );

                player.health =
                    clamp(
                        Number(
                            incoming.health ??
                            MAX_HEALTH
                        ),
                        0,
                        MAX_HEALTH
                    );

                player.reward =
                    Number(
                        incoming.reward ||
                        0
                    );

                player.cashoutAt =
                    Number(
                        incoming.cashoutAt ||
                        0
                    );

                player.roundId =
                    incoming.roundId ||
                    currentRoundId;

                player.lastSeen =
                    Date.now();

                players.set(
                    id,
                    player
                );

            }
        );

    }

}

function crashRocket(
    rocket
){

    if(
        rocket ===
        "A"
    ){

        crashedA =
            true;

    }
    else{

        crashedB =
            true;

    }

    players.forEach(
        player => {

            if(
                player.rocket !==
                rocket
            ){

                return;

            }

            if(
                player.status !==
                "flying"
            ){

                return;

            player.status =
                "crashed";

            player.reward =
                0;

            player.health =
                0;

            sendEvent(
                "PLAYER_CRASHED",
                {

                    gameId:
                        GAME_META.id,

                    roundId:
                        currentRoundId,

                    playerId:
                        player.id,

                    reason:
                        "ROCKET_CRASH"

                }
            );

            if(
                player.id ===
                user.id
            ){

                settleLoss(
                    "ROCKET_CRASH"
                );

            }

        }
    );

    sendEvent(
        "ROCKET_CRASHED",
        {

            gameId:
                GAME_META.id,

            roundId:
                currentRoundId,

            rocket:
                rocket,

            crashPoint:
                rocket ===
                "A"
                    ? crashPointA
                    : crashPointB

    soundCrash();

    screenShake(

function cashout(){

    if(
        state !==
        "FLYING"
    ){

        return;

    }

    const me =
        players.get(
            user.id
        );

    if(
        !me ||
        me.status !==
        "flying"
    ){

        return;

    }

    const crashed =
        me.rocket ===
        "A"
            ? crashedA
            : crashedB;

    if(
        crashed
    ){

        return;

    }

    if(
        isHost()
    ){

        processCashout(
            user.id
        );

    }
    else{

        sendEvent(
            "PLAYER_CASHOUT",
            {

                gameId:
                    GAME_META.id,

                roundId:
                    currentRoundId,

                playerId:
                    user.id

}

========================================================= */

function onPlayerCashout(
    senderId,
    payload
){

        !isHost()
    ){

        return;

    }

    if(
        String(
            payload.roundId
        ) !==
        String(

    ){

        return;

    processCashout(
        String(
            payload.playerId ||

        )
    );

}


function processCashout(
    playerId
){

    if(
        state !==
        "FLYING"
    ){

        return;

    }

    const player =
        players.get(
            playerId
        );

    if(
        !player ||
        player.status !==
        "flying"
    ){

        return;

    }

    const crashed =
        player.rocket ===
        "A"
            ? crashedA
            : crashedB;

    if(
        crashed
    ){

        return;

    }

    /*
       只有這裡會計算獎勵。
       計算完即永久凍結。
    */

    const multiplier =
        Math.min(
            MAX_PAYOUT,

            Math.max(
                1.01,
                getBaseMultiplier(
                    player.rocket
                ) +
                Math.min(
                    1.5,
                    player.bonus
                )
            )
        );

    const reward =
        Math.floor(
            player.bet *
            multiplier
        );

    player.status =
        "cashed";

    player.cashoutAt =
        multiplier;

    player.reward =
        reward;

    player.cashoutTime =
        Date.now();

    sendEvent(
        "CASHOUT_CONFIRMED",
        {

            gameId:
                GAME_META.id,

            roundId:
                currentRoundId,

            playerId:
                player.id,

            username:
                player.username,

            rocket:
                player.rocket,

            bet:
                player.bet,

            multiplier:
                multiplier,

            reward:
                reward

        }
    );

    if(
        player.id ===
        user.id
    ){

        applyCashout(
            multiplier,
            reward
        );

    }

}

/* =========================================================
   APPLY CASHOUT
========================================================= */

function applyCashout(
    multiplier,
    reward
){

    const me =
        players.get(
            user.id
        );

    if(
        !me
    ){

        return;

    }

    /*
       永久鎖定。
    */

    me.status =
        "cashed";

    me.cashoutAt =
        multiplier;

    me.reward =
        reward;

    me.cashoutTime =
        Date.now();

    roundRewardSent =
        true;

    ejectButton.disabled =
        true;

    ejectButton.textContent =
        "✅ 已成功逃脫";

    multiplierEl.className =
        "win";

    multiplierEl.textContent =
        `${multiplier.toFixed(2)}x`;

    flightStatus.textContent =
        "✅ 已逃脫 · 獎勵鎖定";

    scoreText.innerHTML =

/* =========================================================
   ROUND RESULT
========================================================= */

function finishRound(){

    if(
        !isHost() ||
        state ===
        "RESULT"
    ){

        return;

    }

    state =
        "RESULT";

    const results =
        getRoundPlayers()
        .map(
            player => ({

                id:
                    player.id,

                username:
                    player.username,

                avatar:
                    player.avatar,

                bet:
                    player.bet,

                rocket:
                    player.rocket,

                status:
                    player.status,

                health:
                    player.health,

                reward:
                    Math.floor(
                        player.reward || 0
                    ),

                cashoutAt:
                    player.cashoutAt || 0

            })
        );

    results.sort(
        (a,b) => {

            const netA =
                a.reward -
                a.bet;

            const netB =
                b.reward -
                b.bet;

            if(
                netA !==
                netB
            ){

                return (
                    netB -
                    netA
                );

            }

            return (
                b.cashoutAt -
                a.cashoutAt
            );

        }
    );

    sendEvent(
        "ROUND_RESULT",
        {

            gameId:
                GAME_META.id,

            roundId:
                currentRoundId,

            results:
                results

        }
    );

    applyRoundResult(
        results
    );

}


function onRoundResult(
    senderId,
    payload
){

    if(
        hostId &&
        String(senderId) !==
        String(hostId)
    ){

        return;

    }

    applyRoundResult(
        Array.isArray(
            payload.results
        )
            ? payload.results
            : []
    );

}

function onLobbyState(
    senderId,
    payload
){

    if(
        payload.hostId
    ){

        hostId =
            String(
                payload.hostId
            );

        lastHostSeen =
            Date.now();

    }

    const list =
        Array.isArray(
            payload.players
        )
            ? payload.players
            : [];

    list.forEach(
        item => {

            const id =
                String(
                    item.id
                );

            if(
                id ===
                user.id
            ){

                return;

            }

            hostCandidates.set(
                id,
                {

                    id:
                        id,

                    joinedAt:
                        Number(
                            item.joinedAt ||
                            Date.now()
                        )

                }
            );

            let player =
                players.get(
                    id
                );

            if(
                !player
            ){

                player =
                    createPlayer(
                        id,
                        item.username ||
                            "玩家",
                        item.avatar ||
                            "",
                        Number(
                            item.joinedAt ||
                            Date.now()
                        )
                    );

            }

            player.username =
                String(
                    item.username ||
                    player.username
                );

            player.avatar =
                String(
                    item.avatar ||
                    player.avatar
                );

            player.ready =
                !!item.ready;

            player.bet =
                Number(
                    item.bet ||
                    0
                );

            player.rocket =
                item.rocket ===
                "B"
                    ? "B"
                    : "A";

            player.status =
                item.status ||
                "waiting";

            player.lastSeen =
                Date.now();

            players.set(
                id,
                player
            );

        }
    );

    updateRoomCount();

/* =========================================================
   PLAYER PRUNE
========================================================= */

function prunePlayers(){

    const now =
        Date.now();

    players.forEach(
        (player,id) => {

            if(
                id ===
                user.id
            ){

                player.lastSeen =
                    now;

                return;

            }

            /*
               本局玩家不因短暫延遲立即刪除。
            */

            const timeout =
                player.roundId
                    ? 15000
                    : 8500;

            if(
                now -
                player.lastSeen >
                timeout
            ){

                players.delete(
                    id
                );

                hostCandidates.delete(
                    id
                );

            }

        }
    );

    if(
        !hostId ||
        !players.has(
            hostId
        )
    ){

        hostId =
            null;

        electHost();

    }

    updateRoomCount();

}


/* =========================================================
   CANVAS
========================================================= */

let stars =
    [];


function createStars(){

    stars =
        [];

    const count =
        Math.min(
            170,
            Math.max(
                80,
                Math.floor(
                    width *
                    height /
                    9800
                )
            )
        );

    for(
        let i=0;
        i<count;
        i++
    ){

        stars.push({

            x:
                Math.random() *
                width,

            y:
                Math.random() *
                height,

            size:
                Math.random() *
                1.6 +
                .35,

            alpha:
                Math.random() *
                .55 +
                .18,

            speed:
                Math.random() *
                .7 +
                .2

        });

    }

}


function drawBackground(){

    ctx.fillStyle =
        "#02040a";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    const color =
        selectedRocket ===
        "A"

            ? "34,229,255"

            : "255,56,209";

    const glow =
        ctx.createRadialGradient(
            width/2,
            height*.56,
            10,
            width/2,
            height*.56,
            height*.8
        );

    glow.addColorStop(
        0,
        `rgba(${color},.13)`
    );

    glow.addColorStop(
        .55,
        `rgba(${color},.026)`
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        glow;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    const speed =
        state ===
        "FLYING"

            ? clamp(
                getMyVisualMultiplier(),
                1,
                8
            )

            : .7;

    stars.forEach(
        star => {

            star.y +=
                star.speed *
                speed;

            if(
                star.y >
                height
            ){

                star.y =
                    -2;

                star.x =
                    Math.random() *
                    width;

            }

            ctx.globalAlpha =
                star.alpha;

            ctx.fillStyle =
                "#fff";

            ctx.beginPath();

            ctx.arc(
                star.x,
                star.y,
                star.size,
                0,
                Math.PI*2
            );

            ctx.fill();

        }
    );

    ctx.globalAlpha =
        1;

}


/* =========================================================
   LANE
========================================================= */

function getLane(){

    return {

        center:
            width /
            2,

        width:
            Math.min(
                width *
                .88,
                500
            ),

        top:
            Math.max(
                120,
                height *
                .16
            ),

        bottom:
            height *
            .96

    };

}


function drawLane(){

    const lane =
        getLane();

    const left =
        lane.center -
        lane.width/2;

    const right =
        lane.center +
        lane.width/2;

    const color =
        selectedRocket ===
        "A"

            ? "34,229,255"

            : "255,56,209";

    const fill =
        ctx.createLinearGradient(
            lane.center,
            lane.top,
            lane.center,
            lane.bottom
        );

    fill.addColorStop(
        0,
        `rgba(${color},0)`
    );

    fill.addColorStop(
        .45,
        `rgba(${color},.018)`
    );

    fill.addColorStop(
        1,
        `rgba(${color},.09)`
    );

    ctx.fillStyle =
        fill;

    ctx.fillRect(
        left,
        lane.top,
        lane.width,
        lane.bottom -
        lane.top
    );

    /*
       很淡的道路邊線，
       不干擾遊戲。
    */

    ctx.strokeStyle =
        `rgba(${color},.13)`;

    ctx.lineWidth =
        1;

    ctx.beginPath();

    ctx.moveTo(
        left,
        lane.top
    );

    ctx.lineTo(
        left,
        lane.bottom
    );

    ctx.moveTo(
        right,
        lane.top
    );

    ctx.lineTo(
        right,
        lane.bottom
    );

    ctx.stroke();

}


/* =========================================================
   METEOR
========================================================= */

function drawMeteor(
    meteor
){

    if(
        meteor.rocket !==
        selectedRocket
    ){

        return;

    }

    const lane =
        getLane();

    const x =
        lane.center +
        meteor.x *
        lane.width *
        .43;

    const y =
        lane.top +
        meteor.y *
        (
            lane.bottom -
            lane.top
        );

    const size =
        meteor.size;

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        meteor.rotation
    );

    /*
       火焰尾巴。
       沒有紅色外框。
    */

    const trail =
        ctx.createLinearGradient(
            0,
            size*3.6,
            0,
            0
        );

    trail.addColorStop(
        0,
        "rgba(255,50,23,0)"
    );

    trail.addColorStop(
        .45,
        "rgba(255,85,33,.18)"
    );

    trail.addColorStop(
        .78,
        "rgba(255,151,55,.6)"
    );

    trail.addColorStop(
        1,
        "rgba(255,230,155,.94)"
    );

    ctx.fillStyle =
        trail;

    ctx.beginPath();

    ctx.moveTo(
        -size*.36,
        0
    );

    ctx.lineTo(
        0,
        size*3.8
    );

    ctx.lineTo(
        size*.36,
        0
    );

    ctx.closePath();

    ctx.fill();


    /*
       本體柔和光暈。
    */

    ctx.shadowBlur =
        22;

    ctx.shadowColor =
        "rgba(255,86,42,.54)";


    /*
       隕石。
    */

    const rock =
        ctx.createRadialGradient(
            -size*.3,
            -size*.28,
            2,

            0,
            0,
            size
        );

    rock.addColorStop(
        0,
        "#ffd9a2"
    );

    rock.addColorStop(
        .22,
        "#ff9a59"
    );

    rock.addColorStop(
        .58,
        "#c94a35"
    );

    rock.addColorStop(
        1,
        "#551c20"
    );

    ctx.fillStyle =
        rock;

    ctx.beginPath();

    const points =
        9;

    for(
        let i=0;
        i<points;
        i++
    ){

        const angle =
            i *
            Math.PI*2 /
            points;

        const radius =
            size *
            (
                .73 +
                Math.sin(
                    i*5.3
                )*.12
            );

        const px =
            Math.cos(
                angle
            ) *
            radius;

        const py =
            Math.sin(
                angle
            ) *
            radius;

        if(
            i===0
        ){

            ctx.moveTo(
                px,
                py
            );

        }
        else{

            ctx.lineTo(
                px,
                py
            );

        }

    }

    ctx.closePath();

    ctx.fill();


    /*
       隕石坑。
    */

    ctx.shadowBlur =
        0;

    ctx.fillStyle =
        "rgba(57,12,17,.68)";

    [
        [-.27,-.18,.13],
        [.27,-.07,.1],
        [.02,.25,.11]
    ]
    .forEach(
        p => {

            ctx.beginPath();

            ctx.arc(
                size*p[0],
                size*p[1],
                size*p[2],
                0,
                Math.PI*2
            );

            ctx.fill();

        }
    );

    /*
       中央熱點，
       取代紅框。
    */

    ctx.fillStyle =
        "rgba(255,213,137,.65)";

    ctx.beginPath();

    ctx.arc(
        -size*.25,
        -size*.24,
        size*.08,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* =========================================================
   ENERGY
========================================================= */

function drawEnergy(
    item
){

    if(
        item.rocket !==
        selectedRocket
    ){

        return;

    }

    const lane =
        getLane();

    const x =
        lane.center +
        item.x *
        lane.width *
        .43;

    const y =
        lane.top +
        item.y *
        (
            lane.bottom -
            lane.top
        );

    const pulse =
        9 +
        Math.sin(
            performance.now() *
            .008
        ) *
        2;

    ctx.save();

    ctx.shadowBlur =
        25;

    ctx.shadowColor =
        "#ffd84a";

    ctx.strokeStyle =
        "#ffd84a";

    ctx.lineWidth =
        2;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        pulse,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.fillStyle =
        "rgba(255,216,74,.12)";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        pulse*1.7,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle =
        "#fff8c0";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* =========================================================
   PLAYER ROCKET

function drawPlayerRocket(){

    const profile =
        ROCKETS[
            selectedRocket
        ];

    /*
       無敵時閃爍。
    */

    if(
        Date.now() <
        me.invulnerableUntil
    ){

        if(
            Math.floor(
                Date.now()/85
            ) % 2 ===
            0
        ){

            return;

        }

    }

    ctx.save();


    /*
       更明顯的火箭尾焰。
    */

    if(
        selectedRocket ===
        "A"
    ){

        drawStableRocket(
            x,
            y,
            profile
        );

    }
    else{

        drawBerserkRocket(
            x,
            y,
            profile
        );

    }

    ctx.restore();

}


/* =========================================================
   STABLE ROCKET
========================================================= */

function drawStableRocket(
    x,
    y,
    profile
){

    ctx.shadowBlur =
        30;

    ctx.shadowColor =
        profile.glow;

    /*
       長單焰
    */

    const flame =
        ctx.createLinearGradient(
            x,
            y+15,
            x,
            y+104
        );

    flame.addColorStop(
        0,
        "#fff"
    );

    flame.addColorStop(
        .18,
        "#ffe56d"
    );

    flame.addColorStop(
        .5,
        "#ff762b"
    );

    flame.addColorStop(
        1,
        "rgba(255,30,15,0)"
    );

    ctx.fillStyle =
        flame;

    ctx.beginPath();

    ctx.moveTo(
        x-11,
        y+13
    );

    ctx.lineTo(
        x+11,
        y+13
    );

    ctx.lineTo(
        x,
        y+
        93 +
        Math.random()*15
    );

    ctx.closePath();

    ctx.fill();


    /*
       本體：
       圓潤、穩定。
    */

    ctx.fillStyle =
        "#f4f8ff";

    ctx.beginPath();

    ctx.moveTo(
        x,
        y-48
    );

    ctx.quadraticCurveTo(
        x+25,
        y-11,
        x+20,
        y+27
    );

    ctx.lineTo(
        x-20,
        y+27
    );

    ctx.quadraticCurveTo(
        x-25,
        y-11,
        x,
        y-48
    );

    ctx.closePath();

    ctx.fill();

    ctx.strokeStyle =
        profile.color;

    ctx.lineWidth =
        3;

    ctx.stroke();


    /*
       穩定號雙側翼。
    */

    ctx.fillStyle =
        "#aab6c7";

    ctx.beginPath();

    ctx.moveTo(
        x-17,
        y+5
    );

    ctx.lineTo(
        x-43,
        y+36
    );

    ctx.lineTo(
        x-14,
        y+25
    );

    ctx.closePath();

    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(
        x+17,
        y+5
    );

    ctx.lineTo(
        x+43,
        y+36
    );

    ctx.lineTo(
        x+14,
        y+25
    );

    ctx.closePath();

    ctx.fill();


    /*
       大窗戶。
    */

    ctx.shadowBlur =
        0;

    ctx.fillStyle =
        profile.color;

    ctx.beginPath();

    ctx.arc(
        x,
        y-12,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle =
        "#fff";

    ctx.lineWidth =
        2;

    ctx.stroke();


    /*
       穩定號護盾。
    */

    ctx.strokeStyle =
        "rgba(34,229,255,.18)";

    ctx.lineWidth =
        2;

    ctx.beginPath();

    ctx.arc(
        x,
        y+4,
        37,
        Math.PI*.15,
        Math.PI*.85
    );

    ctx.stroke();

}


/* =========================================================
   BERSERK ROCKET
========================================================= */

function drawBerserkRocket(
    x,
    y,

){

    /*
       狂暴號：

    */

        ctx.createLinearGradient(
            x-9,
            y+15,
            x-9,
            y+108
        );

    flame1.addColorStop(
        0,
        "#fff"
    );

    flame1.addColorStop(
        .16,
        "#ffd759"
    );

    flame1.addColorStop(
        .45,
        "#ff4a7b"
    );

    flame1.addColorStop(
        1,
        "rgba(255,30,150,0)"
    );

    ctx.fillStyle =
        flame1;

    ctx.beginPath();

    ctx.moveTo(
        x-16,
        y+12
    );

    ctx.lineTo(
        x-2,
        y+12
    );

    ctx.lineTo(
        x-9,
        y+102+
