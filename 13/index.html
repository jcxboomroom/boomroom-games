/* =========================================================
   CASHOUT PROCESS
========================================================= */

function processCashout(
    playerId
){

    if(
        state !==
        "FLYING"
    ){

        return;

    }

    /*
       Host 第二道安全驗證。

       即使前端被修改，
       10 秒以前也直接拒絕。
    */

    const elapsed =
        Date.now() -
        roundStartAt;

    if(
        elapsed <
        MIN_REWARD_MS
    ){

        sendEvent(
            "CASHOUT_DENIED",
            {

                gameId:
                    GAME_META.id,

                roundId:
                    currentRoundId,

                playerId:
                    playerId,

                remain:
                    Math.max(
                        0,
                        MIN_REWARD_MS -
                        elapsed
                    )

            }
        );

        if(
            playerId ===
            user.id
        ){

            showToast(
                "⏳ 還沒滿 10 秒，不能領取獎勵"
            );

        }

        return;

    }


    const player =
        players.get(
            playerId
        );

    if(
        !player ||
        player.status !==
        "flying"
    ){

        return;

    }

    const crashed =
        player.rocket ===
        "A"
            ? crashedA
            : crashedB;

    if(
        crashed
    ){

        return;

    }


    /*
       在這裡一次鎖定。

       這是非常重要的：
       reward 算完後永遠不再更新。
    */

    const multiplier =
        Math.min(
            MAX_PAYOUT,
            Math.max(
                1.01,
                getBaseMultiplier(
                    player.rocket
                ) +
                Math.min(
                    1.5,
                    Math.max(
                        0,
                        player.bonus
                    )
                )
            )
        );

    const reward =
        Math.floor(
            player.bet *
            multiplier
        );


    player.status =
        "cashed";

    player.cashoutAt =
        multiplier;

    player.reward =
        reward;

    player.cashoutTime =
        Date.now();


    sendEvent(
        "CASHOUT_CONFIRMED",
        {

            gameId:
                GAME_META.id,

            roundId:
                currentRoundId,

            playerId:
                player.id,

            username:
                player.username,

            rocket:
                player.rocket,

            bet:
                player.bet,

            multiplier:
                multiplier,

            reward:
                reward,

            cashoutTime:
                player.cashoutTime

        }
    );


    if(
        player.id ===
        user.id
    ){

        applyCashout(
            multiplier,
            reward
        );

    }

}

function finishRound(){

    if(
        !isHost() ||
        state ===
        "RESULT"
    ){

        return;

    }

    state =
        "RESULT";

    const results =
        getRoundPlayers()
        .map(
            player => ({

                id:
                    player.id,

                username:
                    player.username,

                avatar:
                    player.avatar,

                bet:
                    player.bet,

                rocket:
                    player.rocket,

                status:
                    player.status,

                health:
                    player.health,

                reward:
                    Math.floor(
                        player.reward ||
                        0
                    ),

                cashoutAt:
                    player.cashoutAt ||
                    0

            })
        );

    results.sort(
        (a,b) => {

            const netA =
                a.reward -
                a.bet;

            const netB =
                b.reward -
                b.bet;

            if(
                netA !==
                netB
            ){

                return (
                    netB -
                    netA
                );

            }

            return (
                b.cashoutAt -
                a.cashoutAt
            );

        }
    );

    sendEvent(
        "ROUND_RESULT",
        {

            gameId:
                GAME_META.id,

            roundId:
                currentRoundId,

            results:
                results

        }
    );

    applyRoundResult(
        results
    );

}

){

        hostId &&
        String(senderId) !==

            ? payload.results

                ) ===
                user.id
        );

        me
            ? Number(

            )
            : 0;

        reward > 0
            ? "🚀 成功逃脫"
            : "💥 本局結束";

    resultMain.textContent =
        reward > 0
            ? `+${reward.toLocaleString()} 🪙`
            : "0 🪙";

    resultSub.textContent =
        me
            ? `${rocketName(
                me.rocket
            )} · ${Number(
                me.cashoutAt ||
                0
            ).toFixed(2)}x`
            : "—";

    leaderboard.innerHTML =
        "";

    results

        0,

    )
    .forEach(
        (

            index
        ) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "rank";

            const medal =
                index === 0
                    ? "🥇"
                    : index === 1
                        ? "🥈"
                        : index === 2
                            ? "🥉"
                            : String(
                                index + 1
                            );

            row.innerHTML =
                `<div>${medal}</div>`;

            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "rank-name";

            name.textContent =
                player.username ||
                "玩家";

            row.appendChild(
                name
            );

            const value =
                document.createElement(
                    "div"
                );

            value.className =
                "rank-value";

            const net =
                Number(
                    player.reward ||
                    0
                ) -
                Number(
                    player.bet ||
                    0
                );

            value.textContent =
                `${net >= 0 ? "+" : ""}${net.toLocaleString()}`;

            row.appendChild(
                value
            );

            leaderboard.appendChild(
                row
            );

        }
    );

    resultOverlay.classList.add(
        "show"
    );

function onLobbyState(
    senderId,
    payload
){

    if(
        payload.hostId
    ){

        hostId =
            String(
                payload.hostId
            );

        lastHostSeen =
            Date.now();

    }

    const list =
        Array.isArray(
            payload.players
        )
            ? payload.players
            : [];

    list.forEach(
        item => {

            const id =
                String(
                    item.id
                );

            if(
                id ===
                user.id
            ){

                return;

            }

            hostCandidates.set(
                id,
                {

                    id:
                        id,

                    joinedAt:
                        Number(
                            item.joinedAt ||
                            Date.now()
                        )

                }
            );

            let player =
                players.get(
                    id
                );

            if(
                !player
            ){

                player =
                    createPlayer(
                        id,
                        item.username ||
                            "玩家",
                        item.avatar ||
                            "",
                        Number(
                            item.joinedAt ||
                            Date.now()
                        )
                    );

            }

            player.username =
                String(
                    item.username ||
                    player.username
                );

            player.avatar =
                String(
                    item.avatar ||
                    player.avatar
                );

            player.ready =
                !!item.ready;

            player.bet =
                Number(
                    item.bet ||
                    0
                );

            player.rocket =
                item.rocket ===
                "B"
                    ? "B"
                    : "A";

            player.status =
                item.status ||
                "waiting";

            player.lastSeen =
                Date.now();

            players.set(
                id,
                player
            );

        }
    );

/* =========================================================
   PRUNE
========================================================= */

function prunePlayers(){

    const now =
        Date.now();

    players.forEach(
        (player,id) => {

            if(
                id ===
                user.id
            ){

                player.lastSeen =
                    now;

                return;

            }

            const timeout =
                player.roundId
                    ? 15000
                    : 8500;

            if(
                now -
                player.lastSeen >
                timeout
            ){

                players.delete(
                    id
                );

                hostCandidates.delete(
                    id
                );

            }

        }
    );

    if(
        !hostId ||
        (
            hostId !==
            user.id &&
            !players.has(
                hostId
            )
        )
    ){

        hostId =
            null;

        electHost();

    }

    updateRoomCount();

}

function buildBackgroundCache(){

    backgroundCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    backgroundCtx.fillStyle =
        "#02040a";

    backgroundCtx.fillRect(
        0,
        0,
        width,
        height
    );

    const color =
        selectedRocket ===
        "A"

            ? "34,229,255"

            : "255,56,209";

    /*
       漸層只建立一次，
       不再每幀建立。
    */

    const glow =
        backgroundCtx.createRadialGradient(
            width/2,
            height*.55,
            10,
            width/2,
            height*.55,
            height*.8
        );

    glow.addColorStop(
        0,
        `rgba(${color},.12)`
    );

    glow.addColorStop(
        .56,
        `rgba(${color},.024)`
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    backgroundCtx.fillStyle =
        glow;

    backgroundCtx.fillRect(
        0,
        0,
        width,
        height
    );

    /*
       遊戲區淡色邊線。
    */

    const left =
        width/2 -
        Math.min(
            width*.88,
            500
        )/2;

    const right =
        width/2 +
        Math.min(
            width*.88,
            500
        )/2;

    const top =
        Math.max(

========================================================= */

let stars =
    [];


function createStars(){

    stars =
        [];

    for(
        let i=0;
        i<STAR_COUNT;
        i++
    ){

        stars.push({

            x:
                Math.random() *
                width,

            y:
                Math.random() *
                height,

            size:
                Math.random() *
                1.4 +
                .35,

            alpha:
                Math.random() *
                .52 +
                .18,

            speed:
                Math.random() *
                .55 +
                .15

        });

    }

}


function drawStars(
    speed
){

    ctx.fillStyle =
        "#fff";

    for(
        let i=0;
        i<stars.length;
        i++
    ){

        const star =
            stars[i];

        star.y +=
            star.speed *
            speed;

        if(
            star.y >
            height
        ){

            star.y =
                -2;

            star.x =
                Math.random() *
                width;

        }

        ctx.globalAlpha =
            star.alpha;

        /*
           fillRect 比每顆 arc
           更便宜。
        */

        ctx.fillRect(
            star.x,
            star.y,
            star.size,
            star.size
        );

    }

    ctx.globalAlpha =
        1;

}

function drawMeteor(

){

        Math.min(
            width*.88,
            500

    const laneCenter =

            height*.16
        );

        height*.96;

        laneCenter +
        meteor.x *
        laneWidth *
        .43;

    const y =
        laneTop +
        meteor.y *
        (
            laneBottom -
            laneTop
        );

    const size =
        meteor.size;

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        meteor.rotation
    );


    /*
       尾焰。
    */

    const trail =
        ctx.createLinearGradient(
            0,
            size*3.2,
            0,
            0
        );

    trail.addColorStop(
        0,
        "rgba(255,40,20,0)"
    );

    trail.addColorStop(
        .52,
        "rgba(255,86,34,.16)"
    );

    trail.addColorStop(
        .8,
        "rgba(255,151,55,.52)"
    );

    trail.addColorStop(
        1,
        "rgba(255,226,151,.9)"
    );

    ctx.fillStyle =
        trail;

    ctx.beginPath();

    ctx.moveTo(
        -size*.35,
        0
    );

    ctx.lineTo(
        0,
        size*3.5
    );

    ctx.lineTo(
        size*.35,
        0
    );

    ctx.closePath();

    ctx.fill();


    /*
       本體。

       不再畫紅色外框。
    */

    ctx.shadowBlur =
        18;

    ctx.shadowColor =
        "rgba(255,83,40,.48)";

    const rock =
        ctx.createRadialGradient(
            -size*.27,
            -size*.27,
            2,
            0,
            0,
            size
        );

    rock.addColorStop(
        0,
        "#ffe0a9"
    );

    rock.addColorStop(
        .2,
        "#ff9c5a"
    );

    rock.addColorStop(
        .58,
        "#c94d37"
    );

    rock.addColorStop(
        1,
        "#541b20"
    );

    ctx.fillStyle =
        rock;

    ctx.beginPath();

    const points =
        9;

    for(
        let i=0;
        i<points;
        i++
    ){

        const angle =
            i *
            Math.PI*2 /
            points;

        const radius =
            size *
            (
                .74 +
                Math.sin(
                    i*5.1
                ) *
                .12
            );

        const px =
            Math.cos(
                angle
            ) *
            radius;

        const py =
            Math.sin(
                angle
            ) *
            radius;

        if(
            i === 0
        ){

            ctx.moveTo(
                px,
                py
            );

        }
        else{

            ctx.lineTo(
                px,
                py
            );

        }

    }

    ctx.closePath();
    ctx.fill();


    /*
       隕石坑。
    */

    ctx.shadowBlur =
        0;

    ctx.fillStyle =
        "rgba(55,12,16,.65)";

    ctx.beginPath();
    ctx.arc(
        -size*.25,
        -size*.18,
        size*.12,
        0,
        Math.PI*2
    );
    ctx.fill();

    ctx.beginPath();
    ctx.arc(
        size*.25,
        -size*.06,
        size*.09,
        0,
        Math.PI*2
    );
    ctx.fill();

    ctx.beginPath();
    ctx.arc(
        size*.02,
        size*.25,
        size*.11,
        0,
        Math.PI*2
    );
    ctx.fill();


    ctx.fillStyle =
        "rgba(255,220,145,.7)";

    ctx.beginPath();

    ctx.arc(
        -size*.25,
        -size*.24,
        size*.07,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}

/* =========================================================
   DRAW FRAME
========================================================= */

function updateRemoteItems(
    dt
){

    if(
        isHost()
    ){

        return;

    }

    worldItems.forEach(
        item => {

            if(
                Number.isFinite(
                    item.targetY
                )
            ){

                item.y +=
                    (
                        item.targetY -
                        item.y
                    ) *
                    Math.min(
                        1,
                        12 *
                        dt
                    );

            }

            item.y +=
                item.speed *
                dt;

            if(
                Number.isFinite(
                    item.targetRotation
                )
            ){

                item.rotation +=
                    (
                        item.targetRotation -
                        item.rotation
                    ) *
                    Math.min(
                        1,
                        10 *
                        dt
                    );

            }

        }
    );

}


function drawFrame(
    dt
){

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    /*
       背景用快取 Bitmap。
    */

    ctx.drawImage(
        backgroundCanvas,
        0,
        0,
        width,
        height
    );


    const speed =
        state ===
        "FLYING"

            ? clamp(
                getMyVisualMultiplier(),
                1,
                7
            )

            : .7;


    ctx.save();

    ctx.translate(
        shakeX,
        shakeY
    );

    drawStars(
        speed
    );

    updateRemoteItems(
        dt
    );


    if(
        body.classList.contains(
            "playing"
        )
    ){

        worldItems.forEach(
            item => {

                if(
                    item.type ===
                    "meteor"
                ){

                    drawMeteor(
                        item
                    );

                }
                else{

                    drawEnergy(
                        item
                    );

                }

            }
        );


        drawPlayerRocket();

    }

    ctx.restore();


    shakeX *=
        .84;

    shakeY *=
        .84;

}


/* =========================================================
   PERFORMANCE WATCH
========================================================= */

function updatePerformance(
    dt
){

    const frameMs =
        dt * 1000;

    avgFrameMs +=
        (
            frameMs -
            avgFrameMs
        ) *
        .06;

    const now =
        performance.now();

    if(
        now -
        performanceSampleTime <
        1200
    ){

        return;

    }

    performanceSampleTime =
        now;

    if(
        avgFrameMs >
        21
    ){

        performanceLow =
            true;

    }
    else if(
        avgFrameMs <
        17
    ){

        performanceLow =
            false;

    }

}


/* =========================================================
   FRAME LOOP
========================================================= */

let lastFrame =
    performance.now();


function frame(
    now
){

    let dt =
        (
            now -
            lastFrame
        ) /
        1000;

    lastFrame =
        now;

    dt =
        Math.min(
            .05,
            Math.max(
                .001,
                dt
            )
        );


    updatePerformance(
        dt
    );


    /*
       本地感測器輸入。
    */

    updateSensorInput();


    /*
       本地火箭。
    */

    if(
        state ===
        "FLYING"
    ){

        updateLocalMovement(
            dt
        );

    }


    /*
       Host 模擬。

       真正的世界 simulation
       跟網路 broadcast 分離。
    */

    if(
        isHost() &&
        state ===
        "FLYING"
    ){

        simulateHost(
            dt,
            now
        );

        maybeBroadcastWorld(
            now
        );

    }


    drawFrame(
        dt
    );

    updateHUD();

    requestAnimationFrame(
        frame
    );

}

/* =========================================================
   AUDIO
========================================================= */

let audioContext =
    null;


function initAudio(){

    if(
        !audioContext
    ){

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(
            AudioContext
        ){

            try{

                audioContext =
                    new AudioContext();

            }catch(e){}

        }

    }

    if(
        audioContext &&
        audioContext.state ===
        "suspended"
    ){

        audioContext
        .resume()
        .catch(
            () => {}
        );

    }

}


function tone(
    frequency,
    duration,
    type="triangle",
    volume=.03,
    slide=0
){

    if(
        !audioContext
    ){

        return;

    }

    try{

        const oscillator =
            audioContext
                .createOscillator();

        const gain =
            audioContext
                .createGain();

        oscillator.type =
            type;

        oscillator.frequency.setValueAtTime(
            frequency,
            audioContext.currentTime
        );

        if(
            slide
        ){

            oscillator.frequency.linearRampToValueAtTime(
                frequency +
                slide,
                audioContext.currentTime +
                duration
            );

        }

        gain.gain.setValueAtTime(
            volume,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime +
            duration
        );

        oscillator.connect(
            gain
        );

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            duration
        );

    }catch(e){}

}

        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () =>
                toast.classList.remove(
                    "show"
                ),
            duration
        );

}


/* =========================================================
   HELPERS
========================================================= */

function average(
    values
){

    if(
        !values.length
    ){

        return 0;

    }

    let total =
        0;

    for(
        let i=0;
        i<values.length;
        i++
    ){

        total +=
            values[i];

    }

    return (
        total /
        values.length
    );

}


function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


function rocketName(
    id
){

    return id ===
        "B"

        ? "🩷 狂暴號"

        : "🔵 穩定號";

}


function escapeHTML(
    value
){

    return String(
        value
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================================
   HEARTBEAT
========================================================= */

let heartbeatCounter =
    0;


setInterval(
    () => {

        heartbeatCounter++;

        broadcastHello();

        prunePlayers();

        if(
            !hostId
        ){

            electHost();

        }

        if(
            isHost()
        ){

            if(
                heartbeatCounter %
                6 ===
                0
            ){

                sendHostAnnounce();

            }

            if(
                state ===
                "LOBBY" &&
                heartbeatCounter %
                5 ===
                0
            ){

                sendLobbyState();

                maybeStartRound();

            }

        }
        else{

            if(
                Date.now() -
                lastHostSeen >
                7000
            ){

                hostId =
                    null;

                electHost();

            }

        }

    },
    700
);


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if(
            document.visibilityState ===
            "visible"
        ){

            broadcastHello();

            /*
               回到前景時重新取得
               sensor stream 狀態。
            */

            if(
                controlMode ===
                "tilt" &&
                state ===
                "FLYING"
            ){

                scheduleRecalibration();

            }

        }

    }
);


/* =========================================================
   INIT
========================================================= */

resizeCanvas();

updateRocketChoice();

updateControlChoice();

updateRoomCount();

broadcastHello();


setTimeout(
    () => {

        electHost();

        if(
            isHost()
        ){

            sendHostAnnounce();

        }

    },
    350
);


requestAnimationFrame(
    frame
);

})();
</script>
