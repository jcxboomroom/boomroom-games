    /* =========================================================
       Lobby Snapshot
    ========================================================= */

    function buildLobbyPlayers() {
        return Array.from(
            playerMap.values()
        )
        .slice(0, MAX_PLAYERS_DISPLAY)
        .map(p => ({
            id: p.id,
            username: p.username,
            avatar: p.avatar,
            joinedAt: p.joinedAt,
            ready: p.ready,
            bet: p.bet,
            rocket: p.rocket,
            status: p.status
        }));
    }

    function sendLobbySnapshot(targetId = null) {
        if (!isHost()) {
            return;
        }

        sendEvent(
            "LOBBY_STATE",
            {
                gameId: GAME_ID,
                hostId,
                targetId,
                hostNow: Date.now(),
                players:
                    buildLobbyPlayers()
            }
        );
    }

    function onLobbyState(
        senderId,
        payload
    ) {
        if (
            payload.targetId &&
            String(payload.targetId) !== user.id
        ) {
            return;
        }

        const incomingPlayers =
            payload.players || [];

        incomingPlayers.forEach(
            p => {

                if (p.id === user.id) {
                    return;
                }

                upsertPlayer(
                    String(p.id),
                    {
                        id: String(p.id),
                        username:
                            String(
                                p.username ||
                                "玩家"
                            ),
                        avatar:
                            String(
                                p.avatar ||
                                ""
                            ),
                        joinedAt:
                            safeNumber(
                                p.joinedAt,
                                Date.now()
                            ),
                        ready:
                            !!p.ready,
                        bet:
                            safeNumber(
                                p.bet,
                                0
                            ),
                        rocket:
                            p.rocket === "B"
                                ? "B"
                                : "A",
                        status:
                            String(
                                p.status ||
                                "waiting"
                            )
                    }
                );

                hostCandidates.set(
                    String(p.id),
                    {
                        id: String(p.id),
                        joinedAt:
                            safeNumber(
                                p.joinedAt,
                                Date.now()
                            ),
                        username:
                            String(
                                p.username ||
                                "玩家"
                            )
                    }
                );
            }
        );

        if (payload.hostId) {
            hostId =
                String(
                    payload.hostId
                );
        }

        lastHostHeartbeat =
            Date.now();

        if (payload.hostNow) {
            clockOffset =
                safeNumber(
                    payload.hostNow,
                    Date.now()
                ) -
                Date.now();
        }

        renderPlayers();
        renderHeader();
    }


    /* =========================================================
       Round Start
    ========================================================= */

    function readyPlayers() {
        return Array.from(
            playerMap.values()
        )
        .filter(
            p =>
                p.ready &&
                p.bet > 0
        );
    }

    function maybeStartRound() {
        if (
            !isHost() ||
            state !== "LOBBY"
        ) {
            return;
        }

        const ready =
            readyPlayers();

        if (!ready.length) {
            return;
        }

        if (
            maybeStartRound.lastAttempt &&
            Date.now() -
                maybeStartRound.lastAttempt <
                ROUND_WAIT_MS
        ) {
            return;
        }

        maybeStartRound.lastAttempt =
            Date.now();

        sendEvent(
            "PLAYER_MESSAGE",
            {
                text:
                    `🚀 ${ready.length} 人準備完成，倒數開始！`
            }
        );

        const roundId =
            randomId("round");

        const startAt =
            Date.now() +
            START_DELAY_MS;

        crashPointA =
            generateCrashPoint(
                ROCKETS.A.minCrash,
                ROCKETS.A.maxCrash,
                "A"
            );

        crashPointB =
            generateCrashPoint(
                ROCKETS.B.minCrash,
                ROCKETS.B.maxCrash,
                "B"
            );

        const startPayload = {
            gameId: GAME_ID,
            roundId,
            hostId: user.id,
            hostNow: Date.now(),
            startAt,
            crashPointA,
            crashPointB,
            rocketGrowthA: ROCKETS.A.growth,
            rocketGrowthB: ROCKETS.B.growth,
            players:
                ready.map(
                    p => ({
                        id: p.id,
                        username: p.username,
                        avatar: p.avatar,
                        bet: p.bet,
                        rocket: p.rocket,
                        x: p.x,
                        bonus: 0
                    })
                )
        };

        state = "COUNTDOWN";
        currentRoundId =
            roundId;
        roundStartAt =
            startAt;

        rocketCrashedA = false;
        rocketCrashedB = false;
        roundRewardSent = false;

        sendEvent(
            "ROUND_START",
            startPayload
        );

        applyRoundStart(
            user.id,
            startPayload
        );

        setTimeout(
            () => {
                if (
                    currentRoundId ===
                    roundId &&
                    state === "COUNTDOWN"
                ) {
                    state = "FLYING";
                    soundStart();

                    if (isHost()) {
                        initHostWorld();
                    }
                }
            },
            START_DELAY_MS + 30
        );
    }


    function generateCrashPoint(
        min,
        max,
        rocketId
    ) {
        const r =
            Math.random();

        let point;

        if (rocketId === "A") {
            point =
                min +
                (
                    Math.pow(
                        r,
                        1.65
                    ) *
                    (max - min)
                );
        } else {
            point =
                min +
                (
                    Math.pow(
                        r,
                        2.15
                    ) *
                    (max - min)
                );
        }

        point =
            clamp(
                point,
                min,
                max
            );

        return Number(
            point.toFixed(2)
        );
    }


    function onRoundStart(
        senderId,
        payload
    ) {
        if (
            hostId &&
            senderId !== hostId
        ) {
            return;
        }

        if (
            payload.hostId
        ) {
            hostId =
                String(
                    payload.hostId
                );
        }

        lastHostHeartbeat =
            Date.now();

        if (payload.hostNow) {
            clockOffset =
                safeNumber(
                    payload.hostNow,
                    Date.now()
                ) -
                Date.now();
        }

        applyRoundStart(
            senderId,
            payload
        );
    }


    function applyRoundStart(
        senderId,
        payload
    ) {
        currentRoundId =
            String(
                payload.roundId
            );

        state =
            "COUNTDOWN";

        roundStartAt =
            safeNumber(
                payload.startAt,
                Date.now() +
                START_DELAY_MS
            );

        crashPointA =
            safeNumber(
                payload.crashPointA,
                2
            );

        crashPointB =
            safeNumber(
                payload.crashPointB,
                2
            );

        rocketCrashedA = false;
        rocketCrashedB = false;
        roundRewardSent = false;

        resultOverlay.classList.remove(
            "show"
        );

        const incomingPlayers =
            payload.players || [];

        incomingPlayers.forEach(
            p => {
                upsertPlayer(
                    String(p.id),
                    {
                        id: String(p.id),
                        username:
                            String(
                                p.username ||
                                "玩家"
                            ),
                        avatar:
                            String(
                                p.avatar ||
                                ""
                            ),
                        ready: true,
                        bet:
                            safeNumber(
                                p.bet,
                                0
                            ),
                        rocket:
                            p.rocket === "B"
                                ? "B"
                                : "A",
                        status: "flying",
                        x:
                            clamp(
                                safeNumber(
                                    p.x,
                                    0
                                ),
                                -1,
                                1
                            ),
                        renderX:
                            clamp(
                                safeNumber(
                                    p.x,
                                    0
                                ),
                                -1,
                                1
                            ),
                        bonus: 0,
                        reward: 0,
                        cashoutAt: 0
                    }
                );
            }
        );

        const me =
            playerMap.get(
                user.id
            );

        if (
            me &&
            !incomingPlayers.some(
                p =>
                    String(p.id) ===
                    user.id
            ) &&
            me.ready
        ) {
            me.status = "flying";
        }

        actionButton.disabled =
            !me ||
            !me.ready;

        actionButton.classList.remove(
            "disabled"
        );

        if (
            me &&
            me.ready
        ) {
            actionButton.textContent =
                "🚀 EJECT 逃脫";
            actionButton.classList.add(
                "eject"
            );
        }

        statusText.textContent =
            "雙火箭即將升空…";

        controlHint.textContent =
            "左右傾斜手機，收集能量球並躲開隕石";

        soundJoin();

        renderPlayers();

        setTimeout(
            () => {

                if (
                    currentRoundId !==
                    String(payload.roundId)
                ) {
                    return;
                }

                state =
                    "FLYING";

                actionButton.classList.add(
                    "eject"
                );

                actionButton.textContent =
                    "🚀 EJECT 逃脫";

                if (isHost()) {
                    initHostWorld();
                }

            },
            Math.max(
                0,
                roundStartAt -
                (Date.now() +
                clockOffset)
            )
        );
    }


    /* =========================================================
       Host World Simulation
    ========================================================= */

    let hostWorld = {
        orbs: [],
        nextOrbId: 1,
        lastTick: 0,
        meteorCooldownA: 0,
        meteorCooldownB: 0
    };

    function initHostWorld() {
        hostSimulationInitialized =
            true;

        hostWorld = {
            orbs: [],
            nextOrbId: 1,
            lastTick: Date.now(),
            meteorCooldownA: 0,
            meteorCooldownB: 0
        };

        Array.from(
            playerMap.values()
        )
        .forEach(
            p => {
                if (p.ready) {
                    p.status =
                        "flying";
                    p.bonus = 0;
                    p.reward = 0;
                    p.cashoutAt = 0;
                }
            }
        );

        addEvent(
            "🔥 Host 已啟動雙火箭模擬"
        );
    }


    function restoreHostSimulation() {
        if (!isHost()) {
            return;
        }

        if (!hostSimulationInitialized) {
            initHostWorld();
        }
    }


    function hostTick() {
        if (!isHost()) {
            return;
        }

        if (
            state !== "FLYING"
        ) {
            return;
        }

        const now =
            Date.now();

        const dt =
            Math.min(
                .1,
                Math.max(
                    .001,
                    (
                        now -
                        hostWorld.lastTick
                    ) / 1000
                )
            );

        hostWorld.lastTick =
            now;

        const baseA =
            getBaseMultiplier(
                "A",
                now
            );

        const baseB =
            getBaseMultiplier(
                "B",
                now
            );

        if (
            !rocketCrashedA &&
            baseA >= crashPointA
        ) {
            crashRocket("A");
        }

        if (
            !rocketCrashedB &&
            baseB >= crashPointB
        ) {
            crashRocket("B");
        }

        spawnWorldItems(
            dt,
            baseA,
            baseB
        );

        moveWorldItems(
            dt
        );

        processCollisions();

        if (
            now -
            lastWorldBroadcast >=
            WORLD_BROADCAST_MS
        ) {
            broadcastWorldState();

            lastWorldBroadcast =
                now;
        }

        if (
            rocketCrashedA &&
            rocketCrashedB
        ) {
            finishRound();
        }
    }


    function getBaseMultiplier(
        rocketId,
        hostNow = Date.now()
    ) {
        const elapsedMs =
            Math.max(
                0,
                hostNow -
                roundStartAt
            );

        const elapsedSeconds =
            elapsedMs / 1000;

        const growth =
            rocketId === "A"
                ? ROCKETS.A.growth
                : ROCKETS.B.growth;

        return Math.pow(
            growth,
            elapsedSeconds
        );
    }


    function getPlayerMultiplier(
        player
    ) {
        const base =
            getBaseMultiplier(
                player.rocket
            );

        return Math.min(
            MAX_PAYOUT_MULTIPLIER,
            base +
            clamp(
                safeNumber(
                    player.bonus,
                    0
                ),
                0,
                1.5
            )
        );
    }


    function spawnWorldItems(
        dt,
        baseA,
        baseB
    ) {
        const now =
            Date.now();

        if (
            now -
            hostWorld.lastOrbSpawn >
            720
        ) {
            spawnEnergyOrb();
            hostWorld.lastOrbSpawn =
                now;
        }

        if (
            !hostWorld.lastMeteorSpawn ||
            now -
            hostWorld.lastMeteorSpawn >
            1150
        ) {
            spawnMeteor();
            hostWorld.lastMeteorSpawn =
                now;
        }
    }


    function spawnEnergyOrb() {
        const rocket =
            Math.random() < .5
                ? "A"
                : "B";

        const speed =
            0.26 +
            Math.random() * .12;

        hostWorld.orbs.push({
            id:
                "o" +
                hostWorld.nextOrbId++,
            type: "energy",
            rocket,
            x:
                clamp(
                    (
                        Math.random() *
                        2 -
                        1
                    ),
                    -1,
                    1
                ),
            y: 0,
            speed,
            value:
                .06 +
                Math.random() * .05,
            ttl: 4
        });
    }


    function spawnMeteor() {
        const rocket =
            Math.random() < .5
                ? "A"
                : "B";

        hostWorld.orbs.push({
            id:
                "m" +
                hostWorld.nextOrbId++,
            type: "meteor",
            rocket,
            x:
                clamp(
                    (
                        Math.random() *
                        2 -
                        1
                    ),
                    -1,
                    1
                ),
            y: 0,
            speed:
                0.32 +
                Math.random() * .18,
            damage:
                .08 +
                Math.random() * .08,
            ttl: 4
        });
    }


    function moveWorldItems(dt) {
        hostWorld.orbs.forEach(
            item => {
                item.y +=
                    item.speed *
                    dt;

                item.ttl -=
                    dt;
            }
        );

        hostWorld.orbs =
            hostWorld.orbs.filter(
                item =>
                    item.y < 1.18 &&
                    item.ttl > 0
            );
    }


    function processCollisions() {
        const players =
            Array.from(
                playerMap.values()
            );

        for (
            const item of hostWorld.orbs
        ) {
            if (
                item.y < .67 ||
                item.y > .87
            ) {
                continue;
            }

            for (
                const player of players
            ) {
                if (
                    player.status !==
                    "flying"
                ) {
                    continue;
                }

                if (
                    player.rocket !==
                    item.rocket
                ) {
                    continue;
                }

                const distance =
                    Math.abs(
                        player.x -
                        item.x
                    );

                if (
                    distance >
                    .14
                ) {
                    continue;
                }

                item.ttl = 0;

                if (
                    item.type ===
                    "energy"
                ) {
                    player.bonus =
                        clamp(
                            player.bonus +
                            item.value,
                            0,
                            1.5
                        );

                    if (
                        player.id ===
                        user.id
                    ) {
                        soundCollect();
                        showToast(
                            `⚡ 能量 +${item.value.toFixed(2)}x`
                        );
                    }

                    sendEvent(
                        "PLAYER_MESSAGE",
                        {
                            text:
                                `⚡ ${player.username} 收集到能量`
                        }
                    );

                } else {
                    player.bonus =
                        clamp(
                            player.bonus -
                            item.damage,
                            0,
                            1.5
                        );

                    if (
                        player.id ===
                        user.id
                    ) {
                        soundHit();
                        showToast(
                            "☄️ 撞擊！倍率加成下降"
                        );
                    }
                }

                break;
            }
        }

        hostWorld.orbs =
            hostWorld.orbs.filter(
                item =>
                    item.ttl > 0
            );
    }


    function onPlayerInput(
        senderId,
        payload
    ) {
        if (!isHost()) {
            return;
        }

        if (
            state !==
            "FLYING"
        ) {
            return;
        }

        if (
            String(payload.roundId) !==
            currentRoundId
        ) {
            return;
        }

        const p =
            playerMap.get(
                senderId
            );

        if (!p) {
            return;
        }

        const seq =
            safeNumber(
                payload.seq,
                0
            );

        if (
            seq <=
            p.lastInputSeq
        ) {
            return;
        }

        p.lastInputSeq =
            seq;

        p.x =
            clamp(
                safeNumber(
                    payload.x,
                    p.x
                ),
                -1,
                1
            );
    }


    /* =========================================================
       World State
    ========================================================= */

    function buildWorldState() {
        return {
            gameId: GAME_ID,
            roundId: currentRoundId,
            hostId: user.id,
            hostNow: Date.now(),
            state,
            roundStartAt,
            crashPointA,
            crashPointB,
            rocketCrashedA,
            rocketCrashedB,
            orbs:
                hostWorld.orbs.map(
                    o => ({
                        id: o.id,
                        type: o.type,
                        rocket: o.rocket,
                        x: o.x,
                        y: o.y
                    })
                ),
            players:
                Array.from(
                    playerMap.values()
                )
                .slice(
                    0,
                    MAX_PLAYERS_DISPLAY
                )
                .map(
                    p => ({
                        id: p.id,
                        username: p.username,
                        avatar: p.avatar,
                        bet: p.bet,
                        rocket: p.rocket,
                        status: p.status,
                        x: p.x,
                        bonus: p.bonus,
                        reward: p.reward,
                        cashoutAt:
                            p.cashoutAt
                    })
                )
        };
    }


    function broadcastWorldState() {
        if (!isHost()) {
            return;
        }

        sendEvent(
            "WORLD_STATE",
            buildWorldState()
        );
    }


    function onWorldState(
        senderId,
        payload
    ) {
        if (
            hostId &&
            senderId !== hostId
        ) {
            return;
        }

        if (
            String(payload.roundId || "") !==
            currentRoundId
        ) {
            return;
        }

        if (payload.hostNow) {
            clockOffset =
                safeNumber(
                    payload.hostNow,
                    Date.now()
                ) -
                Date.now();

            lastHostHeartbeat =
                Date.now();
        }

        applyWorldPayload(
            payload
        );
    }


    function applyWorldPayload(
        payload
    ) {
        if (
            payload.state
        ) {
            state =
                payload.state;
        }

        if (
            payload.roundStartAt
        ) {
            roundStartAt =
                safeNumber(
                    payload.roundStartAt,
                    roundStartAt
                );
        }

        crashPointA =
            safeNumber(
                payload.crashPointA,
                crashPointA
            );

        crashPointB =
            safeNumber(
                payload.crashPointB,
                crashPointB
            );

        rocketCrashedA =
            !!payload.rocketCrashedA;

        rocketCrashedB =
            !!payload.rocketCrashedB;

        const incomingPlayers =
            payload.players || [];

        incomingPlayers.forEach(
            p => {
                upsertPlayer(
                    String(p.id),
                    {
                        id: String(p.id),
                        username:
                            String(
                                p.username ||
                                "玩家"
                            ),
                        avatar:
                            String(
                                p.avatar ||
                                ""
                            ),
                        bet:
                            safeNumber(
                                p.bet,
                                0
                            ),
                        rocket:
                            p.rocket === "B"
                                ? "B"
                                : "A",
                        status:
                            String(
                                p.status ||
                                "waiting"
                            ),
                        x:
                            clamp(
                                safeNumber(
                                    p.x,
                                    0
                                ),
                                -1,
                                1
                            ),
                        bonus:
                            clamp(
                                safeNumber(
                                    p.bonus,
                                    0
                                ),
                                0,
                                1.5
                            ),
                        reward:
                            safeNumber(
                                p.reward,
                                0
                            ),
                        cashoutAt:
                            safeNumber(
                                p.cashoutAt,
                                0
                            )
                    }
                );
            }
        );

        worldVisualOrbs =
            Array.isArray(payload.orbs)
                ? payload.orbs.map(
                    o => ({
                        id: o.id,
                        type: o.type,
                        rocket: o.rocket,
                        x:
                            safeNumber(
                                o.x,
                                0
                            ),
                        y:
                            safeNumber(
                                o.y,
                                0
                            )
                    })
                )
                : [];

        renderPlayers();
    }


    /* =========================================================
       Round Snapshot
    ========================================================= */

    function sendRoundSnapshot(targetId = null) {
        if (!isHost()) {
            return;
        }

        const payload =
            buildWorldState();

        payload.targetId =
            targetId;

        sendEvent(
            "ROUND_SNAPSHOT",
            payload
        );
    }


    function onRoundSnapshot(
        senderId,
        payload
    ) {
        if (
            payload.targetId &&
            String(payload.targetId) !==
            user.id
        ) {
            return;
        }

        if (
            hostId &&
            senderId !== hostId
        ) {
            return;
        }

        if (payload.hostNow) {
            clockOffset =
                safeNumber(
                    payload.hostNow,
                    Date.now()
                ) -
                Date.now();

            lastHostHeartbeat =
                Date.now();
        }

        currentRoundId =
            String(
                payload.roundId ||
                currentRoundId
            );

        applyWorldPayload(
            payload
        );

        if (
            payload.roundStartAt
        ) {
            roundStartAt =
                safeNumber(
                    payload.roundStartAt,
                    roundStartAt
                );
        }
    }


    /* =========================================================
       Crash
    ========================================================= */

    function crashRocket(
        rocketId
    ) {
        if (
            rocketId === "A"
        ) {
            rocketCrashedA =
                true;
        } else {
            rocketCrashedB =
                true;
        }

        Array.from(
            playerMap.values()
        )
        .forEach(
            p => {
                if (
                    p.status ===
                    "flying" &&
                    p.rocket ===
                    rocketId
                ) {
                    p.status =
                        "crashed";
                    p.reward = 0;
                    p.cashoutAt = 0;

                    sendEvent(
                        "PLAYER_CRASHED",
                        {
                            gameId: GAME_ID,
                            roundId:
                                currentRoundId,
                            playerId:
                                p.id,
                            rocket:
                                rocketId
                        }
                    );

                    if (
                        p.id ===
                        user.id
                    ) {
                        settleLocalLoss(
                            rocketId
                        );
                    }
                }
            }
        );

        sendEvent(
            "ROCKET_CRASHED",
            {
                gameId: GAME_ID,
                roundId:
                    currentRoundId,
                rocket:
                    rocketId,
                crashPoint:
                    rocketId === "A"
                        ? crashPointA
                        : crashPointB
            }
        );

        soundCrash();

        addEvent(
            rocketId === "A"
                ? `💥 穩定號在 ${crashPointA.toFixed(2)}x 爆炸`
                : `💥 狂暴號在 ${crashPointB.toFixed(2)}x 爆炸`
        );

        renderPlayers();

        if (
            rocketId ===
            "A"
        ) {
            rocketStateA.textContent =
                "💥 爆炸";
        } else {
            rocketStateB.textContent =
                "💥 爆炸";
        }
    }


    function onRocketCrashed(
        senderId,
        payload
    ) {
        if (
            hostId &&
            senderId !== hostId
        ) {
            return;
        }

        const rocket =
            payload.rocket === "B"
                ? "B"
                : "A";

        if (rocket === "A") {
            rocketCrashedA = true;
        } else {
            rocketCrashedB = true;
        }

        if (payload.crashPoint) {
            if (rocket === "A") {
                crashPointA =
                    Number(
                        payload.crashPoint
                    );
            } else {
                crashPointB =
                    Number(
                        payload.crashPoint
                    );
            }
        }

        soundCrash();

        addEvent(
            rocket === "A"
                ? `💥 穩定號爆炸`
                : `💥 狂暴號爆炸`
        );
    }


    function onPlayerCrashed(
        senderId,
        payload
    ) {
        const playerId =
            String(
                payload.playerId ||
                senderId
            );

        const p =
            playerMap.get(
                playerId
            );

        if (!p) {
            return;
        }

        p.status =
            "crashed";

        p.reward = 0;

        addEvent(
            `💥 ${p.username} 爆炸出局`
        );

        renderPlayers();
    }


    /* =========================================================
       Cashout
    ========================================================= */

    function cashoutLocal() {
        const me =
            playerMap.get(
                user.id
            );

        if (
            !me ||
            me.status !==
            "flying" ||
            state !== "FLYING"
        ) {
            return;
        }

        initAudio();

        if (isHost()) {
            processCashoutOnHost(
                user.id
            );
        } else {
            sendEvent(
                "PLAYER_CASHOUT",
                {
                    gameId: GAME_ID,
                    roundId:
                        currentRoundId,
                    playerId:
                        user.id,
                    clientTime:
                        Date.now()
                }
            );
        }
    }


    function onPlayerCashout(
        senderId,
        payload
    ) {
        if (!isHost()) {
            return;
        }

        if (
            String(
                payload.roundId
            ) !==
            currentRoundId
        ) {
            return;
        }

        const id =
            String(
                payload.playerId ||
                senderId
            );

        processCashoutOnHost(
            id
        );
    }


    function processCashoutOnHost(
        playerId
    ) {
        if (
            state !==
            "FLYING"
        ) {
            return;
        }

        const p =
            playerMap.get(
                playerId
            );

        if (
            !p ||
            p.status !==
            "flying"
        ) {
            return;
        }

        const rocketCrashed =
            p.rocket === "A"
                ? rocketCrashedA
                : rocketCrashedB;

        if (rocketCrashed) {
            return;
        }

        const currentMult =
            getPlayerMultiplier(
                p
            );

        const payoutMultiplier =
            clamp(
                currentMult,
                1.01,
                MAX_PAYOUT_MULTIPLIER
            );

        const reward =
            Math.floor(
                p.bet *
                payoutMultiplier
            );

        p.status =
            "cashed";

        p.cashoutAt =
            payoutMultiplier;

        p.reward =
            reward;

        sendEvent(
            "CASHOUT_CONFIRMED",
            {
                gameId: GAME_ID,
                roundId:
                    currentRoundId,
                playerId:
                    p.id,
                username:
                    p.username,
                rocket:
                    p.rocket,
                bet:
                    p.bet,
                multiplier:
                    payoutMultiplier,
                reward
            }
        );

        if (
            p.id ===
            user.id
        ) {
            applyOwnCashout(
                payoutMultiplier,
                reward
            );
        }

        addEvent(
            `✅ ${p.username} 在 ${payoutMultiplier.toFixed(2)}x 逃脫 +${reward} 🪙`
        );

        renderPlayers();
    }


    function onCashoutConfirmed(
        senderId,
        payload
    ) {
        const playerId =
            String(
                payload.playerId ||
                senderId
            );

        const p =
            playerMap.get(
                playerId
            );

        if (!p) {
            return;
        }

        p.status =
            "cashed";

        p.cashoutAt =
            safeNumber(
                payload.multiplier,
                1
            );

        p.reward =
            safeNumber(
                payload.reward,
                0
            );

        if (
            playerId ===
            user.id
        ) {
            applyOwnCashout(
                p.cashoutAt,
                p.reward
            );
        }

        addEvent(
            `💰 ${p.username} 逃脫 ${p.cashoutAt.toFixed(2)}x`
        );

        renderPlayers();
    }


    function applyOwnCashout(
        multiplier,
        reward
    ) {
        const me =
            playerMap.get(
                user.id
            );

        if (!me) {
            return;
        }

        me.status =
            "cashed";

        me.reward =
            reward;

        me.cashoutAt =
            multiplier;

        roundRewardSent =
            true;

        actionButton.disabled =
            true;

        actionButton.classList.remove(
            "eject"
        );

        actionButton.textContent =
            "✅ 已逃脫";

        mainMultiplier.className =
            "win";

        mainMultiplier.textContent =
            `${multiplier.toFixed(2)}x`;

        resultTitle.textContent =
            "🚀 極限逃脫成功";

        resultMain.textContent =
            `+${reward.toLocaleString()} 🪙`;

        resultSub.textContent =
            `${rocketName(me.rocket)} · ${multiplier.toFixed(2)}x`;

        soundCashout();

        if (
            multiplier >= 5
        ) {
            soundWin();
        }

        if (
            sdkAvailable &&
            typeof sdk.gameOver ===
            "function"
        ) {
            try {
                sdk.gameOver(
                    Math.max(
                        0,
                        Math.floor(
                            reward
                        )
                    )
                );
            } catch (e) {}
        }

        showToast(
            `成功逃脫 ${multiplier.toFixed(2)}x`
        );
    }


    function settleLocalLoss(
        rocketId
    ) {
        const me =
            playerMap.get(
                user.id
            );

        if (
            !me ||
            me.reward > 0
        ) {
            return;
        }

        if (
            me.status !==
            "crashed"
        ) {
            me.status =
                "crashed";
        }

        if (
            !roundRewardSent &&
            sdkAvailable &&
            typeof sdk.gameOver ===
            "function"
        ) {
            roundRewardSent =
                true;

            try {
                sdk.gameOver(0);
            } catch (e) {}
        }

        if (rocketId === selectedRocket) {
            actionButton.classList.remove(
                "eject"
            );

            actionButton.textContent =
                "💥 火箭爆炸";

            mainMultiplier.className =
                "crash";
        }
    }


    /* =========================================================
       Finish Round
    ========================================================= */

    function finishRound() {
        if (
            !isHost() ||
            state === "RESULT"
        ) {
            return;
        }

        state =
            "RESULT";

        const results =
            Array.from(
                playerMap.values()
            )
            .filter(
                p =>
                    p.ready
            )
            .map(
                p => ({
                    id: p.id,
                    username: p.username,
                    avatar: p.avatar,
                    bet: p.bet,
                    rocket: p.rocket,
                    status: p.status,
                    reward:
                        Math.max(
                            0,
                            Math.floor(
                                safeNumber(
                                    p.reward,
                                    0
                                )
                            )
                        ),
                    cashoutAt:
                        safeNumber(
                            p.cashoutAt,
                            0
                        )
                })
            );

        results.sort(
            (a, b) => {
                const netA =
                    a.reward -
                    a.bet;
                const netB =
                    b.reward -
                    b.bet;

                if (
                    netA !==
                    netB
                ) {
                    return netB - netA;
                }

                return (
                    b.cashoutAt -
                    a.cashoutAt
                );
            }
        );

        roundResultData = {
            roundId:
                currentRoundId,
            results,
            crashPointA,
            crashPointB
        };

        sendEvent(
            "ROUND_RESULT",
            {
                gameId: GAME_ID,
                roundId:
                    currentRoundId,
                crashPointA,
                crashPointB,
                results
            }
        );

        applyRoundResult(
            roundResultData
        );
    }


    function onRoundResult(
        senderId,
        payload
    ) {
        if (
            hostId &&
            senderId !== hostId
        ) {
            return;
        }

        if (
            String(
                payload.roundId || ""
            ) !==
            currentRoundId
        ) {
            return;
        }

        roundResultData = {
            roundId:
                currentRoundId,
            results:
                Array.isArray(
                    payload.results
                )
                    ? payload.results
                    : [],
            crashPointA:
                safeNumber(
                    payload.crashPointA,
                    crashPointA
                ),
            crashPointB:
                safeNumber(
                    payload.crashPointB,
                    crashPointB
                )
        };

        state =
            "RESULT";

        applyRoundResult(
            roundResultData
        );
    }


    function applyRoundResult(
        data
    ) {
        state =
            "RESULT";

        const results =
            Array.isArray(
                data.results
            )
                ? data.results
                : [];

        const meResult =
            results.find(
                r =>
                    String(r.id) ===
                    user.id
            );

        if (
            meResult &&
            !roundRewardSent &&
            (
                meResult.status ===
                "crashed"
            )
        ) {
            roundRewardSent =
                true;

            if (
                sdkAvailable &&
                typeof sdk.gameOver ===
                "function"
            ) {
                try {
                    sdk.gameOver(0);
                } catch (e) {}
            }
        }

        if (
            meResult &&
            meResult.reward > 0
        ) {
            resultTitle.textContent =
                "🚀 本局結算";

            resultMain.textContent =
                `+${Number(
                    meResult.reward
                ).toLocaleString()} 🪙`;

            resultSub.textContent =
                `${rocketName(meResult.rocket)} · ` +
                `${
                    Number(
                        meResult.cashoutAt || 0
                    ).toFixed(2)
                }x`;
        } else {
            resultTitle.textContent =
                "💥 本局結算";

            resultMain.textContent =
                "0 🪙";

            resultSub.textContent =
                "這局沒有成功逃脫";
        }

        leaderboard.innerHTML =
            "";

        results
            .slice(0, 5)
            .forEach(
                (r, index) => {

                    const row =
                        document.createElement(
                            "div"
                        );

                    row.className =
                        "rank";

                    const net =
                        Number(
                            r.reward || 0
                        ) -
                        Number(
                            r.bet || 0
                        );

                    const medal =
                        index === 0
                            ? "🥇"
                            : index === 1
                                ? "🥈"
                                : index === 2
                                    ? "🥉"
                                    : `${index + 1}`;

                    row.innerHTML = `
                        <div>${medal}</div>
                        <div class="rank-name">
                            ${escapeHtml(
                                r.username ||
                                "玩家"
                            )}
                        </div>
                        <div class="rank-value">
                            ${net >= 0 ? "+" : ""}
                            ${net.toLocaleString()}
                        </div>
                    `;

                    leaderboard.appendChild(
                        row
                    );
                }
            );

        resultOverlay.classList.add(
            "show"
        );

        actionButton.disabled =
            true;

        actionButton.classList.remove(
            "eject"
        );

        actionButton.textContent =
            "本局結束";

        if (
            meResult &&
            meResult.reward > 0
        ) {
            soundWin();
        }

        setTimeout(
            () => {
                if (
                    state ===
                    "RESULT"
                ) {
                    prepareNextRound();
                }
            },
            ROUND_RESULT_MS
        );
    }

    /* =========================================================
       Tilt / Device Orientation
    ========================================================= */

    let tiltEnabled = false;
    let tiltSupported = false;
    let tiltCenter = 0;
    let filteredTilt = 0;
    let localX = 0;
    let inputSeq = 0;

    function normalizeTilt(
        gamma
    ) {
        let delta =
            gamma -
            tiltCenter;

        delta =
            clamp(
                delta / 25,
                -1,
                1
            );

        filteredTilt =
            filteredTilt * .82 +
            delta * .18;

        return clamp(
            filteredTilt,
            -1,
            1
        );
    }


    function handleOrientation(
        event
    ) {
        if (!tiltEnabled) {
            return;
        }

        if (
            typeof event.gamma !==
            "number"
        ) {
            return;
        }

        localX =
            normalizeTilt(
                event.gamma
            );

        sendLocalInputIfNeeded();
    }


    async function enableTilt() {
        initAudio();

        try {
            if (
                typeof DeviceOrientationEvent !==
                "undefined" &&
                typeof DeviceOrientationEvent.requestPermission ===
                "function"
            ) {
                const result =
                    await DeviceOrientationEvent
                        .requestPermission();

                if (
                    result !==
                    "granted"
                ) {
                    showToast(
                        "沒有取得體感權限"
                    );
                    return;
                }
            }

            tiltCenter =
                0;

            filteredTilt =
                0;

            window.addEventListener(
                "deviceorientation",
                handleOrientation,
                true
            );

            tiltEnabled = true;
            tiltSupported = true;

            gestureButton.classList.add(
                "enabled"
            );

            gestureButton.textContent =
                "✅ 體感控制已啟用";

            controlHint.textContent =
                "左右傾斜手機控制你的火箭";

            showToast(
                "📱 體感控制啟用"
            );

        } catch (e) {
            showToast(
                "裝置不支援體感控制"
            );
        }
    }

    gestureButton.addEventListener(
        "click",
        enableTilt
    );


    /* =========================================================
       Touch / Drag fallback
    ========================================================= */

    let dragging =
        false;

    function updateTouchX(
        clientX
    ) {
        localX =
            clamp(
                (
                    clientX -
                    width / 2
                ) /
                (
                    width / 2
                ),
                -1,
                1
            );

        filteredTilt =
            localX;

        sendLocalInputIfNeeded(
            true
        );
    }

    canvas.addEventListener(
        "pointerdown",
        event => {
            dragging = true;
            updateTouchX(
                event.clientX
            );
        }
    );

    canvas.addEventListener(
        "pointermove",
        event => {
            if (!dragging) {
                return;
            }

            updateTouchX(
                event.clientX
            );
        }
    );

    window.addEventListener(
        "pointerup",
        () => {
            dragging = false;
        }
    );


    /* =========================================================
       Input Broadcast
    ========================================================= */

    function sendLocalInputIfNeeded(
        immediate = false
    ) {
        if (
            state !==
            "FLYING"
        ) {
            return;
        }

        const now =
            Date.now();

        if (
            !immediate &&
            now -
            lastInputSent <
            INPUT_INTERVAL_MS
        ) {
            return;
        }

        lastInputSent =
            now;

        inputSeq += 1;

        const me =
            playerMap.get(
                user.id
            );

        if (!me) {
            return;
        }

        me.x =
            clamp(
                localX,
                -1,
                1
            );

        if (isHost()) {
            me.lastInputSeq =
                inputSeq;
        }

        sendEvent(
            "PLAYER_INPUT",
            {
                gameId: GAME_ID,
                roundId:
                    currentRoundId,
                seq:
                    inputSeq,
                x:
                    localX
            }
        );
    }

    function playerStatusText(
