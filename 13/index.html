<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover
    "
>

<meta name="theme-color" content="#02040a">

<title>霓虹逃脫：雙軌火箭</title>

<style>

:root{
    --bg:#02040a;

    --cyan:#20e6ff;
    --cyan2:#087cff;

    --pink:#ff39d2;
    --pink2:#8232ff;

    --gold:#ffd85a;
    --green:#27ffb2;

    --danger:#ff4058;

    --white:#f7faff;
    --muted:#7d879f;

    --glass:rgba(4,8,19,.70);
    --glass2:rgba(4,8,19,.86);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;

    background:#02040a;
    color:#fff;

    font-family:
        Arial,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

    user-select:none;
    touch-action:none;
}

body{
    position:fixed;
    inset:0;
}

button{
    border:0;
    outline:none;
    font:inherit;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
}

#gameCanvas{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    z-index:1;

    display:block;
}


/* =========================================================
   LOBBY
========================================================= */

#lobby{
    position:fixed;
    inset:0;
    z-index:50;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:
        max(10px,env(safe-area-inset-top))
        12px
        calc(84px + env(safe-area-inset-bottom));

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 9%,
            rgba(42,63,155,.36),
            rgba(2,5,14,.97) 69%
        );

    transition:
        opacity .18s,
        visibility .18s;
}

body.playing #lobby{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.lobby-header{
    width:100%;
    max-width:660px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:9px;

    flex-shrink:0;
}

.logo{
    font-size:17px;
    font-weight:1000;
}

.logo small{
    display:block;
    margin-top:3px;

    color:#66718b;

    font-size:8px;
    font-weight:700;
}

.roomCount{
    padding:7px 10px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,.09);

    background:rgba(255,255,255,.045);

    color:#aeb7cc;

    font-size:9px;
    font-weight:900;

    backdrop-filter:blur(10px);
}


/* =========================================================
   ROCKET SELECT
========================================================= */

#rocketChoices{
    width:100%;
    max-width:660px;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:8px;

    flex-shrink:0;
}

.rocket-card{
    --accent:#fff;
    --accent2:#fff;

    position:relative;

    min-height:195px;

    padding:13px;

    overflow:hidden;

    border-radius:21px;

    border:1px solid rgba(255,255,255,.09);

    background:
        linear-gradient(
            155deg,
            rgba(15,22,49,.98),
            rgba(5,8,21,.97)
        );

    color:#fff;

    text-align:left;

    transition:
        transform .13s,
        border-color .13s,
        box-shadow .13s;
}

.rocket-card.a{
    --accent:var(--cyan);
    --accent2:var(--cyan2);
}

.rocket-card.b{
    --accent:var(--pink);
    --accent2:var(--pink2);
}

.rocket-card.selected{
    transform:translateY(-2px);

    border-color:
        color-mix(
            in srgb,
            var(--accent) 72%,
            transparent
        );

    box-shadow:
        0 0 35px
        color-mix(
            in srgb,
            var(--accent) 12%,
            transparent
        ),
        inset 0 0 28px
        color-mix(
            in srgb,
            var(--accent) 5%,
            transparent
        );
}

.rocket-card:active{
    transform:scale(.99);
}

.rocket-badge{
    position:absolute;
    top:9px;
    right:9px;

    padding:4px 8px;

    border-radius:999px;

    background:rgba(255,255,255,.05);

    color:#78829b;

    font-size:8px;
    font-weight:1000;
}

.rocket-card.selected .rocket-badge{
    color:var(--accent);

    background:
        color-mix(
            in srgb,
            var(--accent) 12%,
            transparent
        );
}

.rocket-title{
    position:relative;
    z-index:4;

    font-size:16px;
    font-weight:1000;
}

.rocket-sub{
    position:relative;
    z-index:4;

    margin-top:3px;

    width:72%;

    color:#7e89a3;

    font-size:8px;
    font-weight:700;

    line-height:1.4;
}

.rocket-stats{
    position:relative;
    z-index:4;

    margin-top:9px;

    width:66%;

    display:grid;
    gap:5px;
}

.rocket-stat{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:6px 7px;

    border-radius:8px;

    background:rgba(255,255,255,.035);

    color:#7e899f;

    font-size:8px;
}

.rocket-stat strong{
    color:#e9edf7;
}

.mini-rocket{
    position:absolute;

    right:16px;
    bottom:-4px;

    width:82px;
    height:124px;

    transform:rotate(-8deg);
}

.rocket-card.b .mini-rocket{
    transform:
        rotate(8deg)
        scale(1.06);
}

.mini-body{
    position:absolute;

    left:50%;
    top:5px;

    transform:translateX(-50%);

    width:39px;
    height:74px;

    border-radius:
        55%
        55%
        28%
        28%;

    background:
        linear-gradient(
            95deg,
            #8490a7,
            #fff 45%,
            #d6dfeb
        );

    box-shadow:
        0 0 26px var(--accent);
}

.mini-window{
    position:absolute;

    left:50%;
    top:25px;

    transform:translateX(-50%);

    width:12px;
    height:12px;

    border-radius:50%;

    border:2px solid #fff;

    background:var(--accent);
}

.mini-fin-left,
.mini-fin-right{
    position:absolute;

    top:47px;

    width:30px;
    height:28px;

    background:#909bad;
}

.mini-fin-left{
    left:0;

    clip-path:
        polygon(
            100% 0,
            100% 100%,
            0 100%
        );
}

.mini-fin-right{
    right:0;

    clip-path:
        polygon(
            0 0,
            100% 100%,
            0 100%
        );
}

.mini-flame{
    position:absolute;

    left:50%;
    bottom:-2px;

    transform:translateX(-50%);

    width:24px;
    height:42px;

    background:
        linear-gradient(
            to bottom,
            #fff,
            #ffd94f 25%,
            #ff742c 62%,
            transparent
        );

    clip-path:
        polygon(
            50% 100%,
            0 0,
            100% 0
        );

    animation:
        flame .12s infinite alternate;
}

@keyframes flame{
    from{
        height:29px;
    }

    to{
        height:44px;
    }
}


/* =========================================================
   CONTROL
========================================================= */

#controlArea{
    width:100%;
    max-width:660px;

    margin-top:8px;

    flex-shrink:0;
}

.control-title{
    margin-bottom:5px;

    color:#727d97;

    font-size:8px;
    font-weight:900;
}

#controlChoices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

.control-button{
    height:40px;

    border-radius:11px;

    border:1px solid rgba(255,255,255,.09);

    background:rgba(255,255,255,.035);

    color:#aeb8cd;

    font-size:10px;
    font-weight:1000;
}

.control-button.selected{
    color:#fff;

    border-color:
        rgba(34,229,255,.6);

    background:
        linear-gradient(
            135deg,
            rgba(34,229,255,.15),
            rgba(0,130,255,.04)
        );

    box-shadow:
        0 0 18px rgba(34,229,255,.1);
}

#controlStatus{
    min-height:12px;

    margin-top:4px;

    text-align:center;

    color:#606b83;

    font-size:8px;
}


/* =========================================================
   BET
========================================================= */

#betArea{
    width:100%;
    max-width:660px;

    margin-top:8px;

    flex-shrink:0;
}

.bet-title{
    margin-bottom:5px;

    color:#727d97;

    font-size:8px;
    font-weight:900;
}

#betButtons{
    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:5px;
}

.bet-button{
    height:34px;

    border-radius:9px;

    border:1px solid rgba(255,255,255,.08);

    background:rgba(255,255,255,.035);

    color:#aeb7cc;

    font-size:9px;
    font-weight:1000;
}

.bet-button.active{
    color:#fff;

    border-color:rgba(168,90,255,.75);

    background:
        linear-gradient(
            135deg,
            #642ce0,
            #9b25d4
        );
}

#lobbyTip{
    width:100%;
    max-width:660px;

    margin-top:6px;

    text-align:center;

    color:#58627b;

    font-size:8px;
    line-height:1.4;
}

#joinButton{
    position:absolute;

    left:12px;
    right:12px;

    bottom:
        max(9px,env(safe-area-inset-bottom));

    width:
        calc(100% - 24px);

    max-width:660px;

    height:60px;

    border-radius:31px;

    color:#fff;

    font-size:18px;

    font-weight:1000;

    background:
        linear-gradient(
            90deg,
            #6428ed,
            #a227d5
        );

    box-shadow:
        0 14px 38px rgba(0,0,0,.5),
        inset 0 1px rgba(255,255,255,.22);
}

#joinButton:disabled{
    opacity:.45;
}


/* =========================================================
   GAME UI
========================================================= */

#playUI{
    position:fixed;
    inset:0;

    z-index:20;

    opacity:0;
    visibility:hidden;

    pointer-events:none;
}

body.playing #playUI{
    opacity:1;
    visibility:visible;
}


/* =========================================================
   TOP HUD
========================================================= */

#topHud{
    position:absolute;

    top:
        max(6px,env(safe-area-inset-top));

    left:8px;
    right:8px;

    z-index:30;

    height:128px;

    pointer-events:none;
}

#topHud::after{
    content:"";

    position:absolute;

    left:-8px;
    right:-8px;
    top:-8px;

    height:150px;

    z-index:-1;

    background:
        linear-gradient(
            to bottom,
            rgba(1,4,12,.82),
            rgba(1,4,12,.43) 53%,
            transparent
        );

    backdrop-filter:blur(5px);

    mask-image:
        linear-gradient(
            to bottom,
            #000 0%,
            #000 52%,
            transparent 100%
        );
}


/* =========================================================
   TOP LEFT
========================================================= */

#topLeft{
    position:absolute;

    left:0;
    top:0;

    display:flex;
    flex-direction:column;

    align-items:flex-start;

    gap:5px;
}

#healthPanel{
    display:flex;
    align-items:center;

    gap:7px;

    padding:
        7px
        9px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,.08);

    background:var(--glass);

    backdrop-filter:blur(11px);

    box-shadow:
        0 8px 22px rgba(0,0,0,.22);
}

.health-label{
    color:#78839c;

    font-size:7px;
    font-weight:1000;

    letter-spacing:.7px;
}

#healthBar{
    display:flex;
    gap:4px;
}

.heart{
    width:18px;
    height:14px;

    background:
        linear-gradient(
            135deg,
            #ff6079,
            #d8193d
        );

    clip-path:
        polygon(
            50% 100%,
            8% 54%,
            8% 27%,
            21% 7%,
            39% 6%,
            50% 20%,
            61% 6%,
            79% 7%,
            92% 27%,
            92% 54%
        );

    filter:
        drop-shadow(
            0 0 7px
            rgba(255,45,75,.38)
        );
}

.heart.empty{
    background:rgba(255,255,255,.08);
    filter:none;
}

#rocketBadge{
    padding:5px 8px;

    border-radius:9px;

    background:var(--glass);

    border:1px solid rgba(255,255,255,.08);

    font-size:7px;
    font-weight:1000;

    backdrop-filter:blur(10px);
}

#rocketBadge.a{
    color:var(--cyan);
    border-color:rgba(34,229,255,.28);
}

#rocketBadge.b{
    color:var(--pink);
    border-color:rgba(255,56,209,.28);
}


/* =========================================================
   CENTER SCORE
========================================================= */

#scoreZone{
    position:absolute;

    left:50%;
    top:0;

    transform:translateX(-50%);

    width:min(270px,58vw);

    text-align:center;
}

#multiplier{
    font-family:
        Impact,
        "Arial Black",
        sans-serif;

    font-size:
        clamp(44px,13vw,74px);

    line-height:.86;

    letter-spacing:.8px;

    transition:
        color .08s,
        transform .08s;
}

#multiplier.a{
    color:var(--cyan);

    text-shadow:
        0 0 18px rgba(34,229,255,.54),
        0 0 52px rgba(0,124,255,.25);
}

#multiplier.b{
    color:var(--pink);

    text-shadow:
        0 0 18px rgba(255,56,209,.52),
        0 0 52px rgba(127,50,255,.25);
}

#multiplier.warning{
    color:var(--gold);

    text-shadow:
        0 0 20px rgba(255,216,90,.53);
}

#multiplier.danger{
    color:var(--danger);

    text-shadow:
        0 0 25px rgba(255,64,87,.65);
}

#multiplier.win{
    color:var(--green);

    transform:scale(1.08);

    text-shadow:
        0 0 26px rgba(40,255,178,.67);
}

#multiplier.crash{
    color:#ff394f;

    transform:scale(1.1);

    text-shadow:
        0 0 30px rgba(255,30,50,.8);
}

#flightStatus{
    margin-top:5px;

    color:#b4bdd0;

    font-size:8px;
    font-weight:900;
}

#scoreText{
    margin-top:4px;

    color:#7d879e;

    font-size:7px;
    font-weight:900;
}

#scoreText strong{
    color:#e4e9f7;
    font-size:9px;
}


/* =========================================================
   TOP RIGHT
========================================================= */

#topRight{
    position:absolute;

    right:0;
    top:0;

    display:flex;
    flex-direction:column;

    align-items:flex-end;

    gap:4px;
}

#roomPill{
    padding:7px 9px;

    border-radius:11px;

    border:1px solid rgba(255,255,255,.08);

    background:var(--glass);

    color:#c0c8da;

    font-size:8px;
    font-weight:900;

    backdrop-filter:blur(10px);
}

#opponentStrip{
    display:flex;
    justify-content:flex-end;

    gap:4px;

    max-width:48vw;

    overflow:hidden;
}

.opponent{
    min-width:66px;
    max-width:88px;

    padding:5px 6px;

    border-radius:9px;

    border:1px solid rgba(255,255,255,.07);

    background:
        rgba(3,7,17,.67);

    backdrop-filter:blur(8px);

    font-size:6px;
}

.opponent.cashed{
    border-color:
        rgba(40,255,178,.35);
}

.opponent.crashed{
    border-color:
        rgba(255,64,87,.28);

    opacity:.68;
}

.opp-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

    color:#cbd2e4;
    font-weight:1000;
}

.opp-info{
    display:flex;
    justify-content:space-between;
    gap:5px;

    margin-top:2px;

    color:#707b94;
}

.opp-score{
    color:#e4e9f5;
    font-weight:1000;
}

.opp-health{
    color:#ff657e;
}


/* =========================================================
   HIT
========================================================= */

#hitFlash{
    position:absolute;
    inset:0;

    z-index:35;

    pointer-events:none;

    opacity:0;

    background:
        rgba(255,30,56,.16);
}

#hitFlash.active{
    animation:
        hitFlash
        .28s
        1;
}

@keyframes hitFlash{

    0%{
        opacity:0;
    }

    18%{
        opacity:1;
    }

    100%{
        opacity:0;
    }

}


/* =========================================================
   SENSOR FALLBACK
========================================================= */

#sensorFallback{
    position:absolute;

    left:50%;

    top:138px;

    transform:translateX(-50%);

    z-index:31;

    padding:6px 9px;

    border-radius:999px;

    background:
        rgba(4,8,18,.78);

    border:
        1px solid rgba(255,255,255,.09);

    color:#abb5c9;

    font-size:7px;
    font-weight:900;

    white-space:nowrap;

    opacity:0;

    visibility:hidden;

    transition:.15s;
}

#sensorFallback.show{
    opacity:1;
    visibility:visible;
}


/* =========================================================
   MANUAL
========================================================= */

#manualControls{
    position:absolute;

    left:10px;
    right:10px;

    bottom:
        calc(
            90px +
            env(safe-area-inset-bottom)
        );

    z-index:29;

    display:flex;
    justify-content:space-between;

    pointer-events:none;

    opacity:0;

    visibility:hidden;

    transition:.12s;
}

#manualControls.visible{
    opacity:1;
    visibility:visible;
}

.moveButton{
    width:68px;
    height:68px;

    border-radius:50%;

    border:
        1px solid rgba(255,255,255,.14);

    background:
        rgba(4,8,18,.72);

    backdrop-filter:blur(11px);

    box-shadow:
        0 12px 30px rgba(0,0,0,.42);

    color:#fff;

    font-size:29px;
    font-weight:1000;

    pointer-events:auto;

    display:flex;
    align-items:center;
    justify-content:center;
}

.moveButton:active{
    transform:scale(.88);
}

#moveLeft{
    color:var(--cyan);
    border-color:rgba(34,229,255,.45);
}

#moveRight{
    color:var(--pink);
    border-color:rgba(255,56,209,.45);
}


/* =========================================================
   BOTTOM
========================================================= */

#playBottom{
    position:absolute;

    left:10px;
    right:10px;

    bottom:
        max(8px,env(safe-area-inset-bottom));

    z-index:29;

    pointer-events:none;
}

#aliveText{
    width:max-content;

    margin:
        0 auto
        6px;

    padding:5px 10px;

    border-radius:999px;

    background:
        rgba(2,6,15,.68);

    border:
        1px solid rgba(255,255,255,.07);

    color:#929cb3;

    font-size:7px;
    font-weight:900;

    backdrop-filter:blur(10px);
}

#ejectButton{
    width:100%;
    height:60px;

    border-radius:31px;

    pointer-events:auto;

    color:#fff;

    font-size:20px;
    font-weight:1000;

    background:
        linear-gradient(
            90deg,
            #ff3c43,
            #ff9b2c
        );

    box-shadow:
        0 15px 38px rgba(0,0,0,.5),
        0 0 27px rgba(255,89,43,.18);

    animation:
        ejectPulse
        .55s
        infinite
        alternate;
}

#ejectButton:disabled{
    opacity:.43;
    animation:none;
}

@keyframes ejectPulse{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.012);
    }

}


/* =========================================================
   RESULT
========================================================= */

#resultOverlay{
    position:fixed;
    inset:0;

    z-index:80;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:18px;

    background:
        rgba(0,0,0,.56);

    backdrop-filter:blur(10px);

    opacity:0;
    visibility:hidden;
    pointer-events:none;

    transition:.18s;
}

#resultOverlay.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}

.result-card{
    width:min(430px,100%);

    padding:20px;

    border-radius:22px;

    border:
        1px solid rgba(255,255,255,.12);

    background:
        linear-gradient(
            160deg,
            rgba(11,16,38,.99),
            rgba(4,7,17,.99)
        );

    box-shadow:
        0 35px 100px rgba(0,0,0,.75);

    text-align:center;
}

.result-title{
    color:#8791aa;

    font-size:10px;
    font-weight:800;
}

.result-main{
    margin-top:6px;

    font-size:34px;
    font-weight:1000;
}

.result-sub{
    margin-top:5px;

    color:#7e88a1;

    font-size:10px;
}

#leaderboard{
    margin-top:14px;

    display:grid;
    gap:5px;
}

.rank{
    display:grid;

    grid-template-columns:
        25px
        1fr
        auto;

    gap:7px;

    align-items:center;

    padding:8px 9px;

    border-radius:10px;

    background:rgba(255,255,255,.035);

    text-align:left;

    font-size:10px;
}

.rank-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

    font-weight:900;
}

.rank-value{
    color:var(--green);
    font-weight:1000;
}

#nextRound{
    width:100%;
    height:44px;

    margin-top:12px;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #6428e4,
            #8e27ca
        );

    color:#fff;

    font-weight:1000;
}

    }
);

    id,
    username,
    avatar,
    joinedAt
){

    return {

        id:
            String(id),

        username:
            String(
                username ||
                "玩家"

}


/* =========================================================
   HOST
========================================================= */

function isHost(){

    return (
        hostId ===
        user.id
    );

}


function electHost(){

    const list =
        Array.from(
            hostCandidates.values()
        )
        .sort(
            (a,b) => {

                if(
                    a.joinedAt !==
                    b.joinedAt
                ){

                    return (
                        a.joinedAt -
                        b.joinedAt
                    );

                }

                return (
                    a.id.localeCompare(
                        b.id
                    )
                );

            }
        );

    if(
        list.length
    ){

        hostId =
            list[0].id;

    }

}


/* =========================================================
   NETWORK
========================================================= */

function sendEvent(
    eventName,
    payload={}
){

    if(
        !SDK_READY
    ){

        return;

    }

    try{

        SDK.sendGameEvent(
            eventName,
            payload
        );

    }catch(e){}

}


window.addEventListener(
    "message",
    event => {

        let data;

        try{

            data =
                typeof event.data ===
                "string"

                    ? JSON.parse(
                        event.data
                    )

                    : event.data;

        }catch(e){

            return;

        }

        if(
            !data ||
            data.action !==
            "gameEventReceived"
        ){

            return;

        }

        const senderId =
            String(
                data.userId ||
                ""
            );

        if(
            !senderId ||
            senderId ===
            user.id
        ){

            return;

        }

        handleEvent(
            senderId,
            data.eventName,
            data.payload || {}
        );

    }
);


/* =========================================================
   EVENT ROUTER
========================================================= */

function handleEvent(
    senderId,
    eventName,
    payload
){

    switch(
        eventName
    ){

        case "PLAYER_HELLO":
            onPlayerHello(
                senderId,
                payload
            );
            break;

        case "HOST_ANNOUNCE":
            onHostAnnounce(
                senderId,
                payload
            );
            break;

        case "PLAYER_READY":
            onPlayerReady(
                senderId,
                payload
            );
            break;

        case "LOBBY_STATE":
            onLobbyState(
                senderId,
                payload
            );
            break;

        case "ROUND_START":
            onRoundStart(
                senderId,
                payload
            );
            break;

        case "PLAYER_INPUT":
            onPlayerInput(
                senderId,
                payload
            );
            break;

        case "WORLD_STATE":
            onWorldState(
                senderId,
                payload
            );
            break;

        case "PLAYER_DAMAGED":
            onPlayerDamaged(
                senderId,
                payload
            );
            break;

        case "PLAYER_CRASHED":
            onPlayerCrashed(
                senderId,
                payload
            );
            break;

        case "PLAYER_CASHOUT":
            onPlayerCashout(
                senderId,
                payload
            );
            break;

        case "CASHOUT_CONFIRMED":
            onCashoutConfirmed(
                senderId,
                payload
            );
            break;

        case "CASHOUT_DENIED":
            onCashoutDenied(
                senderId,
                payload
            );
            break;

        case "ROCKET_CRASHED":
            onRocketCrashed(
                senderId,
                payload
            );
            break;

        case "ROUND_RESULT":
            onRoundResult(
                senderId,
                payload
            );
            break;

    }

}

========================================================= */

        "PLAYER_HELLO",

            gameId:

                id:
                    user.id,

                username:
                    user.username,

                avatar:
                    user.avatar

            },

            joinedAt:
                joinTime

        }
    );

}


function onPlayerHello(
    senderId,
    payload
){

    const incoming =
        payload.user || {};

    const id =
        String(
            incoming.id ||
            senderId
        );

    if(
        id ===
        user.id
    ){

        return;

    }

    const joinedAt =
        Number(
            payload.joinedAt ||
            Date.now()
        );

    hostCandidates.set(
        id,
        {
            id:id,
            joinedAt:joinedAt
        }
    );

    let player =
        players.get(
            id
        );

    if(
        !player
    ){

        player =
            createPlayer(
                id,
                incoming.username ||
                    "玩家",
                incoming.avatar ||
                    "",
                joinedAt
            );

        players.set(
            id,
            player
        );

    }

    player.lastSeen =
        Date.now();

    player.username =
        String(
            incoming.username ||
            player.username
        );

    player.avatar =
        String(
            incoming.avatar ||
            player.avatar
        );

    electHost();

    if(
        isHost()
    ){

        sendHostAnnounce();

        if(
            state ===
            "LOBBY"
        ){

            sendLobbyState();

        }

    }

    updateRoomCount();

}

========================================================= */

controlButtons.addEventListener(
    "click",
    () => {

        if(
            localReady
        ){

            return;

        }

        stopSensors();

        controlMode =
            "buttons";

        updateControlChoice();

        initAudio();

    }
);


controlTilt.addEventListener(
    "click",
    async () => {

        if(
            localReady
        ){

            return;

        }

        initAudio();

        const ok =
            await prepareSensors();

        if(
            ok
        ){

            controlMode =
                "tilt";

        }
        else{

            controlMode =
                "buttons";

            showToast(
                "此裝置目前無法使用體感"
            );

        }

        updateControlChoice();

    }
);


function updateControlChoice(){

    controlTilt.classList.toggle(
        "selected",
        controlMode ===
        "tilt"
    );

    controlButtons.classList.toggle(
        "selected",
        controlMode ===
        "buttons"
    );

    if(
        controlMode ===
        "tilt"
    ){

        controlStatus.textContent =
            sensorReady

                ? "✅ 體感已準備"

                : "📱 點擊後校準感測器";

    }
    else{

        controlStatus.textContent =
            "◀ ▶ 長按左右控制";

    }

}

/* =========================================================
   PURCHASE
========================================================= */

joinButton.addEventListener(
    "click",
    async () => {

        initAudio();

        if(
            localReady
        ){

            return;

        }

        /*
           這裡直接處理感測器權限，
           確保 requestPermission()
           發生在真正的使用者 click。
        */

            controlMode ===

            !sensorReady

                await prepareSensors();

            if(
                !ok
            ){

                controlMode =
                    "buttons";

                updateControlChoice();

            }

        }

        beginPurchase();

    }
);


function beginPurchase(){

    const itemId =
        `neon_escape_bet_${selectedBet}`;

    joinButton.disabled =
        true;

    joinButton.textContent =
        "驗證銀幣中…";

    if(
        SDK_READY
    ){

        try{

            SDK.requestPurchase(
                itemId,
                selectedBet
            );

        }catch(e){

            joinButton.disabled =
                false;

            joinButton.textContent =
                `支付 ${selectedBet} 銀幣加入`;

        }

    }
    else{

        setTimeout(
            () =>
                handlePurchaseSuccess(
                    itemId
                ),
            120
        );

    }

}


window.onPurchaseSuccess =
function(itemId){

    handlePurchaseSuccess(
        itemId
    );

};


window.onPurchaseFailed =
function(itemId){

    if(
        String(itemId)
        .startsWith(
            "neon_escape_bet_"
        )
    ){

        joinButton.disabled =
            false;

        joinButton.textContent =
            `支付 ${selectedBet} 銀幣加入`;

        showToast(
            "銀幣不足或取消加入"
        );

    }

};


/* =========================================================
   PURCHASE SUCCESS
========================================================= */

function handlePurchaseSuccess(
    itemId
){

    const match =
        /^neon_escape_bet_(\d+)$/
        .exec(
            String(
                itemId
            )
        );

    if(
        !match
    ){

        return;

    }

    selectedBet =
        Number(
            match[1]
        );

    const me =
        players.get(
            user.id
        );

    me.bet =
        selectedBet;

    me.rocket =
        selectedRocket;

    me.ready =
        true;

    me.status =
        "ready";

    me.health =
        MAX_HEALTH;

    me.reward =
        0;

    me.cashoutAt =
        0;

    me.bonus =
        0;

    me.roundId =
        null;

    me.x =
        0;

    me.velocity =
        0;

    localReady =
        true;

    enterGameplay();

    sendEvent(
        "PLAYER_READY",
        {

            gameId:
                GAME_META.id,

            username:
                user.username,

            avatar:
                user.avatar,

            joinedAt:
                joinTime,

            bet:
                selectedBet,

            rocket:
                selectedRocket

        }
    );

    if(
        isHost()
    ){

        maybeStartRound();

    }

}

/* =========================================================
   ROUND PLAYERS
========================================================= */

function getRoundPlayers(){

    if(
        !currentRoundId
    ){

        return [];

    }

    return Array.from(
        players.values()
    )
    .filter(
        player =>
            player.roundId ===
            currentRoundId &&
            player.bet > 0
    );

}


/* =========================================================
   CRASH POINT
========================================================= */

function generateCrashPoint(
    rocket
){

    const profile =
        ROCKETS[
            rocket
        ];

    /*
       10 秒內不能爆。
       再加一點緩衝。
    */

    const minAt10 =
        Math.pow(
            profile.growth,
            MIN_CRASH_MS / 1000
        );

    const minimum =
        minAt10 +
        .08;

    const random =
        Math.random();

    const curve =
        rocket ===
        "A"
            ? 1.7
            : 2.25;

    return Number(
        clamp(
            minimum +
            Math.pow(
                random,
                curve
            ) *
            (
                profile.maxCrash -
                minimum
            ),
            minimum,
            profile.maxCrash
        )
        .toFixed(2)
    );

}


/* =========================================================
   ROUND START
========================================================= */

function maybeStartRound(){

    if(
        !isHost() ||
        state !==
        "LOBBY"
    ){

        return;

    }

    const ready =
        Array.from(
            players.values()
        )
        .filter(
            player =>
                player.ready &&
                player.bet > 0
        );

    if(
        ready.length ===
        0
    ){

        return;

    }

    if(
        Date.now() -
        lastRoundStart <
        1800
    ){

        return;

    }

    lastRoundStart =
        Date.now();

    const roundId =
        "round_" +
        Date.now()
        .toString(36) +
        "_" +
        Math.random()
        .toString(36)
        .slice(2,7);

    const startAt =
        Date.now() +
        START_DELAY;

    currentRoundId =
        roundId;

    roundStartAt =
        startAt;

    crashPointA =
        generateCrashPoint(
            "A"
        );

    crashPointB =
        generateCrashPoint(
            "B"
        );

    crashedA =
        false;

    crashedB =
        false;

    const packet = {

        gameId:
            GAME_META.id,

        roundId:
            roundId,

        hostId:
            user.id,

        startAt:
            startAt,

        crashPointA:
            crashPointA,

        crashPointB:
            crashPointB,

        players:
            ready.map(
                player => ({

                    id:
                        player.id,

                    username:
                        player.username,

                    avatar:
                        player.avatar,

                    bet:
                        player.bet,

                    rocket:
                        player.rocket

                })
            )

    };

    sendEvent(
        "ROUND_START",
        packet
    );

    applyRoundStart(
        packet
    );

}


/* =========================================================
   ROUND START RECEIVE
========================================================= */

function onRoundStart(
    senderId,
    payload
){

    if(
        hostId &&
        String(senderId) !==
        String(hostId)
    ){

        return;

    }

    applyRoundStart(
        payload
    );

}


function applyRoundStart(
    payload
){

    currentRoundId =
        String(
            payload.roundId
        );

    hostId =
        String(
            payload.hostId ||
            hostId
        );

    roundStartAt =
        Number(
            payload.startAt
        );

    crashPointA =
        Number(
            payload.crashPointA
        );

    crashPointB =
        Number(
            payload.crashPointB
        );

    crashedA =
        false;

    crashedB =
        false;

    roundRewardSent =
        false;

    worldItems =
        [];

    nextMeteorAt =
        Date.now() +
        380;

    nextEnergyAt =
        Date.now() +
        900;

    hostWorldAccumulator =
        0;

    const list =
        Array.isArray(
            payload.players
        )
            ? payload.players
            : [];

    list.forEach(
        item => {

            const id =
                String(
                    item.id
                );

            let player =
                players.get(
                    id
                );

            if(
                !player
            ){

                player =
                    createPlayer(
                        id,
                        item.username ||
                            "玩家",
                        item.avatar ||
                            "",
                        Date.now()
                    );

            }

            player.bet =
                Number(
                    item.bet ||
                    0
                );

            player.rocket =
                item.rocket ===
                "B"
                    ? "B"
                    : "A";

            player.ready =
                true;

            player.status =
                "flying";

            player.health =
                MAX_HEALTH;

            player.reward =
                0;

            player.cashoutAt =
                0;

            player.cashoutTime =
                0;

            player.bonus =
                0;

            player.roundId =
                currentRoundId;

            player.x =
                0;

            player.velocity =
                0;

            player.invulnerableUntil =
                0;

            players.set(
                id,
                player
            );

        }
    );

    enterGameplay();

    state =
        "COUNTDOWN";

    aliveText.textContent =
        "⏳ 引擎同步";

    setTimeout(
        () => {

            if(
                currentRoundId !==
                String(
                    payload.roundId
                )
            ){

                return;

            }

            state =
                "FLYING";

            ejectButton.disabled =
                true;

            ejectButton.textContent =
                "🔒 10 秒後解鎖";

            aliveText.textContent =
                "🚀 飛行中";

            soundStart();

        },
        Math.max(
            30,
            Number(
                payload.startAt
            ) -
            Date.now()
        )
    );

}


/* =========================================================
   MULTIPLIER
========================================================= */

function getBaseMultiplier(
    rocket,
    now=Date.now()
){

    if(
        !roundStartAt
    ){

        return 1;

    }

    const elapsed =
        Math.max(
            0,
            now -
            roundStartAt
        ) /
        1000;

    return Math.pow(
        ROCKETS[
            rocket
        ].growth,
        elapsed
    );

}


function getPlayerMultiplier(
    player
){

    if(
        !player
    ){

        return 1;

    }

    if(
        player.status ===
        "cashed"
    ){

        return player.cashoutAt;

    }

    if(
        player.status ===
        "crashed"
    ){

        return 0;

    }

    return Math.min(
        MAX_PAYOUT,

        getBaseMultiplier(
            player.rocket
        ) +

        Math.min(
            1.5,
            Math.max(
                0,
                player.bonus
            )
        )
    );

}


/* =========================================================
   SCORE
========================================================= */

function getPlayerScore(
    player
){

    if(
        !player ||
        player.bet <= 0
    ){

        return 0;

    }

    if(
        player.status ===
        "cashed"
    ){

        return Math.floor(
            player.reward
        );

    }

    if(
        player.status ===
        "crashed"
    ){

        return 0;

    }

    /*
       10 秒前畫面可以看到
       潛在分數，
       但實際不能 EJECT。
    */

    return Math.floor(
        player.bet *
        getPlayerMultiplier(
            player
        )
    );

}


/* =========================================================
   10 SECOND GATE
========================================================= */

function getRewardElapsed(){

    if(
        !roundStartAt
    ){

        return 0;

    }

    return Math.max(
        0,
        Date.now() -
        roundStartAt
    );

}


function canCashout(){

    return (
        getRewardElapsed() >=
        MIN_REWARD_MS
    );

}


function updateCashoutButton(){

    if(
        state !==
        "FLYING"
    ){

        return;

    }

    const me =
        players.get(
            user.id
        );

    if(
        !me ||
        me.status !==
        "flying"
    ){

        return;

    }

    if(
        canCashout()
    ){

        ejectButton.disabled =
            false;

        ejectButton.textContent =
            "🚀 EJECT 逃脫";

    }
    else{

        ejectButton.disabled =
            true;

        const remain =
            Math.max(
                0,
                MIN_REWARD_MS -
                getRewardElapsed()
            );

        const sec =
            (
                remain / 1000
            ).toFixed(1);

        ejectButton.textContent =
            `🔒 ${sec} 秒後解鎖`;

    }

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    if(
        !body.classList.contains(
            "playing"
        )
    ){

        return;

    }

    const me =
        players.get(
            user.id
        );

    if(
        !me
    ){

        return;

    }

    updateHealthUI(
        me.health
    );

    updateOpponentUI();

    if(
        state ===
        "COUNTDOWN"
    ){

        const remaining =
            Math.max(
                0,
                roundStartAt -
                Date.now()
            );

        const sec =
            Math.ceil(
                remaining /
                1000
            );

        multiplierEl.className =
            selectedRocket;

        multiplierEl.textContent =
            sec > 0
                ? String(
                    sec
                )
                : "GO!";

        flightStatus.textContent =
            "雙軌引擎同步";

        scoreText.innerHTML =
            `目前分數 <strong>${selectedBet}</strong>`;

        return;

    }

    if(
        state !==
        "FLYING"
    ){

        return;

    }

    if(
        me.status ===
        "cashed"
    ){

        multiplierEl.className =
            "win";

        multiplierEl.textContent =
            `${me.cashoutAt.toFixed(2)}x`;

        flightStatus.textContent =
            "✅ 已逃脫 · 獎勵鎖定";

        scoreText.innerHTML =
            `獲得 <strong>${me.reward.toLocaleString()}</strong> 🪙`;

        aliveText.textContent =
            `✅ +${me.reward.toLocaleString()} 銀幣`;

        return;

    }

    if(
        me.status ===
        "crashed"
    ){

        multiplierEl.className =
            "crash";

        flightStatus.textContent =
            "💥 本局結束";

        scoreText.innerHTML =
            "獲得 <strong>0</strong> 🪙";

        aliveText.textContent =
            "💥 已出局";

        return;

    }

    const multiplier =
        getPlayerMultiplier(
            me
        );

    multiplierEl.textContent =
        `${multiplier.toFixed(2)}x`;

    if(
        multiplier >=
        6
    ){

        multiplierEl.className =
            "danger";

        flightStatus.textContent =
            "🔥 極限倍率";

    }
    else if(
        multiplier >=
        3
    ){

        multiplierEl.className =
            "warning";

        flightStatus.textContent =
            "⚡ 高風險區";

    }
    else{

        multiplierEl.className =
            selectedRocket;

        if(
            canCashout()
        ){

            flightStatus.textContent =
                "🚀 飛行中 · 可逃脫";

        }
        else{

            const remain =
                Math.max(
                    0,
                    MIN_REWARD_MS -
                    getRewardElapsed()
                );

            flightStatus.textContent =
                `🛡 保護期 ${(
                    remain / 1000
                ).toFixed(1)}s`;

        }

    }

    scoreText.innerHTML =
        `目前分數 <strong>${getPlayerScore(
            me
        ).toLocaleString()}</strong>`;

    aliveText.textContent =
        canCashout()
            ? "🚀 已解除保護"
            : "🛡 前 10 秒保護期";

    updateCashoutButton();

}

/* =========================================================
   WORLD
========================================================= */

let worldItems =
    [];

let itemId =
    0;

let nextMeteorAt =
    0;

let nextEnergyAt =
    0;

let lastWorldTick =
    performance.now();

let lastNetworkTick =
    performance.now();

let hostWorldAccumulator =
    0;


/* =========================================================
   DIFFICULTY
========================================================= */

function getDifficulty(){

    const me =
        players.get(
            user.id
        );

    const multiplier =
        me

            ? getPlayerMultiplier(
                me
            )

            : 1;

    return clamp(
        (
            multiplier -
            1
        ) / 7,
        0,
        1
    );

}


/* =========================================================
   HOST SIM
========================================================= */

function simulateHost(
    dt,
    now
){

    if(
        !isHost() ||
        state !==
        "FLYING"
    ){

        return;

    }

    const difficulty =
        getDifficulty();

    const meteorInterval =
        575 -
        difficulty *
        245;

    if(
        now >=
        nextMeteorAt
    ){

        if(
            worldItems.length <
            (
                performanceLow
                    ? 7
                    : 11
            )
        ){

            spawnMeteor();

        }

        nextMeteorAt =
            now +
            meteorInterval;

    }

    const energyInterval =
        1150 -
        difficulty *
        240;

    if(
        now >=
        nextEnergyAt
    ){

        if(
            worldItems.length <
            (
                performanceLow
                    ? 8
                    : 13
            )
        ){

            spawnEnergy();

        }

        nextEnergyAt =
            now +
            energyInterval;

    }


    worldItems.forEach(
        item => {

            item.y +=
                item.speed *
                dt;

            item.rotation +=
                item.spin *
                dt;

            item.life -=
                dt;

        }
    );


    processHostCollisions();


    worldItems =
        worldItems.filter(
            item =>
                item.life > 0 &&
                item.y <
                1.08
        );


    if(
        !crashedA
    ){

        const value =
            getBaseMultiplier(
                "A",
                now
            );

        if(
            value >=
            crashPointA
        ){

            crashRocket(
                "A"
            );

        }

    }


    if(
        !crashedB
    ){

        const value =
            getBaseMultiplier(
                "B",
                now
            );

        if(
            value >=
            crashPointB
        ){

            crashRocket(
                "B"
            );

        }

    }


    const alive =
        getRoundPlayers()
        .filter(
            player =>
                player.status ===
                "flying"
        );


    if(
        alive.length ===
        0
    ){

        finishRound();

        return;

    }


    if(
        now -
        roundStartAt >=
        ROUND_MAX_MS
    ){

        alive.forEach(
            player => {

                processCashout(
                    player.id
                );

            }
        );

    }

}

/* =========================================================
   SPAWN
========================================================= */

function spawnMeteor(){

    const rocket =
        Math.random() <
        .5

            ? "A"

            : "B";

    const difficulty =
        getDifficulty();

    worldItems.push({

        id:
            "m" +
            itemId++,

        type:
            "meteor",

        rocket:
            rocket,

        x:
            Math.random() *
            1.42 -
            .71,

        y:
            -.08,

        speed:
            .31 +
            difficulty *
            .20 +
            Math.random() *
            .09,

        size:

/* =========================================================
   COLLISION
========================================================= */

function processHostCollisions(){

    const now =
        Date.now();

    players.forEach(
        player => {

            if(
                player.status !==
                "flying"
            ){

                return;

            }

            if(
                now <
                player.invulnerableUntil
            ){

                return;

            }

            worldItems.forEach(
                item => {

                    if(
                        item.rocket !==
                        player.rocket
                    ){

                        return;

                    }

                    if(
                        item.y <
                        .69 ||
                        item.y >
                        .91
                    ){

                        return;

                    }

                    const distance =
                        Math.abs(
                            player.x -
                            item.x
                        );

                    const profile =
                        ROCKETS[
                            player.rocket
                        ];

                    const hitRange =
                        item.type ===
                        "meteor"

                            ? profile.hitRadius +
                              .07

                            : .12;

                    if(
                        distance >
                        hitRange
                    ){

                        return;

                    }

                    item.life =
                        0;


                    if(
                        item.type ===
                        "meteor"
                    ){

                        player.health =
                            Math.max(
                                0,
                                player.health -
                                1
                            );

                        player.invulnerableUntil =
                            now +
                            HIT_INVULN_MS;

                        player.bonus =
                            Math.max(
                                0,
                                player.bonus -
                                .1
                            );

                        sendEvent(
                            "PLAYER_DAMAGED",
                            {

                                gameId:
                                    GAME_META.id,

                                roundId:
                                    currentRoundId,

                                playerId:
                                    player.id,

                                health:
                                    player.health

                            }
                        );


                        if(
                            player.id ===
                            user.id
                        ){

                            damageVisual();

                            showToast(
                                player.health > 0

                                    ? `☄️ 撞擊！剩餘 ${player.health} 格護甲`

                                    : "💥 護甲歸零！"
                            );

                        }


                        if(
                            player.health <=
                            0
                        ){

                            player.status =
                                "crashed";

                            player.reward =
                                0;

                            player.cashoutAt =
                                0;

                            sendEvent(
                                "PLAYER_CRASHED",
                                {

                                    gameId:
                                        GAME_META.id,

                                    roundId:
                                        currentRoundId,

                                    playerId:
                                        player.id,

                                    reason:
                                        "HULL_DESTROYED"

                                }
                            );


                            if(
                                player.id ===
                                user.id
                            ){

                                settleLoss(
                                    "HULL_DESTROYED"
                                );

                            }

                        }

                    }
                    else{

                        const bonus =
                            player.rocket ===
                            "B"

                                ? .11

                                : .08;

                        player.bonus =
                            Math.min(
                                1.5,
                                player.bonus +
                                bonus
                            );

                        if(
                            player.id ===
                            user.id
                        ){

                            soundEnergy();

                            showToast(
                                `⚡ 能量 +${bonus.toFixed(2)}x`,
                                550
                            );

                        }

                    }

                }
            );

        }
    );

}


/* =========================================================
   LOCAL MOVEMENT
========================================================= */

let inputDirection =
    0;

let inputSeq =
    0;

let lastInputSent =
    0;


function updateLocalMovement(
    dt
){

    if(
        state !==
        "FLYING"
    ){

        return;

    }

    const me =
        players.get(
            user.id
        );

    if(
        !me ||
        me.status !==
        "flying"
    ){

        return;

    }

    const profile =
        ROCKETS[
            selectedRocket
        ];

    const direction =
        clamp(
            inputDirection,
            -1,
            1
        );

    const shaped =
        Math.sign(
            direction
        ) *
        Math.pow(
            Math.abs(
                direction
            ),
            .78
        );

    const target =
        shaped *
        profile.maxSpeed;

    const response =
        Math.abs(
            target
        ) < .01

            ? profile.brake

            : profile.response;

    me.velocity +=
        (
            target -
            me.velocity
        ) *
        Math.min(
            1,
            response *
            dt
        );

    me.x +=
        me.velocity *
        dt;

    me.x =
        clamp(
            me.x,
            -.9,
            .9
        );

    sendPlayerInput(
        me.x
    );

}


/* =========================================================
   SEND INPUT
========================================================= */

function sendPlayerInput(
    x
){

    const now =
        performance.now();

    if(
        now -
        lastInputSent <
        INPUT_TICK_MS
    ){

        return;

    }

    lastInputSent =
        now;

    const me =
        players.get(
            user.id
        );

    if(
        !me ||
        state !==
        "FLYING"
    ){

        return;

    }

    inputSeq++;

    sendEvent(
        "PLAYER_INPUT",
        {

            gameId:
                GAME_META.id,

            roundId:
                currentRoundId,

            seq:
                inputSeq,

            x:
                clamp(
                    x,
                    -.9,
                    .9
                )

        }
    );

}


/* =========================================================
   INPUT RECEIVE
========================================================= */

function onPlayerInput(
    senderId,
    payload
){

    if(
        !isHost() ||
        state !==
        "FLYING"
    ){

        return;

    }

    if(
        String(
            payload.roundId
        ) !==
        String(
            currentRoundId
        )
    ){

        return;

    }

    const player =
        players.get(
            String(senderId)
        );

    if(
        !player
    ){

        return;

    }

    const seq =
        Number(
            payload.seq ||
            0
        );

    if(
        seq <=
        player.lastInputSeq
    ){

        return;

    }

    player.lastInputSeq =
        seq;

    player.x =
        clamp(
            Number(
                payload.x ||
                0
            ),
            -.9,
            .9
        );

    player.lastSeen =
        Date.now();

}


/* =========================================================
   SENSOR SYSTEM
========================================================= */

let sensorReady =
    false;

let sensorRunning =
    false;

let sensorUsingOrientation =
    false;

let sensorUsingMotion =
    false;

let lastOrientationAt =
    0;

let lastMotionAt =
    0;

let orientationGamma =
    null;

let motionX =
    null;

let neutralGamma =
    0;

let neutralMotionX =
    0;

let filteredMotionX =
    0;

let sensorFallbackShown =
    false;

let recalibrationTimer =
    null;


/* =========================================================
   PREPARE SENSOR
========================================================= */

async function prepareSensors(){

    /*
       已經正常運作就不用重來。
    */

    if(
        sensorReady &&
        sensorRunning
    ){

        return true;

    }

    stopSensors();

    /*
       Feature detect。
    */

    const hasOrientation =
        typeof DeviceOrientationEvent !==
        "undefined";

    const hasMotion =
        typeof DeviceMotionEvent !==
        "undefined";

    if(
        !hasOrientation &&
        !hasMotion
    ){

        return false;

    }


    try{

        /*
           某些 iOS / WebKit 環境需要
           orientation 與 motion
           都先取得權限。

           最重要的是：
           這個函數由按鈕 click 直接呼叫。
        */

        if(
            hasOrientation &&
            typeof DeviceOrientationEvent
                .requestPermission ===
            "function"
        ){

            const orientationPermission =
                await DeviceOrientationEvent
                    .requestPermission();

            if(
                orientationPermission !==
                "granted"
            ){

                return false;

            }

        }


        if(
            hasMotion &&
            typeof DeviceMotionEvent
                .requestPermission ===
            "function"
        ){

            const motionPermission =
                await DeviceMotionEvent
                    .requestPermission();

            /*
               Motion 被拒絕不立即算失敗，
               因為 orientation 可能還能工作。
            */

            if(
                motionPermission !==
                "granted" &&
                !hasOrientation
            ){

                return false;

            }

        }

    }catch(e){

        /*
           Permission request 被拒絕。
        */

        return false;

    }


    /*
       Listener。
    */

    window.addEventListener(
        "deviceorientation",
        onOrientation,
        true
    );

    window.addEventListener(
        "deviceorientationabsolute",
        onOrientation,
        true
    );

    window.addEventListener(
        "devicemotion",
        onMotion,
        true
    );

    sensorRunning =
        true;


    /*
       校準。
    */

    const calibrated =
        await calibrateSensors();

    if(
        !calibrated
    ){

        stopSensors();

        return false;

    }

    sensorReady =
        true;

    sensorFallbackShown =
        false;

    sensorFallback.classList.remove(
        "show"
    );

    return true;

}


/* =========================================================
   SENSOR EVENTS
========================================================= */

function onOrientation(
    event
){

    const gamma =
        Number(
            event.gamma
        );

    if(
        !Number.isFinite(
            gamma
        )
    ){

        return;

    }

    orientationGamma =
        gamma;

    lastOrientationAt =
        performance.now();

}


function onMotion(
    event
){

    const a =
        event.accelerationIncludingGravity;

    if(
        !a ||
        !Number.isFinite(
            a.x
        )
    ){

        return;

    }

    /*
       低通濾波。

       把手機手持的小噪音削掉。
    */

    if(
        motionX ===
        null
    ){

        motionX =
            a.x;

    }
    else{

        motionX +=
            (
                a.x -
                motionX
            ) *
            .18;

    }

    filteredMotionX =
        motionX;

    lastMotionAt =
        performance.now();

}


/* =========================================================
   CALIBRATE
========================================================= */

async function calibrateSensors(){

    const gammaSamples =
        [];

    const motionSamples =
        [];

    const start =
        performance.now();


    return await new Promise(
        resolve => {

            const collect =
                () => {

                    if(
                        Number.isFinite(
                            orientationGamma
                        )
                    ){

                        gammaSamples.push(
                            orientationGamma
                        );

                    }

                    if(
                        Number.isFinite(
                            filteredMotionX
                        )
                    ){

                        motionSamples.push(
                            filteredMotionX
                        );

                    }

                    if(
                        performance.now() -
                        start <
                        550
                    ){

                        requestAnimationFrame(
                            collect
                        );

                    }
                    else{

                        /*
                           優先 orientation。
                        */

                        if(
                            gammaSamples.length >=
                            4
                        ){

                            neutralGamma =
                                average(
                                    gammaSamples
                                );

                            sensorUsingOrientation =
                                true;

                            sensorUsingMotion =
                                false;

                            resolve(true);

                            return;

                        }


                        /*
                           orientation 沒資料，
                           改用 motion。
                        */

                        if(
                            motionSamples.length >=
                            4
                        ){

                            neutralMotionX =
                                average(
                                    motionSamples
                                );

                            sensorUsingOrientation =
                                false;

                            sensorUsingMotion =
                                true;

                            resolve(true);

                            return;

                        }

                        resolve(false);

                    }

                };

            collect();

        }
    );

}


/* =========================================================
   SENSOR INPUT
========================================================= */

function updateSensorInput(){

    if(
        controlMode !==
        "tilt" ||
        !sensorReady ||
        !sensorRunning
    ){

        return;

    }

    const now =
        performance.now();


    /*
       orientation 優先。
    */

    if(
        sensorUsingOrientation &&
        now -
        lastOrientationAt <
        500 &&
        Number.isFinite(
            orientationGamma
        )
    ){

        let delta =
            orientationGamma -
            neutralGamma;

        /*
           1.7 度 deadzone。
        */

        if(
            Math.abs(delta) <
            1.7
        ){

            delta =
                0;

        }

        let normalized =
            delta /
            29;

        normalized =
            clamp(
                normalized,
                -1,
                1
            );

        inputDirection =
            Math.sign(
                normalized
            ) *
            Math.pow(
                Math.abs(
                    normalized
                ),
                .76
            );

        return;

    }


    /*
       orientation 中斷，
       使用 motion。
    */

    if(
        now -
        lastMotionAt <
        800 &&
        Number.isFinite(
            filteredMotionX
        )
    ){

        sensorUsingMotion =
            true;

        const delta =
            filteredMotionX -
            neutralMotionX;

        let normalized =
            delta /
            3.0;

        normalized =
            clamp(
                normalized,
                -1,
                1
            );

        inputDirection =
            Math.sign(
                normalized
            ) *
            Math.pow(
                Math.abs(
                    normalized
                ),
                .78
            );

        return;

    }


    /*
       完全失去感測器。
       自動切換到左右按鍵。
    */

    inputDirection =
        0;

    sensorFallbackShown =
        true;

    sensorFallback.classList.add(
        "show"
    );

    manualControls.classList.add(
        "visible"
    );

}


/* =========================================================
   STOP SENSOR
========================================================= */

function stopSensors(){

    window.removeEventListener(
        "deviceorientation",
        onOrientation,
        true
    );

    window.removeEventListener(
        "deviceorientationabsolute",
        onOrientation,
        true
    );

    window.removeEventListener(
        "devicemotion",
        onMotion,
        true
    );

    sensorRunning =
        false;

    sensorReady =
        false;

    sensorUsingOrientation =
        false;

    sensorUsingMotion =
        false;

    orientationGamma =
        null;

    motionX =
        null;

    filteredMotionX =
        0;

    inputDirection =
        0;

}


/* =========================================================
   SENSOR RECALIBRATION
========================================================= */

function scheduleRecalibration(){

    if(
        controlMode !==
        "tilt" ||
        !sensorRunning
    ){

        return;

    }

    clearTimeout(
        recalibrationTimer
    );

    recalibrationTimer =
        setTimeout(
            async () => {

                const ok =
                    await calibrateSensors();

                if(
                    ok
                ){

                    sensorFallback.classList.remove(
                        "show"
                    );

                    sensorFallbackShown =
                        false;

                }

            },
            500
        );

}


window.addEventListener(
    "orientationchange",
    scheduleRecalibration
);

/* =========================================================
   PLAYER INPUT
========================================================= */

function onWorldState(
    senderId,
    payload
){

    if(
        hostId &&
        String(senderId) !==
        String(hostId)
    ){

        return;

    }

    if(
        String(
            payload.roundId
        ) !==
        String(
            currentRoundId
        )
    ){

        return;

    }

    crashedA =
        !!payload.crashedA;

    crashedB =
        !!payload.crashedB;

    crashPointA =
        Number(
            payload.crashPointA ||
            crashPointA
        );

    crashPointB =
        Number(
            payload.crashPointB ||
            crashPointB
        );


    /*
       不直接把畫面中的隕石
       瞬間跳到 snapshot。

       存入 target，
       下一幀慢慢追。
    */

    if(
        Array.isArray(
            payload.items
        )
    ){

        const incoming =
            payload.items;

        const byId =
            new Map(
                worldItems.map(
                    item => [
                        item.id,
                        item
                    ]
                )
            );

        incoming.forEach(
            source => {

                let local =
                    byId.get(
                        source.id
                    );

                if(
                    !local
                ){

                    local = {

                        id:
                            source.id,

                        type:
                            source.type,

                        rocket:
                            source.rocket,

                        x:
                            Number(
                                source.x ||
                                0
                            ),

                        y:
                            Number(
                                source.y ||
                                0
                            ),

                        targetY:
                            Number(
                                source.y ||
                                0
                            ),

                        size:
                            Number(
                                source.size ||
                                25
                            ),

                        speed:
                            Number(
                                source.speed ||
                                .3
                            ),

                        spin:
                            Number(
                                source.spin ||
                                0
                            ),

                        rotation:
                            Number(
                                source.rotation ||
                                0
                            ),

                        life:
                            3

                    };

                    worldItems.push(
                        local
                    );

                }
                else{

                    local.targetY =
                        Number(
                            source.y ||
                            0
                        );

                    local.x =
                        Number(
                            source.x ||
                            local.x
                        );

                    local.speed =
                        Number(
                            source.speed ||
                            local.speed
                        );

                    local.rotation =
                        Number(
                            source.rotation ||
                            local.rotation
                        );

                    local.targetRotation =
                        local.rotation;

                }

            }
        );

        /*
           清掉 Host 已消失的物件。
        */

        const ids =
            new Set(
                incoming.map(
                    item =>
                        item.id
                )
            );

        worldItems =
            worldItems.filter(
                item =>
                    ids.has(
                        item.id
                    )
            );

    }


    if(
        Array.isArray(
            payload.players
        )
    ){

        payload.players.forEach(
            incoming => {

                const id =
                    String(
                        incoming.id
                    );

                let player =
                    players.get(
                        id
                    );

                if(
                    !player
                ){

                    player =
                        createPlayer(
                            id,
                            incoming.username ||
                                "玩家",
                            incoming.avatar ||
                                "",
                            Date.now()
                        );

                }

                player.username =
                    String(
                        incoming.username ||
                        player.username
                    );

                player.avatar =
                    String(
                        incoming.avatar ||
                        player.avatar
                    );

                player.bet =
                    Number(
                        incoming.bet ||
                        0
                    );

                player.rocket =
                    incoming.rocket ===
                    "B"
                        ? "B"
                        : "A";

                player.status =
                    incoming.status ||
                    "flying";

                player.x =
                    clamp(
                        Number(
                            incoming.x ||
                            0
                        ),
                        -.9,
                        .9
                    );

                player.bonus =
                    clamp(
                        Number(
                            incoming.bonus ||
                            0
                        ),
                        0,
                        1.5
                    );

                player.health =
                    clamp(
                        Number(
                            incoming.health ??
                            MAX_HEALTH
                        ),
                        0,
                        MAX_HEALTH
                    );

                player.reward =
                    Number(
                        incoming.reward ||
                        0
                    );

                player.cashoutAt =
                    Number(
                        incoming.cashoutAt ||
                        0
                    );

                player.cashoutTime =
                    Number(
                        incoming.cashoutTime ||
                        0
                    );

                player.roundId =
                    incoming.roundId ||
                    currentRoundId;

                player.lastSeen =
                    Date.now();

                players.set(
                    id,
                    player
                );

            }
        );

    }

}

   PLAYER DAMAGE

/* =========================================================
   PLAYER CRASH
========================================================= */

function onPlayerCrashed(
    senderId,
    payload
){

    const id =
        String(
            payload.playerId ||
            senderId
        );

    const player =

/* =========================================================
   ROCKET CRASH
========================================================= */

function crashRocket(
    rocket
){

    if(
        rocket ===
        "A"
    ){

        crashedA =
            true;

    }
    else{

        crashedB =
            true;

    }

    players.forEach(
        player => {

            if(
                player.rocket !==
                rocket
            ){

                return;

            }

            if(
                player.status !==
                "flying"
            ){

                return;

            }

            player.status =
                "crashed";

            player.health =
                0;

            player.reward =
                0;

            sendEvent(
                "PLAYER_CRASHED",
                {

                    gameId:
                        GAME_META.id,

                    roundId:
                        currentRoundId,

                    playerId:
                        player.id,

                    reason:
                        "ROCKET_CRASH"

                }
            );

            if(
                player.id ===
                user.id
            ){

                settleLoss(
                    "ROCKET_CRASH"
                );

            }

        }
    );

    sendEvent(
        "ROCKET_CRASHED",
        {

            gameId:
                GAME_META.id,

            roundId:
                currentRoundId,

            rocket:
                rocket,

            crashPoint:
                rocket ===
                "A"
                    ? crashPointA
                    : crashPointB

        }
    );

    soundCrash();

    screenShake(
        16
    );

}


function onRocketCrashed(

    payload
){

        String(senderId) !==
        String(hostId)

    }

        payload.rocket ===
        "B"
