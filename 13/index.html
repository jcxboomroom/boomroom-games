    );

    ctx.closePath();

    ctx.fill();


    const flame2 =
        ctx.createLinearGradient(
            x+2,
            y+15,
            x+2,
            y+108
        );

    flame2.addColorStop(
        0,
        "#fff"
    );

    flame2.addColorStop(
        .16,
        "#ffd759"
    );

    flame2.addColorStop(
        .45,
        "#d84cff"
    );

    flame2.addColorStop(
        1,
        "rgba(180,20,255,0)"
    );

    ctx.fillStyle =
        flame2;

    ctx.beginPath();

    ctx.moveTo(
        x+2,
        y+12
    );

    ctx.lineTo(
        x+16,
        y+12
    );

    ctx.lineTo(
        x+9,
        y+102+
        Math.random()*20
    );

    ctx.closePath();

    ctx.fill();


    /*
       黑紫色尖銳機身。
    */

    ctx.shadowBlur =
        34;

    ctx.shadowColor =
        profile.glow;

    ctx.fillStyle =
        "#edf2ff";

    ctx.beginPath();

    ctx.moveTo(
        x,
        y-54
    );

    ctx.lineTo(
        x+18,
        y-17
    );

    ctx.lineTo(
        x+18,
        y+25
    );

    ctx.lineTo(
        x+7,
        y+34
    );

    ctx.lineTo(
        x-7,
        y+34
    );

    ctx.lineTo(
        x-18,
        y+25
    );

    ctx.lineTo(
        x-18,
        y-17
    );

    ctx.closePath();

    ctx.fill();

    ctx.strokeStyle =
        profile.color;

    ctx.lineWidth =
        3;

    ctx.stroke();


    /*
       狂暴號尖翼。
    */

    ctx.fillStyle =
        "#494d67";

    ctx.beginPath();

    ctx.moveTo(
        x-15,
        y
    );

    ctx.lineTo(
        x-49,
        y+45
    );

    ctx.lineTo(
        x-12,
        y+28
    );

    ctx.closePath();

    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(
        x+15,
        y
    );

    ctx.lineTo(
        x+49,
        y+45
    );

    ctx.lineTo(
        x+12,
        y+28
    );

    ctx.closePath();

    ctx.fill();


    /*
       中央強化駕駛艙。
    */

    ctx.shadowBlur =
        0;

    ctx.fillStyle =
        profile.color;

    ctx.beginPath();

    ctx.moveTo(
        x,
        y-29
    );

    ctx.lineTo(
        x+10,
        y-15
    );

    ctx.lineTo(
        x,
        y-4
    );

    ctx.lineTo(
        x-10,
        y-15
    );

    ctx.closePath();

    ctx.fill();

    ctx.strokeStyle =
        "#fff";

    ctx.lineWidth =
        2;

    ctx.stroke();


    /*
       狂暴能量翼。
    */

    ctx.strokeStyle =
        "rgba(255,56,209,.55)";

    ctx.lineWidth =
        2;

    ctx.beginPath();

    ctx.moveTo(
        x-18,
        y+4
    );

    ctx.lineTo(
        x-36,
        y+20
    );

    ctx.moveTo(
        x+18,
        y+4
    );

    ctx.lineTo(
        x+36,
        y+20
    );

    ctx.stroke();

}

let shakeX = 0;
let shakeY = 0;


function draw(){

    drawBackground();

    if(
        !body.classList.contains(
            "playing"
        )
    ){

        return;

    }

    drawLane();

    worldItems.forEach(
        item => {

            if(
                item.type ===
                "meteor"
            ){

                drawMeteor(
                    item
                );

            }
            else{

                drawEnergy(
                    item
                );

            }

        }
    );

    drawPlayerRocket();

    if(
        Math.abs(shakeX) >
        .1 ||
        Math.abs(shakeY) >
        .1
    ){

        canvas.style.transform =
            `translate(${shakeX}px,${shakeY}px)`;

        shakeX *=
            .84;

        shakeY *=
            .84;

    }
    else{

        canvas.style.transform =
            "";

        shakeX =
            0;

        shakeY =
            0;

    }

}

/* =========================================================
   SOUND
========================================================= */

let audioContext =
    null;


function initAudio(){

    if(
        !audioContext
    ){

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(
            AudioContext
        ){

            try{

                audioContext =
                    new AudioContext();

            }catch(e){}

        }

    }

    if(
        audioContext &&
        audioContext.state ===
        "suspended"
    ){

        audioContext
            .resume()
            .catch(
                () => {}
            );

    }

}


function tone(
    frequency,
    duration,
    type="triangle",
    volume=.03,
    slide=0
){

    if(
        !audioContext
    ){

        return;

    }

    try{

        const oscillator =
            audioContext
                .createOscillator();

        const gain =
            audioContext
                .createGain();

        oscillator.type =
            type;

        oscillator.frequency.setValueAtTime(
            frequency,
            audioContext.currentTime
        );

        if(
            slide
        ){

            oscillator.frequency.linearRampToValueAtTime(
                frequency +
                slide,
                audioContext.currentTime +
                duration
            );

        }

        gain.gain.setValueAtTime(
            volume,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime +
            duration
        );

        oscillator.connect(
            gain
        );

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            duration
        );

    }catch(e){}

}

let toastTimer =
    null;


function showToast(
    message,
    duration=1200
){

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () =>
                toast.classList.remove(
                    "show"
                ),
            duration
        );

}

function rocketName(
    id
){

    return id ===
        "B"

        ? "🩷 狂暴號"

        : "🔵 穩定號";

}


function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


function escapeHTML(
    value
){

    return String(
        value
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}

/* =========================================================
   GAME LOOP
========================================================= */

let lastFrame =
    performance.now();


function frame(
    now
){

    const dt =
        Math.min(
            .05,
            Math.max(
                .001,
                (
                    now -
                    lastFrame
                ) /
                1000
            )
        );

    lastFrame =
        now;

    if(
        state ===
        "FLYING"
    ){

        updateLocalMovement(
            dt
        );

    }

    draw();

    updateHUD();

    requestAnimationFrame(
        frame
    );

}
