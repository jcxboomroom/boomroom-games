<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>
<meta name="theme-color" content="#050713">
<title>BoomRoom｜Neon Dual Rocket</title>

<style>
:root{
    --bg:#03040b;
    --panel:rgba(9,12,29,.88);
    --panel2:rgba(14,18,42,.9);
    --line:rgba(255,255,255,.11);
    --text:#f6f7ff;
    --muted:#8d96b3;
    --cyan:#22e7ff;
    --cyan2:#008cff;
    --pink:#ff32ce;
    --pink2:#7d30ff;
    --gold:#ffd84d;
    --green:#19ffb1;
    --red:#ff4a57;
    --orange:#ff8e32;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 18%,#13204a 0,#070a1c 35%,#020309 100%);
    color:var(--text);
    font-family:
        Inter,
        "SF Pro Display",
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
    user-select:none;
    touch-action:none;
}

body{
    position:relative;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

#gameCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
}

#app{
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
}

#topBar{
    position:absolute;
    top:max(10px,env(safe-area-inset-top));
    left:10px;
    right:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.brand{
    min-width:0;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:14px;
    background:rgba(5,8,22,.78);
    backdrop-filter:blur(12px);
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.brand-title{
    font-size:15px;
    line-height:1;
    font-weight:900;
    letter-spacing:.3px;
}

.brand-sub{
    margin-top:4px;
    color:var(--muted);
    font-size:9px;
}

.header-pills{
    display:flex;
    gap:6px;
    flex-shrink:0;
}

.pill{
    padding:8px 10px;
    border-radius:12px;
    border:1px solid var(--line);
    background:rgba(5,8,22,.78);
    backdrop-filter:blur(12px);
    font-size:11px;
    color:#b8c0d9;
    white-space:nowrap;
}

.host-pill{
    color:var(--gold);
}

#roomHud{
    position:absolute;
    top:70px;
    left:10px;
    right:10px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.rocket-card{
    min-width:0;
    padding:9px 11px;
    border-radius:15px;
    border:1px solid var(--line);
    background:rgba(7,10,25,.73);
    backdrop-filter:blur(10px);
    transition:.2s;
}

.rocket-card.active-a{
    border-color:rgba(34,231,255,.55);
    box-shadow:0 0 24px rgba(34,231,255,.08);
}

.rocket-card.active-b{
    border-color:rgba(255,50,206,.55);
    box-shadow:0 0 24px rgba(255,50,206,.08);
}

.rocket-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.rocket-name{
    font-size:12px;
    font-weight:900;
}

.rocket-mult{
    font-size:18px;
    font-weight:1000;
}

.rocket-card.a .rocket-mult{
    color:var(--cyan);
}

.rocket-card.b .rocket-mult{
    color:var(--pink);
}

.rocket-meta{
    display:flex;
    justify-content:space-between;
    margin-top:4px;
    color:var(--muted);
    font-size:9px;
}

#centerHud{
    position:absolute;
    left:50%;
    top:44%;
    transform:translate(-50%,-50%);
    width:min(90%,520px);
    text-align:center;
}

#mainMultiplier{
    font-family:
        Impact,
        "Arial Black",
        sans-serif;
    font-size:clamp(58px,14vw,120px);
    line-height:.92;
    letter-spacing:1px;
    text-shadow:
        0 0 16px rgba(255,255,255,.22),
        0 0 50px rgba(73,98,255,.18);
    transition:
        transform .08s,
        color .15s,
        text-shadow .15s;
}

#mainMultiplier.cyan{
    color:var(--cyan);
    text-shadow:
        0 0 20px rgba(34,231,255,.5),
        0 0 60px rgba(0,140,255,.4);
}

#mainMultiplier.pink{
    color:var(--pink);
    text-shadow:
        0 0 20px rgba(255,50,206,.5),
        0 0 60px rgba(125,48,255,.42);
}

#mainMultiplier.warning{
    color:var(--gold);
    text-shadow:
        0 0 22px rgba(255,216,77,.55),
        0 0 60px rgba(255,142,50,.38);
}

#mainMultiplier.danger{
    color:var(--red);
    text-shadow:
        0 0 22px rgba(255,74,87,.6),
        0 0 70px rgba(255,30,50,.4);
}

#mainMultiplier.win{
    color:var(--green);
    text-shadow:
        0 0 25px rgba(25,255,177,.65),
        0 0 75px rgba(0,255,170,.35);
    transform:scale(1.11);
}

#mainMultiplier.crash{
    color:var(--red);
    text-shadow:
        0 0 25px #ff2238,
        0 0 100px rgba(255,0,34,.7);
    transform:scale(1.2);
}

#statusText{
    margin-top:11px;
    color:#abb2ca;
    font-size:12px;
}

#controlHint{
    margin-top:7px;
    color:#69728e;
    font-size:10px;
}

#playersPanel{
    position:absolute;
    top:172px;
    left:10px;
    right:10px;
    max-height:30vh;
    overflow:hidden;
}

#players{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:6px;
}

.player{
    min-width:0;
    padding:7px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:13px;
    background:rgba(6,9,23,.72);
    backdrop-filter:blur(9px);
    transition:.15s;
}

.player.me{
    border-color:rgba(255,255,255,.25);
}

.player.flying{
    border-color:rgba(255,191,54,.3);
}

.player.cashed{
    border-color:rgba(25,255,177,.52);
    background:rgba(0,120,88,.12);
}

.player.crashed{
    border-color:rgba(255,74,87,.45);
    background:rgba(120,10,30,.12);
    opacity:.72;
}

.player-row{
    display:flex;
    align-items:center;
    gap:7px;
    min-width:0;
}

.avatar{
    width:27px;
    height:27px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    flex-shrink:0;
    background:linear-gradient(135deg,#7138ff,#e12aff);
    border:1px solid rgba(255,255,255,.14);
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.avatar-fallback{
    font-size:13px;
}

.player-main{
    min-width:0;
    flex:1;
}

.player-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:10px;
    font-weight:900;
}

.player-status{
    margin-top:2px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:8px;
    color:var(--muted);
}

.player-bet{
    flex-shrink:0;
    font-size:10px;
    font-weight:900;
    color:#d9def0;
}

.player-rocket{
    margin-top:4px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:5px;
    font-size:8px;
    color:#7e87a4;
}

.choice-a{
    color:var(--cyan);
}

.choice-b{
    color:var(--pink);
}

#eventFeed{
    position:absolute;
    left:10px;
    right:10px;
    bottom:214px;
    max-height:120px;
    overflow:hidden;
}

.event{
    display:inline-block;
    margin-top:4px;
    margin-right:4px;
    padding:6px 9px;
    border-radius:10px;
    background:rgba(4,7,18,.72);
    border:1px solid rgba(255,255,255,.08);
    color:#bcc3d9;
    font-size:9px;
    backdrop-filter:blur(8px);
    animation:eventIn .16s ease-out;
}

@keyframes eventIn{
    from{
        opacity:0;
        transform:translateY(7px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

#gestureButton{
    position:absolute;
    left:50%;
    bottom:210px;
    transform:translateX(-50%);
    pointer-events:auto;
    border:1px solid rgba(255,255,255,.16);
    border-radius:14px;
    padding:9px 13px;
    background:rgba(6,9,23,.9);
    color:#d8ddf0;
    font-size:11px;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
}

#gestureButton.enabled{
    border-color:rgba(25,255,177,.55);
    color:var(--green);
}

#bottomPanel{
    position:absolute;
    left:50%;
    bottom:max(10px,env(safe-area-inset-bottom));
    transform:translateX(-50%);
    width:min(620px,calc(100% - 20px));
    pointer-events:auto;
}

#choiceRow{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-bottom:7px;
}

.choice{
    height:42px;
    border-radius:12px;
    border:1px solid var(--line);
    color:#aeb5ce;
    background:rgba(7,10,25,.9);
    font-size:12px;
    font-weight:900;
}

.choice.active-a{
    color:#eaffff;
    border-color:rgba(34,231,255,.62);
    background:linear-gradient(135deg,rgba(34,231,255,.2),rgba(0,140,255,.08));
    box-shadow:0 0 24px rgba(34,231,255,.11);
}

.choice.active-b{
    color:#fff1fb;
    border-color:rgba(255,50,206,.62);
    background:linear-gradient(135deg,rgba(255,50,206,.2),rgba(125,48,255,.08));
    box-shadow:0 0 24px rgba(255,50,206,.1);
}

#betRow{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
    margin-bottom:7px;
}

.bet{
    height:36px;
    border-radius:10px;
    border:1px solid var(--line);
    background:rgba(6,9,24,.92);
    color:#bbc3dc;
    font-size:10px;
    font-weight:900;
}

.bet.active{
    color:#fff;
    border-color:rgba(126,70,255,.8);
    background:linear-gradient(135deg,#6630df,#932cff);
}

.bet:disabled,
.choice:disabled{
    opacity:.35;
}

#actionRow{
    display:grid;
    grid-template-columns:1fr;
    gap:7px;
}

#actionButton{
    width:100%;
    height:62px;
    border:0;
    border-radius:31px;
    color:#fff;
    background:linear-gradient(90deg,#6c2cf0,#9b26db);
    font-size:19px;
    font-weight:1000;
    letter-spacing:.2px;
    box-shadow:
        0 14px 30px rgba(0,0,0,.4),
        inset 0 1px rgba(255,255,255,.2);
}

#actionButton.eject{
    background:linear-gradient(90deg,#ff3a39,#ff9d24);
    animation:ejectPulse .48s infinite alternate;
}

#actionButton.disabled{
    opacity:.48;
}

@keyframes ejectPulse{
    from{
        box-shadow:
            0 12px 30px rgba(0,0,0,.45);
    }
    to{
        box-shadow:
            0 12px 30px rgba(0,0,0,.45),
            0 0 36px rgba(255,108,31,.35);
    }
}

#resultOverlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    opacity:0;
    pointer-events:none;
    transition:.2s;
}

#resultOverlay.show{
    opacity:1;
}

.result-card{
    width:min(420px,100%);
    padding:18px;
    border-radius:22px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(5,8,20,.95);
    box-shadow:
        0 30px 90px rgba(0,0,0,.55);
    backdrop-filter:blur(18px);
    text-align:center;
}

.result-title{
    color:#8f97b2;
    font-size:11px;
}

.result-main{
    margin-top:7px;
    font-size:31px;
    font-weight:1000;
}

.result-sub{
    margin-top:5px;
    color:#7e87a4;
    font-size:10px;
}

#leaderboard{
    margin-top:13px;
    display:grid;
    gap:5px;
    text-align:left;
}

.rank{
    display:grid;
    grid-template-columns:25px 1fr auto;
    align-items:center;
    gap:6px;
    padding:6px 8px;
    border-radius:9px;
    background:rgba(255,255,255,.035);
    font-size:10px;
}

.rank-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-weight:800;
}

.rank-value{
    font-weight:1000;
    color:var(--green);
}

#restartButton{
    width:100%;
    height:44px;
    margin-top:12px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.12);
    background:linear-gradient(135deg,#6230df,#8229c8);
    color:#fff;
    font-weight:1000;
}

#toast{
    position:absolute;
    left:50%;
    top:42%;
    transform:translate(-50%,-50%);
    padding:9px 14px;
    border-radius:999px;
    background:rgba(3,6,15,.86);
    border:1px solid rgba(255,255,255,.1);
    color:#dfe4f5;
    font-size:11px;
    opacity:0;
    pointer-events:none;
    transition:.18s;
    white-space:nowrap;
}

#toast.show{
    opacity:1;
}

.hidden{
    display:none !important;
}

@media(min-width:700px){
    #players{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }

    #playersPanel{
        max-width:620px;
        left:50%;
        right:auto;
        width:min(620px,calc(100% - 20px));
        transform:translateX(-50%);
    }
}

@media(max-height:720px){
    #playersPanel{
        top:155px;
        max-height:23vh;
    }

    #eventFeed{
        bottom:194px;
    }

    #gestureButton{
        bottom:188px;
    }

    #centerHud{
        top:42%;
    }

    #bottomPanel{
        bottom:7px;
    }

    #actionButton{
        height:55px;
    }

    .choice,
    .bet{
        height:34px;
    }
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="app">

    <div id="topBar">

        <div class="brand">
            <div class="brand-title">🚀 NEON DUAL ROCKET</div>
            <div class="brand-sub">BoomRoom · 雙火箭派對</div>
        </div>

        <div class="header-pills">
            <div class="pill host-pill" id="hostPill">HOST</div>
            <div class="pill">👥 <span id="onlineCount">1</span></div>
        </div>

    </div>

    <div id="roomHud">

        <div class="rocket-card a" id="rocketCardA">

            <div class="rocket-top">
                <div class="rocket-name">🔵 穩定號</div>
                <div class="rocket-mult" id="rocketMultA">1.00x</div>
            </div>

            <div class="rocket-meta">
                <span>低風險航道</span>
                <span id="rocketStateA">待命</span>
            </div>

        </div>

        <div class="rocket-card b" id="rocketCardB">

            <div class="rocket-top">
                <div class="rocket-name">🩷 狂暴號</div>
                <div class="rocket-mult" id="rocketMultB">1.00x</div>
            </div>

            <div class="rocket-meta">
                <span>高風險航道</span>
                <span id="rocketStateB">待命</span>
            </div>

        </div>

    </div>

    <div id="centerHud">

        <div id="mainMultiplier">1.00x</div>

        <div id="statusText">
            等待玩家選擇火箭並下注
        </div>

        <div id="controlHint">
            左右傾斜手機控制你的火箭
        </div>

    </div>

    <div id="playersPanel">
        <div id="players"></div>
    </div>

    <div id="eventFeed"></div>

    <button id="gestureButton">
        📱 啟用體感控制
    </button>

    <div id="bottomPanel">

        <div id="choiceRow">

            <button class="choice active-a" id="choiceA">
                🔵 穩定號
            </button>

            <button class="choice" id="choiceB">
                🩷 狂暴號
            </button>

        </div>

        <div id="betRow">

            <button class="bet active" data-bet="50">50</button>
            <button class="bet" data-bet="100">100</button>
            <button class="bet" data-bet="250">250</button>
            <button class="bet" data-bet="500">500</button>
            <button class="bet" data-bet="1000">1000</button>

        </div>

        <div id="actionRow">

            <button id="actionButton">
                支付 50 銀幣加入
            </button>

        </div>

    </div>

    <div id="resultOverlay">

        <div class="result-card">

            <div class="result-title" id="resultTitle">
                本局結果
            </div>

            <div class="result-main" id="resultMain">
                等待結算
            </div>

            <div class="result-sub" id="resultSub">
                —
            </div>

            <div id="leaderboard"></div>

            <button id="restartButton">
                下一局
            </button>

        </div>

    </div>

    <div id="toast"></div>

</div>

<script>
(() => {
    "use strict";

    /* =========================================================
       SDK / 使用者
    ========================================================= */

    const sdk = window.BoomRoomSDK || null;

    let user = {
        id: "demo_" + Math.random().toString(36).slice(2, 9),
        username: "訪客",
        avatar: ""
    };

    if (sdk && typeof sdk.getUser === "function") {
        try {
            const sdkUser = sdk.getUser();
            if (sdkUser && sdkUser.id) {
                user = {
                    id: String(sdkUser.id),
                    username: String(sdkUser.username || "玩家"),
                    avatar: String(sdkUser.avatar || "")
                };
            }
        } catch (e) {}
    }

    const sdkAvailable =
        !!sdk &&
        typeof sdk.requestPurchase === "function" &&
        typeof sdk.gameOver === "function" &&
        typeof sdk.sendGameEvent === "function";


    /* =========================================================
       DOM
    ========================================================= */

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d", { alpha: false });

    const mainMultiplier = document.getElementById("mainMultiplier");
    const statusText = document.getElementById("statusText");
    const controlHint = document.getElementById("controlHint");

    const playersEl = document.getElementById("players");
    const onlineCountEl = document.getElementById("onlineCount");
    const hostPill = document.getElementById("hostPill");

    const rocketMultA = document.getElementById("rocketMultA");
    const rocketMultB = document.getElementById("rocketMultB");
    const rocketStateA = document.getElementById("rocketStateA");
    const rocketStateB = document.getElementById("rocketStateB");
    const rocketCardA = document.getElementById("rocketCardA");
    const rocketCardB = document.getElementById("rocketCardB");

    const choiceA = document.getElementById("choiceA");
    const choiceB = document.getElementById("choiceB");

    const actionButton = document.getElementById("actionButton");
    const gestureButton = document.getElementById("gestureButton");

    const eventFeed = document.getElementById("eventFeed");

    const resultOverlay = document.getElementById("resultOverlay");
    const resultTitle = document.getElementById("resultTitle");
    const resultMain = document.getElementById("resultMain");
    const resultSub = document.getElementById("resultSub");
    const leaderboard = document.getElementById("leaderboard");
    const restartButton = document.getElementById("restartButton");

    const toast = document.getElementById("toast");


    /* =========================================================
       Canvas / 視窗
    ========================================================= */

    let width = 0;
    let height = 0;
    let dpr = 1;

    function resizeCanvas() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);

        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        createStars();
    }

    window.addEventListener("resize", resizeCanvas);


    /* =========================================================
       遊戲常數
    ========================================================= */

    const GAME_ID = "neon_dual_rocket_v1";

    const ROUND_WAIT_MS = 3500;
    const START_DELAY_MS = 1800;
    const ROUND_RESULT_MS = 6500;

    const INPUT_INTERVAL_MS = 75;
    const WORLD_BROADCAST_MS = 100;

    const MAX_PAYOUT_MULTIPLIER = 20;
    const MAX_PLAYERS_DISPLAY = 12;

    const ROCKETS = {
        A: {
            id: "A",
            name: "穩定號",
            color: "#22e7ff",
            glow: "#008cff",
            growth: 1.043,
            minCrash: 1.08,
            maxCrash: 18
        },
        B: {
            id: "B",
            name: "狂暴號",
            color: "#ff32ce",
            glow: "#7d30ff",
            growth: 1.061,
            minCrash: 1.04,
            maxCrash: 28
        }
    };


    /* =========================================================
       本地遊戲狀態
    ========================================================= */

    let state = "LOBBY";
    let selectedRocket = "A";
    let selectedBet = 50;

    let currentRoundId = null;
    let roundStartAt = 0;

    let crashPointA = null;
    let crashPointB = null;

    let rocketCrashedA = false;
    let rocketCrashedB = false;

    let lastHostHeartbeat = 0;
    let hostId = null;

    let clockOffset = 0;

    let lastWorldBroadcast = 0;
    let lastInputSent = 0;

    let lastMultiplierTick = 0;
    let lastWarningTone = 0;

    /* =========================================================
       WebAudio
    ========================================================= */

    let audioContext = null;

    function initAudio() {
        if (!audioContext) {
            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if (AudioContext) {
                try {
                    audioContext =
                        new AudioContext();
                } catch (e) {}
            }
        }

        if (
            audioContext &&
            audioContext.state === "suspended"
        ) {
            audioContext.resume().catch(() => {});
        }
    }

    function tone(
        frequency,
        duration = 0.08,
        type = "sine",
        volume = 0.035,
        slide = 0
    ) {
        if (!audioContext) {
            return;
        }

        try {
            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            oscillator.type =
                type;

            oscillator.frequency.setValueAtTime(
                frequency,
                audioContext.currentTime
            );

            if (slide) {
                oscillator.frequency.linearRampToValueAtTime(
                    frequency + slide,
                    audioContext.currentTime +
                    duration
                );
            }

            gain.gain.setValueAtTime(
                volume,
                audioContext.currentTime
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime +
                duration
            );

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.start();

            oscillator.stop(
                audioContext.currentTime +
                duration
            );
        } catch (e) {}
    }

    /* =========================================================
       Utils
    ========================================================= */

    function clamp(value, min, max) {
        return Math.max(
            min,
            Math.min(max, value)
        );
    }

    function safeNumber(value, fallback = 0) {
        const n = Number(value);
        return Number.isFinite(n)
            ? n
            : fallback;
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function randomId(prefix = "r") {
        return (
            prefix +
            "_" +
            Date.now().toString(36) +
            "_" +
            Math.random()
                .toString(36)
                .slice(2, 8)
        );
    }

    function getHostCandidateArray() {
        return Array.from(
            hostCandidates.values()
        ).sort(
            (a, b) => {
                if (a.joinedAt !== b.joinedAt) {
                    return a.joinedAt - b.joinedAt;
                }
                return a.id.localeCompare(b.id);
            }
        );
    }

    function isHost() {
        return hostId === user.id;
    }

    function currentHostKnown() {
        return (
            hostId &&
            hostId.length > 0
        );
    }


    /* =========================================================
       Host Election
    ========================================================= */

    function broadcastHello() {
        sendEvent("PLAYER_HELLO", {
            gameId: GAME_ID,
            user: {
                id: user.id,
                username: user.username,
                avatar: user.avatar
            },
            joinedAt: myJoinAt,
            clientTime: Date.now()
        });
    }

    function tryElectHost() {
        const candidates =
            getHostCandidateArray();

        if (!candidates.length) {
            return;
        }

        const winner =
            candidates[0];

        if (
            !hostId ||
            (
                hostId !== winner.id &&
                isEarlierCandidate(
                    winner.id,
                    hostId
                )
            )
        ) {
            hostId =
                winner.id;

            lastHostHeartbeat =
                Date.now();

            sendEvent(
                "HOST_ANNOUNCE",
                {
                    gameId: GAME_ID,
                    hostId,
                    hostJoinedAt:
                        winner.joinedAt,
                    epoch:
                        winner.joinedAt
                }
            );

            addEvent(
                hostId === user.id
                    ? "👑 你成為本房 Host"
                    : "👑 房主已同步"
            );
        }

        renderHeader();
    }

    function isEarlierCandidate(
        candidateId,
        currentHostId
    ) {
        const candidate =
            hostCandidates.get(
                candidateId
            );

        const current =
            hostCandidates.get(
                currentHostId
            );

        if (!candidate) {
            return false;
        }

        if (!current) {
            return true;
        }

        if (
            candidate.joinedAt !==
            current.joinedAt
        ) {
            return (
                candidate.joinedAt <
                current.joinedAt
            );
        }

        return (
            candidate.id
                .localeCompare(
                    current.id
                ) < 0
        );
    }

    function becomeHost() {
        const candidate =
            hostCandidates.get(
                user.id
            );

        if (!candidate) {
            return;
        }

        hostId =
            user.id;

        lastHostHeartbeat =
            Date.now();

        sendEvent(
            "HOST_ANNOUNCE",
            {
                gameId: GAME_ID,
                hostId: user.id,
                hostJoinedAt:
                    candidate.joinedAt,
                epoch:
                    candidate.joinedAt
            }
        );

        addEvent(
            "👑 Host 已接管房間"
        );

        if (state === "FLYING") {
            restoreHostSimulation();
        }
    }


    /* =========================================================
       Event Router
    ========================================================= */

    function handleGameEvent(
        senderId,
        eventName,
        payload
    ) {
        switch (eventName) {

            case "PLAYER_HELLO":
                onPlayerHello(
                    senderId,
                    payload
                );
                break;

            case "HOST_ANNOUNCE":
                onHostAnnounce(
                    senderId,
                    payload
                );
                break;

            case "HOST_HEARTBEAT":
                onHostHeartbeat(
                    senderId,
                    payload
                );
                break;

            case "PLAYER_READY":
                onPlayerReady(
                    senderId,
                    payload
                );
                break;

            case "LOBBY_STATE":
                onLobbyState(
                    senderId,
                    payload
                );
                break;

            case "ROUND_START":
                onRoundStart(
                    senderId,
                    payload
                );
                break;

            case "ROUND_SNAPSHOT":
                onRoundSnapshot(
                    senderId,
                    payload
                );
                break;

            case "PLAYER_INPUT":
                onPlayerInput(
                    senderId,
                    payload
                );
                break;

            case "WORLD_STATE":
                onWorldState(
                    senderId,
                    payload
                );
                break;

            case "PLAYER_CASHOUT":
                onPlayerCashout(
                    senderId,
                    payload
                );
                break;

            case "CASHOUT_CONFIRMED":
                onCashoutConfirmed(
                    senderId,
                    payload
                );
                break;

            case "PLAYER_CRASHED":
                onPlayerCrashed(
                    senderId,
                    payload
                );
                break;

            case "ROCKET_CRASHED":
                onRocketCrashed(
                    senderId,
                    payload
                );
                break;

            case "ROUND_RESULT":
                onRoundResult(
                    senderId,
                    payload
                );
                break;

            case "PLAYER_MESSAGE":
                if (payload && payload.text) {
                    addEvent(
                        `💬 ${payload.text}`
                    );
                }
                break;
        }
    }


    /* =========================================================
       Player Hello
    ========================================================= */

    function onPlayerHello(
        senderId,
        payload
    ) {
        const incomingUser =
            payload.user || {};

        const id =
            String(
                incomingUser.id ||
                senderId
            );

        if (id === user.id) {
            return;
        }

        const joinedAt =
            safeNumber(
                payload.joinedAt,
                Date.now()
            );

        hostCandidates.set(
            id,
            {
                id,
                joinedAt,
                username:
                    String(
                        incomingUser.username ||
                        "玩家"
                    )
            }
        );

        upsertPlayer(
            id,
            {
                id,
                username:
                    String(
                        incomingUser.username ||
                        "玩家"
                    ),
                avatar:
                    String(
                        incomingUser.avatar ||
                        ""
                    ),
                joinedAt
            }
        );

        sendEvent(
            "PLAYER_HELLO_ACK",
            {
                gameId: GAME_ID,
                targetId: id,
                user: {
                    id: user.id,
                    username: user.username,
                    avatar: user.avatar
                },
                joinedAt: myJoinAt
            }
        );

        if (isHost()) {
            sendLobbySnapshot(id);

            if (state === "FLYING") {
                sendRoundSnapshot(id);
            }
        }

        tryElectHost();

        renderPlayers();
    }


    /* =========================================================
       Host Announcement
    ========================================================= */

    function onHostAnnounce(
        senderId,
        payload
    ) {
        const announcedHost =
            String(
                payload.hostId ||
                senderId
            );

        const joinedAt =
            safeNumber(
                payload.hostJoinedAt,
                Number.MAX_SAFE_INTEGER
            );

        if (!hostCandidates.has(announcedHost)) {
            hostCandidates.set(
                announcedHost,
                {
                    id: announcedHost,
                    joinedAt,
                    username:
                        announcedHost === user.id
                            ? user.username
                            : "玩家"
                }
            );
        }

        const current =
            hostId
                ? hostCandidates.get(hostId)
                : null;

        const candidate =
            hostCandidates.get(
                announcedHost
            );

        if (
            !current ||
            !candidate ||
            isEarlierCandidate(
                announcedHost,
                hostId
            )
        ) {
            hostId =
                announcedHost;
        }

        lastHostHeartbeat =
            Date.now();

        renderHeader();
    }


    /* =========================================================
       Host Heartbeat
    ========================================================= */

    function onHostHeartbeat(
        senderId,
        payload
    ) {
        const incomingHost =
            String(
                payload.hostId ||
                senderId
            );

        if (
            hostId === incomingHost ||
            !hostId
        ) {
            hostId =
                incomingHost;

            lastHostHeartbeat =
                Date.now();
        }

        if (payload.hostNow) {
            clockOffset =
                safeNumber(
                    payload.hostNow,
                    Date.now()
                ) -
                Date.now();
        }
    }


    /* =========================================================
       Player Data
    ========================================================= */

    function upsertPlayer(
        id,
        patch
    ) {
        if (!playerMap.has(id)) {
            playerMap.set(
                id,
                {
                    id,
                    username: "玩家",
                    avatar: "",
                    joinedAt: Date.now(),
                    ready: false,
                    bet: 0,
                    rocket: "A",
                    status: "waiting",
                    x: 0,
                    renderX: 0,
                    bonus: 0,
                    reward: 0,
                    roundMultiplier: 1,
                    cashoutAt: 0,
                    lastInputSeq: 0
                }
            );
        }

        Object.assign(
            playerMap.get(id),
            patch
        );
    }


    /* =========================================================
       Lobby Ready
    ========================================================= */

    function onPlayerReady(
        senderId,
        payload
    ) {
        const p =
            getOrCreateRemotePlayer(
                senderId,
                payload
            );

        p.ready = true;
        p.bet =
            clamp(
                safeNumber(
                    payload.bet,
                    0
                ),
                0,
                1000
            );

        p.rocket =
            payload.rocket === "B"
                ? "B"
                : "A";

        p.status = "ready";

        if (payload.username) {
            p.username =
                String(payload.username);
        }

        if (payload.avatar) {
            p.avatar =
                String(payload.avatar);
        }

        addEvent(
            `🪙 ${p.username} 下注 ${p.bet}｜${rocketName(p.rocket)}`
        );

        renderPlayers();

        if (isHost() && state === "LOBBY") {
            maybeStartRound();
        }
    }


    function getOrCreateRemotePlayer(
        id,
        payload = {}
    ) {
        if (!playerMap.has(id)) {
            upsertPlayer(
                id,
                {
                    id,
                    username:
                        String(
                            payload.username ||
                            "玩家"
                        ),
                    avatar:
                        String(
                            payload.avatar ||
                            ""
                        ),
                    joinedAt:
                        safeNumber(
                            payload.joinedAt,
                            Date.now()
                        )
                }
            );
        }

        return playerMap.get(id);
    }

       Player Ready / Join

    function requestBetAndJoin() {
        initAudio();

        if (state === "FLYING") {
            cashoutLocal();
            return;
        }

        if (localReady) {
            return;
        }

        roundBetSent = false;

        if (
            !sdkAvailable
        ) {
            onLocalPurchaseSuccess(
                `neon_dual_bet_${selectedBet}`
            );
            return;
        }

        actionButton.disabled = true;
        actionButton.classList.add("disabled");
        actionButton.textContent =
            "驗證銀幣中…";

        const itemId =
            `neon_dual_bet_${selectedBet}`;

        try {
            sdk.requestPurchase(
                itemId,
                selectedBet
            );
        } catch (e) {
            actionButton.disabled = false;
            actionButton.classList.remove("disabled");
            actionButton.textContent =
                `支付 ${selectedBet} 銀幣加入`;
            showToast("無法發起付款");
        }
    }


    function onLocalPurchaseSuccess(itemId) {
        const match =
            /^neon_dual_bet_(\d+)$/
                .exec(
                    String(itemId)
                );

        if (!match) {
            return;
        }

        const paid =
            Number(match[1]);

        if (
            paid !== selectedBet
        ) {
            selectedBet = paid;
        }

        initAudio();

        localReady = true;
        roundBetSent = true;

        const me =
            playerMap.get(
                user.id
            );

        me.ready = true;
        me.bet = selectedBet;
        me.rocket = selectedRocket;
        me.status = "ready";
        me.reward = 0;
        me.bonus = 0;

        sendEvent(
            "PLAYER_READY",
            {
                gameId: GAME_ID,
                username: user.username,
                avatar: user.avatar,
                joinedAt: myJoinAt,
                bet: selectedBet,
                rocket: selectedRocket
            }

        soundJoin();

            `✅ 你已下注 ${selectedBet} 銀幣`

        actionButton.classList.remove("disabled");
        actionButton.textContent =
            "等待開局…";

            `${rocketName(selectedRocket)} 已加入`
        );

        if (

        ) {
            maybeStartRound();
        }
    }
