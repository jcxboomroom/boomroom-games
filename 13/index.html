                    ).toFixed(2)}x 逃脫`
                );
            case "crashed":
                return "💥 爆炸";
            default:
                return "等待加入";
        }
    }


    /* =========================================================
       Main HUD
    ========================================================= */

    function renderHUD(
        now = Date.now()
    ) {
        const effectiveNow =
            now +
            clockOffset;

        if (
            state === "COUNTDOWN"
        ) {
            const remain =
                Math.max(
                    0,
                    roundStartAt -
                    effectiveNow
                );

            const seconds =
                Math.ceil(
                    remain / 1000
                );

            mainMultiplier.className =
                "";

            mainMultiplier.textContent =
                seconds > 0
                    ? String(seconds)
                    : "GO!";

            statusText.textContent =
                "雙火箭即將起飛";

        } else if (
            state === "FLYING"
        ) {

            const baseA =
                getBaseMultiplier(
                    "A",
                    effectiveNow
                );

            const baseB =
                getBaseMultiplier(
                    "B",
                    effectiveNow
                );

            rocketMultA.textContent =
                `${baseA.toFixed(2)}x`;

            rocketMultB.textContent =
                `${baseB.toFixed(2)}x`;

            const me =
                playerMap.get(
                    user.id
                );

            if (me) {
                const current =
                    getPlayerMultiplier(
                        me
                    );

                mainMultiplier.textContent =
                    `${current.toFixed(2)}x`;

                if (
                    me.status ===
                    "cashed"
                ) {
                    mainMultiplier.className =
                        "win";

                } else if (
                    me.status ===
                    "crashed"
                ) {
                    mainMultiplier.className =
                        "crash";

                } else if (
                    current >= 5
                ) {
                    mainMultiplier.className =
                        "danger";

                } else if (
                    current >= 2
                ) {
                    mainMultiplier.className =
                        "warning";

                } else {
                    mainMultiplier.className =
                        selectedRocket === "A"
                            ? "cyan"
                            : "pink";
                }

                if (
                    me.status ===
                    "flying"
                ) {
                    statusText.textContent =
                        `🚀 ${
                            rocketName(me.rocket)
                        } · ${current.toFixed(2)}x`;
                }
            }

            rocketStateA.textContent =
                rocketCrashedA
                    ? "💥 爆炸"
                    : "🚀 飛行";

            rocketStateB.textContent =
                rocketCrashedB
                    ? "💥 爆炸"
                    : "🚀 飛行";

            rocketCardA.classList.toggle(
                "active-a",
                selectedRocket === "A"
            );

            rocketCardB.classList.toggle(
                "active-b",
                selectedRocket === "B"
            );

            maybePlayHudWarnings(
                baseA,
                baseB
            );

        } else if (
            state === "LOBBY"
        ) {
            mainMultiplier.className =
                "";

            mainMultiplier.textContent =
                "1.00x";

            statusText.textContent =
                localReady
                    ? "等待 Host 開局…"
                    : "等待玩家選擇火箭並下注";

            controlHint.textContent =
                tiltEnabled
                    ? "📱 體感控制已開啟"
                    : "左右傾斜手機控制你的火箭";
        }

        if (
            state === "CRASHED"
        ) {
            mainMultiplier.className =
                "crash";
        }
    }


    function maybePlayHudWarnings(
        a,
        b
    ) {
        const now =
            Date.now();

        const active =
            selectedRocket === "A"
                ? a
                : b;

        if (
            active >= 2 &&
            active < 2.08 &&
            now -
            lastWarningTone >
            1200
        ) {
            lastWarningTone =
                now;

            soundNearCrash();
        }

        if (
            active >= 5 &&
            now -
            lastMultiplierTick >
            260
        ) {
            lastMultiplierTick =
                now;

            soundTick(
                active
            );
        }
    }


    /* =========================================================
       World Visual Orbs
    ========================================================= */

    let worldVisualOrbs = [];


    /* =========================================================
       Canvas Background
    ========================================================= */

    let stars = [];

    function createStars() {
        stars =
            [];

        const count =
            Math.min(
                170,
                Math.max(
                    90,
                    Math.floor(
                        width *
                        height /
                        10000
                    )
                )
            );

        for (
            let i = 0;
            i < count;
            i++
        ) {
            stars.push({
                x:
                    Math.random() *
                    width,
                y:
                    Math.random() *
                    height,
                z:
                    Math.random() *
                    .9 +
                    .1,
                size:
                    Math.random() *
                    1.8 +
                    .4
            });
        }
    }


    function drawBackground(
        time
    ) {
        ctx.fillStyle =
            "#020309";

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

        const glow =
            ctx.createRadialGradient(
                width / 2,
                height * .42,
                20,
                width / 2,
                height * .42,
                Math.max(
                    width,
                    height
                ) * .72
            );

        glow.addColorStop(
            0,
            "rgba(29,46,112,.4)"
        );

        glow.addColorStop(
            .48,
            "rgba(11,18,53,.23)"
        );

        glow.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle =
            glow;

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

        for (
            const star of stars
        ) {
            const speed =
                state === "FLYING"
                    ? 1 +
                      Math.min(
                          getFastestMultiplier(),
                          10
                      ) *
                      .08
                    : .25;

            star.y +=
                star.z *
                speed;

            if (
                star.y >
                height
            ) {
                star.y = 0;
                star.x =
                    Math.random() *
                    width;
            }

            ctx.globalAlpha =
                .25 +
                star.z *
                .7;

            ctx.fillStyle =
                "#ffffff";

            ctx.beginPath();

            ctx.arc(
                star.x,
                star.y,
                star.size,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        ctx.globalAlpha =
            1;
    }


    function getFastestMultiplier() {
        const now =
            Date.now() +
            clockOffset;

        const a =
            getBaseMultiplier(
                "A",
                now
            );

        const b =
            getBaseMultiplier(
                "B",
                now
            );

        return Math.max(
            a,
            b
        );
    }


    /* =========================================================
       Flight Lanes
    ========================================================= */

    function laneGeometry(
        rocketId
    ) {
        const gap =
            Math.min(
                24,
                width * .06
            );

        const laneWidth =
            Math.min(
                175,
                width * .34
            );

        const total =
            laneWidth * 2 +
            gap;

        const left =
            width / 2 -
            total / 2;

        if (
            rocketId === "A"
        ) {
            return {
                left,
                width: laneWidth,
                center:
                    left +
                    laneWidth / 2
            };
        }

        return {
            left:
                left +
                laneWidth +
                gap,
            width: laneWidth,
            center:
                left +
                laneWidth +
                gap +
                laneWidth / 2
        };
    }


    function drawLane(
        rocketId,
        time
    ) {
        const g =
            laneGeometry(
                rocketId
            );

        const color =
            rocketId === "A"
                ? "34,231,255"
                : "255,50,206";

        const bottom =
            height * .82;

        const top =
            height * .24;

        const grad =
            ctx.createLinearGradient(
                g.left,
                top,
                g.left,
                bottom
            );

        grad.addColorStop(
            0,
            `rgba(${color},0)`
        );

        grad.addColorStop(
            .45,
            `rgba(${color},.045)`
        );

        grad.addColorStop(
            1,
            `rgba(${color},.1)`
        );

        ctx.fillStyle =
            grad;

        ctx.fillRect(
            g.left,
            top,
            g.width,
            bottom - top
        );

        ctx.strokeStyle =
            `rgba(${color},.13)`;

        ctx.lineWidth =
            1;

        ctx.beginPath();

        ctx.moveTo(
            g.left,
            top
        );

        ctx.lineTo(
            g.left,
            bottom
        );

        ctx.moveTo(
            g.left + g.width,
            top
        );

        ctx.lineTo(
            g.left + g.width,
            bottom
        );

        ctx.stroke();

        const laneScroll =
            (
                time *
                .045
            ) %
            46;

        ctx.strokeStyle =
            `rgba(${color},.07)`;

        for (
            let y =
                top +
                laneScroll;
            y <
            bottom;
            y += 46
        ) {
            ctx.beginPath();

            ctx.moveTo(
                g.left + 10,
                y
            );

            ctx.lineTo(
                g.left +
                g.width -
                10,
                y
            );

            ctx.stroke();
        }
    }


    /* =========================================================
       Hero Rockets
    ========================================================= */

    function drawHeroRocket(
        rocketId,
        multiplier,
        crashed,
        time
    ) {
        const g =
            laneGeometry(
                rocketId
            );

        const color =
            rocketId === "A"
                ? "#22e7ff"
                : "#ff32ce";

        const glow =
            rocketId === "A"
                ? "#008cff"
                : "#7d30ff";

        const pulse =
            Math.sin(
                time *
                .006
            ) *
            3;

        const x =
            g.center;

        const y =
            height *
            .62 -
            Math.min(
                multiplier *
                3.8,
                155
            ) +
            pulse;

        ctx.save();

        if (crashed) {
            drawExplosionGlow(
                x,
                y,
                color
            );
            ctx.restore();
            return;
        }

        ctx.translate(
            x,
            y
        );

        ctx.shadowBlur =
            24;

        ctx.shadowColor =
            glow;

        ctx.fillStyle =
            color;

        ctx.beginPath();

        ctx.moveTo(
            0,
            -33
        );

        ctx.quadraticCurveTo(
            18,
            -4,
            18,
            18
        );

        ctx.lineTo(
            -18,
            18
        );

        ctx.quadraticCurveTo(
            -18,
            -4,
            0,
            -33
        );

        ctx.closePath();

        ctx.fill();

        ctx.shadowBlur =
            0;

        ctx.fillStyle =
            "#eef9ff";

        ctx.beginPath();

        ctx.arc(
            0,
            -7,
            6,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle =
            "#ffffff";

        ctx.beginPath();

        ctx.moveTo(
            -9,
            15
        );

        ctx.lineTo(
            -29,
            26
        );

        ctx.lineTo(
            -10,
            23
        );

        ctx.closePath();

        ctx.fill();

        ctx.beginPath();

        ctx.moveTo(
            9,
            15
        );

        ctx.lineTo(
            29,
            26
        );

        ctx.lineTo(
            10,
            23
        );

        ctx.closePath();

        ctx.fill();

        ctx.fillStyle =
            "#ffd84d";

        ctx.beginPath();

        ctx.moveTo(
            -8,
            19
        );

        ctx.lineTo(
            8,
            19
        );

        ctx.lineTo(
            0,
            44 +
            Math.random() *
            15
        );

        ctx.closePath();

        ctx.fill();

        ctx.fillStyle =
            "#ff6c2c";

        ctx.beginPath();

        ctx.moveTo(
            -5,
            20
        );

        ctx.lineTo(
            5,
            20
        );

        ctx.lineTo(
            0,
            37
        );

        ctx.closePath();

        ctx.fill();

        ctx.restore();
    }


    function drawExplosionGlow(
        x,
        y,
        color
    ) {
        const radius =
            24 +
            Math.random() *
            25;

        const glow =
            ctx.createRadialGradient(
                x,
                y,
                2,
                x,
                y,
                radius
            );

        glow.addColorStop(
            0,
            "rgba(255,255,255,.95)"
        );

        glow.addColorStop(
            .2,
            color
        );

        glow.addColorStop(
            1,
            "rgba(255,0,0,0)"
        );

        ctx.fillStyle =
            glow;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    /* =========================================================
       World Items Rendering
    ========================================================= */

    function drawWorldItems() {
        for (
            const item of worldVisualOrbs
        ) {
            const g =
                laneGeometry(
                    item.rocket
                );

            const x =
                g.center +
                item.x *
                (
                    g.width /
                    2 -
                    18
                );

            const y =
                height *
                .24 +
                item.y *
                (
                    height *
                    .58
                );

            if (
                item.type ===
                "energy"
            ) {
                drawEnergyOrb(
                    x,
                    y
                );
            } else {
                drawMeteor(
                    x,
                    y
                );
            }
        }
    }


    function drawEnergyOrb(
        x,
        y
    ) {
        const pulse =
            8 +
            Math.sin(
                Date.now() *
                .007
            ) *
            2;

        ctx.save();

        ctx.shadowBlur =
            18;

        ctx.shadowColor =
            "#ffd84d";

        ctx.strokeStyle =
            "#ffd84d";

        ctx.lineWidth =
            2;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            pulse,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        ctx.fillStyle =
            "rgba(255,216,77,.15)";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            pulse * 1.6,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }


    function drawMeteor(
        x,
        y
    ) {
        ctx.save();

        ctx.translate(
            x,
            y
        );

        ctx.rotate(
            Date.now() *
            .002
        );

        ctx.shadowBlur =
            12;

        ctx.shadowColor =
            "#ff5335";

        ctx.fillStyle =
            "#ff6d45";

        ctx.beginPath();

        ctx.moveTo(
            -10,
            -8
        );

        ctx.lineTo(
            6,
            -11
        );

        ctx.lineTo(
            12,
            3
        );

        ctx.lineTo(
            2,
            12
        );

        ctx.lineTo(
            -11,
            7
        );

        ctx.closePath();

        ctx.fill();

        ctx.restore();
    }


    /* =========================================================
       玩家火箭
    ========================================================= */

    function drawPlayerRockets() {
        const me =
            playerMap.get(
                user.id
            );

        if (!me) {
            return;
        }

        Array.from(
            playerMap.values()
        )
        .forEach(
            p => {

                if (
                    p.status !==
                    "flying"
                ) {
                    return;
                }

                const g =
                    laneGeometry(
                        p.rocket
                    );

                const color =
                    p.id === user.id
                        ? "#ffffff"
                        : p.rocket === "A"
                            ? "#22e7ff"
                            : "#ff32ce";

                p.renderX =
                    p.renderX * .72 +
                    p.x * .28;

                const x =
                    g.center +
                    p.renderX *
                    (
                        g.width /
                        2 -
                        20
                    );

                const y =
                    height *
                    .79 -
                    Math.min(
                        p.bonus *
                        18,
                        22
                    );

                ctx.save();

                ctx.globalAlpha =
                    p.id === user.id
                        ? 1
                        : .4;

                ctx.shadowBlur =
                    p.id === user.id
                        ? 20
                        : 9;

                ctx.shadowColor =
                    color;

                ctx.fillStyle =
                    color;

                ctx.beginPath();

                ctx.moveTo(
                    x,
                    y - 16
                );

                ctx.lineTo(
                    x + 7,
                    y + 9
                );

                ctx.lineTo(
                    x - 7,
                    y + 9
                );

                ctx.closePath();

                ctx.fill();

                ctx.fillStyle =
                    "#ffffff";

                ctx.beginPath();

                ctx.arc(
                    x,
                    y - 3,
                    2.5,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

                ctx.restore();
            }
        );
    }


    /* =========================================================
       Render Loop
    ========================================================= */

    let shakeX = 0;
    let shakeY = 0;

    function animate(time) {
        renderHUD();

        drawBackground(
            time
        );

        drawLane(
            "A",
            time
        );

        drawLane(
            "B",
            time
        );

        const now =
            Date.now() +
            clockOffset;

        const a =
            getBaseMultiplier(
                "A",
                now
            );

        const b =
            getBaseMultiplier(
                "B",
                now
            );

        drawHeroRocket(
            "A",
            a,
            rocketCrashedA,
            time
        );

        drawHeroRocket(
            "B",
            b,
            rocketCrashedB,
            time
        );

        drawWorldItems();

        drawPlayerRockets();

        updateShake();

        requestAnimationFrame(
            animate
        );
    }


    function updateShake() {
        if (
            Math.abs(shakeX) < .1 &&
            Math.abs(shakeY) < .1
        ) {
            shakeX = 0;
            shakeY = 0;
            return;
        }

        shakeX *= .86;
        shakeY *= .86;

        canvas.style.transform =
            `translate(${shakeX}px,${shakeY}px)`;
    }


    function screenShake(
        amount = 9
    ) {
        shakeX =
            (
                Math.random() -
                .5
            ) *
            amount;

        shakeY =
            (
                Math.random() -
                .5
            ) *
            amount;
    }


    /* =========================================================
       Crash Visual Event
    ========================================================= */

    window.addEventListener(
        "message",
        event => {
            let data = null;

            try {
                data =
                    typeof event.data ===
                    "string"
                        ? JSON.parse(
                            event.data
                        )
                        : event.data;
            } catch (e) {
                return;
            }

            if (
                !data ||
                data.action !==
                "gameEventReceived"
            ) {
                return;
            }

            if (
                data.eventName ===
                "ROCKET_CRASHED"
            ) {
                screenShake(
                    15
                );
            }
        }
    );


    /* =========================================================
       Initial UI
    ========================================================= */

    updateChoiceUI();

    resizeCanvas();

    renderPlayers();

    renderHeader();

    broadcastHello();

    setTimeout(
        () => {
            tryElectHost();

            if (
                isHost()
            ) {
                addEvent(
                    "👑 你是本房第一位玩家，Host 已建立"
                );
            }
        },
        850
    );


    /* =========================================================
       開發/瀏覽器測試模式
    ========================================================= */

    if (!sdkAvailable) {
        addEvent(
            "🧪 預覽模式：SDK 未連線"
        );
    }


    /* =========================================================
       Demo Bots
       僅在沒有 SDK 時啟用，方便直接開 HTML 測試。
    ========================================================= */

    if (!sdkAvailable) {

        function createDemoBots() {

            const bots = [
                {
                    id: "demo_01",
                    username: "CyberCat",
                    avatar: "",
                    joinedAt:
                        myJoinAt + 100,
                    bet: 100,
                    rocket: "A"
                },
                {
                    id: "demo_02",
                    username: "NeonFox",
                    avatar: "",
                    joinedAt:
                        myJoinAt + 200,
                    bet: 250,
                    rocket: "B"
                },
                {
                    id: "demo_03",
                    username: "RocketKid",
                    avatar: "",
                    joinedAt:
                        myJoinAt + 300,
                    bet: 500,
                    rocket: "A"
                }
            ];

            bots.forEach(
                b => {
                    upsertPlayer(
                        b.id,
                        {
                            ...b,
                            ready: true,
                            status: "ready",
                            x:
                                Math.random() *
                                1.4 -
                                .7,
                            renderX: 0,
                            bonus: 0,
                            reward: 0,
                            cashoutAt: 0
                        }
                    );

                    hostCandidates.set(
                        b.id,
                        {
                            id: b.id,
                            joinedAt:
                                b.joinedAt,
                            username:
                                b.username
                        }
                    );
                }
            );

            if (
                !hostId
            ) {
                hostId =
                    getHostCandidateArray()[0]
                        ?.id ||
                    user.id;
            }

            renderPlayers();
            renderHeader();
        }

        createDemoBots();

        setTimeout(
            () => {
                if (
                    state === "LOBBY" &&
                    isHost()
                ) {
                    maybeStartRound();
                }
            },
            1800
        );

        setInterval(
            () => {
                if (
                    state !==
                    "FLYING"
                ) {
                    return;
                }

                Array.from(
                    playerMap.values()
                )
                .filter(
                    p =>
                        p.id !==
                        user.id &&
                        p.status ===
                        "flying"
                )
                .forEach(
                    p => {
                        p.x +=
                            (
                                Math.random() -
                                .5
                            ) *
                            .25;

                        p.x =
                            clamp(
                                p.x,
                                -1,
                                1
                            );

                        if (
                            Math.random() <
                            .006 *
                            Math.max(
                                1,
                                getPlayerMultiplier(
                                    p
                                )
                            )
                        ) {
                            processCashoutOnHost(
                                p.id
                            );
                        }
                    }
                );
            },
            180
        );
    }


    /* =========================================================
       遊戲內訊息
    ========================================================= */

    document.addEventListener(
        "visibilitychange",
        () => {
            if (
                document.visibilityState ===
                "visible"
            ) {
                broadcastHello();

                if (
                    isHost()
                ) {
                    sendLobbySnapshot();

                    if (
                        state ===
                        "FLYING"
                    ) {
                        sendRoundSnapshot();
                    }
                }
            }
        }
    );


    /* =========================================================
       開始動畫
    ========================================================= */

    requestAnimationFrame(
        animate
    );

})();
</script>
