<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#08050b">
<title>爆爆馬戲團：極限跳火圈</title>

<style>
:root{
  --bg:#f7e8d1;
  --ink:#24151a;
  --muted:#80656a;
  --cream:#fff7e8;
  --red:#d93b4b;
  --red2:#a9233a;
  --gold:#f4b83f;
  --orange:#f47c32;
  --pink:#ef5b82;
  --blue:#5eb9d5;
  --green:#62b77b;

  --safeT:env(safe-area-inset-top,0px);
  --safeB:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--ink);
  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
  user-select:none;
  touch-action:none;
}

button{
  font:inherit;
  border:0;
  color:inherit;
}

#app{
  width:100%;
  height:100dvh;
  display:flex;
  justify-content:center;
  background:linear-gradient(
    180deg,
    #fff4df 0%,
    #f4d9bd 100%
  );
}

.shell{
  width:min(100%,760px);
  height:100%;
  display:flex;
  flex-direction:column;
  padding:
    calc(5px + var(--safeT))
    8px
    calc(5px + var(--safeB));
  gap:6px;
}

.topbar{
  height:43px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 5px;
}

.brand{
  font-weight:1000;
  font-size:15px;
  letter-spacing:.2px;
  color:#351820;
}

.topActions{
  display:flex;
  gap:6px;
}

.iconBtn{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#fff8ea;
  border:2px solid #dfb889;
  font-size:17px;
  box-shadow:0 2px 0 #c99a6d;
}

.iconBtn:active{
  transform:translateY(2px);
}

#main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.panel{
  background:rgba(255,250,240,.95);
  border:1.5px solid #e1bc94;
  border-radius:17px;
  padding:11px;
  box-shadow:0 4px 16px rgba(107,57,35,.10);
}

.stats{
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr 1fr;
  gap:5px;
}

.stat{
  min-width:0;
  padding:6px 4px;
  background:#fff9ed;
  border:1px solid #ead1b2;
  border-radius:10px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:14px;
  white-space:nowrap;
  color:#3b2027;
}

.stat span{
  display:block;
  font-size:8px;
  color:#967579;
  margin-top:1px;
}

#gameWrap{
  position:relative;
  flex:1;
  min-height:250px;
  border-radius:19px;
  overflow:hidden;
  border:2px solid #a9474f;
  background:#f7dcae;
  box-shadow:0 7px 22px rgba(104,49,40,.20);
  touch-action:none;
}

#gameCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

#centerMsg{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  text-align:center;
}

#centerMsg>div{
  opacity:0;
  transform:translateY(8px) scale(.92);
  transition:.18s;
}

#centerMsg.show>div{
  opacity:1;
  transform:none;
}

.msgBig{
  font-size:34px;
  font-weight:1000;
  color:#fff8df;
  text-shadow:0 3px 8px #5a1f26;
}

.msgSmall{
  font-size:13px;
  font-weight:900;
  color:#fff4c8;
  margin-top:2px;
  text-shadow:0 2px 5px #5a1f26;
}

.jump{
  height:60px;
  flex:none;
  border-radius:17px;
  background:linear-gradient(
    180deg,
    #ffd75c,
    #f39a2f
  );
  color:#3b170b;
  font-size:21px;
  font-weight:1000;
  border:2px solid #c86e25;
  box-shadow:
    0 5px 0 #a75320,
    0 8px 18px rgba(164,78,25,.18);
}

.jump:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #a75320;
}

.notice{
  text-align:center;
  font-size:11px;
  color:#80656a;
  padding:4px;
}

.players{
  display:flex;
  gap:6px;
  overflow:hidden;
}

.player{
  min-width:92px;
  flex:1;
  padding:7px 8px;
  border-radius:11px;
  background:#fff9ed;
  border:1px solid #ead1b2;
  font-size:10px;
}

.player b{
  display:block;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.player em{
  font-style:normal;
  color:#967579;
  font-size:9px;
}

.cta{
  width:100%;
  min-height:49px;
  border-radius:14px;
  background:
    linear-gradient(
      135deg,
      #e84a55,
      #f39b36
    );
  color:#fff9eb;
  font-weight:1000;
  font-size:15px;
  border:2px solid #b73243;
  box-shadow:0 4px 0 #9c2a38;
}

.cta.secondary{
  background:#fff8ea;
  color:#48232a;
  border:1.5px solid #d9b384;
  box-shadow:0 3px 0 #c39a70;
}

.cta:active{
  transform:translateY(2px);
}

.resultScore{
  font-size:40px;
  font-weight:1000;
  color:#d58b19;
  text-shadow:0 2px 0 #fff;
}

.rule{
  font-size:12px;
  line-height:1.65;
  color:#654a4e;
  text-align:left;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  background:#fff0c8;
  border:1px solid #e2b44f;
  color:#9a6414;
  font-size:10px;
  font-weight:900;
}

.muted{
  color:#967579;
}

@media(max-height:620px){

  .topbar{
    height:37px;
  }

  .iconBtn{
    width:33px;
    height:33px;
  }

  .jump{
    height:52px;
  }

  .panel{
    padding:9px;
  }

  .stat{
    padding:5px 3px;
  }

  .stat b{
    font-size:12px;
  }
}
</style>
</head>

<body>

<div id="app">
  <div class="shell">

    <div class="topbar">

      <div class="brand">
        🎪 爆爆馬戲團 · 極限跳火圈
      </div>

      <div class="topActions">

        <button
          id="soundBtn"
          class="iconBtn"
          aria-label="音效">
          🔊
        </button>

        <button
          id="helpBtn"
          class="iconBtn"
          aria-label="玩法">
          ?
        </button>

      </div>

    </div>

    <main id="main"></main>

  </div>
</div>

<script>
"use strict";

/* =========================================================
   BOOMROOM
   爆爆馬戲團：極限跳火圈
   完整改版

   本版本重要修改：

   1. 火圈高度使用固定 WORLD 座標
   2. 不再使用 H * 某個比例來決定火圈高度
   3. 火圈加大
   4. 人物縮小
   5. 人物跳躍時間增加
   6. 火圈改成 3D 斜視效果
   7. 火圈判定改成「真正的內洞」
   8. 不再使用舊版的圓形距離撞擊判定
   9. 畫面高低不會改變火圈遊戲高度
   ========================================================= */


/* =========================================================
   遊戲資料
   ========================================================= */

const GAME_INFO = Object.freeze({

  category:"arcade",

  name:"爆爆馬戲團：極限跳火圈",

  description:
    "馬戲團自動前進，抓準火圈高度點擊起跳；穿越中心得分，連續成功提高 Combo 與倍率。",

  entryCost:100,

  maxPlayers:8,

  controlModes:[
    "TOUCH",
    "MOUSE",
    "KEYBOARD"
  ]

});


/* =========================================================
   遊戲設定
   ========================================================= */

const CONFIG = Object.freeze({

  ENTRY_FEE:100,

  BASE_SPEED:210,

  MAX_SPEED:340,

  /*
   * 比原版稍微降低重力，
   * 讓人物在空中的時間更久。
   */
  GRAVITY:1320,

  /*
   * 跳躍初速度提高。
   */
  JUMP_VY:-625,

  /*
   * 玩家 X 固定在畫面約 23%。
   */
  PLAYER_X:.235,

  /*
   * 地面固定為 WORLD 座標。
   */
  WORLD_GROUND_Y:420,

  /*
   * 火圈中心固定高度。
   *
   * 注意：
   * 這裡是遊戲世界座標，
   * 不是 Canvas 高度比例。
   */
  RING_Y:300,

  /*
   * 火圈半徑。
   * 比原本 34~41 大很多。
   */
  RING_RADIUS:60,

  /*
   * 火圈真正的洞半徑。
   */
  RING_HOLE_RADIUS:43,

  /*
   * 火圈 3D 厚度。
   */
  RING_DEPTH_X:18,

  /*
   * 玩家縮小。
   */
  PLAYER_W:34,

  PLAYER_H:48,

  /*
   * PERFECT 判定。
   */
  PERFECT_WINDOW:.15,

  GOOD_WINDOW:.32,

  MISS_LIFE_LOSS:1,

  START_LIVES:3,

  MAX_RING_GAP:440,

  MIN_RING_GAP:290,

  ROUND_TIME:72,

  SCORE_GOOD:100,

  SCORE_PERFECT:180

});


/* =========================================================
   基本狀態
   ========================================================= */

let ME={
  id:"local_"+Math.random().toString(36).slice(2,10),
  username:"本地玩家",
  avatar:""
};

let players=new Map();

let sdkIsHost=false;

let gameRoomId="";

let state="LOBBY";

let canvas=null;

let ctx=null;

let wrap=null;

let raf=0;

let lastTime=0;

let W=360;

let H=500;

let dpr=1;

let muted=false;

let audioCtx=null;

let gameOverCalled=false;

let isPurchasing=false;

let hasPaid=false;


/* =========================================================
   分數 / 遊戲狀態
   ========================================================= */

let score=0;

let lives=CONFIG.START_LIVES;

let combo=0;

let bestCombo=0;

let rings=[];

let particles=[];

let floatingTexts=[];

let stars=[];

let distance=0;

let speed=CONFIG.BASE_SPEED;

let elapsed=0;

let ringId=0;

let nextRingX=0;

let lastInput=0;

let eventFeed=[];

let seeded=Date.now()>>>0;

let countdown=0;


/* =========================================================
   WORLD CAMERA
   ========================================================= */

/*
 * 這裡非常重要。
 *
 * 遊戲不是直接拿 Canvas 高度當作世界。
 *
 * 我們建立一個固定高度：
 *
 * WORLD_HEIGHT = 500
 *
 * 所有遊戲物件都以這個世界座標運作。
 *
 * Canvas 不管是 300 高還是 700 高，
 * 火圈的遊戲高度都一樣。
 */

const WORLD_WIDTH=760;

const WORLD_HEIGHT=500;


/* =========================================================
   玩家
   ========================================================= */

let player={

  x:0,

  y:0,

  groundY:CONFIG.WORLD_GROUND_Y,

  vy:0,

  w:CONFIG.PLAYER_W,

  h:CONFIG.PLAYER_H,

  onGround:true,

  airTime:0,

  rotation:0,

  hitCooldown:0

};


/* =========================================================
   工具
   ========================================================= */

function esc(s){

  return String(s||"")
    .replace(
      /[&<>"']/g,
      c=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
    );

}


function safeString(v,f,m){

  if(v==null)return f;

  const s=String(v).trim();

  return s?s.slice(0,m):f;

}


function clamp(v,a,b){

  return Math.max(
    a,
    Math.min(b,v)
  );

}


function lerp(a,b,t){

  return a+(b-a)*t;

}


function rand(a=0,b=1){

  seeded=(
    seeded*1664525+
    1013904223
  )>>>0;

  return a+
    ((seeded>>>0)/4294967296)*
    (b-a);

}


function isHost(){

  return sdkIsHost ||
    players.size<=1;

}


/* =========================================================
   玩家管理
   ========================================================= */

function addPlayer(
  id,
  username,
  avatar
){

  if(id==null)return;

  id=String(id);

  let p=players.get(id);

  if(!p){

    p={
      id,
      username:safeString(
        username,
        "玩家",
        12
      ),
      avatar:safeString(
        avatar,
        "",
        300
      ),
      score:0
    };

    players.set(id,p);

  }else{

    p.username=safeString(
      username,
      p.username,
      12
    );

  }

  return p;

}


/* =========================================================
   SDK
   ========================================================= */

function setupSDK(data){

  if(data&&data.user){

    players.delete(ME.id);

    ME.id=String(data.user.id);

    ME.username=safeString(
      data.user.username,
      "玩家",
      12
    );

    ME.avatar=safeString(
      data.user.avatar,
      "",
      300
    );

    addPlayer(
      ME.id,
      ME.username,
      ME.avatar
    );

  }

  sdkIsHost=!!(
    data &&
    data.isHost
  );

  gameRoomId=(
    data &&
    data.roomId
  )||"";

  if(
    Array.isArray(
      data &&
      data.roomPlayers
    )
  ){

    data.roomPlayers.forEach(
      p=>{
        if(p){
          addPlayer(
            p.id,
            p.username,
            p.avatar
          );
        }
      }
    );

  }

  render();

}


window.addEventListener(
  "message",
  e=>{

    try{

      const d=
        typeof e.data==="string"
          ?JSON.parse(e.data)
          :e.data;

      if(
        d &&
        d.action==="initSDK"
      ){

        setupSDK(d);

      }

      else if(
        d &&
        d.action==="gameEventReceived"
      ){

        handleGameEvent(
          d.eventName,
          d.payload,
          d.userId
        );

      }

    }catch(_){}

  }
);


window.onBoomRoomSDKReady=function(){

  try{

    if(window.BoomRoomSDK){

      setupSDK({

        user:
          window.BoomRoomSDK.getUser(),

        isHost:
          window.BoomRoomSDK.isHost,

        roomId:
          window.BoomRoomSDK.roomId,

        roomPlayers:
          window.BoomRoomSDK.roomPlayers||[]

      });

    }

  }catch(_){}

};


function sendEvent(
  eventName,
  payload
){

  try{

    if(
      window.BoomRoomSDK &&
      typeof window.BoomRoomSDK.sendGameEvent==="function"
    ){

      window.BoomRoomSDK.sendGameEvent(
        eventName,
        payload
      );

    }

    else if(
      window.parent!==window
    ){

      window.parent.postMessage(
        JSON.stringify({
          action:"sendGameEvent",
          eventName,
          payload
        }),
        "*"
      );

    }

  }catch(_){}

}


function handleGameEvent(
  name,
  payload,
  sender
){

  if(
    name==="CIRCUS_START" &&
    state==="LOBBY"
  ){

    startWithPayment(false);

  }

  if(
    name==="CIRCUS_SOUND"
  ){

    setMuted(
      !!(
        payload &&
        payload.muted
      ),
      false
    );

  }

}


/* =========================================================
   訊息
   ========================================================= */

function showMessage(
  big,
  small="",
  ms=650
){

  const box=
    document.getElementById(
      "centerMsg"
    );

  if(!box)return;

  box.innerHTML=`
    <div>
      <div class="msgBig">
        ${big}
      </div>

      <div class="msgSmall">
        ${small}
      </div>
    </div>
  `;

  box.classList.add("show");

  clearTimeout(
    showMessage.t
  );

  showMessage.t=setTimeout(
    ()=>{
      box.classList.remove("show");
    },
    ms
  );

}


function pushFeed(s){

  eventFeed.unshift(s);

  if(eventFeed.length>8){
    eventFeed.length=8;
  }

}


/* =========================================================
   音效
   ========================================================= */

function createAudio(){

  if(audioCtx||muted)return;

  try{

    audioCtx=
      new(
        window.AudioContext||
        window.webkitAudioContext
      )();

  }catch(_){}

}


function beep(
  freq=440,
  dur=.07,
  type="sine",
  gain=.035
){

  if(muted)return;

  try{

    createAudio();

    if(!audioCtx)return;

    if(
      audioCtx.state==="suspended"
    ){

      audioCtx.resume();

    }

    const o=
      audioCtx.createOscillator();

    const g=
      audioCtx.createGain();

    o.type=type;

    o.frequency.value=freq;

    g.gain.value=gain;

    o.connect(g);

    g.connect(
      audioCtx.destination
    );

    g.gain.setValueAtTime(
      gain,
      audioCtx.currentTime
    );

    g.gain.exponentialRampToValueAtTime(
      .0001,
      audioCtx.currentTime+dur
    );

    o.start();

    o.stop(
      audioCtx.currentTime+
      dur+
      .01
    );

  }catch(_){}

}


function setMuted(
  v,
  broadcast=true
){

  muted=!!v;

  const btn=
    document.getElementById(
      "soundBtn"
    );

  if(btn){

    btn.textContent=
      muted?"🔇":"🔊";

  }

  if(!muted){

    createAudio();

  }

  if(broadcast){

    sendEvent(
      "CIRCUS_SOUND",
      {muted}
    );

  }

}


/* =========================================================
   Canvas
   ========================================================= */

function initCanvas(){

  canvas=
    document.getElementById(
      "gameCanvas"
    );

  wrap=
    document.getElementById(
      "gameWrap"
    );

  if(!canvas||!wrap)return;

  const rect=
    wrap.getBoundingClientRect();

  W=Math.max(
    300,
    rect.width
  );

  H=Math.max(
    280,
    rect.height
  );

  dpr=Math.min(
    2,
    window.devicePixelRatio||1
  );

  canvas.width=
    Math.floor(W*dpr);

  canvas.height=
    Math.floor(H*dpr);

  ctx=canvas.getContext("2d");

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  /*
   * 玩家與火圈全部使用 WORLD 座標。
   */
  player.x=
    WORLD_WIDTH*
    CONFIG.PLAYER_X;

  player.groundY=
    CONFIG.WORLD_GROUND_Y;

  player.y=
    player.groundY-
    player.h;

}


function resize(){

  if(
    state==="PLAYING" ||
    state==="COUNTDOWN"
  ){

    initCanvas();

    buildBackground();

  }

}


window.addEventListener(
  "resize",
  resize
);


/* =========================================================
   背景
   ========================================================= */

function buildBackground(){

  stars=[];

  for(
    let i=0;
    i<75;
    i++
  ){

    stars.push({

      x:rand(
        0,
        WORLD_WIDTH
      ),

      y:rand(
        0,
        290
      ),

      r:rand(.5,1.8),

      a:rand(.25,.85),

      tw:rand(
        0,
        Math.PI*2
      )

    });

  }

}


/* =========================================================
   火圈
   ========================================================= */

function makeRing(
  x,
  y,
  kind="normal"
){

  /*
   * 這裡不再傳入畫面高度。
   *
   * y 永遠是：
   *
   * CONFIG.RING_Y
   *
   */

  return {

    id:++ringId,

    x,

    y,

    r:CONFIG.RING_RADIUS,

    holeR:CONFIG.RING_HOLE_RADIUS,

    depth:CONFIG.RING_DEPTH_X,

    passed:false,

    scored:false,

    kind,

    pulse:rand(
      0,
      Math.PI*2
    ),

    rot:rand(
      -.08,
      .08
    ),

    flame:rand(
      0,
      Math.PI*2
    )

  };

}


/* =========================================================
   建立下一個火圈
   ========================================================= */

function nextRing(){

  const difficulty=
    clamp(
      elapsed/
      CONFIG.ROUND_TIME,
      0,
      1
    );

  const gap=
    lerp(
      CONFIG.MAX_RING_GAP,
      CONFIG.MIN_RING_GAP,
      difficulty
    );

  nextRingX=
    Math.max(
      nextRingX+
      gap+
      rand(-18,18),

      W+220
    );

  /*
   * ★★★ 最重要 ★★★
   *
   * 火圈高度完全固定。
   *
   * 不管 H 是多少，
   * 火圈永遠是 WORLD Y = 300。
   */

  const y=
    CONFIG.RING_Y;

  let kind="normal";

  if(
    difficulty>.18 &&
    rand()<.10
  ){

    kind="gold";

  }

  /*
   * 不再產生 tiny 火圈。
   * 避免難以判斷。
   */

  rings.push(
    makeRing(
      nextRingX,
      y,
      kind
    )
  );

}

/* =========================================================

   ========================================================= */

function beginRound(){

  if(
    state!=="LOBBY"
  ){

    return;

  }

  state="COUNTDOWN";

  countdown=3;

  gameOverCalled=false;

  resetWorld();

  render();

  showMessage(
    "3",
    "準備跳過火圈"
  );

  const tick=()=>{

    if(
      state!=="COUNTDOWN"
    ){

      return;

    }

    countdown--;

    if(
      countdown>0
    ){

      showMessage(
        String(countdown),
        "看準火圈中心"
      );

      beep(
        420,
        .08,
        "square",
        .035
      );

      setTimeout(
        tick,
        700
      );

    }else{

      if(
        state!=="COUNTDOWN"
      ){

        return;

      }

      showMessage(
        "GO!",
        "起跳！",
        500
      );

      beep(
        760,
        .12,
        "sine",
        .045
      );

      state="PLAYING";

      lastTime=
        performance.now();

      render();

      startLoop();

    }

  };

  setTimeout(
    tick,
    700
  );

}


/* =========================================================
   跳躍
   ========================================================= */

function jump(){

  if(
    state!=="PLAYING"
  ){

    return;

  }

  const now=
    performance.now();

  if(
    now-lastInput<100
  ){

    return;

  }

  lastInput=now;

  createAudio();

  /*
   * 正常起跳。
   */

  if(player.onGround){

    player.vy=
      CONFIG.JUMP_VY;

    player.onGround=false;

    player.airTime=0;

    beep(
      330,
      .06,
      "triangle",
      .025
    );

    spawnBurst(
      player.x+
        player.w*.5,
      player.y+
        player.h,
      7,
      "dust"
    );

    return;

  }

  /*
   * 不做二段跳。
   *
   * 但是如果人物已經接近下降段，
   * 給予一個小幅「空中修正」。
   *
   * 這仍然不是二段跳。
   */

  if(
    player.airTime>.42 &&
    player.vy>120
  ){

    player.vy=-180;

    beep(
      260,
      .045,
      "triangle",
      .018
    );

  }

}

/* =========================================================
   主迴圈
   ========================================================= */

function startLoop(){

  cancelAnimationFrame(
    raf
  );

  lastTime=
    performance.now();

  const loop=t=>{

    if(
      state!=="PLAYING"
    ){

      return;

    }

    const dt=
      Math.min(
        .033,
        Math.max(
          .001,
          (t-lastTime)/1000
        )
      );

    lastTime=t;

    update(dt);

    draw();

    raf=
      requestAnimationFrame(
        loop
      );

  };

  raf=
    requestAnimationFrame(
      loop
    );

}


/* =========================================================
   更新
   ========================================================= */

function update(dt){

  elapsed+=dt;

  distance+=
    speed*dt;

  speed=
    lerp(
      CONFIG.BASE_SPEED,
      CONFIG.MAX_SPEED,
      clamp(
        elapsed/
        CONFIG.ROUND_TIME,
        0,
        1
      )
    );

  /*
   * 玩家固定 WORLD X。
   */

  player.x=
    WORLD_WIDTH*
    CONFIG.PLAYER_X;

  player.groundY=
    CONFIG.WORLD_GROUND_Y;

  player.hitCooldown=
    Math.max(
      0,
      player.hitCooldown-dt
    );


  /* =======================================================
     玩家物理
     ======================================================= */

  if(
    !player.onGround
  ){

    player.airTime+=dt;

    player.y+=
      player.vy*dt;

    player.vy+=
      CONFIG.GRAVITY*dt;

    player.rotation=
      clamp(
        player.vy/1000,
        -.48,
        .55
      );

    if(
      player.y>=
      player.groundY-
      player.h
    ){

      player.y=
        player.groundY-
        player.h;

      player.vy=0;

      player.onGround=true;

      player.airTime=0;

      player.rotation=0;

      spawnBurst(
        player.x+
          player.w*.5,
        player.y+
          player.h,
        8,
        "dust"
      );

    }

  }


  /* =======================================================
     火圈移動
     ======================================================= */

  for(
    const r of rings
  ){

    r.x-=
      speed*dt;

    r.pulse+=
      dt*5;

    r.flame+=
      dt*9;


    /*
     * =====================================================
     * 真正穿圈判定
     * =====================================================
     *
     * 不再使用：
     *
     * hypot(player - ring) > r*0.62
     *
     * 那種方式會導致碰撞很奇怪。
     *
     * 現在只判斷：
     *
     * 1. 玩家中心 X 通過火圈
     * 2. 玩家中心 Y 在火圈洞內
     *
     * 火圈外框完全不算。
     */

    if(
      !r.passed
    ){

      const pcx=
        player.x+
        player.w*.5;

      /*
       * 人物真正的身體中心。
       */
      const pcy=
        player.y+
        player.h*.52;


      /*
       * 火圈的水平穿越範圍。
       *
       * 稍微放寬，
       * 讓手機操作比較容易。
       */

      const xDistance=
        Math.abs(
          pcx-r.x
        );


      /*
       * 玩家身體中心必須進入
       * 火圈洞。
       */

      const yDistance=
        Math.abs(
          pcy-r.y
        );


      /*
       * ★ 火圈真正的洞 ★
       *
       * 內洞半徑 43。
       *
       * 這裡再留一點容錯。
       */

      const holeLimit=
        r.holeR-7;


      /*
       * 人物穿越火圈。
       */

      if(
        xDistance<=22 &&
        yDistance<=holeLimit
      ){

        scoreRing(
          r,
          yDistance
        );

      }

    }


    /*
     * =====================================================
     * 撞火圈判定
     * =====================================================
     *
     * 只有當玩家身體中心在火圈外，
     * 而且真的接近火圈邊緣時才算撞。
     *
     * 不再因為人物「碰到外框」就提早死亡。
     */

    if(
      !r.passed &&
      player.hitCooldown<=0
    ){

      const pcx=
        player.x+
        player.w*.5;

      const pcy=
        player.y+
        player.h*.52;

      const dx=
        Math.abs(
          pcx-r.x
        );

      const dy=
        Math.abs(
          pcy-r.y
        );

      /*
       * 只在火圈附近判定。
       */

      if(
        dx<30 &&
        dy<r.r
      ){

        const distanceFromCenter=
          Math.sqrt(
            dx*dx+
            dy*dy
          );

        /*
         * 在洞裡不碰撞。
         *
         * 只有接近外圈才撞。
         */

        if(
          distanceFromCenter>
          r.holeR+5
        ){

          hitRing(r);

        }

      }

    }

  }


  /* =======================================================
     清除火圈
     ======================================================= */

  rings=
    rings.filter(
      r=>r.x>-160
    );


  /*
   * 補火圈。
   */

  while(
    nextRingX<
    W+
    CONFIG.MAX_RING_GAP*1.7
  ){

    nextRing();

  }


  /* =======================================================
     粒子
     ======================================================= */

  for(
    const p of particles
  ){

    p.x+=
      p.vx*dt;

    p.y+=
      p.vy*dt;

    p.vy+=
      p.g*dt;

    p.life-=dt;

    p.rot+=
      p.vr*dt;

  }

  particles=
    particles.filter(
      p=>p.life>0
    );


  /* =======================================================
     飄字
     ======================================================= */

  for(
    const f of floatingTexts
  ){

    f.y+=
      f.vy*dt;

    f.life-=dt;

  }

  floatingTexts=
    floatingTexts.filter(
      f=>f.life>0
    );


  /* =======================================================
     時間
     ======================================================= */

  if(
    elapsed>=
    CONFIG.ROUND_TIME
  ){

    finishGame(
      "🏁 完美演出！"
    );

  }

}


/* =========================================================
   成功穿圈
   ========================================================= */

function scoreRing(
  r,
  yDistance
){

  r.passed=true;

  r.scored=true;


  const normalized=
    yDistance/
    r.holeR;


  if(
    normalized<=
    CONFIG.PERFECT_WINDOW
  ){

    combo++;

    bestCombo=
      Math.max(
        bestCombo,
        combo
      );

    const gain=
      CONFIG.SCORE_PERFECT+
      Math.min(
        220,
        combo*12
      )+
      (
        r.kind==="gold"
          ?100
          :0
      );

    score+=gain;

    pushFeed(
      `🔥 PERFECT 穿圈！ +${gain}`
    );

    floatingTexts.push({

      x:r.x,

      y:r.y-70,

      text:
        `PERFECT  +${gain}`,

      life:1,

      vy:-42,

      type:"perfect"

    });

    spawnBurst(
      r.x,
      r.y,
      26,
      "fire"
    );

    beep(
      900+
        Math.min(
          combo,
          8
        )*45,
      .12,
      "sine",
      .045
    );

  }

  else{

    combo++;

    bestCombo=
      Math.max(
        bestCombo,
        combo
      );

    const gain=
      CONFIG.SCORE_GOOD+
      Math.min(
        150,
        combo*8
      )+
      (
        r.kind==="gold"
          ?80
          :0
      );

    score+=gain;

    pushFeed(
      `🎪 漂亮穿越！ +${gain}`
    );

    floatingTexts.push({

      x:r.x,

      y:r.y-60,

      text:
        `GOOD  +${gain}`,

      life:1,

      vy:-38,

      type:"good"

    });

    spawnBurst(
      r.x,
      r.y,
      16,
      "spark"
    );

    beep(
      620,
      .08,
      "triangle",
      .035
    );

  }

}


/* =========================================================
   撞火圈
   ========================================================= */

function hitRing(r){

  lives--;

  combo=0;

  r.passed=true;

  r.x=-200;

  pushFeed(
    "💥 撞到火圈！生命 -1"
  );

  );

/* =========================================================
   結束
   ========================================================= */

function finishGame(title){

  if(
    state==="RESULT"
  ){

    return;

  }

  state="RESULT";

  cancelAnimationFrame(
    raf
  );

  pushFeed(
    `${title} 最終得分 ${score}`
  );

  if(
    !gameOverCalled
  ){

    gameOverCalled=true;

    try{

      if(
        window.BoomRoomSDK &&
        typeof window.BoomRoomSDK.gameOver==="function"
      ){

        window.BoomRoomSDK.gameOver(
          score
        );

      }

    }catch(_){}

  }

  render();

}


/* =========================================================
   粒子
   ========================================================= */

function spawnBurst(
  x,
  y,
  n,
  type
){

  for(
    let i=0;
    i<n;
    i++
  ){

    let c=
      type==="hit"
        ?"red"
        :
      type==="dust"
        ?"dust"
        :
      type==="fire"
        ?"fire"
        :
        "spark";

    particles.push({

      x,

      y,

      vx:rand(
        -120,
        120
      ),

      vy:rand(
        -170,
        -30
      ),

      g:
        type==="dust"
          ?260
          :360,

      life:rand(
        .35,
        .8
      ),

      max:.8,

      size:rand(
        2,
        6
      ),

      rot:rand(
        0,
        Math.PI*2
      ),

      vr:rand(
        -5,
        5
      ),

      type:c

    });

  }

}


/* =========================================================
   世界轉換
   ========================================================= */

/*
 * WORLD 座標 -> SCREEN 座標
 *
 * 這是本版最重要的地方。
 *
 * 火圈與玩家永遠先在 760x500 世界裡計算。
 *
 * Canvas 只是把世界等比例縮放到螢幕。
 */

function worldScale(){

  /*
   * 讓整個遊戲世界固定比例。
   */

  const sx=
    W/WORLD_WIDTH;

  const sy=
    H/WORLD_HEIGHT;

  /*
   * Y 可以使用整個世界高度。
   *
   * 不再直接讓 ring.y = H * 0.xxx。
   */

  return {
    sx,
    sy
  };

}


function worldX(x){

  return x*
    worldScale().sx;

}


function worldY(y){

  return y*
    worldScale().sy;

}


function worldSize(v){

  const s=
    worldScale();

  return v*
    Math.min(
      s.sx,
      s.sy
    );

}


/* =========================================================
   繪圖
   ========================================================= */

function draw(){

  if(!ctx)return;

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  /*
   * 所有繪圖先進入 WORLD。
   */

  const sx=
    W/WORLD_WIDTH;

  const sy=
    H/WORLD_HEIGHT;

  ctx.save();

  ctx.scale(
    sx,
    sy
  );

  drawSky();

  drawTent();

  drawGround();

  /*
   * 火圈。
   */

  rings.forEach(
    drawRing
  );

  /*
   * 玩家。
   */

  drawPlayer();

  particles.forEach(
    drawParticle
  );

  floatingTexts.forEach(
    drawFloat
  );

  drawVignette();

  ctx.restore();

}


/* =========================================================
   天空
   ========================================================= */

function drawSky(){

  const g=
    ctx.createLinearGradient(
      0,
      0,
      0,
      WORLD_HEIGHT
    );

  g.addColorStop(
    0,
    "#f8d9a8"
  );

  g.addColorStop(
    .52,
    "#f7c982"
  );

  g.addColorStop(
    1,
    "#ed9b66"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    0,
    WORLD_WIDTH,
    WORLD_HEIGHT
  );


  /*
   * 舞台燈。
   */

  const beams=[

    {
      x:WORLD_WIDTH*.16,
      a:.15,
      r:90
    },

    {
      x:WORLD_WIDTH*.50,
      a:.18,
      r:110
    },

    {
      x:WORLD_WIDTH*.84,
      a:.15,
      r:90
    }

  ];


  for(
    const b of beams
  ){

    const rg=
      ctx.createRadialGradient(
        b.x,
        105,
        4,
        b.x,
        180,
        b.r
      );

    rg.addColorStop(
      0,
      "rgba(255,248,201,.65)"
    );

    rg.addColorStop(
      1,
      "rgba(255,248,201,0)"
    );

    ctx.fillStyle=rg;

    ctx.fillRect(
      b.x-b.r,
      10,
      b.r*2,
      270
    );

  }


  /*
   * 小燈泡。
   */

  for(
    let x=18;
    x<WORLD_WIDTH;
    x+=34
  ){

    ctx.fillStyle=
      "#ffe9a7";

    ctx.beginPath();

    ctx.arc(
      x,
      75,
      2.2,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* =========================================================
   帳篷
   ========================================================= */

function drawTent(){

  const top=28;

  ctx.save();


  /*
   * 屋頂。
   */

  ctx.fillStyle=
    "#f7e4bd";

  ctx.beginPath();

  ctx.moveTo(
    0,
    top+72
  );

  ctx.lineTo(
    WORLD_WIDTH*.5,
    top
  );

  ctx.lineTo(
    WORLD_WIDTH,
    top+72
  );

  ctx.closePath();

  ctx.fill();


  const stripeW=
    WORLD_WIDTH/7;

  for(
    let i=-1;
    i<8;
    i++
  ){

    ctx.fillStyle=
      i%2===0
        ?" #d83c4d".trim()
        :"#fff0cf";

    ctx.beginPath();

    ctx.moveTo(
      WORLD_WIDTH*.5,
      top
    );

    ctx.lineTo(
      WORLD_WIDTH*.5+
        (i-3)*stripeW,
      top+72
    );

    ctx.lineTo(
      WORLD_WIDTH*.5+
        (i-2)*stripeW,
      top+72
    );

    ctx.closePath();

    ctx.fill();

  }


  /*
   * 旗子。
   */

  ctx.fillStyle=
    "#f2b53e";

  ctx.beginPath();

  ctx.arc(
    WORLD_WIDTH*.5,
    top,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.strokeStyle=
    "#a33b46";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(
    WORLD_WIDTH*.5,
    top-3
  );

  ctx.lineTo(
    WORLD_WIDTH*.5,
    top-24
  );

  ctx.stroke();


  ctx.fillStyle=
    "#d83c4d";

  ctx.beginPath();

  ctx.moveTo(
    WORLD_WIDTH*.5,
    top-24
  );

  ctx.lineTo(
    WORLD_WIDTH*.5+22,
    top-18
  );

  ctx.lineTo(
    WORLD_WIDTH*.5,
    top-13
  );

  ctx.closePath();

  ctx.fill();


  /*
   * 柱子。
   */

  ctx.fillStyle=
    "#b53a45";

  ctx.fillRect(
    7,
    top+54,
    10,
    140
  );

  ctx.fillRect(
    WORLD_WIDTH-17,
    top+54,
    10,
    140
  );


  /*
   * 觀眾。
   */

  const ay=360;

  for(
    let x=8;
    x<WORLD_WIDTH;
    x+=23
  ){

    const bob=
      Math.sin(
        x*1.7+
        performance.now()/350
      )*1.5;

    ctx.fillStyle=

    ctx.beginPath();

    ctx.arc(

      0,

    );

    ctx.fill();

  }

}

/* =========================================================
   3D 斜視火圈
   ========================================================= */

function drawRing(r){

  const pulse=
    Math.sin(r.pulse)*1.5;

  const rr=
    r.r+
    pulse;

  /*
   * 火圈 3D 斜視。
   *
   * 正面不是一個單純的平面圓，
   * 而是有「後層 + 前層」。
   */

  ctx.save();

  ctx.translate(
    r.x,
    r.y
  );


  /*
   * 火圈向右後方偏移。
   */

  const depth=
    r.depth;


  /* =======================================================
     後方陰影
     ======================================================= */

  ctx.save();

  ctx.translate(
    depth,
    -depth*.35
  );

  ctx.strokeStyle=
    "rgba(92,31,39,.35)";

  ctx.lineWidth=16;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    rr,
    0,
    Math.PI*2
  );

  ctx.stroke();

  ctx.restore();


  /* =======================================================
     3D 側面
     ======================================================= */

  ctx.strokeStyle=
    r.kind==="gold"
      ?"#c28b25"
      :"#9d2638";

  ctx.lineWidth=18;

  ctx.beginPath();

  ctx.arc(
    5,
    -2,
    rr,
    0,
    Math.PI*2
  );

  ctx.stroke();


  /* =======================================================
     正面外圈
     ======================================================= */

  ctx.shadowBlur=18;

  ctx.shadowColor=
    r.kind==="gold"
      ?"rgba(255,210,75,.85)"
      :"rgba(224,55,54,.70)";

  ctx.strokeStyle=
    r.kind==="gold"
      ?"#e6ad35"
      :"#d32f43";

  ctx.lineWidth=15;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    rr,
    0,
    Math.PI*2
  );

  ctx.stroke();

  ctx.shadowBlur=0;


  /* =======================================================
     金色高光
     ======================================================= */

  ctx.strokeStyle=
    "#ffe6a0";

  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    rr-7,
    0,
    Math.PI*2
  );

  ctx.stroke();


  /* =======================================================
     中間真正的空洞
     ======================================================= */

  /*
   * 用背景色製造清楚的空心。
   *
   * 注意：
   * 這裡故意不畫任何火焰。
   */

  ctx.fillStyle=
    "rgba(255,230,173,.30)";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r.holeR,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
   * 洞口內側暗邊，
   * 讓 3D 感更明顯。
   */

  ctx.strokeStyle=
    "rgba(106,34,42,.38)";

  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r.holeR,
    0,
    Math.PI*2
  );

  ctx.stroke();


  /* =======================================================
     火焰
     ======================================================= */

  const flames=16;

  for(
    let i=0;
    i<flames;
    i++
  ){

    const a=
      i/flames*
      Math.PI*2+
      r.flame*.025;

    const wob=
      .72+
      .28*
      Math.sin(
        r.flame+
        i*1.7
      );

    /*
     * 火焰在外圈。
     */

    const x=
      Math.cos(a)*
      (rr+11);

    const y=
      Math.sin(a)*
      (rr+11);

    ctx.save();

    ctx.translate(
      x,
      y
    );

    ctx.rotate(
      a+
      Math.PI/2
    );

    ctx.fillStyle=
      i%2
        ?"#f26a27"
        :"#ffd04b";

    ctx.beginPath();

    ctx.moveTo(
      0,
      -12*wob
    );

    ctx.quadraticCurveTo(
      7,
      -2,
      0,
      9
    );

    ctx.quadraticCurveTo(
      -7,
      -2,
      0,
      -12*wob
    );

    ctx.fill();

    ctx.restore();

  }


  /* =======================================================
     BONUS
     ======================================================= */

  if(
    r.kind==="gold"
  ){

    ctx.fillStyle=
      "#fff2a7";

    ctx.font=
      "900 12px system-ui";

    ctx.textAlign=
      "center";

    ctx.textBaseline=
      "middle";

    ctx.fillText(
      "BONUS",
      0,
      0
    );

  }


  ctx.restore();

}


/* =========================================================
   玩家
   ========================================================= */

function drawPlayer(){

  const p=player;

  ctx.save();

  ctx.translate(
    p.x+
      p.w*.5,
    p.y+
      p.h*.5
  );

  ctx.rotate(
    p.rotation
  );


  /*
   * 跳躍陰影。
   */

  if(
    !p.onGround
  ){

    ctx.save();

    ctx.globalAlpha=.18;

    ctx.fillStyle=
      "#5a2731";

    ctx.beginPath();

    ctx.ellipse(
      0,
      p.h*.67,
      18,
      5,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();

  }


  /* =======================================================
     腿
     ======================================================= */

  ctx.strokeStyle=
    "#f8c9a8";

  ctx.lineWidth=6;

  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(
    -6,
    14
  );

  ctx.lineTo(
    -9,
    24
  );

  ctx.moveTo(
    6,
    14
  );

  ctx.lineTo(
    9,
    24
  );

  ctx.stroke();


  /* 鞋 */

  ctx.strokeStyle=
    "#6b2639";

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(
    -10,
    24
  );

  ctx.lineTo(
    -15,
    24
  );

  ctx.moveTo(
    10,
    24
  );

  ctx.lineTo(
    15,
    24
  );

  ctx.stroke();


  /* =======================================================
     身體
     ======================================================= */

  const body=
    ctx.createLinearGradient(
      -13,
      -7,
      13,
      18
    );

  body.addColorStop(
    0,
    "#e94358"
  );

  body.addColorStop(
    1,
    "#a52348"
  );

  ctx.fillStyle=body;

  ctx.beginPath();

  ctx.roundRect(
    -13,
    -9,
    26,
    28,
    8
  );

  ctx.fill();


  /*
   * 黃腰帶。
   */

  ctx.fillStyle=
    "#ffd55c";

  ctx.fillRect(
    -12,
    1,
    24,
    4
  );


  /* =======================================================
     手
     ======================================================= */

  ctx.strokeStyle=
    "#f8c9a8";

  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(
    -11,
    -1
  );

  ctx.lineTo(
    -19,
    6
  );

  ctx.moveTo(
    11,
    -1
  );

  ctx.lineTo(
    19,
    6
  );

  ctx.stroke();


  /* =======================================================
     頭
     ======================================================= */

  ctx.fillStyle=
    "#f8c9a8";

  ctx.beginPath();

  ctx.arc(
    0,
    -18,
    12,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* =======================================================
     帽子
     ======================================================= */

  ctx.fillStyle=
    "#d7354d";

  ctx.beginPath();

  ctx.moveTo(
    -11,
    -26
  );

  ctx.lineTo(
    0,
    -44
  );

  ctx.lineTo(
    11,
    -26
  );

  ctx.closePath();

  ctx.fill();


  ctx.fillStyle=
    "#ffd35a";

  ctx.fillRect(
    -13,
    -27,
    26,
    4
  );


  ctx.fillStyle=
    "#f6c54a";

  ctx.beginPath();

  ctx.arc(
    0,
    -45,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* =======================================================
     臉
     ======================================================= */

  ctx.fillStyle=
    "#40202a";

  ctx.beginPath();

  ctx.arc(
    -4,
    -18,
    1.5,
    0,
    Math.PI*2
  );

  ctx.arc(
    4,
    -18,
    1.5,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.strokeStyle=
    "#8b3c4c";

  ctx.lineWidth=1.3;

  ctx.beginPath();

  ctx.arc(
    0,
    -15,
    4,
    .15,
    Math.PI-.15
  );

  ctx.stroke();


  ctx.restore();


  /*
   * 空中光圈。
   */

  if(
    !p.onGround
  ){

    ctx.save();

    ctx.globalAlpha=.23;

    ctx.strokeStyle=
      "#fff1a0";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
      p.x+
        p.w*.5,
      p.y+
        p.h*.5,
      25+
        Math.sin(
          performance.now()/90
        )*2,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.restore();

  }

}

function drawParticle(p){

  ctx.save();

  ctx.globalAlpha=
    clamp(
      p.life/
      (p.max||.8),
      0,
      1
    );

  ctx.translate(
    p.x,
    p.y
  );

  ctx.rotate(
    p.rot
  );

  ctx.fillStyle=
    p.type==="red"
      ?"#ff3f32"
      :
    p.type==="dust"
      ?"#d9a07b"
      :
    p.type==="fire"
      ?"#ffb52e"
      :
      "#ffe36a";

  ctx.fillRect(
    -p.size*.5,
    -p.size*.5,
    p.size,
    p.size
  );

  ctx.restore();

}


function drawFloat(f){

  ctx.save();

  ctx.globalAlpha=
    clamp(
      f.life,
      0,
      1
    );

  ctx.font=
    `1000 ${
      f.type==="perfect"
        ?20
        :15
    }px system-ui`;

  ctx.textAlign=
    "center";

  ctx.fillStyle=
    f.type==="perfect"
      ?"#fff19b"
      :
    f.type==="bad"
      ?"#ff7a7a"
      :
      "#ffd05a";

  ctx.shadowBlur=10;

  ctx.shadowColor=
    ctx.fillStyle;

  ctx.fillText(
    f.text,
    f.x,
    f.y
  );

  ctx.restore();

}

function render(){

  const main=
    document.getElementById(
      "main"
    );

  if(!main)return;

  if(
    state==="LOBBY"
  ){

    renderLobby();

  }

  else if(
    state==="COUNTDOWN"
  ){

    renderPlaying();

  }

  else if(
    state==="PLAYING"
  ){

    renderPlaying();

  }

  else if(
    state==="RESULT"
  ){

    renderResult();

  }

}
