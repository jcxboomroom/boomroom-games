<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<meta name="theme-color" content="#070912">

<title>爆爆皮卡丘排球</title>

<style>
:root{
  --bg:#070912;
  --panel:#111625;
  --panel2:#161c2d;
  --line:#2b3550;
  --text:#f7f8fb;
  --muted:#98a3ba;

  --cyan:#62e7ff;
  --purple:#b76cff;
  --green:#4ee08a;
  --red:#ff637a;
  --gold:#ffd166;

  --t:env(safe-area-inset-top,0px);
  --b:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

  user-select:none;
  -webkit-user-select:none;
}

body{
  overscroll-behavior:none;
}

button{
  font:inherit;
  border:0;
  color:var(--text);
  cursor:pointer;
  touch-action:none;
}

button:disabled{
  opacity:.4;
  cursor:default;
}

#app{
  width:100%;
  height:100dvh;
  display:flex;
  justify-content:center;
}

.shell{
  width:min(100%,760px);
  height:100%;
  display:flex;
  flex-direction:column;

  padding:
    calc(8px + var(--t))
    10px
    calc(8px + var(--b));

  gap:8px;
}

.screen{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.panel{
  background:
    linear-gradient(
      180deg,
      var(--panel2),
      var(--panel)
    );

  border:1px solid var(--line);
  border-radius:18px;
  padding:12px;
}

.center{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.stat{
  padding:8px 5px;
  background:#0b0f18;
  border:1px solid var(--line);
  border-radius:12px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:15px;
}

.stat span{
  font-size:9px;
  color:var(--muted);
}

.sectionTitle{
  font-size:13px;
  font-weight:1000;
  margin-bottom:8px;
}

.muted{
  color:var(--muted);
}

.tiny{
  font-size:10px;
  line-height:1.45;
}

.cta{
  width:100%;
  min-height:48px;
  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      var(--cyan),
      var(--purple)
    );

  color:#070912;
  font-weight:1000;
  font-size:15px;
}

.cta.secondary{
  background:#192032;
  color:#fff;
  border:1px solid var(--line);
}

.cta.danger{
  background:
    linear-gradient(
      135deg,
      #ff4d6d,
      #e63946
    );

  color:#fff;
}

.cta:active{
  transform:scale(.97);
}

.notice{
  min-height:22px;
  color:#d1d6e4;
  font-size:11px;
  text-align:center;
}

.players{
  display:flex;
  gap:6px;
  overflow-x:auto;
}

.player{
  min-width:100px;
  padding:6px 8px;
  border-radius:11px;
  background:#0b101c;
  border:1px solid var(--line);
  font-size:10px;
  flex:none;
}

.player b{
  display:block;
  font-size:12px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.player em{
  display:block;
  font-style:normal;
  color:var(--muted);
}

/* =========================
   GAME AREA
========================= */

#canvasWrap{
  position:relative;
  flex:1;

  /*
    重要：
    不再讓 Canvas 自己跟著高度亂變。
    遊戲世界永遠維持 360 x 250。
  */

  min-height:300px;

  border-radius:16px;
  overflow:hidden;

  border:1px solid var(--line);

  background:
    linear-gradient(
      180deg,
      #1a2035,
      #070912
    );

  display:flex;
  align-items:center;
  justify-content:center;
}

#gameCanvas{
  display:block;

  /*
    Canvas 世界尺寸固定。
    實際顯示由 JS 等比例縮放。
  */

  width:100%;
  height:100%;

  touch-action:none;
}

/* =========================
   TOUCH CONTROLS
========================= */

.ctrlGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;

  margin-top:2px;
}

.ctrlBtn{
  height:56px;

  border-radius:15px;

  background:
    linear-gradient(
      180deg,
      #1b263e,
      #11192a
    );

  border:1px solid var(--line);

  font-size:20px;
  font-weight:900;

  color:var(--cyan);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    0 4px 12px rgba(0,0,0,.2);

  touch-action:none;
}

.ctrlBtn:active,
.ctrlBtn.active{
  background:var(--cyan);
  color:#070912;

  transform:translateY(2px);
}

.ctrlBtn.jump{
  color:var(--gold);
}

.ctrlBtn.smash{
  color:var(--red);
}

.feedBox{
  max-height:65px;
  overflow-y:auto;

  font-size:11px;

  background:#0b0f18;
  border:1px solid var(--line);
  border-radius:10px;

  padding:6px;
}

/* =========================
   COUNTDOWN
========================= */

.countdownOverlay{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:none;

  background:
    radial-gradient(
      circle,
      rgba(10,15,30,.15),
      rgba(5,7,15,.5)
    );
}

.countdownText{
  font-size:64px;
  font-weight:1000;

  color:#fff;

  text-shadow:
    0 0 12px rgba(98,231,255,.8),
    0 0 35px rgba(183,108,255,.5);

  animation:countPop .7s ease-out;
}

@keyframes countPop{
  0%{
    transform:scale(.5);
    opacity:0;
  }

  40%{
    transform:scale(1.2);
    opacity:1;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }
}

/* =========================
   LANDSCAPE PHONE
========================= */

@media(max-height:520px){

  .shell{
    padding-top:4px;
    padding-bottom:4px;
    gap:4px;
  }

  .stats{
    gap:3px;
  }

  .stat{
    padding:4px;
  }

  .stat b{
    font-size:12px;
  }

  .stat span{
    font-size:8px;
  }

  #canvasWrap{
    min-height:210px;
  }

  .ctrlBtn{
    height:44px;
  }

  .feedBox{
    max-height:42px;
  }
}

@media(min-width:600px){

  .ctrlBtn{
    height:58px;
  }

  #canvasWrap{
    min-height:330px;
  }
}
</style>
</head>

<body>

<div id="app">
  <div class="shell">

    <main id="main" class="screen"></main>

  </div>
</div>

<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const CONFIG = Object.freeze({

  ENTRY_FEE:100,

  MIN_PLAYERS:1,
  MAX_PLAYERS:8,

  /*
    遊戲世界固定尺寸。
    所有物理運算都在這個座標系統。
  */

  WORLD_W:360,
  WORLD_H:250,

  GROUND_Y:238,

  NET_X:180,
  NET_TOP:145,
  NET_BOTTOM:238,

  PLAYER_SIZE:32,

  BALL_RADIUS:10,

  /*
    角色速度
  */

  PLAYER_SPEED:2.6,

  PLAYER_ACCEL:.65,

  PLAYER_FRICTION:.78,

  PLAYER_MAX_SPEED:4.2,

  JUMP_POWER:8.8,

  GRAVITY:.38,

  BALL_GRAVITY:.17,

  BALL_MAX_SPEED:7.5,

  /*
    每球開始前倒數
  */

  SERVE_COUNTDOWN:3,

  WIN_SCORE:5
});


/* =========================================================
   SDK / ROOM
========================================================= */

let ME = {

  id:
    "local_" +
    Math.random()
      .toString(36)
      .slice(2,10),

  username:"本地玩家",

  avatar:"",

  joinedAt:Date.now()
};

let sdkIsHost=false;

let gameRoomId="";

let players=new Map();


/* =========================================================
   GAME STATE
========================================================= */

let state="LOBBY";

/*
  LOBBY
  COUNTDOWN
  PLAYING
  RESULT
*/

let scoreP1=0;
let scoreP2=0;

let feed=[];

let countdownValue=0;
let countdownTimer=null;


/* =========================================================
   CANVAS
========================================================= */

let canvas=null;
let ctx=null;

let canvasScale=1;

let gameLoopId=null;

let lastTime=0;


/* =========================================================
   INPUT
========================================================= */

const keys={

  left:false,
  right:false,
  jump:false,
  smash:false
};


/* =========================================================
   PLAYER
========================================================= */

const p1={

  x:75,
  y:206,

  w:32,
  h:32,

  vx:0,
  vy:0,

  color:"#ffd166",

  onGround:true,

  jumpLock:false,

  smashTimer:0
};


const p2={

  x:253,
  y:206,

  w:32,
  h:32,

  vx:0,
  vy:0,

  color:"#ff637a",

  onGround:true
};


/* =========================================================
   BALL
========================================================= */

const ball={

  x:180,
  y:100,

  vx:0,
  vy:0,

  r:10,

  active:false,

  lastHit:"",

  hitCooldown:0
};


/* =========================================================
   HELPERS
========================================================= */

function isHost(){

  return sdkIsHost || players.size<=1;

}


function safeString(v,fallback,maxLen){

  if(v===null || v===undefined){

    return fallback;

  }

  const s=String(v).trim();

  return s
    ? s.slice(0,maxLen)
    : fallback;
}


function addPlayer(id,username,avatar){

  if(!id) return;

  id=String(id);

  let p=players.get(id);

  if(!p){

    p={

      id,

      username:safeString(
        username,
        "玩家",
        12
      ),

      avatar:safeString(
        avatar,
        "",
        300
      ),

      score:0
    };

    players.set(id,p);

  }else{

    p.username=safeString(
      username,
      p.username,
      12
    );

  }

  return p;
}


function esc(s){

  return String(s||"")
    .replace(
      /[&<>"']/g,
      c=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
    );

}


/* =========================================================
   SDK
========================================================= */

function setupSDK(data){

  if(data && data.user){

    players.delete(ME.id);

    ME.id=String(data.user.id);

    ME.username=safeString(
      data.user.username,
      "玩家",
      12
    );

    ME.avatar=safeString(
      data.user.avatar,
      "",
      300
    );

    addPlayer(
      ME.id,
      ME.username,
      ME.avatar
    );

  }

  sdkIsHost=!!(
    data &&
    data.isHost
  );

  gameRoomId=
    (data && data.roomId) || "";

  if(
    Array.isArray(
      data.roomPlayers
    )
  ){

    data.roomPlayers.forEach(rp=>{

      if(
        rp &&
        rp.id!=null
      ){

        addPlayer(
          rp.id,
          rp.username,
          rp.avatar
        );

      }

    });

  }

  render();
}


window.addEventListener(
  "message",
  e=>{

    try{

      const d=
        typeof e.data==="string"
          ? JSON.parse(e.data)
          : e.data;

      if(
        d &&
        d.action==="initSDK"
      ){

        setupSDK(d);

      }else if(
        d &&
        d.action==="gameEventReceived"
      ){

        handleGameEvent(
          d.eventName,
          d.payload,
          d.userId
        );

      }

    }catch(_){}

  }
);


window.onBoomRoomSDKReady=function(){

  if(window.BoomRoomSDK){

    setupSDK({

      user:
        window.BoomRoomSDK.getUser(),

      isHost:
        window.BoomRoomSDK.isHost,

      roomId:
        window.BoomRoomSDK.roomId,

      roomPlayers:
        window.BoomRoomSDK.roomPlayers || []

    });

  }

};


function sendEvent(
  eventName,
  payload
){

  try{

    if(
      window.BoomRoomSDK &&
      typeof
        window.BoomRoomSDK.sendGameEvent
        ==="function"
    ){

      window.BoomRoomSDK.sendGameEvent(
        eventName,
        payload
      );

    }else if(
      window.parent!==window
    ){

      window.parent.postMessage(

        JSON.stringify({

          action:"sendGameEvent",

          eventName,

          payload

        }),

        "*"
      );

    }

  }catch(_){}

}


/* =========================================================
   GAME EVENTS
========================================================= */

function handleGameEvent(
  eventName,
  payload,
  senderId
){

  if(
    eventName==="PIKA_VOLLEY_START"
  ){

    startMatch();

  }

}


/* =========================================================
   START MATCH
========================================================= */

function startMatch(){

  scoreP1=0;

  scoreP2=0;

  feed=[
    "⚡ 皮卡丘排球開戰！",
    "🏐 球會從中間球網附近發出"
  ];

  resetPlayers();

  state="COUNTDOWN";

  startServeCountdown();

  render();

}


/* =========================================================
   RESET PLAYER
========================================================= */

function resetPlayers(){

  p1.x=75;
  p1.y=206;

  p1.vx=0;
  p1.vy=0;

  p1.onGround=true;

  p1.smashTimer=0;

  p2.x=253;
  p2.y=206;

  p2.vx=0;
  p2.vy=0;

  p2.onGround=true;

}


/* =========================================================
   BALL SERVE
========================================================= */

function prepareBall(){

  /*
    球永遠從球網附近開始。
    不會從畫面其他地方突然出現。
  */

  ball.x=CONFIG.NET_X;

  ball.y=112;

  ball.vx=0;

  ball.vy=0;

  ball.active=false;

  ball.lastHit="";

  ball.hitCooldown=.25;

}


function launchBall(){

  /*
    固定從中間球網發球。
    隨機左 / 右。

    初速度不會太大。
  */

  const direction=
    Math.random()<.5
      ? -1
      : 1;

  ball.x=
    CONFIG.NET_X +
    direction*14;

  ball.y=110;

  ball.vx=
    direction*
    (3.0 + Math.random()*.35);

  ball.vy=
    -3.4 -
    Math.random()*.25;

  ball.active=true;

  ball.lastHit="SERVE";

  feed.push(
    direction<0
      ? "🏐 發球 → 左方"
      : "🏐 發球 → 右方"
  );

  if(feed.length>8){

    feed.shift();

  }

}


/* =========================================================
   COUNTDOWN
========================================================= */

function startServeCountdown(){

  clearInterval(countdownTimer);

  prepareBall();

  countdownValue=
    CONFIG.SERVE_COUNTDOWN;

  render();

  countdownTimer=
    setInterval(()=>{

      countdownValue--;

      if(countdownValue<=0){

        clearInterval(
          countdownTimer
        );

        countdownTimer=null;

        state="PLAYING";

        launchBall();

        startCanvasLoop();

        render();

      }else{

        render();

      }

    },1000);

}


/* =========================================================
   NEXT BALL
========================================================= */

function nextBall(){

  state="COUNTDOWN";

  prepareBall();

  startServeCountdown();

}


/* =========================================================
   GAME LOOP
========================================================= */

function startCanvasLoop(){

  cancelAnimationFrame(
    gameLoopId
  );

  lastTime=performance.now();

  const run=(now)=>{

    if(
      state!=="PLAYING" &&
      state!=="COUNTDOWN"
    ){

      return;

    }

    const dt=Math.min(
      (now-lastTime)/16.6667,
      1.5
    );

    lastTime=now;

    updateGame(dt);

    drawGame();

    gameLoopId=
      requestAnimationFrame(run);

  };

  gameLoopId=
    requestAnimationFrame(run);

}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(dt){

  /*
    左右控制
  */

  if(keys.left){

    p1.vx-=
      CONFIG.PLAYER_ACCEL*dt;

  }

  if(keys.right){

    p1.vx+=
      CONFIG.PLAYER_ACCEL*dt;

  }

  /*
    沒按就慢慢減速
  */

  if(
    !keys.left &&
    !keys.right
  ){

    p1.vx*=
      Math.pow(
        CONFIG.PLAYER_FRICTION,
        dt
      );

  }

  /*
    限速
  */

  p1.vx=Math.max(
    -CONFIG.PLAYER_MAX_SPEED,
    Math.min(
      CONFIG.PLAYER_MAX_SPEED,
      p1.vx
    )
  );

  p1.x+=
    p1.vx*dt;

  /*
    左半場
  */

  p1.x=Math.max(
    18,
    Math.min(
      148,
      p1.x
    )
  );


  /*
    跳躍
  */

  if(
    keys.jump &&
    p1.onGround &&
    !p1.jumpLock
  ){

    p1.vy=
      -CONFIG.JUMP_POWER;

    p1.onGround=false;

    p1.jumpLock=true;

  }

  if(!keys.jump){

    p1.jumpLock=false;

  }


  /*
    重力
  */

  p1.vy+=
    CONFIG.GRAVITY*dt;

  p1.y+=
    p1.vy*dt;


  /*
    地面
  */

  if(
    p1.y>=206
  ){

    p1.y=206;

    p1.vy=0;

    p1.onGround=true;

  }


  /*
    扣球計時
  */

  if(p1.smashTimer>0){

    p1.smashTimer-=dt;

  }

}


/* =========================================================
   AI
========================================================= */

function updateAI(dt){

  if(!ball.active){

    return;

  }

  /*
    AI 不會瞬間貼球。
    有明顯反應時間。
  */

  const targetX=
    Math.max(
      205,
      Math.min(
        325,
        ball.x-16
      )
    );

  const diff=
    targetX-p2.x;

  if(Math.abs(diff)>8){

    const dir=
      diff>0
        ? 1
        : -1;

    p2.vx+=
      dir*.22*dt;

  }else{

    p2.vx*=.85;

  }

  p2.vx=Math.max(
    -3.0,
    Math.min(
      3.0,
      p2.vx
    )
  );

  p2.x+=
    p2.vx*dt;

  p2.x=Math.max(
    194,
    Math.min(
      328,
      p2.x
    )
  );


  /*
    AI 跳躍
  */

  if(
    ball.x>180 &&
    ball.y<155 &&
    ball.x>p2.x-40 &&
    ball.x<p2.x+60 &&
    p2.onGround
  ){

    p2.vy=-8.1;

    p2.onGround=false;

  }


  p2.vy+=
    CONFIG.GRAVITY*dt;

  p2.y+=
    p2.vy*dt;

  if(p2.y>=206){

    p2.y=206;

    p2.vy=0;

    p2.onGround=true;

  }

}


/* =========================================================
   BALL PHYSICS
========================================================= */

function updateBall(dt){

  if(!ball.active){

    return;

  }

  /*
    球的重力
  */

  ball.vy+=
    CONFIG.BALL_GRAVITY*dt;

  ball.x+=
    ball.vx*dt;

  ball.y+=
    ball.vy*dt;


  /*
    空氣阻力
    防止越打越快
  */

  ball.vx*=
    Math.pow(.997,dt);


  /*
    限速
  */

  const speed=
    Math.hypot(
      ball.vx,
      ball.vy
    );

  if(
    speed>
    CONFIG.BALL_MAX_SPEED
  ){

    const ratio=
      CONFIG.BALL_MAX_SPEED/
      speed;

    ball.vx*=ratio;
    ball.vy*=ratio;

  }


  /*
    左右牆壁
  */

  if(
    ball.x-ball.r<0
  ){

    ball.x=ball.r;

    ball.vx=
      Math.abs(ball.vx)*.9;

  }


  if(
    ball.x+ball.r>
    CONFIG.WORLD_W
  ){

    ball.x=
      CONFIG.WORLD_W-ball.r;

    ball.vx=
      -Math.abs(ball.vx)*.9;

  }


  /*
    天花板
  */

  if(
    ball.y-ball.r<0
  ){

    ball.y=ball.r;

    ball.vy=
      Math.abs(ball.vy)*.85;

  }


  /*
    球網
  */

  handleNetCollision();


  /*
    玩家碰撞
  */

  handlePlayerCollision(
    p1,
    "P1"
  );

  handlePlayerCollision(
    p2,
    "P2"
  );


  /*
    球落地
  */

  if(
    ball.y+ball.r>=
    CONFIG.GROUND_Y
  ){

    /*
      確保真的落地
    */

    ball.y=
      CONFIG.GROUND_Y-
      ball.r;

    /*
      如果垂直速度還很大，
      做一次小反彈，
      但很快結束。
    */

    if(
      Math.abs(ball.vy)>1.8
    ){

      ball.vy=
        -ball.vy*.25;

    }else{

      ball.vy=0;

      scorePoint();

    }

  }

}


/* =========================================================
   NET COLLISION
========================================================= */

function handleNetCollision(){

  const netLeft=174;

  const netRight=186;

  /*
    球網上方可以越過。

    球網柱體從 NET_TOP 到地面。
  */

  if(
    ball.x+ball.r>netLeft &&
    ball.x-ball.r<netRight &&
    ball.y+ball.r>
      CONFIG.NET_TOP
  ){

    /*
      從左邊撞到
    */

    if(ball.vx>0){

      ball.x=
        netLeft-ball.r;

      ball.vx=
        -Math.abs(ball.vx)*.72;

    }

    /*
      從右邊撞到
    */

    else if(ball.vx<0){

      ball.x=
        netRight+ball.r;

      ball.vx=
        Math.abs(ball.vx)*.72;

    }

    /*
      撞網後降低垂直速度
    */

    ball.vy*=.75;

  }

}


/* =========================================================
   PLAYER COLLISION
========================================================= */

function handlePlayerCollision(
  player,
  playerName
){

  if(ball.hitCooldown>0){

    return;

  }

  const cx=
    player.x+
    player.w/2;

  const cy=
    player.y+
    player.h/2;

  const dx=
    ball.x-cx;

  const dy=
    ball.y-cy;

  const dist=
    Math.hypot(dx,dy);

  const minDist=
    ball.r+
    player.w*.43;

  if(dist>=minDist){

    return;

  }

  /*
    避免球卡在人物裡
  */

  const nx=
    dist===0
      ? (playerName==="P1"?1:-1)
      : dx/dist;

  const ny=
    dist===0
      ? -1
      : dy/dist;

  ball.x=
    cx+
    nx*
    (minDist+1);

  ball.y=
    cy+
    ny*
    (minDist+1);


  /*
    基礎擊球力量
  */

  let power=
    playerName==="P1"
      ? 5.1
      : 4.7;

  /*
    扣球
  */

  if(
    playerName==="P1" &&
    keys.smash &&
    player.y<206
  ){

    power=7.2;

    ball.vy=
      Math.min(
        ball.vy,
        -5.4
      );

    p1.smashTimer=.25;

  }


  /*
    正常擊球
  */

  ball.vx=
    nx*power+
    player.vx*.35;

  ball.vy=
    ny*power-
    3.4;


  /*
    保證玩家不會把球打回自己方向太多
  */

  if(
    playerName==="P1" &&
    ball.vx<1.0
  ){

    ball.vx=
      1.5+
      Math.abs(player.vx)*.25;

  }

  if(
    playerName==="P2" &&
    ball.vx>-1.0
  ){

    ball.vx=
      -1.5-
      Math.abs(player.vx)*.25;

  }


  /*
    限制速度
  */

  const speed=
    Math.hypot(
      ball.vx,
      ball.vy
    );

  if(
    speed>
    CONFIG.BALL_MAX_SPEED
  ){

    const ratio=
      CONFIG.BALL_MAX_SPEED/
      speed;

    ball.vx*=ratio;
    ball.vy*=ratio;

  }


  ball.hitCooldown=.18;

  ball.lastHit=playerName;

  feed.push(
    playerName==="P1"
      ? (
        keys.smash
          ? "⚡ P1 強力扣球！"
          : "🟡 P1 擊球！"
      )
      : "🔴 P2 擊球！"
  );

  if(feed.length>8){

    feed.shift();

  }

}


/* =========================================================
   SCORE
========================================================= */

function scorePoint(){

  ball.active=false;

  if(ball.x<CONFIG.NET_X){

    scoreP2++;

    feed.push(
      `🔴 P2 得分！ ${scoreP1} : ${scoreP2}`
    );

  }else{

    scoreP1++;

    feed.push(
      `🟡 P1 得分！ ${scoreP1} : ${scoreP2}`
    );

  }

  if(feed.length>8){

    feed.shift();

  }


  /*
    勝負
  */

  if(
    scoreP1>=CONFIG.WIN_SCORE ||
    scoreP2>=CONFIG.WIN_SCORE
  ){

    finishGame();

    return;

  }


  /*
    下一球。
    不瞬間出球。
  */

  nextBall();

}


/* =========================================================
   GAME OVER
========================================================= */

function finishGame(){

  state="RESULT";

  ball.active=false;

  cancelAnimationFrame(
    gameLoopId
  );

  clearInterval(
    countdownTimer
  );

  countdownTimer=null;


  const winner=
    scoreP1>=CONFIG.WIN_SCORE
      ? "P1（你）"
      : "P2（AI 對手）";

  feed.push(
    `🏆 遊戲結束！獲勝者：${winner}`
  );

  try{

    if(
      window.BoomRoomSDK &&
      typeof
        window.BoomRoomSDK.gameOver
        ==="function"
    ){

      window.BoomRoomSDK.gameOver(
        scoreP1*20
      );

    }

  }catch(_){}

  render();

}


/* =========================================================
   UPDATE
========================================================= */

function updateGame(dt){

  /*
    COUNTDOWN 狀態：
    玩家可以準備站位，
    但球不動。
  */

  if(state==="COUNTDOWN"){

    updatePlayer(dt);

    updateAI(dt);

    return;

  }


  if(state!=="PLAYING"){

    return;

  }


  updatePlayer(dt);

  updateAI(dt);

  if(ball.hitCooldown>0){

    ball.hitCooldown-=dt;

  }

  updateBall(dt);

}


/* =========================================================
   DRAW
========================================================= */

function drawGame(){

  if(!canvas || !ctx){

    return;

  }

  /*
    清除
  */

  ctx.clearRect(
    0,
    0,
    CONFIG.WORLD_W,
    CONFIG.WORLD_H
  );


  /*
    天空背景
  */

  const sky=
    ctx.createLinearGradient(
      0,
      0,
      0,
      CONFIG.WORLD_H
    );

  sky.addColorStop(
    0,
    "#1c2947"
  );

  sky.addColorStop(
    1,
    "#090d18"
  );

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,
    0,
    CONFIG.WORLD_W,
    CONFIG.WORLD_H
  );


  /*
    背景光
  */

  ctx.fillStyle=
    "rgba(98,231,255,.06)";

  ctx.beginPath();

  ctx.arc(
    180,
    55,
    70,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    地面
  */

  ctx.fillStyle="#111827";

  ctx.fillRect(
    0,
    CONFIG.GROUND_Y,
    CONFIG.WORLD_W,
    CONFIG.WORLD_H-
    CONFIG.GROUND_Y
  );


  /*
    地面線
  */

  ctx.strokeStyle=
    "rgba(255,255,255,.15)";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(
    0,
    CONFIG.GROUND_Y
  );

  ctx.lineTo(
    CONFIG.WORLD_W,
    CONFIG.GROUND_Y
  );

  ctx.stroke();


  /*
    左右半場
  */

  ctx.strokeStyle=
    "rgba(98,231,255,.08)";

  ctx.lineWidth=1;

  ctx.beginPath();

  ctx.moveTo(
    CONFIG.NET_X,
    CONFIG.NET_TOP
  );

  ctx.lineTo(
    CONFIG.NET_X,
    CONFIG.GROUND_Y
  );

  ctx.stroke();


  /*
    球網
  */

  ctx.fillStyle="#e8edf7";

  ctx.fillRect(
    176,
    CONFIG.NET_TOP,
    8,
    CONFIG.NET_BOTTOM-
    CONFIG.NET_TOP
  );


  /*
    球網頂端
  */

  ctx.fillStyle="#ffffff";

  ctx.fillRect(
    173,
    CONFIG.NET_TOP-3,
    14,
    5
  );


  /*
    玩家
  */

  drawPlayer(
    p1,
    "#ffd166",
    "⚡"
  );

  drawPlayer(
    p2,
    "#ff637a",
    "🔥"
  );


  /*
    球
  */

  drawBall();


  /*
    倒數提示
  */

  if(state==="COUNTDOWN"){

    drawCountdown();

  }

}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(
  p,
  color,
  symbol
){

  /*
    身體陰影
  */

  ctx.fillStyle=
    "rgba(0,0,0,.35)";

  ctx.beginPath();

  ctx.ellipse(
    p.x+p.w/2,
    CONFIG.GROUND_Y+1,
    20,
    5,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    身體
  */

  ctx.fillStyle=color;

  ctx.beginPath();

  ctx.roundRect(
    p.x,
    p.y,
    p.w,
    p.h,
    10
  );

  ctx.fill();


  /*
    高光
  */

  ctx.fillStyle=
    "rgba(255,255,255,.28)";

  ctx.beginPath();

  ctx.arc(
    p.x+9,
    p.y+8,
    5,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    眼睛
  */

  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    p.x+10,
    p.y+14,
    2.3,
    0,
    Math.PI*2
  );

  ctx.arc(
    p.x+22,
    p.y+14,
    2.3,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    腮紅
  */

  ctx.fillStyle=
    p===p1
      ? "#ff5b5b"
      : "#ff9d9d";

  ctx.beginPath();

  ctx.arc(
    p.x+7,
    p.y+21,
    3,
    0,
    Math.PI*2
  );

  ctx.arc(
    p.x+25,
    p.y+21,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    小符號
  */

  ctx.font="bold 9px sans-serif";

  ctx.textAlign="center";

  ctx.fillStyle="#111";

  ctx.fillText(
    symbol,
    p.x+p.w/2,
    p.y-4
  );

}


/* =========================================================
   DRAW BALL
========================================================= */

function drawBall(){

  /*
    球影
  */

  ctx.fillStyle=
    "rgba(0,0,0,.25)";

  ctx.beginPath();

  ctx.ellipse(
    ball.x,
    CONFIG.GROUND_Y-2,
    Math.max(
      5,
      12-
      Math.abs(
        ball.y-
        CONFIG.GROUND_Y
      )*.025
    ),
    3,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    球本體
  */

  const gradient=
    ctx.createRadialGradient(
      ball.x-3,
      ball.y-4,
      2,
      ball.x,
      ball.y,
      ball.r
    );

  gradient.addColorStop(
    0,
    "#fff6c7"
  );

  gradient.addColorStop(
    .45,
    "#ffd166"
  );

  gradient.addColorStop(
    1,
    "#e5a928"
  );

  ctx.fillStyle=gradient;

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.r,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    排球線條
  */

  ctx.strokeStyle=
    "rgba(70,45,10,.7)";

  ctx.lineWidth=1.2;

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.r*.75,
    -.7,
    1.1
  );

  ctx.stroke();

}


/* =========================================================
   COUNTDOWN DRAW
========================================================= */

function drawCountdown(){

  ctx.fillStyle=
    "rgba(4,7,15,.28)";

  ctx.fillRect(
    0,
    0,
    CONFIG.WORLD_W,
    CONFIG.WORLD_H
  );


  let text=
    countdownValue>0
      ? String(countdownValue)
      : "GO!";


  ctx.textAlign="center";

  ctx.textBaseline="middle";

  ctx.font=
    "900 64px system-ui";

  ctx.fillStyle="#ffffff";

  ctx.shadowColor=
    "rgba(98,231,255,.8)";

  ctx.shadowBlur=20;

  ctx.fillText(
    text,
    CONFIG.NET_X,
    105
  );

  ctx.shadowBlur=0;

}


/* =========================================================
   RESIZE CANVAS
========================================================= */

function resizeCanvas(){

  if(!canvas){

    return;

  }

  /*
    這裡非常重要：

    Canvas 實際繪圖解析度固定 360x250。
    CSS 只負責等比例顯示。

    所以不管手機畫面多高，
    遊戲世界都不會變形。
  */

  canvas.width=
    CONFIG.WORLD_W;

  canvas.height=
    CONFIG.WORLD_H;

}


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    const k=
      e.key.toLowerCase();

    if(
      k==="a" ||
      k==="arrowleft"
    ){

      keys.left=true;

      e.preventDefault();

    }

    if(
      k==="d" ||
      k==="arrowright"
    ){

      keys.right=true;

      e.preventDefault();

    }

    if(
      k==="w" ||
      k==="arrowup" ||
      k===" "
    ){

      keys.jump=true;

      e.preventDefault();

    }

    if(
      k==="j" ||
      k==="k" ||
      k==="x"
    ){

      keys.smash=true;

      e.preventDefault();

    }

  },
  {passive:false}
);


window.addEventListener(
  "keyup",
  e=>{

    const k=
      e.key.toLowerCase();

    if(
      k==="a" ||
      k==="arrowleft"
    ){

      keys.left=false;

    }

    if(
      k==="d" ||
      k==="arrowright"
    ){

      keys.right=false;

    }

    if(
      k==="w" ||
      k==="arrowup" ||
      k===" "
    ){

      keys.jump=false;

    }

    if(
      k==="j" ||
      k==="k" ||
      k==="x"
    ){

      keys.smash=false;

    }

  }
);


/* =========================================================
   TOUCH BUTTON
========================================================= */

function bindHoldButton(
  id,
  keyName
){

  const btn=
    document.getElementById(id);

  if(!btn){

    return;

  }


  const start=e=>{

    e.preventDefault();

    keys[keyName]=true;

    btn.classList.add(
      "active"
    );

    try{

      btn.setPointerCapture(
        e.pointerId
      );

    }catch(_){}

  };


  const end=e=>{

    e.preventDefault();

    keys[keyName]=false;

    btn.classList.remove(
      "active"
    );

  };


  btn.addEventListener(
    "pointerdown",
    start
  );

  btn.addEventListener(
    "pointerup",
    end
  );

  btn.addEventListener(
    "pointercancel",
    end
  );

  btn.addEventListener(
    "pointerleave",
    e=>{

      /*
        如果手指離開按鈕，
        立刻停止左右移動。
      */

      if(e.buttons){

        keys[keyName]=false;

        btn.classList.remove(
          "active"
        );

      }

    }
  );

}

  /*
    本地測試不要只 sendEvent。
    直接啟動本地遊戲。
  */

  startMatch();

}


/* =========================================================
   INITIALIZE
========================================================= */

addPlayer(
  ME.id,
  ME.username,
  ME.avatar
);

render();


/* =========================================================
   WINDOW RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{
    if(canvas){

      resizeCanvas();

    }
  }
);

</script>

</body>
</html>
