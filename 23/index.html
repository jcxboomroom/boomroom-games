<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<meta name="theme-color" content="#070912">

<title>爆爆皮卡丘排球</title>

<style>
:root{
  --bg:#070912;
  --panel:#111625;
  --panel2:#161c2d;
  --line:#2b3550;
  --text:#f7f8fb;
  --muted:#98a3ba;

  --cyan:#62e7ff;
  --purple:#b76cff;
  --green:#4ee08a;
  --red:#ff637a;
  --gold:#ffd166;

  --t:env(safe-area-inset-top,0px);
  --b:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);

  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

  user-select:none;
  -webkit-user-select:none;
}

button{
  font:inherit;
  border:0;
  color:var(--text);
  cursor:pointer;
}

button:disabled{
  opacity:.4;
  cursor:default;
}

#app{
  width:100%;
  height:100dvh;

  display:flex;
  justify-content:center;
}

.shell{
  width:min(100%,760px);
  height:100%;

  display:flex;
  flex-direction:column;

  padding:
    calc(8px + var(--t))
    10px
    calc(8px + var(--b));

  gap:8px;
}

.screen{
  flex:1;
  min-height:0;

  display:flex;
  flex-direction:column;

  gap:8px;
}

.panel{
  background:
    linear-gradient(
      180deg,
      var(--panel2),
      var(--panel)
    );

  border:1px solid var(--line);
  border-radius:18px;
  padding:12px;
}

.center{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.stat{
  padding:8px 5px;

  background:#0b0f18;
  border:1px solid var(--line);
  border-radius:12px;

  text-align:center;
}

.stat b{
  display:block;
  font-size:15px;
}

.stat span{
  font-size:9px;
  color:var(--muted);
}

.sectionTitle{
  font-size:13px;
  font-weight:1000;
  margin-bottom:8px;
}

.muted{
  color:var(--muted);
}

.tiny{
  font-size:10px;
  line-height:1.45;
}

.cta{
  width:100%;
  min-height:48px;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      var(--cyan),
      var(--purple)
    );

  color:#070912;
  font-weight:1000;
  font-size:15px;
}

.cta.secondary{
  background:#192032;
  color:#fff;
  border:1px solid var(--line);
}

.cta.danger{
  background:
    linear-gradient(
      135deg,
      #ff4d6d,
      #e63946
    );

  color:#fff;
}

.cta:active{
  transform:scale(.97);
}

.notice{
  min-height:22px;
  color:#d1d6e4;
  font-size:11px;
  text-align:center;
}

.players{
  display:flex;
  gap:6px;
  overflow-x:auto;
}

.player{
  min-width:100px;

  padding:6px 8px;

  border-radius:11px;

  background:#0b101c;
  border:1px solid var(--line);

  font-size:10px;
  flex:none;
}

.player b{
  display:block;
  font-size:12px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.player em{
  display:block;
  font-style:normal;
  color:var(--muted);
}


/* =========================
   GAME AREA
========================= */

#canvasWrap{
  position:relative;

  flex:1;
  min-height:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:16px;
  overflow:hidden;

  border:1px solid var(--line);

  background:
    linear-gradient(
      180deg,
      #1a2035,
      #070912
    );
}

#gameCanvas{
  display:block;

  width:100%;
  height:auto;

  max-height:100%;

  aspect-ratio:720 / 500;

  touch-action:none;

  image-rendering:auto;
}


/* =========================
   CONTROLS
========================= */

.ctrlGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);

  gap:6px;

  margin-top:6px;
}

.ctrlBtn{
  height:52px;

  border-radius:14px;

  background:#161f33;
  border:1px solid var(--line);

  font-size:18px;
  font-weight:bold;

  color:var(--cyan);

  touch-action:none;
}

.ctrlBtn:active,
.ctrlBtn.active{
  background:var(--cyan);
  color:#070912;

  transform:scale(.96);
}

.jumpBtn{
  color:var(--gold);
}

.smashBtn{
  color:var(--red);
}


/* =========================
   FEED
========================= */

.feedBox{
  max-height:70px;

  overflow-y:auto;

  font-size:11px;

  background:#0b0f18;

  border:1px solid var(--line);

  border-radius:10px;

  padding:6px;
}


/* =========================
   COUNTDOWN
========================= */

.countdownOverlay{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:none;

  z-index:10;
}

.countdownText{
  width:130px;
  height:130px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle,
      rgba(98,231,255,.22),
      rgba(183,108,255,.08),
      rgba(0,0,0,.7)
    );

  border:3px solid rgba(98,231,255,.7);

  box-shadow:
    0 0 35px rgba(98,231,255,.35);

  font-size:58px;
  font-weight:1000;

  color:#fff;

  text-shadow:
    0 0 20px var(--cyan);

  animation:
    countPop .7s ease;
}

@keyframes countPop{
  0%{
    transform:scale(.55);
    opacity:0;
  }

  60%{
    transform:scale(1.12);
    opacity:1;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }
}


/* =========================
   MOBILE
========================= */

@media(max-width:430px){

  .shell{
    padding-left:7px;
    padding-right:7px;
  }

  .stat{
    padding:6px 3px;
  }

  .stat b{
    font-size:12px;
  }

  .stat span{
    font-size:8px;
  }

  .ctrlBtn{
    height:54px;
    font-size:17px;
  }

  .feedBox{
    max-height:52px;
  }
}
</style>
</head>


<body>

<div id="app">

  <div class="shell">

    <main id="main" class="screen"></main>

  </div>

</div>


<script>

"use strict";


/* =========================================================
   CONFIG
========================================================= */

const CONFIG = Object.freeze({

  ENTRY_FEE:100,

  MIN_PLAYERS:1,

  MAX_PLAYERS:8,

  WIN_SCORE:5,

  COUNTDOWN:3,

  /*
    整個遊戲使用固定 720 x 500 世界座標。

    Canvas 可以縮放到手機，
    但物理全部使用世界座標。

    所以不會因為手機畫面變高，
    球突然飛更快。
  */

  WORLD_W:720,

  WORLD_H:500,

  GROUND_Y:440,

  NET_X:360,

  NET_TOP:270,

  PLAYER_SPEED:2.8,

  PLAYER_ACCEL:.32,

  PLAYER_FRICTION:.78,

  PLAYER_MAX_SPEED:3.2,

  JUMP_POWER:8.6,

  GRAVITY:.32,

  BALL_GRAVITY:.115,

  BALL_MAX_SPEED:6.2,

  BALL_MIN_SPEED:2.0,

  BALL_BOUNCE:.78,

  SERVE_SPEED:2.7

});


/* =========================================================
   USER / SDK
========================================================= */

let ME = {

  id:
    "local_" +
    Math.random()
      .toString(36)
      .slice(2,10),

  username:"本地玩家",

  avatar:"",

  joinedAt:Date.now()

};


let sdkIsHost=false;

let gameRoomId="";

let players=new Map();


/* =========================================================
   GAME STATE
========================================================= */

let state="LOBBY";

let scoreP1=0;

let scoreP2=0;

let feed=[];

let gameLoopId=null;


/*
  serveState:

  IDLE
  COUNTDOWN
  PLAYING
*/

let serveState="IDLE";

let countdownValue=0;

let countdownTimer=null;

let serveSide="P1";


/* =========================================================
   CANVAS
========================================================= */

let canvas=null;

let ctx=null;


/* =========================================================
   INPUT
========================================================= */

let keys={

  left1:false,

  right1:false,

  jump1:false,

  smash1:false

};


/* =========================================================
   WORLD OBJECTS
========================================================= */

const p1={

  x:120,

  y:395,

  w:52,

  h:55,

  vx:0,

  vy:0,

  color:"#ffd166",

  grounded:true,

  smashCooldown:0,

  hitCooldown:0

};


const p2={

  x:548,

  y:395,

  w:52,

  h:55,

  vx:0,

  vy:0,

  color:"#ff637a",

  grounded:true,

  smashCooldown:0,

  hitCooldown:0

};


const ball={

  x:360,

  y:230,

  vx:0,

  vy:0,

  r:15,

  active:false,

  lastHitBy:"",

  trail:[]

};


/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;


function initAudio(){

  try{

    if(!audioCtx){

      audioCtx=
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(audioCtx.state==="suspended"){

      audioCtx.resume().catch(()=>{});

    }

  }catch(_){}

}


function beep(

  frequency=440,

  duration=.08,

  type="sine",

  volume=.045

){

  try{

    initAudio();

    if(!audioCtx) return;

    const osc=
      audioCtx.createOscillator();

    const gain=
      audioCtx.createGain();

    osc.type=type;

    osc.frequency.value=frequency;

    gain.gain.setValueAtTime(
      volume,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(

      .001,

      audioCtx.currentTime+duration

    );

    osc.connect(gain);

    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(
      audioCtx.currentTime+duration
    );

  }catch(_){}

}


function vibration(ms=20){

  try{

    if(
      navigator.vibrate &&
      typeof navigator.vibrate==="function"
    ){

      navigator.vibrate(ms);

    }

  }catch(_){}

}


/* =========================================================
   SDK
========================================================= */

function isHost(){

  return sdkIsHost || players.size<=1;

}


function safeString(

  v,

  fallback,

  maxLen

){

  if(v===null || v===undefined){

    return fallback;

  }

  const s=String(v).trim();

  return s
    ? s.slice(0,maxLen)
    : fallback;

}


function addPlayer(

  id,

  username,

  avatar

){

  if(!id) return;

  id=String(id);

  let p=players.get(id);

  if(!p){

    p={

      id,

      username:
        safeString(
          username,
          "玩家",
          12
        ),

      avatar:
        safeString(
          avatar,
          "",
          300
        ),

      score:0

    };

    players.set(id,p);

  }else{

    p.username=
      safeString(
        username,
        p.username,
        12
      );

  }

  return p;

}


function setupSDK(data){

  if(data && data.user){

    players.delete(ME.id);

    ME.id=
      String(data.user.id);

    ME.username=
      safeString(
        data.user.username,
        "玩家",
        12
      );

    ME.avatar=
      safeString(
        data.user.avatar,
        "",
        300
      );

    addPlayer(
      ME.id,
      ME.username,
      ME.avatar
    );

  }

  sdkIsHost=
    !!(data && data.isHost);

  gameRoomId=
    (data && data.roomId) || "";

  if(
    Array.isArray(
      data.roomPlayers
    )
  ){

    data.roomPlayers.forEach(
      rp=>{

        if(
          rp &&
          rp.id!=null
        ){

          addPlayer(
            rp.id,
            rp.username,
            rp.avatar
          );

        }

      }
    );

  }

  render();

}


window.addEventListener(

  "message",

  e=>{

    try{

      const d=
        typeof e.data==="string"
          ? JSON.parse(e.data)
          : e.data;

      if(
        d &&
        d.action==="initSDK"
      ){

        setupSDK(d);

      }else if(

        d &&
        d.action===
          "gameEventReceived"

      ){

        handleGameEvent(
          d.eventName,
          d.payload,
          d.userId
        );

      }

    }catch(_){}

  }

);


window.onBoomRoomSDKReady=function(){

  try{

    if(window.BoomRoomSDK){

      setupSDK({

        user:
          window.BoomRoomSDK.getUser(),

        isHost:
          window.BoomRoomSDK.isHost,

        roomId:
          window.BoomRoomSDK.roomId,

        roomPlayers:
          window.BoomRoomSDK.roomPlayers || []

      });

    }

  }catch(_){}

};


function sendEvent(

  eventName,

  payload

){

  try{

    if(

      window.BoomRoomSDK &&

      typeof
        window.BoomRoomSDK
          .sendGameEvent ===
          "function"

    ){

      window.BoomRoomSDK
        .sendGameEvent(
          eventName,
          payload
        );

    }

    else if(
      window.parent !== window
    ){

      window.parent.postMessage(

        JSON.stringify({

          action:
            "sendGameEvent",

          eventName,

          payload

        }),

        "*"

      );

    }

  }catch(_){}

}


/* =========================================================
   GAME EVENTS
========================================================= */

function handleGameEvent(

  eventName,

  payload,

  senderId

){

  if(
    eventName===
    "PIKA_VOLLEY_START"
  ){

    startNewGame();

  }

}


/* =========================================================
   START GAME
========================================================= */

function startNewGame(){

  initAudio();

  state="PLAYING";

  scoreP1=0;

  scoreP2=0;

  feed=[
    "⚡ 皮卡丘排球開戰！",

    "🎯 先得到 5 分獲勝。",

    "🏐 球會從中間球網發球。"

  ];

  resetPlayers();

  startCanvasLoop();

  render();

  setTimeout(()=>{

    beginServe("P1");

  },300);

}


function resetPlayers(){

  p1.x=120;

  p1.y=395;

  p1.vx=0;

  p1.vy=0;

  p1.grounded=true;

  p1.smashCooldown=0;

  p1.hitCooldown=0;


  p2.x=548;

  p2.y=395;

  p2.vx=0;

  p2.vy=0;

  p2.grounded=true;

  p2.smashCooldown=0;

  p2.hitCooldown=0;

}


/* =========================================================
   SERVE / COUNTDOWN
========================================================= */

function beginServe(side){

  if(state!=="PLAYING") return;

  clearTimeout(countdownTimer);

  serveState="COUNTDOWN";

  serveSide=side;

  countdownValue=
    CONFIG.COUNTDOWN;

  ball.active=false;

  ball.vx=0;

  ball.vy=0;

  ball.x=CONFIG.NET_X;

  ball.y=220;

  ball.trail=[];

  showCountdown();

  beep(
    420,
    .1,
    "sine",
    .04
  );

  countdownTimer=
    setInterval(()=>{

      countdownValue--;

      if(countdownValue>0){

        showCountdown();

        beep(
          520,
          .1,
          "sine",
          .045
        );

        vibration(15);

      }

      else{

        clearInterval(
          countdownTimer
        );

        countdownTimer=null;

        hideCountdown();

        launchServe();

      }

    },1000);

}


function launchServe(){

  if(state!=="PLAYING")
    return;

  serveState="PLAYING";

  ball.active=true;

  /*
    永遠由中間球網附近發球。

    P1 發往右邊。
    P2 發往左邊。
  */

  ball.x=
    serveSide==="P1"
      ? CONFIG.NET_X-35
      : CONFIG.NET_X+35;

  ball.y=235;

  const direction=
    serveSide==="P1"
      ? 1
      : -1;

  ball.vx=
    direction*
    CONFIG.SERVE_SPEED;

  ball.vy=-2.2;

  ball.lastHitBy=
    serveSide;

  ball.trail=[];

  beep(
    700,
    .12,
    "triangle",
    .06
  );

  vibration(25);

}


function showCountdown(){

  const wrap=
    document.getElementById(
      "canvasWrap"
    );

  if(!wrap) return;

  let old=
    document.getElementById(
      "countdownOverlay"
    );

  if(!old){

    old=
      document.createElement(
        "div"
      );

    old.id=
      "countdownOverlay";

    old.className=
      "countdownOverlay";

    wrap.appendChild(old);

  }

  old.innerHTML=`

    <div class="countdownText">

      ${countdownValue}

    </div>

  `;

}


function hideCountdown(){

  const el=
    document.getElementById(
      "countdownOverlay"
    );

  if(el){

    el.remove();

  }

}


/* =========================================================
   GAME LOOP
========================================================= */

function startCanvasLoop(){

  cancelAnimationFrame(
    gameLoopId
  );

  const run=()=>{

    if(state!=="PLAYING")
      return;

    updateGame();

    drawGame();

    gameLoopId=
      requestAnimationFrame(
        run
      );

  };

  gameLoopId=
    requestAnimationFrame(run);

}


/* =========================================================
   PLAYER PHYSICS
========================================================= */

function updatePlayer(

  p,

  isP1

){

  const left=
    isP1
      ? keys.left1
      : false;

  const right=
    isP1
      ? keys.right1
      : false;

  if(left){

    p.vx-=
      CONFIG.PLAYER_ACCEL;

  }

  else if(right){

    p.vx+=
      CONFIG.PLAYER_ACCEL;

  }

  else{

    p.vx*=
      CONFIG.PLAYER_FRICTION;

  }


  p.vx=
    Math.max(

      -CONFIG.PLAYER_MAX_SPEED,

      Math.min(
        CONFIG.PLAYER_MAX_SPEED,
        p.vx
      )

    );


  p.x+=p.vx;


  /*
    玩家重力
  */

  p.vy+=
    CONFIG.GRAVITY;

  p.y+=p.vy;


  /*
    地面
  */

  const floor=
    CONFIG.GROUND_Y-
    p.h;

  if(p.y>=floor){

    p.y=floor;

    p.vy=0;

    p.grounded=true;

  }

  else{

    p.grounded=false;

  }


  /*
    跳躍

    不要一直按著就無限跳。
  */

  if(
    isP1 &&
    keys.jump1 &&
    p.grounded
  ){

    p.vy=
      -CONFIG.JUMP_POWER;

    p.grounded=false;

    keys.jump1=false;

    beep(
      350,
      .07,
      "sine",
      .025
    );

    vibration(12);

  }


  /*
    場地限制
  */

  if(isP1){

    p.x=
      Math.max(
        30,
        Math.min(
          CONFIG.NET_X-
          70-
          p.w,
          p.x
        )
      );

  }else{

    p.x=
      Math.max(
        CONFIG.NET_X+
        70,

        Math.min(
          CONFIG.WORLD_W-
          30-
          p.w,

          p.x
        )

      );

  }


  if(p.smashCooldown>0)
    p.smashCooldown--;

  if(p.hitCooldown>0)
    p.hitCooldown--;

}


function updateAI(){

  /*
    AI 故意降低速度。

    不追求完美，
    而是讓玩家有反應時間。
  */

  if(!ball.active){

    return;

  }


  const targetX=
    ball.x-
    p2.w/2;


  /*
    只有球在右半場
    AI 才積極追。

    球在左邊時，
    AI 回到比較舒服的位置。
  */

  let desiredX;

  if(ball.x>CONFIG.NET_X){

    desiredX=targetX;

  }else{

    desiredX=535;

  }


  const diff=
    desiredX-p2.x;


  /*
    AI 最大速度只有
    約 2.15。

    玩家約 3.2。
  */

  if(Math.abs(diff)>8){

    if(diff>0)
      p2.vx+=.17;

    else
      p2.vx-=.17;

  }else{

    p2.vx*=.75;

  }


  p2.vx=
    Math.max(
      -2.15,
      Math.min(
        2.15,
        p2.vx
      )
    );


  p2.x+=p2.vx;


  /*
    AI 跳躍。

    只在球接近且高度適合時跳。
  */

  const ballNear=
    Math.abs(
      ball.x-
      (p2.x+p2.w/2)
    )<70;


  if(

    ballNear &&

    ball.y<320 &&

    ball.y>230 &&

    p2.grounded

  ){

    p2.vy=
      -7.8;

    p2.grounded=false;

  }


  p2.vy+=
    CONFIG.GRAVITY;

  p2.y+=p2.vy;


  const floor=
    CONFIG.GROUND_Y-
    p2.h;


  if(p2.y>=floor){

    p2.y=floor;

    p2.vy=0;

    p2.grounded=true;

  }


  if(p2.x<CONFIG.NET_X+70)
    p2.x=CONFIG.NET_X+70;

  if(
    p2.x>
    CONFIG.WORLD_W-
    30-
    p2.w
  ){

    p2.x=
      CONFIG.WORLD_W-
      30-
      p2.w;

  }


  if(p2.smashCooldown>0)
    p2.smashCooldown--;

  if(p2.hitCooldown>0)
    p2.hitCooldown--;


  /*
    AI 扣球。

    機率低，
    不會一直殺。
  */

  if(

    ballNear &&

    ball.y<300 &&

    p2.smashCooldown<=0 &&

    p2.y<400

  ){

    if(Math.random()<.025){

      aiSmash();

    }

  }

}


/* =========================================================
   BALL
========================================================= */

function updateBall(){

  if(!ball.active)
    return;


  /*
    保存軌跡。

    讓球看起來有速度感，
    但不會造成真正速度變快。
  */

  ball.trail.unshift({

    x:ball.x,

    y:ball.y

  });


  if(ball.trail.length>8){

    ball.trail.pop();

  }


  ball.x+=ball.vx;

  ball.y+=ball.vy;


  /*
    真正的球體重力。
  */

  ball.vy+=
    CONFIG.BALL_GRAVITY;


  /*
    限制最大速度。

    這個很重要。

    不管怎麼扣，
    球都不會失控。
  */

  const speed=
    Math.hypot(
      ball.vx,
      ball.vy
    );


  if(
    speed>
    CONFIG.BALL_MAX_SPEED
  ){

    const ratio=
      CONFIG.BALL_MAX_SPEED/
      speed;

    ball.vx*=ratio;

    ball.vy*=ratio;

  }


  /*
    左右牆
  */

  if(
    ball.x-ball.r<0
  ){

    ball.x=ball.r;

    ball.vx=
      Math.abs(ball.vx);

    ballWallSound();

  }


  if(
    ball.x+
    ball.r>
    CONFIG.WORLD_W
  ){

    ball.x=
      CONFIG.WORLD_W-
      ball.r;

    ball.vx=
      -Math.abs(ball.vx);

    ballWallSound();

  }


  /*
    天花板
  */

  if(
    ball.y-ball.r<0
  ){

    ball.y=ball.r;

    ball.vy=
      Math.abs(ball.vy)*
      .72;

    beep(
      260,
      .04,
      "sine",
      .025
    );

  }


  /*
    球網碰撞。

    球網頂端是 NET_TOP。
  */

  if(

    ball.x+ball.r>
      CONFIG.NET_X-4 &&

    ball.x-ball.r<
      CONFIG.NET_X+4 &&

    ball.y+ball.r>
      CONFIG.NET_TOP

  ){

    /*
      判斷球從哪邊來。
    */

    if(ball.vx>0){

      ball.x=
        CONFIG.NET_X-
        ball.r-
        5;

    }else{

      ball.x=
        CONFIG.NET_X+
        ball.r+
        5;

    }


    ball.vx*=-.72;

    /*
      球網不會把球彈飛。
    */

    ball.vy*=.9;

    netSound();

  }


  /*
    玩家碰球
  */

  checkPlayerHit(
    p1,
    "P1"
  );


  checkPlayerHit(
    p2,
    "P2"
  );


  /*
    地面。

    球落地才得分。
  */

  if(
    ball.y+
    ball.r>=
    CONFIG.GROUND_Y
  ){

    ball.y=
      CONFIG.GROUND_Y-
      ball.r;

    scorePoint(
      ball.x<
      CONFIG.NET_X
        ? "P2"
        : "P1"
    );

  }

}


/* =========================================================
   PLAYER HIT
========================================================= */

function checkPlayerHit(

  p,

  side

){

  if(
    p.hitCooldown>0
  ){

    return;

  }


  /*
    球與皮卡丘碰撞區。

    玩家身體範圍略大，
    操作比較容易。
  */

  const cx=
    p.x+
    p.w/2;

  const cy=
    p.y+
    p.h/2;


  const dx=
    ball.x-cx;

  const dy=
    ball.y-cy;


  const distance=
    Math.hypot(
      dx,
      dy
    );


  if(
    distance<
    ball.r+
    28
  ){

    /*
      防止人在球後面
      還能隔空打球。
    */

    if(
      side==="P1" &&
      ball.x>CONFIG.NET_X+15
    ){

      return;

    }


    if(
      side==="P2" &&
      ball.x<CONFIG.NET_X-15
    ){

      return;

    }


    let smash=false;


    if(side==="P1"){

      smash=
        keys.smash1 &&
        p.smashCooldown<=0;

      if(smash){

        keys.smash1=false;

        playerSmash();

      }else{

        normalHit(
          p,
          side
        );

      }

    }else{

      normalHit(
        p,
        side
      );

    }

  }

}


/* =========================================================
   NORMAL HIT
========================================================= */

function normalHit(

  p,

  side

){

  const centerX=
    p.x+
    p.w/2;

  const centerY=
    p.y+
    p.h/2;


  let dx=
    ball.x-centerX;

  let dy=
    ball.y-centerY;


  /*
    如果 dx 太小，
    自動往對方場地打。
  */

  const direction=
    side==="P1"
      ? 1
      : -1;


  if(
    Math.abs(dx)<8
  ){

    dx=
      direction*25;

  }


  /*
    讓球向上。

    不會直接水平飛出去。
  */

  let newVx=
    dx*.065+
    p.vx*.35;


  let newVy=
    -4.2+
    dy*.025;


  /*
    保證往對面。
  */

  if(side==="P1"){

    newVx=
      Math.max(
        1.5,
        newVx
      );

  }else{

    newVx=
      Math.min(
        -1.5,
        newVx
      );

  }


  /*
    限速
  */

  const s=
    Math.hypot(
      newVx,
      newVy
    );


  if(
    s>
    CONFIG.BALL_MAX_SPEED
  ){

    const ratio=
      CONFIG.BALL_MAX_SPEED/s;

    newVx*=ratio;

    newVy*=ratio;

  }


  ball.vx=newVx;

  ball.vy=newVy;

  ball.lastHitBy=side;


  /*
    把球推出皮卡丘。
  */

  ball.x=
    side==="P1"
      ? centerX+35
      : centerX-35;


  ball.y=
    centerY-5;


  p.hitCooldown=12;


  feed.push(
    side==="P1"
      ? "⚡ 皮卡丘接球！"
      : "🔴 對手接球！"
  );


  trimFeed();

  hitSound();

}


/* =========================================================
   PLAYER SMASH
========================================================= */

function playerSmash(){

  p1.smashCooldown=45;

  /*
    扣殺速度不是暴增，
    而是變成較快的向下球。
  */

  const direction=1;


  ball.vx=
    Math.min(
      5.0,
      Math.max(
        2.3,
        ball.vx+
        .8
      )
    );


  /*
    強烈向下，
    但仍有可反應時間。
  */

  ball.vy=
    4.7;


  ball.x=
    p1.x+
    p1.w+
    20;


  ball.y=
    p1.y+
    28;


  ball.lastHitBy="P1";


  feed.push(
    "⚡💥 P1 扣殺！"
  );

  trimFeed();


  smashSound();

  vibration(
    navigator.vibrate
      ? [25,30,25]
      : 20
  );


  /*
    畫面震動
  */

  shakeFrames=12;

}


/* =========================================================
   AI SMASH
========================================================= */

function aiSmash(){

  p2.smashCooldown=60;


  ball.vx=
    Math.max(
      -5.0,
      Math.min(
        -2.4,
        ball.vx-.7
      )
    );


  ball.vy=4.2;


  ball.x=
    p2.x-20;

  ball.y=
    p2.y+25;


  ball.lastHitBy="P2";


  feed.push(
    "🔴💥 AI 扣球！"
  );

  trimFeed();

  smashSound();

}


/* =========================================================
   SCORE
========================================================= */

function scorePoint(

  winner

){

  if(!ball.active)
    return;


  ball.active=false;

  ball.vx=0;

  ball.vy=0;

  ball.trail=[];


  if(winner==="P1"){

    scoreP1++;

    feed.push(
      `🟡 P1 得分！ ${scoreP1} : ${scoreP2}`
    );

    serveSide="P2";

  }else{

    scoreP2++;

    feed.push(
      `🔴 P2 得分！ ${scoreP1} : ${scoreP2}`
    );

    serveSide="P1";

  }


  trimFeed();

  scoreSound();

  vibration(35);


  if(
    scoreP1>=CONFIG.WIN_SCORE ||
    scoreP2>=CONFIG.WIN_SCORE
  ){

    endGame();

    return;

  }


  /*
    得分後：

    不立刻出球。

    重新從球網倒數 3 秒。
  */

  setTimeout(()=>{

    if(
      state==="PLAYING"
    ){

      beginServe(
        serveSide
      );

    }

  },350);


  render();

}


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

  state="RESULT";

  serveState="IDLE";

  ball.active=false;

  cancelAnimationFrame(
    gameLoopId
  );

  clearTimeout(
    countdownTimer
  );

  clearInterval(
    countdownTimer
  );

  const winner=
    scoreP1>=CONFIG.WIN_SCORE
      ? "P1（你）"
      : "P2（AI 對手）";


  feed.push(
    `🏆 遊戲結束！${winner} 獲勝！`
  );


  beep(
    880,
    .3,
    "triangle",
    .07
  );


  try{

    if(

      window.BoomRoomSDK &&

      typeof
        window.BoomRoomSDK
          .gameOver==="function"

    ){

      window.BoomRoomSDK.gameOver(
        scoreP1*20
      );

    }

  }catch(_){}


  render();

}

/* =========================================================
   DRAW
========================================================= */

let shakeFrames=0;


function drawGame(){

  if(!canvas || !ctx)
    return;


  const W=
    CONFIG.WORLD_W;

  const H=
    CONFIG.WORLD_H;


  /*
    Canvas 本身固定世界大小。

    CSS 再負責縮放。

    所以物理不會跟螢幕高度一起變。
  */

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  if(shakeFrames>0){

    const sx=
      (Math.random()-.5)*5;

    const sy=
      (Math.random()-.5)*3;

    ctx.save();

    ctx.translate(
      sx,
      sy
    );

    shakeFrames--;

  }


  drawBackground();

  drawCourt();

  drawNet();

  drawBallTrail();

  drawPikachu(
    p1,
    false
  );

  drawPikachu(
    p2,
    true
  );

  drawBall();


  if(shakeFrames>=0){

    try{
      ctx.restore();
    }catch(_){}

  }

}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

  const gradient=
    ctx.createLinearGradient(
      0,
      0,
      0,
      CONFIG.WORLD_H
    );


  gradient.addColorStop(
    0,
    "#1d2744"
  );

  gradient.addColorStop(
    .55,
    "#11182b"
  );

  gradient.addColorStop(
    1,
    "#070912"
  );


  ctx.fillStyle=gradient;

  ctx.fillRect(
    0,
    0,
    CONFIG.WORLD_W,
    CONFIG.WORLD_H
  );


  /*
    星空
  */

  for(
    let i=0;
    i<35;
    i++
  ){

    const x=
      (i*83)%720;

    const y=
      (i*47)%220;

    ctx.fillStyle=
      "rgba(255,255,255,.35)";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      1.2,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* =========================================================
   COURT
========================================================= */

function drawCourt(){

  /*
    地板
  */

  const ground=
    ctx.createLinearGradient(
      0,
      CONFIG.GROUND_Y,
      0,
      CONFIG.WORLD_H
    );


  ground.addColorStop(
    0,
    "#273653"
  );

  ground.addColorStop(
    1,
    "#10182a"
  );


  ctx.fillStyle=ground;


  ctx.fillRect(
    0,
    CONFIG.GROUND_Y,
    CONFIG.WORLD_W,
    CONFIG.WORLD_H-
    CONFIG.GROUND_Y
  );


  /*
    球場線
  */

  ctx.strokeStyle=
    "rgba(255,255,255,.22)";

  ctx.lineWidth=3;


  ctx.beginPath();

  ctx.moveTo(
    20,
    CONFIG.GROUND_Y
  );

  ctx.lineTo(
    CONFIG.WORLD_W-20,
    CONFIG.GROUND_Y
  );

  ctx.stroke();


  /*
    左右半場
  */

  ctx.strokeStyle=
    "rgba(98,231,255,.15)";

  ctx.lineWidth=2;


  ctx.beginPath();

  ctx.moveTo(
    20,
    CONFIG.GROUND_Y
  );

  ctx.lineTo(
    20,
    CONFIG.GROUND_Y-130
  );

  ctx.lineTo(
    CONFIG.NET_X-10,
    CONFIG.GROUND_Y-130
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(
    CONFIG.NET_X+10,
    CONFIG.GROUND_Y-130
  );

  ctx.lineTo(
    CONFIG.WORLD_W-20,
    CONFIG.GROUND_Y-130
  );

  ctx.lineTo(
    CONFIG.WORLD_W-20,
    CONFIG.GROUND_Y
  );

  ctx.stroke();

}


/* =========================================================
   NET
========================================================= */

function drawNet(){

  /*
    球網
  */

  ctx.fillStyle=
    "#dce8ff";

  ctx.fillRect(
    CONFIG.NET_X-5,
    CONFIG.NET_TOP,
    10,
    CONFIG.GROUND_Y-
    CONFIG.NET_TOP
  );


  /*
    球網陰影
  */

  ctx.fillStyle=
    "rgba(0,0,0,.25)";

  ctx.fillRect(
    CONFIG.NET_X-9,
    CONFIG.NET_TOP,
    4,
    CONFIG.GROUND_Y-
    CONFIG.NET_TOP
  );


  /*
    頂端
  */

  ctx.fillStyle=
    "#fff";

  ctx.fillRect(
    CONFIG.NET_X-8,
    CONFIG.NET_TOP,
    16,
    6
  );

}


/* =========================================================
   BALL TRAIL
========================================================= */

function drawBallTrail(){

  for(
    let i=
      ball.trail.length-1;

    i>=0;

    i--

  ){

    const t=
      ball.trail[i];

    const alpha=
      (1-
      i/
      ball.trail.length)
      *.18;


    ctx.fillStyle=
      `rgba(255,209,102,${alpha})`;


    ctx.beginPath();

    ctx.arc(
      t.x,
      t.y,
      ball.r*
        (.45+
        (1-
        i/
        ball.trail.length)
        *.4),

      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* =========================================================
   BALL
========================================================= */

function drawBall(){

  /*
    發光
  */

  const glow=
    ctx.createRadialGradient(

      ball.x,
      ball.y,
      2,

      ball.x,
      ball.y,
      ball.r*2.5

    );


  glow.addColorStop(
    0,
    "rgba(255,240,160,.65)"
  );

  glow.addColorStop(
    1,
    "rgba(255,209,102,0)"
  );


  ctx.fillStyle=glow;


  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.r*2.5,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    球體
  */

  const g=
    ctx.createRadialGradient(

      ball.x-5,
      ball.y-6,
      2,

      ball.x,
      ball.y,
      ball.r

    );


  g.addColorStop(
    0,
    "#fff8cf"
  );

  g.addColorStop(
    .45,
    "#ffd166"
  );

  g.addColorStop(
    1,
    "#e7a934"
  );


  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.r,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    排球弧線
  */

  ctx.strokeStyle=
    "rgba(100,65,20,.55)";

  ctx.lineWidth=2;


  ctx.beginPath();

  ctx.arc(
    ball.x-2,
    ball.y,
    ball.r*.72,
    -.8,
    .9
  );

  ctx.stroke();


  ctx.beginPath();

  ctx.arc(
    ball.x+3,
    ball.y,
    ball.r*.65,
    2.1,
    4.1
  );

  ctx.stroke();

}


/* =========================================================
   PIKACHU
========================================================= */

function drawPikachu(

  p,

  enemy

){

  const x=p.x;

  const y=p.y;

  const w=p.w;

  const h=p.h;


  ctx.save();


  /*
    陰影
  */

  ctx.fillStyle=
    "rgba(0,0,0,.25)";

  ctx.beginPath();

  ctx.ellipse(
    x+w/2,
    CONFIG.GROUND_Y+4,
    32,
    7,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    尾巴

    P1 左側金色。

    AI 右側。
  */

  ctx.fillStyle=
    enemy
      ? "#d99b25"
      : "#d99b25";


  ctx.beginPath();


  if(!enemy){

    ctx.moveTo(
      x+3,
      y+h*.58
    );

    ctx.lineTo(
      x-16,
      y+h*.40
    );

    ctx.lineTo(
      x-5,
      y+h*.25
    );

    ctx.lineTo(
      x+10,
      y+h*.42
    );

  }else{

    ctx.moveTo(
      x+w-3,
      y+h*.58
    );

    ctx.lineTo(
      x+w+16,
      y+h*.40
    );

    ctx.lineTo(
      x+w+5,
      y+h*.25
    );

    ctx.lineTo(
      x+w-10,
      y+h*.42
    );

  }

  ctx.closePath();

  ctx.fill();


  /*
    身體
  */

  ctx.fillStyle=
    p.color;


  ctx.beginPath();

  ctx.roundRect(
    x+5,
    y+15,
    w-10,
    h-13,
    15
  );

  ctx.fill();


  /*
    耳朵

  */

    "#ffd166";

      x+9,
      y+12,

    );

    );

    );

    );

  );

  ctx.lineTo(

  );

  );

  ctx.beginPath();

  ctx.moveTo(
    x+w-2,
    y+5
  );

  ctx.lineTo(
    x+w-12,
    y+1
  );

  ctx.lineTo(
    x+w-12,
    y+12
  );

  ctx.closePath();

  ctx.fill();


  /*
    臉
  */

  ctx.fillStyle=
    "#ffe8a3";

  ctx.beginPath();

  ctx.arc(
    x+w/2,
    y+31,
    17,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    眼睛
  */

  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    x+w/2-7,
    y+28,
    2.7,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    x+w/2+7,
    y+28,
    2.7,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    腮紅
  */

  ctx.fillStyle=
    "#ff5266";


  ctx.beginPath();

  ctx.arc(
    x+7,
    y+37,
    4.5,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    x+w-7,
    y+37,
    4.5,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    嘴巴
  */

  ctx.strokeStyle=
    "#8b3a32";

  ctx.lineWidth=1.5;

  ctx.beginPath();

  ctx.arc(
    x+w/2,
    y+34,
    5,
    .15,
    Math.PI-.15
  );

  ctx.stroke();


  /*
    腳
  */

  ctx.fillStyle=
    "#d99b25";


  ctx.beginPath();

  ctx.ellipse(
    x+15,
    y+h-3,
    9,
    5,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.ellipse(
    x+w-15,
    y+h-3,
    9,
    5,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.restore();

}


/* =========================================================
   EAR
========================================================= */

function drawEar(

  x,

  y,

  direction

){

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.rotate(
    direction*
    -.15
  );


  ctx.fillStyle=
    "#ffd166";


  ctx.beginPath();

  ctx.moveTo(0,15);

  ctx.lineTo(
    direction*5,
    -13
  );

  ctx.quadraticCurveTo(
    direction*18,
    -18,
    direction*17,
    -4
  );

  ctx.lineTo(
    direction*10,
    15
  );

  ctx.closePath();

  ctx.fill();


  ctx.fillStyle="#272019";


  ctx.beginPath();

  ctx.moveTo(
    direction*5,
    -13
  );

  ctx.quadraticCurveTo(
    direction*15,
    -16,
    direction*17,
    -4
  );

  ctx.lineTo(
    direction*11,
    0
  );

  ctx.closePath();

  ctx.fill();


  ctx.restore();

}


/* =========================================================
   INPUT
========================================================= */

function setupKeyboard(){

  window.addEventListener(
    "keydown",
    e=>{

      const key=
        e.key.toLowerCase();


      if(
        [
          "w",
          "a",
          "s",
          "d",
          " ",
          "j",
          "k",
          "arrowleft",
          "arrowright",
          "arrowup"
        ].includes(key)
      ){

        e.preventDefault();

      }


      if(key==="a")
        keys.left1=true;

      if(key==="d")
        keys.right1=true;

      if(key==="w")
        keys.jump1=true;

      if(key===" ")
        keys.jump1=true;

      if(key==="j")
        keys.smash1=true;

      if(key==="k")
        keys.smash1=true;


      if(key==="arrowleft")
        keys.left1=true;

      if(key==="arrowright")
        keys.right1=true;

      if(key==="arrowup")
        keys.jump1=true;

    },
    {
      passive:false
    }
  );


  window.addEventListener(
    "keyup",
    e=>{

      const key=
        e.key.toLowerCase();


      if(key==="a")
        keys.left1=false;

      if(key==="d")
        keys.right1=false;

      if(key==="w")
        keys.jump1=false;

      if(key===" ")
        keys.jump1=false;

      if(key==="j")
        keys.smash1=false;

      if(key==="k")
        keys.smash1=false;

      if(key==="arrowleft")
        keys.left1=false;

      if(key==="arrowright")
        keys.right1=false;

      if(key==="arrowup")
        keys.jump1=false;

    }
  );

}


/* =========================================================
   TOUCH BUTTONS
========================================================= */

function bindTouch(

  btnId,

  keyName

){

  const btn=
    document.getElementById(
      btnId
    );

  if(!btn) return;


  const down=e=>{

    e.preventDefault();

    initAudio();

    keys[keyName]=true;

    btn.classList.add(
      "active"
    );

  };


  const up=e=>{

    e.preventDefault();

    keys[keyName]=false;

    btn.classList.remove(
      "active"
    );

  };


  btn.addEventListener(
    "pointerdown",
    down,
    {
      passive:false
    }
  );


  btn.addEventListener(
    "pointerup",
    up,
    {
      passive:false
    }
  );


  btn.addEventListener(
    "pointercancel",
    up,
    {
      passive:false
    }
  );


  btn.addEventListener(
    "pointerleave",
    up,
    {
      passive:false
    }
  );

}


/* =========================================================
   RENDER PLAYERS
========================================================= */

function renderPlayers(){

  if(players.size===0){

    return `
      <div class="player me">
        <b>${esc(ME.username)}</b>
        <em>準備中</em>
      </div>
    `;

  }


  return [
    ...players.values()
  ]
  .map(p=>{

    const isMe=
      p.id===ME.id;


    return `

      <div class="player ${isMe?"me":""}">

        <b>
          ${esc(p.username)}
        </b>

        <em>
          房內玩家
        </em>

      </div>

    `;

  })
  .join("");

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(s){

  return String(s||"")
    .replace(
      /[&<>"']/g,
      c=>({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[c])

    );

}
