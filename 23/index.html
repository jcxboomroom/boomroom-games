<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070912">
<title>爆爆皮卡丘排球</title>
<style>
:root{
  --bg:#070912;--panel:#111625;--panel2:#161c2d;--line:#2b3550;--text:#f7f8fb;--muted:#98a3ba;
  --cyan:#62e7ff;--purple:#b76cff;--green:#4ee08a;--red:#ff637a;--gold:#ffd166;
  --t:env(safe-area-inset-top,0px);--b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;user-select:none}
button{font:inherit;border:0;color:var(--text);cursor:pointer}
button:disabled{opacity:.4;cursor:default}
#app{width:100%;height:100dvh;display:flex;justify-content:center}
.shell{width:min(100%,760px);height:100%;display:flex;flex-direction:column;padding:calc(8px + var(--t)) 10px calc(8px + var(--b));gap:8px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:12px}
.center{display:flex;align-items:center;justify-content:center;text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{padding:8px 5px;background:#0b0f18;border:1px solid var(--line);border-radius:12px;text-align:center}
.stat b{display:block;font-size:15px}.stat span{font-size:9px;color:var(--muted)}
.sectionTitle{font-size:13px;font-weight:1000;margin-bottom:8px}.muted{color:var(--muted)}.tiny{font-size:10px;line-height:1.45}
.cta{width:100%;min-height:48px;border-radius:14px;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#070912;font-weight:1000;font-size:15px}
.cta.secondary{background:#192032;color:#fff;border:1px solid var(--line)}
.cta.danger{background:linear-gradient(135deg,#ff4d6d,#e63946);color:#fff}
.cta:active{transform:scale(.97)}
.notice{min-height:22px;color:#d1d6e4;font-size:11px;text-align:center}
.players{display:flex;gap:6px;overflow-x:auto}
.player{min-width:100px;padding:6px 8px;border-radius:11px;background:#0b101c;border:1px solid var(--line);font-size:10px;flex:none}
.player b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player em{display:block;font-style:normal;color:var(--muted)}
.player.me{border-color:#42537b}

#canvasWrap{position:relative;flex:1;min-height:260px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,#1a2035,#070912)}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ctrlGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.ctrlBtn{height:52px;border-radius:14px;background:#161f33;border:1px solid var(--line);font-size:18px;font-weight:bold;color:var(--cyan)}
.ctrlBtn:active{background:var(--cyan);color:#070912}
.feedBox{max-height:75px;overflow-y:auto;font-size:11px;background:#0b0f18;border:1px solid var(--line);border-radius:10px;padding:6px}
</style>
</head>
<body>
<div id="app"><div class="shell">
  <main id="main" class="screen"></main>
</div></div>

<script>
"use strict";

const CONFIG = Object.freeze({
  ENTRY_FEE: 100,
  MIN_PLAYERS: 1,
  MAX_PLAYERS: 8
});

let ME = { id: "local_" + Math.random().toString(36).slice(2, 10), username: "本地玩家", avatar: "", joinedAt: Date.now() };
let sdkIsHost = false;
let gameRoomId = "";
let players = new Map();

let state = "LOBBY"; // LOBBY, PLAYING, RESULT
let scoreP1 = 0;
let scoreP2 = 0;
let feed = [];

// Game Physics & Objects
let canvas, ctx;
let p1 = { x: 80, y: 220, w: 32, h: 32, vx: 0, vy: 0, color: "#ffd166" }; // Pikachu Left
let p2 = { x: 280, y: 220, w: 32, h: 32, vx: 0, vy: 0, color: "#ff637a" }; // Pikachu Right
let ball = { x: 180, y: 100, vx: 2, vy: -2, r: 12 };
let keys = { left1: false, right1: false, jump1: false, smash1: false };
let gameLoopId = null;

function isHost() { return sdkIsHost || players.size <= 1; }

function safeString(v, fallback, maxLen) {
  if (v === null || v === undefined) return fallback;
  const s = String(v).trim();
  return s ? s.slice(0, maxLen) : fallback;
}

function addPlayer(id, username, avatar) {
  if (!id) return;
  id = String(id);
  let p = players.get(id);
  if (!p) {
    p = { id, username: safeString(username, "玩家", 12), avatar: safeString(avatar, "", 300), score: 0 };
    players.set(id, p);
  } else {
    p.username = safeString(username, p.username, 12);
  }
  return p;
}

function setupSDK(data) {
  if (data && data.user) {
    players.delete(ME.id);
    ME.id = String(data.user.id);
    ME.username = safeString(data.user.username, "玩家", 12);
    ME.avatar = safeString(data.user.avatar, "", 300);
    addPlayer(ME.id, ME.username, ME.avatar);
  }
  sdkIsHost = !!(data && data.isHost);
  gameRoomId = (data && data.roomId) || "";

  if (Array.isArray(data.roomPlayers)) {
    data.roomPlayers.forEach(rp => {
      if (rp && rp.id != null) addPlayer(rp.id, rp.username, rp.avatar);
    });
  }
  render();
}

window.addEventListener("message", e => {
  try {
    const d = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
    if (d && d.action === "initSDK") setupSDK(d);
    else if (d && d.action === "gameEventReceived") handleGameEvent(d.eventName, d.payload, d.userId);
  } catch (_) {}
});

window.onBoomRoomSDKReady = function() {
  if (window.BoomRoomSDK) {
    setupSDK({
      user: window.BoomRoomSDK.getUser(),
      isHost: window.BoomRoomSDK.isHost,
      roomId: window.BoomRoomSDK.roomId,
      roomPlayers: window.BoomRoomSDK.roomPlayers || []
    });
  }
};

function sendEvent(eventName, payload) {
  try {
    if (window.BoomRoomSDK && typeof window.BoomRoomSDK.sendGameEvent === "function") {
      window.BoomRoomSDK.sendGameEvent(eventName, payload);
    } else if (window.parent !== window) {
      window.parent.postMessage(JSON.stringify({ action: "sendGameEvent", eventName, payload }), "*");
    }
  } catch (_) {}
}

function handleGameEvent(eventName, payload, senderId) {
  if (eventName === "PIKA_VOLLEY_START") {
    state = "PLAYING";
    scoreP1 = 0;
    scoreP2 = 0;
    feed = ["⚡ 皮卡丘排球開戰！先得 5 分者獲勝。"];
    resetBall("P2");
    startCanvasLoop();
    render();
  }
}

function startCanvasLoop() {
  cancelAnimationFrame(gameLoopId);
  const run = () => {
    if (state !== "PLAYING") return;
    updateGame();
    drawGame();
    gameLoopId = requestAnimationFrame(run);
  };
  gameLoopId = requestAnimationFrame(run);
}

function resetBall(servingSide) {
  ball.x = servingSide === "P1" ? 100 : 260;
  ball.y = 80;
  ball.vx = servingSide === "P1" ? 3 : -3;
  ball.vy = -3;
}

function updateGame() {
  // P1 Movement
  if (keys.left1) p1.vx = -4;
  else if (keys.right1) p1.vx = 4;
  else p1.vx *= 0.8;

  p1.x += p1.vx;
  p1.vy += 0.45; // gravity
  p1.y += p1.vy;

  if (keys.jump1 && p1.y >= 210) {
    p1.vy = -10;
  }

  // Floor bound P1
  if (p1.y > 210) { p1.y = 210; p1.vy = 0; }
  if (p1.x < 20) p1.x = 20;
  if (p1.x > 150) p1.x = 150; // Left side of net

  // Simple AI for P2 (Right side)
  if (ball.x > 180) {
    if (p2.x > ball.x + 10) p2.x -= 3.5;
    else if (p2.x < ball.x - 10) p2.x += 3.5;
    if (ball.y < 150 && p2.y >= 210) p2.vy = -10;
  } else {
    if (p2.x < 280) p2.x += 2;
  }
  p2.y += p2.vy;
  p2.vy += 0.45;
  if (p2.y > 210) { p2.y = 210; p2.vy = 0; }
  if (p2.x < 190) p2.x = 190;
  if (p2.x > 330) p2.x = 330;

  // Ball physics
  ball.x += ball.vx;
  ball.y += ball.vy;
  ball.vy += 0.22; // gravity on ball

  // Wall bounds
  if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -1; }
  if (ball.x > 360 - ball.r) { ball.x = 360 - ball.r; ball.vx *= -1; }
  if (ball.y < ball.r) { ball.y = ball.r; ball.vy *= -1; }

  // Net collision (x: 175 ~ 185, y: 150 ~ 250)
  if (ball.x >= 172 && ball.x <= 188 && ball.y >= 150) {
    ball.vx *= -1;
    ball.x = ball.x < 180 ? 170 : 190;
  }

  // P1 collision
  const dx1 = ball.x - (p1.x + p1.w / 2);
  const dy1 = ball.y - (p1.y + p1.h / 2);
  if (Math.hypot(dx1, dy1) < ball.r + p1.w / 2) {
    ball.vx = dx1 * 0.2 + p1.vx * 0.5;
    ball.vy = dy1 * 0.2 - 7;
    feed.push("⚡ P1 擊球！");
  }

  // P2 collision
  const dx2 = ball.x - (p2.x + p2.w / 2);
  const dy2 = ball.y - (p2.y + p2.h / 2);
  if (Math.hypot(dx2, dy2) < ball.r + p2.w / 2) {
    ball.vx = dx2 * 0.2 + p2.vx * 0.5;
    ball.vy = dy2 * 0.2 - 7;
    feed.push("⚡ P2 擊球！");
  }

  // Ground collision (Score)
  if (ball.y > 245) {
    if (ball.x < 180) {
      scoreP2++;
      feed.push("🔴 P2 得分！ (比分 " + scoreP1 + " : " + scoreP2 + ")");
      resetBall("P1");
    } else {
      scoreP1++;
      feed.push("🟡 P1 得分！ (比分 " + scoreP1 + " : " + scoreP2 + ")");
      resetBall("P2");
    }
    checkGameOver();
  }
}

function checkGameOver() {
  if (scoreP1 >= 5 || scoreP2 >= 5) {
    state = "RESULT";
    cancelAnimationFrame(gameLoopId);
    const winner = scoreP1 >= 5 ? "P1 (你)" : "P2 (AI對手)";
    feed.push(`🏆 遊戲結束！獲勝者：${winner}`);
    try {
      if (window.BoomRoomSDK && typeof window.BoomRoomSDK.gameOver === "function") {
        window.BoomRoomSDK.gameOver(scoreP1 * 20);
      }
    } catch(_) {}
    render();
  }
}

function drawGame() {
  if (!canvas || !ctx) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw Net
  ctx.fillStyle = "#fff";
  ctx.fillRect(177, 160, 6, 90);

  // Draw P1
  ctx.fillStyle = p1.color;
  ctx.beginPath();
  ctx.roundRect(p1.x, p1.y, p1.w, p1.h, [10]);
  ctx.fill();

  // Draw P2
  ctx.fillStyle = p2.color;
  ctx.beginPath();
  ctx.roundRect(p2.x, p2.y, p2.w, p2.h, [10]);
  ctx.fill();

  // Draw Ball (Volleyball)
  ctx.fillStyle = "#ffd166";
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#111";
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function renderPlayers() {
  return [...players.values()].map(p => {
    const isMe = p.id === ME.id;
    return `<div class="player ${isMe?'me':''}">
      <b>${esc(p.username)}</b>
      <em>比分: ${scoreP1} : ${scoreP2}</em>
    </div>`;
  }).join("");
}

function esc(s) { return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function runLocalDevTest() {
  players.clear();
  addPlayer(ME.id, ME.username, ME.avatar);
  sendEvent("PIKA_VOLLEY_START", {});
  handleGameEvent("PIKA_VOLLEY_START", {}, ME.id);
}

function render() {
  const main = document.getElementById("main");
  if (!main) return;

  if (state === "LOBBY") {
    main.innerHTML = `
      <section class="panel"><div class="stats"><div class="stat"><b>100</b><span>Entry 銀幣</span></div><div class="stat"><b>${players.size}</b><span>房內玩家</span></div><div class="stat"><b>5 分</b><span>先到獲勝</span></div><div class="stat"><b>神級懷舊</b><span>經典對決</span></div></div></section>
      <section class="panel"><div class="sectionTitle">房內玩家</div><div class="players">${renderPlayers()}</div></section>
      ${isHost() ? `<button id="startBtn" class="cta">👑 室長：開始《皮卡丘排球》</button>` : '<div class="notice">等待室長開始遊戲...</div>'}
      <button id="devBtn" class="cta secondary" style="margin-top:8px;">🧪 本地測試：直接開局體驗</button>
    `;
    document.getElementById("startBtn")?.addEventListener("click", () => {
      sendEvent("PIKA_VOLLEY_START", {});
      handleGameEvent("PIKA_VOLLEY_START", {}, ME.id);
    });
    document.getElementById("devBtn")?.addEventListener("click", () => {
      runLocalDevTest();
    });
    return;
  }

  if (state === "PLAYING") {
    main.innerHTML = `
      <div class="stats" style="flex:none;">
        <div class="stat"><b>🟡 P1: ${scoreP1} 分</b><span>我方陣營</span></div>
        <div class="stat"><b>VS</b><span>排球對決</span></div>
        <div class="stat"><b>🔴 P2: ${scoreP2} 分</b><span>對手陣營</span></div>
      </div>

      <div id="canvasWrap">
        <canvas id="gameCanvas" width="360" height="250"></canvas>
      </div>

      <div class="ctrlGrid">
        <button id="leftBtn" class="ctrlBtn">◀</button>
        <button id="rightBtn" class="ctrlBtn">▶</button>
        <button id="jumpBtn" class="ctrlBtn" style="color:var(--gold);">▲ 跳</button>
        <button id="smashBtn" class="ctrlBtn" style="color:var(--red);">⚡ 扣</button>
      </div>

      <div class="feedBox">${feed.map(f => `<div>${f}</div>`).join("")}</div>
    `;

    canvas = document.getElementById("gameCanvas");
    if (canvas) {
      ctx = canvas.getContext("2d");
    }

    const bindTouch = (btnId, keyName) => {
      const btn = document.getElementById(btnId);
      if (!btn) return;
      btn.addEventListener("pointerdown", e => { e.preventDefault(); keys[keyName] = true; });
      btn.addEventListener("pointerup", e => { e.preventDefault(); keys[keyName] = false; });
      btn.addEventListener("pointerleave", e => { e.preventDefault(); keys[keyName] = false; });
    };
    bindTouch("leftBtn", "left1");
    bindTouch("rightBtn", "right1");
    bindTouch("jumpBtn", "jump1");
    bindTouch("smashBtn", "smash1");

    startCanvasLoop();
    return;
  }

  if (state === "RESULT") {
    main.innerHTML = `
      <section class="panel center" style="flex:1;">
        <div>
          <h2>🏆 皮卡丘排球結算</h2>
          <p style="font-size:18px;font-weight:bold;color:var(--gold);margin:10px 0;">最終比分：P1 [ ${scoreP1} ] : [ ${scoreP2} ] P2</p>
          <div class="feedBox" style="max-height:120px;margin-top:12px;">${feed.map(f => `<div>${f}</div>`).join("")}</div>
          <button id="restartBtn" class="cta" style="margin-top:16px;">返回大廳</button>
        </div>
      </section>
    `;
    document.getElementById("restartBtn")?.addEventListener("click", () => {
      state = "LOBBY";
      render();
    });
  }
}

// 預設初次渲染
addPlayer(ME.id, ME.username, ME.avatar);
render();
</script>
</body>
</html>
