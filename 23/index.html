<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<meta name="theme-color" content="#070912">

<title>爆爆皮卡丘排球</title>

<style>
:root{
  --bg:#070912;
  --panel:#111625;
  --panel2:#161c2d;
  --line:#2b3550;
  --text:#f7f8fb;
  --muted:#98a3ba;

  --cyan:#62e7ff;
  --purple:#b76cff;
  --green:#4ee08a;
  --red:#ff637a;
  --gold:#ffd166;

  --t:env(safe-area-inset-top,0px);
  --b:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;

  user-select:none;
  -webkit-user-select:none;
}

body{
  overscroll-behavior:none;
}

button{
  font:inherit;
  border:0;
  color:var(--text);
  cursor:pointer;
  touch-action:none;
}

button:disabled{
  opacity:.4;
  cursor:default;
}

#app{
  width:100%;
  height:100dvh;

  display:flex;
  justify-content:center;
  align-items:stretch;
}

.shell{
  width:min(100%,760px);
  height:100%;

  display:flex;
  flex-direction:column;

  padding:
    calc(8px + var(--t))
    10px
    calc(8px + var(--b));

  gap:8px;
}

.screen{
  flex:1;
  min-height:0;

  display:flex;
  flex-direction:column;
  gap:8px;
}

.panel{
  background:
    linear-gradient(
      180deg,
      var(--panel2),
      var(--panel)
    );

  border:1px solid var(--line);
  border-radius:18px;
  padding:12px;
}

.center{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.stat{
  padding:8px 5px;

  background:#0b0f18;
  border:1px solid var(--line);
  border-radius:12px;

  text-align:center;
}

.stat b{
  display:block;
  font-size:15px;
}

.stat span{
  font-size:9px;
  color:var(--muted);
}

.sectionTitle{
  font-size:13px;
  font-weight:1000;
  margin-bottom:8px;
}

.muted{
  color:var(--muted);
}

.tiny{
  font-size:10px;
  line-height:1.45;
}

.cta{
  width:100%;
  min-height:48px;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      var(--cyan),
      var(--purple)
    );

  color:#070912;

  font-weight:1000;
  font-size:15px;

  touch-action:manipulation;
}

.cta.secondary{
  background:#192032;
  color:#fff;
  border:1px solid var(--line);
}

.cta:active{
  transform:scale(.97);
}

.notice{
  min-height:22px;

  color:#d1d6e4;
  font-size:11px;

  text-align:center;
}

.players{
  display:flex;
  gap:6px;
  overflow-x:auto;
}

.player{
  min-width:100px;

  padding:6px 8px;

  border-radius:11px;

  background:#0b101c;
  border:1px solid var(--line);

  font-size:10px;
  flex:none;
}

.player b{
  display:block;
  font-size:12px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.player em{
  display:block;
  font-style:normal;
  color:var(--muted);
}

/* =========================
   GAME
========================= */

.gameTop{
  flex:none;
}

#canvasWrap{
  position:relative;

  flex:1;
  min-height:260px;

  border-radius:16px;
  overflow:hidden;

  border:1px solid var(--line);

  background:
    linear-gradient(
      180deg,
      #182039,
      #070912
    );

  display:flex;
  align-items:center;
  justify-content:center;
}

#gameCanvas{
  position:absolute;

  width:100%;
  height:100%;

  left:0;
  top:0;

  display:block;

  touch-action:none;
}

/* =========================
   MOBILE CONTROLS
========================= */

.ctrlGrid{
  display:grid;

  grid-template-columns:
    1.2fr
    1.2fr
    1fr
    1fr;

  gap:6px;

  flex:none;
}

.ctrlBtn{
  height:54px;

  border-radius:14px;

  background:#161f33;
  border:1px solid var(--line);

  font-size:19px;
  font-weight:bold;

  color:var(--cyan);

  touch-action:none;

  transition:
    transform .06s,
    background .06s;
}

.ctrlBtn.active{
  background:var(--cyan);
  color:#070912;

  transform:scale(.96);
}

.jumpBtn{
  color:var(--gold);
}

.smashBtn{
  color:var(--red);
}

.smashBtn.active{
  background:var(--red);
  color:#fff;
}

/* =========================
   FEED
========================= */

.feedBox{
  max-height:72px;

  overflow-y:auto;

  font-size:11px;

  background:#0b0f18;

  border:1px solid var(--line);
  border-radius:10px;

  padding:6px;

  flex:none;
}

.feedBox div{
  margin:2px 0;
}

/* =========================
   COUNTDOWN
========================= */

#countdownOverlay{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:none;

  background:
    radial-gradient(
      circle,
      rgba(98,231,255,.12),
      rgba(0,0,0,.35)
    );
}

.countNumber{
  font-size:76px;
  font-weight:1000;

  color:#fff;

  text-shadow:
    0 0 10px var(--cyan),
    0 0 30px var(--purple),
    0 8px 30px #000;

  animation:countPop .55s ease-out;
}

@keyframes countPop{
  0%{
    transform:scale(.35);
    opacity:0;
  }

  65%{
    transform:scale(1.15);
    opacity:1;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }
}

/* =========================
   HIT EFFECT
========================= */

.hitFlash{
  position:absolute;
  pointer-events:none;

  width:80px;
  height:80px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.9),
      rgba(98,231,255,.5),
      transparent 70%
    );

  transform:translate(-50%,-50%) scale(.3);

  animation:hitFlash .35s ease-out forwards;
}

@keyframes hitFlash{
  to{
    transform:translate(-50%,-50%) scale(1.5);
    opacity:0;
  }
}

/* =========================
   RESULT
========================= */

.resultScore{
  font-size:22px;
  font-weight:1000;
  color:var(--gold);
  margin:10px 0;
}
</style>
</head>

<body>

<div id="app">

  <div class="shell">

    <main id="main" class="screen"></main>

  </div>

</div>

<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const CONFIG = Object.freeze({

  ENTRY_FEE:100,

  MIN_PLAYERS:1,

  MAX_PLAYERS:8,

  WIN_SCORE:5,

  /* 遊戲世界固定尺寸
     不跟手機畫面比例改變 */
  WORLD_W:360,

  WORLD_H:250,

  FLOOR_Y:224,

  NET_X:180,

  NET_TOP:142,

  NET_BOTTOM:224,

  PLAYER_W:32,

  PLAYER_H:40,

  BALL_R:10,

  GRAVITY:0.20,

  PLAYER_GRAVITY:0.55,

  PLAYER_SPEED:2.8,

  PLAYER_ACCEL:0.42,

  PLAYER_FRICTION:0.78,

  JUMP_POWER:8.7,

  NORMAL_HIT_SPEED:5.4,

  SMASH_SPEED:7.0,

  MAX_BALL_SPEED:7.8,

  COUNTDOWN_MS:3000,

  POINT_DELAY_MS:1300,

  AI_SPEED:1.85,

  AI_REACTION:0.12

});


/* =========================================================
   SDK / ROOM
========================================================= */

let ME = {

  id:
    "local_" +
    Math.random()
      .toString(36)
      .slice(2,10),

  username:"本地玩家",

  avatar:"",

  joinedAt:Date.now()

};

let sdkIsHost=false;

let gameRoomId="";

let players=new Map();


/* =========================================================
   GAME STATE
========================================================= */

let state="LOBBY";

/*
  LOBBY
  COUNTDOWN
  PLAYING
  POINT
  RESULT
*/

let scoreP1=0;

let scoreP2=0;

let feed=[];

let countdownTimer=null;

let pointTimer=null;

let countdownValue=0;


/* =========================================================
   CANVAS
========================================================= */

let canvas=null;

let ctx=null;

let gameLoopId=null;

let lastTime=0;


/* =========================================================
   PLAYER
========================================================= */

let p1={

  x:70,

  y:184,

  w:CONFIG.PLAYER_W,

  h:CONFIG.PLAYER_H,

  vx:0,

  vy:0,

  color:"#ffd166",

  facing:1,

  onGround:false,

  hitCooldown:0,

  smashCooldown:0

};


let p2={

  x:258,

  y:184,

  w:CONFIG.PLAYER_W,

  h:CONFIG.PLAYER_H,

  vx:0,

  vy:0,

  color:"#ff637a",

  facing:-1,

  onGround:false,

  hitCooldown:0,

  smashCooldown:0

};


/* =========================================================
   BALL
========================================================= */

let ball={

  x:180,

  y:90,

  vx:0,

  vy:0,

  r:CONFIG.BALL_R,

  active:false,

  side:"P1",

  lastHit:"",

  smash:false,

  trail:[]

};


/* =========================================================
   CONTROLS
========================================================= */

let keys={

  left1:false,

  right1:false,

  jump1:false,

  smash1:false

};


/* =========================================================
   EFFECTS
========================================================= */

let particles=[];

let screenShake=0;

let hitEffects=[];

let audioCtx=null;


/* =========================================================
   BASIC UTIL
========================================================= */

function safeString(v,fallback,maxLen){

  if(v===null || v===undefined){

    return fallback;

  }

  const s=String(v).trim();

  return s ? s.slice(0,maxLen) : fallback;

}


function esc(s){

  return String(s || "")
    .replace(
      /[&<>"']/g,
      c=>({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[c])
    );

}


/* =========================================================
   ROOM
========================================================= */

function addPlayer(id,username,avatar){

  if(!id) return;

  id=String(id);

  let p=players.get(id);

  if(!p){

    p={

      id,

      username:safeString(
        username,
        "玩家",
        12
      ),

      avatar:safeString(
        avatar,
        "",
        300
      ),

      score:0

    };

    players.set(id,p);

  }else{

    p.username=safeString(
      username,
      p.username,
      12
    );

  }

  return p;

}


function isHost(){

  return sdkIsHost || players.size<=1;

}


/* =========================================================
   SDK
========================================================= */

function setupSDK(data){

  try{

    if(data && data.user){

      players.delete(ME.id);

      ME.id=String(data.user.id);

      ME.username=safeString(
        data.user.username,
        "玩家",
        12
      );

      ME.avatar=safeString(
        data.user.avatar,
        "",
        300
      );

      addPlayer(
        ME.id,
        ME.username,
        ME.avatar
      );

    }

    sdkIsHost=!!(
      data &&
      data.isHost
    );

    gameRoomId=
      (data && data.roomId) || "";

    if(
      data &&
      Array.isArray(data.roomPlayers)
    ){

      data.roomPlayers.forEach(rp=>{

        if(rp && rp.id!=null){

          addPlayer(
            rp.id,
            rp.username,
            rp.avatar
          );

        }

      });

    }

    render();

  }catch(_){}

}


window.addEventListener(
  "message",
  e=>{

    try{

      const d=
        typeof e.data==="string"
          ?JSON.parse(e.data)
          :e.data;

      if(
        d &&
        d.action==="initSDK"
      ){

        setupSDK(d);

      }else if(
        d &&
        d.action==="gameEventReceived"
      ){

        handleGameEvent(
          d.eventName,
          d.payload,
          d.userId
        );

      }

    }catch(_){}

  }
);


window.onBoomRoomSDKReady=function(){

  try{

    if(window.BoomRoomSDK){

      setupSDK({

        user:
          window.BoomRoomSDK.getUser(),

        isHost:
          window.BoomRoomSDK.isHost,

        roomId:
          window.BoomRoomSDK.roomId,

        roomPlayers:
          window.BoomRoomSDK.roomPlayers || []

      });

    }

  }catch(_){}

};


function sendEvent(eventName,payload){

  try{

    if(
      window.BoomRoomSDK &&
      typeof window.BoomRoomSDK.sendGameEvent===
        "function"
    ){

      window.BoomRoomSDK.sendGameEvent(
        eventName,
        payload
      );

    }else if(
      window.parent!==window
    ){

      window.parent.postMessage(
        JSON.stringify({

          action:"sendGameEvent",

          eventName,

          payload

        }),
        "*"
      );

    }

  }catch(_){}

}


/* =========================================================
   GAME EVENTS
========================================================= */

function handleGameEvent(
  eventName,
  payload,
  senderId
){

  if(
    eventName==="PIKA_VOLLEY_START"
  ){

    beginMatch();

  }

}


/* =========================================================
   AUDIO
========================================================= */

function initAudio(){

  try{

    if(!audioCtx){

      audioCtx=
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(audioCtx.state==="suspended"){

      audioCtx.resume();

    }

  }catch(_){}

}


function beep(
  frequency=440,
  duration=.08,
  type="square",
  volume=.035
){

  try{

    initAudio();

    if(!audioCtx) return;

    const osc=
      audioCtx.createOscillator();

    const gain=
      audioCtx.createGain();

    osc.type=type;

    osc.frequency.value=frequency;

    gain.gain.value=volume;

    osc.connect(gain);

    gain.connect(audioCtx.destination);

    const now=audioCtx.currentTime;

    gain.gain.setValueAtTime(
      volume,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      now+duration
    );

    osc.start(now);

    osc.stop(
      now+duration+.02
    );

  }catch(_){}

}


function playHitSound(){

  beep(
    520,
    .055,
    "square",
    .045
  );

}


function playSmashSound(){

  beep(
    130,
    .11,
    "sawtooth",
    .055
  );

  setTimeout(
    ()=>{
      beep(
        720,
        .08,
        "square",
        .035
      );
    },
    35
  );

}


function playPointSound(){

  beep(
    330,
    .08,
    "square",
    .04
  );

  setTimeout(
    ()=>{
      beep(
        660,
        .14,
        "square",
        .04
      );
    },
    90
  );

}


/* =========================================================
   VIBRATION
========================================================= */

function vibrate(pattern){

  try{

    if(
      navigator.vibrate &&
      typeof navigator.vibrate==="function"
    ){

      navigator.vibrate(pattern);

    }

  }catch(_){}

}


/* =========================================================
   MATCH START
========================================================= */

function beginMatch(){

  clearTimeout(pointTimer);

  clearInterval(countdownTimer);

  scoreP1=0;

  scoreP2=0;

  feed=[
    "⚡ 皮卡丘排球開戰！",
    "🎯 先得到 "+CONFIG.WIN_SCORE+" 分獲勝"
  ];

  resetPlayers();

  state="COUNTDOWN";

  countdownValue=3;

  render();

  playCountdown();

}


/* =========================================================
   COUNTDOWN
========================================================= */

function playCountdown(){

  clearInterval(countdownTimer);

  countdownValue=3;

  updateCountdownUI();

  beep(
    440,
    .09,
    "square",
    .04
  );

  countdownTimer=setInterval(()=>{

    countdownValue--;

    if(countdownValue>0){

      updateCountdownUI();

      beep(
        440,
        .09,
        "square",
        .04
      );

    }else{

      clearInterval(countdownTimer);

      countdownTimer=null;

      countdownValue=0;

      updateCountdownUI();

      beep(
        880,
        .16,
        "square",
        .05
      );

      setTimeout(
        ()=>{
          startServe("P1");
        },
        250
      );

    }

  },1000);

}


function updateCountdownUI(){

  const el=
    document.getElementById(
      "countdownOverlay"
    );

  if(!el) return;

  if(
    state!=="COUNTDOWN" &&
    state!=="POINT"
  ){

    el.innerHTML="";

    return;

  }

  if(countdownValue>0){

    el.innerHTML=
      `<div class="countNumber">
        ${countdownValue}
       </div>`;

  }else{

    el.innerHTML=
      `<div class="countNumber"
            style="font-size:48px;color:#4ee08a;">
          GO!
       </div>`;

    setTimeout(()=>{

      if(
        state==="PLAYING" &&
        el
      ){

        el.innerHTML="";

      }

    },450);

  }

}


/* =========================================================
   RESET PLAYERS
========================================================= */

function resetPlayers(){

  p1.x=70;
  p1.y=CONFIG.FLOOR_Y-p1.h;
  p1.vx=0;
  p1.vy=0;
  p1.onGround=true;

  p2.x=258;
  p2.y=CONFIG.FLOOR_Y-p2.h;
  p2.vx=0;
  p2.vy=0;
  p2.onGround=true;

  keys.left1=false;
  keys.right1=false;
  keys.jump1=false;
  keys.smash1=false;

}


/* =========================================================
   SERVE
========================================================= */

function startServe(side){

  state="PLAYING";

  resetPlayers();

  /*
    球永遠從球網附近開始，
    然後往指定的一側發球。
  */

  ball.x=CONFIG.NET_X;

  ball.y=108;

  ball.side=side;

  ball.active=true;

  ball.smash=false;

  ball.lastHit="";

  ball.trail=[];

  /*
    從中間發出去，
    而不是直接出生在人物旁邊。
  */

  const direction=
    side==="P1"
      ? -1
      : 1;

  ball.vx=
    direction*3.0;

  ball.vy=-1.8;

  particles=[];

  screenShake=0;

  startCanvasLoop();

  render();

  setTimeout(
    ()=>{
      if(
        state==="PLAYING"
      ){

        feed.push(
          side==="P1"
            ? "🟡 P1 發球！"
            : "🔴 P2 發球！"
        );

        trimFeed();

      }
    },
    100
  );

}


/* =========================================================
   POINT
========================================================= */

function pointScored(side){

  if(state!=="PLAYING") return;

  ball.active=false;

  if(side==="P1"){

    scoreP1++;

    feed.push(
      `🟡 P1 得分！ ${scoreP1} : ${scoreP2}`
    );

  }else{

    scoreP2++;

    feed.push(
      `🔴 P2 得分！ ${scoreP1} : ${scoreP2}`
    );

  }

  trimFeed();

  playPointSound();

  vibrate([35,25,55]);

  screenShake=5;

  state="POINT";

  render();

  if(
    scoreP1>=CONFIG.WIN_SCORE ||
    scoreP2>=CONFIG.WIN_SCORE
  ){

    setTimeout(
      finishMatch,
      CONFIG.POINT_DELAY_MS
    );

    return;

  }

  /*
    等待後重新倒數，
    不瞬間把球放回去。
  */

  pointTimer=setTimeout(
    ()=>{

      state="COUNTDOWN";

      countdownValue=3;

      render();

      playCountdown();

    },
    CONFIG.POINT_DELAY_MS
  );

}


/* =========================================================
   FINISH
========================================================= */

function finishMatch(){

  state="RESULT";

  cancelAnimationFrame(gameLoopId);

  gameLoopId=null;

  const winner=
    scoreP1>=CONFIG.WIN_SCORE
      ? "P1（你）"
      : "P2（AI）";

  feed.push(
    `🏆 比賽結束！${winner} 獲勝！`
  );

  trimFeed();

  try{

    if(
      window.BoomRoomSDK &&
      typeof window.BoomRoomSDK.gameOver===
        "function"
    ){

      window.BoomRoomSDK.gameOver(
        scoreP1*20
      );

    }

  }catch(_){}

  render();

}


/* =========================================================
   FEED
========================================================= */

function trimFeed(){

  if(feed.length>10){

    feed=
      feed.slice(
        feed.length-10
      );

  }

}


/* =========================================================
   MAIN GAME LOOP
========================================================= */

function startCanvasLoop(){

  cancelAnimationFrame(gameLoopId);

  lastTime=performance.now();

  const run=(time)=>{

    if(
      state!=="PLAYING"
    ){

      return;

    }

    /*
      固定時間步進，
      避免手機 FPS 高低造成速度忽快忽慢。
    */

    let dt=
      (time-lastTime)/16.6667;

    lastTime=time;

    dt=Math.max(
      .55,
      Math.min(
        dt,
        1.25
      )
    );

    updateGame(dt);

    drawGame();

    gameLoopId=
      requestAnimationFrame(run);

  };

  gameLoopId=
    requestAnimationFrame(run);

}


/* =========================================================
   UPDATE GAME
========================================================= */

function updateGame(dt){

  updateP1(dt);

  updateAI(dt);

  updateBall(dt);

  updateParticles(dt);

  updateEffects(dt);

  if(screenShake>0){

    screenShake*=.82;

    if(screenShake<.1){

      screenShake=0;

    }

  }

}


/* =========================================================
   P1
========================================================= */

function updateP1(dt){

  /*
    加速度移動，
    不再一按就瞬間高速。
  */

  let target=0;

  if(keys.left1){

    target=-CONFIG.PLAYER_SPEED;

  }

  if(keys.right1){

    target=CONFIG.PLAYER_SPEED;

  }

  p1.vx +=
    (target-p1.vx)*
    CONFIG.PLAYER_ACCEL*
    dt;

  if(
    !keys.left1 &&
    !keys.right1
  ){

    p1.vx*=
      Math.pow(
        CONFIG.PLAYER_FRICTION,
        dt
      );

  }

  p1.x+=p1.vx*dt;

  /*
    玩家只在左半場。
  */

  p1.x=
    Math.max(
      18,
      Math.min(
        148,
        p1.x
      )
    );

  /*
    Jump
  */

  if(
    keys.jump1 &&
    p1.onGround
  ){

    p1.vy=
      -CONFIG.JUMP_POWER;

    p1.onGround=false;

    keys.jump1=false;

    beep(
      260,
      .05,
      "square",
      .025
    );

  }

  p1.vy+=
    CONFIG.PLAYER_GRAVITY*dt;

  p1.y+=
    p1.vy*dt;

  if(
    p1.y>=
    CONFIG.FLOOR_Y-p1.h
  ){

    p1.y=
      CONFIG.FLOOR_Y-p1.h;

    p1.vy=0;

    p1.onGround=true;

  }else{

    p1.onGround=false;

  }

  p1.hitCooldown=
    Math.max(
      0,
      p1.hitCooldown-dt
    );

  p1.smashCooldown=
    Math.max(
      0,
      p1.smashCooldown-dt
    );

  /*
    普通擊球
  */

  if(
    ball.active &&
    p1.hitCooldown<=0
  ){

    const distance=
      distanceToPlayer(
        ball,
        p1
      );

    if(
      distance<
      29
    ){

      const smash=
        keys.smash1;

      hitBall(
        p1,
        "P1",
        smash
      );

      keys.smash1=false;

    }

  }

}


/* =========================================================
   AI
========================================================= */

function updateAI(dt){

  /*
    AI 不再只看 ball.x > 180。
    只要球進入右半場，
    就會持續追球。

    球還在左邊時，
    AI 會回到合理防守位置。
  */

  let targetX=270;

  if(ball.active){

    if(ball.x>=CONFIG.NET_X){

      /*
        預判球落點，
        讓 AI 不會像瞬移。
      */

      targetX=
        predictBallX();

    }else{

      /*
        球在左邊，
        AI 回到右側中央。
      */

      targetX=272;

    }

  }

  targetX=
    Math.max(
      198,
      Math.min(
        328,
        targetX
      )
    );

  const diff=
    targetX-p2.x;

  /*
    AI 最大速度有限制。
  */

  const aiStep=
    CONFIG.AI_SPEED*dt;

  if(Math.abs(diff)>4){

    p2.x+=
      Math.sign(diff)*
      Math.min(
        Math.abs(diff),
        aiStep
      );

  }

  /*
    AI 跳球。

    只在球靠近右側，
    且球高度合適時跳。
  */

  const ballNear=
    ball.x>195 &&
    ball.x<330;

  const ballLow=
    ball.y>125;

  const horizontalClose=
    Math.abs(
      ball.x-
      (p2.x+p2.w/2)
    )<38;

  if(
    ball.active &&
    p2.onGround &&
    ballNear &&
    (
      ballLow ||
      horizontalClose
    )
  ){

    /*
      不要每一幀重複跳。
    */

    if(
      ball.vy>0 &&
      ball.y<200
    ){

      p2.vy=
        -CONFIG.JUMP_POWER*0.92;

      p2.onGround=false;

    }

  }

  p2.vy+=
    CONFIG.PLAYER_GRAVITY*dt;

  p2.y+=
    p2.vy*dt;

  if(
    p2.y>=
    CONFIG.FLOOR_Y-p2.h
  ){

    p2.y=
      CONFIG.FLOOR_Y-p2.h;

    p2.vy=0;

    p2.onGround=true;

  }else{

    p2.onGround=false;

  }

  p2.hitCooldown=
    Math.max(
      0,
      p2.hitCooldown-dt
    );

  /*
    AI 擊球
  */

  if(
    ball.active &&
    p2.hitCooldown<=0
  ){

    const distance=
      distanceToPlayer(
        ball,
        p2
      );

    if(
      distance<29
    ){

      /*
        AI 偶爾殺球，
        但不會每球都殺。
      */

      const smash=
        ball.y<180 &&
        Math.random()<0.24;

      hitBall(
        p2,
        "P2",
        smash
      );

    }

  }

}


/* =========================================================
   PREDICT BALL
========================================================= */

function predictBallX(){

  let x=ball.x;

  let y=ball.y;

  let vx=ball.vx;

  let vy=ball.vy;

  for(
    let i=0;
    i<35;
    i++
  ){

    x+=vx;

    y+=vy;

    vy+=CONFIG.GRAVITY;

    if(
      x<CONFIG.BALL_R ||
      x>CONFIG.WORLD_W-CONFIG.BALL_R
    ){

      vx*=-1;

    }

    if(
      y<CONFIG.BALL_R
    ){

      y=CONFIG.BALL_R;

      vy*=-.9;

    }

    if(
      y>CONFIG.FLOOR_Y
    ){

      break;

    }

  }

  return x;

}


/* =========================================================
   BALL
========================================================= */

function updateBall(dt){

  if(!ball.active){

    return;

  }

  /*
    保存軌跡
  */

  ball.trail.push({

    x:ball.x,

    y:ball.y

  });

  if(ball.trail.length>10){

    ball.trail.shift();

  }

  ball.x+=
    ball.vx*dt;

  ball.y+=
    ball.vy*dt;

  ball.vy+=
    CONFIG.GRAVITY*dt;

  /*
    球速限制
  */

  const speed=
    Math.hypot(
      ball.vx,
      ball.vy
    );

  if(
    speed>
    CONFIG.MAX_BALL_SPEED
  ){

    const scale=
      CONFIG.MAX_BALL_SPEED/
      speed;

    ball.vx*=scale;

    ball.vy*=scale;

  }

  /*
    左右牆
  */

  if(
    ball.x<
    ball.r
  ){

    ball.x=ball.r;

    ball.vx=
      Math.abs(ball.vx);

  }

  if(
    ball.x>
    CONFIG.WORLD_W-ball.r
  ){

    ball.x=
      CONFIG.WORLD_W-ball.r;

    ball.vx=
      -Math.abs(ball.vx);

  }

  /*
    天花板
  */

  if(
    ball.y<
    ball.r
  ){

    ball.y=ball.r;

    ball.vy=
      Math.abs(ball.vy)*.88;

  }

  /*
    球網碰撞
  */

  if(
    ball.x+ball.r>=
      CONFIG.NET_X-3 &&
    ball.x-ball.r<=
      CONFIG.NET_X+3 &&
    ball.y>
      CONFIG.NET_TOP
  ){

    if(ball.vx>0){

      ball.x=
        CONFIG.NET_X-
        ball.r-
        3;

      ball.vx=
        -Math.abs(ball.vx)*.92;

    }else{

      ball.x=
        CONFIG.NET_X+
        ball.r+
        3;

      ball.vx=
        Math.abs(ball.vx)*.92;

    }

  }

  /*
    玩家擊球在 updateP1 / updateAI
    裡面處理。
  */

  /*
    落地
  */

  if(
    ball.y-ball.r>
    CONFIG.FLOOR_Y
  ){

    const scoringSide=
      ball.x<
      CONFIG.NET_X
        ? "P2"
        : "P1";

    pointScored(
      scoringSide
    );

  }

}


/* =========================================================
   PLAYER DISTANCE
========================================================= */

function distanceToPlayer(
  b,
  p
){

  const cx=
    p.x+p.w/2;

  const cy=
    p.y+p.h/2;

  return Math.hypot(
    b.x-cx,
    b.y-cy
  );

}


/* =========================================================
   HIT BALL
========================================================= */

function hitBall(
  player,
  side,
  smash=false
){

  if(
    !ball.active
  ){

    return;

  }

  /*
    防止同一幀重複碰撞。
  */

  player.hitCooldown=
    smash
      ? 12
      : 8;

  /*
    球方向永遠往對方場地。
  */

  const direction=
    side==="P1"
      ? 1
      : -1;

  const centerX=
    player.x+
    player.w/2;

  const centerY=
    player.y+
    player.h/2;

  const dx=
    ball.x-centerX;

  const dy=
    ball.y-centerY;

  /*
    一般擊球：
    - 橫向速度適中
    - 往上飛
  */

  if(!smash){

    ball.vx=
      direction*
      (
        CONFIG.NORMAL_HIT_SPEED+
        Math.min(
          1.1,
          Math.abs(dx)*.035
        )
      );

    /*
      根據人物與球的位置，
      產生自然不同高度。
    */

    ball.vy=
      -5.2-
      Math.max(
        0,
        -dy*.035
      );

    ball.smash=false;

    playHitSound();

    vibrate(12);

    createHitEffect(
      ball.x,
      ball.y,
      "#62e7ff"
    );

    feed.push(
      side==="P1"
        ? "⚡ 皮卡丘擊球！"
        : "🔴 AI 擊球！"
    );

  }else{

    /*
      =========================
      真正的殺球
      =========================

      殺球：
      1. 橫向速度更快
      2. 球不會一直往天上飛
      3. 有明顯向下角度
      4. 視覺閃電
    */

    ball.vx=
      direction*
      CONFIG.SMASH_SPEED;

    /*
      根據擊球高度調整向下力量。
    */

    const downward=
      ball.y<145
        ? 1.4
        : 2.4;

    ball.vy=
      downward;

    ball.smash=true;

    playSmashSound();

    vibrate(
      [25,20,70]
    );

    screenShake=9;

    createHitEffect(
      ball.x,
      ball.y,
      "#ff637a"
    );

    createSmashParticles(
      ball.x,
      ball.y,
      direction
    );

    feed.push(
      side==="P1"
        ? "💥⚡ P1 超級殺球！"
        : "💥⚡ AI 殺球！"
    );

  }

  ball.lastHit=side;

  trimFeed();

}


/* =========================================================
   PARTICLES
========================================================= */

function createHitEffect(
  x,
  y,
  color
){

  hitEffects.push({

    x,

    y,

    color,

    life:1,

    size:1

  });

}


function createSmashParticles(
  x,
  y,
  direction
){

  for(
    let i=0;
    i<14;
    i++
  ){

    particles.push({

      x,

      y,

      vx:
        -direction*
        (1+Math.random()*3),

      vy:
        -2+
        Math.random()*4,

      life:
        .4+
        Math.random()*.4,

      color:
        i%2
          ? "#fff"
          : "#ffd166"

    });

  }

}


function updateParticles(dt){

  particles.forEach(p=>{

    p.x+=p.vx*dt;

    p.y+=p.vy*dt;

    p.vy+=.08*dt;

    p.life-=.025*dt;

  });

  particles=
    particles.filter(
      p=>p.life>0
    );

}


function updateEffects(dt){

  hitEffects.forEach(e=>{

    e.life-=.07*dt;

    e.size+=.12*dt;

  });

  hitEffects=
    hitEffects.filter(
      e=>e.life>0
    );

}


/* =========================================================
   DRAW
========================================================= */

function drawGame(){

  if(
    !canvas ||
    !ctx
  ){

    return;

  }

  /*
    canvas 內部永遠 360x250。
    CSS 再縮放到手機畫面。
    因此物理不會跟著畫面比例亂掉。
  */

  ctx.clearRect(
    0,
    0,
    CONFIG.WORLD_W,
    CONFIG.WORLD_H
  );

  ctx.save();

  /*
    Screen shake
  */

  if(screenShake>0){

    ctx.translate(
      (Math.random()-.5)*
      screenShake,

      (Math.random()-.5)*
      screenShake
    );

  }

  drawBackground();

  drawCourt();

  drawNet();

  drawPlayer(
    p1,
    "yellow"
  );

  drawPlayer(
    p2,
    "red"
  );

  drawBall();

  drawParticles();

  drawHitEffects();

  ctx.restore();

}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

  const g=
    ctx.createLinearGradient(
      0,
      0,
      0,
      CONFIG.WORLD_H
    );

  g.addColorStop(
    0,
    "#202a49"
  );

  g.addColorStop(
    .55,
    "#101628"
  );

  g.addColorStop(
    1,
    "#070912"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    0,
    CONFIG.WORLD_W,
    CONFIG.WORLD_H
  );

  /*
    遠景光點
  */

  for(
    let i=0;
    i<20;
    i++
  ){

    const x=
      (i*67)%CONFIG.WORLD_W;

    const y=
      20+
      ((i*31)%90);

    ctx.fillStyle=
      "rgba(255,255,255,.12)";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      1,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}

   COURT
========================================================= */

/* =========================================================
   NET
========================================================= */

function drawNet(){

  /*
    網柱
  */

  ctx.fillStyle=
    "#dce7f5";

  ctx.fillRect(
    CONFIG.NET_X-3,
    CONFIG.NET_TOP,
    6,
    CONFIG.NET_BOTTOM-

  );

  /*
    網線
  */

  ctx.strokeStyle=
    "rgba(255,255,255,.65)";

  ctx.lineWidth=.7;

    y<CONFIG.NET_BOTTOM;

    ctx.moveTo(
      CONFIG.NET_X-4,
      y
    );

    ctx.lineTo(
      CONFIG.NET_X+4,
      y
    );

    ctx.stroke();

  }

}

/* =========================================================
   ELECTRIC EFFECT
========================================================= */

function drawElectricRing(
  x,
  y
){

  ctx.strokeStyle=
    "#62e7ff";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    23+
    Math.sin(
      performance.now()/80
    )*3,
    0,
    Math.PI*2
  );

  ctx.stroke();

}


/* =========================================================
   BALL
========================================================= */

function drawBall(){

  /*
    軌跡
  */

  for(
    let i=0;
    i<ball.trail.length;
    i++
  ){

    const t=
      i/
      ball.trail.length;

    const point=
      ball.trail[i];

    ctx.fillStyle=
      `rgba(255,209,102,${t*.22})`;

    ctx.beginPath();

    ctx.arc(
      point.x,
      point.y,
      2+
      t*3,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  /*
    殺球閃電
  */

  if(ball.smash){

    ctx.strokeStyle=
      "#ff637a";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
      ball.x-16,
      ball.y+5
    );

    ctx.lineTo(
      ball.x-8,
      ball.y-4
    );

    ctx.lineTo(
      ball.x-3,
      ball.y+3
    );

    ctx.lineTo(
      ball.x+5,
      ball.y-8
    );

    ctx.stroke();

  }

  /*
    球陰影
  */

  ctx.fillStyle=
    "rgba(0,0,0,.22)";

  ctx.beginPath();

  ctx.ellipse(
    ball.x,
    CONFIG.FLOOR_Y+1,
    10,
    2.5,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
    球
  */

  const g=
    ctx.createRadialGradient(
      ball.x-3,
      ball.y-4,
      1,
      ball.x,
      ball.y,
      ball.r
    );

  g.addColorStop(
    0,
    "#fff"
  );

  g.addColorStop(
    .45,
    "#ffe69a"
  );

  g.addColorStop(
    1,
    "#f4b942"
  );

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.r,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
    球紋
  */

  ctx.strokeStyle=
    "rgba(80,60,20,.65)";

  ctx.lineWidth=1;

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.r-2,
    -.7,
    1.2
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.arc(
    ball.x,
    ball.y,
    ball.r-3,
    2,
    4.2
  );

  ctx.stroke();

}


/* =========================================================
   PARTICLE DRAW
========================================================= */

function drawParticles(){

  particles.forEach(p=>{

    ctx.globalAlpha=
      Math.max(
        0,
        p.life
      );

    ctx.fillStyle=p.color;

    ctx.fillRect(
      p.x,
      p.y,
      3,
      3
    );

  });

  ctx.globalAlpha=1;

}


/* =========================================================
   HIT EFFECT DRAW
========================================================= */

function drawHitEffects(){

  hitEffects.forEach(e=>{

    ctx.globalAlpha=
      Math.max(
        0,
        e.life
      );

    ctx.strokeStyle=e.color;

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(
      e.x,
      e.y,
      10+
      e.size*18,
      0,
      Math.PI*2
    );

    ctx.stroke();

  });

  ctx.globalAlpha=1;

}


/* =========================================================
   CANVAS RESIZE
========================================================= */

function resizeCanvas(){

  if(!canvas) return;

  /*
    不修改遊戲內部解析度。
    只讓 CSS 縮放。

    這就是修正：
    「人物跟地面位置亂掉」
    的關鍵。
  */

  canvas.width=
    CONFIG.WORLD_W;

  canvas.height=
    CONFIG.WORLD_H;

}


window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    /*
      避免方向鍵滾動頁面
    */

    if(
      [
        "ArrowLeft",
        "ArrowRight",
        "ArrowUp",
        " ",
        "w",
        "W",
        "a",
        "A",
        "d",
        "D",
        "j",
        "J",
        "k",
        "K"
      ].includes(e.key)
    ){

      e.preventDefault();

    }

    if(
      e.key==="ArrowLeft" ||
      e.key==="a" ||
      e.key==="A"
    ){

      keys.left1=true;

    }

    if(
      e.key==="ArrowRight" ||
      e.key==="d" ||
      e.key==="D"
    ){

      keys.right1=true;

    }

    if(
      e.key==="ArrowUp" ||
      e.key==="w" ||
      e.key==="W" ||
      e.key===" "
    ){

      if(
        !e.repeat
      ){

        keys.jump1=true;

      }

    }

    /*
      J / K / E / Enter
      都可以殺球
    */

    if(
      e.key==="j" ||
      e.key==="J" ||
      e.key==="k" ||
      e.key==="K" ||
      e.key==="e" ||
      e.key==="E" ||
      e.key==="Enter"
    ){

      keys.smash1=true;

    }

  },
  {
    passive:false
  }
);


window.addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key==="a" ||
      e.key==="A"
    ){

      keys.left1=false;

    }

    if(
      e.key==="ArrowRight" ||
      e.key==="d" ||
      e.key==="D"
    ){

      keys.right1=false;

    }

    if(
      e.key==="ArrowUp" ||
      e.key==="w" ||
      e.key==="W" ||
      e.key===" "
    ){

      keys.jump1=false;

    }

    if(
      e.key==="j" ||
      e.key==="J" ||
      e.key==="k" ||
      e.key==="K" ||
      e.key==="e" ||
      e.key==="E" ||
      e.key==="Enter"
    ){

      keys.smash1=false;

    }

  }
);


/* =========================================================
   TOUCH CONTROLS
========================================================= */

function bindTouch(
  buttonId,
  keyName
){

  const btn=
    document.getElementById(
      buttonId
    );

  if(!btn) return;

  const down=e=>{

    e.preventDefault();

    initAudio();

    keys[keyName]=true;

    btn.classList.add(
      "active"
    );

    try{

      btn.setPointerCapture(
        e.pointerId
      );

    }catch(_){}

  };

  const up=e=>{

    e.preventDefault();

    keys[keyName]=false;

    btn.classList.remove(
      "active"
    );

  };

  btn.addEventListener(
    "pointerdown",
    down,
    {
      passive:false
    }
  );

  btn.addEventListener(
    "pointerup",
    up,
    {
      passive:false
    }
  );

  btn.addEventListener(
    "pointercancel",
    up,
    {
      passive:false
    }
  );

  btn.addEventListener(
    "lostpointercapture",
    up,
    {
      passive:false
    }
  );

}


/* =========================================================
   PLAYERS HTML
========================================================= */

function renderPlayers(){

  if(players.size===0){

    return `
      <div class="player me">
        <b>${esc(ME.username)}</b>
        <em>本地玩家</em>
      </div>
    `;

  }

  return[
    ...players.values()
  ]
  .map(p=>{

    const isMe=
      p.id===ME.id;

    return `
      <div class="player ${isMe?"me":""}">
        <b>${esc(p.username)}</b>
        <em>
          ${isMe?"你":"玩家"}
        </em>
      </div>
    `;

  })
  .join("");

}


/* =========================================================
   LOCAL DEV
========================================================= */

function runLocalDevTest(){

  initAudio();

  players.clear();

  addPlayer(
    ME.id,
    ME.username,
    ME.avatar
  );

  /*
    本地測試直接呼叫 beginMatch，
    不依賴 SDK。
  */

  beginMatch();

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const main=
    document.getElementById(
      "main"
    );

  if(!main) return;


  /* =========================
     LOBBY
  ========================= */

  if(state==="LOBBY"){

    cancelAnimationFrame(
      gameLoopId
    );

    main.innerHTML=`

      <section class="panel">

        <div class="stats">

          <div class="stat">
            <b>100</b>
            <span>Entry 銀幣</span>
          </div>

          <div class="stat">
            <b>${players.size}</b>
            <span>房內玩家</span>
          </div>

          <div class="stat">
            <b>5 分</b>
            <span>先到獲勝</span>
          </div>

          <div class="stat">
            <b>⚡</b>
            <span>皮卡丘排球</span>
          </div>

        </div>

      </section>


      <section class="panel">

        <div class="sectionTitle">
          房內玩家
        </div>

        <div class="players">
          ${renderPlayers()}
        </div>

      </section>


      ${
        isHost()
        ?
        `
        <button
          id="startBtn"
          class="cta"
        >
          👑 開始《皮卡丘排球》
        </button>
        `
        :
        `
        <div class="notice">
          等待室長開始遊戲...
        </div>
        `
      }


      <button
        id="devBtn"
        class="cta secondary"
        style="margin-top:8px;"
      >
        🧪 本地測試：直接開局
      </button>


      <section class="panel tiny">

        <b>🎮 操作方式</b>

        <div style="margin-top:5px;">
          電腦：A / D 或 ← / → 移動
          <br>
          W / ↑ / 空白鍵：跳躍
          <br>
          J / K / E / Enter：殺球
          <br>
          手機：下方按鈕操作
        </div>

      </section>

    `;


    document
      .getElementById("startBtn")
      ?.addEventListener(
        "click",
        ()=>{

          initAudio();

          sendEvent(
            "PIKA_VOLLEY_START",
            {}
          );

          beginMatch();

        }
      );


    document
      .getElementById("devBtn")
      ?.addEventListener(
        "click",
        ()=>{
          runLocalDevTest();
        }
      );


    return;

  }


  /* =========================
     PLAYING / COUNTDOWN / POINT
  ========================= */

  if(
    state==="PLAYING" ||
    state==="COUNTDOWN" ||
    state==="POINT"
  ){

    main.innerHTML=`

      <div
        class="stats gameTop"
      >

        <div class="stat">
          <b>🟡 ${scoreP1}</b>
          <span>我方</span>
        </div>

        <div class="stat">
          <b>VS</b>
          <span>排球</span>
        </div>

        <div class="stat">
          <b>🔴 ${scoreP2}</b>
          <span>AI</span>
        </div>

        <div class="stat">
          <b>⚡</b>
          <span>
            ${
              state==="COUNTDOWN"
                ? "準備"
                :
              state==="POINT"
                ? "得分"
                : "對戰"
            }
          </span>
        </div>

      </div>


      <div id="canvasWrap">

        <canvas
          id="gameCanvas"
          width="360"
          height="250"
        ></canvas>

        <div
          id="countdownOverlay"
        ></div>

      </div>


      <div class="ctrlGrid">

        <button
          id="leftBtn"
          class="ctrlBtn"
        >
          ◀
        </button>

        <button
          id="rightBtn"
          class="ctrlBtn"
        >
          ▶
        </button>

        <button
          id="jumpBtn"
          class="ctrlBtn jumpBtn"
        >
          ▲
        </button>

        <button
          id="smashBtn"
          class="ctrlBtn smashBtn"
        >
          ⚡
        </button>

      </div>


      <div class="feedBox">

        ${
          feed
            .map(
              f=>`<div>${esc(f)}</div>`
            )
            .join("")
        }

      </div>

    `;


    canvas=
      document.getElementById(
        "gameCanvas"
      );

    if(canvas){

      ctx=
        canvas.getContext(
          "2d"
        );

      resizeCanvas();

      drawGame();

    }


    bindTouch(
      "leftBtn",
      "left1"
    );

    bindTouch(
      "rightBtn",
      "right1"
    );

    bindTouch(
      "jumpBtn",
      "jump1"
    );

    bindTouch(
      "smashBtn",
      "smash1"
    );


    updateCountdownUI();


    if(state==="PLAYING"){

      startCanvasLoop();

    }


    return;

  }


  /* =========================
     RESULT
  ========================= */

  if(state==="RESULT"){

    main.innerHTML=`

      <section
        class="panel center"
        style="flex:1;"
      >

        <div>

          <h2>
            🏆 皮卡丘排球結算
          </h2>

          <div class="resultScore">

            P1
            ${scoreP1}
            :
            ${scoreP2}
            P2

          </div>

          <p
            style="
              color:var(--muted);
              font-size:12px;
            "
          >

            ${
              scoreP1>=CONFIG.WIN_SCORE
                ? "⚡ 你贏了！"
                : "🤖 AI 獲勝！"
            }

          </p>


          <div
            class="feedBox"
            style="
              max-height:130px;
              margin-top:12px;
            "
          >

            ${
              feed
                .map(
                  f=>`<div>${esc(f)}</div>`
                )
                .join("")
            }

          </div>


          <button
            id="restartBtn"
            class="cta"
            style="margin-top:16px;"
          >
            🔄 返回大廳
          </button>

        </div>

      </section>

    `;


    document
      .getElementById("restartBtn")
      ?.addEventListener(
        "click",
        ()=>{

          state="LOBBY";

          scoreP1=0;

          scoreP2=0;

          feed=[];

          resetPlayers();

          render();

        }
      );

  }

}


/* =========================================================
   INITIAL
========================================================= */

addPlayer(
  ME.id,
  ME.username,
  ME.avatar
);

render();

</script>
