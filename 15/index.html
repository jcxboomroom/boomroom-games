  /* =========================================================
     CANVAS
  ========================================================= */

  function ensureCanvas(){

    canvas=
      document.getElementById(
        "drawCanvas"
      );

    if(!canvas){
      return false;
    }

    ctx=
      canvas.getContext(
        "2d",
        {
          alpha:true,
          desynchronized:true
        }
      );

    if(!ctx){
      return false;
    }

    if(!resizeBound){

      window.addEventListener(
        "resize",
        resizeCanvas,
        {
          passive:true
        }
      );

      resizeBound=true;
    }

    resizeCanvas();

    attachCanvasEvents();

    return true;
  }

  function resizeCanvas(){

    if(
      !canvas||
      !ctx
    ){

      return;
    }

    const r=
      canvas.getBoundingClientRect();

    const w=
      r.width>10
        ?r.width
        :340;

    const h=
      r.height>10
        ?r.height
        :260;

    const dpr=
      Math.min(
        window.devicePixelRatio||
        1,
        2
      );

    canvas.width=
      Math.max(
        1,
        Math.floor(
          w*dpr
        )
      );

    canvas.height=
      Math.max(
        1,
        Math.floor(
          h*dpr
        )
      );

    ctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );

    ctx.fillStyle=
      "#f7f8fb";

    ctx.fillRect(
      0,
      0,
      w,
      h
    );

    redrawCanvas();
  }

  function redrawCanvas(){

    if(
      !canvas||
      !ctx
    ){

      return;
    }

    const r=
      canvas.getBoundingClientRect();

    ctx.fillStyle=
      "#f7f8fb";

    ctx.fillRect(
      0,
      0,
      r.width,
      r.height
    );

    for(
      const s of knownStrokes
    ){

      drawStroke(s);
    }
  }

  function pointFromEvent(e){

    const r=
      canvas.getBoundingClientRect();

    return {

      x:
        clamp(
          (
            e.clientX-
            r.left
          )/
          Math.max(
            1,
            r.width
          ),
          0,
          1
        ),

      y:
        clamp(
          (
            e.clientY-
            r.top
          )/
          Math.max(
            1,
            r.height
          ),
          0,
          1
        )
    };
  }

  function normalizedColorRgb(color){
    const value=safeString(color,"#151923",20).trim();
    const m=value.match(/^#([0-9a-f]{6})$/i);
    if(!m){
      return [21,25,35];
    }
    return [
      parseInt(m[1].slice(0,2),16),
      parseInt(m[1].slice(2,4),16),
      parseInt(m[1].slice(4,6),16)
    ];
  }

  function floodFillAt(point,color){
    if(!canvas || !ctx || !point){
      return;
    }

    const w=canvas.width;
    const h=canvas.height;
    if(w<2 || h<2){
      return;
    }

    const sx=clamp(Number(point.x),0,1);
    const sy=clamp(Number(point.y),0,1);
    const seedX=Math.min(w-1,Math.max(0,Math.floor(sx*w)));
    const seedY=Math.min(h-1,Math.max(0,Math.floor(sy*h)));

    const image=ctx.getImageData(0,0,w,h);
    const data=image.data;
    const seedPos=seedY*w+seedX;
    const seedIndex=seedPos*4;
    const targetR=data[seedIndex];
    const targetG=data[seedIndex+1];
    const targetB=data[seedIndex+2];
    const targetA=data[seedIndex+3];
    const fillRgb=normalizedColorRgb(color);

    if(
      Math.abs(targetR-fillRgb[0])<=2 &&
      Math.abs(targetG-fillRgb[1])<=2 &&
      Math.abs(targetB-fillRgb[2])<=2 &&
      targetA>=250
    ){
      return;
    }

    const tolerance=24;
    const seen=new Uint8Array(w*h);
    const stack=[seedPos];
    seen[seedPos]=1;

    const matches=(pos)=>{
      const i=pos*4;
      return (
        Math.abs(data[i]-targetR)<=tolerance &&
        Math.abs(data[i+1]-targetG)<=tolerance &&
        Math.abs(data[i+2]-targetB)<=tolerance &&
        Math.abs(data[i+3]-targetA)<=tolerance
      );
    };

    while(stack.length){
      const pos=stack.pop();
      if(!matches(pos)){
        continue;
      }

      const i=pos*4;
      data[i]=fillRgb[0];
      data[i+1]=fillRgb[1];
      data[i+2]=fillRgb[2];
      data[i+3]=255;

      const x=pos%w;
      const y=Math.floor(pos/w);
      const n1=pos-1;
      const n2=pos+1;
      const n3=pos-w;
      const n4=pos+w;

      if(x>0 && !seen[n1]){ seen[n1]=1; stack.push(n1); }
      if(x<w-1 && !seen[n2]){ seen[n2]=1; stack.push(n2); }
      if(y>0 && !seen[n3]){ seen[n3]=1; stack.push(n3); }
      if(y<h-1 && !seen[n4]){ seen[n4]=1; stack.push(n4); }
    }

    ctx.putImageData(image,0,0);
  }

  function drawShapeStroke(stroke){
    const r=canvas.getBoundingClientRect();
    const pts=stroke.points||[];
    if(pts.length<2){
      return;
    }

    const a=pts[0];
    const b=pts[pts.length-1];
    const x1=a.x*r.width;
    const y1=a.y*r.height;
    const x2=b.x*r.width;
    const y2=b.y*r.height;
    const type=safeString(stroke.tool||stroke.kind,"pen",20);

    ctx.strokeStyle=stroke.color;
    ctx.lineWidth=clamp(Number(stroke.size)||7,2,30);
    ctx.lineCap="round";
    ctx.lineJoin="round";

    if(type==="line"){
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);
      ctx.stroke();
      return;
    }

    if(type==="rect"){
      ctx.strokeRect(x1,y1,x2-x1,y2-y1);
      return;
    }

    if(type==="circle"){
      const radius=Math.hypot(x2-x1,y2-y1);
      ctx.beginPath();
      ctx.arc(x1,y1,radius,0,Math.PI*2);
      ctx.stroke();
    }
  }

  function drawStroke(
    stroke
  ){

    if(
      !stroke ||
      !Array.isArray(stroke.points) ||
      stroke.points.length<1 ||
      !ctx ||
      !canvas
    ){
      return;
    }

    const type=safeString(
      stroke.tool||stroke.kind,
      "pen",
      20
    );

    if(type==="fill"){
      floodFillAt(stroke.points[0],stroke.color||brushColor);
      return;
    }

    if(type==="line" || type==="rect" || type==="circle"){
      drawShapeStroke(stroke);
      return;
    }

    const r=canvas.getBoundingClientRect();
    const color=safeString(stroke.color,"#151923",20);
    const size=clamp(Number(stroke.size)||7,2,30);

    ctx.strokeStyle=color;
    ctx.lineWidth=size;
    ctx.lineCap="round";
    ctx.lineJoin="round";

    if(stroke.points.length===1){
      const a=stroke.points[0];
      ctx.beginPath();
      ctx.arc(a.x*r.width,a.y*r.height,size/2,0,Math.PI*2);
      ctx.fillStyle=color;
      ctx.fill();
      return;
    }

    ctx.beginPath();
    ctx.moveTo(
      stroke.points[0].x*r.width,
      stroke.points[0].y*r.height
    );

    for(let i=1;i<stroke.points.length;i++){
      const p=stroke.points[i];
      ctx.lineTo(p.x*r.width,p.y*r.height);
    }

    ctx.stroke();
  }

  function beginStroke(e){

    if(
      !isDrawer() ||
      state!==STATES.PLAYING ||
      matchEnded ||
      currentTurnResolved
    ){
      return;
    }

    if(
      e.pointerType==="mouse" &&
      e.button!==0
    ){
      return;
    }

    if(drawingPointerId!==null){
      return;
    }

    e.preventDefault();

    drawingPointerId=e.pointerId;
    ensureAudio();

    const p=pointFromEvent(e);

    /* 填充工具：一次點擊直接填滿目前所在區域 */
    if(tool==="fill"){
      const fillStroke={
        id:
          ME.id+"_"+Date.now().toString(36)+"_"+
          Math.random().toString(36).slice(2,6),
        color:brushColor,
        size:brushSize,
        tool:"fill",
        points:[p]
      };

      knownStrokes.push(fillStroke);
      localStrokeIds.push(fillStroke.id);

      if(knownStrokes.length>CONFIG.MAX_STROKES){
        knownStrokes.shift();
      }

      redrawCanvas();

      sendEvent("GAME_EVENT",{
        roundId,
        type:"STROKE",
        stroke:fillStroke,
        turnIndex:currentTurnIndex
      });

      drawingPointerId=null;
      playTone(520,.04);
      vibrate(20);
      return;
    }

    currentStroke={
      id:
        ME.id+"_"+Date.now().toString(36)+"_"+
        Math.random().toString(36).slice(2,6),
      color:
        tool==="eraser"
          ?"#f7f8fb"
          :brushColor,
      size:brushSize,
      tool,
      points:[p]
    };

    if(tool==="line" || tool==="rect" || tool==="circle"){
      currentStroke.points.push({...p});
    }

    try{
      canvas.setPointerCapture(e.pointerId);
    }catch(_){}
  }

  function moveStroke(e){

    if(
      !currentStroke ||
      !canvas ||
      (
        drawingPointerId!==null &&
        e.pointerId!==drawingPointerId
      )
    ){
      return;
    }

    if(
      e.pointerType==="mouse" &&
      e.buttons===0
    ){
      return;
    }

    e.preventDefault();

    const events=
      typeof e.getCoalescedEvents==="function"
        ?e.getCoalescedEvents()
        :[e];

    for(const ev of events){
      const p=pointFromEvent(ev);

      /* 幾何工具：第二點只是預覽端點，不累積成自由曲線。 */
      if(
        currentStroke.tool==="line" ||
        currentStroke.tool==="rect" ||
        currentStroke.tool==="circle"
      ){
        currentStroke.points[1]=p;
        redrawCanvas();
        drawStroke(currentStroke);
        continue;
      }

      const last=
        currentStroke.points[
          currentStroke.points.length-1
        ];

      const r=canvas.getBoundingClientRect();
      const dx=(p.x-last.x)*r.width;
      const dy=(p.y-last.y)*r.height;

      if(Math.hypot(dx,dy)<1.4){
        continue;
      }

      if(
        currentStroke.points.length<
        CONFIG.MAX_POINTS_PER_STROKE
      ){
        currentStroke.points.push(p);
        drawStroke({
          color:currentStroke.color,
          size:currentStroke.size,
          tool:currentStroke.tool,
          points:[last,p]
        });
      }
    }
  }

  function endStroke(e){

    if(
      drawingPointerId!==null &&
      e &&
      e.pointerId!==undefined &&
      e.pointerId!==drawingPointerId
    ){

      return;
    }

    if(!currentStroke){

      drawingPointerId=
        null;

      return;
    }

    if(
      e &&
      e.preventDefault
    ){

      e.preventDefault();
    }

    const stroke={

      id:
        currentStroke.id,

      color:
        currentStroke.color,

      size:
        currentStroke.size,

      tool:
        safeString(currentStroke.tool,"pen",20),

      points:
        currentStroke.points.slice(
          0,
          CONFIG.MAX_POINTS_PER_STROKE
        )
    };

    knownStrokes.push(
      stroke
    );

    localStrokeIds.push(
      stroke.id
    );

    if(
      stroke.tool==="line" ||
      stroke.tool==="rect" ||
      stroke.tool==="circle"
    ){
      redrawCanvas();
    }

    if(
      knownStrokes.length>
      CONFIG.MAX_STROKES
    ){

      knownStrokes.shift();
    }

    sendEvent(
      "GAME_EVENT",
      {
        roundId,

        type:
          "STROKE",

        stroke,

        turnIndex:
          currentTurnIndex
      }
    );

    currentStroke=
      null;

    drawingPointerId=
      null;
  }

  function attachCanvasEvents(){

    if(
      !canvas ||
      canvas.dataset.bound==="1"
    ){

      return;
    }

    canvas.dataset.bound="1";

    canvas.addEventListener(
      "pointerdown",
      beginStroke,
      {
        passive:false
      }
    );

    canvas.addEventListener(
      "pointermove",
      moveStroke,
      {
        passive:false
      }
    );

    canvas.addEventListener(
      "pointerup",
      endStroke,
      {
        passive:false
      }
    );

    canvas.addEventListener(
      "pointercancel",
      endStroke,
      {
        passive:false
      }
    );

    canvas.addEventListener(
      "lostpointercapture",
      endStroke,
      {
        passive:false
      }
    );

    canvas.addEventListener(
      "dragstart",
      e=>
        e.preventDefault()
    );
  }

  function receiveStroke(
    stroke
  ){

    if(
      !stroke ||
      !Array.isArray(
        stroke.points
      ) ||
      stroke.points.length>
        CONFIG.MAX_POINTS_PER_STROKE
    ){

      return;
    }

    if(
      stroke.id &&
      knownStrokes.some(
        s=>
          s.id===
          stroke.id
      )
    ){

      return;
    }

    const allowedTools=new Set([
      "pen",
      "eraser",
      "fill",
      "line",
      "rect",
      "circle"
    ]);

    const safeTool=
      allowedTools.has(stroke.tool)
        ?stroke.tool
        :"pen";

    const safeStroke={

      id:
        safeString(
          stroke.id,
          "remote",
          100
        ),

      color:
        safeString(
          stroke.color,
          "#151923",
          20
        ),

      size:
        clamp(
          stroke.size,
          2,
          30
        ),

      tool:safeTool,

      points:
        stroke.points
          .slice(
            0,
            CONFIG.MAX_POINTS_PER_STROKE
          )
          .map(
            p=>({

              x:clamp(p.x,0,1),
              y:clamp(p.y,0,1)
            })
          )
    };

    knownStrokes.push(
      safeStroke
    );

    if(
      knownStrokes.length>
      CONFIG.MAX_STROKES
    ){

      knownStrokes.shift();
    }

    if(
      safeTool==="fill" ||
      safeTool==="line" ||
      safeTool==="rect" ||
      safeTool==="circle"
    ){
      redrawCanvas();
    }else{
      drawStroke(safeStroke);
    }
  }

  function removeKnownStroke(
    id
  ){

    if(
      typeof id!=="string"
    ){

      return;
    }

    knownStrokes=
      knownStrokes.filter(
        s=>
          s.id!==id
      );
  }

  function undoLastStroke(){

    if(
      !isDrawer() ||
      !localStrokeIds.length ||
      matchEnded
    ){

      return;
    }

    const id=
      localStrokeIds.pop();

    removeKnownStroke(
      id
    );

    redrawCanvas();

    sendEvent(
      "GAME_EVENT",
      {
        roundId,

        type:
          "UNDO_STROKE",

        strokeId:
          id,

        turnIndex:
          currentTurnIndex
      }
    );

    playTone(
      400,
      .05
    );
  }

  function clearAllCanvas(){

    if(
      !isDrawer() ||
      matchEnded
    ){

      return;
    }

    knownStrokes=[];

    localStrokeIds=[];

    currentStroke=null;
    drawingPointerId=null;

    redrawCanvas();

    sendEvent(
      "GAME_EVENT",
      {
        roundId,

        type:
          "CLEAR_CANVAS",

        turnIndex:
          currentTurnIndex
      }
    );

    playTone(
      350,
      .05
    );
  }

  function syncTools(){

    document
      .querySelectorAll(
        "[data-tool]"
      )
      .forEach(
        b=>{

          b.classList.toggle(
            "active",
            b.dataset.tool===
              tool
          );
        }
      );

    document
      .querySelectorAll(
        "[data-size]"
      )
      .forEach(
        b=>{

          b.classList.toggle(
            "active",
            Number(
              b.dataset.size
            )===
            brushSize
          );
        }
      );

    document
      .querySelectorAll(
        "[data-color]"
      )
      .forEach(
        b=>{

          b.classList.toggle(
            "active",
            b.dataset.color===brushColor
          );
        }
      );
  }

  /* =========================================================
     AUDIO
  ========================================================= */

  function ensureAudio(){

    if(muted){
      return;
    }

    try{

      if(!audioCtx){

        const AudioContextClass=
          window.AudioContext||
          window.webkitAudioContext;

        if(!AudioContextClass){
          return;
        }

        audioCtx=
          new AudioContextClass();
      }

      if(
        audioCtx.state===
        "suspended"
      ){

        audioCtx.resume();
      }

    }catch(_){}
  }

  function playTone(
    freq,
    duration=.08
  ){

    if(muted){
      return;
    }

    const now=
      performance.now();

    if(
      now-soundCooldown<35
    ){

      return;
    }

    soundCooldown=
      now;

    ensureAudio();

    if(!audioCtx){
      return;
    }

    try{

      const o=
        audioCtx.createOscillator();

      const g=
        audioCtx.createGain();

      o.type=
        "sine";

      o.frequency.value=
        clamp(
          freq,
          120,
          1700
        );

      g.gain.value=
        .28;

      o.connect(g);

      g.connect(
        audioCtx.destination
      );

      o.start();

      g.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+
        duration
      );

      o.stop(
        audioCtx.currentTime+
        duration
      );

    }catch(_){}
  }

  function vibrate(ms){

    try{

      if(
        navigator.vibrate
      ){

        navigator.vibrate(
          ms
        );
      }

    }catch(_){}
  }

  /* =========================================================
     TOAST
  ========================================================= */

  function showToast(t){

    const el=
      document.getElementById(
        "toast"
      );

    if(!el){
      return;
    }

    el.textContent=
      safeString(
        t,
        "",
        100
      );

    el.classList.add(
      "show"
    );

    clearTimeout(
      showToast.t
    );

    showToast.t=
      setTimeout(
        ()=>{
          el.classList.remove(
            "show"
          );
        },
        1200
      );
  }

  /* =========================================================
     BOOT
  ========================================================= */

  function boot(){

    const main=
      document.getElementById(
        "main"
      );

    if(!main){

      setTimeout(
        boot,
        50
      );

      return;
    }

    /*
      初始化自己的票
    */

    categoryVotes.set(
      String(ME.id),
      selectedCategory
    );

    roundsVotes.set(
      String(ME.id),
      selectedRounds
    );

    secondsVotes.set(
      String(ME.id),
      selectedTurnSeconds
    );

    render();

    lastFrame=
      performance.now();

    rafRunning=true;

    loopHandle=
      requestAnimationFrame(
        gameLoop
      );

    heartbeatTimer=
      setInterval(
        heartbeat,
        CONFIG.HEARTBEAT_MS
      );
  }

  boot();

</script>

</body>
</html>
