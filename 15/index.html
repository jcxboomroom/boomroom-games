<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070912">
<title>爆爆你畫我猜</title>

<style>
:root{
  --bg:#070912;
  --panel:#111625;
  --panel2:#161c2d;
  --line:#2b3550;
  --text:#f7f8fb;
  --muted:#98a3ba;
  --cyan:#62e7ff;
  --purple:#b76cff;
  --green:#4ee08a;
  --red:#ff637a;
  --gold:#ffd166;
  --yellow:#ffc857;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  user-select:none
}

body{min-height:100dvh}

button,input{
  font:inherit
}

button{
  border:0;
  color:var(--text);
  cursor:pointer;
  touch-action:manipulation
}

button:disabled{
  opacity:.45;
  cursor:default
}

#app{
  width:100%;
  height:100dvh;
  display:flex;
  justify-content:center
}

.shell{
  width:min(100%,760px);
  height:100%;
  display:flex;
  flex-direction:column;
  padding:calc(4px + env(safe-area-inset-top)) 10px calc(4px + env(safe-area-inset-bottom));
  gap:8px
}

.screen{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:8px;
  overflow-y:auto
}

.panel{
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);
  border-radius:18px;
  padding:12px
}

.center{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center
}

.hero{
  padding:16px 14px
}

.hero h1{
  font-size:clamp(27px,7vw,46px);
  line-height:1.04;
  margin:0
}

.hero p{
  margin-top:7px;
  color:var(--muted);
  font-size:13px
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px
}

.stat{
  padding:8px 5px;
  background:#0b0f18;
  border:1px solid var(--line);
  border-radius:12px;
  text-align:center;
  min-width:0
}

.stat b{
  display:block;
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.stat span{
  font-size:9px;
  color:var(--muted)
}

.sectionTitle{
  font-size:13px;
  font-weight:1000;
  margin-bottom:8px
}

.muted{color:var(--muted)}

.tiny{
  font-size:10px;
  line-height:1.45
}

.cta{
  width:100%;
  min-height:54px;
  border-radius:16px;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  color:#070912;
  font-weight:1000;
  font-size:17px;
  box-shadow:0 8px 24px #0005;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  touch-action:manipulation
}

.cta:active,
.secondary:active,
.iconBtn:active,
.tool:active,
.chip:active{
  transform:scale(.96)
}

.cta:disabled{
  background:#333;
  color:#888;
  box-shadow:none
}

.secondary{
  background:#192032;
  color:#fff;
  border:1px solid var(--line);
  box-shadow:none
}

.danger{
  background:#2a1520;
  border-color:#663246
}

.good{
  background:#153225;
  border-color:#2f7950
}

.row{
  display:flex;
  gap:8px
}

.row>*{
  flex:1;
  min-width:0
}

.notice{
  min-height:23px;
  color:#d1d6e4;
  font-size:11px;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center
}

/* voting */

.voteGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px
}

.chip{
  min-height:52px;
  border-radius:14px;
  background:#0d1220;
  border:1px solid var(--line);
  padding:8px 12px;
  text-align:left;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  touch-action:manipulation;
  pointer-events:auto;
  user-select:none
}

.chip small{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  margin-top:3px
}

.chip.active{
  border-color:var(--cyan);
  box-shadow:0 0 0 2px #62e7ff66;
  background:#112333;
  color:var(--cyan)
}

.voteBar{
  height:6px;
  border-radius:999px;
  background:#0c101a;
  overflow:hidden
}

.voteBar span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--cyan),var(--purple));
  width:0%
}

/* players */

.players{
  display:flex;
  gap:6px;
  overflow:hidden;
  overflow-x:auto;
  padding-bottom:4px
}

.player{
  min-width:102px;
  max-width:136px;
  padding:7px 9px;
  border-radius:11px;
  background:#0b101c;
  border:1px solid var(--line);
  font-size:10px;
  flex:0 0 auto
}

.player b{
  display:block;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.player em{
  display:block;
  font-style:normal;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.player.me{
  border-color:#42537b
}

.player.drawer{
  box-shadow:inset 0 0 0 1px #b76cff33
}

/* game */

.hud{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
  flex:0 0 auto
}

.pill{
  background:#0d1220;
  border:1px solid var(--line);
  border-radius:12px;
  padding:7px 9px;
  font-size:10px;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px
}

.pill b{
  font-size:14px
}

.pill.centerText{
  text-align:center
}

.timerWarn{
  color:#ffcf70;
  border-color:#735b28
}

#canvasWrap{
  position:relative;
  width:100%;
  height:280px;
  flex:0 0 280px;
  border-radius:18px;
  overflow:hidden;
  border:1px solid #30394f;
  background:#f7f8fb;
  touch-action:none;
  box-shadow:0 0 0 1px #ffffff07
}

#drawCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-user-drag:none;
  outline:none
}

.roleBadge,
#turnBadge,
.turnBadge{
  position:absolute;
  top:9px;
  padding:6px 8px;
  border-radius:9px;
  background:#111625e8;
  border:1px solid #ffffff20;
  font-size:10px;
  font-weight:900;
  z-index:3;
  pointer-events:none
}

.roleBadge{left:9px}
.turnBadge{right:9px}

.wordBadge{
  position:absolute;
  top:9px;
  left:50%;
  transform:translateX(-50%);
  padding:7px 11px;
  border-radius:999px;
  background:#111625e8;
  border:1px solid #ffffff20;
  font-weight:1000;
  font-size:13px;
  z-index:3;
  pointer-events:none;
  max-width:70%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.cursorHint{
  position:absolute;
  bottom:9px;
  left:50%;
  transform:translateX(-50%);
  padding:6px 9px;
  border-radius:9px;
  background:#111625d9;
  color:#dce2f2;
  font-size:9px;
  pointer-events:none;
  white-space:nowrap
}

.tools{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  flex:0 0 auto
}

.tool{
  height:42px;
  min-width:42px;
  border-radius:12px;
  background:#101626;
  border:1px solid var(--line);
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer
}

.tool.active{
  outline:2px solid var(--cyan);
  outline-offset:-2px
}

.color{
  width:42px;
  padding:0;
  border-radius:50%;
  border:3px solid #fff
}

.sizeBtn{
  font-size:11px
}

.guessArea{
  display:flex;
  gap:7px;
  flex:0 0 auto
}

.guessArea input{
  flex:1;
  min-width:0;
  height:48px;
  border-radius:14px;
  border:1px solid var(--line);
  background:#0d111c;
  color:#fff;
  padding:0 13px;
  outline:none;
  user-select:text
}

.guessArea input:focus{
  border-color:var(--cyan)
}

.guessArea button{
  width:92px;
  border-radius:14px;
  background:var(--cyan);
  color:#061018;
  font-weight:1000;
  cursor:pointer
}

.skipBtn{
  height:42px;
  border-radius:12px;
  background:#2a1820;
  border:1px solid #5f3344;
  font-weight:900;
  padding:0 12px;
  cursor:pointer
}

.turnFeed{
  display:flex;
  justify-content:space-between;
  gap:6px;
  align-items:center;
  min-height:25px;
  padding:0 2px
}

.feedText{
  font-size:11px;
  color:#d1d6e4;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.turnScore{
  font-size:10px;
  color:#b9c4d7;
  white-space:nowrap
}

/* result */

.result{
  display:flex;
  flex-direction:column;
  gap:11px
}

.resultTitle{
  font-size:34px;
  font-weight:1000
}

.reward{
  font-size:29px;
  color:var(--gold);
  font-weight:1000
}

.rankList{
  display:flex;
  flex-direction:column;
  gap:6px;
  max-height:250px;
  overflow:auto
}

.rankRow{
  display:grid;
  grid-template-columns:30px 1fr auto;
  gap:7px;
  align-items:center;
  padding:8px 9px;
  background:#0b101b;
  border:1px solid var(--line);
  border-radius:11px
}

.rankNo{
  font-weight:1000;
  text-align:center
}

.rankName{
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.rankScore{
  font-size:11px;
  font-weight:1000
}

.rankReward{
  font-size:9px;
  color:var(--gold);
  grid-column:2/4
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(18px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  pointer-events:none;
  background:#101727f2;
  border:1px solid var(--line);
  padding:9px 13px;
  border-radius:12px;
  font-size:11px;
  z-index:80;
  transition:.18s
}

.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1
}

.guessChatBox{
  background:#0b0f18;
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px;
  height:110px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:4px;
  font-size:11px
}

@media(min-width:600px){
  .shell{
    padding-left:18px;
    padding-right:18px
  }

  .panel{
    padding:15px
  }
}
</style>
</head>

<body>

<div id="app">
  <div class="shell">
    <main id="main" class="screen"></main>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
"use strict";

/* =========================================================
   GAME INFO
========================================================= */

const GAME_INFO = {
  id: "boom_draw_guess",
  category: "派對競技",
  name: "爆爆你畫我猜",
  description: "選擇題型、輪數與秒數，輪流作畫，搶猜得分！",
  entryCost: 100,
  maxPlayers: 10,
  version: "1.2.0"
};

const CONFIG = Object.freeze({
  ENTRY_FEE: 100,
  PLATFORM_FEE_RATE: 0.10,
  MIN_PLAYERS: 1,
  MAX_PLAYERS: 10,
  LOBBY_COUNTDOWN_SECONDS: 10,
  TURN_SECONDS: 30,
  COUNTDOWN_SECONDS: 3,
  HEARTBEAT_MS: 4000,
  PLAYER_TIMEOUT_MS: 12000,
  MAX_NAME_LENGTH: 24,
  MAX_AVATAR_LENGTH: 300,
  MAX_GUESS_LENGTH: 32,
  MAX_STROKES: 140,
  MAX_POINTS_PER_STROKE: 80
});

const STATES = Object.freeze({
  LOBBY: "LOBBY",
  PLAYING: "PLAYING",
  COUNTDOWN: "COUNTDOWN",
  RESULT: "RESULT"
});

const CATEGORIES = Object.freeze([
  {id:"food",name:"美食",icon:"🍔",hint:"吃的、喝的、甜點"},
  {id:"animals",name:"動物",icon:"🐱",hint:"陸地、海洋、天空"},
  {id:"daily",name:"日常",icon:"🏠",hint:"生活中常見的東西"},
  {id:"places",name:"地點",icon:"🚕",hint:"景點、車輛、場所"},
  {id:"people",name:"職業",icon:"🧑",hint:"職業、角色、人物"},
  {id:"fantasy",name:"幻想",icon:"🚀",hint:"遊戲、幻想、電影感"}
]);

const WORD_BANK = {
  food: [
    ["披薩"],
    ["漢堡"],
    ["薯條"],
    ["炸雞"],
    ["火鍋"],
    ["拉麵"],
    ["珍珠奶茶",["珍奶"]],
    ["西瓜"]
  ],
  animals: [
    ["貓咪",["貓"]],
    ["狗狗",["狗"]],
    ["兔子"],
    ["老虎"],
    ["獅子"],
    ["大象"],
    ["企鵝"]
  ],
  daily: [
    ["雨傘"],
    ["眼鏡"],
    ["電視"],
    ["手機"],
    ["腳踏車",["自行車","單車"]],
    ["手錶"],
    ["牙刷"]
  ],
  places: [
    ["摩天輪"],
    ["遊樂園"],
    ["動物園"],
    ["醫院"],
    ["超市"],
    ["飛機"],
    ["火車"]
  ],
  people: [
    ["醫生"],
    ["警察"],
    ["消防員"],
    ["司機"],
    ["歌手"],
    ["國王"],
    ["忍者"]
  ],
  fantasy: [
    ["火箭"],
    ["太空人"],
    ["外星人"],
    ["吸血鬼"],
    ["時光機"],
    ["寶劍"]
  ]
};

function buildWordBank(){
  const out={};

  for(const c of CATEGORIES){
    out[c.id]=(WORD_BANK[c.id]||[]).map((row,i)=>({
      id:c.id+"_"+i,
      answer:String(row[0]),
      aliases:Array.isArray(row[1])?row[1]:[]
    }));
  }

  return out;
}

const WORDS=buildWordBank();

/* =========================================================
   RUNTIME VARIABLES
========================================================= */

let DEV = true;
let sdkIsHost = false;
let gameRoomId = "";

let selectedCategory = "food";
let selectedRounds = 1;
let selectedTurnSeconds = 30;
let activeTurnSeconds = 30;

let lobbyTimer = null;
let lobbySecondsLeft = CONFIG.LOBBY_COUNTDOWN_SECONDS;

let guessHistory = [];

let state=STATES.LOBBY;

let gameOverCalled=false;
let matchStarted=false;
let matchEnded=false;

let roundId="";
let roundSeed=0;

let currentHostId="";

let currentTurnIndex=-1;
let currentDrawerId="";
let currentTurnStartedAt=0;
let currentTurnResolved=false;

let currentWord=null;

let knownStrokes=[];
let localStrokeIds=[];
let currentStroke=null;

let tool="pen";
let brushColor="#151923";
let brushSize=7;

let muted=false;

let audioCtx=null;
let soundCooldown=0;

let totalPool=0;
let platformFee=0;
let prizePool=0;
let finalReward=0;
let finalRank=1;
let finalReason="";

let feedText="";
let lastGuessAt=0;

let countdownValue=CONFIG.COUNTDOWN_SECONDS;

let loopHandle=0;
let lastFrame=0;
let turnStateTimer=null;
let heartbeatTimer=null;

/* ★ 這些原本漏掉的變數 */
let rafRunning=true;
let fps=0;
let hiddenAt=0;

let canvas=null;
let ctx=null;
let resizeBound=false;

let roundStartAt=0;

/* ★ 多輪用 */
let turnOrder=[];
let totalTurnsPerPlayer=1;
let totalTurnCount=0;

/* =========================================================
   PLAYERS
========================================================= */

const participants=new Set();
const players=new Map();
const seenEvents=new Set();

function safeString(v,fallback,maxLen){
  if(v===null||v===undefined)return fallback;

  const s=String(v).trim();

  return s?s.slice(0,maxLen):fallback;
}

function finite(v,fallback=0){
  return Number.isFinite(v)?v:fallback;
}

function clamp(v,min,max){
  return Math.min(max,Math.max(min,finite(v,min)));
}

function intClamp(v,min,max){
  return Math.floor(clamp(v,min,max));
}

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    "\"":"&quot;",
    "'":"&#39;"
  }[c]));
}

function stableHash(s){
  let h=2166136261>>>0;

  for(let i=0;i<s.length;i++){
    h^=s.charCodeAt(i);
    h=Math.imul(h,16777619);
  }

  return h>>>0;
}

function mulberry32(a){
  return function(){
    let t=a+=0x6D2B79F5;
    t=Math.imul(t^t>>>15,t|1);
    t^=t+Math.imul(t^t>>>7,t|61);
    return((t^t>>>14)>>>0)/4294967296;
  };
}

/* ★ 修復：原本缺少 */
function makeRoundId(){
  return "round_" +
    Date.now().toString(36) + "_" +
    Math.random().toString(36).slice(2,8);
}

/* ★ 修復：原本缺少 */
function makeSeed(){
  return (
    Date.now() ^
    Math.floor(Math.random()*0xffffffff)
  )>>>0;
}

function normalizeText(s){
  return String(s||"")
    .normalize("NFKC")
    .toLowerCase()
    .replace(/[\s\u3000，。！？、,.!?;；:：'"“”‘’()（）\[\]{}<>《》【】]/g,"");
}

function answerMatches(guess,word){
  const g=normalizeText(guess);

  if(!g||!word)return false;

  if(g===normalizeText(word.answer))return true;

  return word.aliases.some(a=>g===normalizeText(a));
}

function getCategory(id){
  return (
    CATEGORIES.find(c=>c&&c.id===id) ||
    CATEGORIES[0] ||
    {
      id:"food",
      name:"美食",
      icon:"🍔",
      hint:"吃的"
    }
  );
}

function addPlayer(id,username,avatar,status="READY"){
  if(id===null||id===undefined)return null;

  id=String(id);

  if(!id||id.length>64)return null;

  let p=players.get(id);

  if(!p){
    p={
      id,
      username:safeString(username,"玩家",CONFIG.MAX_NAME_LENGTH),
      avatar:safeString(avatar,"",CONFIG.MAX_AVATAR_LENGTH),
      status,
      paid:true,
      score:0,
      reward:0,
      lastSeen:Date.now(),
      joinedAt:Date.now(),
      correct:0,
      drawTurns:0,
      skips:0
    };

    players.set(id,p);

  }else{

    p.username=safeString(
      username,
      p.username,
      CONFIG.MAX_NAME_LENGTH
    );

    p.avatar=safeString(
      avatar,
      p.avatar,
      CONFIG.MAX_AVATAR_LENGTH
    );

    p.status=status||p.status;
    p.lastSeen=Date.now();
    p.paid=true;
  }

  return p;
}

/* =========================================================
   LOCAL PLAYER
========================================================= */

let ME={
  id:"local_"+Math.random().toString(36).slice(2,10),
  username:"本地玩家",
  avatar:"",
  joinedAt:Date.now()
};

currentHostId=ME.id;

addPlayer(
  ME.id,
  ME.username,
  ME.avatar,
  "READY"
);

/* =========================================================
   SDK
========================================================= */

function setupSDK(data){

  DEV=false;

  if(data.user){

    players.delete(ME.id);

    ME.id=String(data.user.id);

    ME.username=safeString(
      data.user.username,
      "玩家",
      CONFIG.MAX_NAME_LENGTH
    );

    ME.avatar=safeString(
      data.user.avatar,
      "",
      CONFIG.MAX_AVATAR_LENGTH
    );
  }

  sdkIsHost=!!data.isHost;
  gameRoomId=data.roomId||"";

  if(Array.isArray(data.roomPlayers)){

    data.roomPlayers.forEach(rp=>{
      addPlayer(
        String(rp.id),
        rp.username,
        rp.avatar,
        "READY"
      );
    });
  }

  if(sdkIsHost){
    currentHostId=ME.id;
  }

  addPlayer(
    ME.id,
    ME.username,
    ME.avatar,
    "READY"
  );

  render();

  startLobbyAutoCountdown();
}

window.addEventListener("message",e=>{

  try{

    const data=
      typeof e.data==="string"
        ?JSON.parse(e.data)
        :e.data;

    if(data.action==="initSDK"){
      setupSDK(data);
      return;
    }

    if(
      !data ||
      data.action!=="gameEventReceived"
    )return;

    const userId=safeString(
      data.userId,
      "",
      64
    );

    const eventName=safeString(
      data.eventName,
      "",
      40
    );

    const payload=data.payload;

    if(
      !userId ||
      !/^[A-Z0-9_]{1,40}$/.test(eventName) ||
      !payload ||
      typeof payload!=="object"
    )return;

    handleEvent(
      userId,
      eventName,
      payload
    );

  }catch(err){

    console.error(
      "message error",
      err
    );
  }
});

/* =========================================================
   SEND EVENT
========================================================= */

function sendEvent(eventName,payload){

  if(DEV)return false;

  if(
    !/^[A-Z0-9_]{1,40}$/.test(eventName) ||
    !payload ||
    typeof payload!=="object" ||
    Array.isArray(payload)
  ){
    return false;
  }

  const copy={
    ...payload,
    eventId:safeString(
      payload.eventId,
      ME.id+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7),
      80
    )
  };

  const eventData={
    action:"sendGameEvent",
    eventName,
    payload:copy
  };

  try{

    if(
      window.BoomRoomSDK &&
      typeof window.BoomRoomSDK.sendGameEvent==="function"
    ){

      window.BoomRoomSDK.sendGameEvent(
        eventName,
        copy
      );

      return true;

    }else if(window.parent!==window){

      window.parent.postMessage(
        JSON.stringify(eventData),
        "*"
      );

      return true;
    }

  }catch(err){

    console.error(
      "sendEvent error",
      err
    );
  }

  return false;
}

/* =========================================================
   ROUND START
========================================================= */

function startRoundAsHost(category){

  if(matchStarted)return;

  const allList=[
    ...players.values()
  ].filter(
    p=>p&&p.status!=="LEFT"
  );

  if(allList.length===0){

    allList.push(
      players.get(ME.id) ||
      addPlayer(
        ME.id,
        ME.username,
        ME.avatar,
        "READY"
      )
    );
  }

  participants.clear();

  allList.forEach(p=>{

    if(!p)return;

    p.paid=true;
    p.status="READY";
    p.score=0;
    p.reward=0;
    p.correct=0;
    p.drawTurns=0;
    p.skips=0;

    participants.add(p.id);
  });

  totalPool=
    participants.size*
    CONFIG.ENTRY_FEE;

  platformFee=
    Math.floor(
      totalPool*
      CONFIG.PLATFORM_FEE_RATE
    );

  prizePool=
    totalPool-platformFee;

  matchStarted=true;
  matchEnded=false;
  gameOverCalled=false;

  roundStartAt=
    Date.now()+1000;

  /*
    ★ 真正的多輪順序

    例如：
    玩家 A B C
    3 輪

    A B C
    A B C
    A B C
  */

  const baseOrder=[
    ...participants
  ];

  turnOrder=[];

  totalTurnsPerPlayer=
    intClamp(
      selectedRounds,
      1,
      5
    );

  for(
    let r=0;
    r<totalTurnsPerPlayer;
    r++
  ){

    for(
      const id of baseOrder
    ){

      turnOrder.push(id);
    }
  }

  totalTurnCount=
    turnOrder.length;

  const payload={
    roundId,
    seed:roundSeed,
    startTime:roundStartAt,
    category:selectedCategory,
    participantIds:baseOrder,
    turnOrder,
    rounds:totalTurnsPerPlayer,
    turnSeconds:selectedTurnSeconds
  };

  sendEvent(
    "ROUND_START",
    payload
  );

  applyRoundStart(payload);
}

function applyRoundStart(payload){

  if(!payload||typeof payload!=="object"){
    return;
  }

  if(payload.roundId){

    roundId=safeString(
      payload.roundId,
      roundId,
      100
    );
  }

  roundSeed=
    (finite(payload.seed,0)>>>0);

  roundStartAt=
    finite(
      payload.startTime,
      Date.now()
    );

  selectedCategory=
    safeString(
      payload.category,
      CATEGORIES[0].id,
      30
    );

  if(payload.turnSeconds){

    activeTurnSeconds=
      Number(payload.turnSeconds);

    selectedTurnSeconds=
      activeTurnSeconds;
  }

  const ids=
    Array.isArray(payload.participantIds)
      ?payload.participantIds.filter(
        x=>typeof x==="string"
      )
      :[ME.id];

  const incomingOrder=
    Array.isArray(payload.turnOrder)
      ?payload.turnOrder.filter(
        x=>typeof x==="string"
      )
      :[];

  turnOrder=
    incomingOrder.length
      ?incomingOrder
      :ids;

  totalTurnCount=
    turnOrder.length;

  totalTurnsPerPlayer=
    intClamp(
      payload.rounds||selectedRounds,
      1,
      5
    );

  participants.clear();

  ids.forEach(id=>{

    participants.add(id);

    const p=
      players.get(id) ||
      addPlayer(
        id,
        "玩家",
        "",
        "READY"
      );

    if(p){
      p.status="READY";
      p.score=0;
    }
  });

  currentTurnIndex=-1;
  currentDrawerId="";
  currentTurnResolved=false;
  currentWord=null;

  knownStrokes=[];
  localStrokeIds=[];
  currentStroke=null;

  matchStarted=true;
  matchEnded=false;

  state=STATES.COUNTDOWN;

  countdownValue=
    CONFIG.COUNTDOWN_SECONDS;

  render();

  startCountdown();
}

/* =========================================================
   COUNTDOWN
========================================================= */

function startCountdown(){

  clearTimeout(turnStateTimer);

  countdownValue=
    CONFIG.COUNTDOWN_SECONDS;

  state=STATES.COUNTDOWN;

  render();

  const tick=()=>{

    if(matchEnded)return;

    if(countdownValue<=0){

      startNextTurnAsHost();

      return;
    }

    playTone(
      520+countdownValue*80,
      0.06
    );

    render();

    countdownValue--;

    turnStateTimer=
      setTimeout(
        tick,
        850
      );
  };

  tick();
}

/* =========================================================
   TURN
========================================================= */

function isDrawer(){

  return !!currentDrawerId &&
    currentDrawerId===ME.id;
}

function isParticipant(id){

  return participants.has(id);
}

function startNextTurnAsHost(){

  if(matchEnded)return;

  currentTurnIndex++;

  if(
    currentTurnIndex>=
    turnOrder.length
  ){

    finishMatchAsHost(
      "所有玩家都完成畫畫"
    );

    return;
  }

  currentDrawerId=
    turnOrder[currentTurnIndex];

  currentTurnStartedAt=
    Date.now()+250;

  currentTurnResolved=false;

  knownStrokes=[];
  localStrokeIds=[];
  currentStroke=null;

  currentWord=
    wordForTurn(
      selectedCategory,
      currentTurnIndex,
      roundSeed
    );

  feedText="準備畫！";

  const payload={
    roundId,
    turnIndex:currentTurnIndex,
    drawerId:currentDrawerId,
    category:selectedCategory,
    wordId:currentWord.id,
    wordIndex:findWordIndex(
      selectedCategory,
      currentWord.id
    ),
    startTime:currentTurnStartedAt,
    duration:activeTurnSeconds,
    turnSeconds:activeTurnSeconds
  };

  sendEvent(
    "TURN_START",
    payload
  );

  applyTurnStart(payload);
}

function findWordIndex(
  categoryId,
  wordId
){

  const bank=
    WORDS[categoryId]||[];

  const idx=
    bank.findIndex(
      w=>w.id===wordId
    );

  return idx<0?0:idx;
}

function wordForTurn(
  categoryId,
  turnIndex,
  seed
){

  const bank=
    WORDS[categoryId]||[];

  if(!bank.length){

    return {
      id:"empty",
      answer:"圖畫",
      aliases:[]
    };
  }

  /*
    使用 seed + 回合編號，
    所有人都能算出同一題。
  */

  const value=
    stableHash(
      String(seed)+
      "|"+
      categoryId+
      "|"+
      String(turnIndex)
    );

  const idx=
    value%bank.length;

  return bank[idx];
}

function applyTurnStart(payload){

  if(
    !payload ||
    payload.roundId!==roundId
  ){
    return;
  }

  if(payload.turnSeconds){

    activeTurnSeconds=
      Number(payload.turnSeconds);
  }

  currentTurnIndex=
    intClamp(
      payload.turnIndex,
      -1,
      Math.max(
        0,
        turnOrder.length
      )
    );

  currentDrawerId=
    safeString(
      payload.drawerId,
      "",
      64
    );

  currentTurnStartedAt=
    finite(
      payload.startTime,
      Date.now()
    );

  currentTurnResolved=false;

  selectedCategory=
    safeString(
      payload.category,
      selectedCategory,
      30
    );

  const bank=
    WORDS[selectedCategory]||[];

  const idx=
    intClamp(
      payload.wordIndex,
      0,
      Math.max(
        0,
        bank.length-1
      )
    );

  currentWord=
    bank[idx]||null;

  knownStrokes=[];
  localStrokeIds=[];
  currentStroke=null;

  state=STATES.PLAYING;

  feedText=
    isDrawer()
      ?"輪到你！畫出題目，別寫字。"
      :"快猜！先答對先得分。";

  guessHistory.push({
    username:"系統",
    text:"🎨 第 "+(currentTurnIndex+1)+" 回合開始！",
    isCorrect:false,
    isSystem:true
  });

  if(guessHistory.length>50){
    guessHistory.shift();
  }

  const me=
    players.get(ME.id);

  if(me){
    me.status="PLAYING";
  }

  sendEvent(
    "PLAYER_STATE",
    {
      roundId,
      userId:ME.id,
      status:"PLAYING",
      score:intClamp(
        me?.score||0,
        0,
        100000
      )
    }
  );

  render();

  playTone(
    740,
    0.08
  );

  setTimeout(
    ensureCanvas,
    50
  );
}

/* =========================================================
   TURN END
========================================================= */

function resolveTurnAsHost(
  kind,
  winnerId=""
){

  if(
    matchEnded ||
    currentTurnResolved
  ){
    return;
  }

  currentTurnResolved=true;

  const drawer=
    players.get(
      currentDrawerId
    );

  const turnStarted=
    finite(
      currentTurnStartedAt,
      Date.now()
    );

  const elapsed=
    Math.max(
      0,
      Math.min(
        activeTurnSeconds,
        (Date.now()-turnStarted)/1000
      )
    );

  const remain=
    Math.max(
      0,
      activeTurnSeconds-elapsed
    );

  let drawerGain=0;
  let guesserGain=0;

  if(
    kind==="CORRECT" &&
    drawer &&
    winnerId &&
    participants.has(winnerId)
  ){

    drawerGain=
      intClamp(
        80+remain*3,
        80,
        125
      );

    guesserGain=
      intClamp(
        100+remain*3,
        100,
        145
      );

    drawer.score=
      intClamp(
        drawer.score+drawerGain,
        0,
        100000
      );

    drawer.drawTurns=
      intClamp(
        (drawer.drawTurns||0)+1,
        0,
        1000
      );

    const gp=
      players.get(winnerId);

    if(gp){

      gp.score=
        intClamp(
          gp.score+guesserGain,
          0,
          100000
        );

      gp.correct=
        intClamp(
          (gp.correct||0)+1,
          0,
          1000
        );
    }
  }

  if(kind==="SKIP" && drawer){

    drawer.skips=
      intClamp(
        (drawer.skips||0)+1,
        0,
        1000
      );
  }

  if(kind==="TIMEOUT" && drawer){

    drawer.drawTurns=
      intClamp(
        (drawer.drawTurns||0)+1,
        0,
        1000
      );
  }

  const payload={
    roundId,
    turnIndex:currentTurnIndex,
    kind,
    winnerId:winnerId||null,
    drawerId:currentDrawerId,
    answer:currentWord
      ?currentWord.answer
      :"",
    drawerGain,
    guesserGain,
    drawerScore:
      drawer
        ?drawer.score
        :0,
    winnerScore:
      winnerId &&
      players.get(winnerId)
        ?players.get(winnerId).score
        :null,
    at:Date.now()
  };

  sendEvent(
    "TURN_END",
    payload
  );

  applyTurnEnd(payload);
}

function applyTurnEnd(payload){

  if(
    !payload ||
    payload.roundId!==roundId
  ){
    return;
  }

  if(
    currentTurnIndex!==payload.turnIndex &&
    !matchEnded
  ){
    return;
  }

  if(
    payload.drawerId &&
    players.has(payload.drawerId)
  ){

    players.get(
      payload.drawerId
    ).score=
      intClamp(
        payload.drawerScore,
        0,
        100000
      );
  }

  if(
    payload.winnerId &&
    players.has(payload.winnerId) &&
    payload.winnerScore!=null
  ){

    players.get(
      payload.winnerId
    ).score=
      intClamp(
        payload.winnerScore,
        0,
        100000
      );
  }

  const winnerName=
    players.get(
      payload.winnerId
    )?.username||
    "玩家";

  if(payload.kind==="CORRECT"){

    feedText=
      "✅ "+winnerName+
      " 猜中了！";

  }else if(payload.kind==="SKIP"){

    feedText=
      "⏭️ 畫家跳過";

  }else{

    feedText=
      "⏰ 時間到，答案是「"+
      safeString(
        payload.answer,
        "題目",
        30
      )+
      "」";
  }

  let msgText="";

  if(payload.kind==="CORRECT"){

    msgText=
      "✅ "+winnerName+
      " 猜中了答案「"+
      safeString(
        payload.answer,
        "題目",
        30
      )+
      "」！";

  }else if(payload.kind==="SKIP"){

    msgText=
      "⏭️ 畫家跳過這題";

  }else{

    msgText=
      "⏰ 時間到，答案是「"+
      safeString(
        payload.answer,
        "題目",
        30
      )+
      "」";
  }

  guessHistory.push({
    username:"系統",
    text:msgText,
    isCorrect:true,
    isSystem:true
  });

  if(guessHistory.length>50){
    guessHistory.shift();
  }

  state=STATES.PLAYING;

  render();

  setTimeout(
    ensureCanvas,
    50
  );

  const chatBox=
    document.getElementById(
      "guessChatBox"
    );

  if(chatBox){
    chatBox.scrollTop=
      chatBox.scrollHeight;
  }

  clearTimeout(
    turnStateTimer
  );

  turnStateTimer=
    setTimeout(()=>{

      if(matchEnded)return;

      startNextTurnAsHost();

    },1050);
}

/* =========================================================
   GUESS
========================================================= */

function submitGuess(){

  if(
    state!==STATES.PLAYING ||
    isDrawer() ||
    matchEnded ||
    !isParticipant(ME.id) ||
    Date.now()-lastGuessAt<140
  ){
    return;
  }

  const input=
    document.getElementById(
      "guessInput"
    );

  if(!input)return;

  const guess=
    safeString(
      input.value,
      "",
      CONFIG.MAX_GUESS_LENGTH
    );

  input.value="";

  if(!guess)return;

  lastGuessAt=Date.now();

  ensureAudio();

  guessHistory.push({
    username:ME.username,
    text:guess,
    isCorrect:false
  });

  if(guessHistory.length>50){
    guessHistory.shift();
  }

  sendEvent(
    "GAME_EVENT",
    {
      roundId,
      type:"GUESS",
      userId:ME.id,
      username:ME.username,
      turnIndex:currentTurnIndex,
      guess
    }
  );

  /*
    DEV 模式沒有 SDK 廣播，
    所以自己直接處理自己的猜答案。
  */

  if(DEV){

    processGuessAsHost({
      roundId,
      type:"GUESS",
      userId:ME.id,
      username:ME.username,
      turnIndex:currentTurnIndex,
      guess
    });
  }

  render();

  setTimeout(
    ensureCanvas,
    50
  );

  const chatBox=
    document.getElementById(
      "guessChatBox"
    );

  if(chatBox){
    chatBox.scrollTop=
      chatBox.scrollHeight;
  }
}

function processGuessAsHost(payload){

  if(
    matchEnded ||
    currentTurnResolved ||
    state!==STATES.PLAYING ||
    payload.turnIndex!==currentTurnIndex
  ){
    return;
  }

  const uid=
    safeString(
      payload.userId,
      "",
      64
    );

  if(
    !participants.has(uid) ||
    uid===currentDrawerId
  ){
    return;
  }

  const guess=
    safeString(
      payload.guess,
      "",
      CONFIG.MAX_GUESS_LENGTH
    );

  if(!guess)return;

  if(
    answerMatches(
      guess,
      currentWord
    )
  ){

    resolveTurnAsHost(
      "CORRECT",
      uid
    );
  }
}

/* =========================================================
   SKIP
========================================================= */

function skipTurn(){

  if(
    !isDrawer() ||
    state!==STATES.PLAYING ||
    matchEnded ||
    currentTurnResolved
  ){
    return;
  }

  ensureAudio();

  sendEvent(
    "GAME_EVENT",
    {
      roundId,
      type:"SKIP_TURN",
      userId:ME.id,
      turnIndex:currentTurnIndex
    }
  );

  resolveTurnAsHost(
    "SKIP",
    ME.id
  );
}

/* =========================================================
   RESULT
========================================================= */

function participantPlayers(){

  return [...participants]
    .map(id=>players.get(id))
    .filter(Boolean);
}

function buildRewards(){

  const all=
    participantPlayers()
      .sort(
        (a,b)=>
          finite(b.score,0)-
          finite(a.score,0) ||
          a.id.localeCompare(b.id)
      );

  const rewards={};

  /*
    按分數比例分配獎池。
    沒有人得分時平均分。
  */

  const scoreTotal=
    all.reduce(
      (sum,p)=>
        sum+
        intClamp(
          p.score,
          0,
          100000
        ),
      0
    );

  if(scoreTotal<=0){

    const each=
      all.length
        ?Math.floor(
          prizePool/all.length
        )
        :0;

    all.forEach(
      p=>{
        p.reward=each;
        rewards[p.id]=each;
      }
    );

  }else{

    let used=0;

    all.forEach((p,i)=>{

      let reward;

      if(i===all.length-1){

        reward=
          prizePool-used;

      }else{

        reward=
          Math.floor(
            prizePool*
            p.score/
            scoreTotal
          );

        used+=reward;
      }

      p.reward=
        intClamp(
          reward,
          0,
          prizePool
        );

      rewards[p.id]=p.reward;
    });
  }

  return {
    all,
    rewards
  };
}

function finishMatchAsHost(reason){

  if(matchEnded)return;

  matchEnded=true;

  state=STATES.RESULT;

  finalReason=reason;

  const result=
    buildRewards();

  const snapshot=
    result.all.map(
      p=>({
        id:p.id,
        username:p.username,
        score:intClamp(
          p.score,
          0,
          100000
        ),
        reward:intClamp(
          p.reward,
          0,
          prizePool
        )
      })
    );

  const payload={
    roundId,
    reason,
    prizePool,
    rewards:result.rewards,
    scores:snapshot,
    at:Date.now()
  };

  sendEvent(
    "ROUND_END",
    payload
  );

  applyRoundEnd(payload);
}

function callGameOver(reward){

  if(gameOverCalled)return;

  gameOverCalled=true;

  /*
    如果外部平台有 game over API，
    在這裡接。

    目前即使沒有 API，
    也不會讓畫面報錯。
  */

  try{

    if(
      window.BoomRoomSDK &&
      typeof window.BoomRoomSDK.gameOver==="function"
    ){

      window.BoomRoomSDK.gameOver({
        reward:intClamp(
          reward,
          0,
          prizePool
        )
      });
    }

  }catch(err){

    console.warn(
      "gameOver callback error",
      err
    );
  }
}

function applyRoundEnd(payload){

  if(
    !payload ||
    payload.roundId!==roundId
  ){
    return;
  }

  matchEnded=true;

  state=STATES.RESULT;

  finalReason=
    safeString(
      payload.reason,
      "本局已結束",
      60
    );

  const snapshot=
    Array.isArray(payload.scores)
      ?payload.scores
      :[];

  for(
    const row of snapshot
  ){

    if(row.id==null)continue;

    const rowId=
      String(row.id);

    let p=
      players.get(rowId) ||
      addPlayer(
        rowId,
        row.username||"玩家",
        ""
      );

    if(p){

      p.score=
        intClamp(
          row.score,
          0,
          100000
        );

      p.reward=
        intClamp(
          row.reward,
          0,
          prizePool
        );
    }
  }

  const meRow=
    snapshot.find(
      x=>String(x.id)===
        String(ME.id)
    );

  finalReward=
    intClamp(
      meRow
        ?meRow.reward
        :0,
      0,
      prizePool
    );

  const ranking=
    [...snapshot]
      .sort(
        (a,b)=>
          intClamp(
            b.score,
            0,
            100000
          )-
          intClamp(
            a.score,
            0,
            100000
          )
      );

  const myIndex=
    ranking.findIndex(
      x=>String(x.id)===
        String(ME.id)
    );

  finalRank=
    myIndex>=0
      ?myIndex+1
      :1;

  callGameOver(
    finalReward
  );

  render();
}

/* =========================================================
   EVENT HANDLER
========================================================= */

function handleEvent(
  userId,
  eventName,
  payload
){

  const knownUser=
    players.get(userId);

  if(knownUser){
    knownUser.lastSeen=
      Date.now();
  }

  if(eventName==="PLAYER_HELLO"){

    addPlayer(
      userId,
      payload.username,
      payload.avatar,
      "READY"
    );

    render();

    return;
  }

  if(eventName==="ROUND_START"){

    applyRoundStart(
      payload
    );

    return;
  }

  if(eventName==="TURN_START"){

    applyTurnStart(
      payload
    );

    return;
  }

  if(eventName==="TURN_END"){

    applyTurnEnd(
      payload
    );

    return;
  }

  if(eventName==="GAME_EVENT"){

    if(
      !payload ||
      typeof payload!=="object"
    ){
      return;
    }

    if(payload.type==="SELECT_CAT"){

      selectedCategory=
        safeString(
          payload.categoryId,
          selectedCategory,
          30
        );

      showToast(
        (players.get(userId)?.username||"玩家")+
        " 選了 "+
        getCategory(
          selectedCategory
        ).name
      );

      render();

    }else if(
      payload.type==="SELECT_RND"
    ){

      selectedRounds=
        intClamp(
          Number(payload.rounds),
          1,
          5
        );

      showToast(
        (players.get(userId)?.username||"玩家")+
        " 選了 "+
        selectedRounds+
        " 輪"
      );

      render();

    }else if(
      payload.type==="SELECT_SEC"
    ){

      selectedTurnSeconds=
        intClamp(
          Number(payload.turnSeconds),
          15,
          60
        );

      activeTurnSeconds=
        selectedTurnSeconds;

      showToast(
        (players.get(userId)?.username||"玩家")+
        " 選了 "+
        selectedTurnSeconds+
        " 秒"
      );

      render();

    }else if(
      payload.type==="GUESS"
    ){

      processGuessAsHost(
        payload
      );

    }else if(
      payload.type==="SKIP_TURN" &&
      payload.turnIndex===
        currentTurnIndex
    ){

      resolveTurnAsHost(
        "SKIP",
        payload.userId
      );

    }else if(
      payload.type==="STROKE" &&
      !isDrawer()
    ){

      receiveStroke(
        payload.stroke
      );

    }else if(
      payload.type==="CLEAR_CANVAS" &&
      !isDrawer()
    ){

      knownStrokes=[];

      redrawCanvas();

    }else if(
      payload.type==="UNDO_STROKE" &&
      !isDrawer()
    ){

      removeKnownStroke(
        payload.strokeId
      );

      redrawCanvas();
    }

    return;
  }

  if(eventName==="ROUND_END"){

    applyRoundEnd(
      payload
    );

    return;
  }
}

function renderPlayers(){

  const arr=
    [...players.values()]
      .sort(
        (a,b)=>
          finite(a.joinedAt,0)-
          finite(b.joinedAt,0) ||
          a.id.localeCompare(b.id)
      )
      .slice(0,10);

  if(!arr.length){

    return `
      <div class="player">
        <b>尚無玩家</b>
        <em>等待房間玩家</em>
      </div>
    `;
  }

  return arr.map(p=>{

    const you=
      p.id===ME.id;

    const turn=
      p.id===currentDrawerId;

    const role=
      turn?" 🎨":"";

    return `
      <div class="player ${
        you?"me ":""
      }${
        turn?"drawer":""
      }">
        <b>
          ${esc(p.username)}
          ${role}
          ${you?" · 你":""}
        </b>

        <em>
          ${
            matchStarted &&
            participants.has(p.id)
              ?intClamp(
                p.score,
                0,
                100000
              )+" 分"
              :"參賽中"
          }
        </em>
      </div>
    `;

  }).join("")+
  (
    players.size>10
      ?`
        <div class="player">
          <b>+${players.size-10}</b>
          <em>更多玩家</em>
        </div>
      `
      :""
  );
}

function render(){

  try{

    const main=
      document.getElementById(
        "main"
      );

    if(!main)return;

    if(
      state===STATES.LOBBY
    ){

      renderLobby(main);

      return;
    }

    if(
      state===STATES.COUNTDOWN ||
      state===STATES.PLAYING
    ){

      renderGame(main);

      return;
    }

    renderResult(main);

  }catch(err){

    console.error(
      "Render error:",
      err
    );

    const main=
      document.getElementById(
        "main"
      );

    if(main){

      main.innerHTML=`
        <div class="panel"
             style="color:#ff637a;padding:20px;">
          <h3>程式錯誤</h3>
          <pre style="
            white-space:pre-wrap;
            user-select:text;
            color:#ffb5c0;
          ">${esc(
            err.stack||String(err)
          )}</pre>
        </div>
      `;
    }
  }
}

/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop(ts){

  if(!rafRunning){
    return;
  }

  const dt=
    Math.min(
      Math.max(
        (ts-lastFrame)/1000,
        0
      ),
      0.033
    );

  lastFrame=ts;

  fps=
    0.9*fps+
    0.1*
    (
      1/
      Math.max(
        dt,
        0.001
      )
    );

  if(
    state===STATES.PLAYING &&
    !matchEnded
  ){

    const now=
      Date.now();

    if(
      now>=
      currentTurnStartedAt+
      activeTurnSeconds*1000
    ){

      resolveTurnAsHost(
        "TIMEOUT",
        ""
      );
    }

    const timer=
      document.getElementById(
        "gameTimer"
      );

    if(timer){

      timer.textContent=
        String(
          Math.max(
            0,
            Math.ceil(
              (
                currentTurnStartedAt+
                activeTurnSeconds*1000-
                now
              )/1000
            )
          )
        );
    }
  }

  loopHandle=
    requestAnimationFrame(
      gameLoop
    );
}

/* =========================================================
   HEARTBEAT
========================================================= */

function heartbeat(){

  if(!ME.id)return;

  sendEvent(
    "PLAYER_HEARTBEAT",
    {
      roundId:roundId||"LOBBY",
      userId:ME.id,
      status:state,
      timestamp:Date.now()
    }
  );

  const now=
    Date.now();

  for(
    const [id,p]
    of players
  ){

    if(
      id!==ME.id &&
      now-p.lastSeen>
        CONFIG.PLAYER_TIMEOUT_MS
    ){

      p.status="TIMEOUT";
    }
  }
}

/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(document.hidden){

      hiddenAt=
        Date.now();

    }else{

      if(
        state===STATES.PLAYING &&
        hiddenAt &&
        Date.now()-hiddenAt>2500
      ){

        hiddenAt=0;
      }
    }
  }
);

window.addEventListener(
  "pagehide",
  ()=>{

    clearTimeout(
      turnStateTimer
    );

    clearInterval(
      lobbyTimer
    );

    clearInterval(
      heartbeatTimer
    );

    cancelAnimationFrame(
      loopHandle
    );

    rafRunning=false;
  }
);

/* =========================================================
   CANVAS
========================================================= */

function ensureCanvas(){

  canvas=
    document.getElementById(
      "drawCanvas"
    );

  if(!canvas){
    return false;
  }

  ctx=
    canvas.getContext(
      "2d",
      {
        alpha:false,
        desynchronized:true
      }
    );

  if(!ctx){
    return false;
  }

  if(!resizeBound){

    window.addEventListener(
      "resize",
      resizeCanvas,
      {passive:true}
    );

    resizeBound=true;
  }

  resizeCanvas();

  attachCanvasEvents();

  return true;
}

function resizeCanvas(){

  if(!canvas||!ctx){
    return;
  }

  const r=
    canvas.getBoundingClientRect();

  const w=
    r.width>10
      ?r.width
      :340;

  const h=
    r.height>10
      ?r.height
      :260;

  const dpr=
    Math.min(
      window.devicePixelRatio||1,
      2
    );

  canvas.width=
    Math.max(
      1,
      Math.floor(w*dpr)
    );

  canvas.height=
    Math.max(
      1,
      Math.floor(h*dpr)
    );

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    1,
    1
  );

  ctx.fillStyle=
    "#f7f8fb";

  ctx.fillRect(
    0,
    0,
    w,
    h
  );

  redrawCanvas();
}

function redrawCanvas(){

  if(!canvas||!ctx){
    return;
  }

  const r=
    canvas.getBoundingClientRect();

  ctx.fillStyle=
    "#f7f8fb";

  ctx.fillRect(
    0,
    0,
    r.width,
    r.height
  );

  for(
    const s of knownStrokes
  ){

    drawStroke(s);
  }
}

function pointFromEvent(e){

  const r=
    canvas.getBoundingClientRect();

  return {
    x:clamp(
      (
        e.clientX-r.left
      )/
      Math.max(
        1,
        r.width
      ),
      0,
      1
    ),

    y:clamp(
      (
        e.clientY-r.top
      )/
      Math.max(
        1,
        r.height
      ),
      0,
      1
    )
  };
}

function drawStroke(stroke){

  if(
    !stroke ||
    !Array.isArray(stroke.points) ||
    stroke.points.length<1 ||
    !ctx ||
    !canvas
  ){
    return;
  }

  const r=
    canvas.getBoundingClientRect();

  const color=
    safeString(
      stroke.color,
      "#151923",
      20
    );

  const size=
    clamp(
      stroke.size,
      2,
      30
    );

  ctx.strokeStyle=color;
  ctx.lineWidth=size;
  ctx.lineCap="round";
  ctx.lineJoin="round";

  for(
    let i=1;
    i<stroke.points.length;
    i++
  ){

    const a=
      stroke.points[i-1];

    const b=
      stroke.points[i];

    ctx.beginPath();

    ctx.moveTo(
      a.x*r.width+1,
      a.y*r.height+1
    );

    ctx.lineTo(
      b.x*r.width+1,
      b.y*r.height+1
    );

    ctx.stroke();
  }

  if(
    stroke.points.length===1
  ){

    const a=
      stroke.points[0];

    ctx.beginPath();

    ctx.arc(
      a.x*r.width+1,
      a.y*r.height+1,
      size/2,
      0,
      Math.PI*2
    );

    ctx.fillStyle=color;

    ctx.fill();
  }
}

function beginStroke(e){

  if(
    !isDrawer() ||
    state!==STATES.PLAYING ||
    matchEnded ||
    currentTurnResolved
  ){
    return;
  }

  e.preventDefault();

  ensureAudio();

  const p=
    pointFromEvent(e);

  const color=
    tool==="eraser"
      ?" #f7f8fb".trim()
      :brushColor;

  currentStroke={
    id:
      ME.id+
      "_"+
      Date.now().toString(36)+
      "_"+
      Math.random()
        .toString(36)
        .slice(2,6),

    color,

    size:brushSize,

    points:[p]
  };

  try{

    canvas.setPointerCapture(
      e.pointerId
    );

  }catch(_){}
}

function moveStroke(e){

  if(
    !currentStroke ||
    !canvas
  ){
    return;
  }

  e.preventDefault();

  const p=
    pointFromEvent(e);

  const last=
    currentStroke.points[
      currentStroke.points.length-1
    ];

  const r=
    canvas.getBoundingClientRect();

  const dx=
    (p.x-last.x)*r.width;

  const dy=
    (p.y-last.y)*r.height;

  if(
    Math.hypot(dx,dy)<1.4
  ){
    return;
  }

  if(
    currentStroke.points.length<
    CONFIG.MAX_POINTS_PER_STROKE
  ){

    currentStroke.points.push(p);

    drawStroke({
      color:currentStroke.color,
      size:currentStroke.size,
      points:[last,p]
    });
  }
}

function endStroke(e){

  if(!currentStroke){
    return;
  }

  if(e&&e.preventDefault){
    e.preventDefault();
  }

  const stroke={
    id:currentStroke.id,
    color:currentStroke.color,
    size:currentStroke.size,
    points:
      currentStroke.points.slice(
        0,
        CONFIG.MAX_POINTS_PER_STROKE
      )
  };

  knownStrokes.push(
    stroke
  );

  localStrokeIds.push(
    stroke.id
  );

  if(
    knownStrokes.length>
    CONFIG.MAX_STROKES
  ){

    knownStrokes.shift();
  }

  sendEvent(
    "GAME_EVENT",
    {
      roundId,
      type:"STROKE",
      stroke,
      turnIndex:currentTurnIndex
    }
  );

  currentStroke=null;
}

function attachCanvasEvents(){

  if(
    !canvas ||
    canvas.dataset.bound==="1"
  ){
    return;
  }

  canvas.dataset.bound="1";

  canvas.addEventListener(
    "pointerdown",
    beginStroke,
    {passive:false}
  );

  canvas.addEventListener(
    "pointermove",
    moveStroke,
    {passive:false}
  );

  canvas.addEventListener(
    "pointerup",
    endStroke,
    {passive:false}
  );

  canvas.addEventListener(
    "pointercancel",
    endStroke,
    {passive:false}
  );

  canvas.addEventListener(
    "dragstart",
    e=>e.preventDefault()
  );
}

function receiveStroke(stroke){

  if(
    !stroke ||
    !Array.isArray(
      stroke.points
    ) ||
    stroke.points.length>
      CONFIG.MAX_POINTS_PER_STROKE
  ){
    return;
  }

  if(
    stroke.id &&
    knownStrokes.some(
      s=>s.id===stroke.id
    )
  ){
    return;
  }

  const safeStroke={
    id:safeString(
      stroke.id,
      "remote",
      100
    ),

    color:safeString(
      stroke.color,
      "#151923",
      20
    ),

    size:clamp(
      stroke.size,
      2,
      30
    ),

    points:
      stroke.points
        .slice(
          0,
          CONFIG.MAX_POINTS_PER_STROKE
        )
        .map(
          p=>({
            x:clamp(
              p.x,
              0,
              1
            ),
            y:clamp(
              p.y,
              0,
              1
            )
          })
        )
  };

  knownStrokes.push(
    safeStroke
  );

  if(
    knownStrokes.length>
    CONFIG.MAX_STROKES
  ){

    knownStrokes.shift();
  }

  drawStroke(
    safeStroke
  );
}

function removeKnownStroke(id){

  if(typeof id!=="string"){
    return;
  }

  knownStrokes=
    knownStrokes.filter(
      s=>s.id!==id
    );
}

function undoLastStroke(){

  if(
    !isDrawer() ||
    !localStrokeIds.length ||
    matchEnded
  ){
    return;
  }

  const id=
    localStrokeIds.pop();

  removeKnownStroke(id);

  redrawCanvas();

  sendEvent(
    "GAME_EVENT",
    {
      roundId,
      type:"UNDO_STROKE",
      strokeId:id,
      turnIndex:currentTurnIndex
    }
  );

  playTone(
    400,
    .05
  );
}

function clearAllCanvas(){

  if(
    !isDrawer() ||
    matchEnded
  ){
    return;
  }

  knownStrokes=[];
  localStrokeIds=[];

  redrawCanvas();

  sendEvent(
    "GAME_EVENT",
    {
      roundId,
      type:"CLEAR_CANVAS",
      turnIndex:currentTurnIndex
    }
  );

  playTone(
    350,
    .05
  );
}

function syncTools(){

  document
    .querySelectorAll(
      "[data-tool]"
    )
    .forEach(b=>{

      b.classList.toggle(
        "active",
        b.dataset.tool===tool
      );
    });

  document
    .querySelectorAll(
      "[data-size]"
    )
    .forEach(b=>{

      b.classList.toggle(
        "active",
        Number(
          b.dataset.size
        )===brushSize
      );
    });
}

/* =========================================================
   AUDIO
========================================================= */

function ensureAudio(){

  if(muted)return;

  try{

    if(!audioCtx){

      audioCtx=
        new(
          window.AudioContext||
          window.webkitAudioContext
        )();
    }

    if(
      audioCtx.state==="suspended"
    ){

      audioCtx.resume();
    }

  }catch(_){}
}

function playTone(
  freq,
  duration=.08
){

  if(muted)return;

  const now=
    performance.now();

  if(
    now-soundCooldown<35
  ){
    return;
  }

  soundCooldown=now;

  ensureAudio();

  if(!audioCtx)return;

  try{

    const o=
      audioCtx.createOscillator();

    const g=
      audioCtx.createGain();

    o.type="sine";

    o.frequency.value=
      clamp(
        freq,
        120,
        1700
      );

    g.gain.value=.28;

    o.connect(g);

    g.connect(
      audioCtx.destination
    );

    o.start();

    g.gain.exponentialRampToValueAtTime(
      .0001,
      audioCtx.currentTime+
      duration
    );

    o.stop(
      audioCtx.currentTime+
      duration
    );

  }catch(_){}
}

function vibrate(ms){

  try{

    if(
      navigator.vibrate
    ){

      navigator.vibrate(ms);
    }

  }catch(_){}
}

/* =========================================================
   TOAST
========================================================= */

function showToast(t){

  const el=
    document.getElementById(
      "toast"
    );

  if(!el)return;

  el.textContent=
    safeString(
      t,
      "",
      100
    );

  el.classList.add(
    "show"
  );

  clearTimeout(
    showToast.t
  );

  showToast.t=
    setTimeout(
      ()=>{
        el.classList.remove(
          "show"
        );
      },
      1200
    );
}

/* =========================================================
   BOOT
========================================================= */

function boot(){

  const main=
    document.getElementById(
      "main"
    );

  if(!main){

    setTimeout(
      boot,
      50
    );

    return;
  }

  render();

  lastFrame=
    performance.now();

  rafRunning=true;

  loopHandle=
    requestAnimationFrame(
      gameLoop
    );

  heartbeatTimer=
    setInterval(
      heartbeat,
      CONFIG.HEARTBEAT_MS
    );
}

boot();

</script>
