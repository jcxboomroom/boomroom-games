/* =========================================================
   工具
   ========================================================= */

function safeString(v, fallback, maxLen){
  if(v === null || v === undefined) return fallback;

  const s = String(v).trim();

  return s ? s.slice(0, maxLen) : fallback;
}

function finite(v, fallback=0){
  return Number.isFinite(v) ? v : fallback;
}

function clamp(v,min,max){
  return Math.min(max, Math.max(min, finite(v,min)));
}

function intClamp(v,min,max){
  return Math.floor(clamp(v,min,max));
}

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    "\"":"&quot;",
    "'":"&#39;"
  }[c]));
}

function stableHash(s){
  let h = 2166136261 >>> 0;

  for(let i=0;i<s.length;i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h,16777619);
  }

  return h >>> 0;
}

function mulberry32(a){
  return function(){
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);

    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function makeRoundId(){

function makeSeed(){

}

function normalizeText(s){
  return String(s || "")
    .normalize("NFKC")
    .toLowerCase()
    .replace(/[\s\u3000，。！？、,.!?;；:：'"“”‘’()（）\[\]{}<>《》【】]/g,"");
}

function answerMatches(guess,word){
  const g = normalizeText(guess);

  if(!g || !word) return false;

  if(g === normalizeText(word.answer)){
    return true;
  }

  return word.aliases.some(a => g === normalizeText(a));
}

function getCategory(id){

function addPlayer(id,username,avatar,status="READY"){

  id = String(id);

  if(!id || id.length > 64) return null;

      id,
      username: safeString(username,"玩家",CONFIG.MAX_NAME_LENGTH),
      avatar: safeString(avatar,"",CONFIG.MAX_AVATAR_LENGTH),
      status,
      paid: true,
      score: 0,
      reward: 0,
      lastSeen: Date.now(),
      joinedAt: Date.now(),
      correct: 0,
      drawTurns: 0,
      skips: 0
    };

    players.set(id,p);
  }else{
    p.username = safeString(username,p.username,CONFIG.MAX_NAME_LENGTH);
    p.avatar = safeString(avatar,p.avatar,CONFIG.MAX_AVATAR_LENGTH);
    p.status = status || p.status;
    p.lastSeen = Date.now();
    p.paid = true;
  }

  return p;
}

function sendEvent(eventName,payload){

    return false;
  }

  if(
    !/^[A-Z0-9_]{1,40}$/.test(eventName) ||
    !payload ||
    typeof payload !== "object" ||
    Array.isArray(payload)
  ){
    return false;
  }

  const copy = {
    ...payload,
    eventId: safeString(
      payload.eventId,
      ME.id +
      "_" +
      Date.now().toString(36) +
      "_" +
      Math.random().toString(36).slice(2,7),
      80
    )
  };

  const eventData = {
    action: "sendGameEvent",
    eventName,
    payload: copy
  };

  try{

    if(
      window.BoomRoomSDK &&
      typeof window.BoomRoomSDK.sendGameEvent === "function"
    ){

      window.BoomRoomSDK.sendGameEvent(
        eventName,
        copy
      );

      return true;
    }

    if(window.parent !== window){

      window.parent.postMessage(
        JSON.stringify(eventData),
        "*"
      );

      return true;
    }

  }catch(_){}

  return false;
}

/* =========================================================
   ★ 建立回合順序
   ========================================================= */

function buildTurnOrder(){

  const ids = [...participants];

  /*
   * 排序讓所有客戶端順序穩定。
   */
  ids.sort((a,b)=>{

    const pa = players.get(a);
    const pb = players.get(b);

    const ja = finite(
      pa?.joinedAt,
      0
    );

    const jb = finite(
      pb?.joinedAt,
      0
    );

    return (
      ja - jb ||
      String(a).localeCompare(String(b))
    );
  });

  /*
   * 例如：
   * 玩家 A B C
   * 3 輪
   *
   * A B C A B C A B C
   */
  const order = [];

  for(
    let round = 0;
    round < selectedRounds;
    round++
  ){
    ids.forEach(id=>{
      order.push(id);
    });
  }

  return order;
}

/* =========================================================
   開始新局
   ========================================================= */

function startRoundAsHost(category){

  /*
   * 防止重複開局。
   */
  if(matchStarted || matchEnded){
    return;
  }

  const allList = [...players.values()]
    .filter(p =>
      p &&
      p.status !== "LEFT" &&
      p.status !== "TIMEOUT"
    )
    .slice(0,CONFIG.MAX_PLAYERS);

  if(allList.length === 0){

    allList.push(
      players.get(ME.id) ||
      addPlayer(
        ME.id,
        ME.username,
        ME.avatar,
        "READY"
      )
    );
  }

  participants.clear();

  allList.forEach(p=>{

    if(!p) return;

    p.paid = true;
    p.status = "READY";
    p.score = 0;
    p.reward = 0;
    p.correct = 0;
    p.drawTurns = 0;
    p.skips = 0;

    participants.add(p.id);
  });

  /*
   * 獎池。
   */
  totalPool =
    participants.size *
    CONFIG.ENTRY_FEE;

  platformFee =
    Math.floor(
      totalPool *
      CONFIG.PLATFORM_FEE_RATE
    );

  prizePool =
    totalPool -
    platformFee;

  /*
   * ★ 真正開始的地方
   */
  matchStarted = true;
  matchEnded = false;
  gameOverCalled = false;

  /*
   * 第一個倒數。
   */
  roundStartAt =
    Date.now() + 1000;

  /*
   * ★ 根據選擇的輪數建立完整回合順序。
   */
  turnOrder = buildTurnOrder();

  const payload = {

    roundId,

    seed: roundSeed,

    startTime: roundStartAt,

    category: selectedCategory,

    participantIds: [
      ...participants
    ],

    turnOrder,

    turnSeconds:
      activeTurnSeconds,

    rounds:
      selectedRounds,

    prizePool
  };

  /*
   * 同步給其他玩家。
   */
  sendEvent(
    "ROUND_START",
    payload
  );

  /*
   * 自己立即套用。
   */
  applyRoundStart(payload);
}

/* =========================================================
   套用 ROUND_START
   ========================================================= */

function applyRoundStart(payload){

  if(
    !payload ||
    typeof payload !== "object"
  ){
    return;
  }

  roundId =
    safeString(
      payload.roundId,
      roundId,
      100
    );

  roundSeed =
    finite(
      payload.seed,
      0
    ) >>> 0;

  roundStartAt =
    finite(
      payload.startTime,
      Date.now()
    );

  selectedCategory =
    safeString(
      payload.category,
      selectedCategory,
      30
    );

  /*
   * ★ 同步輪數。
   */
  if(
    Number.isFinite(
      Number(payload.rounds)
    )
  ){
    selectedRounds =
      intClamp(
        Number(payload.rounds),
        1,
        5
      );
  }

  /*
   * ★ 同步秒數。
   */
  if(
    Number.isFinite(
      Number(payload.turnSeconds)
    )
  ){

    activeTurnSeconds =
      intClamp(
        Number(payload.turnSeconds),
        15,
        60
      );

    selectedTurnSeconds =
      activeTurnSeconds;
  }

  /*
   * 取得參賽者。
   */
  const ids =
    Array.isArray(payload.participantIds)
      ? payload.participantIds
          .filter(x =>
            typeof x === "string"
          )
      : [ME.id];

  turnOrder =
    Array.isArray(payload.turnOrder) &&
    payload.turnOrder.length
      ? payload.turnOrder.filter(
          x => typeof x === "string"
        )
      : ids;

  participants.clear();

  ids.forEach(id=>{

    participants.add(id);

    const p =
      players.get(id) ||
      addPlayer(
        id,
        "玩家",
        "",
        "READY"
      );

    if(p){
      p.status = "READY";
    }
  });

  /*
   * 獎池同步。
   */
  if(
    Number.isFinite(
      Number(payload.prizePool)
    )
  ){
    prizePool =
      intClamp(
        Number(payload.prizePool),
        0,
        1000000
      );
  }else{
    totalPool =
      participants.size *
      CONFIG.ENTRY_FEE;

    platformFee =
      Math.floor(
        totalPool *
        CONFIG.PLATFORM_FEE_RATE
      );

    prizePool =
      totalPool -
      platformFee;
  }

  currentTurnIndex = -1;
  currentDrawerId = "";
  currentTurnStartedAt = 0;
  currentTurnResolved = false;

  currentWord = null;

  knownStrokes = [];
  localStrokeIds = [];
  currentStroke = null;

  matchStarted = true;
  matchEnded = false;

  state = STATES.COUNTDOWN;

  countdownValue =
    CONFIG.COUNTDOWN_SECONDS;

  render();

  /*
   * ★ 第一個倒數。
   */
  startCountdown();
}

/* =========================================================
   倒數
   ========================================================= */

function startCountdown(){

  clearTimeout(turnStateTimer);

  countdownValue =
    CONFIG.COUNTDOWN_SECONDS;

  state = STATES.COUNTDOWN;

  render();

  const tick = ()=>{

    if(matchEnded){
      return;
    }

    if(countdownValue <= 0){

      /*
       * ★ 倒數結束真正進入第一回合。
       */
      startNextTurnAsHost();

      return;
    }

    playTone(
      520 + countdownValue * 80,
      0.06
    );

    render();

    countdownValue--;

    turnStateTimer =
      setTimeout(
        tick,
        850
      );
  };

  tick();
}

/* =========================================================
   回合
   ========================================================= */

function isDrawer(){
  return (
    !!currentDrawerId &&
    currentDrawerId === ME.id
  );
}

function isParticipant(id){
  return participants.has(id);
}

function findWordIndex(categoryId,wordId){

  const bank =
    WORDS[categoryId] || [];

  const idx =
    bank.findIndex(
      w => w.id === wordId
    );

  return idx < 0 ? 0 : idx;
}

/* =========================================================
   題目選擇
   ========================================================= */

function wordForTurn(
  categoryId,
  turnIndex,
  seed
){

  const bank =
    WORDS[categoryId] || [];

  if(!bank.length){
    return null;
  }

  /*
   * 每個回合穩定產生題目。
   */
  const key =
    String(seed) +
    "|" +
    String(categoryId) +
    "|" +
    String(turnIndex);

  const hash =
    stableHash(key);

  const random =
    mulberry32(hash);

  const index =
    Math.floor(
      random() * bank.length
    );

  return bank[index];
}

/* =========================================================
   ★ 開始下一回合
   ========================================================= */

function startNextTurnAsHost(){

  if(matchEnded){
    return;
  }

  /*
   * ★ 最重要：
   * turnOrder 已經包含所有輪數。
   */
  currentTurnIndex++;

  /*
   * 全部回合完成。
   */
  if(
    currentTurnIndex >=
    turnOrder.length
  ){

    finishMatchAsHost(
      "所有玩家都完成輪流作畫"
    );

    return;
  }

  /*
   * 指定畫家。
   */
  currentDrawerId =
    turnOrder[currentTurnIndex];

  /*
   * 回合開始時間。
   */
  currentTurnStartedAt =
    Date.now() + 250;

  currentTurnResolved = false;

  knownStrokes = [];
  localStrokeIds = [];
  currentStroke = null;

  /*
   * 題目。
   */
  currentWord =
    wordForTurn(
      selectedCategory,
      currentTurnIndex,
      roundSeed
    );

  feedText =
    isDrawer()
      ? "輪到你！畫出題目，別寫字。"
      : "快猜！先答對先得分。";

  const payload = {

    roundId,

    turnIndex:
      currentTurnIndex,

    drawerId:
      currentDrawerId,

    category:
      selectedCategory,

    wordId:
      currentWord
        ? currentWord.id
        : "",

    wordIndex:
      currentWord
        ? findWordIndex(
            selectedCategory,
            currentWord.id
          )
        : 0,

    startTime:
      currentTurnStartedAt,

    duration:
      activeTurnSeconds,

    turnSeconds:
      activeTurnSeconds
  };

  sendEvent(
    "TURN_START",
    payload
  );

  applyTurnStart(payload);
}

/* =========================================================
   套用 TURN_START
   ========================================================= */

function applyTurnStart(payload){

  if(
    !payload ||
    payload.roundId !== roundId
  ){
    return;
  }

  if(
    Number.isFinite(
      Number(payload.turnSeconds)
    )
  ){

    activeTurnSeconds =
      intClamp(
        Number(payload.turnSeconds),
        15,
        60
      );
  }

  currentTurnIndex =
    intClamp(
      Number(payload.turnIndex),
      -1,
      Math.max(
        0,
        turnOrder.length - 1
      )
    );

  currentDrawerId =
    safeString(
      payload.drawerId,
      "",
      64
    );

  currentTurnStartedAt =
    finite(
      payload.startTime,
      Date.now()
    );

  currentTurnResolved = false;

  selectedCategory =
    safeString(
      payload.category,
      selectedCategory,
      30
    );

  const bank =
    WORDS[selectedCategory] || [];

  const idx =
    intClamp(
      Number(payload.wordIndex),
      0,
      Math.max(
        0,
        bank.length - 1
      )
    );

  currentWord =
    bank[idx] || null;

  knownStrokes = [];
  localStrokeIds = [];
  currentStroke = null;

  state =
    STATES.PLAYING;

  feedText =
    isDrawer()
      ? "輪到你！畫出題目，別寫字。"
      : "快猜！先答對先得分。";

  guessHistory.push({
    username: "系統",
    text:
      "🎨 第 " +
      (currentTurnIndex + 1) +
      " 回合開始！",
    isCorrect: false,
    isSystem: true
  });

  if(
    guessHistory.length > 50
  ){
    guessHistory.shift();
  }

  const me =
    players.get(ME.id);

  if(me){
    me.status = "PLAYING";
  }

  sendEvent(
    "PLAYER_STATE",
    {
      roundId,
      userId: ME.id,
      status: "PLAYING",
      score: intClamp(
        me?.score || 0,
        0,
        100000
      )
    }
  );

  render();

  playTone(
    740,
    0.08
  );

  setTimeout(
    ensureCanvas,
    50
  );
}

/* =========================================================
   結算回合
   ========================================================= */

function resolveTurnAsHost(
  kind,
  winnerId=""
){

  if(
    matchEnded ||
    currentTurnResolved
  ){
    return;
  }

  currentTurnResolved = true;

  const drawer =
    players.get(
      currentDrawerId
    );

  const turnStarted =
    finite(
      currentTurnStartedAt,
      Date.now()
    );

  const elapsed =
    Math.max(
      0,
      Math.min(
        activeTurnSeconds,
        (Date.now() - turnStarted) / 1000
      )
    );

  const remain =
    Math.max(
      0,
      activeTurnSeconds - elapsed
    );

  let drawerGain = 0;
  let guesserGain = 0;

  if(
    kind === "CORRECT" &&
    drawer &&
    winnerId &&
    participants.has(winnerId)
  ){

    drawerGain =
      intClamp(
        80 + remain * 3,
        80,
        125
      );

    guesserGain =
      intClamp(
        100 + remain * 3,
        100,
        145
      );

    drawer.score =
      intClamp(
        drawer.score + drawerGain,
        0,
        100000
      );

    drawer.drawTurns++;

    const gp =
      players.get(winnerId);

    if(gp){

      gp.score =
        intClamp(
          gp.score + guesserGain,
          0,
          100000
        );

      gp.correct++;
    }

  }else if(kind === "SKIP"){

    if(drawer){
      drawer.skips++;
    }
  }

  const payload = {

    roundId,

    turnIndex:
      currentTurnIndex,

    kind,

    winnerId:
      winnerId || null,

    drawerId:
      currentDrawerId,

    answer:
      currentWord
        ? currentWord.answer
        : "",

    drawerGain,

    guesserGain,

    drawerScore:
      drawer
        ? drawer.score
        : 0,

    winnerScore:
      winnerId &&
      players.get(winnerId)
        ? players.get(winnerId).score
        : null,

    at: Date.now()
  };

  sendEvent(
    "TURN_END",
    payload
  );

  applyTurnEnd(payload);
}

/* =========================================================
   套用回合結束
   ========================================================= */

function applyTurnEnd(payload){

  if(
    !payload ||
    payload.roundId !== roundId
  ){
    return;
  }

  /*
   * 防止舊回合事件干擾。
   */
  if(
    currentTurnIndex !==
    Number(payload.turnIndex)
  ){
    return;
  }

  if(
    payload.drawerId &&
    players.has(payload.drawerId)
  ){

    players.get(
      payload.drawerId
    ).score =
      intClamp(
        payload.drawerScore,
        0,
        100000
      );
  }

  if(
    payload.winnerId &&
    players.has(payload.winnerId) &&
    payload.winnerScore != null
  ){

    players.get(
      payload.winnerId
    ).score =
      intClamp(
        payload.winnerScore,
        0,
        100000
      );
  }

  let msgText = "";

  if(payload.kind === "CORRECT"){

    const winner =
      players.get(
        payload.winnerId
      );

    feedText =
      "✅ " +
      (winner?.username || "玩家") +
      " 猜中了！";

    msgText =
      "✅ " +
      (winner?.username || "玩家") +
      " 猜中了答案！";

    playTone(
      980,
      0.12
    );

    vibrate(70);

  }else if(payload.kind === "SKIP"){

    feedText =
      "⏭️ 畫家跳過";

    msgText =
      "⏭️ 畫家跳過這題";

  }else{

    feedText =
      "⏰ 時間到！";

    msgText =
      "⏰ 時間到，答案是「" +
      safeString(
        payload.answer,
        "題目",
        30
      ) +
      "」";

    playTone(
      280,
      0.12
    );
  }

  guessHistory.push({
    username: "系統",
    text: msgText,
    isCorrect: true,
    isSystem: true
  });

  if(
    guessHistory.length > 50
  ){
    guessHistory.shift();
  }

  /*
   * 保持畫布可見，短暫顯示答案。
   */
  state = STATES.PLAYING;

  render();

  setTimeout(
    ensureCanvas,
    50
  );

  const chatBox =
    document.getElementById(
      "guessChatBox"
    );

  if(chatBox){
    chatBox.scrollTop =
      chatBox.scrollHeight;
  }

  clearTimeout(
    turnStateTimer
  );

  /*
   * ★ 回合結束後進下一回合。
   */
  turnStateTimer =
    setTimeout(()=>{

      if(matchEnded){
        return;
      }

      startNextTurnAsHost();

    },1050);
}

/* =========================================================
   猜答案
   ========================================================= */

function submitGuess(){

  if(
    state !== STATES.PLAYING ||
    isDrawer() ||
    matchEnded ||
    !isParticipant(ME.id) ||
    Date.now() - lastGuessAt < 140
  ){
    return;
  }

  const input =
    document.getElementById(
      "guessInput"
    );

  if(!input){
    return;
  }

  const guess =
    safeString(
      input.value,
      "",
      CONFIG.MAX_GUESS_LENGTH
    );

  input.value = "";

  if(!guess){
    return;
  }

  lastGuessAt =
    Date.now();

  ensureAudio();

  guessHistory.push({
    username: ME.username,
    text: guess,
    isCorrect: false
  });

  if(
    guessHistory.length > 50
  ){
    guessHistory.shift();
  }

  sendEvent(
    "GAME_EVENT",
    {
      roundId,
      type: "GUESS",
      userId: ME.id,
      username: ME.username,
      turnIndex: currentTurnIndex,
      guess
    }
  );

  /*
   * DEV 模式沒有事件廣播，
   * 所以本機自己就是房主時，
   * 必須直接處理猜答案。
   */
  if(DEV || sdkIsHost){

    processGuessAsHost({
      roundId,
      type: "GUESS",
      userId: ME.id,
      username: ME.username,
      turnIndex: currentTurnIndex,
      guess
    });

  }

  render();

  setTimeout(
    ensureCanvas,
    50
  );

  const chatBox =
    document.getElementById(
      "guessChatBox"
    );

  if(chatBox){
    chatBox.scrollTop =
      chatBox.scrollHeight;
  }
}

function processGuessAsHost(payload){

  if(
    matchEnded ||
    currentTurnResolved ||
    state !== STATES.PLAYING ||
    payload.roundId !== roundId ||
    Number(payload.turnIndex) !== currentTurnIndex
  ){
    return;
  }

  const uid =
    safeString(
      payload.userId,
      "",
      64
    );

  if(
    !participants.has(uid) ||
    uid === currentDrawerId
  ){
    return;
  }

  const guess =
    safeString(
      payload.guess,
      "",
      CONFIG.MAX_GUESS_LENGTH
    );

  if(!guess){
    return;
  }

  if(
    answerMatches(
      guess,
      currentWord
    )
  ){

    resolveTurnAsHost(
      "CORRECT",
      uid
    );
  }
}

/* =========================================================
   跳過
   ========================================================= */

function skipTurn(){

  if(
    !isDrawer() ||
    state !== STATES.PLAYING ||
    matchEnded ||
    currentTurnResolved
  ){
    return;
  }

  ensureAudio();

  const payload = {
    roundId,
    type: "SKIP_TURN",
    userId: ME.id,
    turnIndex: currentTurnIndex
  };

  sendEvent(
    "GAME_EVENT",
    payload
  );

  /*
   * DEV / 房主直接處理。
   */
  if(DEV || sdkIsHost){
    resolveTurnAsHost(
      "SKIP",
      ME.id
    );
  }
}

/* =========================================================
   結束遊戲
   ========================================================= */

function participantPlayers(){

  return [...players.values()]
    .filter(p =>
      participants.has(p.id)
    );
}

function buildRewards(){

  const all =
    participantPlayers()
      .sort((a,b)=>
        finite(b.score,0) -
        finite(a.score,0)
      );

  /*
   * 分數總和。
   */
  const scoreTotal =
    all.reduce(
      (sum,p)=>
        sum +
        Math.max(
          0,
          finite(p.score,0)
        ),
      0
    );

  /*
   * 如果大家都 0 分，
   * 平分獎池。
   */
  if(
    scoreTotal <= 0
  ){

    const base =
      all.length
        ? Math.floor(
            prizePool / all.length
          )
        : 0;

    const rewards = {};

    let used = 0;

    all.forEach((p,i)=>{

      let amount = base;

      if(i === all.length - 1){
        amount =
          prizePool - used;
      }

      amount =
        intClamp(
          amount,
          0,
          prizePool
        );

      p.reward = amount;

      rewards[p.id] = amount;

      used += amount;
    });

    return {
      all,
      rewards
    };
  }

  const rewards = {};

  let used = 0;

  all.forEach((p,i)=>{

    let amount =
      Math.floor(
        prizePool *
        Math.max(
          0,
          finite(p.score,0)
        ) /
        scoreTotal
      );

    if(i === all.length - 1){
      amount =
        prizePool - used;
    }

    amount =
      intClamp(
        amount,
        0,
        prizePool
      );

    p.reward = amount;

    rewards[p.id] = amount;

    used += amount;
  });

  return {
    all,
    rewards
  };
}

function finishMatchAsHost(reason){

  if(matchEnded){
    return;
  }

  matchEnded = true;
  state = STATES.RESULT;

  finalReason = reason;

  const result =
    buildRewards();

  const snapshot =
    result.all.map(p=>({

      id: p.id,

      username: p.username,

      score:
        intClamp(
          p.score,
          0,
          100000
        ),

      reward:
        intClamp(
          p.reward,
          0,
          prizePool
        )
    }));

  const payload = {

    roundId,

    reason,

    prizePool,

    rewards:
      result.rewards,

    scores:
      snapshot,

    at: Date.now()
  };

  sendEvent(
    "ROUND_END",
    payload
  );

  applyRoundEnd(payload);
}

function applyRoundEnd(payload){

  if(
    !payload ||
    payload.roundId !== roundId
  ){
    return;
  }

  matchEnded = true;
  matchStarted = false;

  state = STATES.RESULT;

  finalReason =
    safeString(
      payload.reason,
      "本局已結束",
      60
    );

  if(
    Number.isFinite(
      Number(payload.prizePool)
    )
  ){
    prizePool =
      intClamp(
        Number(payload.prizePool),
        0,
        1000000
      );
  }

  const snapshot =
    Array.isArray(payload.scores)
      ? payload.scores
      : [];

  for(const row of snapshot){

    if(row.id == null){
      continue;
    }

    const rowId =
      String(row.id);

    let p =
      players.get(rowId);

    if(!p){

      p =
        addPlayer(
          rowId,
          row.username || "玩家",
          ""
        );
    }

    if(p){

      p.score =
        intClamp(
          row.score,
          0,
          100000
        );

      p.reward =
        intClamp(
          row.reward,
          0,
          prizePool
        );
    }
  }

  const meRow =
    snapshot.find(
      x =>
        String(x.id) ===
        String(ME.id)
    );

  finalReward =
    intClamp(
      meRow
        ? meRow.reward
        : 0,
      0,
      prizePool
    );

  const ranking =
    snapshot
      .slice()
      .sort((a,b)=>
        finite(b.score,0) -
        finite(a.score,0)
      );

  const rankIndex =
    ranking.findIndex(
      x =>
        String(x.id) ===
        String(ME.id)
    );

  finalRank =
    rankIndex >= 0
      ? rankIndex + 1
      : 1;

  callGameOver(
    finalReward
  );

  render();
}

/* =========================================================
   GAME OVER
   ========================================================= */

function callGameOver(reward){

  if(gameOverCalled){
    return;
  }

  gameOverCalled = true;

  /*
   * 這裡保留給你的平台 SDK。
   *
   * 如果 BoomRoom SDK 有 gameOver，
   * 就呼叫它。
   */
  try{

    if(
      window.BoomRoomSDK &&
      typeof window.BoomRoomSDK.gameOver ===
        "function"
    ){

      window.BoomRoomSDK.gameOver({
        reward: intClamp(
          reward,
          0,
          prizePool
        )
      });
    }

  }catch(_){}
}

/* =========================================================
   房間事件
   ========================================================= */

function handleEvent(
  userId,
  eventName,
  payload
){

  const knownUser =
    players.get(userId);

  if(knownUser){
    knownUser.lastSeen =
      Date.now();
  }

  if(eventName === "PLAYER_HELLO"){

    addPlayer(
      userId,
      payload.username,
      payload.avatar,
      "READY"
    );

    render();

    return;
  }

  if(eventName === "PLAYER_HEARTBEAT"){

    const p =
      players.get(userId);

    if(p){
      p.lastSeen =
        Date.now();

      if(payload.status){
        p.status =
          safeString(
            payload.status,
            p.status,
            30
          );
      }
    }

    return;
  }

  if(eventName === "ROUND_START"){

    /*
     * 避免重複處理同一局。
     */
    if(
      payload.roundId &&
      payload.roundId === roundId &&
      matchStarted
    ){
      return;
    }

    applyRoundStart(payload);

    return;
  }

  if(eventName === "TURN_START"){

    applyTurnStart(payload);

    return;
  }

  if(eventName === "TURN_END"){

    applyTurnEnd(payload);

    return;
  }

  if(eventName === "ROUND_END"){

    applyRoundEnd(payload);

    return;
  }

  if(eventName === "GAME_EVENT"){

    if(
      !payload ||
      typeof payload !== "object"
    ){
      return;
    }

    /* =========================
       題型
       ========================= */

    if(payload.type === "SELECT_CAT"){

      selectedCategory =
        safeString(
          payload.categoryId,
          selectedCategory,
          30
        );

      showToast(
        (players.get(userId)?.username ||
          "玩家") +
        " 選了 " +
        getCategory(
          selectedCategory
        ).name
      );

      render();

      return;
    }

    /* =========================
       輪數
       ========================= */

    if(payload.type === "SELECT_RND"){

      selectedRounds =
        intClamp(
          Number(payload.rounds),
          1,
          5
        );

      showToast(
        (players.get(userId)?.username ||
          "玩家") +
        " 選了 " +
        selectedRounds +
        " 輪"
      );

      render();

      return;
    }

    /* =========================
       秒數
       ========================= */

    if(payload.type === "SELECT_SEC"){

      selectedTurnSeconds =
        intClamp(
          Number(payload.turnSeconds),
          15,
          60
        );

      activeTurnSeconds =
        selectedTurnSeconds;

      showToast(
        (players.get(userId)?.username ||
          "玩家") +
        " 選了 " +
        selectedTurnSeconds +
        " 秒"
      );

      render();

      return;
    }

    /* =========================
       猜答案
       ========================= */

    if(payload.type === "GUESS"){

      if(DEV || sdkIsHost){

        processGuessAsHost(
          payload
        );
      }

      return;
    }

    /* =========================
       跳過
       ========================= */

    if(
      payload.type === "SKIP_TURN" &&
      Number(payload.turnIndex) ===
        currentTurnIndex
    ){

      if(DEV || sdkIsHost){

        resolveTurnAsHost(
          "SKIP",
          payload.userId
        );
      }

      return;
    }

    /* =========================
       畫線
       ========================= */

    if(payload.type === "STROKE"){

      if(!isDrawer()){

        receiveStroke(
          payload.stroke
        );
      }

      return;
    }

    /* =========================
       清除
       ========================= */

    if(
      payload.type === "CLEAR_CANVAS" &&
      !isDrawer()
    ){

      knownStrokes = [];

      redrawCanvas();

      return;
    }

    /* =========================
       復原
       ========================= */

    if(
      payload.type === "UNDO_STROKE" &&
      !isDrawer()
    ){

      removeKnownStroke(
        payload.strokeId
      );

      redrawCanvas();

      return;
    }
  }
}

/* =========================================================
   玩家 UI
   ========================================================= */

function renderPlayers(){

  const arr =
    [...players.values()]
      .sort((a,b)=>
        (
          finite(a.joinedAt,0) -
          finite(b.joinedAt,0)
        ) ||
        a.id.localeCompare(b.id)
      )
      .slice(0,10);

  if(!arr.length){

    return `
      <div class="player">
        <b>尚無玩家</b>
        <em>等待房間玩家</em>
      </div>
    `;
  }

  return arr.map(p=>{

    const you =
      p.id === ME.id;

    const turn =
      p.id === currentDrawerId;

    const role =
      turn ? " 🎨" : "";

    return `
      <div class="player
        ${you ? "me " : ""}
        ${turn ? "drawer" : ""}">

        <b>
          ${esc(p.username)}
          ${role}
          ${you ? " · 你" : ""}
        </b>

        <em>
          ${
            matchStarted &&
            participants.has(p.id)
              ? intClamp(
                  p.score,
                  0,
                  100000
                ) + " 分"
              : "參賽中"
          }
        </em>
      </div>
    `;

  }).join("") +
  (
    players.size > 10
      ? `
        <div class="player">
          <b>+${players.size - 10}</b>

/* =========================================================
   Render
   ========================================================= */

function render(){

  try{

    const main =
      document.getElementById(
        "main"
      );

    if(!main){
      return;
    }

    if(
      state === STATES.LOBBY
    ){

      renderLobby(main);

      return;
    }

    if(
      state === STATES.COUNTDOWN ||
      state === STATES.PLAYING
    ){

      renderGame(main);

      return;
    }

    renderResult(main);

  }catch(err){

    console.error(
      "Render error:",
      err
    );

    const main =
      document.getElementById(
        "main"
      );

    if(main){

      main.innerHTML = `
        <div
          class="panel"
          style="
            color:#ff637a;
            padding:20px;
          "
        >
          <h3>
            渲染發生錯誤
          </h3>

          <pre>
${esc(
  err.stack ||
  String(err)
)}
          </pre>
        </div>
      `;
    }
  }
}

/* =========================================================
   Canvas
   ========================================================= */

function ensureCanvas(){

  canvas =
    document.getElementById(
      "drawCanvas"
    );

  if(!canvas){
    return false;
  }

  ctx =
    canvas.getContext(
      "2d",
      {
        alpha:false,
        desynchronized:true
      }
    );

  if(!resizeBound){

    window.addEventListener(
      "resize",
      resizeCanvas,
      {
        passive:true
      }
    );

    resizeBound = true;
  }

  resizeCanvas();

  attachCanvasEvents();

  return true;
}

function resizeCanvas(){

  if(!canvas || !ctx){
    return;
  }

  const r =
    canvas.getBoundingClientRect();

  const w =
    r.width > 10
      ? r.width
      : 340;

  const h =
    r.height > 10
      ? r.height
      : 260;

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    Math.max(
      1,
      Math.floor(w * dpr)
    );

  canvas.height =
    Math.max(
      1,
      Math.floor(h * dpr)
    );

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    1,
    1
  );

  ctx.fillStyle =
    "#f7f8fb";

  ctx.fillRect(
    0,
    0,
    w,
    h
  );

  redrawCanvas();
}

function redrawCanvas(){

  if(!canvas || !ctx){
    return;
  }

  const r =
    canvas.getBoundingClientRect();

  ctx.fillStyle =
    "#f7f8fb";

  ctx.fillRect(
    0,
    0,
    r.width,
    r.height
  );

  for(
    const s of knownStrokes
  ){
    drawStroke(s);
  }
}

function pointFromEvent(e){

  const r =
    canvas.getBoundingClientRect();

  return {

    x: clamp(
      (e.clientX - r.left) /
      Math.max(1,r.width),
      0,
      1
    ),

    y: clamp(
      (e.clientY - r.top) /
      Math.max(1,r.height),
      0,
      1
    )
  };
}

function drawStroke(stroke){

  if(
    !stroke ||
    !Array.isArray(
      stroke.points
    ) ||
    stroke.points.length < 1 ||
    !ctx ||
    !canvas
  ){
    return;
  }

  const r =
    canvas.getBoundingClientRect();

  const color =
    safeString(
      stroke.color,
      "#151923",
      20
    );

  const size =
    clamp(
      stroke.size,
      2,
      30
    );

  ctx.strokeStyle =
    color;

  ctx.lineWidth =
    size;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";

  for(
    let i=1;
    i<stroke.points.length;
    i++
  ){

    const a =
      stroke.points[i-1];

    const b =
      stroke.points[i];

    ctx.beginPath();

    ctx.moveTo(
      a.x * r.width + 1,
      a.y * r.height + 1
    );

    ctx.lineTo(
      b.x * r.width + 1,
      b.y * r.height + 1
    );

    ctx.stroke();
  }

  if(
    stroke.points.length === 1
  ){

    const a =
      stroke.points[0];

    ctx.beginPath();

    ctx.arc(
      a.x * r.width + 1,
      a.y * r.height + 1,
      size / 2,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      color;

    ctx.fill();
  }
}

/* =========================================================
   Canvas 畫畫
   ========================================================= */

function beginStroke(e){

  if(
    !isDrawer() ||
    state !== STATES.PLAYING ||
    matchEnded ||
    currentTurnResolved
  ){
    return;
  }

  e.preventDefault();

  ensureAudio();

  const p =
    pointFromEvent(e);

  const color =
    tool === "eraser"
      ? "#f7f8fb"
      : brushColor;

  currentStroke = {

    id:
      ME.id +
      "_" +
      Date.now().toString(36) +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,6),

    color,

    size:
      brushSize,

    points:[
      p
    ]
  };

  try{

    canvas.setPointerCapture(
      e.pointerId
    );

  }catch(_){}
}

function moveStroke(e){

  if(
    !currentStroke ||
    !canvas
  ){
    return;
  }

  e.preventDefault();

  const p =
    pointFromEvent(e);

  const last =
    currentStroke.points[
      currentStroke.points.length - 1
    ];

  const r =
    canvas.getBoundingClientRect();

  const dx =
    (p.x - last.x) *
    r.width;

  const dy =
    (p.y - last.y) *
    r.height;

  if(
    Math.hypot(dx,dy) < 1.4
  ){
    return;
  }

  if(
    currentStroke.points.length <
    CONFIG.MAX_POINTS_PER_STROKE
  ){

    currentStroke.points.push(p);

    drawStroke({

      color:
        currentStroke.color,

      size:
        currentStroke.size,

      points:[
        last,
        p
      ]
    });
  }
}

function endStroke(e){

  if(!currentStroke){
    return;
  }

  if(e?.preventDefault){
    e.preventDefault();
  }

  const stroke = {

    id:
      currentStroke.id,

    color:
      currentStroke.color,

    size:
      currentStroke.size,

    points:
      currentStroke.points.slice(
        0,
        CONFIG.MAX_POINTS_PER_STROKE
      )
  };

  knownStrokes.push(
    stroke
  );

  localStrokeIds.push(
    stroke.id
  );

  if(
    knownStrokes.length >
    CONFIG.MAX_STROKES
  ){
    knownStrokes.shift();
  }

  sendEvent(
    "GAME_EVENT",
    {
      roundId,
      type: "STROKE",
      stroke,
      turnIndex:
        currentTurnIndex
    }
  );

  currentStroke = null;
}

function attachCanvasEvents(){

  if(
    !canvas ||
    canvas.dataset.bound === "1"
  ){
    return;
  }

  canvas.dataset.bound = "1";

  canvas.addEventListener(
    "pointerdown",
    beginStroke,
    {passive:false}
  );

  canvas.addEventListener(
    "pointermove",
    moveStroke,
    {passive:false}
  );

  canvas.addEventListener(
    "pointerup",
    endStroke,
    {passive:false}
  );

  canvas.addEventListener(
    "pointercancel",
    endStroke,
    {passive:false}
  );

  canvas.addEventListener(
    "dragstart",
    e=>e.preventDefault()
  );

  document.body.addEventListener(
    "dragstart",
    e=>e.preventDefault()
  );
}

function receiveStroke(stroke){

  if(
    !stroke ||
    !Array.isArray(
      stroke.points
    ) ||
    stroke.points.length >
      CONFIG.MAX_POINTS_PER_STROKE
  ){
    return;
  }

  if(
    stroke.id &&
    knownStrokes.some(
      s => s.id === stroke.id
    )
  ){
    return;
  }

  const clean = {

    id:
      safeString(
        stroke.id,
        "remote",
        100
      ),

    color:
      safeString(
        stroke.color,
        "#151923",
        20
      ),

    size:
      clamp(
        stroke.size,
        2,
        30
      ),

    points:
      stroke.points
        .slice(
          0,
          CONFIG.MAX_POINTS_PER_STROKE
        )
        .map(p=>({
          x: clamp(
            p.x,
            0,
            1
          ),

          y: clamp(
            p.y,
            0,
            1
          )
        }))
  };

  knownStrokes.push(
    clean
  );

  if(
    knownStrokes.length >
    CONFIG.MAX_STROKES
  ){
    knownStrokes.shift();
  }

  drawStroke(clean);
}

function removeKnownStroke(id){

  if(typeof id !== "string"){
    return;
  }

  knownStrokes =
    knownStrokes.filter(
      s => s.id !== id
    );
}

function undoLastStroke(){

  if(
    !isDrawer() ||
    !localStrokeIds.length ||
    matchEnded
  ){
    return;
  }

  const id =
    localStrokeIds.pop();

  removeKnownStroke(id);

  redrawCanvas();

  sendEvent(
    "GAME_EVENT",
    {
      roundId,
      type: "UNDO_STROKE",
      strokeId: id,
      turnIndex:
        currentTurnIndex
    }
  );

  playTone(
    400,
    .05
  );
}

function clearAllCanvas(){

  if(
    !isDrawer() ||
    matchEnded
  ){
    return;
  }

  knownStrokes = [];
  localStrokeIds = [];

  redrawCanvas();

  sendEvent(
    "GAME_EVENT",
    {
      roundId,
      type: "CLEAR_CANVAS",
      turnIndex:
        currentTurnIndex
    }
  );

  playTone(
    350,
    .05
  );
}

function syncTools(){

  document
    .querySelectorAll(
      "[data-tool]"
    )
    .forEach(b=>{

      b.classList.toggle(
        "active",
        b.dataset.tool === tool
      );
    });

  document
    .querySelectorAll(
      "[data-size]"
    )
    .forEach(b=>{

      b.classList.toggle(
        "active",
        Number(
          b.dataset.size
        ) === brushSize
      );
    });
}

/* =========================================================
   音效
   ========================================================= */

function ensureAudio(){

  if(muted){
    return;
  }

  try{

    if(!audioCtx){

      audioCtx =
        new(
          window.AudioContext ||
          window.webkitAudioContext
        )();
    }

    if(
      audioCtx.state ===
      "suspended"
    ){

      audioCtx.resume();
    }

  }catch(_){}
}

function playTone(
  freq,
  duration=.08
){

  if(muted){
    return;
  }

  const now =
    performance.now();

  if(
    now - soundCooldown < 35
  ){
    return;
  }

  soundCooldown = now;

  ensureAudio();

  if(!audioCtx){
    return;
  }

  try{

    const o =
      audioCtx.createOscillator();

    const g =
      audioCtx.createGain();

    o.type =
      "sine";

    o.frequency.value =
      clamp(
        freq,
        120,
        1700
      );

    g.gain.value =
      .28;

    o.connect(g);

    g.connect(
      audioCtx.destination
    );

    o.start();

    g.gain.exponentialRampToValueAtTime(
      .0001,
      audioCtx.currentTime +
      duration
    );

    o.stop(
      audioCtx.currentTime +
      duration
    );

  }catch(_){}
}

function vibrate(ms){

  try{

    if(
      navigator.vibrate
    ){
      navigator.vibrate(ms);
    }

  }catch(_){}
}

/* =========================================================
   Toast
   ========================================================= */

function showToast(t){

  const el =
    document.getElementById(
      "toast"
    );

  if(!el){
    return;
  }

  el.textContent =
    safeString(
      t,
      "",
      100
    );

  el.classList.add(
    "show"
  );

  clearTimeout(
    showToast.t
  );

  showToast.t =
    setTimeout(
      ()=>{
        el.classList.remove(
          "show"
        );
      },
      1200
    );
}

/* =========================================================
   遊戲 Loop
   ========================================================= */

function gameLoop(ts){

  if(!rafRunning){
    return;
  }

  const dt =
    Math.min(
      Math.max(
        (ts - lastFrame) / 1000,
        0
      ),
      .033
    );

  lastFrame = ts;

  fps =
    .9 * fps +
    .1 *
    (
      1 /
      Math.max(
        dt,
        .001
      )
    );

  if(
    state === STATES.PLAYING &&
    !matchEnded
  ){

    const now =
      Date.now();

    /*
     * ★ 時間到。
     *
     * 只有房主負責結算，
     * 避免多人同時送 TURN_END。
     */
    if(
      now >=
        currentTurnStartedAt +
        activeTurnSeconds * 1000
    ){

      if(
        (DEV || sdkIsHost) &&
        !currentTurnResolved
      ){

        resolveTurnAsHost(
          "TIMEOUT",
          ""
        );
      }
    }

    const timer =
      document.getElementById(
        "gameTimer"
      );

    if(timer){

      timer.textContent =
        String(
          Math.max(
            0,
            Math.ceil(
              (
                currentTurnStartedAt +
                activeTurnSeconds * 1000 -
                now
              ) / 1000
            )
          )
        );
    }
  }

  loopHandle =
    requestAnimationFrame(
      gameLoop
    );
}

/* =========================================================
   心跳
   ========================================================= */

function heartbeat(){

  if(!ME.id){
    return;
  }

  sendEvent(
    "PLAYER_HEARTBEAT",
    {
      roundId:
        roundId || "LOBBY",

      userId:
        ME.id,

      status:
        state,

      timestamp:
        Date.now()
    }
  );

  const now =
    Date.now();

  for(
    const [id,p] of players
  ){

    if(
      id !== ME.id &&
      now - p.lastSeen >
        CONFIG.PLAYER_TIMEOUT_MS
    ){

      p.status =
        "TIMEOUT";
    }
  }
}

/* =========================================================
   Page
   ========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{
    if(document.hidden){

      hiddenAt =
        Date.now();

    }else{

      if(
        state === STATES.PLAYING &&
        hiddenAt &&
        Date.now() -
          hiddenAt >
          2500
      ){

        hiddenAt = 0;
      }
    }
  }
);

window.addEventListener(
  "pagehide",
  ()=>{

    clearTimeout(
      turnStateTimer
    );

    clearInterval(
      lobbyTimer
    );

    clearInterval(
      heartbeatTimer
    );

    cancelAnimationFrame(
      loopHandle
    );

    rafRunning = false;
  }
);

/* =========================================================
   Boot
   ========================================================= */

function boot(){

  const main =
    document.getElementById(
      "main"
    );

  if(!main){

    setTimeout(
      boot,
      50
    );

    return;
  }

  render();

  lastFrame =
    performance.now();

  loopHandle =
    requestAnimationFrame(
      gameLoop
    );

  heartbeatTimer =
    setInterval(
      heartbeat,
      CONFIG.HEARTBEAT_MS
    );
}

boot();

</script>
