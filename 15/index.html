  /* =========================================================
     EVENT HANDLER
  ========================================================= */

  function handleEvent(userId,eventName,payload){
    const uid=safeString(userId,"",64);
    if(!uid||!payload||typeof payload!=="object") return;
    const declaredSender=safeString(payload.senderId,"",64);
    if(declaredSender && declaredSender!==uid) return;

    const incomingEventId=safeString(payload.eventId,"",100);
    if(incomingEventId){
      if(seenEvents.has(incomingEventId)) return;
      seenEvents.add(incomingEventId);
      if(seenEvents.size>1000){
        const first=seenEvents.values().next().value;
        if(first) seenEvents.delete(first);
      }
    }

    const knownUser=players.get(uid);
    if(knownUser){ knownUser.lastSeen=nowMs(); }

    if(eventName==="PLAYER_HELLO"){
      const p=addPlayer(uid,payload.username,payload.avatar,"READY");
      if(p){
        if(payload.joinedAt!=null) p.joinedAt=finite(payload.joinedAt,p.joinedAt);
        p.lastSeen=nowMs();
      }
      if(payload.isHost===true){
        currentHostId=uid;
        currentHostLastSeen=nowMs();
      }
      if(!matchStarted){
        if(CATEGORIES.some(c=>c.id===payload.categoryVote)) categoryVotes.set(uid,payload.categoryVote);
        if(ROUND_OPTIONS.includes(Number(payload.roundsVote))) roundsVotes.set(uid,Number(payload.roundsVote));
        if(TURN_OPTIONS.includes(Number(payload.turnSecondsVote))) secondsVotes.set(uid,Number(payload.turnSecondsVote));
      }
      refreshPlayersOnly();
      if(!matchStarted && isLobbyAuthority()){
        if(!lobbyDeadlineAt) lobbyDeadlineAt=gameNow()+CONFIG.LOBBY_COUNTDOWN_SECONDS*1000;
        setTimeout(()=>broadcastLobbyState("player_join",true),40);
      }
      if(matchStarted && isLocalAuthority()) setTimeout(()=>broadcastStateSnapshot('player_join'),80);
      return;
    }

    if(eventName==="PLAYER_HEARTBEAT"){
      const p=players.get(uid)||addPlayer(uid,payload.username||"玩家",payload.avatar||"","READY");
      if(p){
        if(payload.joinedAt!=null) p.joinedAt=finite(payload.joinedAt,p.joinedAt);
        p.lastSeen=nowMs();
        if(payload.status) p.status=safeString(payload.status,p.status,30);
      }
      if(String(uid)===String(currentHostId)) currentHostLastSeen=nowMs();
      refreshPlayersOnly();
      return;
    }

    if(eventName==="PLAYER_LEAVE"||eventName==="PLAYER_LEFT"){
      const p=players.get(uid);
      if(p){ p.status="LEFT"; p.lastSeen=nowMs(); }
      if(String(uid)===String(currentHostId)){
        currentHostId="";
        currentHostLastSeen=0;
        ensureHostAuthority(true);
      }
      refreshPlayersOnly();
      if(matchStarted && isLocalAuthority()) setTimeout(()=>broadcastStateSnapshot('player_leave'),80);
      return;
    }

    if(eventName==="HOST_HEARTBEAT"){
      const claimed=safeString(payload.hostId,uid,64);
      if(claimed===uid && (uid===String(currentHostId)||!currentHostId||uid===electedHostId())){
        const changed=String(currentHostId)!==uid;
        currentHostId=uid;
        currentHostLastSeen=nowMs();
        hostElectionAt=0;
        if(changed) refreshPlayersOnly();
      }
      return;
    }

    if(eventName==="HOST_CLAIM"){
      const claimed=safeString(payload.hostId,uid,64);
      const elected=electedHostId();
      const currentAlive=isLiveHost(currentHostId);
      if(claimed===uid && (claimed===elected||!currentHostId||!currentAlive)){
        const changed=String(currentHostId)!==claimed;
        currentHostId=claimed;
        currentHostLastSeen=nowMs();
        hostElectionAt=0;
        if(changed) refreshPlayersOnly();
        if(claimed===ME.id && matchStarted){
          setTimeout(()=>{ if(isLocalAuthority()){ broadcastStateSnapshot('host_claim'); recoverHostFlow(); } },120);
        }
      }
      return;
    }

    if(eventName==="ROUND_START"||eventName==="TURN_START"||eventName==="TURN_END"||eventName==="ROUND_END"){
      if(!eventIsFromCurrentHost(uid)) return;
      if(eventName==="ROUND_START"){ applyRoundStart(payload); return; }
      if(eventName==="TURN_START"){ applyTurnStart(payload); return; }
      if(eventName==="TURN_END"){ applyTurnEnd(payload); return; }
      applyRoundEnd(payload);
      return;
    }

    if(eventName!=="GAME_EVENT") return;

    const sender=uid;
    const type=safeString(payload.type,"",40);

    if(type==="LOBBY_SYNC"){
      const claimedHost=safeString(payload.hostId,sender,64);
      if(claimedHost!==sender) return;
      if(currentHostId && String(currentHostId)!==sender && isLiveHost(currentHostId)) return;
      if(matchStarted) return;
      const incomingLobbyVersion=Number(payload.lobbyVersion)||0;
      if(incomingLobbyVersion>0 && incomingLobbyVersion<appliedLobbySyncVersion) return;
      if(incomingLobbyVersion>0){ appliedLobbySyncVersion=incomingLobbyVersion; }

      currentHostId=sender;
      currentHostLastSeen=nowMs();
      lobbyResolved=false;
      lobbyDeadlineAt=finite(payload.deadlineAt,0);
      syncClock(payload.hostNow);

      // 以房主的完整名單為準，清掉已離房玩家，避免他們的舊票數繼續顯示。
      const incomingIds=new Set();
      if(Array.isArray(payload.players)){
        payload.players.forEach(row=>{
          if(row?.id==null) return;
          const pid=String(row.id);
          incomingIds.add(pid);
          const p=addPlayer(pid,row.username||"玩家",row.avatar||"",row.status||"READY");
          if(p){
            if(row.joinedAt!=null) p.joinedAt=finite(row.joinedAt,p.joinedAt);
            p.status=safeString(row.status,p.status||"READY",30);
            p.lastSeen=nowMs();
          }
        });
        for(const [pid,p] of players){
          if(pid!==String(ME.id) && !incomingIds.has(pid)){
            p.status="LEFT";
            p.lastSeen=nowMs();
          }
        }
      }

      const votes=payload.votes||{};
      // 房主快照是完整權威狀態：先清除再重建，避免本機殘留票數。
      categoryVotes.clear();
      roundsVotes.clear();
      secondsVotes.clear();
      if(Array.isArray(votes.category)) votes.category.forEach(pair=>{
        if(Array.isArray(pair)&&pair.length>=2&&CATEGORIES.some(c=>c.id===pair[1])) categoryVotes.set(String(pair[0]),String(pair[1]));
      });
      if(Array.isArray(votes.rounds)) votes.rounds.forEach(pair=>{
        if(Array.isArray(pair)&&pair.length>=2&&ROUND_OPTIONS.includes(Number(pair[1]))) roundsVotes.set(String(pair[0]),Number(pair[1]));
      });
      if(Array.isArray(votes.seconds)) votes.seconds.forEach(pair=>{
        if(Array.isArray(pair)&&pair.length>=2&&TURN_OPTIONS.includes(Number(pair[1]))) secondsVotes.set(String(pair[0]),Number(pair[1]));
      });

      selectedCategory=categoryVotes.get(String(ME.id))||selectedCategory;
      selectedRounds=normalizeRounds(roundsVotes.get(String(ME.id))||selectedRounds);
      selectedTurnSeconds=normalizeTurnSeconds(secondsVotes.get(String(ME.id))||selectedTurnSeconds);
      refreshPlayersOnly();
      render();
      startLobbyAutoCountdown();
      return;
    }

    if(type==="SELECT_CAT"){
      const actor=safeString(payload.voterId, payload.userId || sender, 64);
      const value=safeString(payload.categoryId, "", 30);
      if(CATEGORIES.some(c=>c.id===value)) {
        categoryVotes.set(String(actor), value);
        categoryVotes.set(String(sender), value);
      }
      render();
      if(!matchStarted && isLobbyAuthority()) broadcastLobbyState("vote_category", true);
      return;
    }

    if(type==="SELECT_RND"){
      const actor=safeString(payload.voterId, payload.userId || sender, 64);
      const value=normalizeRounds(payload.rounds);
      if(ROUND_OPTIONS.includes(value)) {
        roundsVotes.set(String(actor), value);
        roundsVotes.set(String(sender), value);
      }
      render();
      if(!matchStarted && isLobbyAuthority()) broadcastLobbyState("vote_rounds", true);
      return;
    }

    if(type==="SELECT_SEC"){
      const actor=safeString(payload.voterId, payload.userId || sender, 64);
      const value=normalizeTurnSeconds(payload.turnSeconds);
      if(TURN_OPTIONS.includes(value)) {
        secondsVotes.set(String(actor), value);
        secondsVotes.set(String(sender), value);
      }
      render();
      if(!matchStarted && isLobbyAuthority()) broadcastLobbyState("vote_seconds", true);
      return;
    }

    if(type==="GUESS"){
      if(safeString(payload.userId,"",64)!==sender) return;
      if(isLocalAuthority()) processGuessAsHost({...payload,userId:sender});
      return;
    }

    if(type==="GUESS_RESULT"){
      if(!eventIsFromCurrentHost(sender)) return;
      applyGuessResult(payload);
      return;
    }

    if(type==="GUESS_CORRECT"){
      if(!eventIsFromCurrentHost(sender)) return;
      applyGuessCorrect(payload);
      return;
    }

    if(type==="REVEAL_CHAR"){
      if(!eventIsFromCurrentHost(sender)) return;
      applyRevealChar(payload,false);
      return;
    }

    if(type==="STATE_REQUEST"){
      if(!matchStarted || !players.has(sender)) return;
      if(isLocalAuthority()) broadcastStateSnapshot('request');
      return;
    }

    if(type==="STATE_SNAPSHOT"){
      if(!eventIsFromCurrentHost(sender)) return;
      applyStateSnapshot(payload,sender);
      return;
    }

    if(type==="SKIP_TURN"){
      if(safeString(payload.userId,"",64)!==sender) return;
      if(sender!==String(currentDrawerId)||payload.turnIndex!==currentTurnIndex) return;
      if(isLocalAuthority()) resolveTurnAsHost("SKIP",sender);
      return;
    }

    if(type==="STROKE_CHUNK"){
      if(sender!==String(currentDrawerId)||payload.turnIndex!==currentTurnIndex||sender===String(ME.id)) return;
      receiveStrokeChunk(payload);
      return;
    }

    if(type==="STROKE"){
      if(sender!==String(currentDrawerId)||payload.turnIndex!==currentTurnIndex||sender===String(ME.id)) return;
      receiveStroke(payload.stroke);
      return;
    }

    if(type==="CLEAR_CANVAS"){
      if(sender!==String(currentDrawerId)||payload.turnIndex!==currentTurnIndex) return;
      if(!isDrawer()){ knownStrokes=[]; remoteStrokeBuffers.clear(); redrawCanvas(); }
      return;
    }

    if(type==="UNDO_STROKE"){
      if(sender!==String(currentDrawerId)||payload.turnIndex!==currentTurnIndex) return;
      if(!isDrawer()){ remoteStrokeBuffers.delete(String(payload.strokeId||"")); removeKnownStroke(payload.strokeId); redrawCanvas(); }
      return;
    }
  }

  /* =========================================================
     STATE SNAPSHOT / RECOVERY
  ========================================================= */

  function recoverHostFlow(){
    if(!isLocalAuthority()||!matchStarted||matchEnded) return;
    clearTimeout(turnStateTimer);
    if(state===STATES.PLAYING){
      if(currentTurnResolved){
        turnStateTimer=setTimeout(()=>{
          if(!matchEnded&&isLocalAuthority()) startNextTurnAsHost();
        },300);
        return;
      }
      if(currentTurnStartedAt>0){
        const remain=currentTurnStartedAt+activeTurnSeconds*1000-gameNow();
        if(remain<=0) resolveTurnAsHost('TIMEOUT','');
      }
    }else if(state===STATES.COUNTDOWN && currentTurnIndex<0){
      startCountdown();
    }
  }

  function buildStateSnapshot(reason){
    const strokes=[];
    let totalPoints=0;
    for(let i=Math.max(0,knownStrokes.length-CONFIG.MAX_SNAPSHOT_STROKES);i<knownStrokes.length;i++){
      const src=knownStrokes[i];
      if(!src||!Array.isArray(src.points)||!src.points.length) continue;
      const points=src.points.slice(0,CONFIG.MAX_POINTS_PER_STROKE);
      if(totalPoints+points.length>CONFIG.MAX_SNAPSHOT_POINTS){
        const remain=CONFIG.MAX_SNAPSHOT_POINTS-totalPoints;
        if(remain<=0) break;
        points.splice(remain);
      }
      strokes.push({id:safeString(src.id,'stroke',100),color:safeString(src.color,'#151923',20),size:clamp(src.size,2,30),tool:safeString(src.tool,'pen',20),points:points.map(p=>({x:clamp(p.x,0,1),y:clamp(p.y,0,1)}))});
      totalPoints+=points.length;
      if(totalPoints>=CONFIG.MAX_SNAPSHOT_POINTS) break;
    }
    return {
      roundId:roundId||'LOBBY',
      stateVersion,
      snapshotAt:gameNow(),
      reason,
      state,
      matchStarted,
      matchEnded,
      seed:roundSeed,
      category:selectedCategory,
      rounds:totalTurnsPerPlayer,
      turnSeconds:activeTurnSeconds,
      participantIds:[...participants],
      turnOrder:[...turnOrder],
      currentTurnIndex,
      currentDrawerId,
      currentTurnStartedAt,
      currentTurnResolved,
      requiredCorrectCount:currentRequiredCorrectCount,
      correctGuessers:correctGuessers.map(x=>({id:x.id,rank:x.rank,gain:x.gain})),
      revealedCharacters:[...revealedCharacters.entries()].map(([index,char])=>({index,char})),
      wordLength:currentWordLength,
      canvasStrokes:strokes,
      scores:[...players.values()].slice(0,CONFIG.MAX_SNAPSHOT_PLAYERS).map(p=>({
        id:p.id,username:p.username,score:intClamp(p.score,0,100000),
        correct:intClamp(p.correct||0,0,1000),skips:intClamp(p.skips||0,0,1000),
        drawTurns:intClamp(p.drawTurns||0,0,1000),status:p.status,joinedAt:finite(p.joinedAt,0)
      }))
    };
  }

  function broadcastStateSnapshot(reason='sync'){
    if(!matchStarted||!isLocalAuthority()) return;
    const now=nowMs();
    if(now-lastSnapshotSentAt<CONFIG.STATE_SYNC_MIN_INTERVAL_MS) return;
    lastSnapshotSentAt=now;
    sendEvent('GAME_EVENT',{roundId:roundId||'LOBBY',type:'STATE_SNAPSHOT',...buildStateSnapshot(reason),requestId:ME.id+'_'+now},{bypassAuthority:true});
  }

  function requestStateSnapshot(){
    if(!matchStarted) return;
    sendEvent('GAME_EVENT',{roundId:roundId||'LOBBY',type:'STATE_REQUEST',requesterId:ME.id,at:gameNow()},{bypassAuthority:true});
  }

  function applyStateSnapshot(payload,sender){
    if(!payload||!payload.roundId) return;
    if(roundId&&payload.roundId!==roundId) return;
    // 畫家拖曳期間延後快照，避免快照清空目前畫布。
    if(state===STATES.PLAYING && isDrawer() && (currentStroke || drawingPointerId!==null)){
      pendingStateSnapshot={payload,sender};
      pendingRender=true;
      return;
    }
    const incoming=Number(payload.stateVersion)||0;
    if(incoming<stateVersion) return;
    if(incoming===stateVersion&&nowMs()-lastSnapshotAppliedAt<800) return;
    lastSnapshotAppliedAt=nowMs();

    acceptStateVersion(incoming);
    syncClock(payload.snapshotAt);
    roundId=safeString(payload.roundId,roundId,100);
    roundSeed=finite(payload.seed,roundSeed)>>>0;
    selectedCategory=safeString(payload.category,selectedCategory,30);
    selectedRounds=normalizeRounds(payload.rounds||selectedRounds);
    totalTurnsPerPlayer=selectedRounds;
    selectedTurnSeconds=normalizeTurnSeconds(payload.turnSeconds||selectedTurnSeconds);
    activeTurnSeconds=selectedTurnSeconds;

    if(Array.isArray(payload.participantIds)){
      participants.clear();
      payload.participantIds.filter(x=>typeof x==='string').forEach(x=>participants.add(x));
    }
    if(Array.isArray(payload.turnOrder)){
      turnOrder=payload.turnOrder.filter(x=>typeof x==='string');
      totalTurnCount=turnOrder.length;
    }

    currentTurnIndex=intClamp(payload.currentTurnIndex,-1,Math.max(-1,turnOrder.length));
    currentDrawerId=safeString(payload.currentDrawerId,'',64);
    currentTurnStartedAt=finite(payload.currentTurnStartedAt,0);
    currentTurnResolved=!!payload.currentTurnResolved;
    currentRequiredCorrectCount=intClamp(payload.requiredCorrectCount||getRequiredCorrectCount(),1,Math.max(1,CONFIG.GUESS_REWARDS.length));
    correctGuessers=Array.isArray(payload.correctGuessers)?payload.correctGuessers.map(x=>({id:String(x.id),rank:intClamp(x.rank,1,3),gain:intClamp(x.gain,0,100000)})).sort((a,b)=>a.rank-b.rank):[];

    revealedCharacters.clear();
    if(Array.isArray(payload.revealedCharacters)){
      payload.revealedCharacters.forEach(x=>{
        const idx=intClamp(x.index,0,63);
        const ch=String(x.char||'');
        if(ch&&Array.from(ch).length===1) revealedCharacters.set(idx,ch);
      });
    }
    revealedCharCount=revealedCharacters.size;
    revealStage=revealedCharCount;

    currentWord=(isDrawer()||isLocalAuthority())&&currentTurnIndex>=0?wordForTurn(selectedCategory,currentTurnIndex,roundSeed):null;
    currentWordLength=currentWord?getAnswerLength(currentWord):intClamp(payload.wordLength||currentWordLength,0,64);
    revealIndexes=currentWord?buildRevealIndexes(currentWord):[];

    knownStrokes=[];
    localStrokeIds=[];
    remoteStrokeBuffers.clear();
    if(Array.isArray(payload.canvasStrokes)){
      for(const st of payload.canvasStrokes.slice(-CONFIG.MAX_SNAPSHOT_STROKES)){
        if(!st||!Array.isArray(st.points)) continue;
        const safeTool=['pen','eraser','fill','line','rect','circle'].includes(st.tool)?st.tool:'pen';
        knownStrokes.push({
          id:safeString(st.id,'snapshot',100),
          color:safeString(st.color,'#151923',20),
          size:clamp(st.size,2,30),
          tool:safeTool,
          points:st.points.slice(0,CONFIG.MAX_POINTS_PER_STROKE).map(p=>({x:clamp(p?.x,0,1),y:clamp(p?.y,0,1)}))
        });
      }
    }

    if(Array.isArray(payload.scores)){
      payload.scores.forEach(row=>{
        if(row.id==null) return;
        const p=players.get(String(row.id))||addPlayer(String(row.id),row.username||'玩家','',row.status||'READY');
        if(!p) return;
        if(row.joinedAt!=null) p.joinedAt=finite(row.joinedAt,p.joinedAt);
        p.score=intClamp(row.score,0,100000);
        p.correct=intClamp(row.correct||0,0,1000);
        p.skips=intClamp(row.skips||0,0,1000);
        p.drawTurns=intClamp(row.drawTurns||0,0,1000);
        if(row.status) p.status=safeString(row.status,p.status,20);
        p.lastSeen=nowMs();
      });
    }

    matchStarted=!!payload.matchStarted;
    matchEnded=!!payload.matchEnded;
    if([STATES.LOBBY,STATES.COUNTDOWN,STATES.PLAYING,STATES.RESULT].includes(payload.state)) state=payload.state;
    refreshPlayersOnly();
    if(state===STATES.COUNTDOWN||state===STATES.PLAYING) render();
    else if(state===STATES.RESULT) renderResult(document.getElementById('main'));
    recoverHostFlow();
  }

  /* =========================================================
     PLAYER RENDER
  ========================================================= */

  function renderPlayers(){
    const arr=[...players.values()].filter(p=>p.status!=="LEFT" && p.status!=="TIMEOUT").sort((a,b)=>finite(a.joinedAt,0)-finite(b.joinedAt,0)||a.id.localeCompare(b.id)).slice(0,10);
    if(!arr.length){
      return `
        <div class="player">
          <b>尚無玩家</b>
          <em>等待房間玩家</em>
        </div>
      `;
    }
    return arr.map(p=>{
      const you=p.id===ME.id;
      const turn=p.id===currentDrawerId;
      const role=turn?" 🎨":"";
      return `
        <div class="player ${you?"me ":""}${turn?"drawer":""}">
          <b>${esc(p.username)}${role}${you?" · 你":""}</b>
          <em>${p.id===currentHostId?"👑 房主 · ":""}${matchStarted && participants.has(p.id) ? intClamp(p.score,0,100000)+" 分" : "參賽中"}</em>
        </div>
      `;
    }).join("")+(players.size>10 ? `<div class="player"><b>+${players.size-10}</b><em>更多玩家</em></div>` : "");

  /* =========================================================
     MAIN RENDER
  ========================================================= */

  function render(){
    try{
      const main=document.getElementById("main");
      if(!main){ return; }

      // 畫家拖曳中不要重建 canvas；DOM 重建會中斷 pointer，導致長按幾秒後畫筆消失。
      if(state===STATES.PLAYING && isDrawer() && (currentStroke || drawingPointerId!==null)){
        pendingRender=true;
        return;
      }

      if(state===STATES.LOBBY){ renderLobby(main); return; }
      if(state===STATES.COUNTDOWN || state===STATES.PLAYING){ renderGame(main); return; }
      renderResult(main);
    }catch(err){
      console.error("Render error:", err);
      const main=document.getElementById("main");
      if(main){
        main.innerHTML=`<div class="panel" style="color:#ff637a;padding:20px;"><h3>程式錯誤</h3><pre style="white-space:pre-wrap;user-select:text;color:#ffb5c0;">${esc(err.stack||String(err))}</pre></div>`;
      }
    }
  }

  function stopVoiceGuess(){
    clearTimeout(speechRestartTimer);
    speechRestartTimer=null;
    speechSessionId++;
    const wasListening=speechListening;
    speechListening=false;
    voiceEnabledForTurn=false;

    if(wasListening){
      postHostMessage({
        action:"stopVoiceRecognition",
        locale:CONFIG.VOICE_LOCALE,
        language:CONFIG.VOICE_LANGUAGE,
        languageCode:CONFIG.VOICE_LANGUAGE
      });
    }

    if(speechRecognition){
      try{ speechRecognition.onend=null; speechRecognition.stop(); }catch(_){}
      speechRecognition=null;
    }

    const btn=document.getElementById("voiceBtn");
    if(btn){
      btn.classList.remove("voice-active");
      btn.setAttribute("aria-label","開啟中文語音猜題");
      btn.title="中文語音猜題（繁體中文）";
    }
  }

  window.receiveVoiceText=function(text,isFinal){
    if(state!==STATES.PLAYING || isDrawer() || matchEnded) return;
    const cleanText=safeString(text,"",CONFIG.MAX_GUESS_LENGTH);
    if(!cleanText) return;

    const input=document.getElementById("guessInput");
    if(input) input.value=cleanText;
    speechFinalText=cleanText;

    // 語音中間結果只顯示，不送出；final 才提交，避免一個詞被重複計算。
    if(isFinal){
      submitGuess();
      showToast("🎙️ 已送出："+cleanText);
      // 一次按鍵只辨識並送出一句；結束後由 Flutter 還原玩家原本的房間麥克風狀態。
      stopVoiceGuess();
      // 正解由 Host 廣播 GUESS_CORRECT 統一判定，猜題端不保留完整答案。
    }
  };

  window.onFlutterSpeechStopped=function(){
    speechListening=false;
    speechMode="flutter";
    voiceEnabledForTurn=false;
    clearTimeout(speechRestartTimer);
    speechRestartTimer=null;
    const btn=document.getElementById("voiceBtn");
    if(btn) btn.classList.remove("voice-active");
  };

  function startVoiceGuess(){
    if(state!==STATES.PLAYING || isDrawer() || matchEnded || (Array.isArray(correctGuessers) && correctGuessers.some(x=>x.id===ME.id))){
      stopVoiceGuess();
      return;
    }

    if(speechListening){
      stopVoiceGuess();
      return;
    }
    voiceEnabledForTurn=true;
    speechListening=true;
    const session=++speechSessionId;

    const btn=document.getElementById("voiceBtn");
    if(btn){
      btn.classList.add("voice-active");
      btn.setAttribute("aria-label","正在聽取繁體中文");
      btn.title="正在聽取繁體中文…";
    }

    ensureAudio();
    requestFlutterVoiceConfig();

    // Flutter / BoomRoom：明確要求台灣繁中，避免 Android/iOS 自動選成英文。
    if(window.BoomRoomJS || window.parent!==window){
      speechMode="flutter";
      postHostMessage({
        action:"startVoiceRecognition",
        locale:CONFIG.VOICE_LOCALE,
        language:CONFIG.VOICE_LANGUAGE,
        languageCode:CONFIG.VOICE_LANGUAGE,
        locales:["zh-TW","zh-Hant-TW","zh_TW","cmn-Hant-TW"],
        preferredLanguage:"Traditional Chinese",
        continuous:true,
        interimResults:true,
        maxAlternatives:1,
        sessionId:session
      });
      return;
    }

    // 純瀏覽器 fallback。
    const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!Recognition){
      speechListening=false;
      voiceEnabledForTurn=false;
      if(btn) btn.classList.remove("voice-active");
      showToast("此瀏覽器不支援語音辨識，請用打字猜題");
      return;
    }

    speechMode="native";
    speechFinalText="";
    try{
      speechRecognition=new Recognition();
      speechRecognition.lang=CONFIG.VOICE_LOCALE;
      speechRecognition.continuous=true;
      speechRecognition.interimResults=true;
      speechRecognition.maxAlternatives=1;

      speechRecognition.onresult=(event)=>{
        if(session!==speechSessionId || !speechListening) return;
        let textValue="";
        let hasFinal=false;
        for(let i=event.resultIndex;i<event.results.length;i++){
          const transcript=event.results[i][0]?.transcript||"";
          if(transcript) textValue+=(textValue?" ":"")+transcript;
          if(event.results[i].isFinal) hasFinal=true;
        }
        if(textValue) window.receiveVoiceText(textValue,hasFinal);
      };

      speechRecognition.onerror=(event)=>{
        if(session!==speechSessionId) return;
        if(event?.error!=="no-speech" && event?.error!=="aborted"){
          showToast("🎤 中文語音暫時無法使用，請再按一次麥克風");
        }
        stopVoiceGuess();
      };

      speechRecognition.onend=()=>{
        if(session!==speechSessionId) return;
        speechRecognition=null;
        speechListening=false;
        voiceEnabledForTurn=false;
        if(btn) btn.classList.remove("voice-active");
        if(speechMode==="flutter") postHostMessage({action:"stopVoiceRecognition"});
      };

      speechRecognition.start();
    }catch(err){
      speechListening=false;
      voiceEnabledForTurn=false;
      if(btn) btn.classList.remove("voice-active");
      console.warn("native speech start error",err);
    }
  }

  /* =========================================================
     GAME LOOP
  ========================================================= */

  function gameLoop(ts){
    if(!rafRunning)return;
    const dt=Math.min(Math.max((ts-lastFrame)/1000,0),0.033); lastFrame=ts; fps=0.9*fps+0.1*(1/Math.max(dt,0.001));
    if(state===STATES.PLAYING&&!matchEnded){
      const now=gameNow();
      if(isLocalAuthority()){
        const drawer=players.get(currentDrawerId); if(!drawer||drawer.status==='LEFT'||drawer.status==='TIMEOUT') resolveTurnAsHost('SKIP','');
        if(now>=currentTurnStartedAt+activeTurnSeconds*1000) resolveTurnAsHost('TIMEOUT','');
      }
      const timer=document.getElementById('gameTimer');
      const remain=Math.max(0,Math.ceil((currentTurnStartedAt+activeTurnSeconds*1000-now)/1000));
      if(timer){
        timer.textContent=String(remain);
        timer.parentElement?.classList.toggle('timerWarn',remain<=4);
      }
      if(isLocalAuthority()) processRevealAsHost(remain);
    }
    loopHandle=requestAnimationFrame(gameLoop);
  }

  /* =========================================================
     HEARTBEAT
  ========================================================= */

  function heartbeat(){
    if(!ME.id) return;
    const p=players.get(ME.id);
    if(p) p.lastSeen=nowMs();

    sendEvent("PLAYER_HEARTBEAT", {
      roundId:roundId||"LOBBY",
      userId:ME.id,
      username:ME.username,
      avatar:ME.avatar,
      joinedAt:players.get(ME.id)?.joinedAt||nowMs(),
      status:state,
      timestamp:nowMs()
    }, { bypassAuthority:true });

    const now=nowMs();
    for(const [id,player] of players){
      if(id===ME.id) continue;
      if(now-finite(player.lastSeen,0)>CONFIG.PLAYER_TIMEOUT_MS){
        player.status="TIMEOUT";
      }
    }

    if((matchStarted || currentHostId) && (!currentHostId || !isLiveHost(currentHostId) || now-currentHostLastSeen>CONFIG.PLAYER_TIMEOUT_MS)){
      const elected=electedHostId();
      if(elected){
        currentHostId=elected;
        currentHostLastSeen=now;
        if(elected===ME.id) ensureHostAuthority(true);
      }
    }

    if(isLocalAuthority() && now-lastHostAnnounceAt>CONFIG.HOST_CHECK_MS){
      sendEvent("HOST_HEARTBEAT", { roundId:roundId||"LOBBY", hostId:ME.id, at:gameNow() }, { bypassAuthority:true });
      lastHostAnnounceAt=now;
      if(!matchStarted) broadcastLobbyState("heartbeat",true);
      else broadcastStateSnapshot("heartbeat");
    }
  }

  /* =========================================================
     CANVAS
  ========================================================= */

  function ensureCanvas(){
    canvas=document.getElementById("drawCanvas");
    previewCanvas=document.getElementById("previewCanvas");
    if(!canvas){ return false; }

    // 不使用 desynchronized：某些瀏覽器 / WebView 在頻繁重繪時會出現畫面撕裂或閃爍。
    ctx=canvas.getContext("2d", { alpha:false });
    previewCtx=previewCanvas ? previewCanvas.getContext("2d", { alpha:true }) : null;
    if(!ctx){ return false; }

    if(!resizeBound){
      window.addEventListener("resize", resizeCanvas, { passive:true });
      resizeBound=true;
    }

    resizeCanvas();
    attachCanvasEvents();
    return true;
  }

  function resizeOneCanvas(targetCanvas, targetCtx, w, h, dpr, transparent=false){
    if(!targetCanvas || !targetCtx) return false;

    const pixelW=Math.max(1, Math.floor(w*dpr));
    const pixelH=Math.max(1, Math.floor(h*dpr));
    const changed=targetCanvas.width!==pixelW || targetCanvas.height!==pixelH;

    if(changed){
      targetCanvas.width=pixelW;
      targetCanvas.height=pixelH;
    }

    targetCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if(transparent){
      targetCtx.clearRect(0, 0, w, h);
    }else{
      targetCtx.fillStyle="#f7f8fb";
      targetCtx.fillRect(0, 0, w, h);
    }
    return changed;
  }

  function resizeCanvas(){
    if(!canvas || !ctx){ return; }

    // 長按畫圖期間禁止 resize 重設畫布。
    // 某些 WebView/瀏覽器會因為版面、工具列或視窗事件在數秒後觸發 resize；
    // 如果此時改 canvas.width/height 或清畫布，正在畫的筆畫就會突然消失。
    if(currentStroke || drawingPointerId!==null || mouseDrawing){
      canvasResizePending=true;
      return;
    }

    canvasResizePending=false;

    const r=canvas.getBoundingClientRect();
    const w=r.width>10 ? r.width : 340;
    const h=r.height>10 ? r.height : 260;
    const dpr=Math.min(window.devicePixelRatio||1, 2);

    resizeOneCanvas(canvas, ctx, w, h, dpr, false);

    if(previewCanvas && previewCtx){
      const pr=previewCanvas.getBoundingClientRect();
      const pw=pr.width>10 ? pr.width : w;
      const ph=pr.height>10 ? pr.height : h;
      resizeOneCanvas(previewCanvas, previewCtx, pw, ph, dpr, true);
      clearShapePreview();
    }

    redrawCanvas();
  }

  function redrawCanvas(){
    if(!canvas || !ctx){ return; }
    const r=canvas.getBoundingClientRect();
    const w=r.width>10 ? r.width : 340;
    const h=r.height>10 ? r.height : 260;

    ctx.fillStyle="#f7f8fb";
    ctx.fillRect(0, 0, w, h);

    for(const s of knownStrokes){ drawStroke(s, ctx, canvas); }
    for(const s of remoteStrokeBuffers.values()){ drawStroke(s, ctx, canvas); }
  }

  function clearShapePreview(){
    if(!previewCanvas || !previewCtx){ return; }
    const r=previewCanvas.getBoundingClientRect();
    const w=r.width>10 ? r.width : 340;
    const h=r.height>10 ? r.height : 260;
    previewCtx.clearRect(0, 0, w, h);
  }

  function drawShapePreview(stroke){
    if(!previewCanvas || !previewCtx || !stroke){ return; }
    clearShapePreview();
    drawStroke(stroke, previewCtx, previewCanvas);
  }

  function pointFromEvent(e){
    const r=canvas.getBoundingClientRect();
    return {
      x: clamp((e.clientX-r.left)/Math.max(1, r.width), 0, 1),
      y: clamp((e.clientY-r.top)/Math.max(1, r.height), 0, 1)
    };
  }

  function normalizedColorRgb(color){
    const value=safeString(color,"#151923",20).trim();
    const m=value.match(/^#([0-9a-f]{6})$/i);
    if(!m){ return [21,25,35]; }
    return [parseInt(m[1].slice(0,2),16), parseInt(m[1].slice(2,4),16), parseInt(m[1].slice(4,6),16)];
  }

  function floodFillAt(point,color){
    if(!canvas || !ctx || !point){ return; }
    const w=canvas.width;
    const h=canvas.height;
    if(w<2 || h<2){ return; }

    const sx=clamp(Number(point.x),0,1);
    const sy=clamp(Number(point.y),0,1);
    const seedX=Math.min(w-1,Math.max(0,Math.floor(sx*w)));
    const seedY=Math.min(h-1,Math.max(0,Math.floor(sy*h)));

    const image=ctx.getImageData(0,0,w,h);
    const data=image.data;
    const seedPos=seedY*w+seedX;
    const seedIndex=seedPos*4;
    const targetR=data[seedIndex];
    const targetG=data[seedIndex+1];
    const targetB=data[seedIndex+2];
    const targetA=data[seedIndex+3];
    const fillRgb=normalizedColorRgb(color);

    if(Math.abs(targetR-fillRgb[0])<=2 && Math.abs(targetG-fillRgb[1])<=2 && Math.abs(targetB-fillRgb[2])<=2 && targetA>=250){
      return;
    }

    const tolerance=24;
    const seen=new Uint8Array(w*h);
    const stack=[seedPos];
    seen[seedPos]=1;

    const matches=(pos)=>{
      const i=pos*4;
      return (Math.abs(data[i]-targetR)<=tolerance && Math.abs(data[i+1]-targetG)<=tolerance && Math.abs(data[i+2]-targetB)<=tolerance && Math.abs(data[i+3]-targetA)<=tolerance);
    };

    while(stack.length){
      const pos=stack.pop();
      if(!matches(pos)){ continue; }

      const i=pos*4;
      data[i]=fillRgb[0]; data[i+1]=fillRgb[1]; data[i+2]=fillRgb[2]; data[i+3]=255;

      const x=pos%w; const y=Math.floor(pos/w);
      const n1=pos-1; const n2=pos+1; const n3=pos-w; const n4=pos+w;

      if(x>0 && !seen[n1]){ seen[n1]=1; stack.push(n1); }
      if(x<w-1 && !seen[n2]){ seen[n2]=1; stack.push(n2); }
      if(y>0 && !seen[n3]){ seen[n3]=1; stack.push(n3); }
      if(y<h-1 && !seen[n4]){ seen[n4]=1; stack.push(n4); }
    }
    ctx.putImageData(image,0,0);
  }

  function drawShapeStroke(stroke, targetCtx=ctx, targetCanvas=canvas){
    if(!stroke || !Array.isArray(stroke.points) || stroke.points.length<2 || !targetCtx || !targetCanvas){ return; }

    const r=targetCanvas.getBoundingClientRect();
    const x1=clamp(stroke.points[0].x,0,1)*r.width;
    const y1=clamp(stroke.points[0].y,0,1)*r.height;
    const x2=clamp(stroke.points[1].x,0,1)*r.width;
    const y2=clamp(stroke.points[1].y,0,1)*r.height;

    targetCtx.strokeStyle=safeString(stroke.color,"#151923",20);
    targetCtx.lineWidth=clamp(Number(stroke.size)||7,2,30);
    targetCtx.lineCap="round";
    targetCtx.lineJoin="round";

    if(stroke.tool==="line"){
      targetCtx.beginPath();
      targetCtx.moveTo(x1,y1);
      targetCtx.lineTo(x2,y2);
      targetCtx.stroke();
      return;
    }

    if(stroke.tool==="rect"){
      targetCtx.strokeRect(x1,y1,x2-x1,y2-y1);
      return;
    }

    if(stroke.tool==="circle"){
      const radius=Math.hypot(x2-x1,y2-y1);
      targetCtx.beginPath();
      targetCtx.arc(x1,y1,radius,0,Math.PI*2);
      targetCtx.stroke();
    }
  }

  function drawStroke(stroke, targetCtx=ctx, targetCanvas=canvas){
    if(!stroke || !Array.isArray(stroke.points) || stroke.points.length<1 || !targetCtx || !targetCanvas){ return; }

    const type=safeString(stroke.tool||stroke.kind,"pen",20);
    if(type==="fill"){
      // 填色只允許落在正式畫布，不在預覽層執行。
      if(targetCtx===ctx && targetCanvas===canvas){
        floodFillAt(stroke.points[0],stroke.color||brushColor);
      }
      return;
    }

    if(type==="line" || type==="rect" || type==="circle"){
      drawShapeStroke(stroke, targetCtx, targetCanvas);
      return;
    }

    const r=targetCanvas.getBoundingClientRect();
    const color=safeString(stroke.color,"#151923",20);
    const size=clamp(Number(stroke.size)||7,2,30);

    targetCtx.strokeStyle=color;
    targetCtx.lineWidth=size;
    targetCtx.lineCap="round";
    targetCtx.lineJoin="round";

    if(stroke.points.length===1){
      const a=stroke.points[0];
      targetCtx.beginPath();
      targetCtx.arc(a.x*r.width,a.y*r.height,size/2,0,Math.PI*2);
      targetCtx.fillStyle=color;
      targetCtx.fill();
      return;
    }

    targetCtx.beginPath();
    targetCtx.moveTo(stroke.points[0].x*r.width, stroke.points[0].y*r.height);
    for(let i=1;i<stroke.points.length;i++){
      const p=stroke.points[i];
      targetCtx.lineTo(p.x*r.width,p.y*r.height);
    }
    targetCtx.stroke();
  }

  function beginStroke(e){
    if(!isDrawer() || state!==STATES.PLAYING || matchEnded || currentTurnResolved){ return; }
    if(e.pointerType==="mouse" && e.button!==0){ return; }
    if(drawingPointerId!==null){ return; }

    e.preventDefault();
    drawingPointerId=e.pointerId; strokeSentPointCount=0; strokeBatchLastAt=0;
    ensureAudio();
    const p=pointFromEvent(e);

    if(tool==="fill"){
      const fillStroke={
        id: ME.id+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,6),
        color:brushColor, size:brushSize, tool:"fill", points:[p]
      };
      knownStrokes.push(fillStroke); localStrokeIds.push(fillStroke.id);
      if(knownStrokes.length>CONFIG.MAX_STROKES){ knownStrokes.shift(); }
      redrawCanvas();
      sendEvent("GAME_EVENT",{ roundId, type:"STROKE", stroke:fillStroke, turnIndex:currentTurnIndex });
      drawingPointerId=null; playTone(520,.04); vibrate(20);
      return;
    }

    currentStroke={
      id: ME.id+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,6),
      color: tool==="eraser" ? "#f7f8fb" : brushColor,
      size:brushSize, tool, points:[p]
    };

    if(tool==="line" || tool==="rect" || tool==="circle"){
      currentStroke.points.push({...p});
      clearShapePreview();
    }
    // Pointer Capture + window capture fallback，雙重保護長按拖曳。
    try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
  }

  function moveStroke(e){
    if(!currentStroke || !canvas || (drawingPointerId!==null && e.pointerId!==drawingPointerId)){ return; }

    // 長按畫圖期間，以自己的 pointerdown / pointerId 為準。
    // 某些 Chrome/WebView/滑鼠驅動會在長按後暫時回報 buttons=0，
    // 若用 e.buttons 判斷會讓筆畫在約幾秒後被誤判中斷。
    // 既然目前已有 active pointer，就繼續接受 move，真正結束只交給 pointerup。
    e.preventDefault();
    const events=typeof e.getCoalescedEvents==="function" ? e.getCoalescedEvents() : [e];
    for(const ev of events){
      const p=pointFromEvent(ev);
      if(currentStroke.tool==="line" || currentStroke.tool==="rect" || currentStroke.tool==="circle"){
        currentStroke.points[1]=p;
        const now=performance.now();
        if(now-lastCanvasRenderFrame>=16){
          lastCanvasRenderFrame=now;
          drawShapePreview(currentStroke);
        }
        continue;
      }
      const last=currentStroke.points[currentStroke.points.length-1];
      const r=canvas.getBoundingClientRect();
      const dx=(p.x-last.x)*r.width; const dy=(p.y-last.y)*r.height;
      if(Math.hypot(dx,dy)<1.4){ continue; }

      if(currentStroke.points.length<CONFIG.MAX_POINTS_PER_STROKE){
        currentStroke.points.push(p);
        drawStroke({ color:currentStroke.color, size:currentStroke.size, tool:currentStroke.tool, points:[last,p] });
      }
    }
    if(currentStroke && (currentStroke.tool==='pen'||currentStroke.tool==='eraser')){
      sendCurrentStrokeChunk(false);
    }
  }

  function sendCurrentStrokeChunk(force=false){
    if(!currentStroke||!['pen','eraser'].includes(currentStroke.tool)) return;
    const now=nowMs(); if(!force&&now-strokeBatchLastAt<CONFIG.STROKE_BATCH_MS)return;
    while(strokeSentPointCount<currentStroke.points.length){
      const end=Math.min(currentStroke.points.length,strokeSentPointCount+CONFIG.MAX_STROKE_CHUNK_POINTS);
      const points=currentStroke.points.slice(strokeSentPointCount,end); if(!points.length)break;
      sendEvent('GAME_EVENT',{roundId,type:'STROKE_CHUNK',turnIndex:currentTurnIndex,stroke:{id:currentStroke.id,color:currentStroke.color,size:currentStroke.size,tool:currentStroke.tool,points}});
      strokeSentPointCount=end; strokeBatchLastAt=now; if(!force)break;
    }
  }

  function endStroke(e){
    if(drawingPointerId!==null && e && e.pointerId!==undefined && e.pointerId!==drawingPointerId){ return; }
    if(!currentStroke){ drawingPointerId=null; return; }
    // 某些 WebView 在長按拖曳時會發 pointercancel；保留目前筆畫，不丟掉。
    const cancelled = false;
    if(e && e.preventDefault){ e.preventDefault(); }

    const stroke={
      id: currentStroke.id,
      color: currentStroke.color,
      size: currentStroke.size,
      tool: safeString(currentStroke.tool,"pen",20),
      points: currentStroke.points.slice(0, CONFIG.MAX_POINTS_PER_STROKE)
    };

    knownStrokes.push(stroke); localStrokeIds.push(stroke.id);
    if(stroke.tool==="line" || stroke.tool==="rect" || stroke.tool==="circle"){
      clearShapePreview();
      redrawCanvas();
    }
    if(knownStrokes.length>CONFIG.MAX_STROKES){ knownStrokes.shift(); }

    if(!cancelled){
      sendCurrentStrokeChunk(true);
      sendEvent("GAME_EVENT", { roundId, type: "STROKE", stroke, turnIndex: currentTurnIndex });
    }
    try{ if(canvas?.hasPointerCapture?.(e?.pointerId)) canvas.releasePointerCapture(e.pointerId); }catch(_){}
    currentStroke=null; drawingPointerId=null; mouseDrawing=false; strokeSentPointCount=0; strokeBatchLastAt=0;

    // 如果畫畫期間發生過 resize，現在才安全地重設/重畫畫布。
    if(canvasResizePending){
      resizeCanvas();
    }

    // 筆畫完成後才處理拖曳期間被延後的同步。
    const deferredSnapshot=pendingStateSnapshot;
    pendingStateSnapshot=null;
    if(deferredSnapshot){
      pendingRender=false;
      applyStateSnapshot(deferredSnapshot.payload,deferredSnapshot.sender);
    }
    if(pendingRender){
      pendingRender=false;
      render();
    }
  }

  function makeMousePointerEvent(e, type){
    return {
      type,
      pointerId:"mouse",
      pointerType:"mouse",
      button: Number.isFinite(e.button) ? e.button : 0,
      buttons: e.buttons,
      clientX:e.clientX,
      clientY:e.clientY,
      getCoalescedEvents:()=>[e],
      preventDefault:()=>e.preventDefault()
    };
  }

  function beginMouseStroke(e){
    if(e.button!==0 || mouseDrawing){ return; }
    mouseDrawing=true;
    beginStroke(makeMousePointerEvent(e,"pointerdown"));
    if(!currentStroke){ mouseDrawing=false; }
  }

  function moveMouseStroke(e){
    if(!mouseDrawing || !currentStroke){ return; }
    moveStroke(makeMousePointerEvent(e,"pointermove"));
  }

  function endMouseStroke(e){
    if(!mouseDrawing){ return; }
    endStroke(makeMousePointerEvent(e,"pointerup"));
    mouseDrawing=false;
  }

  function attachCanvasEvents(){
    if(!canvas || canvas.dataset.bound==="1"){ return; }
    canvas.dataset.bound="1";

    // 電腦滑鼠完全改走原生 mouse 事件，避免部分 WebView/Chrome 在長按後
    // 自動發出 pointercancel / pointerup，造成約 3 秒就斷筆。
    canvas.draggable=false;
    canvas.addEventListener("mousedown", beginMouseStroke, { passive:false });
    window.addEventListener("mousemove", moveMouseStroke, { passive:false, capture:true });
    window.addEventListener("mouseup", endMouseStroke, { passive:false, capture:true });

    // 觸控/筆仍使用 Pointer Events。
    canvas.addEventListener("pointerdown", e=>{
      if(e.pointerType==="mouse") return;
      beginStroke(e);
    }, { passive:false });

    if(!pointerWindowBound){
      window.addEventListener("pointermove", e=>{
        if(e.pointerType==="mouse") return;
        moveStroke(e);
      }, { passive:false, capture:true });
      window.addEventListener("pointerup", e=>{
        if(e.pointerType==="mouse") return;
        endStroke(e);
      }, { passive:false, capture:true });

      // 觸控環境若發 pointercancel，保留目前筆畫，不把它當作放開。
      window.addEventListener("pointercancel", e=>{
        if(e.pointerType==="mouse") return;
        if(drawingPointerId!==null && e.pointerId!==drawingPointerId){ return; }
        if(!currentStroke){ return; }
        e.preventDefault?.();
        try{ if(canvas && drawingPointerId!==null){ canvas.setPointerCapture(drawingPointerId); } }catch(_){}
      }, { passive:false, capture:true });

      canvas.addEventListener("lostpointercapture", e=>{
        if(currentStroke && drawingPointerId!==null && e.pointerId===drawingPointerId){
          try{ canvas.setPointerCapture(drawingPointerId); }catch(_){}
        }
      });

      pointerWindowBound=true;
    }
    canvas.addEventListener("contextmenu", e=>e.preventDefault(), { passive:false });
    canvas.addEventListener("selectstart", e=>e.preventDefault(), { passive:false });
    canvas.addEventListener("dragstart", e=>e.preventDefault());
  }

  function receiveStrokeChunk(payload){
    const stroke=payload?.stroke; if(!stroke||!stroke.id||!Array.isArray(stroke.points)||stroke.points.length>CONFIG.MAX_STROKE_CHUNK_POINTS)return;
    const safeTool=(stroke.tool==='pen'||stroke.tool==='eraser')?stroke.tool:'pen';
    let b=remoteStrokeBuffers.get(String(stroke.id));
    if(!b){b={id:safeString(stroke.id,'remote',100),color:safeString(stroke.color,'#151923',20),size:clamp(stroke.size,2,30),tool:safeTool,points:[]};remoteStrokeBuffers.set(b.id,b);}
    const before=b.points.length; for(const p of stroke.points)b.points.push({x:clamp(p?.x,0,1),y:clamp(p?.y,0,1)});
    if(b.points.length>CONFIG.MAX_POINTS_PER_STROKE)b.points=b.points.slice(-CONFIG.MAX_POINTS_PER_STROKE);
    const pts=b.points.slice(Math.max(0,before-1)); if(pts.length>=2)drawStroke({color:b.color,size:b.size,tool:b.tool,points:pts}); else if(b.points.length===1)drawStroke(b);
  }

  function receiveStroke(stroke){
    if(!stroke || !Array.isArray(stroke.points) || stroke.points.length>CONFIG.MAX_POINTS_PER_STROKE){ return; }
    if(stroke.id) remoteStrokeBuffers.delete(String(stroke.id));
    if(stroke.id && knownStrokes.some(s=>s.id===stroke.id)){ redrawCanvas(); return; }

    const allowedTools=new Set(["pen", "eraser", "fill", "line", "rect", "circle"]);
    const safeTool=allowedTools.has(stroke.tool) ? stroke.tool : "pen";

    const safeStroke={
      id: safeString(stroke.id, "remote", 100),
      color: safeString(stroke.color, "#151923", 20),
      size: clamp(stroke.size, 2, 30),
      tool: safeTool,
      points: stroke.points.slice(0, CONFIG.MAX_POINTS_PER_STROKE).map(p=>({ x:clamp(p.x,0,1), y:clamp(p.y,0,1) }))
    };

    knownStrokes.push(safeStroke);
    if(knownStrokes.length>CONFIG.MAX_STROKES){ knownStrokes.shift(); }

    if(safeTool==="fill" || safeTool==="line" || safeTool==="rect" || safeTool==="circle"){
      redrawCanvas();
    }else{
      drawStroke(safeStroke);
    }
  }

  function removeKnownStroke(id){
    if(typeof id!=="string"){ return; }
    knownStrokes=knownStrokes.filter(s=>s.id!==id);
  }

  function undoLastStroke(){
    if(!isDrawer() || !localStrokeIds.length || matchEnded){ return; }
    const id=localStrokeIds.pop();
    removeKnownStroke(id);
    redrawCanvas();
    sendEvent("GAME_EVENT", { roundId, type: "UNDO_STROKE", strokeId: id, turnIndex: currentTurnIndex });
    playTone(400, .05);
  }

  function clearAllCanvas(){
    if(!isDrawer() || matchEnded){ return; }
    knownStrokes=[]; localStrokeIds=[]; currentStroke=null; drawingPointerId=null; mouseDrawing=false;
    clearShapePreview();
    redrawCanvas();
    sendEvent("GAME_EVENT", { roundId, type: "CLEAR_CANVAS", turnIndex: currentTurnIndex });
    playTone(350, .05);
  }

  function syncTools(){
    document.querySelectorAll("[data-tool]").forEach(b=>{ b.classList.toggle("active", b.dataset.tool===tool); });
    document.querySelectorAll("[data-size]").forEach(b=>{ b.classList.toggle("active", Number(b.dataset.size)===brushSize); });
    document.querySelectorAll("[data-color]").forEach(b=>{ b.classList.toggle("active", b.dataset.color===brushColor); });
  }

  /* =========================================================
     AUDIO
  ========================================================= */

  function ensureAudio(){
    if(muted){ return; }
    try{
      if(!audioCtx){
        const AudioContextClass=window.AudioContext||window.webkitAudioContext;
        if(!AudioContextClass){ return; }
        audioCtx=new AudioContextClass();
      }
      if(audioCtx.state==="suspended"){ audioCtx.resume(); }
    }catch(_){}
  }

  function playTone(freq, duration=.08){
    if(muted){ return; }
    const now=performance.now();
    if(now-soundCooldown<35){ return; }
    soundCooldown=now;
    ensureAudio();
    if(!audioCtx){ return; }

    try{
      const o=audioCtx.createOscillator();
      const g=audioCtx.createGain();
      o.type="sine";
      o.frequency.value=clamp(freq, 120, 1700);
      g.gain.value=.28;
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime+duration);
      o.stop(audioCtx.currentTime+duration);
    }catch(_){}
  }

  function vibrate(ms){
    try{ if(navigator.vibrate){ navigator.vibrate(ms); } }catch(_){}
  }

  /* =========================================================
     TOAST
  ========================================================= */

  function showToast(t){
    const el=document.getElementById("toast");
    if(!el){ return; }
    el.textContent=safeString(t, "", 100);
    el.classList.add("show");
    clearTimeout(showToast.t);
    showToast.t=setTimeout(()=>{ el.classList.remove("show"); }, 1200);
  }

  /* =========================================================
     GLOBAL KEYBOARD SHORTCUTS
  ========================================================= */
  document.addEventListener("keydown", (e) => {
    // 當按下 Enter 且遊戲進行中、自己不是畫家時
    if (e.key === "Enter" && state === STATES.PLAYING && !isDrawer()) {
      const input = document.getElementById("guessInput");
      // 如果當前焦點不在輸入框上，就強制聚焦
      if (input && document.activeElement !== input) {
        input.focus();
        e.preventDefault(); // 阻止預設行為 (避免畫面跳動)
      }
    }
  });

  /* =========================================================
     BOOT
  ========================================================= */

  function boot(){
    const main=document.getElementById("main");
    if(!main){ setTimeout(boot, 50); return; }

    categoryVotes.set(String(ME.id), selectedCategory);
    roundsVotes.set(String(ME.id), selectedRounds);
    secondsVotes.set(String(ME.id), selectedTurnSeconds);

    render();
    requestFlutterVoiceConfig();
    startHostMonitor();
    lastFrame=performance.now();
    rafRunning=true;
    loopHandle=requestAnimationFrame(gameLoop);
    heartbeatTimer=setInterval(heartbeat, CONFIG.HEARTBEAT_MS);
  }

  boot();

</script>
</body>
</html>
