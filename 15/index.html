<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070912">
<title>爆爆你畫我猜</title>
<style>
:root{
  --bg:#070912;--panel:#111625;--panel2:#161c2d;--line:#2b3550;--text:#f7f8fb;--muted:#98a3ba;
  --cyan:#62e7ff;--purple:#b76cff;--green:#4ee08a;--red:#ff637a;--gold:#ffd166;--yellow:#ffc857;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none}
body{min-height:100dvh}
button,input{font:inherit}
button{border:0;color:var(--text);cursor:pointer}
button:disabled{opacity:.45;cursor:default}
#app{width:100%;height:100dvh;display:flex;justify-content:center}
.shell{width:min(100%,760px);height:100%;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));gap:8px}
.top{height:46px;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.brand{font-weight:1000;letter-spacing:.3px;font-size:15px}.brand small{display:block;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.7px;margin-top:1px}
.topActions{display:flex;gap:7px;align-items:center;}
/* 🌟 新增銀幣 UI 樣式 */
.coinBadge{background:#ffc85722;border:1px solid #ffc85744;color:var(--gold);padding:0 10px;height:32px;border-radius:12px;font-weight:900;font-size:13px;display:none;align-items:center;gap:4px;}
.iconBtn{width:42px;height:42px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:19px;display:flex;align-items:center;justify-content:center;}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:12px}
.center{display:flex;align-items:center;justify-content:center;text-align:center}
.hero{padding:16px 14px}.hero h1{font-size:clamp(27px,7vw,46px);line-height:1.04;margin:0}.hero p{margin-top:7px;color:var(--muted);font-size:13px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;justify-content:center}.badge{padding:6px 8px;border-radius:999px;background:#0b0f19;border:1px solid var(--line);font-size:10px;color:#d2d8e8}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{padding:8px 5px;background:#0b0f18;border:1px solid var(--line);border-radius:12px;text-align:center;min-width:0}.stat b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat span{font-size:9px;color:var(--muted)}
.sectionTitle{font-size:13px;font-weight:1000;margin-bottom:8px}.muted{color:var(--muted)}.tiny{font-size:10px;line-height:1.45}
.cta{width:100%;min-height:52px;border-radius:15px;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#070912;font-weight:1000;font-size:16px;box-shadow:0 8px 24px #0005;display:flex;align-items:center;justify-content:center;}.cta:active,.secondary:active,.iconBtn:active,.tool:active,.chip:active{transform:scale(.97)}
.cta:disabled{background:#333;color:#888;box-shadow:none;}
.secondary{background:#192032;color:#fff;border:1px solid var(--line);box-shadow:none}.danger{background:#2a1520;border-color:#663246}.good{background:#153225;border-color:#2f7950}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.notice{min-height:23px;color:#d1d6e4;font-size:11px;text-align:center;display:flex;align-items:center;justify-content:center}
.dev{font-size:10px;color:#ffd276;text-align:center;line-height:1.45}

/* voting */
.voteGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.chip{min-height:48px;border-radius:13px;background:#0d1220;border:1px solid var(--line);padding:7px 9px;text-align:left;font-weight:900}.chip small{display:block;color:var(--muted);font-size:9px;font-weight:700;margin-top:2px}.chip.active{border-color:var(--cyan);box-shadow:0 0 0 2px #62e7ff22;background:#112333}.voteBar{height:6px;border-radius:999px;background:#0c101a;overflow:hidden}.voteBar span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));width:0%}
.categoryList{display:flex;gap:5px;flex-wrap:wrap}.miniTag{font-size:9px;color:#cbd2e2;background:#0b0f18;border:1px solid var(--line);border-radius:999px;padding:4px 7px}

/* players */
.players{display:flex;gap:6px;overflow:hidden;overflow-x:auto;padding-bottom:4px;}.player{min-width:102px;max-width:136px;padding:7px 9px;border-radius:11px;background:#0b101c;border:1px solid var(--line);font-size:10px;flex:0 0 auto}.player b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player em{display:block;font-style:normal;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player.me{border-color:#42537b}.player.drawer{box-shadow:inset 0 0 0 1px #b76cff33}

/* game */
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;flex:0 0 auto}.pill{background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:7px 9px;font-size:10px;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;}.pill b{font-size:14px}.pill.centerText{text-align:center}.timerWarn{color:#ffcf70;border-color:#735b28}
#canvasWrap{position:relative;flex:1;min-height:240px;border-radius:18px;overflow:hidden;border:1px solid #30394f;background:#f7f8fb;touch-action:none;box-shadow:0 0 0 1px #ffffff07}
#drawCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;outline:none;}

.roleBadge,#turnBadge{position:absolute;top:9px;padding:6px 8px;border-radius:9px;background:#111625e8;border:1px solid #ffffff20;font-size:10px;font-weight:900;z-index:3;pointer-events:none}
.roleBadge{left:9px}.turnBadge{right:9px}
.wordBadge{position:absolute;top:9px;left:50%;transform:translateX(-50%);padding:7px 11px;border-radius:999px;background:#111625e8;border:1px solid #ffffff20;font-weight:1000;font-size:13px;z-index:3;pointer-events:none;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cursorHint{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);padding:6px 9px;border-radius:9px;background:#111625d9;color:#dce2f2;font-size:9px;pointer-events:none;white-space:nowrap}
.tools{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}.tool{height:42px;min-width:42px;border-radius:12px;background:#101626;border:1px solid var(--line);font-weight:900;display:flex;align-items:center;justify-content:center;}.tool.active{outline:2px solid var(--cyan);outline-offset:-2px}.color{width:42px;padding:0;border-radius:50%;border:3px solid #fff}.sizeBtn{font-size:11px}
.guessArea{display:flex;gap:7px;flex:0 0 auto}.guessArea input{flex:1;min-width:0;height:48px;border-radius:14px;border:1px solid var(--line);background:#0d111c;color:#fff;padding:0 13px;outline:none;user-select:text}.guessArea input:focus{border-color:var(--cyan)}.guessArea button{width:92px;border-radius:14px;background:var(--cyan);color:#061018;font-weight:1000}
.skipBtn{height:42px;border-radius:12px;background:#2a1820;border:1px solid #5f3344;font-weight:900;padding:0 12px;}
.turnFeed{display:flex;justify-content:space-between;gap:6px;align-items:center;min-height:25px;padding:0 2px}.feedText{font-size:11px;color:#d1d6e4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.turnScore{font-size:10px;color:#b9c4d7;white-space:nowrap}

/* result */
.result{display:flex;flex-direction:column;gap:11px}.resultTitle{font-size:34px;font-weight:1000}.reward{font-size:29px;color:var(--gold);font-weight:1000}.rankList{display:flex;flex-direction:column;gap:6px;max-height:250px;overflow:auto}.rankRow{display:grid;grid-template-columns:30px 1fr auto;gap:7px;align-items:center;padding:8px 9px;background:#0b101b;border:1px solid var(--line);border-radius:11px}.rankNo{font-weight:1000;text-align:center}.rankName{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rankScore{font-size:11px;font-weight:1000}.rankReward{font-size:9px;color:var(--gold);grid-column:2/4}

/* modal */
.modal{position:fixed;inset:0;background:#05070ccc;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}.modalCard{width:min(100%,560px);max-height:88dvh;overflow:auto;background:#121827;border:1px solid var(--line);border-radius:20px;padding:18px}.modalCard h2{margin:0 0 10px}.modalCard p,.modalCard li{color:#c7cede;font-size:12px;line-height:1.62}.modalCard ul{padding-left:20px}.close{float:right;background:#212a3d;border:1px solid var(--line);border-radius:10px;padding:6px 10px}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#101727f2;border:1px solid var(--line);padding:9px 13px;border-radius:12px;font-size:11px;z-index:80;transition:.18s}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.debug{position:fixed;left:6px;bottom:6px;z-index:100;background:#000d;color:#8fffc0;font:10px monospace;padding:6px;pointer-events:none;border-radius:6px}
.hidden{display:none!important}
.guessChatBox{background:#0b0f18;border:1px solid var(--line);border-radius:12px;padding:8px;height:110px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;font-size:11px}
.chatMsg{line-height:1.35;word-break:break-all}
.chatMsg.correct{color:var(--green);font-weight:bold}
.chatMsg.system{color:var(--gold);font-style:italic}
@media(min-width:600px){.shell{padding-left:18px;padding-right:18px}.panel{padding:15px}.voteGrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app"><div class="shell">
  <main id="main" class="screen"></main>
</div></div>

<div id="helpModal" class="modal">
  <div class="modalCard">
    <button id="closeHelp" class="close">關閉</button>
    <h2>🎨 爆爆你畫我猜</h2>
    <p><b>目標：</b>大家先投票選題型，再輪流當畫家。畫家不能寫出答案，其他參賽者輸入文字搶猜。</p>
    <ul>
      <li>每位正式參賽者 Entry：100 銀幣；遊戲開始時鎖定獎池，平台手續費 10%。</li>
      <li>最少需要 2 人參與才能開始遊戲。</li>
      <li>每位參賽者都會輪流畫一次；每回合限時 15 秒。</li>
      <li>猜對者立即得分；幫助別人猜中的畫家也得分。猜得越快，兩邊分數越高。</li>
      <li>最後依總分排名；最高分者取得本局獎池。若最高分平手，最高分玩家平分獎池。</li>
    </ul>
    <p><b>畫畫工具：</b>畫筆、橡皮擦、粗細、顏色、撤銷、清除。手機直接用手指拖曳。</p>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
"use strict";

const GAME_INFO = {
  id: "boom_draw_guess",
  category: "派對競技",
  name: "爆爆你畫我猜",
  description: "投票選題、輪流作畫，搶猜得分，總分王拿獎池。",
  entryCost: 100,
  maxPlayers: 10,
  version: "1.1.0"
};

const CONFIG = Object.freeze({
  ENTRY_FEE: 100,
  PLATFORM_FEE_RATE: 0.10,
  MIN_PLAYERS: 1, // 🌟 支援 1 人即可開始測試/遊玩
  MAX_PLAYERS: 10,
  CATEGORY_VOTE_SECONDS: 8,
  PAYMENT_WINDOW_SECONDS: 8,
  TURN_SECONDS: 60,
  COUNTDOWN_SECONDS: 3,
  HEARTBEAT_MS: 4000,
  PLAYER_TIMEOUT_MS: 12000,
  EVENT_DEDUPE_MAX: 1200,
  MAX_NAME_LENGTH: 24,
  MAX_AVATAR_LENGTH: 300,
  MAX_GUESS_LENGTH: 32,
  MAX_STROKES: 140,
  MAX_POINTS_PER_STROKE: 80
});

const STATES = Object.freeze({
  LOBBY: "LOBBY",
  SELECT_CATEGORY: "SELECT_CATEGORY",
  PURCHASING: "PURCHASING",
  READY: "READY",
  COUNTDOWN: "COUNTDOWN",
  PLAYING: "PLAYING",
  RESULT: "RESULT",
  WAITING_FOR_MAYOR_CLOSE: "WAITING_FOR_MAYOR_CLOSE",
  GAME_CLOSED: "GAME_CLOSED"
});

const CATEGORIES = Object.freeze([
  {id:"food", name:"美食", icon:"🍔", hint:"吃的、喝的、甜點"},
  {id:"animals", name:"動物", icon:"🐱", hint:"陸地、海洋、天空"},
  {id:"daily", name:"日常", icon:"🏠", hint:"生活中常見的東西"},
  {id:"places", name:"地點", icon:"🚕", hint:"景點、車輛、場所"},
  {id:"people", name:"職業", icon:"🧑", hint:"職業、角色、人物"},
  {id:"fantasy", name:"幻想", icon:"🚀", hint:"遊戲、幻想、電影感"}
]);

const WORD_BANK = {
  food: [["披薩"],["漢堡"],["薯條"],["炸雞"],["火鍋"],["拉麵"],["珍珠奶茶",["珍奶"]],["西瓜"]],
  animals: [["貓咪",["貓"]],["狗狗",["狗"]],["兔子"],["老虎"],["獅子"],["大象"],["企鵝"]],
  daily: [["雨傘"],["眼鏡"],["電視"],["手機"],["腳踏車",["自行車","單車"]],["手錶"],["牙刷"]],
  places: [["摩天輪"],["遊樂園"],["動物園"],["醫院"],["超市"],["飛機"],["火車"]],
  people: [["醫生"],["警察"],["消防員"],["司機"],["歌手"],["國王"],["忍者"]],
  fantasy: [["火箭"],["太空人"],["外星人"],["吸血鬼"],["時光機"],["寶劍"]]
};

function buildWordBank(){
  const out={};
  for(const c of CATEGORIES){
    out[c.id]=(WORD_BANK[c.id]||[]).map((row,i)=>({id:c.id+"_"+i,answer:String(row[0]),aliases:Array.isArray(row[1])?row[1]:[]}));
  }
  return out;
}
const WORDS=buildWordBank();

let DEV = true;
let sdkIsHost = false;
let gameRoomId = "";

let selectedRounds = 1;
let selectedTurnSeconds = 15;
let activeTurnSeconds = 15;
let votedRounds = 0;
let votedSeconds = 0;
let roundsVotes = new Map();
let secondsVotes = new Map();
let guessHistory = [];
let resultAutoCloseTimer = null;
let resultCloseSeconds = 5;

let state=STATES.LOBBY;
let gameOverCalled=false;
let isPurchasing=false;
let purchaseConfirmed=false;
let matchStarted=false;
let matchEnded=false;
let roundId="";
let roundSeed=0;
let currentHostId="";
let selectedCategory="";
let votedCategory="";
let voteDeadline=0;
let paymentDeadline=0;
let categoryVotes=new Map();
let currentTurnIndex=-1;
let currentDrawerId="";
let currentTurnStartedAt=0;
let currentTurnResolved=false;
let currentWord=null;
let knownStrokes=[];
let localStrokeIds=[];
let currentStroke=null;
let tool="pen";
let brushColor="#151923";
let brushSize=7;
let muted=false;
let audioCtx=null;
let soundCooldown=0;
let rewardLocked=false;
let totalPool=0;
let platformFee=0;
let prizePool=0;
let finalReward=0;
let finalRank=1;
let finalReason="";
let noticeText="連線中...";
let feedText="";
let lastGuessAt=0;
let countdownValue=CONFIG.COUNTDOWN_SECONDS;
let loopHandle=0;
let lastFrame=0;
let rafRunning=true;
let fps=60;
let hiddenAt=0;
let turnStateTimer=null;
let voteTimer=null;
let paymentTimer=null;
let heartbeatTimer=null;
let hostTakeoverSentFor="";
let mySilverCoins=0;

const participants=new Set();
const players=new Map();
const seenEvents=new Set();
const seenGuesses=new Set();

function safeString(v,fallback,maxLen){
  if (v === null || v === undefined) return fallback;
  const s = String(v).trim();
  return s ? s.slice(0, maxLen) : fallback;
}
function finite(v,fallback=0){return Number.isFinite(v)?v:fallback}
function clamp(v,min,max){return Math.min(max,Math.max(min,finite(v,min)))}
function intClamp(v,min,max){return Math.floor(clamp(v,min,max))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function stableHash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function normalizeText(s){return String(s||"").normalize("NFKC").toLowerCase().replace(/[\s\u3000，。！？、,.!?;；:：'"“”‘’()（）\[\]{}<>《》【】]/g,"")}
function answerMatches(guess,word){
  const g=normalizeText(guess); if(!g||!word)return false;
  if(g===normalizeText(word.answer))return true;
  return word.aliases.some(a=>g===normalizeText(a));
}
function getCategory(id){return CATEGORIES.find(c=>c.id===id)||CATEGORIES[0]}
function addPlayer(id,username,avatar,status="WAITING",paid=false){
  if(id===null||id===undefined)return null;
  id=String(id);
  if(!id||id.length>64)return null;
  let p=players.get(id);
  if(!p){
    p={id,username:safeString(username,"玩家",CONFIG.MAX_NAME_LENGTH),avatar:safeString(avatar,"",CONFIG.MAX_AVATAR_LENGTH),status,paid:!!paid,score:0,reward:0,lastSeen:Date.now(),joinedAt:Date.now(),correct:0,drawTurns:0,skips:0};
    players.set(id,p);
  }else{
    p.username=safeString(username,p.username,CONFIG.MAX_NAME_LENGTH);p.avatar=safeString(avatar,p.avatar,CONFIG.MAX_AVATAR_LENGTH);p.status=status||p.status;p.lastSeen=Date.now();if(paid)p.paid=true;
  }
  return p;
}

function updateCoinUI(val) {
  mySilverCoins = val;
  const badge = document.getElementById("coinBadge");
  const valEl = document.getElementById("coinVal");
  if(badge && valEl) {
    badge.style.display = 'flex';
    valEl.textContent = Number(val).toLocaleString();
  }
}

let ME={ id:"local_"+Math.random().toString(36).slice(2,10), username:"本地玩家", avatar:"", joinedAt:Date.now() };
currentHostId = ME.id;
addPlayer(ME.id, ME.username, ME.avatar, "WAITING", false);

function sdkAvailable(){return !DEV;}

function setupSDK(data) {
  DEV = false;
  
  if (data.user) {
    players.delete(ME.id);
    ME.id = String(data.user.id);
    ME.username = safeString(data.user.username, "玩家", CONFIG.MAX_NAME_LENGTH);
    ME.avatar = safeString(data.user.avatar, "", CONFIG.MAX_AVATAR_LENGTH);
    if(data.user.silverCoins !== undefined) updateCoinUI(data.user.silverCoins);
  }
  
  sdkIsHost = !!data.isHost;
  gameRoomId = data.roomId || "";
  
  // 🌟 核心修復：直接將房間內所有人加入名單
  if (Array.isArray(data.roomPlayers)) {
    data.roomPlayers.forEach(rp => {
      addPlayer(String(rp.id), rp.username, rp.avatar, "WAITING", false);
    });
  }
  
  if (sdkIsHost) currentHostId = ME.id;
  addPlayer(ME.id, ME.username, ME.avatar, "WAITING", false);
  
  setNotice('✅ 已成功連接 BoomRoom！等待室長開始遊戲。');
  render();
  
  sendEvent("PLAYER_HELLO", {
    roundId: roundId || "LOBBY",
    userId: ME.id,
    username: ME.username,
    avatar: ME.avatar,
    joinedAt: ME.joinedAt,
    paid: false
  });
}

window.addEventListener("message", e => {
  try {
    const data = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
    if (data.action === "initSDK") { setupSDK(data); return; }

    if (!data || data.action !== "gameEventReceived") return;
    const userId = safeString(data.userId, "", 64);
    const eventName = safeString(data.eventName, "", 40);
    const payload = data.payload;

    // 🌟 接收到外部購買成功的通知
    if(eventName === "PURCHASE_SUCCESS" && payload && payload.itemId === GAME_INFO.id + "_entry_" + GAME_INFO.version) {
       if (window.onPurchaseSuccess) window.onPurchaseSuccess(payload.itemId, payload.silverCoins);
       return;
    }

    if (!userId || !/^[A-Z0-9_]{1,40}$/.test(eventName) || !payload || typeof payload !== "object") return;
    
    const round = safeString(payload.roundId, "LOBBY", 100);
    const eventId = safeString(payload.eventId, "", 80);
    const key = eventName + "|" + userId + "|" + round + "|" + (eventId || stableHash(JSON.stringify(payload)).toString(36));
    
    if (seenEvents.has(key)) return; 
    seenEvents.add(key);
    if (seenEvents.size > CONFIG.EVENT_DEDUPE_MAX) seenEvents.delete(seenEvents.values().next().value);
    
    handleEvent(userId, eventName, payload);
  } catch (_) {}
});

window.onBoomRoomSDKReady = function() {
  if (window.BoomRoomSDK) {
    setupSDK({
      user: window.BoomRoomSDK.getUser(),
      isHost: window.BoomRoomSDK.isHost,
      roomId: window.BoomRoomSDK.roomId,

  sendEvent("PLAYER_END",{roundId,userId:ME.id,status:finalReward>0?"WIN":"END",score:intClamp(players.get(ME.id)?.score||0,0,100000),reward:finalReward,reason:finalReason});
  resultShownAt=Date.now();playTone(finalReward>0?1040:300,.18);vibrate(finalReward>0?[30,40,50]:35);render();
  clearTimeout(turnStateTimer);turnStateTimer=setTimeout(()=>{if(state===STATES.RESULT){state=STATES.WAITING_FOR_MAYOR_CLOSE;render()}},1800);
}

function handleEvent(userId,eventName,payload){
  const knownUser=players.get(userId); if(knownUser)knownUser.lastSeen=Date.now();
  if(eventName==="PLAYER_HELLO"){
    const p=addPlayer(userId,payload.username,payload.avatar,payload.paid?"READY":"WAITING",!!payload.paid);if(p){p.lastSeen=Date.now();p.joinedAt=finite(payload.joinedAt,p.joinedAt)}
    if(matchStarted&&!participants.has(userId))p.status="SPECTATOR";
    if(roundId&&!matchStarted&&isHost())broadcastLobbySync(userId);
    render();return;
  }
  if(eventName==="HOST_TAKEOVER"){if(validRoundPayload(payload))currentHostId=safeString(payload.hostId,currentHostId,64);render();return;}
  if(eventName==="CATEGORY_VOTE_START"){
    if(roundId&&payload.roundId!==roundId)return;currentHostId=String(userId);
    roundId=safeString(payload.roundId,roundId,100);voteDeadline=finite(payload.deadline,Date.now()+CONFIG.CATEGORY_VOTE_SECONDS*1000);state=STATES.SELECT_CATEGORY;categoryVotes=new Map();roundsVotes=new Map();secondsVotes=new Map();votedCategory="";votedRounds=0;votedSeconds=0;selectedCategory="";setNotice("投票開始！");render();return;
  }
  if(eventName==="CATEGORY_VOTE"){
    if(!validRoundPayload(payload)||state!==STATES.SELECT_CATEGORY)return;
    const uid=safeString(payload.userId,userId,64);if(String(uid)!==String(userId)||!players.has(uid))return;const cid=safeString(payload.categoryId,"",30);if(!getCategory(cid))return;if(categoryVotes.has(uid))return;categoryVotes.set(uid,cid);render();return;
  }
  if(eventName==="ROUNDS_VOTE"){
    if(!validRoundPayload(payload)||state!==STATES.SELECT_CATEGORY)return;
    const uid=safeString(payload.userId,userId,64);if(!players.has(uid))return;roundsVotes.set(uid,intClamp(payload.rounds,1,5));render();return;
  }
  if(eventName==="SECONDS_VOTE"){
    if(!validRoundPayload(payload)||state!==STATES.SELECT_CATEGORY)return;
    const uid=safeString(payload.userId,userId,64);if(!players.has(uid))return;secondsVotes.set(uid,intClamp(payload.seconds,10,60));render();return;
  }
  if(eventName==="CATEGORY_VOTE_RESULT"){
    if(!validRoundPayload(payload))return;
    selectedCategory=safeString(payload.categoryId,CATEGORIES[0].id,30);
    if(payload.rounds) selectedRounds=intClamp(payload.rounds,1,5);
    if(payload.turnSeconds) { selectedTurnSeconds=intClamp(payload.turnSeconds,10,60); CONFIG.TURN_SECONDS=selectedTurnSeconds; }
    paymentDeadline=finite(payload.paymentDeadline,Date.now()+CONFIG.PAYMENT_WINDOW_SECONDS*1000);state=STATES.PURCHASING;setNotice("題型："+getCategory(selectedCategory).icon+getCategory(selectedCategory).name+" ("+selectedRounds+"輪/"+selectedTurnSeconds+"秒)。支付 Entry 參賽。");render();return;
  }
  if(eventName==="LOBBY_SYNC"){
    if(roundId&&payload.roundId!==roundId)return;roundId=safeString(payload.roundId,roundId,100);state=Object.values(STATES).includes(payload.phase)?payload.phase:state;selectedCategory=safeString(payload.category,selectedCategory,30);voteDeadline=finite(payload.voteDeadline,voteDeadline);paymentDeadline=finite(payload.paymentDeadline,paymentDeadline);matchStarted=!!payload.matchStarted;render();return;
  }
  if(eventName==="ROUND_START"){if(roundId&&payload.roundId!==roundId)return;currentHostId=String(userId);applyRoundStart(payload);return;}
  if(eventName==="TURN_START"){if(!validRoundPayload(payload)||!matchStarted||matchEnded)return;applyTurnStart(payload);return;}
  if(eventName==="TURN_END"){if(!validRoundPayload(payload)||matchEnded)return;applyTurnEnd(payload);return;}
  if(eventName==="GAME_EVENT"){
    if(!validRoundPayload(payload)||matchEnded)return;
    if(payload.type==="GUESS"&&isHost())processGuessAsHost(payload);
    else if(payload.type==="SKIP_TURN"&&payload.turnIndex===currentTurnIndex&&payload.userId===currentDrawerId){if(isHost())resolveTurnAsHost("SKIP",payload.userId)}
    else if(payload.type==="STROKE"&&!isDrawer())receiveStroke(payload.stroke);
    else if(payload.type==="CLEAR_CANVAS"&&!isDrawer()){knownStrokes=[];redrawCanvas()}
    else if(payload.type==="UNDO_STROKE"&&!isDrawer()){removeKnownStroke(payload.strokeId);redrawCanvas()}
    return;
  }
  if(eventName==="PLAYER_STATE"){
    if(!validRoundPayload(payload))return;const p=addPlayer(userId,payload.username||"玩家",payload.avatar||"",payload.status||"PLAYING",false);if(p)p.score=intClamp(payload.score,0,100000);render();return;
  }
  if(eventName==="PLAYER_HEARTBEAT"){if(validRoundPayload(payload)){const p=players.get(userId)||addPlayer(userId,"玩家","");if(p){p.lastSeen=Date.now();p.status=safeString(payload.status,p.status,30)}}return;}
  if(eventName==="PLAYER_END"){
    if(!validRoundPayload(payload))return;const p=players.get(userId)||addPlayer(userId,"玩家","");if(p){p.status=safeString(payload.status,"END",20);p.score=intClamp(payload.score,0,100000);p.reward=intClamp(payload.reward,0,prizePool)}render();return;
  }
  if(eventName==="ROUND_END"){if(!validRoundPayload(payload)||matchEnded&&state!==STATES.PLAYING)return;applyRoundEnd(payload);return}
}

function validRoundPayload(payload,allowLobby=false){
  if(!payload||typeof payload!=="object")return false;
  if(typeof payload.roundId!=="string"||payload.roundId.length>100)return false;
  if(!allowLobby&&roundId&&payload.roundId!==roundId)return false;
  return true;
}

let canvas=null,ctx=null,resizeBound=false;
function ensureCanvas(){canvas=document.getElementById("drawCanvas");if(!canvas)return false;ctx=canvas.getContext("2d",{alpha:false,desynchronized:true});if(!resizeBound){window.addEventListener("resize",resizeCanvas,{passive:true});resizeBound=true}resizeCanvas();attachCanvasEvents();return true}
function resizeCanvas(){if(!canvas||!ctx)return;const r=canvas.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(r.width*dpr));canvas.height=Math.max(1,Math.floor(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,1,1);ctx.fillStyle="#f7f8fb";ctx.fillRect(0,0,r.width,r.height);redrawCanvas()}
function redrawCanvas(){if(!canvas||!ctx)return;const r=canvas.getBoundingClientRect();ctx.fillStyle="#f7f8fb";ctx.fillRect(0,0,r.width,r.height);for(const s of knownStrokes)drawStroke(s)}
function pointFromEvent(e){const r=canvas.getBoundingClientRect();return{x:clamp((e.clientX-r.left)/Math.max(1,r.width),0,1),y:clamp((e.clientY-r.top)/Math.max(1,r.height),0,1)}}
function drawStroke(stroke){if(!stroke||!Array.isArray(stroke.points)||stroke.points.length<1||!ctx||!canvas)return;const r=canvas.getBoundingClientRect();const color=safeString(stroke.color,"#151923",20);const size=clamp(stroke.size,2,30);ctx.strokeStyle=color;ctx.lineWidth=size;ctx.lineCap="round";ctx.lineJoin="round";for(let i=1;i<stroke.points.length;i++){const a=stroke.points[i-1],b=stroke.points[i];ctx.beginPath();ctx.moveTo(a.x*r.width+1,a.y*r.height+1);ctx.lineTo(b.x*r.width+1,b.y*r.height+1);ctx.stroke()}if(stroke.points.length===1){const a=stroke.points[0];ctx.beginPath();ctx.arc(a.x*r.width+1,a.y*r.height+1,size/2,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}}
function beginStroke(e){
  if(!isDrawer()||state!==STATES.PLAYING||matchEnded||currentTurnResolved)return;e.preventDefault();ensureAudio();
  const p=pointFromEvent(e);const color=tool==="eraser"?"#f7f8fb":brushColor;
  currentStroke={id:ME.id+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,6),color,size:brushSize,points:[p]};
  try{canvas.setPointerCapture(e.pointerId)}catch(_){ }
}
function moveStroke(e){
  if(!currentStroke||!canvas)return;e.preventDefault();const p=pointFromEvent(e);const last=currentStroke.points[currentStroke.points.length-1];const r=canvas.getBoundingClientRect();
  const dx=(p.x-last.x)*r.width,dy=(p.y-last.y)*r.height;if(Math.hypot(dx,dy)<1.4)return;
  if(currentStroke.points.length<CONFIG.MAX_POINTS_PER_STROKE){currentStroke.points.push(p);drawStroke({color:currentStroke.color,size:currentStroke.size,points:[last,p]})}
}
function endStroke(e){
  if(!currentStroke)return;if(e&&e.preventDefault)e.preventDefault();const stroke={id:currentStroke.id,color:currentStroke.color,size:currentStroke.size,points:currentStroke.points.slice(0,CONFIG.MAX_POINTS_PER_STROKE)};
  knownStrokes.push(stroke);localStrokeIds.push(stroke.id);if(knownStrokes.length>CONFIG.MAX_STROKES)knownStrokes.shift();sendEvent("GAME_EVENT",{roundId,type:"STROKE",stroke,turnIndex:currentTurnIndex});currentStroke=null;
}
function attachCanvasEvents(){
  if(!canvas||canvas.dataset.bound==="1")return;
  canvas.dataset.bound="1";
  canvas.addEventListener("pointerdown",beginStroke,{passive:false});
  canvas.addEventListener("pointermove",moveStroke,{passive:false});
  canvas.addEventListener("pointerup",endStroke,{passive:false});
  canvas.addEventListener("pointercancel",endStroke,{passive:false});
  canvas.addEventListener("dragstart", e => e.preventDefault());
  document.body.addEventListener("dragstart", e => e.preventDefault());
}
function receiveStroke(stroke){if(!stroke||!Array.isArray(stroke.points)||stroke.points.length>CONFIG.MAX_POINTS_PER_STROKE)return;if(stroke.id&&knownStrokes.some(s=>s.id===stroke.id))return;knownStrokes.push({id:safeString(stroke.id,"remote",100),color:safeString(stroke.color,"#151923",20),size:clamp(stroke.size,2,30),points:stroke.points.slice(0,CONFIG.MAX_POINTS_PER_STROKE).map(p=>({x:clamp(p.x,0,1),y:clamp(p.y,0,1)}))});if(knownStrokes.length>CONFIG.MAX_STROKES)knownStrokes.shift();drawStroke(knownStrokes[knownStrokes.length-1])}
function removeKnownStroke(id){if(typeof id!=="string")return;knownStrokes=knownStrokes.filter(s=>s.id!==id)}
function undoLastStroke(){if(!isDrawer()||!localStrokeIds.length||matchEnded)return;const id=localStrokeIds.pop();removeKnownStroke(id);redrawCanvas();sendEvent("GAME_EVENT",{roundId,type:"UNDO_STROKE",strokeId:id,turnIndex:currentTurnIndex});playTone(400,.05);}
function clearAllCanvas(){if(!isDrawer()||matchEnded)return;knownStrokes=[];localStrokeIds=[];redrawCanvas();sendEvent("GAME_EVENT",{roundId,type:"CLEAR_CANVAS",turnIndex:currentTurnIndex});playTone(350,.05)}
function syncTools(){document.querySelectorAll("[data-tool]").forEach(b=>b.classList.toggle("active",b.dataset.tool===tool));document.querySelectorAll("[data-size]").forEach(b=>b.classList.toggle("active",Number(b.dataset.size)===brushSize))}

function ensureAudio(){if(muted)return;try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}catch(_){}}
function playTone(freq,duration=.08){if(muted)return;const now=performance.now();if(now-soundCooldown<35)return;soundCooldown=now;ensureAudio();if(!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=clamp(freq,120,1700);g.gain.value=.28;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);o.stop(audioCtx.currentTime+duration)}catch(_){}}
function vibrate(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(_){}}
function toggleSound(){muted=!muted;if(!muted)ensureAudio();document.getElementById("soundBtn").textContent=muted?"🔇":"🔊"}

      ${guessHistory.map(h=>`<div style="color:${h.isCorrect?'#37a66a':(h.isSystem?'#f39a28':'#e2e8f0')}"><b>${esc(h.username)}：</b>${esc(h.text)}</div>`).join('')}
    </div>
    ${drawer?`<div class="tools"><button class="tool ${tool==='pen'?'active':''}" data-tool="pen">✏️</button><button class="tool ${tool==='eraser'?'active':''}" data-tool="eraser">🧽</button><button class="tool color" data-color="#151923" style="background:#151923"></button><button class="tool color" data-color="#e34d5d" style="background:#e34d5d"></button><button class="tool color" data-color="#3275e8" style="background:#3275e8"></button><button class="tool color" data-color="#37a66a" style="background:#37a66a"></button><button class="tool color" data-color="#a353d5" style="background:#a353d5"></button><button class="tool color" data-color="#f39a28" style="background:#f39a28"></button><button class="tool sizeBtn ${brushSize===4?'active':''}" data-size="4">細</button><button class="tool sizeBtn ${brushSize===8?'active':''}" data-size="8">中</button><button class="tool sizeBtn ${brushSize===15?'active':''}" data-size="15">粗</button><button class="tool" id="undoBtn">↶</button><button class="tool" id="clearBtn">清除</button><button class="skipBtn" id="skipBtn">跳過（0 分）</button></div>`:`<div class="guessArea"><input id="guessInput" inputmode="text" autocomplete="off" maxlength="${CONFIG.MAX_GUESS_LENGTH}" placeholder="輸入答案…"><button id="guessBtn">猜！</button></div>`}
    <div class="turnFeed"><div class="feedText">${esc(feedText||(drawer?'畫得像一點！':'搶在別人前猜中！'))}</div><div class="turnScore">你的總分 <b>${intClamp(my?my.score:0,0,100000)}</b></div></div>
    <div class="players">${renderPlayers()}</div>`;
  if(ensureCanvas())redrawCanvas();
  if(drawer){
    document.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{tool='pen';brushColor=b.dataset.color;syncTools();playTone(620,.04)}));
    document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>{tool=b.dataset.tool;syncTools();playTone(tool==='eraser'?360:620,.04)}));
    document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{brushSize=intClamp(Number(b.dataset.size),4,15);syncTools();playTone(560,.04)}));
    document.getElementById('undoBtn')?.addEventListener('click',undoLastStroke);document.getElementById('clearBtn')?.addEventListener('click',clearAllCanvas);document.getElementById('skipBtn')?.addEventListener('click',skipTurn);
  }else{
    document.getElementById('guessBtn')?.addEventListener('click',submitGuess);document.getElementById('guessInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')submitGuess()});document.getElementById('guessInput')?.focus({preventScroll:true});
  }
}

function renderResult(main){
  const mine=finalReward>0;const all=participantPlayers().sort((a,b)=>(finite(b.score,0)-finite(a.score,0))||a.id.localeCompare(b.id));
  main.innerHTML=`<section class="panel hero center result"><div class="resultTitle">${mine?'🏆 你贏了！':'本局已結束'}</div><p>${esc(finalReason||'所有玩家完成輪流作畫')}</p><div class="reward">+${intClamp(finalReward,0,prizePool)} 銀幣</div><div class="stats"><div class="stat"><b>第 ${finalRank}</b><span>最終排名</span></div><div class="stat"><b>${intClamp(players.get(ME.id)?.score||0,0,100000)}</b><span>總分</span></div><div class="stat"><b>${intClamp(prizePool,0,1000000)}</b><span>獎池</span></div><div class="stat"><b>${intClamp(platformFee,0,1000000)}</b><span>平台費</span></div></div></section>
  <section class="panel"><div class="sectionTitle">最終排名</div><div class="rankList">${all.slice(0,10).map((p,i)=>{
    const name=(p.username&&p.username!=="玩家")?p.username:(p.id===ME.id?ME.username:("玩家_"+String(p.id).slice(-4)));
    return '<div class="rankRow"><div class="rankNo">'+(i+1)+'</div><div class="rankName">'+esc(name)+(p.id===ME.id?' · 你':'')+'</div><div class="rankScore">'+intClamp(p.score,0,100000)+' 分</div><div class="rankReward">獎勵 +'+intClamp(p.reward,0,prizePool)+' 銀幣 · 猜中 '+intClamp(p.correct||0,0,1000)+' 次 · 跳過 '+intClamp(p.skips||0,0,1000)+' 次</div></div>';
  }).join('')}</div></section>
  <section class="panel"><p style="font-weight:1000">本局已結束</p><p class="tiny muted" style="margin-top:5px">參賽 ${participantPlayers().length} 人 · 總投入 ${intClamp(totalPool,0,1000000)} 銀幣 · 平台手續費 ${intClamp(platformFee,0,1000000)} 銀幣 · 最終獎池 ${intClamp(prizePool,0,1000000)} 銀幣</p><div class="notice">等待室長關閉目前遊戲並重新開啟下一局</div></section>`;
}

function gameLoop(ts){
  if(!rafRunning)return;
  const dt=Math.min(Math.max((ts-lastFrame)/1000,0),0.033);lastFrame=ts;fps=0.9*fps+0.1*(1/Math.max(dt,0.001));
  if(state===STATES.PLAYING&&!matchEnded){
    const now=Date.now();
    if(isHost()&&!currentTurnResolved&&now>=currentTurnStartedAt+CONFIG.TURN_SECONDS*1000)resolveTurnAsHost("TIMEOUT","");
    const timer=document.getElementById("gameTimer");if(timer)timer.textContent=String(Math.max(0,Math.ceil((currentTurnStartedAt+CONFIG.TURN_SECONDS*1000-now)/1000)));
  }
  if(state===STATES.SELECT_CATEGORY){
    const left=Math.max(0,voteDeadline-Date.now());
    const sec=Math.ceil(left/1000);
    const secEl=document.getElementById("voteSeconds");if(secEl)secEl.textContent=String(sec);
    const fill=document.getElementById("voteFill");if(fill)fill.style.width=(100-clamp(left/(CONFIG.CATEGORY_VOTE_SECONDS*1000)*100,0,100))+"%";
    if(isHost()&&left<=0)finishCategoryVoteAsHost();
  }
  if(state===STATES.PURCHASING){
    const left=Math.max(0,paymentDeadline-Date.now());
    const secEl=document.getElementById("paymentSeconds");if(secEl)secEl.textContent=String(Math.ceil(left/1000));
    if(isHost()&&left<=0)startRoundAsHost(selectedCategory);
  }
  maybeTakeoverHost();
  loopHandle=requestAnimationFrame(gameLoop);
}

function heartbeat(){
  if(!ME.id)return;
  sendEvent("PLAYER_HEARTBEAT",{roundId:roundId||"LOBBY",userId:ME.id,status:state,timestamp:Date.now()});
  const now=Date.now();for(const [id,p] of players){if(id!==ME.id&&now-p.lastSeen>CONFIG.PLAYER_TIMEOUT_MS)p.status="TIMEOUT"}
  if(matchStarted&&!matchEnded&&isHost()&&currentHostId!==ME.id){currentHostId=ME.id;sendEvent("HOST_TAKEOVER",{roundId,hostId:ME.id,timestamp:Date.now()})}
}
document.addEventListener("visibilitychange",()=>{if(document.hidden){hiddenAt=Date.now()}else{if(state===STATES.PLAYING&&hiddenAt&&Date.now()-hiddenAt>2500){hiddenAt=0}}});
window.addEventListener("pagehide",()=>{clearTimeout(turnStateTimer);clearTimeout(voteTimer);clearTimeout(paymentTimer);clearInterval(heartbeatTimer);cancelAnimationFrame(loopHandle);rafRunning=false});

document.getElementById("helpBtn").addEventListener("click",()=>document.getElementById("helpModal").classList.add("show"));
document.getElementById("closeHelp").addEventListener("click",()=>document.getElementById("helpModal").classList.remove("show"));
document.getElementById("soundBtn").addEventListener("click",toggleSound);

function boot(){
  render();
  lastFrame=performance.now();
  loopHandle=requestAnimationFrame(gameLoop);
  heartbeatTimer=setInterval(heartbeat,CONFIG.HEARTBEAT_MS);
}
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}
</script>
</body>
</html>
