<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#070912">

  <title>爆爆你畫我猜</title>

  <style>
    :root{
      --bg:#070912;
      --panel:#111625;
      --panel2:#161c2d;
      --line:#2b3550;
      --text:#f7f8fb;
      --muted:#98a3ba;
      --cyan:#62e7ff;
      --purple:#b76cff;
      --green:#4ee08a;
      --red:#ff637a;
      --gold:#ffd166;
      --yellow:#ffc857;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      user-select:none;
    }

    body{
      min-height:100dvh;
    }

    button,
    input{
      font:inherit;
    }

    button{
      border:0;
      color:var(--text);
      cursor:pointer;
      touch-action:manipulation;
    }

    button:disabled{
      opacity:.45;
      cursor:default;
    }

    #app{
      width:100%;
      height:100dvh;
      display:flex;
      justify-content:center;
    }

    .shell{
      width:min(100%,1400px);
      max-width:1400px;
      height:100%;
      display:flex;
      flex-direction:column;
      padding:
        calc(4px + env(safe-area-inset-top))
        clamp(10px,2vw,28px)
        calc(4px + env(safe-area-inset-bottom));
      gap:clamp(8px,1vw,14px);
    }

    .screen{
      flex:1 1 auto;
      width:100%;
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:clamp(8px,1vw,12px);
      overflow-y:auto;
      overscroll-behavior:contain;
    }

    .panel{
      background:
        linear-gradient(
          180deg,
          var(--panel2),
          var(--panel)
        );
      border:1px solid var(--line);
      border-radius:18px;
      padding:12px;
    }

    .center{
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .hero{
      padding:16px 14px;
    }

    .hero h1{
      font-size:clamp(27px,7vw,46px);
      line-height:1.04;
      margin:0;
    }

    .hero p{
      margin-top:7px;
      color:var(--muted);
      font-size:13px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:6px;
    }

    .stat{
      padding:8px 5px;
      background:#0b0f18;
      border:1px solid var(--line);
      border-radius:12px;
      text-align:center;
      min-width:0;
    }

    .stat b{
      display:block;
      font-size:15px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .stat span{
      font-size:9px;
      color:var(--muted);
    }

    .sectionTitle{
      font-size:13px;
      font-weight:1000;
      margin-bottom:8px;
    }

    .muted{
      color:var(--muted);
    }

    .tiny{
      font-size:10px;
      line-height:1.45;
    }

    .cta{
      width:100%;
      min-height:54px;
      border-radius:16px;
      background:
        linear-gradient(
          135deg,
          var(--cyan),
          var(--purple)
        );
      color:#070912;
      font-weight:1000;
      font-size:17px;
      box-shadow:0 8px 24px #0005;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      touch-action:manipulation;
    }

    .cta:active,
    .secondary:active,
    .iconBtn:active,
    .tool:active,
    .chip:active{
      transform:scale(.96);
    }

    .cta:disabled{
      background:#333;
      color:#888;
      box-shadow:none;
    }

    .secondary{
      background:#192032;
      color:#fff;
      border:1px solid var(--line);
      box-shadow:none;
    }

    .danger{
      background:#2a1520;
      border-color:#663246;
    }

    .good{
      background:#153225;
      border-color:#2f7950;
    }

    .row{
      display:flex;
      gap:8px;
    }

    .row>*{
      flex:1;
      min-width:0;
    }

    .notice{
      min-height:23px;
      color:#d1d6e4;
      font-size:11px;
      text-align:center;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* =========================
       VOTING
    ========================= */

    .voteGrid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .chip{
      min-height:52px;
      border-radius:14px;
      background:#0d1220;
      border:1px solid var(--line);
      padding:8px 12px;
      text-align:left;
      font-weight:900;
      font-size:14px;
      cursor:pointer;
      touch-action:manipulation;
      pointer-events:auto;
      user-select:none;
      transition:
        border-color .15s,
        box-shadow .15s,
        background .15s,
        transform .1s;
    }

    .chip small{
      display:block;
      color:var(--muted);
      font-size:10px;
      font-weight:700;
      margin-top:3px;
    }

    .chip.active{
      border-color:var(--cyan);
      box-shadow:
        0 0 0 2px #62e7ff66,
        0 0 18px #62e7ff22;
      background:#112333;
      color:var(--cyan);
    }

    .voteBar{
      height:6px;
      border-radius:999px;
      background:#0c101a;
      overflow:hidden;
    }

    .voteBar span{
      display:block;
      height:100%;
      background:
        linear-gradient(
          90deg,
          var(--cyan),
          var(--purple)
        );
      width:0%;
    }

    /* =========================
       PLAYERS
    ========================= */

    .players{
      display:flex;
      gap:6px;
      overflow:hidden;
      overflow-x:auto;
      padding-bottom:4px;
    }

    .player{
      min-width:102px;
      max-width:136px;
      padding:7px 9px;
      border-radius:11px;
      background:#0b101c;
      border:1px solid var(--line);
      font-size:10px;
      flex:0 0 auto;
    }

    .player b{
      display:block;
      font-size:12px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .player em{
      display:block;
      font-style:normal;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .player.me{
      border-color:#42537b;
    }

    .player.drawer{
      box-shadow:
        inset 0 0 0 1px #b76cff33;
    }

    /* =========================
       GAME
    ========================= */

    .hud{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:6px;
      flex:0 0 auto;
    }

    .pill{
      background:#0d1220;
      border:1px solid var(--line);
      border-radius:12px;
      padding:7px 9px;
      font-size:10px;
      min-width:0;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:4px;
    }

    .pill b{
      font-size:14px;
    }

    .pill.centerText{
      text-align:center;
    }

    .timerWarn{
      color:#ffcf70;
      border-color:#735b28;
    }

    #canvasWrap{
      position:relative;
      width:100%;
      height:clamp(280px,58dvh,720px);
      min-height:280px;
      flex:0 1 auto;
      border-radius:18px;
      overflow:hidden;
      border:1px solid #30394f;
      background:#f7f8fb;
      touch-action:none;
      box-shadow:0 0 0 1px #ffffff07;
    }

    #drawCanvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      touch-action:none;
      user-select:none;
      -webkit-user-select:none;
      -webkit-user-drag:none;
      outline:none;
    }

    .roleBadge,
    #turnBadge,
    .turnBadge{
      position:absolute;
      top:9px;
      padding:6px 8px;
      border-radius:9px;
      background:#111625e8;
      border:1px solid #ffffff20;
      font-size:10px;
      font-weight:900;
      z-index:3;
      pointer-events:none;
    }

    .roleBadge{
      left:9px;
    }

    .turnBadge{
      right:9px;
    }

    .wordBadge{
      position:absolute;
      top:9px;
      left:50%;
      transform:translateX(-50%);
      padding:7px 11px;
      border-radius:999px;
      background:#111625e8;
      border:1px solid #ffffff20;
      font-weight:1000;
      font-size:13px;
      z-index:3;
      pointer-events:none;
      max-width:70%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .cursorHint{
      position:absolute;
      bottom:9px;
      left:50%;
      transform:translateX(-50%);
      padding:6px 9px;
      border-radius:9px;
      background:#111625d9;
      color:#dce2f2;
      font-size:9px;
      pointer-events:none;
      white-space:nowrap;
    }

    .tools{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      flex:0 0 auto;
      align-items:center;
    }

    .tools .tool:not(.color){
      padding:0 10px;
      font-size:11px;
    }

    .tool{
      height:42px;
      min-width:42px;
      border-radius:12px;
      background:#101626;
      border:1px solid var(--line);
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }

    .tool.active{
      outline:2px solid var(--cyan);
      outline-offset:-2px;
    }

    .color.active{
      box-shadow:0 0 0 3px #62e7ff88, inset 0 0 0 2px #111625;
    }

    .color{
      width:42px;
      padding:0;
      border-radius:50%;
      border:3px solid #fff;
    }

    .sizeBtn{
      font-size:11px;
    }

    .guessArea{
      display:flex;
      gap:7px;
      flex:0 0 auto;
    }

    .guessArea input{
      flex:1;
      min-width:0;
      height:48px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#0d111c;
      color:#fff;
      padding:0 13px;
      outline:none;
      user-select:text;
    }

    .guessArea input:focus{
      border-color:var(--cyan);
    }

    .guessArea button{
      width:92px;
      border-radius:14px;
      background:var(--cyan);
      color:#061018;
      font-weight:1000;
      cursor:pointer;
    }

    .skipBtn{
      height:42px;
      border-radius:12px;
      background:#2a1820;
      border:1px solid #5f3344;
      font-weight:900;
      padding:0 12px;
      cursor:pointer;
    }

    .turnFeed{
      display:flex;
      justify-content:space-between;
      gap:6px;
      align-items:center;
      min-height:25px;
      padding:0 2px;
    }

    .feedText{
      font-size:11px;
      color:#d1d6e4;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .turnScore{
      font-size:10px;
      color:#b9c4d7;
      white-space:nowrap;
    }

    /* =========================
       RESULT
    ========================= */

    .result{
      display:flex;
      flex-direction:column;
      gap:11px;
    }

    .resultTitle{
      font-size:34px;
      font-weight:1000;
    }

    .reward{
      font-size:29px;
      color:var(--gold);
      font-weight:1000;
    }

    .rankList{
      display:flex;
      flex-direction:column;
      gap:6px;
      max-height:250px;
      overflow:auto;
    }

    .rankRow{
      display:grid;
      grid-template-columns:30px 1fr auto;
      gap:7px;
      align-items:center;
      padding:8px 9px;
      background:#0b101b;
      border:1px solid var(--line);
      border-radius:11px;
    }

    .rankNo{
      font-weight:1000;
      text-align:center;
    }

    .rankName{
      font-size:11px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .rankScore{
      font-size:11px;
      font-weight:1000;
    }

    .rankReward{
      font-size:9px;
      color:var(--gold);
      grid-column:2/4;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(18px + env(safe-area-inset-bottom));
      transform:translateX(-50%) translateY(20px);
      opacity:0;
      pointer-events:none;
      background:#101727f2;
      border:1px solid var(--line);
      padding:9px 13px;
      border-radius:12px;
      font-size:11px;
      z-index:80;
      transition:.18s;
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
      opacity:1;
    }

    .guessChatBox{
      background:#0b0f18;
      border:1px solid var(--line);
      border-radius:12px;
      padding:8px;
      width:100%;
      height:clamp(100px,16dvh,220px);
      min-height:100px;
      max-height:none;
      overflow-y:auto;
      overscroll-behavior:contain;
      display:flex;
      flex-direction:column;
      gap:4px;
      font-size:clamp(11px,1.1vw,13px);
      scroll-behavior:auto;
    }

    @media(min-width:900px){

      .shell{
        padding-left:28px;
        padding-right:28px;
        gap:12px;
      }

      .panel{
        padding:18px;
      }

      #canvasWrap{
        height:clamp(420px,62vh,760px);
        max-height:none;
      }
    }

    @media(min-width:1200px){
      #canvasWrap{
        height:clamp(500px,68vh,900px);
      }
    }

    @media(max-width:599px){
      #canvasWrap{
        height:clamp(280px,46vh,460px);
        flex-basis:auto;
      }
    }

    @media(min-width:600px){

      .shell{
        padding-left:clamp(18px,2.2vw,32px);
        padding-right:clamp(18px,2.2vw,32px);
      }

      .panel{
        padding:clamp(15px,1.4vw,22px);
      }

      .voteGrid{
        gap:clamp(8px,1vw,14px);
      }

      .chip{
        min-height:clamp(54px,5.2vw,72px);
        font-size:clamp(14px,1.35vw,17px);
      }

      #canvasWrap{
        height:clamp(360px,58dvh,720px);
      }

      .guessChatBox{
        height:clamp(120px,16dvh,240px);
      }
    }

    @media(min-width:1200px){
      .shell{
        padding-left:clamp(28px,2.5vw,44px);
        padding-right:clamp(28px,2.5vw,44px);
      }

      .hud{
        gap:10px;
      }

      .pill{
        padding:10px 12px;
        font-size:12px;
      }

      .pill b{
        font-size:16px;
      }
    }

    @media(max-height:650px) and (min-width:700px){
      #canvasWrap{
        height:clamp(300px,50dvh,520px);
      }

      .guessChatBox{
        height:clamp(90px,13dvh,150px);
      }
    }
  </style>
</head>

<body>

<div id="app">
  <div class="shell">
    <main id="main" class="screen"></main>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  "use strict";

  /* =========================================================
     GAME INFO
  ========================================================= */

  const GAME_INFO={
    id:"boom_draw_guess",
    category:"派對競技",
    name:"爆爆你畫我猜",
    description:"依實際畫畫難度選題型，輪流作畫，搶猜得分！",
    entryCost:100,
    maxPlayers:10,
    version:"1.9.0"
  };

  const CONFIG=Object.freeze({

    ENTRY_FEE:100,

    PLATFORM_FEE_RATE:0.10,

    MIN_PLAYERS:1,

    MAX_PLAYERS:10,

    LOBBY_COUNTDOWN_SECONDS:10,

    TURN_SECONDS:30,

    COUNTDOWN_SECONDS:3,

    HEARTBEAT_MS:4000,

    PLAYER_TIMEOUT_MS:12000,

    MAX_NAME_LENGTH:24,

    MAX_AVATAR_LENGTH:300,

    MAX_GUESS_LENGTH:32,

    MAX_STROKES:140,

    MAX_POINTS_PER_STROKE:2000,

  /* 猜中排名獎勵：第 1 / 2 / 3 名 */
  GUESS_REWARDS:[150,120,90],

  /* 畫家在本回合有人猜中後取得一次獎勵 */
  DRAWER_CORRECT_REWARD:100
  });

  const STATES=Object.freeze({

    LOBBY:"LOBBY",

    PLAYING:"PLAYING",

    COUNTDOWN:"COUNTDOWN",

    RESULT:"RESULT"
  });

  /* =========================================================
     題型：依「實際畫畫難度」分類
     ★ 簡單：輪廓直觀、幾筆就能畫出來
     ★★ 中等：需要多一點特徵或細節
     ★★★ 困難：仍然可以畫，但需要較完整的構圖
     ========================================================= */

  const CATEGORIES=Object.freeze([
    {
      id:"food_easy",
      name:"美食",
      difficulty:"簡單",
      difficultyStars:"★",
      icon:"🍔",
      hint:"一眼就能畫出的食物"
    },
    {
      id:"animals_easy",

      difficulty:"簡單",
      difficultyStars:"★",

      hint:"輪廓簡單、特徵明顯"

    {
      id:"daily_easy",
      name:"日常用品",
      difficulty:"簡單",
      difficultyStars:"★",
      icon:"🏠",

    },
    {
      id:"school_easy",
      name:"校園物品",
      difficulty:"簡單",
      difficultyStars:"★",
      icon:"🎒",
      hint:"學生熟悉、線條簡單"
    },
    {
      id:"toys_easy",
      name:"玩具",
      difficulty:"簡單",
      difficultyStars:"★",
      icon:"🧸",
      hint:"形狀好辨認"
    },
    {
      id:"transport_easy",
      name:"交通工具",
      difficulty:"簡單",
      difficultyStars:"★",
      icon:"🚗",
      hint:"車子、船、飛機等"
    },
    {
      id:"food_medium",
      name:"飲料甜點",
      difficulty:"中等",
      difficultyStars:"★★",
      icon:"🧋",
      hint:"杯子、冰品、甜點造型"
    },
    {
      id:"sports_medium",
      name:"運動",
      difficulty:"中等",
      difficultyStars:"★★",
      icon:"⚽",
      hint:"球類與簡單運動動作"
    },
    {
      id:"jobs_medium",
      name:"職業人物",
      difficulty:"中等",
      difficultyStars:"★★",
      icon:"🧑‍🍳",
      hint:"用制服、道具表現職業"
    },
    {
      id:"places_medium",
      name:"地點場景",
      difficulty:"中等",
      difficultyStars:"★★",
      icon:"🏞️",
      hint:"簡單場景與場所"
    },
    {
      id:"nature_medium",
      name:"自然",
      difficulty:"中等",
      difficultyStars:"★★",
      icon:"🌳",
      hint:"植物、天氣、自然景象"
    },
    {
      id:"festivals_medium",
      name:"節慶",
      difficulty:"中等",
      difficultyStars:"★★",
      icon:"🎉",
      hint:"節日物品與慶祝元素"
    },
    {
      id:"fantasy_hard",
      name:"幻想",
      difficulty:"困難",
      difficultyStars:"★★★",
      icon:"🐉",
      hint:"需要靠特徵與組合畫出來"
    },
    {
      id:"adventure_hard",
      name:"冒險寶物",
      difficulty:"困難",
      difficultyStars:"★★★",
      icon:"🗺️",
      hint:"仍可具象作畫，但細節較多"
    }
  ]);

  /* 題目全部以「實際能畫出來」為前提，移除太抽象、太複雜、
     很難靠圖像猜出的詞。每個題型至少 30 題，足以支援多人多輪。 */
  const WORD_BANK={
    food_easy:[
      ["蘋果"],["香蕉"],["西瓜"],["草莓"],["葡萄"],["鳳梨"],["橘子"],["檸檬"],["芒果"],["水梨"],
      ["玉米"],["南瓜"],["番茄"],["胡蘿蔔"],["雞蛋"],["麵包"],["吐司"],["漢堡"],["披薩"],["薯條"],
      ["炸雞"],["熱狗"],["香腸"],["蛋糕"],["甜甜圈"],["餅乾"],["棒棒糖"],["冰淇淋"],["壽司"],["水餃"],
      ["拉麵"],["炒飯"],["牛排"],["火鍋"],["爆米花"],["巧克力"]
    ],
    animals_easy:[

  function buildWordBank(){

    const out={};

    for(const c of CATEGORIES){

      out[c.id]=
        (WORD_BANK[c.id]||[])
        .map((row,i)=>({

          id:c.id+"_"+i,

          answer:String(row[0]),

          aliases:
            Array.isArray(row[1])
              ?row[1]
              :[]

        }));
    }

    return out;
  }

  /* =========================================================
     題庫洗牌：同一局固定順序、同一類別不重複
  ========================================================= */

  const WORD_ORDER_CACHE=new Map();

  function seededRandom(seed){
    let x=(Number(seed)>>>0)||1;

    return ()=>{
      x=
        (Math.imul(
          x ^ (x>>>15),
          2246822519
        )+3266489917)>>>0;

      x^=x>>>13;
      x=Math.imul(
        x,
        1274126177
      )>>>0;

      return (x>>>0)/4294967296;
    };
  }

  function shuffledWordIndexes(
    categoryId,
    seed
  ){
    const key=
      String(seed)+"|"+String(categoryId);

    if(
      WORD_ORDER_CACHE.has(key)
    ){
      return WORD_ORDER_CACHE.get(key);
    }

    const bank=
      WORDS[
        categoryId
      ]||
      [];

    const arr=
      bank.map(
        (_,i)=>i
      );

    const rand=
      seededRandom(
        stableHash(key)
      );

    for(
      let i=arr.length-1;
      i>0;
      i--
    ){
      const j=
        Math.floor(
          rand()*(i+1)
        );

      [
        arr[i],
        arr[j]
      ]=[
        arr[j],
        arr[i]
      ];
    }

    WORD_ORDER_CACHE.set(
      key,
      arr
    );

    if(
      WORD_ORDER_CACHE.size>24
    ){
      const first=
        WORD_ORDER_CACHE.keys()
          .next()
          .value;

      if(first){
        WORD_ORDER_CACHE.delete(
          first
        );
      }
    }

    return arr;
  }

  function safeString(
    v,
    fallback,
    maxLen
  ){

    if(
      v===null ||
      v===undefined
    ){
      return fallback;
    }

    const s=
      String(v).trim();

    return s
      ?s.slice(0,maxLen)
      :fallback;
  }

  function finite(
    v,
    fallback=0
  ){

    return Number.isFinite(v)
      ?v
      :fallback;
  }

  function clamp(
    v,
    min,
    max
  ){

    return Math.min(
      max,
      Math.max(
        min,
        finite(v,min)
      )
    );
  }

  function intClamp(
    v,
    min,
    max
  ){

    return Math.floor(
      clamp(
        v,
        min,
        max
      )
    );
  }

  function esc(s){

    return String(s)
      .replace(
        /[&<>"']/g,
        c=>({

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          "\"":"&quot;",
          "'":"&#39;"

        }[c])
      );
  }

  function stableHash(s){

    let h=2166136261>>>0;

    for(
      let i=0;
      i<s.length;
      i++
    ){

      h^=
        s.charCodeAt(i);

      h=
        Math.imul(
          h,
          16777619
        );
    }

    return h>>>0;
  }

  function makeSeed(){

  function normalizeText(s){

    return String(s||"")
      .normalize("NFKC")
      .toLowerCase()
      .replace(
        /[\s\u3000，。！？、,.!?;；:：'"“”‘’()（）\[\]{}<>《》【】]/g,
        ""
      );
  }


  function getAnswerLength(word){
    const answer=
      safeString(
        word?.answer,
        "",
        100
      )
      .replace(/\s+/g,"")
      .trim();

    return Array.from(answer).length;
  }

  function answerMatches(
    guess,
    word
  ){

    const g=
      normalizeText(guess);

    if(
      !g ||
      !word
    ){
      return false;
    }

    if(
      g===
      normalizeText(
        word.answer
      )
    ){
      return true;
    }

    return word.aliases.some(
      a=>
        g===
        normalizeText(a)
    );
  }

  function addPlayer(
    id,
    username,
    avatar,
    status="READY"
  ){

    if(
      id===null ||
      id===undefined
    ){
      return null;
    }

    id=String(id);

    if(
      !id ||
      id.length>64
    ){
      return null;
    }

    let p=
      players.get(id);

    if(!p){

      p={

        id,

        username:
          safeString(
            username,
            "玩家",
            CONFIG.MAX_NAME_LENGTH
          ),

        avatar:
          safeString(
            avatar,
            "",
            CONFIG.MAX_AVATAR_LENGTH
          ),

        status,

        paid:true,

        score:0,

        reward:0,

        lastSeen:Date.now(),

        joinedAt:Date.now(),

        correct:0,

        drawTurns:0,

        skips:0
      };

      players.set(
        id,
        p
      );

    }else{

      p.username=
        safeString(
          username,
          p.username,
          CONFIG.MAX_NAME_LENGTH
        );

      p.avatar=
        safeString(
          avatar,
          p.avatar,
          CONFIG.MAX_AVATAR_LENGTH
        );

      p.status=
        status||
        p.status;

      p.lastSeen=
        Date.now();

      p.paid=true;
    }

    return p;
  }

          data.action===
          "initSDK"
        ){

          setupSDK(data);

          data.action!=="gameEventReceived"
        ){

          return;

          safeString(
            data.userId,
            "",
            64
          );

        const eventName=
          safeString(

          !userId ||
          !/^[A-Z0-9_]{1,40}$/
            .test(eventName) ||
          !payload ||
          typeof payload!=="object"
        ){

          return;
        }

        handleEvent(
          userId,
          eventName,
          payload
        );

      }catch(err){

        console.error(
          "message error",
          err
        );

    }

  /* =========================================================
     SEND EVENT
  ========================================================= */

  function sendEvent(
    eventName,
    payload
  ){

    if(DEV){
      return false;
    }

    if(
      !/^[A-Z0-9_]{1,40}$/
        .test(eventName) ||
      !payload ||
      typeof payload!=="object" ||
      Array.isArray(payload)
    ){

      return false;
    }

    const eventId=
      safeString(
        payload.eventId,
        ME.id+
        "_"+
        Date.now().toString(36)+
        "_"+
        Math.random()
          .toString(36)
          .slice(2,7),
        80
      );

    const copy={
      ...payload,
      eventId
    };

    /*
      SDK 常會把自己的事件再回傳一次。
      送出端先記住 eventId，回傳時就不會再次處理。
    */
    seenEvents.add(
      eventId
    );

    if(
      seenEvents.size>1000
    ){
      const first=
        seenEvents.values()
          .next()
          .value;

      if(first){
        seenEvents.delete(first);
      }
    }

    try{

      if(
        window.BoomRoomSDK &&
        typeof
          window.BoomRoomSDK
            .sendGameEvent===
          "function"
      ){

        window.BoomRoomSDK
          .sendGameEvent(
            eventName,
            copy
          );

        return true;
      }

      if(
        window.parent!==window
      ){

        window.parent.postMessage(
          JSON.stringify({
            action:
              "sendGameEvent",

            eventName,

            payload:copy
          }),
          "*"
        );

        return true;
      }

    }catch(err){

      console.error(
        "sendEvent error",
        err
      );
    }

    return false;
  }

     VOTING
  ========================================================= */

  function setOwnVote(
    map,
    value
  ){

    map.set(
      String(ME.id),
      value
    );
  }

  function countVotes(
    map,
    options
  ){

    return options.map(
      value=>({

        value,

        count:
          [...map.values()]
            .filter(
              v=>
                String(v)===
                String(value)
            )
            .length
      })
    );
  }

  function pickVoteWinner(
    map,
    options,
    fallback
  ){

    const rows=
      countVotes(
        map,
        options
      );

    const max=
      Math.max(
        0,
        ...rows.map(
          r=>r.count
        )
      );

    if(max<=0){
      return fallback;
    }

    const tied=
      rows
        .filter(
          r=>r.count===max
        )
        .map(
          r=>r.value
        );

    const hostVote=
      map.get(
        String(currentHostId)
      );

    if(
      tied.some(
        v=>
          String(v)===
          String(hostVote)
      )
    ){

      return hostVote;
    }

    return tied[0]??
      fallback;
  }

  function getVoteCount(
    map,
    value
  ){

    return [...map.values()]
      .filter(
        v=>
          String(v)===
          String(value)
      )
      .length;
  }

  /* =========================================================
     ROUND START
  ========================================================= */

  function startRoundAsHost(
    category
  ){

    if(matchStarted){
      return;
    }

    const allList=
      [
        ...players.values()
      ].filter(
        p=>
          p &&
          p.status!=="LEFT"
      );

    if(
      allList.length===0
    ){

      allList.push(
        players.get(
          ME.id
        )||
        addPlayer(
          ME.id,
          ME.username,
          ME.avatar,
          "READY"
        )
      );
    }

    participants.clear();

    allList.forEach(
      p=>{

        if(!p)return;

        p.paid=true;

        p.status="READY";

        p.score=0;

        p.reward=0;

        p.correct=0;

        p.drawTurns=0;

        p.skips=0;

        participants.add(
          p.id
        );
      }
    );

    totalPool=
      participants.size*
      CONFIG.ENTRY_FEE;

    platformFee=
      Math.floor(
        totalPool*
        CONFIG.PLATFORM_FEE_RATE
      );

    prizePool=
      totalPool-
      platformFee;

    matchStarted=true;

    matchEnded=false;

    gameOverCalled=false;

    roundStartAt=
      Date.now()+1000;

    const baseOrder=
      [...participants];

    turnOrder=[];

    totalTurnsPerPlayer=
      intClamp(
        selectedRounds,
        1,
        5
      );

    for(
      let r=0;
      r<totalTurnsPerPlayer;
      r++
    ){

      for(
        const id of baseOrder
      ){

        turnOrder.push(id);
      }
    }

    totalTurnCount=
      turnOrder.length;

    const payload={

      roundId,

      seed:
        roundSeed,

      startTime:
        roundStartAt,

      category:
        selectedCategory,

      participantIds:
        baseOrder,

      turnOrder,

      rounds:
        totalTurnsPerPlayer,

      turnSeconds:
        selectedTurnSeconds
    };

    sendEvent(
      "ROUND_START",
      payload
    );

    applyRoundStart(
      payload
    );
  }

  function applyRoundStart(
    payload
  ){

    if(
      !payload ||
      typeof payload!=="object"
    ){

      return;
    }

    const incomingRoundId=
      safeString(
        payload.roundId,
        "",
        100
      );

    if(!incomingRoundId){
      return;
    }

    /* 同一局的 ROUND_START 可能被 SDK 重送，不能重新倒數／清空狀態。 */
    if(incomingRoundId===appliedRoundStartId){
      return;
    }

    appliedRoundStartId=incomingRoundId;
    appliedRoundEndId="";
    turnStartSeenKeys.clear();
    turnEndSeenKeys.clear();

    if(payload.roundId){

      roundId=
        safeString(
          payload.roundId,
          roundId,
          100
        );
    }

    roundSeed=
      finite(
        payload.seed,
        0
      )>>>0;

    roundStartAt=
      finite(
        payload.startTime,
        Date.now()
      );

    selectedCategory=
      safeString(
        payload.category,
        CATEGORIES[0].id,
        30
      );

    if(payload.turnSeconds){

      activeTurnSeconds=
        Number(
          payload.turnSeconds
        );

      selectedTurnSeconds=
        activeTurnSeconds;
    }

    const ids=
      Array.isArray(
        payload.participantIds
      )
        ?payload.participantIds
            .filter(
              x=>
                typeof x==="string"
            )
        :[ME.id];

    const incomingOrder=
      Array.isArray(
        payload.turnOrder
      )
        ?payload.turnOrder
            .filter(
              x=>
                typeof x==="string"
            )
        :[];

    turnOrder=
      incomingOrder.length
        ?incomingOrder
        :ids;

    totalTurnCount=
      turnOrder.length;

    totalTurnsPerPlayer=
      intClamp(
        payload.rounds||
        selectedRounds,
        1,
        5
      );

    participants.clear();

    /* 新局清空聊天與題目順序快取 */
    guessHistory=[];
    chatSeenKeys.clear();
    WORD_ORDER_CACHE.clear();

    ids.forEach(
      id=>{

        participants.add(id);

        const p=
          players.get(id)||
          addPlayer(
            id,
            "玩家",
            "",
            "READY"
          );

        if(p){

          p.status="READY";

          p.score=0;
        }
      }
    );

    currentTurnIndex=-1;

    currentDrawerId="";

    currentTurnResolved=false;
    currentRequiredCorrectCount=getRequiredCorrectCount();

    currentWord=null;

    knownStrokes=[];

    localStrokeIds=[];

    currentStroke=null;

    matchStarted=true;

    matchEnded=false;

    state=
      STATES.COUNTDOWN;

    countdownValue=
      CONFIG.COUNTDOWN_SECONDS;

    render();

    startCountdown();
  }

  /* =========================================================
     COUNTDOWN
  ========================================================= */

  function startCountdown(){

    clearTimeout(
      turnStateTimer
    );

    countdownValue=
      CONFIG.COUNTDOWN_SECONDS;

    state=
      STATES.COUNTDOWN;

    render();

    const tick=()=>{

      if(matchEnded){
        return;
      }

      if(
        countdownValue<=0
      ){

        startNextTurnAsHost();

        return;
      }

      playTone(
        520+
        countdownValue*80,
        .06
      );

      render();

      countdownValue--;

      turnStateTimer=
        setTimeout(
          tick,
          850
        );
    };

    tick();
  }

  /* =========================================================
     TURN
  ========================================================= */

  function isDrawer(){

    return !!currentDrawerId &&
      currentDrawerId===ME.id;
  }

  function isParticipant(id){

    return participants.has(id);
  }

  function getRequiredCorrectCount(){

    const guesserCount=Math.max(0,participants.size-1);

    if(guesserCount<=0){
      return 1;
    }

    return Math.min(
      CONFIG.GUESS_REWARDS.length,
      guesserCount
    );
  }

  function startNextTurnAsHost(){

    /* 只有房主可以推進回合；其他玩家收到同步事件後只能顯示。 */
    if(!DEV && !sdkIsHost){
      return;
    }

    if(matchEnded){
      return;
    }

    currentTurnIndex++;

    if(
      currentTurnIndex>=
      turnOrder.length
    ){

      return;
    }

    currentDrawerId=
      turnOrder[
        currentTurnIndex

      drawerId:

      wordId:
        currentWord.id,

        findWordIndex(
          selectedCategory,
          currentWord.id
        ),

        currentTurnStartedAt,

        activeTurnSeconds,

      turnSeconds:
        activeTurnSeconds,

      requiredCorrectCount:
        currentRequiredCorrectCount
    };

    sendEvent(

  function findWordIndex(
    categoryId,
    wordId
  ){

    const bank=
      WORDS[
        categoryId
      ]||
      [];

    const idx=
      bank.findIndex(
        w=>
          w.id===wordId
      );

    return idx<0
      ?0
      :idx;
  }

  function wordForTurn(
    categoryId,
    turnIndex,
    seed
  ){
    const bank=
      WORDS[
        categoryId
      ]||
      [];

    if(!bank.length){
      return {
        id:"empty",
        answer:"圖畫",
        aliases:[]
      };
    }

    const order=
      shuffledWordIndexes(
        categoryId,
        seed
      );

    /*
      每個回合取一次洗牌後的索引。
      目前最大回合數為 10 人 × 5 輪 = 50，
      每個題型都有足夠題量，因此同一局內盡量不重複。
    */
    const safeTurnIndex=
      Math.max(
        0,
        intClamp(
          turnIndex,
          0,
          100000
        )
      );

    const idx=
      order[
        safeTurnIndex%order.length
      ];

    return (
      bank[idx]||
      bank[0]
    );
  }

  function applyTurnStart(
    payload
  ){

    if(
      !payload ||
      payload.roundId!==roundId
    ){

      return;
    }

    const incomingTurnIndex=
      intClamp(
        payload.turnIndex,
        -1,
        Math.max(0, turnOrder.length)
      );

    const turnKey=
      String(payload.roundId)+"|"+String(incomingTurnIndex);

    /* 同一回合事件重送／不同 eventId 也只能套用一次。 */
    if(turnStartSeenKeys.has(turnKey)){
      return;
    }

    /* 舊回合的延遲封包不能把目前回合倒退。 */
    if(
      currentTurnIndex>=0 &&
      incomingTurnIndex<currentTurnIndex
    ){
      return;
    }

    turnStartSeenKeys.add(turnKey);

    if(payload.turnSeconds){

      activeTurnSeconds=
        Number(
          payload.turnSeconds
        );
    }

    currentTurnIndex=incomingTurnIndex;

    currentDrawerId=
      safeString(
        payload.drawerId,
        "",
        64
      );

    currentTurnStartedAt=
      finite(
        payload.startTime,
        Date.now()
      );

    currentTurnResolved=false;
    correctGuessers=[];
    currentRequiredCorrectCount=intClamp(
      payload.requiredCorrectCount || getRequiredCorrectCount(),
      1,
      Math.max(1,CONFIG.GUESS_REWARDS.length)
    );
    speechFinalText="";

    selectedCategory=
      safeString(
        payload.category,
        selectedCategory,
        30
      );

    const bank=
      WORDS[
        selectedCategory
      ]||
      [];

    const idx=
      intClamp(
        payload.wordIndex,
        0,
        Math.max(
          0,
          bank.length-1
        )
      );

    currentWord=
      bank[idx]||
      null;

    knownStrokes=[];

    localStrokeIds=[];

    currentStroke=null;

    state=
      STATES.PLAYING;

    feedText=
      isDrawer()
        ?"輪到你！畫出題目，別寫字。"
        :"快猜！先答對先得分。";

    appendChatMessage({

      chatKey:
        "TURN_START|"+
        roundId+
        "|"+
        currentTurnIndex,

      roundId,

      turnIndex:
        currentTurnIndex,

      username:"系統",

      text:
        isDrawer()
          ?"🎨 第 "+(currentTurnIndex+1)+" 回合開始！答案共 "+getAnswerLength(currentWord)+" 字，開始作畫！"
          :"🎨 第 "+(currentTurnIndex+1)+" 回合開始！提示：答案共 "+getAnswerLength(currentWord)+" 字，搶先猜！本回合需 "+currentRequiredCorrectCount+" 名玩家猜中。",

      isCorrect:false,

      isSystem:true
    });

    const me=
      players.get(
        ME.id
      );

    if(me){

      me.status=
        "PLAYING";
    }

    render();

    playTone(
      740,
      .08
    );

    setTimeout(
      ensureCanvas,
      50
    );

    if(!isDrawer()){
      setTimeout(startVoiceGuess, 300);
    } else {
      stopVoiceGuess();
    }
  }

  /* =========================================================
     TURN END
  ========================================================= */

  function resolveTurnAsHost(
    kind,
    winnerId=""
  ){

    if(!DEV && !sdkIsHost){
      return;
    }

    if(matchEnded || currentTurnResolved){
      return;
    }

    /*
      CORRECT 不再立即結束回合。
      只有 TIMEOUT / SKIP / 第三位猜中才真正結束回合。
    */
    if(kind==="CORRECT"){
      const uid=safeString(winnerId,"",64);
      if(!uid || !participants.has(uid) || uid===currentDrawerId){
        return;
      }
      if(correctGuessers.some(x=>x.id===uid)){
        return;
      }
      if(correctGuessers.length>=currentRequiredCorrectCount){
        return;
      }

      const rank=correctGuessers.length+1;
      const guesserGain=CONFIG.GUESS_REWARDS[rank-1]||0;
      const gp=players.get(uid);
      const drawer=players.get(currentDrawerId);
      if(!gp || !drawer){
        return;
      }

      gp.score=intClamp(gp.score+guesserGain,0,100000);
      gp.correct=intClamp((gp.correct||0)+1,0,1000);

      let drawerGain=0;
      /* 畫家只在本回合第一次有人猜中時獎勵一次。 */
      if(correctGuessers.length===0){
        drawerGain=CONFIG.DRAWER_CORRECT_REWARD;
        drawer.score=intClamp(drawer.score+drawerGain,0,100000);
      }

      correctGuessers.push({
        id:uid,
        rank,
        gain:guesserGain
      });

      const payload={
        roundId,
        turnIndex:currentTurnIndex,
        type:"GUESS_CORRECT",
        rank,
        userId:uid,
        drawerId:currentDrawerId,
        guesserGain,
        drawerGain,
        userScore:gp.score,
        drawerScore:drawer.score,
        answer:currentWord?currentWord.answer:"",
        requiredCorrectCount:currentRequiredCorrectCount,
        at:Date.now()
      };

      sendEvent("GAME_EVENT",payload);
      applyGuessCorrect(payload);

      /* 依實際參賽人數提前結束：2 人=第1名、3 人=第2名、4 人以上=第3名。 */
      if(rank>=currentRequiredCorrectCount){
        endResolvedTurnAsHost("ALL_CORRECT",uid);
      }
      return;
    }

    currentTurnResolved=true;

    const drawer=players.get(currentDrawerId);
    if(kind==="SKIP" && drawer){
      drawer.skips=intClamp((drawer.skips||0)+1,0,1000);
    }
    if(kind==="TIMEOUT" && drawer){
      drawer.drawTurns=intClamp((drawer.drawTurns||0)+1,0,1000);
    }

    const payload={
      roundId,
      turnIndex:currentTurnIndex,
      kind,
      winnerId:winnerId||null,
      drawerId:currentDrawerId,
      answer:currentWord?currentWord.answer:"",
      drawerGain:0,
      guesserGain:0,
      drawerScore:drawer?drawer.score:0,
      winnerScore:null,
      correctGuessers:correctGuessers.map(x=>({id:x.id,rank:x.rank,gain:x.gain})),
      requiredCorrectCount:currentRequiredCorrectCount,
      at:Date.now()
    };

    sendEvent("TURN_END",payload);
    applyTurnEnd(payload);
  }

  function applyGuessCorrect(payload){

    if(!payload || payload.roundId!==roundId){
      return;
    }

    const uid=safeString(payload.userId,"",64);
    const rank=intClamp(payload.rank,1,3);
    if(!uid || rank<1 || rank>3){
      return;
    }

    /* 同一玩家同一回合只能拿一次名次。 */
    const alreadyRecorded=correctGuessers.some(x=>x.id===uid);
    if(!alreadyRecorded){
      correctGuessers.push({
        id:uid,
        rank,
        gain:intClamp(payload.guesserGain,0,100000)
      });
      correctGuessers.sort((a,b)=>a.rank-b.rank);
    }

    const gp=players.get(uid);
    if(gp){
      gp.score=intClamp(payload.userScore,0,100000);
      if(!alreadyRecorded){
        gp.correct=intClamp((gp.correct||0)+1,0,1000);
      }
    }

    const drawer=players.get(payload.drawerId);
    if(drawer){
      drawer.score=intClamp(payload.drawerScore,0,100000);
    }

    const winnerName=gp?.username||"玩家";
    const drawerName=drawer?.username||"畫家";
    const rankText=["","🥇 第 1 名","🥈 第 2 名","🥉 第 3 名"][rank]||("第 "+rank+" 名");

    feedText=
      rankText+" "+winnerName+
      " 猜中！ +"+intClamp(payload.guesserGain,0,100000)+" 分"+
      (payload.drawerGain>0
        ?"；🎨 "+drawerName+" +"+intClamp(payload.drawerGain,0,100000)+" 分"
        :"");

    appendChatMessage({
      chatKey:"GUESS_CORRECT|"+roundId+"|"+payload.turnIndex+"|"+uid+"|"+rank,
      roundId,
      turnIndex:payload.turnIndex,
      username:"系統",
      text:rankText+" "+winnerName+" 猜中了！+"+intClamp(payload.guesserGain,0,100000)+" 分"+
        (payload.drawerGain>0?"，畫家 "+drawerName+" +"+intClamp(payload.drawerGain,0,100000)+" 分":""),
      isCorrect:true,
      isSystem:true
    });

    render();
    setTimeout(ensureCanvas,50);
    scheduleChatScroll();
    playTone(rank===1?980:rank===2?820:680,.08);
    vibrate(rank===1?90:45);
  }

  function endResolvedTurnAsHost(kind,winnerId=""){
    if(!DEV && !sdkIsHost){
      return;
    }
    if(matchEnded || currentTurnResolved){
      return;
    }
    currentTurnResolved=true;

    const drawer=players.get(currentDrawerId);
    const payload={
      roundId,
      turnIndex:currentTurnIndex,
      kind,
      winnerId:winnerId||null,
      drawerId:currentDrawerId,
      answer:currentWord?currentWord.answer:"",
      drawerGain:0,
      guesserGain:0,
      drawerScore:drawer?drawer.score:0,
      winnerScore:winnerId&&players.get(winnerId)?players.get(winnerId).score:null,
      correctGuessers:correctGuessers.map(x=>({id:x.id,rank:x.rank,gain:x.gain})),
      at:Date.now()
    };

    sendEvent("TURN_END",payload);
    applyTurnEnd(payload);
  }

  function applyTurnEnd(
    payload
  ){

    if(!payload || payload.roundId!==roundId){
      return;
    }

    const incomingTurnIndex=intClamp(payload.turnIndex,-1,Math.max(0,turnOrder.length));
    const turnKey=String(payload.roundId)+"|"+String(incomingTurnIndex);

    if(turnEndSeenKeys.has(turnKey)){
      return;
    }
    if(currentTurnIndex!==incomingTurnIndex && !matchEnded){
      return;
    }
    turnEndSeenKeys.add(turnKey);

    if(payload.drawerId && players.has(payload.drawerId)){
      players.get(payload.drawerId).score=intClamp(payload.drawerScore,0,100000);
    }

    if(Array.isArray(payload.correctGuessers)){
      correctGuessers=payload.correctGuessers.map(x=>({
        id:String(x.id),
        rank:intClamp(x.rank,1,3),
        gain:intClamp(x.gain,0,100000)
      })).sort((a,b)=>a.rank-b.rank);
    }

    currentRequiredCorrectCount=intClamp(
      payload.requiredCorrectCount || currentRequiredCorrectCount || getRequiredCorrectCount(),
      1,
      Math.max(1,CONFIG.GUESS_REWARDS.length)
    );

    const winnerName=players.get(payload.winnerId)?.username||"玩家";
    if(payload.kind==="ALL_CORRECT"){
      feedText="🎉 本回合需要的猜中人數已達標！準備下一回合";
    }else if(payload.kind==="SKIP"){
      feedText="⏭️ 畫家跳過這題";
    }else{
      feedText="⏰ 時間到，答案是「"+safeString(payload.answer,"題目",30)+"」";
    }

    let msgText="";
    if(payload.kind==="ALL_CORRECT"){
      const target=currentRequiredCorrectCount;
      const rankSummary=target===1
        ?"🎉 唯一搶答玩家已猜中！"
        :"🎉 前 "+target+" 名已全部猜中！";
      msgText=rankSummary+"答案是「"+safeString(payload.answer,"題目",30)+"」";
    }else if(payload.kind==="SKIP"){
      msgText="⏭️ 畫家跳過這題，答案是「"+safeString(payload.answer,"題目",30)+"」";
    }else{
      msgText="⏰ 時間到，答案是「"+safeString(payload.answer,"題目",30)+"」";
    }

    appendChatMessage({
      chatKey:"TURN_END|"+roundId+"|"+payload.turnIndex,
      roundId,
      turnIndex:payload.turnIndex,
      username:"系統",
      text:msgText,
      isCorrect:true,
      isSystem:true
    });

    state=STATES.PLAYING;
    render();
    setTimeout(ensureCanvas,50);
    scheduleChatScroll();

    clearTimeout(turnStateTimer);
    turnStateTimer=setTimeout(()=>{
      if(matchEnded || (!DEV && !sdkIsHost)) return;
      startNextTurnAsHost();
    },1050);
  }

  function scheduleChatScroll(){

    chatScrollFrame=
      requestAnimationFrame(
        ()=>{

          scrollChatToBottom();

  /* =========================================================
     GUESS
  ========================================================= */

  function appendChatMessage(
    row
  ){
    const text=
      safeString(
        row?.text,
        "",
        CONFIG.MAX_GUESS_LENGTH
      );

    if(!text){
      return false;
    }

    const eventId=
      safeString(
        row?.eventId,
        "",
        100
      );

    const rowRoundId=
      safeString(
        row?.roundId,
        roundId||"LOBBY",
        100
      );

    const rowTurnIndex=
      Number.isFinite(
        Number(row?.turnIndex)
      )
        ?Number(
          row.turnIndex
        )
        :currentTurnIndex;

    const rowUserId=
      safeString(
        row?.userId,
        safeString(
          row?.username,
          "玩家",
          CONFIG.MAX_NAME_LENGTH
        ),
        80
      );

    const explicitKey=
      safeString(
        row?.chatKey,
        "",
        160
      );

    const contentKey=
      "content:"+
      rowRoundId+
      "|"+
      rowTurnIndex+
      "|"+
      rowUserId+
      "|"+
      normalizeText(text);

    const dedupeKey=
      explicitKey||
      (
        eventId
          ?"event:"+eventId
          :contentKey
      );

    /*
      同一玩家、同一回合、完全相同內容，
      即使平台錯誤產生不同 eventId 也不重複顯示。
    */
    if(
      chatSeenKeys.has(
        dedupeKey
      ) ||
      chatSeenKeys.has(
        contentKey
      )
    ){
      return false;
    }

    chatSeenKeys.add(
      dedupeKey
    );

    chatSeenKeys.add(
      contentKey
    );

    if(
      chatSeenKeys.size>1500
    ){
      const first=
        chatSeenKeys.values()
          .next()
          .value;

      if(first){
        chatSeenKeys.delete(first);
      }
    }

    guessHistory.push({

      eventId:
        eventId||
        dedupeKey,

      chatKey:
        dedupeKey,

      userId:
        rowUserId,

      roundId:
        rowRoundId,

      turnIndex:
        rowTurnIndex,

      username:
        safeString(
          row?.username,
          "玩家",
          CONFIG.MAX_NAME_LENGTH
        ),

      text,

      isCorrect:
        !!row?.isCorrect,

      isSystem:
        !!row?.isSystem
    });

    if(
      guessHistory.length>80
    ){
      guessHistory.splice(
        0,
        guessHistory.length-80
      );
    }

    scheduleChatScroll();

    return true;
  }

  function submitGuess(){

    if(
      state!==
        STATES.PLAYING ||
      isDrawer() ||
      matchEnded ||
      !isParticipant(
        ME.id
      ) ||
      Date.now()-
        lastGuessAt<140
    ){

      return;
    }

    const input=
      document.getElementById(
        "guessInput"
      );

    if(!input){
      return;
    }

    const guess=
      safeString(
        input.value,
        "",
        CONFIG.MAX_GUESS_LENGTH
      );

    input.value="";

    if(!guess){
      return;
    }

    lastGuessAt=
      Date.now();

    ensureAudio();

    const eventId=
      ME.id+
      "_"+
      Date.now().toString(36)+
      "_"+
      Math.random()
        .toString(36)
        .slice(2,8);

    const payload={

      roundId,

      type:"GUESS",

      userId:
        ME.id,

      username:
        ME.username,

      turnIndex:
        currentTurnIndex,

      guess,

      eventId
    };

    /*
      ★ 不先把玩家輸入直接顯示到聊天。
      必須等房主判定：
      - 猜錯：公布「玩家：答案」
      - 猜中：只公布「第幾名猜中」，絕不公布答案
      這樣第 2、3 名不能直接照抄第 1 名的答案。
    */

    sendEvent(
      "GAME_EVENT",
      payload
    );

    if(DEV || sdkIsHost){
      processGuessAsHost(payload);
    }

    render();

    setTimeout(
      ensureCanvas,
      50
    );

    scheduleChatScroll();
  }

  function processGuessAsHost(
    payload
  ){

    if(!DEV && !sdkIsHost){
      return;
    }

    if(
      matchEnded ||
      currentTurnResolved ||
      state!==
        STATES.PLAYING ||
      payload.turnIndex!==
        currentTurnIndex
    ){

      return;
    }

    const uid=
      safeString(
        payload.userId,
        "",
        64
      );

    if(
      !participants.has(uid) ||
      uid===currentDrawerId
    ){

      return;
    }

    const guess=
      safeString(
        payload.guess,
        "",
        CONFIG.MAX_GUESS_LENGTH
      );

    if(!guess){
      return;
    }

    if(answerMatches(guess,currentWord)){
      /* 答對：不傳答案、不公布玩家輸入內容。 */
      resolveTurnAsHost("CORRECT",uid);
      return;
    }

    /*
      猜錯：由房主統一公布，避免送出的原始 GUESS 被 UI 直接顯示。
    */
    const resultPayload={
      roundId,
      turnIndex:currentTurnIndex,
      type:"GUESS_RESULT",
      userId:uid,
      username:
        safeString(
          payload.username,
          players.get(uid)?.username||"玩家",
          CONFIG.MAX_NAME_LENGTH
        ),
      guess,
      sourceEventId:
        safeString(payload.eventId,"",100),
      at:Date.now()
    };

    sendEvent("GAME_EVENT",resultPayload);
    applyGuessResult(resultPayload);
  }

  function applyGuessResult(payload){
    if(
      !payload ||
      payload.roundId!==roundId ||
      payload.turnIndex!==currentTurnIndex ||
      payload.type!=="GUESS_RESULT"
    ){
      return;
    }

    const uid=safeString(
      payload.userId,
      "",
      64
    );

    const guess=safeString(
      payload.guess,
      "",
      CONFIG.MAX_GUESS_LENGTH
    );

    if(!uid || !guess){
      return;
    }

    appendChatMessage({
      chatKey:
        "GUESS_RESULT|"+
        roundId+"|"+
        currentTurnIndex+"|"+
        uid+"|"+
        safeString(payload.sourceEventId,"",100),
      roundId,
      turnIndex:currentTurnIndex,
      userId:uid,
      username:
        safeString(
          payload.username,
          players.get(uid)?.username||"玩家",
          CONFIG.MAX_NAME_LENGTH
        ),
      text:guess,
      isCorrect:false,
      isSystem:false
    });

    render();
    scheduleChatScroll();
  }

  /* =========================================================
     RESULT
  ========================================================= */

  function participantPlayers(){

    return [
      ...participants
    ]
      .map(
        id=>
          players.get(id)
      )
      .filter(Boolean);
  }

  function buildRewards(){

    const all=
      participantPlayers()
        .sort(
          (a,b)=>
            finite(
              b.score,
              0
            )-
            finite(
              a.score,
              0
            )||
            a.id.localeCompare(
              b.id
            )
        );

    const rewards={};

    const scoreTotal=
      all.reduce(
        (sum,p)=>
          sum+
          intClamp(
            p.score,
            0,
            100000
          ),
        0
      );

    if(
      scoreTotal<=0
    ){

      const each=
        all.length
          ?Math.floor(
            prizePool/
            all.length
          )
          :0;

      all.forEach(
        p=>{

          p.reward=
            each;

          rewards[p.id]=
            each;
        }
      );

    }else{

      let used=0;

      all.forEach(
        (p,i)=>{

          let reward;

          if(
            i===
            all.length-1
          ){

            reward=
              prizePool-used;

          }else{

            reward=
              Math.floor(
                prizePool*
                p.score/
                scoreTotal
              );

            used+=reward;
          }

          p.reward=
            intClamp(
              reward,
              0,
              prizePool
            );

          rewards[p.id]=
            p.reward;
        }
      );
    }

    return {
      all,
      rewards
    };
  }

  function finishMatchAsHost(
    reason
  ){

    if(!DEV && !sdkIsHost){
      return;
    }

    if(matchEnded){
      return;
    }

    matchEnded=true;
    stopVoiceGuess();

    state=
      STATES.RESULT;

    finalReason=
      reason;

    const result=
      buildRewards();

    const snapshot=
      result.all.map(
        p=>({

          id:p.id,

          username:
            p.username,

          score:
            intClamp(
              p.score,
              0,
              100000
            ),

          reward:
            intClamp(
              p.reward,
              0,
              prizePool
            )
        })
      );

    const payload={

      roundId,

      reason,

      prizePool,

      rewards:
        result.rewards,

      scores:
        snapshot,

      at:
        Date.now()
    };

    sendEvent(
      "ROUND_END",
      payload
    );

    applyRoundEnd(
      payload
    );
  }

  function callGameOver(
    reward
  ){

    if(gameOverCalled){
      return;
    }

    gameOverCalled=true;

    try{

      if(
        window.BoomRoomSDK &&
        typeof
          window.BoomRoomSDK
            .gameOver===
          "function"
      ){

        window.BoomRoomSDK.gameOver({

          reward:
            intClamp(
              reward,
              0,
              prizePool
            )
        });
      }

    }catch(err){

      console.warn(
        "gameOver callback error",
        err
      );
    }
  }

  function applyRoundEnd(
    payload
  ){

    if(
      !payload ||
      payload.roundId!==roundId
    ){

      return;
    }

    if(appliedRoundEndId===roundId){
      return;
    }

    appliedRoundEndId=roundId;
    matchEnded=true;

    state=
      STATES.RESULT;

    finalReason=
      safeString(
        payload.reason,
        "本局已結束",
        60
      );

    const snapshot=
      Array.isArray(
        payload.scores
      )
        ?payload.scores
        :[];

    for(
      const row of snapshot
    ){

      if(
        row.id==null
      ){
        continue;
      }

      const rowId=
        String(row.id);

      const p=
        players.get(rowId)||
        addPlayer(
          rowId,
          row.username||
            "玩家",
          ""
        );

      if(p){

        p.score=
          intClamp(
            row.score,
            0,
            100000
          );

        p.reward=
          intClamp(
            row.reward,
            0,
            prizePool
          );
      }
    }

    const meRow=
      snapshot.find(
        x=>
          String(x.id)===
          String(ME.id)
      );

    finalReward=
      intClamp(
        meRow
          ?meRow.reward
          :0,
        0,
        prizePool
      );

    const ranking=
      [...snapshot]
        .sort(
          (a,b)=>
            intClamp(
              b.score,
              0,
              100000
            )-
            intClamp(
              a.score,
              0,
              100000
            )
        );

    const myIndex=
      ranking.findIndex(
        x=>
          String(x.id)===
          String(ME.id)
      );

    finalRank=
      myIndex>=0
        ?myIndex+1
        :1;

    callGameOver(
      finalReward
    );

    render();

    setTimeout(() => {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ action: 'leaveGame' }, '*');
      } else {
        try { window.close(); } catch(e){}
      }
    }, 3000);
  }

  /* =========================================================
     EVENT HANDLER
  ========================================================= */

  function handleEvent(
    userId,
    eventName,
    payload
  ){
    /*
      所有 SDK 事件統一去重，不只 GUESS。
      這可避免 TURN_START / TURN_END / ROUND_END
      被房間重送後再次執行與再次顯示。
    */
    const incomingEventId=
      safeString(
        payload?.eventId,
        "",
        100
      );

    if(incomingEventId){
      if(
        seenEvents.has(
          incomingEventId
        )
      ){
        return;
      }

      seenEvents.add(
        incomingEventId
      );

      if(
        seenEvents.size>1000
      ){
        const first=
          seenEvents.values()
            .next()
            .value;

        if(first){
          seenEvents.delete(
            first
          );
        }
      }
    }

    const knownUser=
      players.get(
        userId
      );

    if(knownUser){

      knownUser.lastSeen=
        Date.now();
    }

    if(
      eventName===
      "PLAYER_HELLO"
    ){

      addPlayer(
        userId,
        payload.username,
        payload.avatar,
        "READY"
      );

      render();

      return;
    }

    if(
      eventName===
      "ROUND_START"
    ){

      applyRoundStart(
        payload
      );

      return;
    }

    if(
      eventName===
      "TURN_START"
    ){

      applyTurnStart(
        payload
      );

      return;
    }

    if(
      eventName===
      "TURN_END"
    ){

      applyTurnEnd(
        payload
      );

      return;
    }

    if(
      eventName===
      "GAME_EVENT"
    ){

      if(
        !payload ||
        typeof payload!=="object"
      ){

        return;
      }

      /* 題型投票 */

      if(
        payload.type===
        "SELECT_CAT"
      ){

        const value=
          safeString(
            payload.categoryId,
            "",
            30
          );

        if(
          CATEGORIES.some(
            c=>c.id===value
          )
        ){

          categoryVotes.set(
            String(userId),
            value
          );
        }

        render();

      }

      /* 輪數投票 */

      else if(
        payload.type===
        "SELECT_RND"
      ){

        const value=
          intClamp(
            Number(
              payload.rounds
            ),
            1,
            5
          );

        if(
          [1,3,5]
            .includes(value)
        ){

          roundsVotes.set(
            String(userId),
            value
          );
        }

        render();

      }

      /* 秒數投票 */

      else if(
        payload.type===
        "SELECT_SEC"
      ){

        const value=
          intClamp(
            Number(
              payload.turnSeconds
            ),
            15,
            60
          );

        if(
          [15,30,45,60]
            .includes(value)
        ){

          secondsVotes.set(
            String(userId),
            value
          );
        }

        render();

      }

      /* 猜答案：先給房主判定，不能直接顯示原文 */

      else if(
        payload.type===
        "GUESS"
      ){

        if(DEV || sdkIsHost){
          processGuessAsHost(payload);
        }

      }

      /* 猜錯後才把原猜詞同步給所有人 */

      else if(
        payload.type===
        "GUESS_RESULT"
      ){

        applyGuessResult(payload);

      }

      /* 猜中排名同步：第 1 / 2 / 3 名各自獨立計分 */

      else if(
        payload.type===
        "GUESS_CORRECT"
      ){

        applyGuessCorrect(payload);

      }

      /* 跳過 */

      else if(
        payload.type===
        "SKIP_TURN" &&
        payload.turnIndex===
          currentTurnIndex
      ){

        resolveTurnAsHost(
          "SKIP",
          payload.userId
        );

      }

      /* 畫筆 */

      else if(
        payload.type===
        "STROKE" &&
        !isDrawer()
      ){

        receiveStroke(
          payload.stroke
        );

      }

      /* 清除 */

      else if(
        payload.type===
        "CLEAR_CANVAS" &&
        !isDrawer()
      ){

        knownStrokes=[];

        redrawCanvas();
      }

      /* 復原 */

      else if(
        payload.type===
        "UNDO_STROKE" &&
        !isDrawer()
      ){

        removeKnownStroke(
          payload.strokeId
        );

        redrawCanvas();
      }

      return;
    }

    if(
      eventName===
      "ROUND_END"

  function renderPlayers(){

        .sort(
          (a,b)=>
            finite(
              a.joinedAt,
              0
            )-
            finite(
              b.joinedAt,
              0
            )||
            a.id.localeCompare(
              b.id
            )
        )

          0,

      return `
        <div class="player">

        const you=
          p.id===ME.id;

        const turn=
          p.id===
          currentDrawerId;

        const role=
          turn
            ?" 🎨"
            :"";

        return `

            you

            turn
              ?"drawer"
              :""
          }">

              ${esc(

                  :""

      if(
        state===
        STATES.LOBBY

  /* =========================================================
     VOICE GUESS
     使用瀏覽器 Web Speech API（需要玩家允許麥克風）。
     這不是直接讀取 BoomRoom 語音房的原始音訊；目前檔案使用的
     BoomRoomSDK 介面只有 getUser / sendGameEvent / gameOver，
     沒有語音轉文字 API，因此只能做「瀏覽器麥克風語音猜題」。
  ========================================================= */

  function stopVoiceGuess(){
    if(speechRecognition){
      try{ speechRecognition.stop(); }catch(_){}
    }
    speechListening=false;
    const btn=document.getElementById("voiceBtn");
    if(btn){
      btn.textContent="🎙️ 語音偵測中";
      btn.title="語音即時答題中";
    }
  }

  function startVoiceGuess(){
    if(state!==STATES.PLAYING || isDrawer() || matchEnded || (Array.isArray(correctGuessers) && correctGuessers.some(x=>x.id===ME.id))){
      stopVoiceGuess();
      return;
    }

    const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    const btn=document.getElementById("voiceBtn");

    if(!Recognition){
      if(btn){ btn.textContent="🎙️ 語音房通暢中 (打字答題)"; }
      return;
    }

    if(speechListening) return;

    ensureAudio();
    speechFinalText="";
    try{
      speechRecognition=new Recognition();
      speechRecognition.lang="zh-TW";
      speechRecognition.continuous=true;
      speechRecognition.interimResults=true;
      speechRecognition.maxAlternatives=3;

      speechRecognition.onstart=()=>{
        speechListening=true;
        if(btn){ btn.textContent="🎙️ 語音即時答題中"; }
      };

      speechRecognition.onresult=(event)=>{
        for(let i=event.resultIndex; i<event.results.length; i++){
          const transcript = event.results[i][0]?.transcript || "";
          if(transcript.trim()){
            const text = transcript.trim();
            const input = document.getElementById("guessInput");
            if(input) input.value = text;

            if(currentWord && answerMatches(text, currentWord)){
              submitGuess();
              showToast("🎙️ 語音偵測到正確答案：「" + text + "」！");
              break;
            }
          }
        }
      };

      speechRecognition.onerror=(event)=>{
        if(event?.error === "no-speech") return;
        speechListening=false;
        if(btn){ btn.textContent="🎙️ 語音房通暢中 (打字答題)"; }
      };

      speechRecognition.onend=()=>{
        speechListening=false;
        if(state===STATES.PLAYING && !isDrawer() && !matchEnded && !(Array.isArray(correctGuessers) && correctGuessers.some(x=>x.id===ME.id))){
          setTimeout(startVoiceGuess, 300);
        }
      };

      speechRecognition.start();
    }catch(_){
      speechListening=false;
      if(btn){ btn.textContent="🎙️ 語音房通暢中 (打字答題)"; }
    }
  }

  /* =========================================================
     GAME LOOP
  ========================================================= */

  function gameLoop(ts){

    if(!rafRunning){
      return;
    }

    const dt=
      Math.min(
        Math.max(
          (ts-lastFrame)/1000,
          0
        ),
        0.033
      );

    lastFrame=ts;

    fps=
      0.9*fps+
      0.1*
      (
        1/
        Math.max(
          dt,
          0.001
        )
      );

    if(
      state===
        STATES.PLAYING &&
      !matchEnded
    ){

      const now=
        Date.now();

      if(
        (DEV || sdkIsHost) &&
        now>=
        currentTurnStartedAt+
        activeTurnSeconds*1000
      ){

        resolveTurnAsHost(
          "TIMEOUT",
          ""
        );
      }

      const timer=
        document.getElementById(
          "gameTimer"
        );

      if(timer){

        timer.textContent=
          String(
            Math.max(
              0,
              Math.ceil(
                (
                  currentTurnStartedAt+
                  activeTurnSeconds*1000-
                  now
                )/1000
              )
            )
          );
      }
    }

    loopHandle=
      requestAnimationFrame(
        gameLoop
      );
  }

      }
    }
  }
