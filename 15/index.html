<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#070912">

  <title>爆爆你畫我猜</title>

  <style>
    :root{
      --bg:#070912;
      --panel:#111625;
      --panel2:#161c2d;
      --line:#2b3550;
      --text:#f7f8fb;
      --muted:#98a3ba;
      --cyan:#62e7ff;
      --purple:#b76cff;
      --green:#4ee08a;
      --red:#ff637a;
      --gold:#ffd166;
      --yellow:#ffc857;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      user-select:none;
    }

    body{
      min-height:100dvh;
    }

    button,
    input{
      font:inherit;
    }

    button{
      border:0;
      color:var(--text);
      cursor:pointer;
      touch-action:manipulation;
    }

    button:disabled{
      opacity:.45;
      cursor:default;
    }

    #app{
      width:100%;
      height:100dvh;
      display:flex;
      justify-content:center;
    }

    .shell{
      width:min(100%,1400px);
      max-width:1400px;
      height:100%;
      display:flex;
      flex-direction:column;
      padding:
        calc(4px + env(safe-area-inset-top))
        clamp(10px,2vw,28px)
        calc(4px + env(safe-area-inset-bottom));
      gap:clamp(8px,1vw,14px);
    }

    .screen{
      flex:1 1 auto;
      width:100%;
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:clamp(8px,1vw,12px);
      overflow-y:auto;
      overscroll-behavior:contain;
    }

    .panel{
      background:
        linear-gradient(
          180deg,
          var(--panel2),
          var(--panel)
        );
      border:1px solid var(--line);
      border-radius:18px;
      padding:12px;
    }

    .center{
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .hero{
      padding:16px 14px;
    }

    .hero h1{
      font-size:clamp(27px,7vw,46px);
      line-height:1.04;
      margin:0;
    }

    .hero p{
      margin-top:7px;
      color:var(--muted);
      font-size:13px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:6px;
    }

    .stat{
      padding:8px 5px;
      background:#0b0f18;
      border:1px solid var(--line);
      border-radius:12px;
      text-align:center;
      min-width:0;
    }

    .stat b{
      display:block;
      font-size:15px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .stat span{
      font-size:9px;
      color:var(--muted);
    }

    .sectionTitle{
      font-size:13px;
      font-weight:1000;
      margin-bottom:8px;
    }

    .muted{
      color:var(--muted);
    }

    .tiny{
      font-size:10px;
      line-height:1.45;
    }

    .cta{
      width:100%;
      min-height:54px;
      border-radius:16px;
      background:
        linear-gradient(
          135deg,
          var(--cyan),
          var(--purple)
        );
      color:#070912;
      font-weight:1000;
      font-size:17px;
      box-shadow:0 8px 24px #0005;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      touch-action:manipulation;
    }

    .cta:active,
    .secondary:active,
    .iconBtn:active,
    .tool:active,
    .chip:active{
      transform:scale(.96);
    }

    .cta:disabled{
      background:#333;
      color:#888;
      box-shadow:none;
    }

    .secondary{
      background:#192032;
      color:#fff;
      border:1px solid var(--line);
      box-shadow:none;
    }

    .danger{
      background:#2a1520;
      border-color:#663246;
    }

    .good{
      background:#153225;
      border-color:#2f7950;
    }

    .row{
      display:flex;
      gap:8px;
    }

    .row>*{
      flex:1;
      min-width:0;
    }

    .notice{
      min-height:23px;
      color:#d1d6e4;
      font-size:11px;
      text-align:center;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* =========================
       VOTING
    ========================= */

    .voteGrid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .chip{
      min-height:52px;
      border-radius:14px;
      background:#0d1220;
      border:1px solid var(--line);
      padding:8px 12px;
      text-align:left;
      font-weight:900;
      font-size:14px;
      cursor:pointer;
      touch-action:manipulation;
      pointer-events:auto;
      user-select:none;
      transition:
        border-color .15s,
        box-shadow .15s,
        background .15s,
        transform .1s;
    }

    .chip small{
      display:block;
      color:var(--muted);
      font-size:10px;
      font-weight:700;
      margin-top:3px;
    }

    .chip.active{
      border-color:var(--cyan);
      box-shadow:
        0 0 0 2px #62e7ff66,
        0 0 18px #62e7ff22;
      background:#112333;
      color:var(--cyan);
    }

    .voteBar{
      height:6px;
      border-radius:999px;
      background:#0c101a;
      overflow:hidden;
    }

    .voteBar span{
      display:block;
      height:100%;
      background:
        linear-gradient(
          90deg,
          var(--cyan),
          var(--purple)
        );
      width:0%;
    }

    /* =========================
       PLAYERS
    ========================= */

    .players{
      display:flex;
      gap:6px;
      overflow:hidden;
      overflow-x:auto;
      padding-bottom:4px;
    }

    .player{
      min-width:102px;
      max-width:136px;
      padding:7px 9px;
      border-radius:11px;
      background:#0b101c;
      border:1px solid var(--line);
      font-size:10px;
      flex:0 0 auto;
    }

    .player b{
      display:block;
      font-size:12px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .player em{
      display:block;
      font-style:normal;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .player.me{
      border-color:#42537b;
    }

    .player.drawer{
      box-shadow:
        inset 0 0 0 1px #b76cff33;
    }

    /* =========================
       GAME
    ========================= */

    .hud{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:6px;
      flex:0 0 auto;
    }

    .pill{
      background:#0d1220;
      border:1px solid var(--line);
      border-radius:12px;
      padding:7px 9px;
      font-size:10px;
      min-width:0;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:4px;
    }

    .pill b{
      font-size:14px;
    }

    .pill.centerText{
      text-align:center;
    }

    .timerWarn{
      color:#ffcf70;
      border-color:#735b28;
    }

    #canvasWrap{
      position:relative;
      width:100%;
      height:clamp(280px,58dvh,720px);
      min-height:280px;
      flex:0 1 auto;
      border-radius:18px;
      overflow:hidden;
      border:1px solid #30394f;
      background:#f7f8fb;
      touch-action:none;
      box-shadow:0 0 0 1px #ffffff07;
    }

    #drawCanvas,
    #previewCanvas{
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
      -webkit-user-drag:none;
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      touch-action:none !important;
      overscroll-behavior:none;
      user-select:none;
      -webkit-user-select:none;
      -webkit-user-drag:none;
      -webkit-touch-callout:none;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    #drawCanvas{
      z-index:1;
      cursor:crosshair;
    }

    #previewCanvas{
      z-index:2;
      pointer-events:none;
      cursor:crosshair;
    }

    #canvasWrap{
      -webkit-touch-callout:none;
      -webkit-user-select:none;
      user-select:none;
      overscroll-behavior:none;
    }

    .roleBadge,
    #turnBadge,
    .turnBadge{
      position:absolute;
      top:9px;
      padding:6px 8px;
      border-radius:9px;
      background:#111625e8;
      border:1px solid #ffffff20;
      font-size:10px;
      font-weight:900;
      z-index:3;
      pointer-events:none;
    }

    .roleBadge{
      left:9px;
    }

    .turnBadge{
      right:9px;
    }

    .wordBadge{
      position:absolute;
      top:9px;
      left:50%;
      transform:translateX(-50%);
      padding:7px 11px;
      border-radius:999px;
      background:#111625e8;
      border:1px solid #ffffff20;
      font-weight:1000;
      font-size:13px;
      z-index:3;
      pointer-events:none;
      max-width:70%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .wordRevealLine{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      margin-top:3px;
      font-size:15px;
      letter-spacing:2px;
      min-height:22px;
    }

    .wordRevealChar{
      display:inline-flex;
      min-width:18px;
      justify-content:center;
      font-weight:1000;
    }

    .wordRevealChar.revealed{
      color:var(--gold);
      text-shadow:0 0 10px #ffd16655;
      animation:revealPop .22s ease-out;
    }

    @keyframes revealPop{
      0%{transform:scale(.72);opacity:.2;}
      100%{transform:scale(1);opacity:1;}
    }

    .timeoutAnswerOverlay{
      position:fixed;
      inset:0;
      z-index:120;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:rgba(7,9,18,.92);
      backdrop-filter:blur(8px);
      pointer-events:none;
      opacity:0;
      animation:timeoutAnswerIn .16s ease-out forwards;
    }

    .timeoutAnswerCard{
      width:min(92vw,760px);
      min-height:220px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:12px;
      text-align:center;
      padding:28px 22px;
      border:2px solid var(--gold);
      border-radius:28px;
      background:linear-gradient(180deg,#182033,#0d1220);
      box-shadow:0 0 0 4px #ffd16618,0 24px 80px #0008,0 0 50px #ffd16622;
    }

    .timeoutAnswerLabel{
      font-size:clamp(18px,4vw,30px);
      font-weight:1000;
      color:#fff;
    }

    .timeoutAnswerText{
      font-size:clamp(52px,12vw,112px);
      line-height:1;
      font-weight:1000;
      letter-spacing:clamp(2px,1vw,10px);
      color:var(--gold);
      text-shadow:0 0 18px #ffd16666,0 0 50px #ffd16622;
      word-break:break-word;
    }

    @keyframes timeoutAnswerIn{
      from{opacity:0;transform:scale(.96);}
      to{opacity:1;transform:scale(1);}
    }

    .cursorHint{
      position:absolute;
      bottom:9px;
      left:50%;
      transform:translateX(-50%);
      padding:6px 9px;
      border-radius:9px;
      background:#111625d9;
      color:#dce2f2;
      font-size:9px;
      pointer-events:none;
      white-space:nowrap;
    }

    .tools{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
      align-items:center;
      align-content:flex-start;
      width:100%;
      overflow:visible;
      padding:2px 2px 5px;
      touch-action:manipulation;
    }

    .tool{
      width:44px;
      min-width:44px;
      height:44px;
      border-radius:13px;
      background:#101626;
      border:1px solid var(--line);
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      padding:0;
      font-size:21px;
      flex:0 0 auto;
      position:relative;
      box-shadow:0 2px 8px #0003;
    }

    .tool:focus-visible{outline:2px solid var(--cyan);outline-offset:1px;}
    .tool[data-tool]:active,.tool[data-size]:active,.tool.color:active{transform:scale(.93);}

    .sizeDot{
      display:block;
      width:var(--dot,8px);
      height:var(--dot,8px);
      border-radius:50%;
      background:#fff;
      box-shadow:0 0 0 1px #ffffff55;
    }
    .sizeDot.s3{--dot:5px;}
    .sizeDot.s6{--dot:8px;}
    .sizeDot.s10{--dot:13px;}
    .sizeDot.s18{--dot:18px;}
    .sizeDot.s26{--dot:23px;}

    .tool.active{
      outline:2px solid var(--cyan); outline-offset:-2px; background:#16253a;
    }
    .tool[data-tool="eraser"].active{outline-color:var(--gold);background:#302a1a;}

    .color.active{
      box-shadow:0 0 0 3px #62e7ff88, inset 0 0 0 2px #111625;
    }

    .color{
      width:42px;
      padding:0;
      border-radius:50%;
      border:3px solid #fff;
    }

    .sizeBtn{
      font-size:11px;
    }

    .guessArea{
      display:flex;
      gap:7px;
      flex:0 0 auto;
    }

    .guessArea input{
      flex:1;
      min-width:0;
      height:48px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#0d111c;
      color:#fff;
      padding:0 13px;
      outline:none;
      user-select:text;
    }

    .guessArea input:focus{
      border-color:var(--cyan);
    }

    .guessArea button{
      width:92px;
      border-radius:14px;
      background:var(--cyan);
      color:#061018;
      font-weight:1000;
      cursor:pointer;
    }

    .skipBtn{
      height:44px;
      min-width:86px;
      width:auto;
      border-radius:12px;
      background:#2a1820;
      border:1px solid #7a3c50;
      color:#fff;
      font-weight:1000;
      font-size:13px;
      padding:0 14px;
      cursor:pointer;
      white-space:nowrap;
      flex:0 0 auto;
    }

    .skipBtn:active{
      background:#3b1d29;
      transform:scale(.97);
    }

    .turnFeed{
      display:flex;
      justify-content:space-between;
      gap:6px;
      align-items:center;
      min-height:25px;
      padding:0 2px;
    }

    .feedText{
      font-size:11px;
      color:#d1d6e4;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .turnScore{
      font-size:10px;
      color:#b9c4d7;
      white-space:nowrap;
    }

    /* =========================
       RESULT
    ========================= */

    .result{
      display:flex;
      flex-direction:column;
      gap:11px;
    }

    .resultTitle{
      font-size:34px;
      font-weight:1000;
    }

    .reward{
      font-size:29px;
      color:var(--gold);
      font-weight:1000;
    }

    .rankList{
      display:flex;
      flex-direction:column;
      gap:6px;
      max-height:250px;
      overflow:auto;
    }

    .rankRow{
      display:grid;
      grid-template-columns:30px 1fr auto;
      gap:7px;
      align-items:center;
      padding:8px 9px;
      background:#0b101b;
      border:1px solid var(--line);
      border-radius:11px;
    }

    .rankNo{
      font-weight:1000;
      text-align:center;
    }

    .rankName{
      font-size:11px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .rankScore{
      font-size:11px;
      font-weight:1000;
    }

    .rankReward{
      font-size:9px;
      color:var(--gold);
      grid-column:2/4;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(18px + env(safe-area-inset-bottom));
      transform:translateX(-50%) translateY(20px);
      opacity:0;
      pointer-events:none;
      background:#101727f2;
      border:1px solid var(--line);
      padding:9px 13px;
      border-radius:12px;
      font-size:11px;
      z-index:80;
      transition:.18s;
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
      opacity:1;
    }

    .guessChatBox{
      background:#0b0f18;
      border:1px solid var(--line);
      border-radius:12px;
      padding:8px;
      width:100%;
      height:clamp(100px,16dvh,220px);
      min-height:100px;
      max-height:none;
      overflow-y:auto;
      overscroll-behavior:contain;
      display:flex;
      flex-direction:column;
      gap:4px;
      font-size:clamp(11px,1.1vw,13px);
      scroll-behavior:auto;
    }

    @media(min-width:900px){

      .shell{
        padding-left:28px;
        padding-right:28px;
        gap:12px;
      }

      .panel{
        padding:18px;
      }

      #canvasWrap{
        height:clamp(420px,62vh,760px);
        max-height:none;
      }
    }

    @media(min-width:1200px){
      #canvasWrap{
        height:clamp(500px,68vh,900px);
      }
    }

    @media(max-width:599px){
      #canvasWrap{
        height:clamp(280px,46vh,460px);
        flex-basis:auto;
      }
    }

    @media(min-width:600px){

      .shell{
        padding-left:clamp(18px,2.2vw,32px);
        padding-right:clamp(18px,2.2vw,32px);
      }

      .panel{
        padding:clamp(15px,1.4vw,22px);
      }

      .voteGrid{
        gap:clamp(8px,1vw,14px);
      }

      .chip{
        min-height:clamp(54px,5.2vw,72px);
        font-size:clamp(14px,1.35vw,17px);
      }

      #canvasWrap{
        height:clamp(360px,58dvh,720px);
      }

      .guessChatBox{
        height:clamp(120px,16dvh,240px);
      }
    }

    @media(min-width:1200px){
      .shell{
        padding-left:clamp(28px,2.5vw,44px);
        padding-right:clamp(28px,2.5vw,44px);
      }

      .hud{
        gap:10px;
      }

      .pill{
        padding:10px 12px;
        font-size:12px;
      }

      .pill b{
        font-size:16px;
      }
    }

    @media(max-height:650px) and (min-width:700px){
      #canvasWrap{
        height:clamp(300px,50dvh,520px);
      }

      .guessChatBox{
        height:clamp(90px,13dvh,150px);
      }
    }
    /* =========================
       VOICE MIC ANIMATION
    ========================= */
    #voiceBtn {
      transition: all 0.2s ease-in-out;
    }

    #voiceBtn.voice-active {
      background: #ff4757 !important; /* 變成醒目的紅色 */
      border-color: #ff4757 !important;
      box-shadow: 0 0 15px rgba(255, 71, 87, 0.6);
      animation: pulseMic 1.6s infinite;
    }

    @keyframes pulseMic {
      0% { transform: scale(1); }
      50% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>

<div id="app">
  <div class="shell">
    <main id="main" class="screen"></main>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  "use strict";

  /* =========================================================
     GAME INFO
  ========================================================= */

  const GAME_INFO={
    id:"boom_draw_guess",
    category:"派對競技",
    name:"爆爆你畫我猜",
    description:"常見詞彙輪流作畫，支援繁中語音，多人搶猜得分！",
    entryCost:100,
    maxPlayers:10,
    version:"2.5.2"
  };

  const CONFIG=Object.freeze({
    ENTRY_FEE:100,
    PLATFORM_FEE_RATE:0.10,
    MIN_PLAYERS:1,
    MAX_PLAYERS:10,
    LOBBY_COUNTDOWN_SECONDS:10,
    TURN_SECONDS:30,
    COUNTDOWN_SECONDS:3,
    HEARTBEAT_MS:4000,
    PLAYER_TIMEOUT_MS:12000,
    HOST_CHECK_MS:3000,
    HOST_CLAIM_GRACE_MS:6500,
    VOICE_LOCALE:"zh-TW",
    VOICE_LANGUAGE:"zh-TW",
    MAX_NAME_LENGTH:24,
    MAX_AVATAR_LENGTH:300,
    MAX_GUESS_LENGTH:32,
    MAX_STROKES:140,
    MAX_POINTS_PER_STROKE:1200,
    STROKE_BATCH_MS:70,
    MAX_STROKE_CHUNK_POINTS:80,
    STATE_SYNC_MIN_INTERVAL_MS:1200,
    MAX_SNAPSHOT_PLAYERS:10,
    MAX_SNAPSHOT_STROKES:80,
    MAX_SNAPSHOT_POINTS:5000,
    GUESS_REWARDS:[150,120,90],
    DRAWER_CORRECT_REWARD:100
  });

  const STATES=Object.freeze({
    LOBBY:"LOBBY",
    PLAYING:"PLAYING",
    COUNTDOWN:"COUNTDOWN",
    RESULT:"RESULT"
  });

  /* =========================================================
     題型：依「實際畫畫難度」分類
  ========================================================= */

  function buildWordBank(){
    const out={};
    for(const c of CATEGORIES){
      out[c.id]=
        (WORD_BANK[c.id]||[])
        .map((row,i)=>({
          id:c.id+"_"+i,
          answer:String(row[0]),
          aliases: Array.isArray(row[1]) ? row[1] : []
        }));
    }
    return out;
  }

  const WORDS=buildWordBank();

  /* =========================================================
     題庫洗牌：同一局固定順序、同一類別不重複
  ========================================================= */

  const WORD_ORDER_CACHE=new Map();

  function seededRandom(seed){
    let x=(Number(seed)>>>0)||1;
    return ()=>{
      x=(Math.imul(x ^ (x>>>15), 2246822519)+3266489917)>>>0;
      x^=x>>>13;
      x=Math.imul(x, 1274126177)>>>0;
      return (x>>>0)/4294967296;
    };
  }

  function shuffledWordIndexes(categoryId, seed){
    const key=String(seed)+"|"+String(categoryId);
    if(WORD_ORDER_CACHE.has(key)){
      return WORD_ORDER_CACHE.get(key);
    }
    const bank=WORDS[categoryId]||[];
    const arr=bank.map((_,i)=>i);
    const rand=seededRandom(stableHash(key));
    for(let i=arr.length-1; i>0; i--){
      const j=Math.floor(rand()*(i+1));
      [arr[i], arr[j]]=[arr[j], arr[i]];
    }
    WORD_ORDER_CACHE.set(key, arr);
    if(WORD_ORDER_CACHE.size>24){
      const first=WORD_ORDER_CACHE.keys().next().value;
      if(first){ WORD_ORDER_CACHE.delete(first); }
    }
    return arr;
  }

  /* =========================================================

  ========================================================= */

  function safeString(v, fallback, maxLen){
    if(v===null || v===undefined){ return fallback; }
    const s=String(v).trim();
    return s ? s.slice(0,maxLen) : fallback;
  }

  function finite(v, fallback=0){
    return Number.isFinite(v) ? v : fallback;
  }

  function clamp(v, min, max){
    return Math.min(max, Math.max(min, finite(v,min)));
  }

  function intClamp(v, min, max){
    return Math.floor(clamp(v,min,max));
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  }

  function stableHash(s){
    let h=2166136261>>>0;
    for(let i=0; i<s.length; i++){
      h^=s.charCodeAt(i);
      h=Math.imul(h, 16777619);
    }
    return h>>>0;
  }

  function makeRoundId(){
    return "round_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
  }

  function makeSeed(){
    return (Date.now() ^ Math.floor(Math.random()*0xffffffff))>>>0;
  }

  function normalizeText(s){
    return String(s||"")
      .normalize("NFKC")
      .toLowerCase()
      .replace(/[\s\u3000，。！？、,.!?;；:：'"“”‘’()（）\[\]{}<>《》【】「」『』]/g, "")
      .replace(/^(我猜|我覺得|我觉得|答案是|應該是|应该是|就是|是不是|我說|我说)/, "")
      .replace(/(啦|喔|哦|啊|欸|耶|呀|吧|耶)+$/g, "");
  }

  function getAnswerLength(word){
    const answer=safeString(word?.answer, "", 100).replace(/\s+/g,"").trim();
    return Array.from(answer).length;
  }

  function answerMatches(guess, word){
    const g=normalizeText(guess);
    if(!g || !word) return false;
    const candidates=[normalizeText(word.answer)].concat(Array.isArray(word.aliases)?word.aliases.map(normalizeText):[]).filter(Boolean);
    if(candidates.includes(g)) return true;

    // 語音常會多出「是、啊、喔、欸、耶、的」等語尾，允許只去掉少量語尾後再比對。
    const trimmed=g.replace(/(是|啊|喔|哦|欸|耶|的|啦|呀)+$/g, "");
    if(trimmed && candidates.includes(trimmed)) return true;

    // 句子中夾有「我猜／應該是／答案是」時，抽取候選答案，而不是無限制 includes。
    for(const c of candidates){
      if(c.length>=2 && (g.startsWith("我猜")||g.startsWith("答案")||g.includes("答案是"))){
        const compact=g.replace(/^(我猜|我覺得|應該是|答案是|答案|是)/g, "");
        if(compact===c || compact.replace(/(是|啊|喔|哦|欸|耶|的|啦|呀)+$/g, "")===c) return true;
      }
    }
    return false;
  }

  function addPlayer(id, username, avatar, status="READY"){
    if(id===null || id===undefined){ return null; }
    id=String(id);
    if(!id || id.length>64){ return null; }
    let p=players.get(id);

    if(!p){
      p={
        id,
        username: safeString(username, "玩家", CONFIG.MAX_NAME_LENGTH),
        avatar: safeString(avatar, "", CONFIG.MAX_AVATAR_LENGTH),
        status,
        paid:true,
        score:0,
        reward:0,
        lastSeen:Date.now(),
        joinedAt:Date.now(),
        correct:0,
        drawTurns:0,
        skips:0
      };
      players.set(id, p);
    }else{
      p.username=safeString(username, p.username, CONFIG.MAX_NAME_LENGTH);
      p.avatar=safeString(avatar, p.avatar, CONFIG.MAX_AVATAR_LENGTH);
      if(status) p.status = status;
      p.lastSeen=Date.now();
      p.paid=true;
    }
    return p;
  }

  ========================================================= */

  function nowMs(){ return Date.now(); }
  function gameNow(){ return nowMs()+clockOffsetMs; }
  function syncClock(hostNow){
    const n=Number(hostNow);
    if(Number.isFinite(n)&&n>0){ clockOffsetMs=Math.max(-120000,Math.min(120000,n-nowMs())); }
  }
  function bumpStateVersion(){ stateVersion=Math.max(0,Math.floor(stateVersion)+1); return stateVersion; }
  function acceptStateVersion(v){ const n=Number(v); if(Number.isFinite(n)&&n>=0) stateVersion=Math.max(stateVersion,Math.floor(n)); }

  function markPlayerSeen(id, username, avatar){
    const pid=safeString(id,"",64);
    if(!pid) return null;
    const p=addPlayer(pid, username, avatar, players.get(pid)?.status||"READY");
    if(p){ p.lastSeen=nowMs(); }
    return p;
  }

  function sortedLivePlayers(){
    return [...players.values()]
      .filter(p=>p && p.status!=="LEFT" && p.status!=="TIMEOUT" && nowMs()-finite(p.lastSeen,0)<=CONFIG.PLAYER_TIMEOUT_MS)
      .sort((a,b)=>finite(a.joinedAt,0)-finite(b.joinedAt,0)||String(a.id).localeCompare(String(b.id)));
  }

  function electedHostId(){
    const live=sortedLivePlayers();
    return live.length ? String(live[0].id) : String(ME.id||"");
  }

  function isLiveHost(id){
    const p=players.get(String(id||""));
    return !!p && p.status!=="LEFT" && p.status!=="TIMEOUT" && nowMs()-finite(p.lastSeen,0)<=CONFIG.PLAYER_TIMEOUT_MS;
  }

  function setCurrentHost(hostId, announce=false){
    const id=safeString(hostId,"",64);
    if(!id) return false;
    const changed=String(currentHostId)!==id;
    currentHostId=id;
    currentHostLastSeen=nowMs();
    hostElectionAt=0;
    if(changed && announce && id===ME.id){
      sendEvent("HOST_CLAIM", { roundId:roundId||"LOBBY", hostId:id, electedId:id, at:nowMs() }, { bypassAuthority:true });
      lastHostAnnounceAt=nowMs();
    }
    return changed;
  }

  function ensureHostAuthority(force=false){
    const elected=electedHostId();
    if(!elected) return false;

    const current=currentHostId;
    const currentAlive=isLiveHost(current);
    const hostStale=!current || !currentAlive || nowMs()-currentHostLastSeen>CONFIG.PLAYER_TIMEOUT_MS;

    if(!force && current && !hostStale){
      return String(current)===String(ME.id);
    }

    if(String(elected)!==String(ME.id)){
      if(!current || hostStale){ currentHostId=elected; currentHostLastSeen=nowMs(); }
      return false;
    }

    if(!hostClaimInFlight){
      hostClaimInFlight=true;
      hostElectionAt=nowMs();
      currentHostId=ME.id;
      currentHostLastSeen=nowMs();
      sendEvent("HOST_CLAIM", { roundId:roundId||"LOBBY", hostId:ME.id, electedId:ME.id, at:nowMs() }, { bypassAuthority:true });
      lastHostAnnounceAt=nowMs();
      setTimeout(()=>{ hostClaimInFlight=false; requestStateSnapshot(); }, 900);
    }
    return true;
  }

  function isLocalAuthority(){
    if(DEV) return true;

  function setupSDK(data){

    currentHostLastSeen=nowMs();
    currentHostId=sdkIsHost ? ME.id : safeString(data.hostId,"",64);

    if(Array.isArray(data.roomPlayers)){
      roomSeatPlayerIds.clear();
      const baseJoinTime=nowMs()-Math.max(0,data.roomPlayers.length-1)*20;
      data.roomPlayers.forEach((rp,index)=>{
        const pid=String(rp.id);
        roomSeatPlayerIds.add(pid);
        const p=addPlayer(pid, rp.username, rp.avatar, "READY");
        if(p){
          p.joinedAt=rp.joinedAt!=null ? finite(rp.joinedAt,p.joinedAt) : baseJoinTime+index*20;
        }
        if(!sdkIsHost && !currentHostId && (rp.isHost===true || rp.host===true || String(rp.role||"").toLowerCase()==="host")){
          currentHostId=pid;
        }
      });
    }

    if(sdkIsHost){
      currentHostId=ME.id;
      currentHostLastSeen=nowMs();
    }

    addPlayer(ME.id, ME.username, ME.avatar, "READY");

    if(!categoryVotes.has(String(ME.id))){ categoryVotes.set(String(ME.id), selectedCategory); }
    if(!roundsVotes.has(String(ME.id))){ roundsVotes.set(String(ME.id), selectedRounds); }

    render();

      currentHostId=ME.id;
      currentHostLastSeen=nowMs();

      sendEvent("HOST_HEARTBEAT", { roundId:roundId||"LOBBY", hostId:ME.id, at:gameNow() }, { bypassAuthority:true });

    sendEvent("PLAYER_HELLO", {
      roundId:roundId||"LOBBY",
      userId:ME.id,
      username:ME.username,
      avatar:ME.avatar,
      joinedAt:players.get(ME.id)?.joinedAt||nowMs(),

      roundsVote:roundsVotes.get(String(ME.id)),

    startHostMonitor();
    if(sdkIsHost || DEV) setTimeout(()=>broadcastLobbyState("setup",true),60);
    if(matchStarted) requestStateSnapshot();

  window.addEventListener("message", e=>{
    try{
      const data = typeof e.data==="string" ? JSON.parse(e.data) : e.data;
      if(data.action==="initSDK"){
        setupSDK(data);
        return;
      }

      if(data.action==="roomPlayersUpdated" && Array.isArray(data.roomPlayers)){
        const incomingIds=new Set();
        const baseJoinTime=nowMs()-Math.max(0,data.roomPlayers.length-1)*20;
        data.roomPlayers.forEach((rp,index)=>{
          if(!rp || rp.id==null) return;
          const pid=String(rp.id);
          incomingIds.add(pid);
          roomSeatPlayerIds.add(pid);
          const p=addPlayer(pid,rp.username,rp.avatar,"READY");
          if(p){
            p.joinedAt=rp.joinedAt!=null?finite(rp.joinedAt,p.joinedAt):baseJoinTime+index*20;
            p.lastSeen=nowMs();
          }
        });
        for(const pid of [...roomSeatPlayerIds]){
          if(!incomingIds.has(pid)){
            const p=players.get(pid);
            if(p) p.status="LEFT";
            roomSeatPlayerIds.delete(pid);
          }
        }
        addPlayer(ME.id,ME.username,ME.avatar,"READY");
        if(window.BoomRoomSDK) window.BoomRoomSDK.roomPlayers=data.roomPlayers;
        refreshPlayersOnly();
        if(!matchStarted && isLobbyAuthority()) setTimeout(()=>broadcastLobbyState("room_players_update",true),40);
        if(matchStarted && isLocalAuthority()) setTimeout(()=>broadcastStateSnapshot("room_players_update"),80);
        return;
      }

      // 🌟 新增：攔截 Flutter Web 傳來的語音辨識結果
      if(data.action === "flutterSpeechResult"){
        if(typeof window.receiveVoiceText === 'function') {
          window.receiveVoiceText(data.text, data.isFinal);
        }
        return;
      }

      // 🌟 新增：攔截 Flutter Web 傳來的語音停止事件
      if(data.action === "flutterSpeechStopped"){
        if(typeof window.onFlutterSpeechStopped === 'function') {
          window.onFlutterSpeechStopped();
        }
        return;
      }

      // 原本的遊戲事件攔截
      if(!data || data.action!=="gameEventReceived"){ return; }

      const userId=safeString(data.userId, "", 64);
      const eventName=safeString(data.eventName, "", 40);
      const payload=data.payload;

      if(!userId || !/^[A-Z0-9_]{1,40}$/.test(eventName) || !payload || typeof payload!=="object"){
        return;
      }
      handleEvent(userId, eventName, payload);
    }catch(err){
      console.error("message error", err);
    }
  });

  /* =========================================================

  ========================================================= */

  function sendEvent(eventName, payload, options={}){
    if(DEV){ return false; }
    if(!/^[A-Z0-9_]{1,40}$/.test(eventName) || !payload || typeof payload!=="object" || Array.isArray(payload)){
      return false;
    }

    const bypassAuthority=!!options.bypassAuthority;
    if(!bypassAuthority && !isLocalAuthority() && ["ROUND_START","TURN_START","TURN_END","ROUND_END","HOST_HEARTBEAT"].includes(eventName)){
      return false;
    }

    const eventId=safeString(payload.eventId, ME.id+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7), 80);
    const copy={ ...payload, senderId:ME.id, eventId };

    seenEvents.add(eventId);
    if(seenEvents.size>1000){
      const first=seenEvents.values().next().value;
      if(first){ seenEvents.delete(first); }
    }

    try{
      if(window.BoomRoomSDK && typeof window.BoomRoomSDK.sendGameEvent==="function"){
        window.BoomRoomSDK.sendGameEvent(eventName, copy);
        return true;
      }
      if(window.parent!==window){
        // 同時兼容 JSON bridge 與原生 object postMessage。
        window.parent.postMessage(JSON.stringify({ action:"sendGameEvent", eventName, payload:copy }), "*");
        return true;
      }
    }catch(err){
      try{
        if(window.parent!==window){
          window.parent.postMessage(JSON.stringify({ action:"sendGameEvent", eventName, payload:copy }), "*");
          return true;
        }
      }catch(_){}
      console.error("sendEvent error", err);
    }
    return false;
  }

  function setOwnVote(map, value){

  // 🌟 修正：只計算目前在房間內的有效玩家票數，避免離線玩家被計入
  function getVoteCount(map, value){
    let count = 0;
    for(const [uid, val] of map.entries()){
      const p = players.get(String(uid));
      if(!p || (p.status !== "LEFT" && p.status !== "TIMEOUT")){
        if(String(val) === String(value)) count++;
      }
    }
    return count;
  }

  function countVotes(map, options){
    return options.map(value=>({
      value,
      count: getVoteCount(map, value)
    }));
  }

  function pickVoteWinner(map, options, fallback){
    const rows=countVotes(map, options);
    const max=Math.max(0, ...rows.map(r=>r.count));
    if(max<=0){ return fallback; }

    const tied=rows.filter(r=>r.count===max).map(r=>r.value);
    const hostVote=map.get(String(currentHostId));
    if(tied.some(v=>String(v)===String(hostVote))){
      return hostVote;
    }
    return tied[0] ?? fallback;
  }

  /* =========================================================
     LOBBY
  ========================================================= */

  function lobbyParticipantList(){
    return [...players.values()]
      .filter(p=>p && p.status!=="LEFT" && p.status!=="TIMEOUT")
      .sort((a,b)=>finite(a.joinedAt,0)-finite(b.joinedAt,0)||String(a.id).localeCompare(String(b.id)))
      .slice(0,CONFIG.MAX_SNAPSHOT_PLAYERS);
  }

  function buildLobbySync(reason){
    return {
      roundId:roundId||"LOBBY",
      type:"LOBBY_SYNC",
      lobbyVersion:++lobbySyncVersion,
      hostId:ME.id,
      hostNow:gameNow(),
      deadlineAt:lobbyDeadlineAt||gameNow()+CONFIG.LOBBY_COUNTDOWN_SECONDS*1000,
      reason,
      players:lobbyParticipantList().map(p=>({id:p.id,username:p.username,avatar:p.avatar,status:p.status,joinedAt:finite(p.joinedAt,nowMs())})),
      votes:{
        category:[...categoryVotes.entries()].map(([id,value])=>[String(id),String(value)]),
        rounds:[...roundsVotes.entries()].map(([id,value])=>[String(id),normalizeRounds(value)]),
        seconds:[...secondsVotes.entries()].map(([id,value])=>[String(id),normalizeTurnSeconds(value)])
      }
    };
  }

  function broadcastLobbyState(reason="sync", force=false){
    if(matchStarted || !isLobbyAuthority()) return;
    const now=nowMs();
    if(!lobbyDeadlineAt) lobbyDeadlineAt=gameNow()+CONFIG.LOBBY_COUNTDOWN_SECONDS*1000;
    if(!force && now-lastLobbySyncSentAt<120) return;
    lastLobbySyncSentAt=now;
    sendEvent("GAME_EVENT",buildLobbySync(reason),{bypassAuthority:true});
  }

  function startLobbyAutoCountdown(){
    clearInterval(lobbyTimer);
    if(matchStarted) return;
    if(isLobbyAuthority() && !lobbyDeadlineAt){
      lobbyDeadlineAt=gameNow()+CONFIG.LOBBY_COUNTDOWN_SECONDS*1000;
      broadcastLobbyState("countdown_start",true);
    }
    const tick=()=>{
      if(matchStarted || lobbyResolved){ clearInterval(lobbyTimer); return; }
      const remainMs=lobbyDeadlineAt ? Math.max(0,lobbyDeadlineAt-gameNow()) : CONFIG.LOBBY_COUNTDOWN_SECONDS*1000;
      lobbySecondsLeft=Math.max(0,Math.ceil(remainMs/1000));
      const el=document.getElementById("lobbySecText");
      if(el) el.textContent=String(lobbySecondsLeft);
      const syncEl=document.getElementById("lobbySyncText");
      if(syncEl) syncEl.textContent=lobbyDeadlineAt ? (isLobbyAuthority()?"房主裁決中，票數已即時同步":"等待房主同步開局") : "正在同步房主狀態…";
      if(remainMs<=0){
        clearInterval(lobbyTimer);
        if(isLobbyAuthority()) resolveLobbyVotesAsHost();
        else render();
        return;
      }
      render();
    };
    tick();
    lobbyTimer=setInterval(tick,250);
  }

  function resolveLobbyVotesAsHost(){
    if(matchStarted || lobbyResolved || !isLobbyAuthority()) return;
    lobbyResolved=true;
    selectedCategory=pickVoteWinner(categoryVotes,CATEGORIES.map(c=>c.id),selectedCategory);
    selectedRounds=pickVoteWinner(roundsVotes,ROUND_OPTIONS,normalizeRounds(selectedRounds));
    selectedTurnSeconds=pickVoteWinner(secondsVotes,TURN_OPTIONS,normalizeTurnSeconds(selectedTurnSeconds));
    activeTurnSeconds=selectedTurnSeconds;
    render();
    startDirectGameAsHost();
  }

  function startDirectGameAsHost(){
    if(!isLobbyAuthority()){ return; }
    if(matchStarted){ return; }
    clearInterval(lobbyTimer);

    roundId=makeRoundId();
    roundSeed=makeSeed();
    lobbyResolved=true;
    lobbyDeadlineAt=0;
    currentHostId=ME.id;
    currentHostLastSeen=nowMs();
    selectedRounds=normalizeRounds(selectedRounds);
    selectedTurnSeconds=normalizeTurnSeconds(selectedTurnSeconds);
    activeTurnSeconds=selectedTurnSeconds;
    addPlayer(ME.id, ME.username, ME.avatar, "READY");

    startRoundAsHost(selectedCategory);
  }

  /* =========================================================
     ROUND START
  ========================================================= */

  function startRoundAsHost(category){
    if(matchStarted){ return; }

    const allList=[...players.values()].filter(p=>p && p.status!=="LEFT" && p.status!=="TIMEOUT");
    if(allList.length===0){
      allList.push(players.get(ME.id)||addPlayer(ME.id, ME.username, ME.avatar, "READY"));
    }

    participants.clear();
    allList.forEach(p=>{
      if(!p) return;
      p.paid=true;
      p.status="READY";
      p.score=0;
      p.reward=0;
      p.correct=0;
      p.drawTurns=0;
      p.skips=0;
      participants.add(p.id);
    });

    totalPool=participants.size*CONFIG.ENTRY_FEE;
    platformFee=Math.floor(totalPool*CONFIG.PLATFORM_FEE_RATE);
    prizePool=totalPool-platformFee;

    matchStarted=true;
    matchEnded=false;
    gameOverCalled=false;
    stateVersion=bumpStateVersion();
    roundStartAt=gameNow()+1000;

    const baseOrder=[...participants];
    turnOrder=[];
    totalTurnsPerPlayer=intClamp(selectedRounds,1,5);

    for(let r=0; r<totalTurnsPerPlayer; r++){
      for(const id of baseOrder){
        turnOrder.push(id);
      }
    }

    totalTurnCount=turnOrder.length;

    const payload={
      roundId,
      stateVersion,
      hostNow:gameNow(),
      seed:roundSeed,
      startTime:roundStartAt,
      category:selectedCategory,
      participantIds:baseOrder,
      turnOrder,
      rounds:totalTurnsPerPlayer,
      turnSeconds:selectedTurnSeconds
    };

    sendEvent("ROUND_START", payload);
    applyRoundStart(payload);
  }

  function applyRoundStart(payload){
    if(!payload || typeof payload!=="object"){ return; }

    const incomingRoundId=safeString(payload.roundId, "", 100);
    if(!incomingRoundId){ return; }
    if(incomingRoundId===appliedRoundStartId){ return; }

    appliedRoundStartId=incomingRoundId;
    appliedRoundEndId="";
    lobbyResolved=true;
    lobbyDeadlineAt=0;
    clearInterval(lobbyTimer);
    turnStartSeenKeys.clear();
    turnEndSeenKeys.clear();

    if(payload.roundId){ roundId=safeString(payload.roundId, roundId, 100); }
    acceptStateVersion(payload.stateVersion);
    syncClock(payload.hostNow);
    roundSeed=finite(payload.seed, 0)>>>0;
    roundStartAt=finite(payload.startTime, gameNow());
    selectedCategory=safeString(payload.category, CATEGORIES[0].id, 30);

    if(payload.turnSeconds){
      activeTurnSeconds=normalizeTurnSeconds(payload.turnSeconds);
      selectedTurnSeconds=activeTurnSeconds;
    }

    const ids=Array.isArray(payload.participantIds) ? payload.participantIds.filter(x=>typeof x==="string") : [ME.id];
    const incomingOrder=Array.isArray(payload.turnOrder) ? payload.turnOrder.filter(x=>typeof x==="string") : [];

    turnOrder=incomingOrder.length ? incomingOrder : ids;
    totalTurnCount=turnOrder.length;
    totalTurnsPerPlayer=normalizeRounds(payload.rounds);
    selectedRounds=totalTurnsPerPlayer;

    participants.clear();
    guessHistory=[];
    chatSeenKeys.clear();
    WORD_ORDER_CACHE.clear();

    ids.forEach(id=>{
      participants.add(id);
      const p=players.get(id)||addPlayer(id, "玩家", "", "READY");
      if(p){ p.status="READY"; p.score=0; }
    });

    currentTurnIndex=-1;
    currentDrawerId="";
    currentTurnResolved=false;
    currentRequiredCorrectCount=getRequiredCorrectCount();
    currentWord=null;
    resetRevealState();
    knownStrokes=[];
    localStrokeIds=[];
    currentStroke=null;
    matchStarted=true;
    matchEnded=false;
    state=STATES.COUNTDOWN;
    countdownValue=CONFIG.COUNTDOWN_SECONDS;

    render();
    startCountdown();
  }

  /* =========================================================
     COUNTDOWN
  ========================================================= */

  function startCountdown(){
    clearTimeout(turnStateTimer);
    state=STATES.COUNTDOWN;
    const goAt=finite(roundStartAt,0)>0 ? finite(roundStartAt,gameNow()+CONFIG.COUNTDOWN_SECONDS*1000) : gameNow()+CONFIG.COUNTDOWN_SECONDS*1000;
    roundStartAt=goAt;
    let lastShown=-1;
    const tick=()=>{
      if(matchEnded) return;
      const remainMs=goAt-gameNow();
      const next=Math.max(0,Math.ceil(remainMs/1000));
      if(next!==lastShown){ if(next>0) playTone(520+next*80,.06); lastShown=next; }
      countdownValue=next;
      render();
      if(remainMs<=0){
        if(isLocalAuthority()) startNextTurnAsHost();
        else turnStateTimer=setTimeout(tick,100);
        return;
      }
      turnStateTimer=setTimeout(tick,100);
    };
    tick();
  }

  /* =========================================================
     GAME OPTIONS / REVEAL HINTS
  ========================================================= */

  function normalizeRounds(v){
    const n=Number(v);
    return ROUND_OPTIONS.includes(n) ? n : 3;
  }

  function normalizeTurnSeconds(v){
    const n=Number(v);
    return TURN_OPTIONS.includes(n) ? n : 30;
  }

  function buildRevealIndexes(word){
    const answer=String(word?.answer||'');
    const len=Array.from(answer).length;
    const maxReveal=Math.max(0,Math.min(2,len-1));
    if(maxReveal<=0) return [];
    const indexes=Array.from({length:len},(_,i)=>i);
    const rand=seededRandom(stableHash(String(roundSeed)+'|'+String(currentTurnIndex)+'|REVEAL'));
    for(let i=indexes.length-1;i>0;i--){
      const j=Math.floor(rand()*(i+1));
      [indexes[i],indexes[j]]=[indexes[j],indexes[i]];
    }
    return indexes.slice(0,maxReveal).sort((a,b)=>a-b);
  }

  function resetRevealState(){
    revealedCharCount=0; revealStage=0; revealedCharacters.clear();
    revealIndexes=currentWord?buildRevealIndexes(currentWord):[];
  }

  function getCurrentWordLength(){ return currentWord?getAnswerLength(currentWord):intClamp(currentWordLength,0,64); }

  function getMaskedAnswerHtml(){
    const len=getCurrentWordLength();
    if(len<=0) return '<span class="wordRevealChar">＿</span>';
    const answer=currentWord?.answer||''; const chars=Array.from(answer);
    return Array.from({length:len},(_,i)=>{
      const revealed=revealedCharacters.has(i);
      const shown=revealed?revealedCharacters.get(i):'＿';
      return '<span class="wordRevealChar '+(revealed?'revealed':'')+'">'+esc(shown)+'</span>';
    }).join('');
  }

  function applyRevealChar(payload,local=false){
    if(!payload||payload.roundId!==roundId||payload.turnIndex!==currentTurnIndex) return;
    const len=getCurrentWordLength();
    if(len<=1) return;
    if(payload.hostNow) syncClock(payload.hostNow);
    if(payload.stateVersion!=null) acceptStateVersion(payload.stateVersion);
    const revealNo=intClamp(payload.revealNo||0,1,2);
    if(revealNo && revealNo<=revealedCharCount) return;
    const maxReveal=Math.max(0,Math.min(2,len-1));
    if(revealNo>maxReveal) return;
    const idx=intClamp(payload.index,0,Math.max(0,len-1));
    const ch=String(payload.char||'');
    if(!ch||Array.from(ch).length!==1||revealedCharacters.has(idx)) return;
    revealedCharacters.set(idx,ch);
    revealedCharCount=revealedCharacters.size;
    revealStage=Math.max(revealStage,revealedCharCount,revealNo||0);
    const el=document.getElementById('wordRevealChars');
    if(el) el.innerHTML=getMaskedAnswerHtml();
    if(local || !payload.silent){
      if(revealNo===1 || revealedCharCount===1){showToast('💡 還剩 10 秒，揭露 1 個字！');playTone(760,.08);vibrate(25);}
      else if(revealNo===2 || revealedCharCount===2){showToast('💡 還剩 5 秒，再揭露 1 個字！');playTone(900,.08);vibrate(35);}
    }
  }

  function processRevealAsHost(remain){
    if(!isLocalAuthority()||matchEnded||currentTurnResolved||correctGuessers.length>0) return;
    const word=ensureHostSecretWord();
    if(!word) return;
    const len=getAnswerLength(word);
    const maxReveal=Math.max(0,Math.min(2,len-1));
    if(maxReveal<=0) return;

    let target=remain<=5?2:(remain<=10?1:0);
    target=Math.min(target,maxReveal);
    if(target<=revealStage) return;

    const idx=revealIndexes[revealStage];
    const ch=Array.from(word.answer)[idx];
    if(!ch) return;

    revealStage++;
    stateVersion=bumpStateVersion();
    const payload={
      roundId,
      stateVersion,
      hostNow:gameNow(),
      turnIndex:currentTurnIndex,
      type:'REVEAL_CHAR',
      index:idx,
      char:ch,
      revealNo:revealStage,
      at:gameNow()
    };
    sendEvent('GAME_EVENT',payload);
    applyRevealChar(payload,true);
  }

  /* =========================================================
     TURN
  ========================================================= */

  function isDrawer(){
    return !!currentDrawerId && currentDrawerId===ME.id;
  }

  function isParticipant(id){
    return participants.has(id);
  }

  function getRequiredCorrectCount(){
    const guesserCount=Math.max(0, participants.size-1);
    if(guesserCount<=0){ return 1; }
    return Math.min(CONFIG.GUESS_REWARDS.length, guesserCount);
  }

  function startNextTurnAsHost(){
    if(!isLocalAuthority()){ return; }
    if(matchEnded){ return; }

    currentTurnIndex++;
    if(currentTurnIndex>=turnOrder.length){
      finishMatchAsHost("所有玩家都完成畫畫");
      return;
    }

    currentDrawerId=turnOrder[currentTurnIndex];
    currentTurnStartedAt=gameNow()+250;
    currentTurnResolved=false;
    stateVersion=bumpStateVersion();
    correctGuessers=[];
    currentRequiredCorrectCount=getRequiredCorrectCount();
    speechFinalText="";
    knownStrokes=[];
    localStrokeIds=[];
    currentStroke=null;
    currentWord=wordForTurn(selectedCategory,currentTurnIndex,roundSeed);
    currentWordLength=getAnswerLength(currentWord);
    resetRevealState();
    feedText="準備畫！";

    const payload={
      roundId, stateVersion, hostNow:gameNow(),
      turnIndex:currentTurnIndex, drawerId:currentDrawerId, category:selectedCategory,
      wordLength:currentWordLength,
      startTime:currentTurnStartedAt,
      duration:activeTurnSeconds,
      turnSeconds:activeTurnSeconds,
      requiredCorrectCount:currentRequiredCorrectCount
    };

    sendEvent("TURN_START", payload);
    applyTurnStart(payload);
  }

  function findWordIndex(categoryId, wordId){
    const bank=WORDS[categoryId]||[];
    const idx=bank.findIndex(w=>w.id===wordId);
    return idx<0 ? 0 : idx;
  }

  function wordForTurn(categoryId, turnIndex, seed){
    const bank=WORDS[categoryId]||[];
    if(!bank.length){ return { id:"empty", answer:"圖畫", aliases:[] }; }

    const order=shuffledWordIndexes(categoryId, seed);
    const safeTurnIndex=Math.max(0, intClamp(turnIndex, 0, 100000));
    const idx=order[safeTurnIndex%order.length];
    return bank[idx]||bank[0];
  }

  function applyTurnStart(payload){
    if(!payload||payload.roundId!==roundId) return;
    const incomingTurnIndex=intClamp(payload.turnIndex,-1,Math.max(0,turnOrder.length));
    const turnKey=String(payload.roundId)+'|'+incomingTurnIndex;
    if(turnStartSeenKeys.has(turnKey)) return;
    if(currentTurnIndex>=0&&incomingTurnIndex<currentTurnIndex) return;
    turnStartSeenKeys.add(turnKey);
    if(payload.turnSeconds){activeTurnSeconds=normalizeTurnSeconds(payload.turnSeconds);selectedTurnSeconds=activeTurnSeconds;}
    acceptStateVersion(payload.stateVersion); syncClock(payload.hostNow);
    currentTurnIndex=incomingTurnIndex; currentDrawerId=safeString(payload.drawerId,'',64);
    currentTurnStartedAt=finite(payload.startTime,gameNow()); currentTurnResolved=false; clearTimeoutAnswer(); correctGuessers=[];
    currentRequiredCorrectCount=intClamp(payload.requiredCorrectCount||getRequiredCorrectCount(),1,Math.max(1,CONFIG.GUESS_REWARDS.length));
    speechFinalText=''; selectedCategory=safeString(payload.category,selectedCategory,30);
    currentWordLength=intClamp(payload.wordLength||0,0,64);
    currentWord=(isDrawer()||isLocalAuthority())?wordForTurn(selectedCategory,currentTurnIndex,roundSeed):null;
    if(currentWord) currentWordLength=getAnswerLength(currentWord);
    resetRevealState();
    knownStrokes=[]; localStrokeIds=[]; remoteStrokeBuffers.clear(); currentStroke=null;
    state=STATES.PLAYING; feedText=isDrawer()?'輪到你！畫出題目，別寫字。':'快猜！先答對先得分。';
    appendChatMessage({chatKey:'TURN_START|'+roundId+'|'+currentTurnIndex,roundId,turnIndex:currentTurnIndex,username:'系統',
      text:isDrawer()?'🎨 第 '+(currentTurnIndex+1)+' 回合開始！答案共 '+currentWordLength+' 字，開始作畫！':'🎨 第 '+(currentTurnIndex+1)+' 回合開始！提示：答案共 '+currentWordLength+' 字，搶先猜！本回合需 '+currentRequiredCorrectCount+' 名玩家猜中。',isCorrect:false,isSystem:true});
    const me=players.get(ME.id); if(me) me.status='PLAYING';
    render(); playTone(740,.08); setTimeout(ensureCanvas,50);
    if(!isDrawer()) setTimeout(startVoiceGuess,300); else stopVoiceGuess();
  }

  /* =========================================================
     TURN END
  ========================================================= */

  function resolveTurnAsHost(kind, winnerId=""){
    if(!isLocalAuthority()){ return; }
    if(matchEnded || currentTurnResolved){ return; }

    if(kind==="CORRECT"){
      const uid=safeString(winnerId,"",64);
      if(!uid || !participants.has(uid) || uid===currentDrawerId){ return; }
      if(correctGuessers.some(x=>x.id===uid)){ return; }
      if(correctGuessers.length>=currentRequiredCorrectCount){ return; }

      const rank=correctGuessers.length+1;
      const guesserGain=CONFIG.GUESS_REWARDS[rank-1]||0;
      const gp=players.get(uid);
      const drawer=players.get(currentDrawerId);
      if(!gp || !drawer){ return; }

      gp.score=intClamp(gp.score+guesserGain, 0, 100000);
      gp.correct=intClamp((gp.correct||0)+1, 0, 1000);

      let drawerGain=0;
      if(correctGuessers.length===0){
        drawerGain=CONFIG.DRAWER_CORRECT_REWARD;
        drawer.score=intClamp(drawer.score+drawerGain, 0, 100000);
      }

      correctGuessers.push({ id:uid, rank, gain:guesserGain });

      stateVersion=bumpStateVersion();
      const payload={
        roundId, stateVersion, hostNow:gameNow(),
        turnIndex:currentTurnIndex,
        type:"GUESS_CORRECT",
        rank,
        userId:uid,
        drawerId:currentDrawerId,
        guesserGain,
        drawerGain,
        userScore:gp.score,
        drawerScore:drawer.score,
        requiredCorrectCount:currentRequiredCorrectCount,
        at:Date.now()
      };

      sendEvent("GAME_EVENT", payload);
      applyGuessCorrect(payload);

      if(rank>=currentRequiredCorrectCount){
        endResolvedTurnAsHost("ALL_CORRECT", uid);
      }
      return;
    }

    currentTurnResolved=true;
    stateVersion=bumpStateVersion();

    const drawer=players.get(currentDrawerId);
    if(kind==="SKIP" && drawer){
      drawer.skips=intClamp((drawer.skips||0)+1, 0, 1000);
    }
    if(kind==="TIMEOUT" && drawer){
      drawer.drawTurns=intClamp((drawer.drawTurns||0)+1, 0, 1000);
    }

    const payload={
      roundId, stateVersion, hostNow:gameNow(),
      turnIndex:currentTurnIndex,
      kind,
      winnerId:winnerId||null,
      drawerId:currentDrawerId,
      answer:currentWord?currentWord.answer:"",
      drawerGain:0,
      guesserGain:0,
      drawerScore:drawer?drawer.score:0,
      winnerScore:null,
      correctGuessers:correctGuessers.map(x=>({id:x.id, rank:x.rank, gain:x.gain})),
      requiredCorrectCount:currentRequiredCorrectCount,
      at:Date.now()
    };

    sendEvent("TURN_END", payload);
    applyTurnEnd(payload);
  }

  function applyGuessCorrect(payload){
    if(!payload || payload.roundId!==roundId){ return; }

    const uid=safeString(payload.userId, "", 64);
    const rank=intClamp(payload.rank, 1, 3);
    if(!uid || rank<1 || rank>3){ return; }

    const alreadyRecorded=correctGuessers.some(x=>x.id===uid);
    if(!alreadyRecorded){
      correctGuessers.push({
        id:uid,
        rank,
        gain:intClamp(payload.guesserGain, 0, 100000)
      });
      correctGuessers.sort((a,b)=>a.rank-b.rank);
    }

    const gp=players.get(uid);
    if(gp){
      gp.score=intClamp(payload.userScore, 0, 100000);
      if(!alreadyRecorded){ gp.correct=intClamp((gp.correct||0)+1, 0, 1000); }
    }

    const drawer=players.get(payload.drawerId);
    if(drawer){
      drawer.score=intClamp(payload.drawerScore, 0, 100000);
    }

    const winnerName=gp?.username||"玩家";
    const drawerName=drawer?.username||"畫家";
    const rankText=["","🥇 第 1 名","🥈 第 2 名","🥉 第 3 名"][rank]||("第 "+rank+" 名");

    feedText=rankText+" "+winnerName+" 猜中！ +"+intClamp(payload.guesserGain,0,100000)+" 分"+(payload.drawerGain>0 ? "；🎨 "+drawerName+" +"+intClamp(payload.drawerGain,0,100000)+" 分" : "");

    appendChatMessage({
      chatKey:"GUESS_CORRECT|"+roundId+"|"+payload.turnIndex+"|"+uid+"|"+rank,
      roundId,
      turnIndex:payload.turnIndex,
      username:"系統",
      text:rankText+" "+winnerName+" 猜中了！+"+intClamp(payload.guesserGain,0,100000)+" 分"+(payload.drawerGain>0 ? "，畫家 "+drawerName+" +"+intClamp(payload.drawerGain,0,100000)+" 分" : ""),
      isCorrect:true,
      isSystem:true
    });

    refreshGameLiveUI();
    refreshChatUI();
    playTone(rank===1?980:rank===2?820:680,.08);
    vibrate(rank===1?90:45);
  }

  function endResolvedTurnAsHost(kind, winnerId=""){
    if(!isLocalAuthority()){ return; }
    if(matchEnded || currentTurnResolved){ return; }

    currentTurnResolved=true;
    stateVersion=bumpStateVersion();
    const drawer=players.get(currentDrawerId);

    const payload={
      roundId, stateVersion, hostNow:gameNow(),
      turnIndex:currentTurnIndex,
      kind,
      winnerId:winnerId||null,
      drawerId:currentDrawerId,
      answer:currentWord?currentWord.answer:"",
      drawerGain:0,
      guesserGain:0,
      drawerScore:drawer?drawer.score:0,
      winnerScore:winnerId&&players.get(winnerId)?players.get(winnerId).score:null,
      correctGuessers:correctGuessers.map(x=>({id:x.id,rank:x.rank,gain:x.gain})),
      at:Date.now()
    };

    sendEvent("TURN_END", payload);
    applyTurnEnd(payload);
  }

  function showTimeoutAnswer(answer){
    clearTimeout(timeoutAnswerTimer);
    const text=safeString(answer,"題目",40);
    document.getElementById("timeoutAnswerOverlay")?.remove();

    const overlay=document.createElement("div");
    overlay.id="timeoutAnswerOverlay";
    overlay.className="timeoutAnswerOverlay";
    overlay.innerHTML=`
      <div class="timeoutAnswerCard" aria-live="assertive">
        <div class="timeoutAnswerLabel">⏰ 時間到！答案是</div>
        <div class="timeoutAnswerText">${esc(text)}</div>
      </div>
    `;
    document.body.appendChild(overlay);
    playTone(420,.14);
    vibrate(70);

    timeoutAnswerTimer=setTimeout(()=>{
      overlay.remove();
      timeoutAnswerTimer=null;
    },1900);
  }

  function clearTimeoutAnswer(){
    clearTimeout(timeoutAnswerTimer);
    timeoutAnswerTimer=null;
    document.getElementById("timeoutAnswerOverlay")?.remove();
  }

  function applyTurnEnd(payload){
    if(!payload || payload.roundId!==roundId){ return; }

    const incomingTurnIndex=intClamp(payload.turnIndex, -1, Math.max(0, turnOrder.length));
    const turnKey=String(payload.roundId)+"|"+String(incomingTurnIndex);

    if(turnEndSeenKeys.has(turnKey)){ return; }
    if(currentTurnIndex!==incomingTurnIndex && !matchEnded){ return; }
    turnEndSeenKeys.add(turnKey);

    acceptStateVersion(payload.stateVersion); syncClock(payload.hostNow);
    currentTurnResolved=true;
    remoteStrokeBuffers.clear();
    if(payload.drawerId && players.has(payload.drawerId)){
      players.get(payload.drawerId).score=intClamp(payload.drawerScore, 0, 100000);
    }

    if(Array.isArray(payload.correctGuessers)){
      correctGuessers=payload.correctGuessers.map(x=>({
        id:String(x.id),
        rank:intClamp(x.rank, 1, 3),
        gain:intClamp(x.gain, 0, 100000)
      })).sort((a,b)=>a.rank-b.rank);
    }

    currentRequiredCorrectCount=intClamp(payload.requiredCorrectCount || currentRequiredCorrectCount || getRequiredCorrectCount(), 1, Math.max(1,CONFIG.GUESS_REWARDS.length));

    let msgText="";
    let turnTransitionDelay=1050;
    if(payload.kind==="ALL_CORRECT"){
      clearTimeoutAnswer();
      feedText="🎉 本回合需要的猜中人數已達標！準備下一回合";
      msgText=(currentRequiredCorrectCount===1?"🎉 唯一搶答玩家已猜中！":"🎉 前 "+currentRequiredCorrectCount+" 名已全部猜中！")+"答案是「"+safeString(payload.answer,"題目",30)+"」";
    }else if(payload.kind==="SKIP"){
      clearTimeoutAnswer();
      feedText="⏭️ 畫家跳過這題";
      msgText="⏭️ 畫家跳過這題，答案是「"+safeString(payload.answer,"題目",30)+"」";
    }else{
      feedText="⏰ 時間到，答案是「"+safeString(payload.answer,"題目",30)+"」";
      msgText="⏰ 時間到，答案是「"+safeString(payload.answer,"題目",30)+"」";
      showTimeoutAnswer(payload.answer);
      turnTransitionDelay=1950;
    }

    appendChatMessage({
      chatKey:"TURN_END|"+roundId+"|"+payload.turnIndex,
      roundId,
      turnIndex:payload.turnIndex,
      username:"系統",
      text:msgText,
      isCorrect:true,
      isSystem:true
    });

    state=STATES.PLAYING;
    render();
    setTimeout(ensureCanvas, 50);
    scheduleChatScroll();

    clearTimeout(turnStateTimer);
    turnStateTimer=setTimeout(()=>{
      if(matchEnded || !isLocalAuthority()) return;
      startNextTurnAsHost();
    }, turnTransitionDelay);
  }

  function scheduleChatScroll(){

  /* =========================================================
     GUESS
  ========================================================= */

  function appendChatMessage(row){
    const text=safeString(row?.text, "", CONFIG.MAX_GUESS_LENGTH);
    if(!text){ return false; }

    const eventId=safeString(row?.eventId, "", 100);
    const rowRoundId=safeString(row?.roundId, roundId||"LOBBY", 100);
    const rowTurnIndex=Number.isFinite(Number(row?.turnIndex)) ? Number(row.turnIndex) : currentTurnIndex;
    const rowUserId=safeString(row?.userId, safeString(row?.username, "玩家", CONFIG.MAX_NAME_LENGTH), 80);

    const explicitKey=safeString(row?.chatKey, "", 160);
    const contentKey="content:"+rowRoundId+"|"+rowTurnIndex+"|"+rowUserId+"|"+normalizeText(text);
    const dedupeKey=explicitKey||(eventId ? "event:"+eventId : contentKey);

    if(chatSeenKeys.has(dedupeKey) || chatSeenKeys.has(contentKey)){ return false; }

    chatSeenKeys.add(dedupeKey);
    chatSeenKeys.add(contentKey);

    if(chatSeenKeys.size>1500){
      const first=chatSeenKeys.values().next().value;
      if(first){ chatSeenKeys.delete(first); }
    }

    guessHistory.push({
      eventId: eventId||dedupeKey,
      chatKey: dedupeKey,
      userId: rowUserId,
      roundId: rowRoundId,
      turnIndex: rowTurnIndex,
      username: safeString(row?.username, "玩家", CONFIG.MAX_NAME_LENGTH),
      text,
      isCorrect: !!row?.isCorrect,
      isSystem: !!row?.isSystem
    });

    if(guessHistory.length>80){
      guessHistory.splice(0, guessHistory.length-80);
    }
    scheduleChatScroll();
    return true;
  }

  function submitGuess(){
    if(state!==STATES.PLAYING || isDrawer() || matchEnded || !isParticipant(ME.id) || Date.now()-lastGuessAt<140){ return; }

    const input=document.getElementById("guessInput");
    if(!input){ return; }

    const guess=safeString(input.value, "", CONFIG.MAX_GUESS_LENGTH);
    input.value="";

    if(!guess){ return; }
    lastGuessAt=Date.now();
    ensureAudio();

    const eventId=ME.id+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
    const payload={
      roundId,
      type:"GUESS",
      userId:ME.id,
      username:ME.username,
      turnIndex:currentTurnIndex,
      guess,
      eventId
    };

    sendEvent("GAME_EVENT", payload);
    if(isLocalAuthority()){ processGuessAsHost(payload); }
    refreshGameLiveUI();
  }

  function processGuessAsHost(payload){
    if(!isLocalAuthority()){ return; }
    if(matchEnded || currentTurnResolved || state!==STATES.PLAYING || payload.turnIndex!==currentTurnIndex){ return; }

    const uid=safeString(payload.userId, "", 64);
    if(!participants.has(uid) || uid===currentDrawerId){ return; }

    const guess=safeString(payload.guess, "", CONFIG.MAX_GUESS_LENGTH);
    if(!guess){ return; }
    ensureHostSecretWord();
    if(answerMatches(guess,currentWord)){
      resolveTurnAsHost("CORRECT", uid);
      return;
    }

    const resultPayload={
      roundId,
      turnIndex:currentTurnIndex,
      type:"GUESS_RESULT",
      userId:uid,
      username:safeString(payload.username, players.get(uid)?.username||"玩家", CONFIG.MAX_NAME_LENGTH),
      guess,
      sourceEventId:safeString(payload.eventId, "", 100),
      at:Date.now()
    };

    sendEvent("GAME_EVENT", resultPayload);
    applyGuessResult(resultPayload);
  }

  function applyGuessResult(payload){
    if(!payload || payload.roundId!==roundId || payload.turnIndex!==currentTurnIndex || payload.type!=="GUESS_RESULT"){ return; }

    const uid=safeString(payload.userId, "", 64);
    const guess=safeString(payload.guess, "", CONFIG.MAX_GUESS_LENGTH);
    if(!uid || !guess){ return; }

    appendChatMessage({
      chatKey:"GUESS_RESULT|"+roundId+"|"+currentTurnIndex+"|"+uid+"|"+safeString(payload.sourceEventId,"",100),
      roundId,
      turnIndex:currentTurnIndex,
      userId:uid,
      username:safeString(payload.username, players.get(uid)?.username||"玩家", CONFIG.MAX_NAME_LENGTH),
      text:guess,
      isCorrect:false,
      isSystem:false
    });

    refreshChatUI();
  }

  /* =========================================================
     RESULT
  ========================================================= */

  function participantPlayers(){
    return [...participants].map(id=>players.get(id)).filter(Boolean);
  }

  function buildRewards(){
    const all=participantPlayers().sort((a,b)=>finite(b.score, 0)-finite(a.score, 0)||a.id.localeCompare(b.id));
    const rewards={};
    const scoreTotal=all.reduce((sum,p)=>sum+intClamp(p.score, 0, 100000), 0);

    if(scoreTotal<=0){
      const each=all.length ? Math.floor(prizePool/all.length) : 0;
      all.forEach(p=>{ p.reward=each; rewards[p.id]=each; });
    }else{
      let used=0;
      all.forEach((p,i)=>{
        let reward;
        if(i===all.length-1){ reward=prizePool-used; }
        else{ reward=Math.floor(prizePool*p.score/scoreTotal); used+=reward; }
        p.reward=intClamp(reward, 0, prizePool);
        rewards[p.id]=p.reward;
      });
    }
    return { all, rewards };
  }

  function finishMatchAsHost(reason){
    if(!isLocalAuthority()){ return; }
    if(matchEnded){ return; }

    matchEnded=true;
    stateVersion=bumpStateVersion();
    stopVoiceGuess();
    state=STATES.RESULT;
    finalReason=reason;

    const result=buildRewards();
    const snapshot=result.all.map(p=>({
      id:p.id,
      username:p.username,
      score:intClamp(p.score, 0, 100000),
      reward:intClamp(p.reward, 0, prizePool)
    }));

    const payload={
      roundId, stateVersion, hostNow:gameNow(),
      reason,
      prizePool,
      rewards:result.rewards,
      scores:snapshot,
      at:Date.now()
    };

    sendEvent("ROUND_END", payload);
    applyRoundEnd(payload);
  }

  // 🌟 修正：統一處理 gameOver，精準傳遞 winAmount 與 score
  function callGameOver(reward, score){
    if(gameOverCalled){ return; }
    gameOverCalled=true;
    try{
      const finalReward = intClamp(reward, 0, prizePool);
      const finalScore = intClamp(score, 0, 100000);

      if(window.BoomRoomJS){
        window.BoomRoomJS.postMessage(JSON.stringify({ action: 'game_over', winAmount: finalReward, score: finalScore }));
      } else if (window.parent !== window) {
        window.parent.postMessage(JSON.stringify({ action: 'game_over', winAmount: finalReward, score: finalScore }), "*");
      } else if(window.BoomRoomSDK && typeof window.BoomRoomSDK.gameOver==="function"){
        window.BoomRoomSDK.gameOver(finalReward, finalScore); // For backward compatibility if SDK injects it
      }
    }catch(err){
      console.warn("gameOver callback error", err);
    }
  }

  function applyRoundEnd(payload){
    if(!payload || payload.roundId!==roundId){ return; }
    if(appliedRoundEndId===roundId){ return; }

    acceptStateVersion(payload.stateVersion); syncClock(payload.hostNow);
    clearTimeout(turnStateTimer);
    appliedRoundEndId=roundId;
    matchEnded=true;
    state=STATES.RESULT;
    finalReason=safeString(payload.reason, "本局已結束", 60);

    const snapshot=Array.isArray(payload.scores) ? payload.scores : [];
    for(const row of snapshot){
      if(row.id==null){ continue; }
      const rowId=String(row.id);
      const p=players.get(rowId)||addPlayer(rowId, row.username||"玩家", "");
      if(p){
        p.score=intClamp(row.score, 0, 100000);
        p.reward=intClamp(row.reward, 0, prizePool);
      }
    }

    const meRow=snapshot.find(x=>String(x.id)===String(ME.id));
    finalReward=intClamp(meRow?meRow.reward:0, 0, prizePool);
    const myScore = meRow ? intClamp(meRow.score, 0, 100000) : 0; // 🌟 擷取玩家最終分數，回傳給 Flutter 以更新排行榜

    const ranking=[...snapshot].sort((a,b)=>intClamp(b.score, 0, 100000)-intClamp(a.score, 0, 100000));
    const myIndex=ranking.findIndex(x=>String(x.id)===String(ME.id));
    finalRank=myIndex>=0 ? myIndex+1 : 1;

    // 🌟 傳遞 Reward (贏得銀幣) 與 Score (最終得分)
    callGameOver(finalReward, myScore);

    clearTimeoutAnswer();
    render();

    setTimeout(() => {
      if (window.parent && window.parent !== window && !window.BoomRoomJS) {
        window.parent.postMessage({ action: 'leaveGame' }, '*');
      } else if (!window.BoomRoomJS) {
        try { window.close(); } catch(e){}
      }
    }, 5000);
  }
