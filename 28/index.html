<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11131c" />
    <link rel="icon" href="data:," />
    <title>爆點</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="application/boomroom-game" data-boomroom-type="module" data-boomroom-src="./app.js"></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">✳</span><span>BOOM<span class="brand-light">ROOM</span></span></div>
        <div class="room-pill"><span class="live-dot"></span><span id="roomLabel">派對進行中</span></div>
        <div class="player-count"><span id="playerCount">1</span><span class="count-divider">/</span>10 <span class="people-icon">♟</span></div>
      </header>

      <section class="game-layout" aria-label="爆點反應遊戲">
        <section class="arena-panel">
          <div class="arena-heading">
            <div>
              <p class="eyebrow" id="phaseLabel">自動配對中</p>
              <h1 id="headline">準備拆彈</h1>
            </div>
            <div class="timer" id="timer" aria-label="剩餘時間">45<span>s</span></div>
          </div>

          <div class="arena" id="arena">
            <div class="orbit orbit-one"></div>
            <div class="orbit orbit-two"></div>
            <div class="arena-grid"></div>
            <div class="target-wrap" id="targetWrap">
              <div class="target" id="target" aria-label="拆除目標">
                <span class="target-spark">✳</span>
                <span class="target-caption">剪斷指定引線</span>
                <span class="target-word" id="targetWord">等一下</span>
                <span class="target-hint" id="targetHint">即將自動開始</span>
                <span class="target-ring" aria-hidden="true"></span>
              </div>
            </div>
            <div class="wire-controls" id="wireControls" aria-label="選擇引線">
              <button class="wire-button wire-red" type="button" data-wire="0" aria-label="剪紅線"><span class="wire-light"></span><span>紅線</span><kbd>1</kbd></button>
              <button class="wire-button wire-blue" type="button" data-wire="1" aria-label="剪藍線"><span class="wire-light"></span><span>藍線</span><kbd>2</kbd></button>
              <button class="wire-button wire-yellow" type="button" data-wire="2" aria-label="剪黃線"><span class="wire-light"></span><span>黃線</span><kbd>3</kbd></button>
            </div>
            <div class="arena-stamp"><span class="stamp-dot"></span><span id="arenaStatus">連線中</span></div>
            <div class="streak" id="streak"></div>
          </div>

          <div class="arena-footer">
            <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 選擇正確線色</span>
            <span class="round-label">連續 5 次 <b>額外 +2</b></span>
          </div>
        </section>

        <aside class="score-panel">
          <div class="score-heading">
            <div><p class="eyebrow">即時排名</p><h2>拆彈高手</h2></div>
            <span class="score-icon">↗</span>
          </div>
          <div class="score-list" id="scoreList" aria-live="polite"></div>
          <div class="score-foot"><span class="rank-dot"></span><span>第一名獲得 <b>100</b> 銀幣</span></div>
        </aside>
      </section>

      <section class="result-screen" id="resultScreen" aria-live="assertive" hidden>
        <div class="result-card">
          <span class="result-burst">✳</span>
          <p class="eyebrow">本局結束</p>
          <h2 id="resultTitle">拆彈高手</h2>
          <p class="result-summary" id="resultSummary"></p>
          <div class="result-winner" id="resultWinner"></div>
          <p class="return-note"><span class="return-spinner"></span> 3 秒後返回房間</p>
        </div>
      </section>
    </main>
  <script src="../shared/boomroom-bootstrap.js?v=1" data-sdk="./boomroom-sdk.js?v=3" data-legacy-callbacks="true"></script>
</body>
</html>
