<style>

<script>

function proceduralChart(s){setSongAndDifficulty();const r=rngFactory(s^hash(chosenDifficulty+'|'+chosenSong)),out=[];let beatIndex=0,t=1.15,lastLane=1,doubleId=0;const lastEnd=[-10,-10,-10,-10];while(t<CFG.ROUND-1.2){let lane=Math.floor(r()*4);if(lane===lastLane&&r()<.62)lane=(lane+1+Math.floor(r()*3))%4;const beat=beatIndex%4,canSpecial=r()<difficulty.density;let created=false;
  if(canSpecial&&beatIndex%8===6&&r()<difficulty.double){let l2=(lane+(r()<.5?1:2))%4;const gid='D'+doubleId++;if(t-lastEnd[lane]>.24&&t-lastEnd[l2]>.24){out.push({id:'d'+out.length,t,lane,type:'tap',done:false,hit:false,group:'double',groupId:gid});out.push({id:'d'+out.length,t,lane:l2,type:'tap',done:false,hit:false,group:'double',groupId:gid});lastEnd[lane]=t;lastEnd[l2]=t;created=true}}
  if(!created&&canSpecial&&beatIndex%12===4&&r()<difficulty.slide){const dir=r()<.5?1:-1,path=[lane,(lane+dir+4)%4,(lane+2*dir+4)%4];const gap=CFG.BEAT*.5;if(path.every((q,i)=>t+i*gap-lastEnd[q]>.12)){out.push({id:'s'+out.length,t,lane,type:'slide',path,step:0,started:false,done:false,group:'slide',groupId:'S'+beatIndex,stepGap:gap});path.forEach((q,i)=>lastEnd[q]=t+i*gap);created=true}}
  if(!created&&canSpecial&&r()<difficulty.hold){let len=CFG.BEAT*(2+r()*4);if(t+len<CFG.ROUND-.2&&t-lastEnd[lane]>.24){out.push({id:'h'+out.length,t,lane,type:'hold',len,endT:t+len,started:false,done:false,hit:false,group:'hold'});lastEnd[lane]=t+len;created=true;
      // 特意放入少量「長按中同軌補拍」，支援第二指／第二輸入來源
      if(chosenDifficulty!=='easy'&&len>CFG.BEAT*2.5&&r()<.68){const mt=t+len*.52;if(mt<t+len-.28){out.push({id:'ht'+out.length,t:mt,lane,type:'tap',done:false,hit:false,group:'holdTap',duringHold:true,parentHoldId:'h'+(out.length-1)});}}
    }}
  if(!created){if(t-lastEnd[lane]>.10){out.push({id:'t'+out.length,t,lane,type:'tap',done:false,hit:false,group:''});lastEnd[lane]=t}}
  t+=CFG.BEAT*(r()<difficulty.density?.5:.35);if(r()<.22)t+=CFG.BEAT*.5;lastLane=lane;beatIndex++}
  return out.sort((a,b)=>a.t-b.t)
}

function makeChart(s){setSongAndDifficulty();if(activeChart&&Array.isArray(activeChart.notes)&&activeChart.notes.length){return activeChart.notes.map(n=>({...n,done:false,hit:false,started:false,step:n.step||0,progress:0}));}return proceduralChart(s)}
function noteY(n,t,h){const nt=n.currentT??n.t,remain=nt-t;return h*.78-(remain/CFG.TRAVEL)*(h*.78+58)}
function canvasMetrics(){const c=$('canvas');return {w:c?.clientWidth||1,h:c?.clientHeight||1}}
function laneFromX(x){const {w}=canvasMetrics();const pad=10,lw=(w-pad*2)/4;return clamp(Math.floor((x-pad)/lw),0,3)}
function localTime(now){return getMusicTime(now)}
function rhNoteTime(n){return n.type==='slide'?n.t+(n.step||0)*n.stepGap:(n.t??999)}
function scoreMultiplier(){return 1+Math.min(.95,combo*.032)+Math.max(0,perfect/26)*.06}
function updateAccuracy(offset){const a=Math.abs(offset);return a<=CFG.PERFECT?'PERFECT':a<=CFG.GOOD?'GOOD':'MISS'}
function activeTapCandidates(lane,t){return notes.filter(n=>!n.done&&n.lane===lane&&((n.type==='tap'&&(!n.duringHold||n.t>=t-.2))||n.type==='double'&&false)).map(n=>({n,dist:Math.abs(n.t-t)})).sort((a,b)=>a.dist-b.dist)}
function registerMiss(kind='MISS'){combo=0;miss++;streak=0;score=Math.max(0,score-10);pulse=Math.max(0,pulse-.035);tone(100,.11,'sawtooth',.05);showFeedback(kind,'#ff6174');showTiming(CFG.GOOD*1000+12);vibrate(14);backgroundPulse=Math.max(backgroundPulse,.45)}
function scoreHit(kind,offset,source,n){const pts=kind==='PERFECT'?112:72;combo++;maxCombo=Math.max(maxCombo,combo);if(kind==='PERFECT')perfect++;else good++;streak++;score+=Math.round(pts*scoreMultiplier());if(n?.group==='holdTap')score+=28;if(n?.group==='slide')slideProgress++;if(n?.group==='double')clashCount++;pulse=Math.min(1,pulse+(combo>=8?.105:.035));pulseReady=pulse>=1;lastAccuracy=Math.round((perfect+good)/(Math.max(1,perfect+good+miss))*100);showTiming(offset*1000);showFeedback(kind==='PERFECT'?'PERFECT':source==='slide'?'SLIDE':'GOOD',kind==='PERFECT'?'#54eaff':'#ffd65b');if(kind==='PERFECT')tone(880,.06,'triangle',.06);else tone(660,.06,'triangle',.045);vibrate(kind==='PERFECT'?8:4);if(combo>0&&combo%8===0)showFeedback('🔥 '+combo+' COMBO','#ff8fd7');checkOvertake();updatePlayerLocal();sdkSend('RHYTHM_SCORE',{userId:me.id,username:me.username,score,combo,alive:true,accuracy:lastAccuracy,roundId})}
function startHold(n,now){const off=localTime(now)-n.t,kind=updateAccuracy(off);if(kind==='MISS')return false;n.started=true;n.holdStartAt=now;n.holdEndsAt=now+n.len*1000;n.releaseAt=null;n.progress=0;rhHolds.set(n.id,n);combo++;maxCombo=Math.max(maxCombo,combo);if(kind==='PERFECT')perfect++;else good++;score+=Math.round(126*scoreMultiplier());lastAccuracy=Math.round((perfect+good)/(Math.max(1,perfect+good+miss))*100);showTiming(off*1000);showFeedback('▰ HOLD START','#ff82d3');tone(440,.08,'sine',.05);vibrate(10);backgroundPulse=Math.max(backgroundPulse,.4);return true}
function breakHold(n){if(!rhHolds.has(n.id))return;rhHolds.delete(n.id);n.done=true;combo=0;miss++;pulse=Math.max(0,pulse-.08);showFeedback('HOLD BREAK','#ff6174');tone(120,.14,'sawtooth',.05);vibrate([18,22]);backgroundPulse=Math.max(backgroundPulse,1)}
function completeHold(n,quality){if(!rhHolds.has(n.id))return;rhHolds.delete(n.id);n.done=true;n.hit=true;const bonus=Math.round(n.len*128*(quality==='PERFECT'?1.12:.86));score+=bonus;pulse=Math.min(1,pulse+.12);showFeedback(quality==='PERFECT'?'HOLD PERFECT':'HOLD CLEAR',quality==='PERFECT'?'#ff8bd9':'#ffd65b');tone(660,.08,'triangle',.05);tone(990,.1,'sine',.035,.04);vibrate(quality==='PERFECT'?[8,10]:[6]);updatePlayerLocal();backgroundPulse=Math.max(backgroundPulse,.9)}
function updateHolds(now){for(const n of [...rhHolds.values()]){const remain=(n.holdEndsAt-now)/1000;n.progress=clamp(1-remain/n.len,0,1);if(n.releaseAt!==null){const delta=n.releaseAt-n.holdEndsAt;if(Math.abs(delta)<=CFG.HOLD_RELEASE*1000&&now>=n.holdEndsAt)completeHold(n,Math.abs(delta)<=CFG.PERFECT*1000?'PERFECT':'GOOD');else if(delta<-CFG.HOLD_RELEASE*1000)breakHold(n)}else if(now>=n.holdEndsAt){if(rhHeld.has(n.lane))completeHold(n,'PERFECT');else breakHold(n)}else if(!rhHeld.has(n.lane)&&now-n.holdStartAt>.12)breakHold(n);else if(rhHeld.has(n.lane))score+=CFG.HOLD_TICK*(1+combo*.018)}}
function startDoubleMember(n,now,source){const g=rhDouble.get(n.groupId);if(!g||n.done)return false;const off=localTime(now)-g.t,kind=updateAccuracy(off);if(kind==='MISS')return false;n.done=true;n.hit=true;g.hits++;const pts=kind==='PERFECT'?118:76;combo++;maxCombo=Math.max(maxCombo,combo);if(kind==='PERFECT')perfect++;else good++;score+=Math.round(pts*scoreMultiplier());pulse=Math.min(1,pulse+.04);showTiming(off*1000);tone(700+g.hits*130,.06,'square',.045);rhBurst(n.lane,'#956bff',15,1.05);if(g.hits===2){g.complete=true;clashCount++;const bonus=Math.round(270*scoreMultiplier());score+=bonus;combo++;maxCombo=Math.max(maxCombo,combo);pulse=Math.min(1,pulse+.15);showFeedback('✦ DOUBLE CLEAR ✦','#bca7ff');tone(520,.07,'square',.05);tone(780,.1,'triangle',.045,.05);vibrate([10,18,10]);sdkSend('RHYTHM_CLASH',{userId:me.id,username:me.username,score,roundId})}updatePlayerLocal();return true}
function beginSlide(n,now){const off=localTime(now)-n.t,kind=updateAccuracy(off);if(kind==='MISS')return false;n.started=true;n.step=1;n.lane=n.path[0];rhSlide=n;scoreHit(kind,off,'slide',n);showFeedback('SLIDE →','#ffd65b');tone(520,.06,'triangle',.04);return true}
function advanceSlide(n,lane,now){const expected=n.t+n.step*n.stepGap,off=localTime(now)-expected,kind=updateAccuracy(off);if(kind==='MISS')return false;n.step++;n.lane=lane;scoreHit(kind,off,'slide',n);rhBurst(lane,'#ffd65b',12,1.05);if(n.step>=n.path.length){n.done=true;n.hit=true;rhSlide=null;slideProgress+=n.path.length;score+=220;pulse=Math.min(1,pulse+.12);showFeedback('✦ SLIDE CLEAR ✦','#ffe18b');tone(540,.07,'square',.045);tone(810,.11,'triangle',.04,.06);vibrate([7,7,18]);updatePlayerLocal()}return true}
function pressSourcesForLane(lane){return rhPressSources.get(lane)||new Set()}
function pressLane(lane,source,now,kind='tap'){let set=pressSourcesForLane(lane);set.add(source);rhPressSources.set(lane,set);rhHeld.add(lane);document.getElementById('lane'+lane)?.classList.add('flash');judgeLane(lane,now,kind)}
function releaseLaneSource(lane,source){const set=pressSourcesForLane(lane);set.delete(source);if(set.size){rhPressSources.set(lane,set);return}rhPressSources.delete(lane);rhHeld.delete(lane);document.getElementById('lane'+lane)?.classList.remove('flash');const now=performance.now();for(const n of rhHolds.values())if(n.lane===lane&&n.releaseAt===null){const remain=n.holdEndsAt-now;if(remain<=CFG.HOLD_RELEASE*1000)n.releaseAt=now;else breakHold(n)}}
function judgeLane(lane,now,source='tap'){if(state!==STATE.PLAY)return;ensureAudio();const t=localTime(now);if(attackUntil>now&&Math.random()<.08){showFeedback('干擾延遲！','#ff6174');return}
  if(rhSlide&&!rhSlide.done){const expectedLane=rhSlide.path[rhSlide.step];if(expectedLane===lane&&Math.abs(t-(rhSlide.t+rhSlide.step*rhSlide.stepGap))<=CFG.GOOD){advanceSlide(rhSlide,lane,now);return}if(source==='slide')return}
  // 長按中同一軌的補拍：優先找 duringHold tap，不會要求放開長按
  let best=null,bestDist=Infinity;for(const n of notes){if(n.done||n.lane!==lane)continue;if(n.type==='hold'&&n.started)continue;const nt=rhNoteTime(n),d=Math.abs(nt-t);if(d<bestDist){bestDist=d;best=n}}
  if(!best||bestDist>CFG.GOOD){if([...rhHolds.values()].some(h=>h.lane===lane))return;registerMiss();return}
  if(best.type==='hold'){startHold(best,now);return}
  if(best.type==='slide'){beginSlide(best,now);return}
  if(best.group==='double'){startDoubleMember(best,now,source);return}
  best.done=true;best.hit=true;scoreHit(updateAccuracy(t-best.t),t-best.t,source,best);if(best.duringHold)showFeedback('TAP THROUGH','#ffb8e8');
}
function failMissed(now){const t=localTime(now);for(const n of notes){if(n.done)continue;if(n.type==='hold'&&n.started)continue;if(n.type==='slide'&&n.started){const target=n.t+n.step*n.stepGap;if(t>target+CFG.GOOD){n.done=true;rhSlide=null;combo=0;miss++;showFeedback('SLIDE MISS','#ff6174');rhBurst(n.path[Math.min(n.step,n.path.length-1)],'#ff6174',16,.95)}continue}const nt=rhNoteTime(n);if(t>nt+CFG.GOOD){n.done=true;combo=0;miss++;streak=0}}
  for(const [,g] of rhDouble){if(g.complete)continue;if(t>g.t+CFG.GOOD){const left=g.members.filter(n=>!n.done);if(left.length){left.forEach(n=>n.done=true);miss+=left.length;combo=0;g.complete=true;showFeedback('DOUBLE MISS','#ff6174')}}}
  updateHolds(now);
  if(attackUntil>now&&Math.random()<.025){const r=rngFactory((seed^Math.floor(t*8))>>>0),lane=Math.floor(r()*4);notes.push({id:'f'+Math.random(),t:t+.55+r()*.18,lane,type:'tap',done:false,hit:false,fake:true})}
}
function activatePulse(){if(!pulseReady||state!==STATE.PLAY)return;ensureAudio();pulseReady=false;pulse=0;score+=280;attackCount++;updatePlayerLocal();backgroundPulse=Math.max(backgroundPulse,1.4);tone(150,.18,'sawtooth',.085);tone(300,.24,'triangle',.06,.06);tone(600,.16,'sine',.04,.12);vibrate([25,20,45]);showFeedback('💥 立即干擾','#ff55bd');sdkSend('RHYTHM_PULSE',{userId:me.id,username:me.username,score,roundId});sdkSend('RHYTHM_JAM',{userId:me.id,username:me.username,score,combo,attackCount,roundId})}
function updatePlayerLocal(){const p=players.get(me.id);if(p){p.score=score;p.combo=combo;p.comboPeak=Math.max(p.comboPeak||0,maxCombo);p.attack=attackCount;p.lastTs=performance.now()}}
function checkOvertake(){const leader=Math.max(...[...players.values()].filter(p=>p.id!==me.id).map(p=>p.score||0),0);if(leader>0&&score>leader&&lastLeaderScore<leader){highestLocalRank=1;overTakeFlash=.8;showFeedback('⚡ 反超！+150','#ffd65b');score+=150;vibrate(20)}lastLeaderScore=leader}
function botTick(now){if(now-lastPlayerShare<420)return;lastPlayerShare=now;const t=localTime(now);players.forEach(p=>{if(p.id===me.id)return;const speed=(hash(p.id)%9)+8,pace=Math.sin(t*.85+speed)*.22+.78;p.score=Math.max(0,Math.floor(t*42*pace+speed*17));p.combo=Math.max(0,Math.floor(4+6*Math.abs(Math.sin(t*.22+speed))));p.comboPeak=Math.max(p.comboPeak,p.combo);if(Math.random()<.025&&p.combo>10){p.attack=1;if(!window.BoomRoomSDK&&state===STATE.PLAY&&attackUntil<now&&Math.random()<.35)receiveJam(p.username,'干擾')}});renderRoster()}
function rhBurst(lane,color,count=14,power=1){const {w,h}=canvasMetrics(),pad=10,lw=(w-pad*2)/4,cx=pad+lane*lw+lw/2,cy=h*.78;for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=(1.2+Math.random()*2.5)*power;rhParticles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.3,life:.42+Math.random()*.38,max:.8,size:1.8+Math.random()*3,color,rot:Math.random()*Math.PI})}}
function rhLineBurst(lanes,color){lanes.forEach((lane,i)=>setTimeout(()=>rhBurst(lane,color,14,1.1),i*18))}
function rhUpdateParticles(dt){for(let i=rhParticles.length-1;i>=0;i--){const q=rhParticles[i];q.life-=dt;if(q.life<=0){rhParticles.splice(i,1);continue}q.x+=q.vx*dt*60;q.y+=q.vy*dt*60;q.vy+=.06*dt*60}}
function rhDrawParticles(x){for(const q of rhParticles){x.globalAlpha=clamp(q.life/q.max,0,1);x.fillStyle=q.color;x.shadowBlur=12;x.shadowColor=q.color;x.save();x.translate(q.x,q.y);x.rotate(q.rot||0);drawDiamondPath(x,q.size*.95,.25);x.fill();x.restore()}x.globalAlpha=1;x.shadowBlur=0}
function drawBackground(x,w,h,now,t){const beatPhase=((t/CFG.BEAT)%1+1)%1,p=Math.pow(1-beatPhase,3)*(.55+backgroundPulse*.45),hot=(CFG.ROUND-t)<12;const g=x.createRadialGradient(w*.5,h*.55,10,w*.5,h*.55,Math.max(w,h)*.72);g.addColorStop(0,hot?'#4b1036':song.color+'18');g.addColorStop(.4,'#080c1b');g.addColorStop(1,'#03040a');x.fillStyle=g;x.fillRect(0,0,w,h);x.save();x.globalAlpha=.34+p*.3;x.translate(w/2,h/2);x.rotate(t*.018);const grid=34;for(let yy=-h;yy<h;yy+=grid){x.beginPath();x.moveTo(-w*1.2,yy);x.lineTo(w*1.2,yy);x.strokeStyle=hot?'#ff55bd18':'#54eaff16';x.lineWidth=1;x.stroke()}for(let xx=-w*1.2;xx<w*1.2;xx+=grid){x.beginPath();x.moveTo(xx,-h*1.2);x.lineTo(xx,h*1.2);x.strokeStyle='#956bff12';x.stroke()}x.restore();for(let i=0;i<20;i++){const a=i/20*Math.PI*2+t*.0005*(i%2?1:-1),rr=50+(i*37)%190,px=w*.5+Math.cos(a)*rr,py=h*.47+Math.sin(a)*rr*.5,s=1.6+(i*3)%4;x.fillStyle=(i%3===0?'#54eaff':i%3===1?'#ff55bd':'#ffd65b')+Math.max(0,Math.min(255,Math.floor(22+p*75))).toString(16).padStart(2,'0');x.beginPath();x.arc(px,py,s*(1+p),0,Math.PI*2);x.fill()}}
function drawBeatLines(x,w,h,judgeY,t){const start=Math.floor(t/CFG.BEAT)-5,end=start+23;for(let b=start;b<=end;b++){const bt=b*CFG.BEAT,dy=bt-t,py=judgeY-(dy/CFG.TRAVEL)*(judgeY+58);if(py<-40||py>h+50)continue;const strong=b%4===0;x.strokeStyle=strong?'#54eaff66':'#ffffff16';x.lineWidth=strong?2:1;x.beginPath();x.moveTo(10,py);x.lineTo(w-10,py);x.stroke();if(strong){x.fillStyle='#54eaff88';x.font='700 7px system-ui';x.fillText('BEAT '+((b%100)+100)%100,14,py-4)}}}
function canvasRoundRect(ctx,x,y,w,h,r){if(typeof ctx.roundRect==='function'){ctx.roundRect(x,y,w,h,r);return}const rr=Math.min(r,w/2,h/2);ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr)}

const NOTE_LANE_COLORS=['#67e8f9','#a78bfa','#fb7185','#fbbf24'];
function noteLaneColor(n){return NOTE_LANE_COLORS[clamp(Number(n.lane)||0,0,3)];}
function drawDiamondPath(ctx,r,cut=.22){
  const k=r*(1-cut);
  ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(k,-k);ctx.lineTo(r,0);ctx.lineTo(k,k);ctx.lineTo(0,r);ctx.lineTo(-k,k);ctx.lineTo(-r,0);ctx.lineTo(-k,-k);ctx.closePath();
}
function drawNoteBadge(ctx,r,kind,lane){
  ctx.save();
  const key='ASKL'[clamp(Number(lane)||0,0,3)];
  const glyph=kind==='hold'?'↕':kind==='slide'?'›':kind==='double'?'✦':'';
  ctx.fillStyle='#ffffffef';ctx.textAlign='center';ctx.textBaseline='middle';
  if(glyph){ctx.font='1000 '+Math.max(7,Math.floor(r*.5))+'px system-ui';ctx.fillText(glyph,0,-r*.16);ctx.font='1000 '+Math.max(7,Math.floor(r*.38))+'px system-ui';ctx.fillStyle='#08101d';ctx.fillText(key,0,r*.37)}
  else{ctx.font='1000 '+Math.max(8,Math.floor(r*.62))+'px system-ui';ctx.fillText(key,0,1)}
  ctx.restore();
}

function drawNotes(x,w,h,t,judgeY){
  const pad=10,lw=(w-pad*2)/4;x.textAlign='center';
  for(const n of notes){
    if(n.done)continue;
    const activeHold=n.type==='hold'&&n.started;
    const nt=n.type==='hold' ? (activeHold ? t : n.t) : rhNoteTime(n);
    const y=activeHold ? judgeY : noteY({...n,currentT:nt},t,h);
    if(y<-170||y>h+180)continue;
    const gx=pad+n.lane*lw+lw/2;
    const r=Math.min(lw*.27,22);
    const color=noteLaneColor(n);
    const near=!activeHold && Math.abs(rhNoteTime(n)-t)<=Math.min(.14,CFG.GOOD*1.35);
    const alpha=(n.type==='hold'&&activeHold)?.98:.97;

    x.save();x.translate(gx,y);x.shadowBlur=20;x.shadowColor=color;x.globalAlpha=alpha;
    // Every note uses the same fixed crystal silhouette. The note never morphs into a circle.
    const grad=x.createLinearGradient(-r,-r,r,r);
    grad.addColorStop(0,'#ffffff');grad.addColorStop(.16,color);grad.addColorStop(.82,color);grad.addColorStop(1,'#0d1322');
    x.fillStyle=grad;drawDiamondPath(x,r,.18);x.fill();
    x.lineWidth=2.2;x.strokeStyle='#ffffffd0';drawDiamondPath(x,r,.18);x.stroke();
    // Fixed inner chevron / badge, no animated color swap.
    if(n.type==='slide'||n.type==='hold'||n.group==='double'){
      x.fillStyle='#061019cc';drawDiamondPath(x,r*.58,.18);x.fill();x.strokeStyle='#ffffffa5';x.lineWidth=1;drawDiamondPath(x,r*.58,.18);x.stroke();
      drawNoteBadge(x,r,n.type==='hold'?'hold':n.type==='slide'?'slide':n.group==='double'?'double':'tap',n.lane);
    }
    if(n.duringHold){x.strokeStyle='#ffffffb0';x.lineWidth=1.6;drawDiamondPath(x,r*1.12,.18);x.stroke()}
    x.restore();x.globalAlpha=1;x.shadowBlur=0;

    if(n.type==='hold'){
      const topTime=n.t+(n.len||0);
      const endYActive=activeHold ? noteY({...n,currentT:topTime},t,h) : noteY({...n,currentT:topTime},t,h);
      // Active hold: keep the head locked on the judgement line and keep the rail visible until completion.
      const railBottom=activeHold?judgeY:y;
      const railTop=Math.min(railBottom-18,endYActive);
      const totalSpan=Math.max(18,railBottom-railTop);
      const remaining=Math.max(0,1-(n.progress||0));
      x.save();
      x.lineCap='round';x.lineWidth=Math.max(8,lw*.105);
      x.strokeStyle=color+'44';x.beginPath();x.moveTo(gx,railBottom);x.lineTo(gx,railTop);x.stroke();
      x.strokeStyle=color+'aa';x.lineWidth=Math.max(4,lw*.06);x.beginPath();x.moveTo(gx,railBottom);x.lineTo(gx,railTop);x.stroke();
      if(activeHold&&remaining>0){
        const progY=railBottom-totalSpan*clamp(n.progress||0,0,1);

      <div class="resultTableWrap"><table class="fullResultTable">
        <thead><tr><th>排名</th><th>玩家</th><th>總分</th><th>準確度</th><th>最高 COMBO</th><th>Perfect</th><th>Good</th><th>Miss</th><th>干擾</th><th>狀態</th></tr></thead>
        <tbody>${arr.map((p,i)=>{const pacc=Number.isFinite(Number(p.finalAccuracy))?Math.round(Number(p.finalAccuracy))+'%':'—';const pmiss=Number(p.finalMiss)||0;const pp=Number(p.finalPerfect)||0;const pg=Number(p.finalGood)||0;const pcombo=Number(p.comboPeak||p.combo)||0;const status=p.bot?'AI':(p.alive===false?'離線':'完成');return `<tr class="${p.id===me.id?'meRow ':''}${i===0?'rank1':''}"><td class="rankCell">${medal(i)}</td><td class="nameCell">${escapeHtml(p.username)}${p.id===me.id?' · 你':''}</td><td>${Math.floor(p.score||0).toLocaleString()}</td><td>${pacc}</td><td>${pcombo}</td><td>${pp}</td><td>${pg}</td><td>${pmiss}</td><td>${Number(p.finalPulse||p.attack||0)}</td><td>${status}</td></tr>`}).join('')}</tbody>
      </table></div>
      <div class="resultNote">排名依總分排序；同分時依準確度、最高 COMBO 排序。多人模式中，其他玩家的最終成績會透過遊戲事件同步進入此表。</div>
    </section>
    <section class="panel"><div class="resultActions"><button id="replayBtn" class="resultBtn primary">↻ 再玩一次</button><button id="leaveBtn" class="resultBtn">返回 BoomRoom</button></div><div id="resultCountdown" class="resultCountdown" style="margin-top:7px">8 秒後自動返回 BoomRoom</div></section>
  </section>`;
  const replay=$('replayBtn'),leave=$('leaveBtn'),count=$('resultCountdown');
  const standalone=(!window.BoomRoomSDK && window.parent===window);
  if(replay){replay.disabled=!standalone;replay.title=standalone?'':'BoomRoom 房間模式由房間控制回合';replay.onclick=()=>{if(!standalone)return;clearTimeout(window.__resultReturnTimer);autoResult=false;showMenu()}}
  const go=()=>{clearTimeout(window.__resultReturnTimer);try{if(parent!==window)parent.postMessage(JSON.stringify({action:'leaveGame'}),'*')}catch(_){ }if(window.parent===window)showMenu()};
  leave?.addEventListener('click',go);
  let remain=8;const tick=()=>{if(state!==STATE.RESULT)return;remain--;if(count)count.textContent=remain>0?(remain+' 秒後自動返回 BoomRoom'):'即將返回 BoomRoom';if(remain>0)window.__resultReturnTimer=setTimeout(tick,1000);else go()};
  window.__resultReturnTimer=setTimeout(tick,1000);
}
function sdkSend(name,payload={}){try{if(window.BoomRoomSDK?.sendGameEvent){window.BoomRoomSDK.sendGameEvent(name,payload);return true}}catch(_){}try{if(parent!==window){parent.postMessage(JSON.stringify({action:'sendGameEvent',eventName:name,payload}),'*');return true}}catch(_){}return false}
function sdkOver(reward){if(autoResult)return;autoResult=true;try{window.BoomRoomSDK?.gameOver?.(reward)}catch(_){}setTimeout(()=>{try{if(parent!==window)parent.postMessage(JSON.stringify({action:'leaveGame'}),'*')}catch(_){ }},8000)}
async function autoBoot(){seed=hash('standalone|'+Date.now());addPlayer(me.id,me.username);seedLocalPlayers(false);await loadLibrary();setSongAndDifficulty();showMenu()}

window.addEventListener('load',()=>{if(state===STATE.LOADING)autoBoot()});
</script>
</body>
</html>
