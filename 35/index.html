async function prewarmGameplayGeometry(){

// V32.18: pre-rasterize gameplay sprites before the first beat.
// ImageBitmap is a real decoded bitmap resource; drawImage(ImageBitmap) avoids
// creating/rasterizing a Canvas sprite during active gameplay. If unavailable,
// the existing Canvas sprite cache remains the fallback.
async function prewarmGameplayBitmaps(){
  const canBitmap=typeof createImageBitmap==='function';
  if(!canBitmap)return;
  const seen=new Set();
  const jobs=[];
  const addNote=(n)=>{
    if(!n)return;
    const r=22; // representative gameplay radius; actual draw scales the sprite.
    const variants=[false]; if(n.type==='hold')variants.push(true);
    for(const active of variants){
      const key=`note:${n.id}:${active}`;
      if(seen.has(key))continue;seen.add(key);
      jobs.push(()=>getNoteSprite(n,r,active));
    }
  };
  // Only unique visual signatures are expensive; the Map itself deduplicates them.
  for(const n of notes) addNote(n);
  for(let lane=0;lane<4;lane++){
    for(const stateKey of ['idle','pulse','perfect']) jobs.push(()=>getJudgeSprite(lane,20,stateKey));
    jobs.push(()=>getNearSprite(lane,28));
  }
  const holdColors=NOTE_LANE_COLORS;
  for(const color of holdColors){
    jobs.push(()=>getHoldRailSprite(color,10,false));
    jobs.push(()=>getHoldRailSprite(color,10,true));
  }
  for(let i=0;i<jobs.length;i+=16){
    for(const job of jobs.slice(i,i+16)) job();
    await new Promise(r=>requestAnimationFrame(r));
  }
  const convert=async(map)=>{
    const entries=[...map.entries()];
    for(let i=0;i<entries.length;i+=12){
      const batch=entries.slice(i,i+12);
      await Promise.all(batch.map(async([key,value])=>{
        if(!value || typeof value.close==='function')return;
        try{
          const bmp=await createImageBitmap(value);
          map.set(key,bmp);
        }catch(_){/* Canvas fallback remains valid. */}
      }));
      await new Promise(r=>requestAnimationFrame(r));
    }
  };
  await Promise.all([
    convert(renderPerf.noteSprites),
    convert(renderPerf.judgeSprites),
    convert(renderPerf.holdSprites),
    convert(renderPerf.pathSprites)
  ]);
  renderPerf.bitmapsReady=true;
}

function updateRenderQuality(now){
  if(!renderPerf.lastNow){renderPerf.lastNow=now;return}
  const ms=clamp(now-renderPerf.lastNow,8,50);renderPerf.lastNow=now;
  renderPerf.avgMs=renderPerf.avgMs*.93+ms*.07;renderPerf.sampleMs+=ms;renderPerf.sampleCount++;
  // V32.21: never change quality/DPR in the middle of a song. Rebuilding Canvas/ImageBitmap
  // caches or resizing a GPU surface while the WebView is presenting frames can look like flicker.
  // The round keeps the quality chosen at startRound(); the next round can choose a different tier.
  if(state===STATE.PLAY || state===STATE.COUNT)return;
  if(renderPerf.sampleCount<45)return;
  renderPerf.sampleCount=0;renderPerf.sampleMs=0;
}
function hexRgb(v){const s=String(v||'').trim().replace('#','');if(s.length===3)return s.split('').map(x=>parseInt(x+x,16));if(/^[0-9a-fA-F]{6}$/.test(s))return [parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16)];return [84,234,255];}

function performanceCueForNote(n){
  if(!n)return null;
  if(n.phraseRole==='terminal'||Number(n.phraseTerminal||0)>.7||n.articulation==='release')return {id:n.id,text:'RELEASE · 句尾收束',color:'#ffd65b'};

  if(n.syncopated)return {id:n.id,text:'SYNCOPATION · 切分',color:'#a78bfa'};
  if(n.articulation==='legato'||n.articulation==='legato-hold'||String(n.articulation||'').includes('legato'))return {id:n.id,text:'LEGATO · 連奏',color:'#54eaff'};
  const role=String(n.performanceRole||'melody');
  if(role.includes('bass'))return {id:n.id,text:'BASS · 左手低音',color:'#67e8f9'};
  if(role.includes('harmony')||role.includes('hook-chord'))return {id:n.id,text:'HARMONY · 右手回應',color:'#fb7185'};

}

  renderPerf.lastPerfCueId=cue.id;e.textContent=cue.text;e.style.color=cue.color;e.style.opacity='.9';

    }

    const hop=Math.max(256,Math.round(sr/43));

    const minBpm=70,maxBpm=210,step=.5,rate=sr/hop;

    for(let bpm=minBpm;bpm<=maxBpm;bpm+=step){
      const period=rate*60/bpm;if(period<2||period>rate*1.2)continue;
      let score=0,weight=0;
      for(let lag=1;lag<=Math.min(flux.length-1,Math.round(period*8));lag++){

        for(let i=lag;i<flux.length;i+=2){corr+=flux[i]*flux[i-lag];count++;}

      }
      score=weight?score/weight:0;
      if(score>best.score)best={bpm,score};
    }
    let bpm=best.bpm;
    if(bpm){

      const test=[bpm/2,bpm,bpm*2].filter(v=>v>=70&&v<=210);

      for(const cand of test){

      }

    }

  }catch(_){return 0;}
}

function lyricCandidates(songObj){
  const out=[];
  const push=v=>{if(v&&!out.includes(v))out.push(v)};
  if(songObj?.lyricsUrl)push(songObj.lyricsUrl);
  const audioUrl=songObj?.audioUrl||'';
  if(audioUrl){
    try{
      const u=new URL(audioUrl,document.baseURI);
      const path=u.pathname.replace(/\.[^/.]+$/,'');
      const base=new URL(u.href);
      base.pathname=path+'.lrc'; push(base.href);
      const plain=new URL(u.href); plain.pathname=path+'.txt'; push(plain.href);
      const lyr=new URL(u.href); lyr.pathname=path+'.lyrics'; push(lyr.href);
    }catch(_){
      const base=audioUrl.replace(/\.[^/.?#]+(?=[?#]|$)/,'');
      push(base+'.lrc');push(base+'.txt');push(base+'.lyrics');
    }
  }
  return out;
}
function parseLrcText(text){
  const rows=[];
  const re=/\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\](.*)$/;
  for(const rawLine of String(text||'').split(/\r?\n/)){
    const line=rawLine.replace(/^\uFEFF/,'').trim(); if(!line)continue;
    const matches=[...line.matchAll(/\[(\d{1,3}):(\d{2})(?:[.:](\d{1,3}))?\]/g)];
    const textPart=line.replace(/(?:\[\d{1,3}:\d{2}(?:[.:]\d{1,3})?\])+/,'').trim();
    if(!matches.length)continue;
    for(const m of matches){
      const mm=Number(m[1]||0), ss=Number(m[2]||0), raw=m[3]||'0';
      const frac=Number(raw)/(10**raw.length);
      rows.push({t:mm*60+ss+frac,text:textPart});
    }
  }
  rows.sort((a,b)=>a.t-b.t);

}

function normalizeRuntimeChart(raw){
  const root=raw&&raw.chart?raw.chart:raw;
  const arr=Array.isArray(raw)?raw:(Array.isArray(root?.notes)?root.notes:(Array.isArray(root?.events)?root.events:(Array.isArray(root?.chart?.notes)?root.chart.notes:[])));
  const bpmRaw=Number(root?.bpm??raw?.bpm??CFG.BPM);
  let bpm=(Number.isFinite(bpmRaw)&&bpmRaw>=70&&bpmRaw<=210)?bpmRaw:CFG.BPM;
  const durationRaw=Number(root?.duration??raw?.duration??song?.duration??60);
  const duration=(Number.isFinite(durationRaw)&&durationRaw>0)?durationRaw:60;
  let notes=arr.map((n,i)=>{
    const t0=Number(n.t??n.time??n.timeSec??n.start??n.startTime??0);
    const t=(Number.isFinite(t0)&&t0>1000)?t0/1000:t0;
    const lane=clamp(Math.round(Number(n.lane??n.track??n.column??0)||0),0,3);
    const type=String(n.type||'tap').toLowerCase();
    const len0=Number(n.len??n.length??n.duration??0);
    return {...n,id:n.id??('v29_'+i),t:Number(t.toFixed(5)),lane,type,len:Number.isFinite(len0)?len0:0,done:false,hit:false,started:false,step:n.step||0,progress:0};
  }).filter(n=>Number.isFinite(n.t)&&n.t>=0&&n.t<=duration+0.5).sort((a,b)=>a.t-b.t||a.lane-b.lane);

  // Easy / Normal may use rare 2-key chords; Hard adds 3-key chords; Special can use 4-key chords.
  const maxChord=Number(DIFFS[chosenDifficulty]?.chordMax||1);
  if(maxChord<4 || maxChord>=1){
    const chordGroups=new Map();
    for(const n of notes){ if((n.group==='chord'||n.group==='double')&&n.groupId){ const g=chordGroups.get(n.groupId)||[];g.push(n);chordGroups.set(n.groupId,g); } }
    for(const g of chordGroups.values()){
      if(g.length>maxChord){
        g.sort((a,b)=>(a.chordIndex||0)-(b.chordIndex||0));
        for(const n of g.slice(maxChord)){n.group=undefined;n.groupId=undefined;n.groupSize=undefined;n.chordIndex=undefined;}
        const keep=g.slice(0,maxChord);keep.forEach((n,i)=>{n.groupSize=keep.length;n.chordIndex=i;});

    }

}

  const q=renderPerf.quality;const cap=q===0?Math.min(5,count):q===1?Math.min(8,count):Math.min(12,count);
  for(let i=0;i<cap;i++){const a=Math.random()*Math.PI*2,s=(1.2+Math.random()*2.5)*power;rhParticles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.3,life:.32+Math.random()*.26,max:.58,size:1.8+Math.random()*2.8,color,rot:Math.random()*Math.PI})}
  if(rhParticles.length>(q===0?48:q===1?72:110))rhParticles.splice(0,rhParticles.length-(q===0?48:q===1?72:110));
}
function rhLineBurst(lanes,color){lanes.forEach((lane,i)=>setTimeout(()=>rhBurst(lane,color,10,1.1),i*18))}
function rhUpdateParticles(dt){let w=0;for(let i=0;i<rhParticles.length;i++){const q=rhParticles[i];q.life-=dt;if(q.life<=0)continue;q.x+=q.vx*dt*60;q.y+=q.vy*dt*60;q.vy+=.06*dt*60;rhParticles[w++]=q}rhParticles.length=w}
function particleSprite(color,size){
  const q=renderPerf.quality,key=`${q}|${color}|${Math.round(size*10)}`;
  const cached=renderPerf.particleSprites.get(key);if(cached)return cached;
  const d=Math.max(12,Math.ceil(size*5));const c=document.createElement('canvas');c.width=c.height=d;const g=c.getContext('2d');
  g.translate(d/2,d/2);g.shadowBlur=q>=2?8:0;g.shadowColor=color;g.fillStyle=color;drawDiamondPath(g,size*.95,.25);g.fill();
  renderPerf.particleSprites.set(key,c);return c;
}
function rhDrawParticles(x){
  if(!rhParticles.length)return;
  for(const q of rhParticles){
    const alpha=clamp(q.life/q.max,0,1);
    const spr=particleSprite(q.color,q.size);
    const half=spr.width*.5;
    x.globalAlpha=alpha;
    if(q.rot){x.save();x.translate(q.x,q.y);x.rotate(q.rot);x.drawImage(spr,-half,-half);x.restore();}
    else{x.drawImage(spr,q.x-half,q.y-half);}
  }
  x.globalAlpha=1;
}
function drawBackground(x,w,h,now,t){

  if(p>.01||hot){x.save();x.globalAlpha=hot?.45:Math.min(.55,.10+p*.42);x.drawImage(hot?cache.hotGlow:cache.dynamicGlow,0,0,w,h);x.restore();}
}
function drawBeatLines(x,w,h,judgeY,t){

  for(let b=start;b<=end;b++){const bt=b*CFG.BEAT,dy=bt-t,py=judgeY-(dy/CFG.TRAVEL)*(judgeY+58);if(py<-40||py>h+50)continue;const strong=b%4===0;x.fillStyle=strong?'#54eaff66':'#ffffff16';x.fillRect(10,Math.round(py),w-20,strong?2:1)}

}
function canvasRoundRect(ctx,x,y,w,h,r){if(typeof ctx.roundRect==='function'){ctx.roundRect(x,y,w,h,r);return}const rr=Math.min(r,w/2,h/2);ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr)}

const NOTE_LANE_COLORS=['#67e8f9','#a78bfa','#fb7185','#fbbf24'];
function noteLaneColor(n){return NOTE_LANE_COLORS[clamp(Number(n.lane)||0,0,3)];}
function drawDiamondPath(ctx,r,cut=.22){

}
function drawNoteBadge(ctx,r,kind,lane,groupSize=0){

  else{ctx.font='1000 '+Math.max(8,Math.floor(r*.62))+'px system-ui';ctx.fillText(key,0,1)}

function getJudgeSprite(lane,r,stateKey){
  const q=renderPerf.quality;
  const key=`judge|${q}|${lane}|${Math.round(r*20)}|${stateKey}`;
  const cached=renderPerf.judgeSprites.get(key);if(cached)return cached;
  const pad=Math.ceil(r*2.15)+18;
  const c=document.createElement('canvas');c.width=c.height=pad*2;
  const g=c.getContext('2d');g.translate(pad,pad);
  const col=NOTE_LANE_COLORS[lane];
  // Rasterize the expensive glow/diamond once. The live loop only drawImage()s this sprite.
  const outer=stateKey==='idle'?1.32:1.45, inner=stateKey==='idle'?1:1.06;
  if(stateKey!=='idle' && q>=1){g.shadowBlur=q===2?24:12;g.shadowColor=col;}
  g.globalAlpha=stateKey==='idle'?.92:.98;
  g.fillStyle=col+'22';drawDiamondPath(g,r*outer,.18);g.fill();
  g.strokeStyle=col+'aa';g.lineWidth=2;drawDiamondPath(g,r*outer,.18);g.stroke();
  g.fillStyle=col+'66';drawDiamondPath(g,r*inner,.18);g.fill();
  g.strokeStyle='#ffffffd0';g.lineWidth=1.5;drawDiamondPath(g,r*inner,.18);g.stroke();
  g.fillStyle='#ffffff';g.font='1000 '+Math.max(9,Math.floor(r*.75))+'px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText('ASDF'[lane],0,1);
  if(stateKey==='pulse'){
    g.globalAlpha=.9;g.shadowBlur=q===2?30:16;g.shadowColor=col;g.strokeStyle=col+'dd';g.lineWidth=2.2;drawDiamondPath(g,r*1.62,.18);g.stroke();
  } else if(stateKey==='perfect'){
    g.globalAlpha=.92;g.shadowBlur=q===2?24:12;g.shadowColor='#54eaff';g.strokeStyle='#54eaff';g.lineWidth=2.4;drawDiamondPath(g,r*1.58,.18);g.stroke();
    g.strokeStyle='#ffffff';g.lineWidth=1.1;drawDiamondPath(g,r*1.23,.18);g.stroke();
  }
  renderPerf.judgeSprites.set(key,c);return c;
}

function getHoldRailSprite(color,width,active=false){
  const q=renderPerf.quality;
  const w=Math.max(4,Math.round(width));
  const key=`holdrail|${q}|${color}|${w}|${active?1:0}`;
  const cached=renderPerf.holdSprites.get(key);if(cached)return cached;
  const h=q===2?192:128;
  const c=document.createElement('canvas');c.width=w+20;c.height=h;
  const g=c.getContext('2d');
  const cx=c.width*.5;
  g.lineCap='round';
  if(q>=1){g.shadowBlur=q===2?12:6;g.shadowColor=active?color:color+'99';}
  g.strokeStyle=color+(active?'aa':'55');g.lineWidth=w*.9;g.beginPath();g.moveTo(cx,0);g.lineTo(cx,h);g.stroke();
  g.shadowBlur=0;g.strokeStyle=active?'#ffffffff':color+'cc';g.lineWidth=Math.max(2,w*.46);g.beginPath();g.moveTo(cx,0);g.lineTo(cx,h);g.stroke();
  renderPerf.holdSprites.set(key,c);return c;
}
function getHoldProgressSprite(width){
  const q=renderPerf.quality,w=Math.max(2,Math.round(width)),key=`holdprogress|${q}|${w}`;
  const cached=renderPerf.holdSprites.get(key);if(cached)return cached;

  const g=c.getContext('2d');const cx=c.width*.5;g.lineCap='round';g.strokeStyle='#ffffffc8';g.lineWidth=Math.max(2,w*.34);g.beginPath();g.moveTo(cx,8);g.lineTo(cx,h-8);g.stroke();

function drawNotes(x,w,h,t,judgeY){
  const pad=10,lw=(w-pad*2)/4;
  let lo=0,hi=notes.length;
  const windowStart=t-8,windowEnd=t+CFG.TRAVEL+0.75;
  while(lo<hi){const m=(lo+hi)>>1;if((notes[m]?.t||0)<windowStart)lo=m+1;else hi=m;}
  let perfCue=null;
  const frameNow=performance.now(),pulseSin=Math.sin(frameNow*.012);
  if(x.setLineDash)x.setLineDash([]);

  // Stage 2: legato connectors are pre-rasterized; runtime only translates the bitmap.
  if(renderPerf.quality>=1){
    for(let idx=lo;idx<notes.length;idx++){
      const n=notes[idx];if((n?.t||0)>windowEnd)break;if(n.done||!n.legatoTo)continue;
      const to=noteById.get(n.legatoTo);if(!to||to.done)continue;
      const nt=rhNoteTime(n),tty=rhNoteTime(to),ny=noteY(n,t,h,judgeY,nt),ty=noteY(to,t,h,judgeY,tty);
      if((ny<-170&&ty<-170)||(ny>h+180&&ty>h+180))continue;
      const spr=getLegatoSprite(n,to,w,h,lw);if(!spr)continue;
      x.drawImage(spr,pad+n.lane*lw+lw/2-spr.__originX,Math.min(ny,ty)-spr.__originY);
    }
  }

  for(let idx=lo;idx<notes.length;idx++){
    const n=notes[idx];if((n?.t||0)>windowEnd)break;if(n.done)continue;
    const activeHold=n.type==='hold'&&n.started;
    const noteTime=n.type==='hold'?(activeHold?t:n.t):rhNoteTime(n);
    const y=activeHold?judgeY:noteY(n,t,h,judgeY,noteTime);
    if(y<-170||y>h+180)continue;
    if(!perfCue&&n.t>=t-0.02)perfCue=n;
    const gx=pad+n.lane*lw+lw/2;
    const r=Math.min(lw*.27,22);
    const near=!activeHold&&Math.abs(noteTime-t)<=Math.min(.14,CFG.GOOD*1.35);
    const sprite=activeHold?getNoteSprite(n,r,true):getNoteSprite(n,r,false);
    x.drawImage(sprite,gx-sprite.width*.5,y-sprite.height*.5);

    if(n.duringHold){x.globalAlpha=.8;x.strokeStyle='#ffffffa0';x.lineWidth=1.3;drawDiamondPath(x,r*1.12,.18);x.stroke();x.globalAlpha=1;}

    if(n.type==='hold'){
      const topTime=n.t+(n.len||0);
      const endYActive=noteY(n,t,h,judgeY,topTime);
      const railStart=activeHold?judgeY:y;
      const railEnd=endYActive;
      const railTop=Math.min(railStart,railEnd);
      const railBottom=Math.max(railStart,railEnd);
      const totalSpan=Math.max(18,railBottom-railTop);
      const railWidth=renderPerf.quality===0?Math.max(6,lw*.08):Math.max(8,lw*.105);
      const spriteRail=getHoldRailSprite(noteLaneColor(n),railWidth,activeHold);
      // The rail is stretched to the exact start/end positions. The HOLD head remains centered at railStart.
      x.drawImage(spriteRail,gx-spriteRail.width*.5,railTop,spriteRail.width,totalSpan);
      if(activeHold&&(n.progress||0)<1){
        const prog=clamp(n.progress||0,0,1);
        if(prog>0){
          const ps=getHoldProgressSprite(renderPerf.quality===0?2:3);
          const ph=Math.max(8,totalSpan*prog);
          x.globalAlpha=.95;x.drawImage(ps,gx-ps.width*.5,railBottom-ph,ps.width,ph);x.globalAlpha=1;
        }
      }
      if(activeHold&&n.phraseRole==='terminal'){x.strokeStyle='#ffd65b';x.lineWidth=1.8;x.beginPath();x.arc(gx,judgeY,Math.min(30,lw*.32),Math.PI*.15,Math.PI*.85);x.stroke();}
      if(activeHold&&(n.progress||0)<1){const hs=getHoldActiveSprite(n,r);x.drawImage(hs,gx-hs.width*.5,judgeY-hs.height*.5);}
    }

    if(n.type==='slide'){
      const step=n.step||0,spr=getSlideSprite(n,step,w,h,judgeY,lw);
      if(spr){
        const path=n.path||[n.lane];
        let minX=Infinity;for(let k=step;k<path.length;k++){const px=pad+path[k]*lw+lw/2;if(px<minX)minX=px;}
        const lastY=noteY(n,t,h,judgeY,n.t+(path.length-1)*(n.stepGap||0));
        x.drawImage(spr,minX-12,lastY-12);
      }
    }

    if(near){
      const pulseRing=r*1.40,ns=getNearSprite(clamp(Number(n.lane)||0,0,3),pulseRing);
      x.globalAlpha=.66+.18*pulseSin;x.drawImage(ns,gx-ns.width*.5,y-ns.height*.5);x.globalAlpha=1;
    }
  }
  updatePerformanceCue(perfCue);
}

function ensureStageCanvasSize(c,w,h,dpr,alpha=true){
  if(!c)return false;
  const cw=Math.max(1,Math.round(w*dpr)),ch=Math.max(1,Math.round(h*dpr));
  if(c.width!==cw||c.height!==ch){c.width=cw;c.height=ch;return true;}
  return false;
}
function ensureStageContexts(){
  const main=$('canvas'),bg=$('bgCanvas'),fx=$('fxCanvas');
  if(!main||!fx)return null;
  // V32.21: use stable non-desynchronized 2D contexts. Some Android WebViews can visibly tear
  // when desynchronized canvases are composited over animated DOM/filter layers.
  if(!renderCtx)renderCtx=main.getContext('2d',{alpha:false,desynchronized:false})||main.getContext('2d');
  if(!fxCtx)fxCtx=fx.getContext('2d',{alpha:true,desynchronized:false})||fx.getContext('2d');
  return {main,bg,fx};
}
function draw(now){
  updateRenderQuality(now);
  const ctxs=ensureStageContexts();if(!ctxs)return;
  const {main,fx}=ctxs;
  const dpr=Math.min(renderPerf.dpr||1.5,window.devicePixelRatio||1.5),w=main.clientWidth,h=main.clientHeight;
  const resizedMain=ensureStageCanvasSize(main,w,h,dpr,false);
  const resizedFx=ensureStageCanvasSize(fx,w,h,dpr,true);
  if(resizedMain||resizedFx){
    renderCtx=main.getContext('2d',{alpha:false,desynchronized:false})||renderCtx;
    fxCtx=fx.getContext('2d',{alpha:true,desynchronized:false})||fxCtx;
  }
  const scale=dpr;
  const cache=ensureRenderCache(w,h);

  // V32.21 stability change: the gameplay canvas is opaque and paints the cached base
  // background every frame. This avoids transparent-canvas compositing flashes that can
  // occur when the Android WebView presents bgCanvas + gameplayCanvas on different frames.
  renderCtx.setTransform(scale,0,0,scale,0,0);
  renderCtx.globalAlpha=1;
  renderCtx.globalCompositeOperation='source-over';
  renderCtx.drawImage(cache.bg,0,0,w,h);
  renderCtx.drawImage(cache.lanes,0,0,w,h);

  fxCtx.setTransform(scale,0,0,scale,0,0);
  fxCtx.globalAlpha=1;
  fxCtx.globalCompositeOperation='source-over';
  fxCtx.clearRect(0,0,w,h);

  const t=state===STATE.PLAY?localTime(now):0;
  // V32.22: draw the beat glow on the opaque gameplay canvas, not the transparent FX layer.
  // Smooth the visual pulse separately from gameplay timing so it cannot pop between frames.
  const beatPhase=((t/CFG.BEAT)%1+1)%1;
  const targetPulse=state===STATE.PLAY?Math.pow(1-beatPhase,3):0;
  backgroundPulseVisual += (targetPulse + Math.min(1,backgroundPulse)*.28 - backgroundPulseVisual)*.105;
  const hot=(CFG.ROUND-t)<12;
  const glowAlpha=hot?.17:Math.min(.22,.025+backgroundPulseVisual*.12);
  if(glowAlpha>.008){renderCtx.save();renderCtx.globalAlpha=glowAlpha;renderCtx.drawImage(hot?cache.hotGlow:cache.dynamicGlow,0,0,w,h);renderCtx.restore();}

  if(state===STATE.PLAY)drawBeatLines(renderCtx,w,h,h*JUDGE_Y_RATIO,t);
  const judgeY=h*JUDGE_Y_RATIO,phase=state===STATE.PLAY?Math.pow(1-(((t/CFG.BEAT)%1+1)%1),3):0;
  renderCtx.fillStyle=`rgba(84,234,255,${.05+.12*phase})`;renderCtx.fillRect(8,judgeY-12,w-16,24);
  renderCtx.strokeStyle='#54eaffaa';renderCtx.lineWidth=2;renderCtx.beginPath();renderCtx.moveTo(8,judgeY);renderCtx.lineTo(w-8,judgeY);renderCtx.stroke();

  const pad=10,lw=(w-pad*2)/4,fxNow=performance.now();
  for(let i=0;i<4;i++){
    const gx=pad+i*lw+lw/2,active=rhHeld.has(i),fxAmount=Math.max(0,Math.min(1,((laneEffectUntil[i]||0)-fxNow)/180)),pf=Math.max(0,Math.min(1,((perfectFxUntil[i]||0)-fxNow)/220));
    const r=Math.min(lw*.25,20)*(active?1.10:1),stateKey=pf>0?'perfect':(active||fxAmount>0?'pulse':'idle'),js=getJudgeSprite(i,r,stateKey);
    renderCtx.globalAlpha=(.9+.1*phase)*(active?1:.92);renderCtx.drawImage(js,gx-js.width*.5,judgeY-js.height*.5);
    if((active||fxAmount>0)&&stateKey!=='pulse'){const ps=getJudgeSprite(i,r,'pulse');renderCtx.globalAlpha=.35*(active?1:fxAmount);renderCtx.drawImage(ps,gx-ps.width*.5,judgeY-ps.height*.5);}
    renderCtx.globalAlpha=1;
  }
  if(state===STATE.PLAY)drawNotes(renderCtx,w,h,t,judgeY);
  rhDrawParticles(fxCtx);
  backgroundPulse*=.92;overTakeFlash*=.92;
}

}
function renderResult(main){
  const arr=[...players.values()].sort((a,b)=>(b.score||0)-(a.score||0)||(b.finalAccuracy||0)-(a.finalAccuracy||0)||(b.comboPeak||0)-(a.comboPeak||0));
  const rank=Math.max(1,arr.findIndex(p=>p.id===me.id)+1);
  const total=perfect+good+miss;
  const acc=total?Math.round((perfect+good)/total*100):100;
  const duration=Number(activeChart?.duration||song.duration||CFG.ROUND||0);
  const bpm=Number(activeChart?.bpm||song.bpm||CFG.BPM);
  const noteCount=Number(activeChart?.notes?.length||song?.stats?.[chosenDifficulty]?.notes||notes.length||0);
  const holdClear=notes.filter(n=>n.type==='hold'&&n.done&&n.hit).length;
  const slideClear=notes.filter(n=>n.type==='slide'&&n.done&&n.hit).length;
  const doubleClear=[...rhDouble.values()].filter(g=>g.complete).length;
  if(window.__resultReturnTimer)clearTimeout(window.__resultReturnTimer);
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':String(i+1);
  const top=[arr[1],arr[0],arr[2]].filter(Boolean);
  const podiumSlot=(p,slot)=>p?`<div class="podiumCard ${slot==='first'?'first':''} ${slot==='third'?'third':''}">
      <div class="podiumPlace">${p===arr[0]?'🥇':p===arr[1]?'🥈':'🥉'}</div>
      <div class="podiumName">${escapeHtml(p.username||'玩家')}</div>
      <div class="podiumScore">${Math.floor(p.score||0).toLocaleString()}</div>
      <div class="podiumMeta">${Math.round(Number(p.finalAccuracy)||0)}% 準確 · Combo ${Number(p.comboPeak||p.combo)||0}</div>
      <div class="podiumAccent"></div>
    </div>`:'';
  const first=arr[0]||null, second=arr[1]||null, third=arr[2]||null;
  main.innerHTML=`<section class="resultWrap">
    <section class="resultHero">
      <div class="resultEyebrow"><i></i> BOOMROOM RHYTHM · ROUND RESULT <i></i></div>
      <div class="resultTitle">本局完整結算</div>
      <p class="resultSub">${escapeHtml(song.name||'音樂')} · ${fmtTime(duration)} · ${noteCount.toLocaleString()} 音符</p>
      <div style="text-align:center"><span class="resultDifficultyBadge">${difficulty.label} · ${difficulty.name}</span></div>
      <div class="resultCards">
        <div class="resultCard"><b>${Math.floor(score).toLocaleString()}</b><span>總分</span></div>
        <div class="resultCard"><b>${maxCombo}</b><span>最高 COMBO</span></div>
        <div class="resultCard"><b>${acc}%</b><span>準確度</span></div>
        <div class="resultCard"><b>#${rank}</b><span>本局排名</span></div>
      </div>
    </section>

    <section class="resultSection">
      <div class="resultSectionHead"><div><div class="resultSectionTitle">你的節奏表現</div><div class="resultSectionSub">這一局的完整判定與特殊操作統計</div></div></div>
      <div class="resultPerformanceGrid">
        <div class="resultPanel">
          <div class="resultPanelLabel">Accuracy</div>
          <div class="resultBig">${acc}%</div>
          <div class="resultMeter"><i style="width:${Math.max(0,Math.min(100,acc))}%"></i></div>
          <div class="resultBreakdown"><div><b>${perfect}</b><span>PERFECT</span></div><div><b>${good}</b><span>GOOD</span></div><div><b>${miss}</b><span>MISS</span></div></div>
        </div>
        <div class="resultPanel">
          <div class="resultPanelLabel">Special Notes</div>
          <div class="resultMetaGrid" style="margin-top:7px">
            <div class="resultMetaItem"><small>HOLD 完成</small><b>${holdClear}</b></div>
            <div class="resultMetaItem"><small>SLIDE 完成</small><b>${slideClear}</b></div>
            <div class="resultMetaItem"><small>DOUBLE 完成</small><b>${doubleClear}</b></div>
            <div class="resultMetaItem"><small>最高 COMBO</small><b>${maxCombo}</b></div>
          </div>
        </div>
        <div class="resultPanel">
          <div class="resultPanelLabel">Jam / Song</div>
          <div class="resultMetaGrid" style="margin-top:7px">
            <div class="resultMetaItem"><small>發動干擾</small><b>${attackCount} 次</b></div>
            <div class="resultMetaItem"><small>受到干擾</small><b>${incomingJamCount} 次</b></div>
            <div class="resultMetaItem"><small>時長</small><b>${fmtTime(duration)}</b></div>
          </div>
        </div>
      </div>
    </section>

    <section class="resultSection">
      <div class="resultSectionHead"><div><div class="resultSectionTitle">👑 本局前三名</div><div class="resultSectionSub">依總分 → 準確度 → 最高 Combo 排序</div></div></div>
      <div class="resultPodium">${podiumSlot(second,'second')}${podiumSlot(first,'first')}${podiumSlot(third,'third')}</div>
    </section>

    <section class="resultSection">
      <div class="resultSectionHead"><div><div class="resultSectionTitle">👥 全部玩家最終排名</div><div class="resultSectionSub">只顯示實際收到結果的玩家，不加入任何人機成績</div></div><div style="font-size:8px;color:#697794">${arr.length} 位玩家</div></div>
      <div class="resultRankTable"><table class="fullResultTable">
        <thead><tr><th>排名</th><th>玩家</th><th>總分</th><th>準確度</th><th>最高 COMBO</th><th>Perfect</th><th>Good</th><th>Miss</th><th>干擾</th><th>狀態</th></tr></thead>
        <tbody>${arr.map((p,i)=>{const pacc=Number.isFinite(Number(p.finalAccuracy))?Math.round(Number(p.finalAccuracy))+'%':'—';const pmiss=Number(p.finalMiss)||0;const pp=Number(p.finalPerfect)||0;const pg=Number(p.finalGood)||0;const pcombo=Number(p.comboPeak||p.combo)||0;const status=p.alive===false?'離線':'完成';const you=p.id===me.id;return `<tr class="${you?'meRow ':''}${i===0?'rank1':''}"><td class="rankCell">${medal(i)}</td><td class="nameCell">${escapeHtml(p.username)}${you?'<span class="resultYouTag">你</span>':''}</td><td>${Math.floor(p.score||0).toLocaleString()}</td><td>${pacc}</td><td>${pcombo}</td><td>${pp}</td><td>${pg}</td><td>${pmiss}</td><td>${Number(p.finalPulse||p.attack||0)}</td><td>${status}</td></tr>`}).join('')}</tbody>
      </table></div>
      <div class="resultNote">排名依總分排序；同分時依準確度、最高 COMBO 排序。多人模式會在收到其他玩家的 RHYTHM_RESULT 後即時更新。</div>
    </section>

    <section class="resultSection">
      <div class="resultSectionHead"><div><div class="resultSectionTitle">🎼 本局歌曲資料</div><div class="resultSectionSub">你剛剛挑戰的譜面資訊</div></div></div>
      <div class="resultMetaGrid">
        <div class="resultMetaItem"><small>歌曲</small><b>${escapeHtml(song.name||'音樂')}</b></div>
        <div class="resultMetaItem"><small>難度</small><b>${difficulty.label} · ${difficulty.name}</b></div>
        <div class="resultMetaItem"><small>時長</small><b>${fmtTime(duration)}</b></div>
        <div class="resultMetaItem"><small>譜面音符</small><b>${noteCount.toLocaleString()} notes</b></div>
        <div class="resultMetaItem"><small>本局排名</small><b>#${rank} / ${arr.length}</b></div>
      </div>
    </section>

    <section class="resultSection">
      <div class="resultActions"><button id="replayBtn" class="resultBtn primary">↻ 再玩一次</button><button id="leaveBtn" class="resultBtn">返回 BoomRoom</button></div><div id="resultCountdown" class="resultCountdown" style="margin-top:9px">12 秒後自動返回 BoomRoom</div>
    </section>
  </section>`;
  const replay=$('replayBtn'),leave=$('leaveBtn'),count=$('resultCountdown');
  const standalone=(!window.BoomRoomSDK && window.parent===window);
  if(replay){replay.disabled=!standalone;replay.title=standalone?'':'BoomRoom 房間模式由房間控制回合';replay.onclick=()=>{if(!standalone)return;clearTimeout(window.__resultReturnTimer);autoResult=false;showMenu()}}
  const go=()=>{clearTimeout(window.__resultReturnTimer);try{if(parent!==window)parent.postMessage(JSON.stringify({action:'leaveGame'}),'*')}catch(_){ }if(window.parent===window)showMenu()};
  leave?.addEventListener('click',go);
  let remain=12;const tick=()=>{if(state!==STATE.RESULT)return;remain--;if(count)count.textContent=remain>0?(remain+' 秒後自動返回 BoomRoom'):'即將返回 BoomRoom';if(remain>0)window.__resultReturnTimer=setTimeout(tick,1000);else go()};
  window.__resultReturnTimer=setTimeout(tick,1000);
}
function sdkSend(name,payload={}){try{if(window.BoomRoomSDK?.sendGameEvent){window.BoomRoomSDK.sendGameEvent(name,payload);return true}}catch(_){}try{if(parent!==window){parent.postMessage(JSON.stringify({action:'sendGameEvent',eventName:name,payload}),'*');return true}}catch(_){}return false}
function sdkOver(reward,finalScore){
  if(autoResult)return;autoResult=true;
  const safeReward=Number(reward)||0,safeScore=Math.floor(Number(finalScore)||0);
  try{window.BoomRoomSDK?.gameOver?.(safeReward,safeScore)}catch(_){}
  try{if(parent!==window)parent.postMessage(JSON.stringify({action:'game_over',winAmount:safeReward,score:safeScore}),'*')}catch(_){}
}
async function autoBoot(){seed=hash('standalone|'+Date.now());addPlayer(me.id,me.username);await loadLibrary();setSongAndDifficulty();showMenu()}

window.addEventListener('load',()=>{if(state===STATE.LOADING)autoBoot()});
</script>
</body>
</html>
