<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070912">
<title>爆爆打雪仗</title>
<style>
:root{
  --bg:#070912;--panel:#111625;--panel2:#161c2d;--line:#2b3550;--text:#f7f8fb;--muted:#98a3ba;
  --cyan:#62e7ff;--purple:#b76cff;--green:#4ee08a;--red:#ff637a;--gold:#ffd166;
  --t:env(safe-area-inset-top,0px);--b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;user-select:none}
button{font:inherit;border:0;color:var(--text);cursor:pointer}
button:disabled{opacity:.4;cursor:default}
#app{width:100%;height:100dvh;display:flex;justify-content:center}
.shell{width:min(100%,760px);height:100%;display:flex;flex-direction:column;padding:calc(8px + var(--t)) 10px calc(8px + var(--b));gap:8px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:12px}
.center{display:flex;align-items:center;justify-content:center;text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{padding:8px 5px;background:#0b0f18;border:1px solid var(--line);border-radius:12px;text-align:center}
.stat b{display:block;font-size:15px}.stat span{font-size:9px;color:var(--muted)}
.sectionTitle{font-size:13px;font-weight:1000;margin-bottom:8px}.muted{color:var(--muted)}.tiny{font-size:10px;line-height:1.45}
.cta{width:100%;min-height:48px;border-radius:14px;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#070912;font-weight:1000;font-size:15px}
.cta.secondary{background:#192032;color:#fff;border:1px solid var(--line)}
.cta.danger{background:linear-gradient(135deg,#ff4d6d,#e63946);color:#fff}
.cta:active{transform:scale(.97)}
.notice{min-height:22px;color:#d1d6e4;font-size:11px;text-align:center}
.players{display:flex;gap:6px;overflow-x:auto}
.player{min-width:100px;padding:6px 8px;border-radius:11px;background:#0b101c;border:1px solid var(--line);font-size:10px;flex:none}
.player b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player em{display:block;font-style:normal;color:var(--muted)}
.player.me{border-color:#42537b}

#canvasWrap{position:relative;flex:1;min-height:260px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,#22304a,#070912)}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.controlGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.controlBox{background:#0b0f18;border:1px solid var(--line);border-radius:12px;padding:8px;font-size:12px}
.controlBox label{display:block;margin-bottom:4px;color:var(--muted);font-weight:bold}
.controlBox input{width:100%;accent-color:var(--cyan)}
.feedBox{max-height:75px;overflow-y:auto;font-size:11px;background:#0b0f18;border:1px solid var(--line);border-radius:10px;padding:6px}
</style>
</head>
<body>
<div id="app"><div class="shell">
  <main id="main" class="screen"></main>
</div></div>

<script>
"use strict";

const CONFIG = Object.freeze({
  ENTRY_FEE: 100,
  MIN_PLAYERS: 1,
  MAX_PLAYERS: 8
});

let ME = { id: "local_" + Math.random().toString(36).slice(2, 10), username: "本地玩家", avatar: "", joinedAt: Date.now() };
let sdkIsHost = false;
let gameRoomId = "";
let players = new Map();

let state = "LOBBY"; // LOBBY, PLAYING, RESULT
let hpP1 = 100;
let hpP2 = 100;
let angle = 45;
let power = 50;
let turn = "P1"; // P1 or P2
let feed = [];

// Canvas & Projectiles
let canvas, ctx;
let snowball = null; // { x, y, vx, vy, active, shooter }
let gameLoopId = null;

function isHost() { return sdkIsHost || players.size <= 1; }

function safeString(v, fallback, maxLen) {
  if (v === null || v === undefined) return fallback;
  const s = String(v).trim();
  return s ? s.slice(0, maxLen) : fallback;
}

function addPlayer(id, username, avatar) {
  if (!id) return;
  id = String(id);
  let p = players.get(id);
  if (!p) {
    p = { id, username: safeString(username, "玩家", 12), avatar: safeString(avatar, "", 300), hp: 100 };
    players.set(id, p);
  } else {
    p.username = safeString(username, p.username, 12);
  }
  return p;
}

function setupSDK(data) {
  if (data && data.user) {
    players.delete(ME.id);
    ME.id = String(data.user.id);
    ME.username = safeString(data.user.username, "玩家", 12);
    ME.avatar = safeString(data.user.avatar, "", 300);
    addPlayer(ME.id, ME.username, ME.avatar);
  }
  sdkIsHost = !!(data && data.isHost);
  gameRoomId = (data && data.roomId) || "";

  if (Array.isArray(data.roomPlayers)) {
    data.roomPlayers.forEach(rp => {
      if (rp && rp.id != null) addPlayer(rp.id, rp.username, rp.avatar);
    });
  }
  render();
}

window.addEventListener("message", e => {
  try {
    const d = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
    if (d && d.action === "initSDK") setupSDK(d);
    else if (d && d.action === "gameEventReceived") handleGameEvent(d.eventName, d.payload, d.userId);
  } catch (_) {}
});

window.onBoomRoomSDKReady = function() {
  if (window.BoomRoomSDK) {
    setupSDK({
      user: window.BoomRoomSDK.getUser(),
      isHost: window.BoomRoomSDK.isHost,
      roomId: window.BoomRoomSDK.roomId,
      roomPlayers: window.BoomRoomSDK.roomPlayers || []
    });
  }
};

function sendEvent(eventName, payload) {
  try {
    if (window.BoomRoomSDK && typeof window.BoomRoomSDK.sendGameEvent === "function") {
      window.BoomRoomSDK.sendGameEvent(eventName, payload);
    } else if (window.parent !== window) {
      window.parent.postMessage(JSON.stringify({ action: "sendGameEvent", eventName, payload }), "*");
    }
  } catch (_) {}
}

function handleGameEvent(eventName, payload, senderId) {
  if (eventName === "SNOWBALL_START") {
    state = "PLAYING";
    hpP1 = 100;
    hpP2 = 100;
    turn = "P1";
    snowball = null;
    feed = ["❄️ 打雪仗開始！P1 先攻。"];
    startCanvasLoop();
    render();
  } else if (eventName === "THROW_SNOWBALL") {
    throwSnowballAction(payload.shooter, payload.angle, payload.power);
  }
}

function startCanvasLoop() {
  cancelAnimationFrame(gameLoopId);
  const run = () => {
    if (state !== "PLAYING") return;
    updateGame();
    drawGame();
    gameLoopId = requestAnimationFrame(run);
  };
  gameLoopId = requestAnimationFrame(run);
}

function throwSnowballAction(shooter, ang, pow) {
  const rad = (ang * Math.PI) / 180;
  const speed = pow * 0.22;
  const startX = shooter === "P1" ? 60 : 300;
  const startY = 195;
  const vx = (shooter === "P1" ? 1 : -1) * Math.cos(rad) * speed;
  const vy = -Math.sin(rad) * speed;

  snowball = { x: startX, y: startY, vx, vy, shooter, active: true };
}

function updateGame() {
  if (!snowball || !snowball.active) return;

  snowball.x += snowball.vx;
  snowball.y += snowball.vy;
  snowball.vy += 0.28; // gravity

  // Check bounds
  if (snowball.y > 260 || snowball.x < 0 || snowball.x > 360) {
    snowball.active = false;
    feed.push("❄️ 雪球落地未命中！");
    switchTurn();
    return;
  }

  // Hit test P1 (x: 40~80, y: 170~220) and P2 (x: 280~320, y: 170~220)
  if (snowball.shooter === "P2" && snowball.x >= 40 && snowball.x <= 80 && snowball.y >= 160 && snowball.y <= 220) {
    snowball.active = false;
    hpP1 = Math.max(0, hpP1 - 30);
    feed.push("🎯 P2 命中 P1！P1 HP -30");
    checkGameOver();
  } else if (snowball.shooter === "P1" && snowball.x >= 280 && snowball.x <= 320 && snowball.y >= 160 && snowball.y <= 220) {
    snowball.active = false;
    hpP2 = Math.max(0, hpP2 - 30);
    feed.push("🎯 P1 命中 P2！P2 HP -30");
    checkGameOver();
  }
}

function switchTurn() {
  turn = turn === "P1" ? "P2" : "P1";
  feed.push(`🔄 換 ${turn === 'P1' ? 'P1 (你)' : 'P2 (AI對手)'} 投擲雪球！`);
  render();
}

function checkGameOver() {
  if (hpP1 <= 0 || hpP2 <= 0) {
    state = "RESULT";
    cancelAnimationFrame(gameLoopId);
    const winner = hpP1 <= 0 ? "P2 (AI對手)" : "P1 (你)";
    feed.push(`🏆 遊戲結束！獲勝者：${winner}`);
    try {
      if (window.BoomRoomSDK && typeof window.BoomRoomSDK.gameOver === "function") {
        window.BoomRoomSDK.gameOver(100);
      }
    } catch(_) {}
  } else {
    switchTurn();
  }
  render();
}

function drawGame() {
  if (!canvas || !ctx) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw Snow Mounds (Barriers)
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(60, 220, 24, Math.PI, 0, false);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(300, 220, 24, Math.PI, 0, false);
  ctx.fill();

  // Draw P1
  ctx.fillStyle = "#62e7ff";
  ctx.beginPath();
  ctx.arc(60, 190, 14, 0, Math.PI * 2);
  ctx.fill();

  // Draw P2
  ctx.fillStyle = "#ff637a";
  ctx.beginPath();
  ctx.arc(300, 190, 14, 0, Math.PI * 2);
  ctx.fill();

  // Draw Snowball Projectile
  if (snowball && snowball.active) {
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(snowball.x, snowball.y, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#98a3ba";
    ctx.stroke();
  }
}

function renderPlayers() {
  return [...players.values()].map(p => {
    const isMe = p.id === ME.id;
    return `<div class="player ${isMe?'me':''}">
      <b>${esc(p.username)}</b>
      <em>P1 HP: ${hpP1} | P2 HP: ${hpP2}</em>
    </div>`;
  }).join("");
}

function esc(s) { return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function runLocalDevTest() {
  players.clear();
  addPlayer(ME.id, ME.username, ME.avatar);
  sendEvent("SNOWBALL_START", {});
  handleGameEvent("SNOWBALL_START", {}, ME.id);
}

function render() {
  const main = document.getElementById("main");
  if (!main) return;

  if (state === "LOBBY") {
    main.innerHTML = `
      <section class="panel"><div class="stats"><div class="stat"><b>100</b><span>Entry 銀幣</span></div><div class="stat"><b>${players.size}</b><span>房內玩家</span></div><div class="stat"><b>100 HP</b><span>初始血量</span></div><div class="stat"><b>雪地砲擊</b><span>經典對決</span></div></div></section>
      <section class="panel"><div class="sectionTitle">房內玩家</div><div class="players">${renderPlayers()}</div></section>
      ${isHost() ? `<button id="startBtn" class="cta">👑 室長：開始《打雪仗》</button>` : '<div class="notice">等待室長開始遊戲...</div>'}
      <button id="devBtn" class="cta secondary" style="margin-top:8px;">🧪 本地測試：直接開局體驗</button>
    `;
    document.getElementById("startBtn")?.addEventListener("click", () => {
      sendEvent("SNOWBALL_START", {});
      handleGameEvent("SNOWBALL_START", {}, ME.id);
    });
    document.getElementById("devBtn")?.addEventListener("click", () => {
      runLocalDevTest();
    });
    return;
  }

  if (state === "PLAYING") {
    const isMyTurn = (turn === "P1");

    main.innerHTML = `
      <div class="stats" style="flex:none;">
        <div class="stat"><b>🔵 P1 HP: ${hpP1}</b><span>我方雪堆</span></div>
        <div class="stat"><b>VS</b><span>雪球對決</span></div>
        <div class="stat"><b>🔴 P2 HP: ${hpP2}</b><span>對手雪堆</span></div>
      </div>

      <div id="canvasWrap">
        <canvas id="gameCanvas" width="360" height="260"></canvas>
      </div>

      <div class="controlGrid">
        <div class="controlBox">
          <label>投擲角度: <span id="angleVal">${angle}</span>°</label>
          <input type="range" id="angleRange" min="15" max="75" value="${angle}">
        </div>
        <div class="controlBox">
          <label>投擲力道: <span id="powerVal">${power}</span></label>
          <input type="range" id="powerRange" min="20" max="100" value="${power}">
        </div>
      </div>

      <button id="throwBtn" class="cta" ${isMyTurn ? '' : 'disabled'}>
        ${isMyTurn ? '❄️ 丟出雪球！' : `等待 ${turn==='P1'?'P1':'P2'} 回合...`}
      </button>

      <div class="feedBox">${feed.map(f => `<div>${f}</div>`).join("")}</div>
    `;

    canvas = document.getElementById("gameCanvas");
    if (canvas) {
      ctx = canvas.getContext("2d");
    }

    document.getElementById("angleRange")?.addEventListener("input", e => {
      angle = Number(e.target.value);
      document.getElementById("angleVal").textContent = angle;
    });

    document.getElementById("powerRange")?.addEventListener("input", e => {
      power = Number(e.target.value);
      document.getElementById("powerVal").textContent = power;
    });

    document.getElementById("throwBtn")?.addEventListener("click", () => {
      if (!isMyTurn) return;
      const payload = { shooter: turn, angle, power };
      sendEvent("THROW_SNOWBALL", payload);
      handleGameEvent("THROW_SNOWBALL", payload, ME.id);
    });

    startCanvasLoop();
    return;
  }

  if (state === "RESULT") {
    main.innerHTML = `
      <section class="panel center" style="flex:1;">
        <div>
          <h2>🏆 打雪仗對決結算</h2>
          <p style="font-size:18px;font-weight:bold;color:var(--gold);margin:10px 0;">P1 HP: ${hpP1} | P2 HP: ${hpP2}</p>
          <div class="feedBox" style="max-height:120px;margin-top:12px;">${feed.map(f => `<div>${f}</div>`).join("")}</div>
          <button id="restartBtn" class="cta" style="margin-top:16px;">返回大廳</button>
        </div>
      </section>
    `;
    document.getElementById("restartBtn")?.addEventListener("click", () => {
      state = "LOBBY";
      render();
    });
  }
}

// 預設初次渲染
addPlayer(ME.id, ME.username, ME.avatar);
render();
</script>
</body>
</html>
