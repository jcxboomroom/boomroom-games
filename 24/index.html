<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#8cc7ea">
<title>爆爆打雪仗｜經典重製版 V4</title>
<style>
:root{--shadow:#4e91b6;--glow:#8ee7ff;--ink:#19304a;--blue:#3d9be9;--blue2:#dff4ff;--red:#ef6172;--red2:#ffe3e6;--snow:#f9fcff;--ice:#8fd5f7;--gold:#ffd34d;--panel:#ffffffdd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior:none;width:100%;height:100%;overflow:hidden;background:#8cc7ea;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);user-select:none}
button{font:inherit;border:0;cursor:pointer;color:var(--ink)}
#app{height:100dvh;width:100%;display:flex;justify-content:center}.shell{width:min(100%,980px);height:100%;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px}.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px}
.top{display:flex;align-items:center;justify-content:space-between;background:#ffffffdc;border:2px solid #fff;border-radius:16px;padding:7px 10px;box-shadow:0 4px 0 #5da7d0}.title{font-weight:1000;font-size:17px}.sub{font-size:10px;color:#567086}.coins{font-weight:900;background:#fff4b6;padding:5px 9px;border-radius:12px}
.panel{background:var(--panel);border:2px solid #fff;border-radius:18px;padding:14px;box-shadow:0 5px 0 #5da7d0}.center{text-align:center}.cta{width:100%;min-height:50px;border-radius:15px;background:linear-gradient(#fff36a,#ffc63e);box-shadow:0 5px 0 #d89b21;font-weight:1000;font-size:17px}.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #d89b21}.secondary{background:#e9f7ff;box-shadow:0 5px 0 #9ccbe3}.danger{background:#ff9ba6;box-shadow:0 5px 0 #d65b68;color:#fff}.notice{font-size:12px;text-align:center;color:#5a7284}
#gameWrap{position:relative;isolation:isolate;flex:1;min-height:300px;border-radius:18px;overflow:hidden;border:3px solid #fff;box-shadow:0 6px 0 #5da7d0;background:#bde6fa}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;will-change:transform}#gameWrap.hit{animation:hitShake .18s linear}@keyframes hitShake{0%,100%{transform:translate3d(0,0,0)}25%{transform:translate3d(-4px,2px,0)}50%{transform:translate3d(4px,-2px,0)}75%{transform:translate3d(-3px,1px,0)}}
.hud{position:absolute;left:10px;right:10px;top:8px;display:flex;justify-content:space-between;pointer-events:none}.hudSide{width:36%;background:#ffffffdb;border-radius:12px;padding:5px 7px;border:2px solid #fff;box-shadow:0 3px 0 #79b5d5}.hudSide.red{border-color:#ffd4d9}.hudName{font-weight:1000;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hp{height:9px;border-radius:8px;background:#d8e1e7;overflow:hidden;margin-top:3px}.hp>i{display:block;height:100%;background:linear-gradient(90deg,#48c96b,#b9e85d);width:100%;transition:width .18s}.red .hp>i{background:linear-gradient(90deg,#ff8c79,#ef526b)}.turn{position:absolute;top:54px;left:50%;transform:translateX(-50%);background:#19304ae8;color:white;padding:5px 10px;border-radius:12px;font-weight:1000;font-size:11px;pointer-events:none}
.controls{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:7px}.ctrl{min-height:48px;border-radius:14px;background:#fff;border:2px solid #d8edf7;box-shadow:0 4px 0 #8dbed4;font-weight:1000;font-size:13px}.ctrl:active{transform:translateY(2px);box-shadow:0 2px 0 #8dbed4}.throw{background:linear-gradient(#fff36a,#ffc63e);border-color:#fff}.ctrl:disabled{opacity:.45;filter:grayscale(.4)}.ctrl small{display:block;font-size:9px;color:#78909f;font-weight:700}.mobileHint{font-size:10px;text-align:center;color:#42647b}
.lobbyGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.players{display:flex;gap:6px;overflow:auto}.player{min-width:130px;background:#f7fbfd;border:2px solid #d8edf7;border-radius:12px;padding:7px}.player b{display:block}.player span{font-size:10px;color:#78909f}.rule{font-size:11px;line-height:1.7;color:#486579}
.result{flex:1;display:flex;align-items:center;justify-content:center}.result h1{font-size:34px;margin:4px}.big{font-size:52px}.feed{max-height:80px;overflow:auto;font-size:10px;text-align:left;background:#f2f8fb;border-radius:10px;padding:7px;margin-top:9px}
#powerMeter{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(310px,70%);height:16px;background:#ffffffc9;border:2px solid #fff;border-radius:12px;padding:2px;opacity:0;transition:opacity .12s;pointer-events:none}.powerFill{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#61d2ff,#ffe05a,#ff6b70)}
#toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);background:#19304af2;color:#fff;padding:9px 15px;border-radius:15px;font-weight:1000;font-size:18px;opacity:0;pointer-events:none;transition:.18s;z-index:5}#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.soundBtn{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;background:#ffffffdd;border:2px solid #fff;box-shadow:0 3px 0 #78afc8;font-size:17px;z-index:7}.windBadge{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:#ffffffc9;border:1px solid #fff;border-radius:10px;padding:3px 8px;font-size:10px;font-weight:900;color:#42647b;pointer-events:none}.combo{position:absolute;left:50%;top:115px;transform:translateX(-50%) scale(.8);opacity:0;background:#19304af0;color:#fff;padding:4px 10px;border-radius:12px;font-weight:1000;font-size:12px;transition:.15s;pointer-events:none}.combo.show{opacity:1;transform:translateX(-50%) scale(1)}@media(max-width:650px){.shell{padding:5px 6px calc(6px + env(safe-area-inset-bottom));gap:5px}.top{padding:5px 8px}.title{font-size:14px}.panel{padding:10px}.lobbyGrid{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1.4fr 1fr}.ctrl{min-height:45px;font-size:12px}.mobileHint{display:block}}
@media(min-width:651px){.mobileHint{display:none}}
</style>
</head>
<body>
<div id="app"><div class="shell">
  <div class="top"><div><div class="title">❄️ 爆爆打雪仗</div><div class="sub">經典街機重製 · 雪地對決</div></div><div id="coinBox" class="coins">💰 100</div></div>
  <main id="main" class="screen"></main>
</div></div>
<script>
'use strict';

const CONFIG=Object.freeze({ENTRY_FEE:100,MAX_PLAYERS:8,ROUND_TIME:35,ARENA_W:1200,ARENA_H:680,GRAVITY:720,MAX_SNOW:6,PLAYER_SPEED:330,NET_HZ:15,MAX_PARTICLES:260});
let ME={id:'local_'+Math.random().toString(36).slice(2,9),username:'本地玩家',avatar:''};
let players=new Map(),sdkIsHost=false,roomId='';
let state='LOBBY',role='P1',turn='P1',winner='',muted=false;
let canvas=null,ctx=null,raf=0,lastT=0;
let keys=new Set(),aimAngle=38,power=62,charging=false,chargeStart=0,roundLeft=CONFIG.ROUND_TIME,roundTimer=0;
let snowballs=[],particles=[],floating=[],logs=[];
let cameraShake=0,flash=0,toastTimer=0;
let audioCtx=null,masterGain=null,lastMoveSend=0,lastHudUpdate=0,combo=0,comboTimer=0,renderVersion=0;
let localAimTarget=aimAngle;
let perfDpr=1;
const world={w:CONFIG.ARENA_W,h:CONFIG.ARENA_H,ground:575,wind:0};
const actors={P1:{x:165,y:490,vx:0,vy:0,hp:100,maxHp:100,dir:1,onGround:true,hasSnow:1,color:'#4aa9ee',name:'P1'},P2:{x:1035,y:490,vx:0,vy:0,hp:100,maxHp:100,dir:-1,onGround:true,hasSnow:1,color:'#ef6675',name:'P2'}};
const mounds=[{x:300,y:515,w:190,h:120,hp:100,maxHp:100},{x:900,y:515,w:190,h:120,hp:100,maxHp:100},{x:600,y:545,w:105,h:65,hp:70,maxHp:70}];

function safe(v,f='玩家',n=12){if(v==null)return f;let s=String(v).trim();return s?s.slice(0,n):f}
function addPlayer(id,username,avatar){if(!id)return;id=String(id);let p=players.get(id);if(!p){players.set(id,{id,username:safe(username),avatar:avatar||''})}else p.username=safe(username,p.username)}
function setupSDK(d){if(d&&d.user){players.delete(ME.id);ME.id=String(d.user.id);ME.username=safe(d.user.username);ME.avatar=d.user.avatar||'';addPlayer(ME.id,ME.username,ME.avatar)}sdkIsHost=!!d?.isHost;roomId=d?.roomId||'';if(Array.isArray(d?.roomPlayers))d.roomPlayers.forEach(p=>p?.id!=null&&addPlayer(p.id,p.username,p.avatar));assignRoles();render()}
window.addEventListener('message',e=>{try{const d=typeof e.data==='string'?JSON.parse(e.data):e.data;if(d?.action==='initSDK')setupSDK(d);else if(d?.action==='gameEventReceived')handleEvent(d.eventName,d.payload,d.userId)}catch(_){}});
window.onBoomRoomSDKReady=function(){if(window.BoomRoomSDK)setupSDK({user:window.BoomRoomSDK.getUser(),isHost:window.BoomRoomSDK.isHost,roomId:window.BoomRoomSDK.roomId,roomPlayers:window.BoomRoomSDK.roomPlayers||[]})};
function sendEvent(name,payload){try{if(window.BoomRoomSDK?.sendGameEvent)window.BoomRoomSDK.sendGameEvent(name,payload);else if(window.parent!==window)window.parent.postMessage(JSON.stringify({action:'sendGameEvent',eventName:name,payload}),'*')}catch(_){} }
function assignRoles(){const ids=[...players.keys()].sort();role=ids[0]===ME.id?'P1':ids[1]===ME.id?'P2':'SPECTATOR';if(players.size<=1)role='P1';actors.P1.name=players.get(ids[0])?.username||'玩家 1';actors.P2.name=players.get(ids[1])?.username||'玩家 2'}
function myTurn(){return turn===role&&role!=='SPECTATOR'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function resetGame(){actors.P1.x=165;actors.P1.y=490;actors.P1.hp=100;actors.P1.hasSnow=1;actors.P1.vx=0;actors.P1.vy=0;actors.P1.dir=1;actors.P1.onGround=true;actors.P2.x=1035;actors.P2.y=490;actors.P2.hp=100;actors.P2.hasSnow=1;actors.P2.vx=0;actors.P2.vy=0;actors.P2.dir=-1;actors.P2.onGround=true;mounds[0].hp=mounds[0].maxHp;mounds[1].hp=mounds[1].maxHp;mounds[2].hp=mounds[2].maxHp;snowballs=[];particles=[];floating=[];logs=[];roundLeft=CONFIG.ROUND_TIME;roundTimer=0;turn='P1';winner='';world.wind=(Math.random()-.5)*100;cameraShake=0;flash=0;combo=0;comboTimer=0;lastMoveSend=0;lastHudUpdate=0;localAimTarget=aimAngle}
function startGame(){resetGame();state='PLAYING';addLog('❄️ 經典打雪仗開始！');render();showToast('GO!');sfx('start');vibrate([25,35,25]);}
function handleEvent(name,p,sender){if(name==='SNOWBALL_START'){if(state!=='PLAYING')startGame();return}if(name==='PLAYER_MOVE'&&p){const a=actors[p.role];if(a&&p.role!==role){a.netX=p.x;a.netY=p.y;a.dir=p.dir||a.dir}}if((name==='SNOWBALL_THROW'||name==='THROW_SNOWBALL')&&p&&sender!==ME.id){performThrow(p.role,p.angle,p.power,p.seed)}if(name==='SNOWBALL_HIT'&&p&&sender!==ME.id){applyHit(p);if(state==='PLAYING')setTimeout(()=>{if(state==='PLAYING')nextTurn()},180)}if(name==='SNOWBALL_END'&&p){endGame(p.winner||'P1')}}

function beginCharge(){if(state!=='PLAYING'||!myTurn()||charging)return;if(!actors[role].hasSnow)actors[role].hasSnow=1;charging=true;chargeStart=performance.now();const pm=document.getElementById('powerMeter');if(pm)pm.style.opacity=1;sfx('charge');vibrate(10);}
function releaseCharge(){if(!charging)return;charging=false;const elapsed=Math.min(1400,performance.now()-chargeStart);const p=30+(elapsed/1400)*70;power=Math.round(p);const pm=document.getElementById('powerMeter');if(pm)pm.style.opacity=0;throwSnowball()}
function throwSnowball(){if(state!=='PLAYING'||!myTurn())return;const a=actors[role];if(!a.hasSnow)return;a.hasSnow=0;const payload={role,angle:aimAngle,power,seed:Math.random()};sendEvent('THROW_SNOWBALL',payload);performThrow(role,aimAngle,power,payload.seed);vibrate([12,25,12])}
function performThrow(shooter,angleDeg,pow,seed){if(state!=='PLAYING')return;const a=actors[shooter];if(!a)return;const rad=angleDeg*Math.PI/180;const dir=a.dir|| (shooter==='P1'?1:-1);const speed=430+pow*6.3;const sx=a.x+dir*34,sy=a.y-55;const ball={x:sx,y:sy,vx:Math.cos(rad)*speed*dir,vy:-Math.sin(rad)*speed,shooter,life:0,spin:0,r:10,seed};snowballs.push(ball);addLog(`❄️ ${a.name} 丟出雪球！`);sfx('throw');turn=shooter==='P1'?'P2':'P1';roundTimer=0;flash=.035}
function applyHit(p){const target=actors[p.target];if(!target)return;target.hp=Math.max(0,target.hp-(p.damage||34));burst(target.x,target.y-40,24,'hit');cameraShake=12;flash=.16;sfx('hit');vibrate([20,30,20]);combo++;comboTimer=1.25;floating.push({x:target.x,y:target.y-80,text:'-'+(p.damage||34),life:1});if(target.hp<=0)endGame(p.shooter);else {target.hasSnow=1;setTimeout(()=>{if(state==='PLAYING')target.hasSnow=1},250)}}
function nextTurn(){turn=turn==='P1'?'P2':'P1';roundTimer=0;actors[turn].hasSnow=1;showToast(turn===role?'你的回合！':'對手回合');updateHUD(true);}
function endGame(w){if(state!=='PLAYING')return;winner=w;state='RESULT';cancelAnimationFrame(raf);vibrate([40,60,40,60,100]);const winName=actors[w]?.name||w;addLog(`🏆 ${winName} 獲勝！`);sfx('win');try{window.BoomRoomSDK?.gameOver?.(w===role?100:0)}catch(_){}render()}

function update(dt){if(state!=='PLAYING')return;roundTimer+=dt;if(roundTimer>=1){roundTimer=0;roundLeft--;if(roundLeft<=0){if(actors.P1.hp===actors.P2.hp)endGame('P1');else endGame(actors.P1.hp>actors.P2.hp?'P1':'P2');return}}
world.wind+=((Math.random()-.5)*25-world.wind)*dt*.15;
for(const k of keys){if(k==='ArrowLeft'||k==='a')moveLocal(-1,dt);if(k==='ArrowRight'||k==='d')moveLocal(1,dt);if(k==='ArrowUp')aimAngle=Math.min(78,aimAngle+55*dt);if(k==='ArrowDown')aimAngle=Math.max(12,aimAngle-55*dt)}
for(const k of ['P1','P2']){const a=actors[k];if(k!==role&&a.netX!=null){a.x+=(a.netX-a.x)*Math.min(1,dt*12);a.y+=(a.netY-a.y)*Math.min(1,dt*12)}}
if(role==='P1'&&players.size<=1&&turn==='P2')aiUpdate(dt);
for(const b of snowballs){b.life+=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=CONFIG.GRAVITY*dt;b.vx+=world.wind*.15*dt;b.spin+=dt*10;if(b.y>=world.ground-7){b.active=false;burst(b.x,b.y,9,'snow');sfx('land');continue}if(b.x<0||b.x>world.w||b.y<0||b.life>5){b.active=false;continue}
for(const m of mounds){if(b.x>m.x-m.w/2&&b.x<m.x+m.w/2&&b.y>m.y-m.h&&b.y<m.y+5){m.hp=Math.max(0,m.hp-24);b.active=false;burst(b.x,b.y,13,'snow');sfx('land');break}}
if(!b.active)continue;for(const key of ['P1','P2']){if(key===b.shooter)continue;const a=actors[key];const dx=b.x-a.x,dy=b.y-(a.y-42);if(Math.hypot(dx,dy)<29){b.active=false;const damage=34;applyHit({target:key,shooter:b.shooter,damage});sendEvent('SNOWBALL_HIT',{target:key,shooter:b.shooter,damage});if(state==='PLAYING')setTimeout(()=>{if(state==='PLAYING')nextTurn()},180);break}}
}
snowballs=snowballs.filter(b=>b.active);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(const f of floating){f.y-=35*dt;f.life-=dt}floating=floating.filter(f=>f.life>0);cameraShake*=Math.pow(.03,dt);flash=Math.max(0,flash-dt);toastTimer=Math.max(0,toastTimer-dt);
if(charging){power=Math.round(30+Math.min(1,(performance.now()-chargeStart)/1400)*70);const pf=document.querySelector('.powerFill');if(pf)pf.style.width=power+'%'}
if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)combo=0} if(myTurn()){const a=actors[role];a.vy+=1100*dt;a.y+=a.vy*dt;if(a.y>=490){a.y=490;a.vy=0;a.onGround=true}}
if(toastTimer<=0)document.getElementById('toast')?.classList.remove('show')
}
function moveLocal(dir,dt){if(state!=='PLAYING'||!myTurn())return;const a=actors[role];a.x=Math.max(55,Math.min(world.w-55,a.x+dir*CONFIG.PLAYER_SPEED*dt));a.dir=dir;const now=performance.now();if(now-lastMoveSend>1000/CONFIG.NET_HZ){lastMoveSend=now;sendEvent('PLAYER_MOVE',{role,x:a.x,y:a.y,dir});}}
function aiUpdate(dt){const a=actors.P2,me=actors.P1;if(turn!=='P2')return;if(a.hasSnow!==0){const targetX=me.x;const dx=Math.abs(targetX-a.x);aimAngle=Math.max(18,Math.min(72,28+dx*.018));power=Math.max(45,Math.min(100,55+dx*.035));if(Math.random()<dt*.8){performThrow('P2',aimAngle,power,Math.random());a.hasSnow=0;turn='P1'}}}

function burst(x,y,n,type){if(particles.length>CONFIG.MAX_PARTICLES-n)particles.splice(0,Math.max(0,particles.length-(CONFIG.MAX_PARTICLES-n)));for(let i=0;i<n;i++){const ang=Math.random()*Math.PI*2,sp=40+Math.random()*180;particles.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-80,g:type==='hit'?350:240,life:.35+Math.random()*.45,size:2+Math.random()*5,type})}}
function addLog(t){logs.unshift(t);logs=logs.slice(0,5)}
function showToast(t){const el=document.getElementById('toast');if(!el)return;el.textContent=t;el.classList.add('show');toastTimer=1.1}
function ensureAudio(){if(muted)return false;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();if(!masterGain){masterGain=audioCtx.createGain();masterGain.gain.value=.7;masterGain.connect(audioCtx.destination)}return true}catch(_){return false}}
function tone(freq,dur=.12,type='sine',gain=.055,slide=1){if(!ensureAudio())return;const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),now+dur);g.gain.setValueAtTime(.001,now);g.gain.linearRampToValueAtTime(gain,now+.012);g.gain.exponentialRampToValueAtTime(.001,now+dur);o.connect(g);g.connect(masterGain);o.start(now);o.stop(now+dur+.02)}
function sfx(type){if(!ensureAudio())return;const map={charge:[180,.16,'triangle',.025,1.8],throw:[320,.11,'triangle',.055,.55],land:[150,.10,'sine',.035,.7],hit:[105,.18,'square',.07,.38],win:[520,.42,'triangle',.07,1.7],start:[260,.24,'triangle',.055,2.0]};const q=map[type]||[220,.1,'sine',.04,1];tone(...q);if(type==='hit'){setTimeout(()=>tone(70,.12,'square',.045,.55),45)}if(type==='win'){setTimeout(()=>tone(780,.25,'triangle',.05,1.3),130)}}
function vibrate(pattern){try{if(navigator.vibrate)navigator.vibrate(pattern)}catch(_){} }


function resizeCanvas(){if(!canvas)return;const r=canvas.getBoundingClientRect();perfDpr=Math.min(1.5,devicePixelRatio||1);canvas.width=Math.max(1,Math.round(r.width*perfDpr));canvas.height=Math.max(1,Math.round(r.height*perfDpr))}
function sx(x){return x/world.w*canvas.clientWidth}function sy(y){return y/world.h*canvas.clientHeight}function draw(){if(!ctx)return;const now=performance.now();const w=canvas.clientWidth,h=canvas.clientHeight;ctx.setTransform(canvas.width/w,0,0,canvas.height/h,0,0);ctx.clearRect(0,0,w,h);const sh=Math.min(8,cameraShake),ox=(Math.random()-.5)*sh,oy=(Math.random()-.5)*sh;ctx.save();ctx.translate(ox,oy);drawSky(w,h,now);ctx.save();const scaleX=w/world.w,scaleY=h/world.h;ctx.scale(scaleX,scaleY);drawWorld();ctx.restore();ctx.restore();if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*2})`;ctx.fillRect(0,0,w,h)}}
function drawSky(w,h,now){const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#65b9e7');g.addColorStop(.65,'#d8f2ff');g.addColorStop(1,'#f9fdff');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.fillStyle='#ffffffaa';for(let i=0;i<5;i++){const x=((i*250+now*.008)% (w+220))-110,y=70+i*45;ctx.beginPath();ctx.arc(x,y,30,0,Math.PI*2);ctx.arc(x+35,y+5,42,0,Math.PI*2);ctx.arc(x+80,y,28,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#9ccfe5';ctx.beginPath();ctx.moveTo(0,h*.58);ctx.lineTo(w*.2,h*.35);ctx.lineTo(w*.38,h*.57);ctx.lineTo(w*.57,h*.3);ctx.lineTo(w*.8,h*.57);ctx.lineTo(w,h*.38);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();for(let i=0;i<42;i++){const x=(i*97+(now*.018*i)%w)%w,y=(i*53+now*.02*(i%4))%h*.78;ctx.fillStyle='#fff9';ctx.fillRect(x,y,2,2)}}
function drawWorld(){const W=world.w,H=world.h;drawWind();ctx.fillStyle='#f9fdff';ctx.fillRect(0,world.ground,W,H-world.ground);ctx.fillStyle='#dcecf4';ctx.fillRect(0,world.ground+25,W,H-world.ground);for(const m of mounds)drawMound(m);drawActor(actors.P1);drawActor(actors.P2);for(const b of snowballs)drawBall(b);for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*1.8);ctx.fillStyle=p.type==='hit'?'#8bd7ff':'#fff';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const f of floating){ctx.globalAlpha=Math.max(0,f.life);ctx.fillStyle='#ff4f65';ctx.font='900 24px system-ui';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y)}ctx.textAlign='left';drawAim();}
function drawWind(){ctx.save();ctx.globalAlpha=.35;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.setLineDash([12,14]);const y=125+Math.sin(performance.now()*.001)*6;ctx.beginPath();ctx.moveTo(70,y);ctx.bezierCurveTo(250,y-20,390,y+25,560,y);ctx.stroke();ctx.restore()}
function drawMound(m){const ratio=Math.max(0,m.hp/m.maxHp);ctx.save();ctx.globalAlpha=.25;ctx.fillStyle='#5486a0';ctx.beginPath();ctx.ellipse(m.x,m.y+7,m.w/2,22,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#e8f8ff';ctx.beginPath();ctx.ellipse(m.x,m.y,m.w/2*ratio+.25*m.w,Math.max(12,m.h*ratio),0,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(m.x,m.y-4,m.w/2*ratio,Math.max(8,m.h*.65*ratio),0,Math.PI,Math.PI*2);ctx.fill();ctx.restore()}
function drawActor(a){ctx.save();const moving=Math.abs(a.vx||0)>5;ctx.translate(a.x,a.y+(moving?Math.sin(performance.now()*.02)*2:0));ctx.scale(a.dir,1);ctx.fillStyle='#4f8ba8aa';ctx.beginPath();ctx.ellipse(0,12,29,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=a.color;ctx.beginPath();ctx.arc(0,-34,25,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd9bd';ctx.beginPath();ctx.arc(0,-58,20,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4,-77,22,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#19304a';ctx.beginPath();ctx.arc(-7,-60,2.5,0,Math.PI*2);ctx.arc(7,-60,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2e4d66';ctx.fillRect(-17,-88,34,7);ctx.fillRect(-10,-96,20,10);ctx.fillStyle=a.color;ctx.fillRect(-18,-29,36,35);ctx.fillStyle='#fff';ctx.fillRect(9,-28,10,7);if(a.hasSnow){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(28,-42,9,0,Math.PI*2);ctx.fill()}ctx.restore();
ctx.fillStyle='#19304a';ctx.font='900 13px system-ui';ctx.textAlign='center';ctx.fillText(a.name,a.x,a.y-92);ctx.fillStyle='#fff';ctx.fillRect(a.x-34,a.y-105,68,6);ctx.fillStyle=a.color;ctx.fillRect(a.x-34,a.y-105,68*(a.hp/a.maxHp),6);ctx.textAlign='left'}
function drawBall(b){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.spin);ctx.shadowColor='#bceeff';ctx.shadowBlur=10;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#9fc9dd';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff8';ctx.beginPath();ctx.arc(-4,-4,3,0,Math.PI*2);ctx.fill();ctx.restore();ctx.strokeStyle='#fff8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x-b.vx*.025,b.y-b.vy*.025);ctx.lineTo(b.x-b.vx*.045,b.y-b.vy*.045);ctx.stroke()}
function drawAim(){if(!myTurn()||charging)return;const a=actors[role],rad=aimAngle*Math.PI/180,dir=a.dir;ctx.strokeStyle='#ffffffaa';ctx.lineWidth=3;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(a.x+dir*30,a.y-55);ctx.lineTo(a.x+dir*(30+Math.cos(rad)*180),a.y-55-Math.sin(rad)*180);ctx.stroke();ctx.setLineDash([])}

function updateHUD(force=false){const now=performance.now();if(!force&&now-lastHudUpdate<80)return;lastHudUpdate=now;const wrap=document.getElementById('gameWrap');if(!wrap)return;const p1=wrap.querySelector('.hudSide:first-child .hp i'),p2=wrap.querySelector('.hudSide.red .hp i');if(p1)p1.style.width=actors.P1.hp+'%';if(p2)p2.style.width=actors.P2.hp+'%';const turnEl=wrap.querySelector('.turn');if(turnEl)turnEl.textContent=myTurn()?'你的回合 · '+Math.ceil(roundLeft)+'秒':`等待 ${actors[turn].name} · ${Math.ceil(roundLeft)}秒`;const throwBtn=document.getElementById('throwBtn');if(throwBtn){throwBtn.disabled=!myTurn();throwBtn.innerHTML=`❄️ ${myTurn()?'長按蓄力':'等待回合'}<small>角度 ${Math.round(aimAngle)}° · 力道 ${Math.round(power)}</small>`}const windEl=document.getElementById('windBadge');if(windEl)windEl.textContent='💨 風向 '+(world.wind>=0?'→ ':'← ')+Math.abs(Math.round(world.wind));const comboEl=document.getElementById('combo');if(comboEl){comboEl.textContent=combo>1?`🔥 連續命中 ×${combo}`:' ';comboEl.classList.toggle('show',combo>1&&comboTimer>0)}}

function startLoop(){cancelAnimationFrame(raf);lastT=performance.now();const loop=t=>{const dt=Math.min(.033,(t-lastT)/1000);lastT=t;update(dt);updateHUD();draw();raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop)}
function cancelAnimationFrameSafe(){if(raf)cancelAnimationFrame(raf);raf=0}
function bindGame(){
canvas=document.getElementById('gameCanvas');ctx=canvas?.getContext('2d');resizeCanvas();window.onresize=resizeCanvas;
const wrap=document.getElementById('gameWrap');
if(wrap){
 let activePointer=null,dragMode=null,down=false;
 const point=(e)=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*world.w/r.width,y:(e.clientY-r.top)*world.h/r.height}};
 const nearActor=(pt,a)=>Math.hypot(pt.x-a.x,pt.y-(a.y-48))<62;
 wrap.addEventListener('pointerdown',e=>{
   if(!myTurn())return;
   const pt=point(e); const a=actors[role];
   activePointer=e.pointerId; down=true; wrap.setPointerCapture(e.pointerId);
   if(nearActor(pt,a)){
     dragMode='move';
     a.dragging=true;
     a.dragOffsetX=pt.x-a.x;
     sfx('charge');
     if(navigator.vibrate)navigator.vibrate(12);
   }else dragMode='aim';
 });
 wrap.addEventListener('pointermove',e=>{
   if(!down||e.pointerId!==activePointer||!myTurn())return;
   const pt=point(e),a=actors[role];
   if(dragMode==='move'){
     a.x=Math.max(70,Math.min(world.w-70,pt.x-a.dragOffsetX));
     a.y=world.ground;
     a.dir=(pt.x>=a.x?1:a.dir);
     const now=performance.now();
     if(now-lastMoveSend>1000/CONFIG.NET_HZ){lastMoveSend=now;sendEvent('PLAYER_MOVE',{role,x:a.x,y:a.y,dir:a.dir});}
   }else{
     const dx=(pt.x-a.x)*a.dir,dy=pt.y-(a.y-55);
     if(dx>8)aimAngle=Math.max(12,Math.min(78,Math.atan2(-dy,dx)*180/Math.PI));
   }
 });
 const finish=e=>{if(e.pointerId!==activePointer)return;const a=actors[role];if(a)a.dragging=false;down=false;activePointer=null;dragMode=null;};
 wrap.addEventListener('pointerup',finish);wrap.addEventListener('pointercancel',finish);
}
const left=document.getElementById('leftBtn'),right=document.getElementById('rightBtn'),throwBtn=document.getElementById('throwBtn');
document.getElementById('soundBtn')?.addEventListener('click',()=>{muted=!muted;const b=document.getElementById('soundBtn');if(b)b.textContent=muted?'🔇':'🔊';if(!muted)sfx('start')});
hold(left,'ArrowLeft');hold(right,'ArrowRight');
throwBtn?.addEventListener('pointerdown',e=>{e.stopPropagation();beginCharge()});throwBtn?.addEventListener('pointerup',e=>{e.stopPropagation();releaseCharge()});throwBtn?.addEventListener('pointercancel',e=>{e.stopPropagation();releaseCharge()});
document.getElementById('angleUp')?.addEventListener('click',()=>aimAngle=Math.min(78,aimAngle+3));document.getElementById('angleDown')?.addEventListener('click',()=>aimAngle=Math.max(12,aimAngle-3));document.getElementById('powerUp')?.addEventListener('click',()=>power=Math.min(100,power+5));document.getElementById('powerDown')?.addEventListener('click',()=>power=Math.max(30,power-5));updateHUD(true);startLoop()}
function hold(el,key){if(!el)return;el.addEventListener('pointerdown',()=>keys.add(key));el.addEventListener('pointerup',()=>keys.delete(key));el.addEventListener('pointercancel',()=>keys.delete(key));el.addEventListener('pointerleave',()=>keys.delete(key))}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','d'].includes(e.key)){e.preventDefault();keys.add(e.key)}if(e.code==='Space'){e.preventDefault();beginCharge()}});window.addEventListener('keyup',e=>{keys.delete(e.key);if(e.code==='Space')releaseCharge()});

function renderLobby(){document.getElementById('main').innerHTML=`<section class="panel center"><div style="font-size:55px">⛄</div><h2 style="margin:4px 0">經典打雪仗</h2><div class="rule">拖住人物移動到想要的位置，再瞄準、蓄力、投擲；也可以躲在雪堆後面。<br>最後把對手的 HP 打光就贏！</div></section><section class="panel"><b>👥 房內玩家 ${players.size}</b><div class="players" style="margin-top:7px">${[...players.values()].map(p=>`<div class="player"><b>${esc(p.username)}</b><span>${p.id===ME.id?'你':'玩家'}</span></div>`).join('')}</div></section><div class="lobbyGrid"><button id="startBtn" class="cta">❄️ 開始打雪仗</button><button id="testBtn" class="cta secondary">🧪 單人練習</button></div><section class="panel"><b>🎮 操作方式</b><div class="rule">PC：← → 移動、↑ ↓ 瞄準、長按 Space 蓄力、放開投擲。<br>手機／滑鼠：直接拖住人物移動位置；在人物外拖曳可調整瞄準；長按「雪球」蓄力，放開投擲。</div></section>`;document.getElementById('startBtn').onclick=()=>{sendEvent('SNOWBALL_START',{});startGame()};document.getElementById('testBtn').onclick=()=>{players.clear();addPlayer(ME.id,ME.username,ME.avatar);role='P1';startGame()}}
function renderGame(){const pf=power;document.getElementById('main').innerHTML=`<div id="gameWrap"><canvas id="gameCanvas"></canvas><div class="hud"><div class="hudSide"><div class="hudName">🔵 ${esc(actors.P1.name)}</div><div class="hp"><i style="width:${actors.P1.hp}%"></i></div></div><div class="hudSide red"><div class="hudName">🔴 ${esc(actors.P2.name)}</div><div class="hp"><i style="width:${actors.P2.hp}%"></i></div></div></div><div class="turn">${myTurn()?'你的回合 · '+Math.ceil(roundLeft)+'秒':`等待 ${actors[turn].name} · ${Math.ceil(roundLeft)}秒`}</div><div id="windBadge" class="windBadge">💨 風向 → 0</div><div id="combo" class="combo"> </div><button id="soundBtn" class="soundBtn">🔊</button><div id="toast"></div><div id="powerMeter"><div class="powerFill" style="width:${pf}%"></div></div></div><div class="controls"><button id="leftBtn" class="ctrl">◀<small>移動</small></button><button id="throwBtn" class="ctrl throw">❄️ ${myTurn()?'長按蓄力':'等待回合'}<small>角度 ${Math.round(aimAngle)}° · 力道 ${Math.round(power)}</small></button><button id="rightBtn" class="ctrl">▶<small>移動</small></button></div><div class="controls"><button id="angleDown" class="ctrl">↙<small>低角度</small></button><button id="powerDown" class="ctrl">💨 力道 -5</button><button id="angleUp" class="ctrl">↗<small>高角度</small></button></div><div class="mobileHint">🖱️／👆 拖住人物移動 · 拖曳其他位置瞄準 · 長按雪球蓄力後放開投擲</div>`;bindGame()}
function renderResult(){const win=winner===role;document.getElementById('main').innerHTML=`<section class="panel result center"><div><div class="big">${win?'🏆':'⛄'}</div><h1>${win?'你贏了！':'再來一局！'}</h1><p>${esc(actors[winner]?.name||winner)} 獲勝</p><div class="feed">${logs.map(esc).join('<br>')}</div><button id="again" class="cta" style="margin-top:12px">❄️ 再玩一次</button></div></section>`;document.getElementById('again').onclick=()=>{state='LOBBY';render()}}
function render(){document.getElementById('coinBox').textContent='💰 100';if(state==='LOBBY')renderLobby();else if(state==='PLAYING')renderGame();else renderResult()}

addPlayer(ME.id,ME.username,ME.avatar);assignRoles();render();
</script>
