<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Piggy Run</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --bg-color: #0a0a12;
            --panel-bg: rgba(15, 15, 25, 0.9);
            --neon-red: #ff2a2a;
            --neon-green: #00ff66;
            --neon-blue: #00e5ff;
            --neon-yellow: #ffea00;
            --neon-purple: #b700ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Orbitron', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            padding: 10px;
            z-index: 1;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: var(--panel-bg);
            border: 1px solid var(--neon-purple);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(183, 0, 255, 0.3);
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--neon-blue); }
        .username { font-size: 14px; font-weight: bold; color: var(--neon-blue); }
        .host-badge { font-size: 10px; background: var(--neon-yellow); color: #000; padding: 2px 5px; border-radius: 3px; display: none; margin-left: 5px;}
        
        .status-area { text-align: right; }
        .phase-text { font-size: 12px; color: var(--neon-purple); font-weight: bold; }
        .timer-text { font-size: 24px; color: var(--neon-yellow); font-weight: 900; text-shadow: 0 0 10px var(--neon-yellow); }

        /* Track Area */
        .track-container {
            flex: 1;
            display: flex;
            background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0) 10%, rgba(0,0,0,0) 90%, rgba(255,255,255,0.1) 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .finish-line {
            position: absolute;
            top: 10%;
            width: 100%;
            height: 4px;
            background: repeating-linear-gradient(90deg, #fff, #fff 10px, #000 10px, #000 20px);
            z-index: 0;
            box-shadow: 0 0 10px #fff;
        }

        .lane {
            flex: 1;
            border-right: 1px dashed rgba(255, 255, 255, 0.1);
            position: relative;
            display: flex;
            justify-content: center;
        }
        .lane:last-child { border-right: none; }

        .pig {
            position: absolute;
            bottom: 5%; /* 5% to 90% */
            width: 40px;
            height: 40px;
            background: #222;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            transition: bottom 0.1s linear;
            z-index: 2;
            box-shadow: 0 0 15px currentColor;
            border: 2px solid currentColor;
        }

        .pig-effect {
            position: absolute;
            top: -25px;
            font-size: 20px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        /* Bottom Panel */
        .control-panel {
            height: 120px;
            flex-shrink: 0;
            display: flex;
            gap: 5px;
        }

        .action-btn {
            flex: 1;
            background: var(--panel-bg);
            border: 2px solid;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            position: relative;
            overflow: hidden;
        }
        .action-btn:active { transform: scale(0.95); }
        .action-btn.disabled { filter: grayscale(1); pointer-events: none; opacity: 0.5; }

        .btn-title { font-size: 14px; font-weight: bold; margin-bottom: 2px; }
        .btn-odds { font-size: 12px; margin-bottom: 5px; }
        .btn-mybet { font-size: 14px; font-weight: bold; color: #fff; }
        
        /* Dynamic Button States */
        .btn-state-bet .btn-action-text { display: none; }
        .btn-state-item .btn-odds, .btn-state-item .btn-mybet { display: none; }
        .btn-state-item .btn-action-text { display: block; font-size: 14px; font-weight: bold; margin-top: 5px; }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        .hidden { display: none !important; }

        .glowing-btn {
            background: transparent;
            border: 2px solid var(--neon-purple);
            color: var(--neon-purple);
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--neon-purple) inset, 0 0 15px var(--neon-purple);
            text-transform: uppercase;
        }

        .leaderboard-title { font-size: 30px; color: var(--neon-yellow); margin-bottom: 20px; text-shadow: 0 0 10px var(--neon-yellow); }
        .lb-entry { display: flex; justify-content: space-between; width: 100%; max-width: 300px; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .lb-entry.me { color: var(--neon-blue); font-weight: bold; }

        /* Floating Text */
        .floating-text {
            position: absolute;
            font-weight: bold;
            font-size: 18px;
            pointer-events: none;
            animation: floatUp 1s forwards;
            z-index: 50;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.5); }
        }

        /* Action Feed */
        .feed {
            position: absolute;
            top: 80px;
            left: 10px;
            width: 200px;
            height: 100px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 2px;
            z-index: 10;
        }
        .feed-item {
            font-size: 10px;
            background: rgba(0,0,0,0.5);
            padding: 2px 5px;
            border-radius: 3px;
            color: #fff;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

    <div id="start-overlay" class="overlay">
        <h1 style="color: var(--neon-blue); text-shadow: 0 0 20px var(--neon-blue); font-size: 36px;">CYBER PIGGY</h1>
        <h2 style="color: var(--neon-purple); margin-bottom: 40px; letter-spacing: 5px;">RUN</h2>
        <button class="glowing-btn" id="btn-join">Enter Arena</button>
    </div>

    <div id="leaderboard-overlay" class="overlay hidden">
        <div class="leaderboard-title">RACE RESULTS</div>
        <div id="winner-announce" style="font-size: 20px; margin-bottom: 10px; color: #fff;"></div>
        <div id="lb-content" style="width: 100%; display: flex; flex-direction: column; align-items: center; margin-bottom: 30px;"></div>
        <div id="my-result" style="font-size: 24px; margin-bottom: 20px;"></div>
    </div>

    <div id="game-container">
        <header>
            <div class="user-info">
                <img id="my-avatar" class="avatar" src="" alt="avatar">
                <div>
                    <div id="my-username" class="username">Player</div>
                    <span id="host-badge" class="host-badge">HOST</span>
                </div>
            </div>
            <div class="status-area">
                <div id="phase-text" class="phase-text">WAITING</div>
                <div id="timer-text" class="timer-text">--</div>
            </div>
        </header>

        <div class="feed" id="feed"></div>

        <div class="track-container">
            <div class="finish-line"></div>
            <!-- Lanes and Pigs -->
            <div class="lane">
                <div class="pig" id="pig-0" style="color: var(--neon-red);">
                    🐷<div class="pig-effect" id="effect-0"></div>
                </div>
            </div>
            <div class="lane">
                <div class="pig" id="pig-1" style="color: var(--neon-green);">
                    🐷<div class="pig-effect" id="effect-1"></div>
                </div>
            </div>
            <div class="lane">
                <div class="pig" id="pig-2" style="color: var(--neon-blue);">
                    🐷<div class="pig-effect" id="effect-2"></div>
                </div>
            </div>
            <div class="lane">
                <div class="pig" id="pig-3" style="color: var(--neon-yellow);">
                    🐷<div class="pig-effect" id="effect-3"></div>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <!-- Buttons generated by JS -->
        </div>
    </div>

    <script>
        // ==========================================
        // 1. BOOMROOM SDK MOCK (For local testing)
        // ==========================================
        if (typeof window.BoomRoomSDK === 'undefined') {
            window.BoomRoomSDK = {
                getUser: () => ({ 
                    id: 'u_' + Math.floor(Math.random()*10000), 
                    username: 'Cyber' + Math.floor(Math.random()*100), 
                    avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=' + Math.random() 
                }),
                requestPurchase: (itemId, cost) => {
                    setTimeout(() => {
                        if(window.onPurchaseSuccess) window.onPurchaseSuccess(itemId);
                    }, 200);
                },
                gameOver: (winAmount) => console.log("[SDK] Game Over. Win:", winAmount),
                sendGameEvent: (eventName, payload) => {
                    const msg = JSON.stringify({
                        action: "gameEventReceived",
                        eventName: eventName,
                        userId: window.BoomRoomSDK.getUser().id,
                        payload: payload
                    });
                    window.postMessage(msg, "*");
                }
            };
        }

        // ==========================================
        // 2. GAME CONFIG & STATE
        // ==========================================
        const user = window.BoomRoomSDK.getUser();
        let isHost = false;
        let hostId = null;
        
        let gameState = "WAITING"; // WAITING, BETTING, RACING, RESULT
        let phaseTime = 0;
        
        const BET_COST = 100;
        const BOOST_COST = 10;
        const TRAP_COST = 20;

        const PIG_CONFIG = [
            { id: 0, name: "穩健紅", color: "var(--neon-red)", odds: 2.0, baseSpeed: [0.6, 1.2] },
            { id: 1, name: "神經綠", color: "var(--neon-green)", odds: 3.0, baseSpeed: [0.2, 1.8] },
            { id: 2, name: "重裝藍", color: "var(--neon-blue)", odds: 5.0, baseSpeed: [0.4, 1.0] },
            { id: 3, name: "奇蹟黃", color: "var(--neon-yellow)", odds: 10.0, baseSpeed: [0.1, 0.7] }
        ];

        // Host Physics State
        let hostPigs = [
            { y: 5, speedMod: 1, effectTimer: 0 },
            { y: 5, speedMod: 1, effectTimer: 0 },
            { y: 5, speedMod: 1, effectTimer: 0 },
            { y: 5, speedMod: 1, effectTimer: 0 }
        ];

        // Client State
        let myBets = [0, 0, 0, 0];
        let roundLeaderboard = [];
        let pendingAction = null; // { type: 'bet'|'boost'|'trap', pigId: 0 }

        // ==========================================
        // 3. AUDIO SYSTEM
        // ==========================================
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playTone(freq, type, duration, vol=0.1) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }
        const Sounds = {
            bet: () => { playTone(600, 'sine', 0.1); playTone(800, 'sine', 0.15); },
            boost: () => playTone(1200, 'square', 0.2, 0.05),
            trap: () => playTone(200, 'sawtooth', 0.3, 0.1),
            win: () => { playTone(400, 'square', 0.1); setTimeout(()=>playTone(600, 'square', 0.2), 100); },
            lose: () => playTone(150, 'sawtooth', 0.5),
            tick: () => playTone(1000, 'sine', 0.05, 0.02)
        };

        // ==========================================
        // 4. INITIALIZATION & UI SETUP
        // ==========================================
        document.getElementById('my-username').innerText = user.username;
        document.getElementById('my-avatar').src = user.avatar;

        const panel = document.querySelector('.control-panel');
        PIG_CONFIG.forEach(pig => {
            const btn = document.createElement('div');
            btn.className = 'action-btn disabled btn-state-bet';
            btn.style.borderColor = pig.color;
            btn.id = `btn-${pig.id}`;
            btn.innerHTML = `
                <div class="btn-title" style="color:${pig.color}">${pig.name}</div>
                <div class="btn-odds">${pig.odds}x</div>
                <div class="btn-mybet" id="mybet-${pig.id}">0</div>
                <div class="btn-action-text" id="action-text-${pig.id}"></div>
            `;
            btn.onclick = () => handleBtnClick(pig.id);
            panel.appendChild(btn);
        });

        document.getElementById('btn-join').addEventListener('click', () => {
            initAudio();
            document.getElementById('start-overlay').classList.add('hidden');
            window.BoomRoomSDK.sendGameEvent("PLAYER_JOIN", { username: user.username });
            
            // Host election
            setTimeout(() => { if (!hostId) becomeHost(); }, 2000);
        });

        function becomeHost() {
            isHost = true;
            hostId = user.id;
            document.getElementById('host-badge').style.display = 'inline-block';
            showFeed("SYSTEM", "You are the Host");
            startHostLoop();
        }

        // ==========================================
        // 5. HOST LOGIC (Game Loop & Physics)
        // ==========================================
        async function startHostLoop() {
            while (isHost) {
                // 1. BETTING PHASE (10s)
                setGameState("BETTING", 10);
                hostPigs = hostPigs.map(p => ({ y: 5, speedMod: 1, effectTimer: 0 }));
                for(let i=10; i>0; i--) {
                    broadcastSync(i);
                    await sleep(1000);
                }

                // 2. RACING PHASE (Max 15s)
                setGameState("RACING", 15);
                let raceFinished = false;
                let winnerId = -1;
                let raceTicks = 150; // 15s * 10 ticks/sec

                while(!raceFinished && raceTicks > 0) {
                    // Physics Update (10 times per second)
                    hostPigs.forEach((p, idx) => {
                        // Base random speed
                        let speed = randFloat(PIG_CONFIG[idx].baseSpeed[0], PIG_CONFIG[idx].baseSpeed[1]);
                        
                        // Yellow Pig Miracle Jump (2% chance per tick)
                        if(idx === 3 && Math.random() < 0.02) speed += 5;

                        // Apply Item Effects
                        if(p.effectTimer > 0) {
                            p.effectTimer--;
                            speed *= p.speedMod;
                        }

                        p.y += speed;
                        if(p.y >= 90 && !raceFinished) {
                            p.y = 90;
                            raceFinished = true;
                            winnerId = idx;
                        }
                    });

                    broadcastSync(Math.ceil(raceTicks/10));
                    raceTicks--;
                    await sleep(100);
                }

                // 3. RESULT PHASE (5s)
                setGameState("RESULT", 5);
                window.BoomRoomSDK.sendGameEvent("RACE_FINISH", { winner: winnerId });
                for(let i=5; i>0; i--) {
                    broadcastSync(i);
                    await sleep(1000);
                }
                
                roundLeaderboard = [];
            }
        }

        function broadcastSync(time) {
            window.BoomRoomSDK.sendGameEvent("HOST_SYNC", {
                hostId: user.id,
                state: gameState,
                time: time,
                pigs: hostPigs.map(p => p.y)
            });
        }

        // ==========================================
        // 6. CLIENT LOGIC & SYNC
        // ==========================================
        window.addEventListener("message", (e) => {
            try {
                const data = JSON.parse(e.data);
                if (data.action === "gameEventReceived") {
                    handleEvent(data.eventName, data.payload, data.userId);
                }
            } catch(err) {}
        });

        function handleEvent(eventName, payload, senderId) {
            switch(eventName) {
                case "HOST_SYNC":
                    if (!hostId || hostId === senderId) {
                        hostId = senderId;
                        syncClientState(payload);
                    }
                    break;
                case "ITEM_USED":
                    handleRemoteItem(payload);
                    break;
                case "RACE_FINISH":
                    handleRaceFinish(payload.winner);
                    break;
                case "PLAYER_RESULT":
                    roundLeaderboard.push(payload);
                    updateLeaderboardUI();
                    break;
            }
        }

        function syncClientState(payload) {
            if (gameState !== payload.state) {
                gameState = payload.state;
                triggerStateChange(gameState);
            }
            
            phaseTime = payload.time;
            document.getElementById('timer-text').innerText = phaseTime;
            if(gameState === "BETTING" && phaseTime <= 3) Sounds.tick();

            // Update Pig Positions
            payload.pigs.forEach((y, idx) => {
                document.getElementById(`pig-${idx}`).style.bottom = `${y}%`;
            });
        }

        function triggerStateChange(state) {
            document.getElementById('phase-text').innerText = state;
            const btns = document.querySelectorAll('.action-btn');

            if (state === "BETTING") {
                document.getElementById('leaderboard-overlay').classList.add('hidden');
                myBets = [0, 0, 0, 0];
                btns.forEach((btn, idx) => {
                    btn.classList.remove('disabled', 'btn-state-item');
                    btn.classList.add('btn-state-bet');
                    document.getElementById(`mybet-${idx}`).innerText = '0';
                });
            } 
            else if (state === "RACING") {
                btns.forEach((btn, idx) => {
                    btn.classList.remove('btn-state-bet');
                    btn.classList.add('btn-state-item');
                    const actText = document.getElementById(`action-text-${idx}`);
                    if (myBets[idx] > 0) {
                        actText.innerText = `⚡ BOOST (${BOOST_COST})`;
                        actText.style.color = 'var(--neon-yellow)';
                    } else {
                        actText.innerText = `🍌 TRAP (${TRAP_COST})`;
                        actText.style.color = 'var(--neon-red)';
                    }
                });
            }
            else if (state === "RESULT") {
                btns.forEach(btn => btn.classList.add('disabled'));
            }
        }

        // ==========================================
        // 7. INTERACTION & ECONOMY
        // ==========================================
        function handleBtnClick(pigId) {
            if (gameState === "BETTING") {
                pendingAction = { type: 'bet', pigId: pigId, cost: BET_COST };
                window.BoomRoomSDK.requestPurchase(`bet_${pigId}_${Date.now()}`, BET_COST);
            } 
            else if (gameState === "RACING") {
                const isMyPig = myBets[pigId] > 0;
                const type = isMyPig ? 'boost' : 'trap';
                const cost = isMyPig ? BOOST_COST : TRAP_COST;
                pendingAction = { type: type, pigId: pigId, cost: cost };
                window.BoomRoomSDK.requestPurchase(`item_${type}_${pigId}_${Date.now()}`, cost);
            }
        }

        window.onPurchaseSuccess = function(itemId) {
            if (!pendingAction) return;
            const { type, pigId, cost } = pendingAction;
            
            if (type === 'bet') {
                myBets[pigId] += cost;
                document.getElementById(`mybet-${pigId}`).innerText = myBets[pigId];
                Sounds.bet();
                showFloatingText(document.getElementById(`btn-${pigId}`), `-100`, '#fff');
                showFeed(user.username, `bet on ${PIG_CONFIG[pigId].name}`);
            } 
            else {
                // Broadcast item usage
                window.BoomRoomSDK.sendGameEvent("ITEM_USED", {
                    username: user.username,
                    type: type,
                    pigId: pigId
                });
                showFloatingText(document.getElementById(`btn-${pigId}`), `-${cost}`, type==='boost'?'var(--neon-yellow)':'var(--neon-red)');
            }
            pendingAction = null;
        };

        function handleRemoteItem(payload) {
            const { type, pigId, username } = payload;
            
            // Visual Effect
            const effectEl = document.getElementById(`effect-${pigId}`);
            effectEl.innerText = type === 'boost' ? '⚡' : '🍌';
            effectEl.style.opacity = 1;
            setTimeout(() => effectEl.style.opacity = 0, 500);

            if(type === 'boost') Sounds.boost();
            else Sounds.trap();

            showFeed(username, `used ${type} on ${PIG_CONFIG[pigId].name}`);

            // Host applies physics
            if (isHost) {
                const pig = hostPigs[pigId];
                pig.effectTimer = 5; // 0.5 seconds (5 ticks)
                if (type === 'boost') pig.speedMod = 3.0;
                if (type === 'trap') {
                    // Blue pig resistance
                    pig.speedMod = (pigId === 2) ? 0.5 : 0.1; 
                }
            }
        }

        // ==========================================
        // 8. RESULT & LEADERBOARD
        // ==========================================
        function handleRaceFinish(winnerId) {
            if (winnerId === -1) return; // Tie or timeout
            
            const winPig = PIG_CONFIG[winnerId];
            let winAmount = myBets[winnerId] * winPig.odds;
            
            window.BoomRoomSDK.gameOver(winAmount);
            
            window.BoomRoomSDK.sendGameEvent("PLAYER_RESULT", {
                username: user.username,
                win: winAmount
            });

            setTimeout(() => {
                document.getElementById('winner-announce').innerText = `${winPig.name} WINS! (${winPig.odds}x)`;
                document.getElementById('winner-announce').style.color = winPig.color;
                
                const resText = document.getElementById('my-result');
                if(winAmount > 0) {
                    resText.innerText = `YOU WON ${winAmount} COINS!`;
                    resText.style.color = 'var(--neon-green)';
                    Sounds.win();
                } else {
                    resText.innerText = `NO LUCK THIS ROUND`;
                    resText.style.color = '#aaa';
                    if(myBets.some(b=>b>0)) Sounds.lose();
                }
                
                document.getElementById('leaderboard-overlay').classList.remove('hidden');
            }, 1000);
        }

        function updateLeaderboardUI() {
            const container = document.getElementById('lb-content');
            container.innerHTML = '';
            const sorted = [...roundLeaderboard].sort((a,b) => b.win - a.win).slice(0, 5);
            
            sorted.forEach(entry => {
                const div = document.createElement('div');
                div.className = `lb-entry ${entry.username === user.username ? 'me' : ''}`;
                div.innerHTML = `<span>${entry.username}</span> <span>+${entry.win}</span>`;
                container.appendChild(div);
            });
        }

        // ==========================================
        // 9. UTILS & EFFECTS
        // ==========================================
        function randFloat(min, max) { return Math.random() * (max - min) + min; }
        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
        function setGameState(s, t) { gameState = s; phaseTime = t; }

        function showFloatingText(element, text, color) {
            const rect = element.getBoundingClientRect();
            const div = document.createElement('div');
            div.className = 'floating-text';
            div.innerText = text;
            div.style.color = color;
            div.style.left = (rect.left + rect.width/2 - 10) + 'px';
            div.style.top = (rect.top) + 'px';
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 1000);
        }

        const feedEl = document.getElementById('feed');
        function showFeed(name, action) {
            const div = document.createElement('div');
            div.className = 'feed-item';
            div.innerHTML = `<span style="color:var(--neon-blue)">${name}</span> ${action}`;
            feedEl.appendChild(div);
            if(feedEl.children.length > 5) feedEl.removeChild(feedEl.firstChild);
            setTimeout(() => { if(div.parentNode) div.remove(); }, 3000);
        }

    </script>
</body>
</html>
